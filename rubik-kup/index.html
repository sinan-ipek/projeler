<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rubik Küp</title><script>(async()=>{const opts={cache:"no-store"};const files=["payload-v13-a1.txt?v=20260922-1320","payload-v13-a2.txt?v=20260922-1320","payload-v13-b.txt?v=20260922-1320","payload-v13-c.txt?v=20260922-1320"];const rs=await Promise.all(files.map(f=>fetch(f,opts)));if(rs.some(r=>!r.ok))throw new Error("Uygulama verisi yüklenemedi");const s=(await Promise.all(rs.map(r=>r.text()))).join("");const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML="<pre>Yükleme hatası: "+e+"</pre>"})</script>
