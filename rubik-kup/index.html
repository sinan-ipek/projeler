<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rubik Küp</title><script>(async()=>{const [a,b]=await Promise.all([fetch("payload-v11-a.txt"),fetch("payload-v11-b.txt")]);if(!a.ok||!b.ok)throw new Error("Uygulama verisi yüklenemedi");const s=(await a.text())+(await b.text());const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML="<pre>Yükleme hatası: "+e+"</pre>"})</script>
