<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beyaz Tahta VR — Ortak Motor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:white}
#boardApp{position:fixed;inset:0;width:100%;height:100%;border:0;background:white}
#vrBtn{position:fixed;right:14px;bottom:16px;z-index:10;background:#3f6bcf;color:#fff;border:2px solid #172f71;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 14px #0003}
#vrBtn:disabled{opacity:.6;cursor:wait}
#hint{position:fixed;z-index:11;bottom:78px;left:50%;transform:translateX(-50%);background:#fffffff2;border:1px solid #ccd5e0;border-radius:8px;padding:9px;max-width:85vw;font-size:12px;display:none;color:#26354e}
#vrLayer{position:fixed;inset:0;z-index:20;background:#fff;display:none}
#version{position:fixed;bottom:4px;left:8px;z-index:12;font-size:10px;color:#88929e;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js"}}</script>
</head>
<body>
<iframe id="boardApp" title="Özgün Beyaz Tahta"></iframe>
<button id="vrBtn" type="button" disabled>VR hazırlanıyor…</button>
<div id="hint"></div><div id="vrLayer"></div>
<div id="version">v1.1.0 · Sınırsız XY; uzamsal 3D gizmo; sol el menüsü; ışınla düzenleme</div>
<script type="module" src="./vr-engine.js"></script>
