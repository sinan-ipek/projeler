 activeGizmo=handle;highlightGizmo();
 c.edit={mode:handle.mode,axis:handle.axis,precision,startPos:new THREE.Vector3(),lastPos:new THREE.Vector3(),startRot:selected.mesh.rotation.clone(),startScale:selected.mesh.scale.clone(),startPoints:selected.type==='line'?selected.points.map(p=>p.clone()):null,startWorld:selected.mesh.position.clone(),startQuaternion:selected.mesh.quaternion.clone()};
 c.controller.getWorldPosition(c.edit.startPos);c.edit.lastPos.copy(c.edit.startPos);
}
function editFrame(c){if(!c.edit||!selected)return;const e=c.edit,pos=new THREE.Vector3();c.controller.getWorldPosition(pos);
 const delta=pos.clone().sub(e.startPos);const axis=axisVector[e.axis],speed=e.precision?.18:1;
 const effectiveAxis=localGizmo&&selected.type==='shape'?axis.clone().applyQuaternion(e.startQuaternion):axis;
 const projected=delta.dot(effectiveAxis)*speed;
 if(selected.type==='line'){
  if(e.mode==='move'){if(selectedEnd>=0){changePoint(selected,selectedEnd,e.startPoints[selectedEnd].clone().addScaledVector(axis,projected));}else{
   selected.points[0].copy(e.startPoints[0].clone().addScaledVector(axis,projected));
   selected.points[1].copy(e.startPoints[1].clone().addScaledVector(axis,projected));applyLine(selected);refreshEnds();}
  }else if(e.mode==='scale'){const anchor=selectedEnd===0?selected.points[1]:selected.points[0];const end=selectedEnd===0?0:1;
   const orig=e.startPoints[end].clone().sub(e.startPoints[1-end]);const factor=Math.max(.06,1+projected*3);changePoint(selected,end,e.startPoints[1-end].clone().add(orig.multiplyScalar(factor)));
  }else if(e.mode==='rotate'){const center=e.startPoints[0].clone().add(e.startPoints[1]).multiplyScalar(.5);const q=new THREE.Quaternion().setFromAxisAngle(axis,delta.length()*(e.precision?.35:2.5)*Math.sign(delta.x+delta.y+0.0001));selected.points.forEach((p,i)=>p.copy(e.startPoints[i]).sub(center).applyQuaternion(q).add(center));applyLine(selected);refreshEnds();}
 }else{
  if(e.mode==='move'){selected.mesh.position.copy(e.startWorld).addScaledVector(effectiveAxis,projected);}
  else if(e.mode==='scale'){selected.mesh.scale.copy(e.startScale);selected.mesh.scale[e.axis]=Math.max(.04,e.startScale[e.axis]*(1+projected*3.4));}
  else if(e.mode==='rotate'){selected.mesh.rotation.copy(e.startRot);const angle=(delta.x+delta.y+delta.z)*(e.precision?.35:2.2);if(localGizmo)selected.mesh.rotateOnAxis(axis,angle);else selected.mesh.rotateOnWorldAxis(axis,angle);}
 }
 syncGizmo();
}

function highlightGizmo(){
 for(const mesh of gizmoTargets){const g=mesh.userData.gizmo;if(!g)continue;
  const active=activeGizmo?.mode===g.mode&&activeGizmo?.axis===g.axis;
  mesh.material.color.setHex(active?0xffd02a:({x:0xe44b56,y:0x38b26e,z:0x3c88e7}[g.axis]));
  mesh.material.opacity=active?.78:(g.mode==='scale'?1:.12);
  mesh.scale.setScalar(active?1.18:1);
 }
}
function rightSelect(c){
 const ray=worldRay(c);
 if(surfacePanel?.visible){const s=pick(ray,surfaceButtons);if(s){surfaceAction(s.object.userData.surfaceAction);return;}}
 if(menuVisible&&menu?.visible){const ui=pick(ray,menuTargets);if(ui){action(ui.object.userData.menuAction);return;}}
 const gh=pick(ray,gizmoTargets);
 const eh=pick(ray,endpointTargets);
 const oh=pick(ray,items.map(it=>it.mesh));
 const hits=[gh,eh,oh].filter(Boolean).sort((a,b)=>a.distance-b.distance);
 const target=hits[0];
 if(target?.object.userData.gizmo){startEdit(c,true,target);return;}
 if(target?.object.userData.isHandle){setSelection(target.object.userData.owner,target.object.userData.end);return;}
 if(target?.object.userData.isItem){setSelection(target.object.userData.owner,-1);return;}
 if(drawMode){onLeftSelect(c);return;}
 setSelection(null);
}
function updateRayVisuals(){
 for(const c of ctrl){if(!c.hand)continue;
 const ray=worldRay(c);
 const all=[...items.map(it=>it.mesh),...endpointTargets,...gizmoTargets];
 if(menuVisible&&menu?.visible)all.push(...menuTargets);
 if(surfacePanel?.visible)all.push(...surfaceButtons);
 const hit=pick(ray,all);
 const planeHit=new THREE.Vector3();
 let nearest=hit?.distance??2.1;
 const groundHit=ray.intersectPlane(new THREE.Plane(vecY,0),planeHit);
 if(groundHit){const gd=groundHit.distanceTo(ray.origin);if(gd>0&&gd<nearest)nearest=gd;}
 nearest=Math.min(5,Math.max(.08,nearest));
 c.rayMesh.scale.z=nearest;
 c.rayDot.position.copy(ray.at(nearest,new THREE.Vector3()));
 c.rayDot.visible=renderer.xr.isPresenting;
 c.rayMesh.visible=renderer.xr.isPresenting;
 }
}
function updateOutline(item){
 if(item.outline){item.mesh.remove(item.outline);item.outline.material.dispose();item.outline=null;}
 if(!outlineEnabled||item.type!=='shape')return;
 const shell=new THREE.Mesh(item.mesh.geometry,new THREE.ShaderMaterial({
 uniforms:{outlineColor:{value:new THREE.Color(0x20242c)},thickness:{value:.012}},
 vertexShader:'uniform float thickness; void main(){vec3 displaced=position+normal*thickness;gl_Position=projectionMatrix*modelViewMatrix*vec4(displaced,1.0);}',
 fragmentShader:'uniform vec3 outlineColor;void main(){gl_FragColor=vec4(outlineColor,1.0);}',
 side:THREE.BackSide,depthTest:true,depthWrite:false
 }));
 shell.raycast=()=>{};
 item.mesh.add(shell);item.outline=shell;
}
let arSupported=false;
navigator.xr?.isSessionSupported?.('immersive-ar').then(v=>{arSupported=!!v;}).catch(()=>{arSupported=false;});
async function togglePassthrough(){
 if(!arSupported){document.querySelector('#status').textContent='Passthrough (immersive-ar) bu tarayıcıda desteklenmiyor.';return;}
 try{
  const old=renderer.xr.getSession();
  if(old)await old.end();
  // XR oturumu için gerçek kullanıcı etkileşimi gereklidir; bazı tarayıcılar geçişte yeni onay ister.
  const next=await navigator.xr.requestSession(passThrough?'immersive-vr':'immersive-ar',{optionalFeatures:['local-floor']});
  await renderer.xr.setSession(next);
  passThrough=!passThrough;scene.background=passThrough?null:new THREE.Color(0xffffff);
  floor.visible=!passThrough;grid.visible=!passThrough;
 }catch(err){document.querySelector('#status').textContent='XR mod geçişi başarısız: '+(err?.message||err);passThrough=false;scene.background=new THREE.Color(0xffffff);floor.visible=true;grid.visible=true;}
}
const presets=['sin(x)*cos(z)','0.4*sin(2*x)+0.3*cos(2*z)','0.6*exp(-(x*x+z*z))','0.5*sin(sqrt(x*x+z*z)*4)'];
let presetIndex=0;
const formulaKeys=['x','z','+','-','*','/','^','(',')','sin(','cos(','sqrt(','0','1','2','3','.','C','⌫'];
function evaluateFormula(expr,x,z){
 // Whitelisted, non-eval expression tokenizer + shunting-yard interpreter.
 const tokens=(expr.replace(/\s+/g,'').match(/(?:\d+(?:\.\d*)?|\.\d+)|(?:sin|cos|tan|sqrt|abs|exp|log)|(?:x|z|pi)|[()+\-*/^]/g)||[]);
 if(!tokens.length||tokens.join('')!==expr.replace(/\s+/g,''))throw Error('Invalid formula');
 const output=[],ops=[],priority={'+':1,'-':1,'*':2,'/':2,'^':4,'neg':3};
 let last='start';
 for(const tok of tokens){
  if(/^(\d|\.)/.test(tok)||tok==='x'||tok==='z'||tok==='pi'){output.push(tok);last='value';}
  else if(/^(sin|cos|tan|sqrt|abs|exp|log)$/.test(tok)){ops.push(tok);last='func';}
  else if(tok==='('){ops.push(tok);last='open';}
  else if(tok===')'){while(ops.length&&ops.at(-1)!=='(')output.push(ops.pop());if(ops.pop()!=='(')throw Error('Parenthesis');if(ops.length&&/^(sin|cos|tan|sqrt|abs|exp|log)$/.test(ops.at(-1)))output.push(ops.pop());last='value';}
  else{const op=tok==='-'&&(last==='start'||last==='open'||last==='op')?'neg':tok;
   if(op!=='neg'&&!priority[op])throw Error('Operation');
   while(ops.length&&priority[ops.at(-1)]&&((op==='^'||op==='neg')?priority[ops.at(-1)]>priority[op]:priority[ops.at(-1)]>=priority[op]))output.push(ops.pop());
   ops.push(op);last='op';}
 }
 while(ops.length){const op=ops.pop();if(op==='(')throw Error('Parenthesis');output.push(op);}
 const stack=[];
 for(const tok of output){
  if(tok==='x'||tok==='z'||tok==='pi')stack.push(tok==='x'?x:tok==='z'?z:Math.PI);
  else if(/^(\d|\.)/.test(tok))stack.push(Number(tok));
  else if(tok==='neg')stack.push(-stack.pop());
  else if(/^(sin|cos|tan|sqrt|abs|exp|log)$/.test(tok)){const val=stack.pop();stack.push(Math[tok](val));}
  else{const b=stack.pop(),a=stack.pop();if(!Number.isFinite(a)||!Number.isFinite(b))throw Error('Missing value');stack.push(tok==='+'?a+b:tok==='-'?a-b:tok==='*'?a*b:tok==='/'?a/b:Math.pow(a,b));}
 }
 if(stack.length!==1||!Number.isFinite(stack[0]))throw Error('NaN');return Math.max(-4,Math.min(4,stack[0]));
}
function createSurface(){
 try{
 const n=36,verts=[],indices=[];
 for(let j=0;j<=n;j++)for(let i=0;i<=n;i++){
 const x=-1.5+3*i/n,z=-1.5+3*j/n,y=evaluateFormula(formulaText,x,z);
 verts.push(x,y,z);
 }
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){
 const a=j*(n+1)+i,b=a+1,d=(j+1)*(n+1)+i,e=d+1;
 indices.push(a,d,b,b,d,e);
 }
 const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geom.setIndex(indices);geom.computeVertexNormals();
 const mesh=new THREE.Mesh(geom,new THREE.MeshStandardMaterial({side:THREE.DoubleSide}));
 mesh.position.copy(spawnPos());
 const item={type:'shape',kind:'surface',mesh,color:0x55a6f1,opacity:1,materialKind:'standard',outline:null,formula:formulaText};
 mesh.userData.isItem=true;mesh.userData.owner=item;scene.add(mesh);items.push(item);history.push({action:'add',item});buildMaterial(item);setSelection(item);
 document.querySelector('#status').textContent='Surface: y = '+formulaText;
 }catch(e){document.querySelector('#status').textContent='Formül hatası: '+e.message;}
}
let menuBeforeFormula=true;
function clearSurfacePanel(restore=true){
 if(surfacePanel){surfacePanel.parent?.remove(surfacePanel);disposeGraph(surfacePanel);surfacePanel=null;surfaceButtons=[];}
 if(restore){menuVisible=menuBeforeFormula;if(menu)menu.visible=menuVisible;}
}
function toggleSurfacePanel(force=false){
 if(surfacePanel&&!force){clearSurfacePanel(true);return;}
 if(!surfacePanel)menuBeforeFormula=menuVisible;
 clearSurfacePanel(false);menuVisible=false;if(menu)menu.visible=false;
 surfacePanel=new THREE.Group();surfaceButtons=[];
 const bg=new THREE.Mesh(new THREE.PlaneGeometry(.78,.77),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,depthTest:false}));bg.position.z=-.009;surfacePanel.add(bg);
 function key(str,act,x,y,w=.165){
 const panel=new THREE.Mesh(new THREE.PlaneGeometry(w,.078),new THREE.MeshBasicMaterial({color:act==='close'?0xf4c1bf:0xeaf0f6,side:THREE.DoubleSide,depthTest:false}));
 panel.position.set(x,y,.011);panel.userData.surfaceAction=act;surfacePanel.add(panel);surfaceButtons.push(panel);
 uiLabel(panel,str,0,0,w*.94,.063,'#152438',str.length>5?32:56);
 }
 uiLabel(surfacePanel,'y = '+formulaText.slice(0,33),-.075,.329,.59,.068,'#17283e',30);
 key('X','close',.324,.329,.09);
 key('◀','prev',-.265,.227,.19);key('▶','next',0,.227,.19);key('Grafik','graph',.265,.227,.19);
 formulaKeys.forEach((txt,i)=>key(txt,'key:'+txt,-.267+(i%4)*.178,.103-Math.floor(i/4)*.104,.159));
 const left=controllerOf('left');
 if(left){left.add(surfacePanel);surfacePanel.position.set(.025,.11,-.42);surfacePanel.rotation.set(-.33,0,0);surfacePanel.scale.setScalar(.75);}
 else{const {p,d}=viewerPose();surfacePanel.position.copy(p).addScaledVector(d,.64);scene.add(surfacePanel);surfacePanel.scale.setScalar(.72);}
}

function surfaceAction(act){
 if(act==='close'){clearSurfacePanel(true);return;}
 if(act==='graph'){createSurface();clearSurfacePanel(true);return;}
 if(act==='prev'||act==='next'){presetIndex=(presetIndex+(act==='next'?1:presets.length-1))%presets.length;formulaText=presets[presetIndex];}
 if(act.startsWith('key:')){const ch=act.slice(4);formulaText=ch==='C'?'':ch==='⌫'?formulaText.slice(0,-1):(formulaText+ch).slice(0,80);}
 toggleSurfacePanel(true);
}

for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);scene.add(controller);
 const rayMesh=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:i?0x507dba:0x3f586c,transparent:true,opacity:.85}));rayMesh.scale.z=1;controller.add(rayMesh);
 const rayDot=new THREE.Mesh(new THREE.SphereGeometry(.008,12,8),new THREE.MeshBasicMaterial({color:0xffd12e,depthTest:false}));scene.add(rayDot);
 const c=ctrl[i];Object.assign(c,{controller,hand:'',tmpQuat:new THREE.Quaternion(),lineStart:null,preview:null,edit:null,rayMesh,rayDot});
 controller.addEventListener('connected',ev=>{c.inputSource=ev.data;c.hand=ev.data.handedness|| (i===0?'left':'right');rayMesh.material.color.set(c.hand==='left'?0x2681d6:0x444e5c);if(c.hand==='left')attachMenu();});
 controller.addEventListener('selectstart',()=>{if(c.hand==='right')rightSelect(c);});
 controller.addEventListener('disconnected',()=>{c.inputSource=null;});
 controller.addEventListener('selectend',()=>{if(c.hand==='right'){if(c.lineStart)endLeftSelect(c);if(c.edit?.precision)c.edit=null;}});
 controller.addEventListener('squeezestart',()=>{if(c.hand==='right'&&activeGizmo){const hit=gizmoTargets.find(x=>x.userData.gizmo?.axis===activeGizmo.axis&&x.userData.gizmo?.mode===activeGizmo.mode);if(hit)startEdit(c,false,{object:hit});}});
 controller.addEventListener('squeezeend',()=>{if(c.hand==='right'&&c.edit&&!c.edit.precision)c.edit=null;});
}
makeMenu();
let priorMenuPressed=false;
function pollMenuKey(){
 const left=ctrl.find(x=>x.hand==='left');
 const buttons=left?.inputSource?.gamepad?.buttons;
 // Quest OS often reserves system-menu. Left X (button 4) is used where available.
 const pressed=!!buttons?.[4]?.pressed;
 if(pressed&&!priorMenuPressed){if(surfacePanel)clearSurfacePanel(true);else{menuVisible=!menuVisible;if(menu)menu.visible=menuVisible;}}
 priorMenuPressed=pressed;
}
function animate(){pollMenuKey();for(const c of ctrl){if(c.hand==='right'&&c.preview&&c.lineStart){movePreview(c.preview,c.lineStart,snapPoint(castSurface(worldRay(c))));}if(c.hand==='right'&&c.edit)editFrame(c);}
 syncGizmo();updateRayVisuals();renderer.render(scene,camera);}
renderer.setAnimationLoop(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
