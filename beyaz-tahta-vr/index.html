function worldRay(c){const o=new THREE.Vector3(),dir=new THREE.Vector3(0,0,-1);c.controller.getWorldPosition(o);c.controller.getWorldQuaternion(c.tmpQuat);dir.applyQuaternion(c.tmpQuat).normalize();return new THREE.Ray(o,dir);}

function flatPointWorld(item,index){

function rebuildFlatHandles(){
 clearFlatHandles();if(!selected?.flat)return;
 const item=selected,n=item.vertices.length,step=item.kind==='circle2d'?4:1;
 item.mesh.updateWorldMatrix(true,false);
 const colorCorner=0xf0aa35,colorEdge=0x4eb6ae;
 for(let i=0;i<n;i+=step){
  const next=(i+step)%n;
  for(const kind of ['vertex','edge']){
   const world=kind==='vertex'?flatPointWorld(item,i):
    flatPointWorld(item,i).lerp(flatPointWorld(item,next),.5);
   const handle=new THREE.Mesh(
    kind==='vertex'?new THREE.BoxGeometry(.029,.029,.029):new THREE.SphereGeometry(.018,12,8),
    new THREE.MeshBasicMaterial({color:kind==='vertex'?colorCorner:colorEdge,depthTest:false}));
   handle.position.copy(world);handle.userData.flatHandle={item,kind,index:i,next};
   handle.renderOrder=18;scene.add(handle);flatTargets.push(handle);
  }
 }
 // The small blue diamond moves the whole 2D object, separately from uniform scaling.
 const body=new THREE.Mesh(new THREE.OctahedronGeometry(.024),new THREE.MeshBasicMaterial({color:0x3a86dd,depthTest:false}));
 body.position.copy(item.mesh.localToWorld(new THREE.Vector3(0,-.065,.018)));

 body.renderOrder=19;scene.add(body);flatTargets.push(body);
}
function syncFlatHandles(){

  const meta=h.userData.flatHandle;
  const pos=meta.kind==='body'?selected.mesh.localToWorld(new THREE.Vector3(0,-.065,.018)):flatPointWorld(selected,meta.index);
  if(meta.kind==='edge')pos.lerp(flatPointWorld(selected,meta.next),.5);

function startFlatEdit(c,meta,precise){

function updateFlatEdit(c){
 const e=c.edit,item=e.flatMeta.item,p=new THREE.Vector3();c.controller.getWorldPosition(p);
 const delta=p.sub(e.startPos);
 if(e.flatMeta.kind==='body'){
  item.mesh.position.copy(e.startWorldMeshPosition).addScaledVector(delta,e.precision?.18:1);
  syncFlatHandles();syncGizmo();return;

 // Controller movement in world space -> the local XY plane of the shape.

  const blend=Array(n).fill(0),step=4;
  const center=e.flatMeta.kind==='vertex'?index:(index+step/2)%n;
  for(let i=0;i<n;i++){

  item.vertices[index].add(delta);
  if(e.flatMeta.kind==='edge')item.vertices[next].add(delta);
 }
 rebuildFlatGeometry(item);
}

function syncGizmo(){if(!gizmo||!selected)return;const center=selected.type==='line'&&selectedEnd>=0?selected.points[selectedEnd]:selected.mesh.position;gizmo.position.copy(center);

function snapPoint(p,exceptItem=null,exceptEnd=-1){if(!snapEnabled)return p.clone();let best=p,dist=.075;for(const it of items){if(it.type!=='line')continue;for(let n=0;n<2;n++){if(it===exceptItem&&n===exceptEnd)continue;const d=p.distanceTo(it.points[n]);if(d<dist){dist=d;best=it.points[n];}}}return best.clone();}

function highlightGizmo(){

function pickGizmo(ray){
 if(!gizmo)return null;
 const direct=pick(ray,gizmoTargets);
 if(direct)return direct;
 let best=null,bestScore=Infinity;
 for(const obj of gizmoTargets){
  const meta=obj.userData.gizmo;
  const p=obj.getWorldPosition(new THREE.Vector3());
  const t=p.clone().sub(ray.origin).dot(ray.direction);
  if(t<=.02)continue;
  let point=ray.at(t,new THREE.Vector3());
  let dist=point.distanceTo(p);
  if(meta.mode==='rotate'){
   const normal=axisVector[meta.axis].clone().applyQuaternion(gizmo.quaternion);
   const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(normal,gizmo.position);
   point=ray.intersectPlane(plane,new THREE.Vector3());
   if(!point)continue;
   dist=Math.abs(point.distanceTo(gizmo.position)-.28*gizmo.scale.x);
  }
  const limit=(meta.mode==='rotate'?.075:meta.mode==='uniformScale'?.11:.095)*gizmo.scale.x;
  if(dist<limit&&dist<bestScore){bestScore=dist;best={object:obj,point:point.clone(),distance:point.distanceTo(ray.origin)};}
 }
 return best;
}

function pickFlatHandle(ray){
 if(!selected?.flat)return null;
 const direct=pick(ray,flatTargets);
 if(direct)return direct;
 let best=null,bestError=Infinity;
 for(const handle of flatTargets){
  const point=handle.position;
  const t=point.clone().sub(ray.origin).dot(ray.direction);
  if(t<=0||t>8)continue;
  const aim=ray.at(t,new THREE.Vector3());
  const error=aim.distanceTo(point);
  // Slight assistance, but keep vertex and edge targets distinguishable.
  if(error<.043&&error<bestError){
   bestError=error;best={object:handle,point:point.clone(),distance:t};
  }
 }

}
function rayTarget(ray){

}

const sharpOutlineKinds=new Set(['box','tetra','octa','dodeca','plane','hexPyramid','hexCylinder']);
function buildClosedOutline(geom,offset=.009){
 // Offset every triangular face along its own normal, bridge adjacent
 // offsets with quads, and triangulate gaps at shared vertices.
 const g=geom.index?geom.toNonIndexed():geom;
 const attr=g.getAttribute('position');
 const bounds=new THREE.Box3().setFromBufferAttribute(attr);
 const origin=bounds.getCenter(new THREE.Vector3());
 const edges=new Map(),vertices=new Map(),out=[];
 const key=p=>[p.x,p.y,p.z].map(n=>Math.round(n*100000)).join(':');
 const v=(ix)=>new THREE.Vector3().fromBufferAttribute(attr,ix);
 const add=(a,b,d,ref)=>{
  const normal=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(d,a));
  const center=a.clone().add(b).add(d).multiplyScalar(1/3);
  if(ref&&normal.dot(center.clone().sub(ref))<0)[b,d]=[d,b];
  for(const p of [a,b,d])out.push(p.x,p.y,p.z);
 };
 let validTriangles=0;
 for(let idx=0;idx<attr.count;idx+=3){
  const pts=[v(idx),v(idx+1),v(idx+2)];
  let normal=pts[1].clone().sub(pts[0]).cross(pts[2].clone().sub(pts[0]));
  if(normal.lengthSq()<1e-14)continue;
  normal.normalize();
  const mid=pts[0].clone().add(pts[1]).add(pts[2]).multiplyScalar(1/3);
  if(normal.dot(mid.clone().sub(origin))<0){[pts[1],pts[2]]=[pts[2],pts[1]];normal.negate();}
  const lifted=pts.map(p=>p.clone().addScaledVector(normal,offset));
  add(lifted[0],lifted[1],lifted[2],origin);validTriangles++;
  for(let k=0;k<3;k++){
   const id=key(pts[k]);
   if(!vertices.has(id))vertices.set(id,{point:pts[k].clone(),offsets:new Map()});
   vertices.get(id).offsets.set(key(lifted[k]),lifted[k].clone());
   const m=(k+1)%3,a=key(pts[k]),b=key(pts[m]),edgeKey=a<b?a+'|'+b:b+'|'+a;
   const edge={normal:normal.clone(),a:a<b?lifted[k]:lifted[m],b:a<b?lifted[m]:lifted[k]};
   if(!edges.has(edgeKey))edges.set(edgeKey,[]);
   edges.get(edgeKey).push(edge);
  }
 }
 if(!validTriangles){if(g!==geom)g.dispose();return geom.clone();}
 for(const occurrences of edges.values()){
  // Triangles inside one flat face have identical normal offsets.
  const distinct=[];
  for(const e of occurrences)if(!distinct.some(o=>o.normal.dot(e.normal)>.999999))distinct.push(e);
  if(distinct.length===2){
   const a=distinct[0],b=distinct[1];
   add(a.a,a.b,b.b,origin);
   add(a.a,b.b,b.a,origin);
  } else if(distinct.length>2){
   for(let k=0;k<distinct.length;k++){
    const a=distinct[k],b=distinct[(k+1)%distinct.length];
    add(a.a,a.b,b.b,origin);add(a.a,b.b,b.a,origin);
   }
  }
 }
 for(const entry of vertices.values()){
  const points=[...entry.offsets.values()];
  if(points.length<3)continue;
  const center=points.reduce((a,p)=>a.add(p),new THREE.Vector3()).multiplyScalar(1/points.length);
  const outward=center.clone().sub(origin).normalize();
  let u=new THREE.Vector3(1,0,0);
  if(Math.abs(u.dot(outward))>.9)u.set(0,1,0);
  u.addScaledVector(outward,-u.dot(outward)).normalize();
  const w=new THREE.Vector3().crossVectors(outward,u).normalize();
  points.sort((a,b)=>{
   const ap=a.clone().sub(center),bp=b.clone().sub(center);
   return Math.atan2(ap.dot(w),ap.dot(u))-Math.atan2(bp.dot(w),bp.dot(u));
  });
  for(let k=0;k<points.length;k++)add(center,points[k],points[(k+1)%points.length],origin);
 }
 const shell=new THREE.BufferGeometry();
 shell.setAttribute('position',new THREE.Float32BufferAttribute(out,3));
 shell.computeVertexNormals();
 if(g!==geom)g.dispose();
 return shell;
}
function updateOutline(item){

  item.mesh.remove(item.outline);

const presets=['sin(x)*cos(z)','0.4*sin(2*x)+0.3*cos(2*z)','0.6*exp(-(x*x+z*z))','0.5*sin(sqrt(x*x+z*z)*4)'];

const formulaKeys=['x','z','+','-','*','/','^','(',')','sin(','cos(','sqrt(','0','1','2','3','.','C','⌫'];
function evaluateFormula(expr,x,z){
 // Whitelisted, non-eval expression tokenizer + shunting-yard interpreter.
 const tokens=(expr.replace(/\s+/g,'').match(/(?:\d+(?:\.\d*)?|\.\d+)|(?:sin|cos|tan|sqrt|abs|exp|log)|(?:x|z|pi)|[()+\-*/^]/g)||[]);

  if(/^(\d|\.)/.test(tok)||tok==='x'||tok==='z'||tok==='pi'){output.push(tok);last='value';}
  else if(/^(sin|cos|tan|sqrt|abs|exp|log)$/.test(tok)){ops.push(tok);last='func';}
  else if(tok==='('){ops.push(tok);last='open';}
  else if(tok===')'){while(ops.length&&ops.at(-1)!=='(')output.push(ops.pop());if(ops.pop()!=='(')throw Error('Parenthesis');if(ops.length&&/^(sin|cos|tan|sqrt|abs|exp|log)$/.test(ops.at(-1)))output.push(ops.pop());last='value';}
  else{const op=tok==='-'&&(last==='start'||last==='open'||last==='op')?'neg':tok;
   if(op!=='neg'&&!priority[op])throw Error('Operation');
   while(ops.length&&priority[ops.at(-1)]&&((op==='^'||op==='neg')?priority[ops.at(-1)]>priority[op]:priority[ops.at(-1)]>=priority[op]))output.push(ops.pop());
   ops.push(op);last='op';}
 }
 while(ops.length){const op=ops.pop();if(op==='(')throw Error('Parenthesis');output.push(op);}
 const stack=[];
 for(const tok of output){
  if(tok==='x'||tok==='z'||tok==='pi')stack.push(tok==='x'?x:tok==='z'?z:Math.PI);
  else if(/^(\d|\.)/.test(tok))stack.push(Number(tok));
  else if(tok==='neg')stack.push(-stack.pop());
  else if(/^(sin|cos|tan|sqrt|abs|exp|log)$/.test(tok)){const val=stack.pop();stack.push(Math[tok](val));}
  else{const b=stack.pop(),a=stack.pop();if(!Number.isFinite(a)||!Number.isFinite(b))throw Error('Missing value');stack.push(tok==='+'?a+b:tok==='-'?a-b:tok==='*'?a*b:tok==='/'?a/b:Math.pow(a,b));}
 }
 if(stack.length!==1||!Number.isFinite(stack[0]))throw Error('NaN');return Math.max(-4,Math.min(4,stack[0]));
}
function createSurface(){
 try{
 const n=36,verts=[],indices=[];
 for(let j=0;j<=n;j++)for(let i=0;i<=n;i++){
 const x=-1.5+3*i/n,z=-1.5+3*j/n,y=evaluateFormula(formulaText,x,z);
 verts.push(x,y,z);
 }
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){
 const a=j*(n+1)+i,b=a+1,d=(j+1)*(n+1)+i,e=d+1;
 indices.push(a,d,b,b,d,e);
 }
 const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geom.setIndex(indices);geom.computeVertexNormals();
 const mesh=new THREE.Mesh(geom,new THREE.MeshStandardMaterial({side:THREE.DoubleSide}));
 mesh.position.copy(spawnPos());
 const item={type:'shape',kind:'surface',mesh,color:0x55a6f1,opacity:1,materialKind:'standard',outline:null,formula:formulaText};
 mesh.userData.isItem=true;mesh.userData.owner=item;scene.add(mesh);items.push(item);history.push({action:'add',item});buildMaterial(item);setSelection(item);
 document.querySelector('#status').textContent='Surface: y = '+formulaText;
 }catch(e){document.querySelector('#status').textContent='Formül hatası: '+e.message;}
}
let menuBeforeFormula=true;
function clearSurfacePanel(restore=true){
 if(surfacePanel){surfacePanel.parent?.remove(surfacePanel);disposeGraph(surfacePanel);surfacePanel=null;surfaceButtons=[];}
 if(restore){menuVisible=menuBeforeFormula;if(menu)menu.visible=menuVisible;}
}
function toggleSurfacePanel(force=false){
 if(surfacePanel&&!force){clearSurfacePanel(true);return;}
 if(!surfacePanel)menuBeforeFormula=menuVisible;
 clearSurfacePanel(false);menuVisible=false;if(menu)menu.visible=false;
 surfacePanel=new THREE.Group();surfaceButtons=[];
 const bg=new THREE.Mesh(new THREE.PlaneGeometry(.78,.77),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,depthTest:false}));bg.position.z=-.009;surfacePanel.add(bg);
 function key(str,act,x,y,w=.165){
 const panel=new THREE.Mesh(new THREE.PlaneGeometry(w,.078),new THREE.MeshBasicMaterial({color:act==='close'?0xf4c1bf:0xeaf0f6,side:THREE.DoubleSide,depthTest:false}));
 panel.position.set(x,y,.011);panel.userData.surfaceAction=act;surfacePanel.add(panel);surfaceButtons.push(panel);
 uiLabel(panel,str,0,0,w*.94,.063,'#152438',str.length>5?32:56);
 }
 uiLabel(surfacePanel,'y = '+formulaText.slice(0,33),-.075,.329,.59,.068,'#17283e',30);
 key('X','close',.324,.329,.09);
 key('◀','prev',-.265,.227,.19);key('▶','next',0,.227,.19);key('Grafik','graph',.265,.227,.19);
 formulaKeys.forEach((txt,i)=>key(txt,'key:'+txt,-.267+(i%4)*.178,.103-Math.floor(i/4)*.104,.159));
 const left=controllerOf('left');
 if(left){left.add(surfacePanel);surfacePanel.position.set(.025,.11,-.42);surfacePanel.rotation.set(-.33,0,0);surfacePanel.scale.setScalar(.75);}
 else{const {p,d}=viewerPose();surfacePanel.position.copy(p).addScaledVector(d,.64);scene.add(surfacePanel);surfacePanel.scale.setScalar(.72);}
}

function surfaceAction(act){
 if(act==='close'){clearSurfacePanel(true);return;}
 if(act==='graph'){createSurface();clearSurfacePanel(true);return;}
 if(act==='prev'||act==='next'){presetIndex=(presetIndex+(act==='next'?1:presets.length-1))%presets.length;formulaText=presets[presetIndex];}
 if(act.startsWith('key:')){const ch=act.slice(4);formulaText=ch==='C'?'':ch==='⌫'?formulaText.slice(0,-1):(formulaText+ch).slice(0,80);}
 toggleSurfacePanel(true);
}

for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);scene.add(controller);
 const rayMesh=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:i?0x507dba:0x3f586c,transparent:true,opacity:.85}));rayMesh.scale.z=1;controller.add(rayMesh);
 const rayDot=new THREE.Mesh(new THREE.SphereGeometry(.008,12,8),new THREE.MeshBasicMaterial({color:0xffd12e,depthTest:false}));scene.add(rayDot);
 const c=ctrl[i];Object.assign(c,{controller,hand:'',tmpQuat:new THREE.Quaternion(),lineStart:null,preview:null,edit:null,rayMesh,rayDot});
 controller.addEventListener('connected',ev=>{c.inputSource=ev.data;c.hand=ev.data.handedness|| (i===0?'left':'right');rayMesh.material.color.set(c.hand==='left'?0x2681d6:0x444e5c);if(c.hand==='left')attachMenu();});
 controller.addEventListener('selectstart',()=>{if(c.hand==='right')rightSelect(c);});
 controller.addEventListener('disconnected',()=>{c.inputSource=null;});
 controller.addEventListener('selectend',()=>{if(c.hand==='right'){if(c.lineStart)endLeftSelect(c);if(c.edit?.precision)c.edit=null;}});
 controller.addEventListener('squeezestart',()=>{if(c.hand!=='right')return;const target=rayTarget(worldRay(c));if(target?.object.userData.flatHandle)startFlatEdit(c,target.object.userData.flatHandle,false);
 else if(target?.object.userData.gizmo)startEdit(c,false,target);else if(activeGizmo){const hit=gizmoTargets.find(x=>x.userData.gizmo?.axis===activeGizmo.axis&&x.userData.gizmo?.mode===activeGizmo.mode);if(hit)startEdit(c,false,{object:hit});}});
 controller.addEventListener('squeezeend',()=>{if(c.hand==='right'&&c.edit&&!c.edit.precision)c.edit=null;});
}
makeMenu();
let priorMenuPressed=false;
function pollMenuKey(){
 const left=ctrl.find(x=>x.hand==='left');
 const buttons=left?.inputSource?.gamepad?.buttons;
 // Quest OS often reserves system-menu. Left X (button 4) is used where available.
 const pressed=!!buttons?.[4]?.pressed;
 if(pressed&&!priorMenuPressed){if(surfacePanel)clearSurfacePanel(true);else{menuVisible=!menuVisible;if(menu)menu.visible=menuVisible;}}
 priorMenuPressed=pressed;
}
function animate(){pollMenuKey();for(const c of ctrl){if(c.hand==='right'&&c.preview&&c.lineStart){movePreview(c.preview,c.lineStart,snapPoint(castSurface(worldRay(c))));}if(c.hand==='right'&&c.edit)editFrame(c);}
 syncGizmo();syncFlatHandles();updateRayVisuals();renderer.render(scene,camera);}
renderer.setAnimationLoop(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
