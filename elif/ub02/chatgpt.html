<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Übungsblatt 2 • ChatGPT</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#202c43;font:18px system-ui,Arial,sans-serif;min-height:100vh}.bar{height:83px;background:white;border-bottom:1px solid #d8e1ef;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:15px}.bar strong{font-size:clamp(15px,2vw,24px)}.actions{display:flex;align-items:center;gap:10px}.actions button,.actions select{font:inherit;border:1px solid #d4ddeb;border-radius:12px;background:white;padding:11px 14px;cursor:pointer}.actions .home{width:48px;height:48px;padding:7px;background:#ffd94b;border:1px solid #e8bd23}.home svg{width:29px;height:29px;fill:#101010}.layout{max-width:1450px;margin:22px auto 35px;padding:0 18px;display:grid;grid-template-columns:minmax(280px,.9fr) minmax(320px,1.5fr);gap:18px}.panel{background:#fff;border:1px solid #dbe4ef;border-radius:24px;padding:26px;box-shadow:0 13px 36px #1b345512}.eyebrow{color:#2b70e2;font-weight:800;font-size:14px;letter-spacing:.06em}h1{font-size:clamp(26px,2.5vw,40px);line-height:1.16;margin:14px 0}p{line-height:1.65}#formula{margin:22px 0;padding:18px;background:#f3f7ff;border:1px solid #d7e3fa;border-radius:16px;font-size:clamp(17px,1.5vw,22px);overflow-wrap:anywhere}#formula .eq{white-space:normal}#stage{min-height:350px;display:flex;flex-direction:column;gap:12px}.step{border:1px solid #d5e2f2;border-radius:16px;padding:16px 18px;background:#fafdff;animation:appear .45s ease}.step h3{color:#2c6ee8;font-size:16px;margin:0 0 8px}.step p{margin:0}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}.footer button{padding:13px 17px;border:1px solid #d7dfed;background:white;border-radius:12px;font:inherit;cursor:pointer}.footer button.main{background:#3276ef;color:#fff;border-color:#3276ef;font-weight:800}.muted{font-size:14px;color:#667690}#version{position:fixed;left:8px;bottom:4px;font-size:11px;color:#8c97a8}.plot{max-width:500px;margin:10px auto}.drawcurve{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.2s ease forwards}.truthbox{overflow-x:auto;max-width:100%;margin-top:14px}table{border-collapse:collapse;font:14px system-ui}td,th{padding:6px 8px;border:1px solid #d5dfee;text-align:center}th{background:#e7efff}.highlight{background:#fff0ac;font-weight:bold}.meter{height:7px;border-radius:9px;background:#e6eefa;overflow:hidden;margin-top:20px}.meter div{height:100%;background:#3677ef;width:0;transition:width .25s}@keyframes appear{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{padding:18px}.bar{padding:10px}body{font-size:16px}.footer{flex-wrap:wrap}}</style></head><body>
<header class="bar"><strong id="heading"></strong><div class="actions"><button class="home" onclick="location.href='../../index.html'" title="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 2 1 11h3v11h7v-7h3v7h7V11h3L12 2z"/></svg></button><select id="lang" aria-label="Dil"><option value="tr">Türkçe</option><option value="de">Deutsch</option></select><button id="help" aria-label="Help">?</button></div></header>
<main class="layout"><section class="panel"><div class="eyebrow" id="tag"></div><h1 id="title"></h1><div id="formula"></div><p class="muted" id="tip"></p><div class="meter"><div id="meter"></div></div></section><section class="panel"><h2 id="subheading"></h2><div id="stage"></div><div class="footer"><button id="prev"></button><span id="count" class="muted"></span><button class="main" id="next"></button></div></section></main><small id="version"></small>
<script>
const questions=[{"label":"1(i)","tr":"Sabit fonksiyon","de":"Konstante Funktion","formula":"f(x)=c","st":[["Fonksiyon grafiği nedir?","Was ist ein Funktionsgraph?","Grafikte her x için tam bir f(x) bulunmalıdır.","Für jedes x muss es genau einen Funktionswert f(x) geben."],["Yatay çizgiyi çiz","Zeichne eine waagerechte Linie","Bütün x değerleri aynı c değerine gider.","Alle x-Werte werden auf denselben Wert c abgebildet."],["Özellikleri kontrol et","Eigenschaften prüfen","Birden fazla x aynı değere gider: bire bir değildir. Y birden fazla değer içeriyorsa örten de değildir.","Mehrere x haben denselben Funktionswert: nicht injektiv. Bei mehr als einem Zielwert auch nicht surjektiv."]],"graph":"constant"},{"label":"1(ii)","tr":"Örten ama bire bir değil","de":"Surjektiv, aber nicht injektiv","formula":"f(x)=x², X=[−1,1], Y=[0,1]","st":[["Örtenliği kontrol et","Surjektivität prüfen","Y'nin [0,1] aralığındaki her değeri en az bir x için elde edilir.","Jeder Wert aus Y=[0,1] wird von mindestens einem x erreicht."],["Bire birliği kontrol et","Injektivität prüfen","f(−1)=f(1)=1 fakat −1≠1.","Es gilt f(−1)=f(1)=1, obwohl −1≠1."],["Sonuç","Ergebnis","Her hedefe ulaşılır ama iki farklı x aynı değeri alabilir.","Jeder Zielwert wird erreicht, aber verschiedene x können denselben Wert haben."]],"graph":"parabola"},{"label":"1(iii)","tr":"Bire bir ve örten (bijektif)","de":"Injektiv und surjektiv (bijektiv)","formula":"f(x)=x, X=Y=[0,1]","st":[["Bire birlik","Injektivität","x₁≠x₂ ise f(x₁)≠f(x₂).","Aus x₁≠x₂ folgt f(x₁)≠f(x₂)."],["Örtenlik","Surjektivität","Her y∈[0,1] için x=y seçilirse f(x)=y.","Für jedes y∈[0,1] kann man x=y wählen; dann gilt f(x)=y."],["Sonuç","Ergebnis","Hem bire bir hem örten olduğu için bijektiftir.","Die Abbildung ist injektiv und surjektiv, also bijektiv."]],"graph":"diagonal"},{"label":"1(iv)","tr":"Ne örten ne bire bir","de":"Weder surjektiv noch injektiv","formula":"f(x)=x², X=[−1,1], Y=[−1,2]","st":[["Örten değil","Nicht surjektiv","Negatif y değerleri ve 1'den büyük değerler elde edilemez.","Negative y-Werte und Werte größer als 1 werden nicht erreicht."],["Bire bir değil","Nicht injektiv","f(−1)=f(1)=1; farklı iki girdi aynı çıktıya gider.","f(−1)=f(1)=1: Zwei verschiedene Eingaben haben dieselbe Ausgabe."],["Sonuç","Ergebnis","İstenen iki özelliğin ikisi de sağlanmaz.","Keine der beiden Eigenschaften ist erfüllt."]],"graph":"arch"},{"label":"1(v)","tr":"Birim fonksiyon","de":"Identitätsabbildung","formula":"X=Y,  f=Idₓ,  f(x)=x","st":[["Grafiği düşün","Graph betrachten","Grafik (x,x) noktalarından oluşur.","Der Graph besteht aus allen Punkten (x,x)."],["Köşegeni çiz","Diagonale zeichnen","X×X karesinin sol altından sağ üstüne bir köşegen çizilir.","Im Quadrat X×X verläuft der Graph als Diagonale von links unten nach rechts oben."],["Sonuç","Ergebnis","Bütün elemanlar kendilerine gider; birim fonksiyon bijektiftir.","Jedes Element wird auf sich selbst abgebildet. Die Identität ist bijektiv."]],"graph":"diagonal"},{"label":"2(a)","tr":"Bire birlikten küme eşitliğine","de":"Von Injektivität zur Mengengleichheit","formula":"f injektiv ⇒ f(A)∩f(B)=f(A∩B)","st":[["Birinci kapsama","Erste Inklusion","A∩B⊆A ve A∩B⊆B. Bu yüzden f(A∩B)⊆f(A)∩f(B).","Aus A∩B⊆A und A∩B⊆B folgt f(A∩B)⊆f(A)∩f(B)."],["Diğer yön","Umgekehrte Inklusion","y∈f(A)∩f(B) olsun. a∈A, b∈B için f(a)=y=f(b) vardır.","Sei y∈f(A)∩f(B). Dann existieren a∈A, b∈B mit f(a)=y=f(b)."],["Bire birlik kullan","Injektivität anwenden","f(a)=f(b) ve f bire bir ⇒ a=b. Bu ortak eleman A∩B'dedir.","Aus f(a)=f(b) und der Injektivität folgt a=b. Dieses Element liegt in A∩B."],["Sonuç","Ergebnis","y∈f(A∩B), yani ters kapsama da sağlanır. İki küme eşittir.","Daher y∈f(A∩B). Beide Inklusionen gelten; die Mengen sind gleich."]]},{"label":"2(b)","tr":"Küme eşitliğinden bire birliğe","de":"Von der Mengengleichheit zur Injektivität","formula":"∀A,B⊆X: f(A)∩f(B)=f(A∩B) ⇒ f injektiv","st":[["Karşıt tersini düşün","Kontraposition verwenden","f bire bir değilse iki farklı x,x′ için f(x)=f(x′) bulunur.","Ist f nicht injektiv, gibt es x≠x′ mit f(x)=f(x′)."],["İki tek elemanlı küme","Zwei einelementige Mengen","A={x}, B={x′} seç. A∩B=∅.","Wähle A={x}, B={x′}. Dann ist A∩B=∅."],["Görüntüler çakışır","Bilder überschneiden sich","f(A)∩f(B)={f(x)} boş değil, ama f(A∩B)=f(∅)=∅.","f(A)∩f(B)={f(x)} ist nicht leer, doch f(A∩B)=f(∅)=∅."],["Çelişki","Widerspruch","Öngörülen eşitlik bozuldu. Demek ki eşitlik tüm A,B için doğruysa f bire birdir.","Die behauptete Gleichheit wäre verletzt. Gilt sie für alle A,B, muss f injektiv sein."]]},{"label":"3(a)","tr":"Kesir fonksiyonu bire bir midir?","de":"Ist die Bruchabbildung injektiv?","formula":"g: ℕ×(ℕ∖{0}) → ℚ,  g(p,q)=p/q","st":[["Bire birlik ölçütü","Kriterium für Injektivität","Farklı girdilerin her zaman farklı çıktı üretmesi gerekir.","Unterschiedliche Eingaben müssen stets verschiedene Ausgaben liefern."],["Karşı-örnek","Gegenbeispiel","g(1,2)=1/2 ve g(2,4)=2/4=1/2.","Es gilt g(1,2)=1/2 und g(2,4)=2/4=1/2."],["Sonuç: yanlış","Ergebnis: falsch","(1,2)≠(2,4) ama görüntüleri eşit. g bire bir değildir.","(1,2)≠(2,4), aber ihre Bilder sind gleich. g ist nicht injektiv."]]},{"label":"3(b)","tr":"Kesir fonksiyonu örten midir?","de":"Ist die Bruchabbildung surjektiv?","formula":"g: ℕ×(ℕ∖{0}) → ℚ","st":[["Tanım ve hedef kümeye bak","Definitions- und Zielmenge prüfen","Pay p∈ℕ ve payda q>0 olduğundan p/q≥0.","Da p∈ℕ und q>0 gilt, ist p/q≥0."],["Ulaşılamayan hedef","Nicht erreichbarer Zielwert","−1 rasyoneldir, ama hiçbir p/q değeri −1 olamaz.","−1 ist rational, aber kein Bruch p/q aus dem Definitionsbereich kann −1 sein."],["Sonuç: yanlış","Ergebnis: falsch","Dolayısıyla g, tüm ℚ kümesine örten değildir.","Also ist g nicht surjektiv auf ganz ℚ."]]},{"label":"4","tr":"Parçalı fonksiyonun bijektifliği","de":"Bijektivität einer Fallunterscheidung","formula":"f: ℤ→ℕ∖{0};  f(n)=2n+1 (n≥0),  f(n)=−2n (n<0)","st":[["Görüntüleri anla","Funktionswerte verstehen","n≥0 olduğunda pozitif tek sayılar; n<0 olduğunda pozitif çift sayılar üretilir.","Für n≥0 entstehen positive ungerade Zahlen; für n<0 positive gerade Zahlen."],["Bire birlik: aynı işaret","Injektivität: gleicher Bereich","n,m≥0 için 2n+1=2m+1 ⇒ n=m. n,m<0 için −2n=−2m ⇒ n=m.","Für n,m≥0 folgt aus 2n+1=2m+1 die Gleichheit n=m. Für n,m<0 gilt dasselbe aus −2n=−2m."],["Bire birlik: farklı işaret","Injektivität: verschiedene Bereiche","Biri ≥0, diğeri <0 ise çıktılardan biri tek, diğeri çifttir; eşit olamaz.","Liegt ein Argument bei ≥0 und das andere bei <0, sind die Bilder ungerade bzw. gerade und können nicht gleich sein."],["Örtenlik: tek k","Surjektivität: ungerades k","k>0 tek ise n=(k−1)/2≥0 tamsayısı seçilir. f(n)=k.","Für ungerades k>0 wähle n=(k−1)/2≥0. Dann f(n)=k."],["Örtenlik: çift k","Surjektivität: gerades k","k>0 çift ise n=−k/2<0 seçilir. f(n)=−2(−k/2)=k.","Für gerades k>0 wähle n=−k/2<0. Dann f(n)=−2(−k/2)=k."],["Sonuç","Ergebnis","Hem bire bir hem örten: f bijektiftir.","Die Funktion ist injektiv und surjektiv, also bijektiv."]]},{"label":"5(a)","tr":"De Morgan yasası: doğruluk tablosu","de":"De-Morgan-Gesetz: Wahrheitstafel","formula":"¬(A∨B∨C) ≡ (¬A∧¬B∧¬C)","st":[["Sekiz satır gerekir","Acht Zeilen sind nötig","Üç önerme değişkeninin 2³=8 doğru/yanlış düzeni vardır.","Drei Aussagenvariablen haben 2³=8 Belegungen."],["Ara sütunları doldur","Zwischenspalten ausfüllen","A∨B∨C, ¬(A∨B∨C), ¬A, ¬B, ¬C ve ¬A∧¬B∧¬C sütunlarını hesapla.","Berechne die Spalten A∨B∨C, ¬(A∨B∨C), ¬A, ¬B, ¬C und ¬A∧¬B∧¬C."],["Son sütunları karşılaştır","Endspalten vergleichen","Her satırda ¬(A∨B∨C) ve ¬A∧¬B∧¬C aynı doğruluk değerini verir.","In jeder Zeile stimmen ¬(A∨B∨C) und ¬A∧¬B∧¬C überein."],["Eşdeğerlik kanıtlandı","Äquivalenz bewiesen","İki formül bütün satırlarda aynı sonucu verdiğinden mantıksal olarak eşdeğerdir.","Da die beiden Formeln für jede Belegung denselben Wert haben, sind sie logisch äquivalent."]],"truth":"a"},{"label":"5(b)","tr":"İç içe koşullu önermeler","de":"Verschachtelte Implikationen","formula":"(A⇒(B⇒C)) ≡ ((A∧B)⇒C)","st":[["Sekiz satır hazırla","Acht Zeilen erstellen","A, B, C için tüm kombinasyonları sırala.","Liste alle Belegungen von A, B und C auf."],["Sol taraf","Linke Seite","Önce B⇒C, ardından A⇒(B⇒C) hesapla.","Berechne zuerst B⇒C und dann A⇒(B⇒C)."],["Sağ taraf","Rechte Seite","Önce A∧B, ardından (A∧B)⇒C hesapla.","Berechne zuerst A∧B und dann (A∧B)⇒C."],["Sonucu karşılaştır","Ergebnis vergleichen","İki son sütun her satırda aynıdır. Dolayısıyla formüller eşdeğerdir.","Die beiden Endspalten sind in jeder Zeile gleich. Also sind die Formeln äquivalent."]],"truth":"b"}];
const dict={"tr":{"title":"Übungsblatt 2 • Animasyonlu Çözümler","prev":"Önceki soru","next":"Sonraki adım","nextSlide":"Sonraki soru","again":"Baştan","question":"Soru","goal":"Çözüm adımları","help":"Soruyu oku. Sonraki adım düğmesine bas. Animasyon ve açıklama sırayla görünür.","tip":"Boşluk: sonraki adım • ← →: soru","lang":"Dil","version":"v1.1 • ÜB02: Türkçe/Almanca bütün çözümler"},"de":{"title":"Übungsblatt 2 • Animierte Lösungen","prev":"Vorherige Aufgabe","next":"Nächster Schritt","nextSlide":"Nächste Aufgabe","again":"Von vorn","question":"Aufgabe","goal":"Lösungsschritte","help":"Lies die Aufgabe und klicke auf Nächster Schritt. Animation und Erklärung erscheinen nacheinander.","tip":"Leertaste: Schritt • ← →: Aufgabe","lang":"Sprache","version":"v1.1 • ÜB02: Alle Lösungen auf Deutsch/Türkisch"}};
const truthRows=[["W","W","W"],["W","W","F"],["W","F","W"],["W","F","F"],["F","W","W"],["F","W","F"],["F","F","W"],["F","F","F"]];
const curvePaths={"constant":"M25 83 L335 83","parabola":"M25 35 Q180 262 335 35","diagonal":"M25 165 L335 20","arch":"M25 121 Q180 4 335 121"};
let language=localStorage.getItem("elif-ub02-lang")||"tr",at=0,revealed=0;const el=id=>document.getElementById(id);
const truthTable=type=>{const cols=type==="a"?["A","B","C","A∨B∨C","¬(A∨B∨C)","¬A","¬B","¬C","¬A∧¬B∧¬C"]:["A","B","C","B⇒C","A⇒(B⇒C)","A∧B","(A∧B)⇒C"];return '<div class="truthbox"><table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+truthRows.map((r,k)=>{let [a,b,c]=r.map(x=>x==="W");let vals=type==="a"?[a,b,c,a||b||c,!(a||b||c),!a,!b,!c,!a&&!b&&!c]:[a,b,c,!b||c,!a||(!b||c),a&&b,!(a&&b)||c];return '<tr>'+vals.map((x,i)=>'<td class="'+((i===4||i===cols.length-1)?'highlight':'')+'">'+(language==='de'?(x?'W':'F'):(x?'D':'Y'))+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'};
function render(){const d=dict[language],q=questions[at];document.documentElement.lang=language;document.title=d.title;el("lang").value=language;el("heading").textContent=d.title;el("tag").textContent=d.question+" "+q.label;el("title").textContent=q[language];el("formula").textContent=q.formula;el("tip").textContent=d.tip;el("subheading").textContent=d.goal;el("prev").textContent="← "+d.prev;el("next").textContent=revealed<q.st.length?d.next+" →":d.nextSlide+" →";el("count").textContent=(at+1)+"/"+questions.length+" · "+revealed+"/"+q.st.length;el("meter").style.width=(revealed/q.st.length*100)+"%";el("version").textContent=d.version;let stage=el("stage");stage.replaceChildren();if(q.graph&&revealed>0){let wrap=document.createElement("div");wrap.innerHTML='<div class="plot"><svg viewBox="0 0 360 190"><rect x="25" y="20" width="310" height="145" rx="4" fill="#f8fbff" stroke="#b7c8e8" stroke-width="2"/><text x="4" y="15" fill="#64748b">Y</text><text x="337" y="185" fill="#64748b">X</text><path d="'+curvePaths[q.graph]+'" fill="none" stroke="#296be5" stroke-width="5" stroke-linecap="round" pathLength="100" class="drawcurve"/></svg></div>';stage.appendChild(wrap);}if(q.truth&&revealed>1){let wrap=document.createElement("div");wrap.innerHTML=truthTable(q.truth);stage.appendChild(wrap)}q.st.slice(0,revealed).forEach((step,i)=>{let box=document.createElement("article");box.className="step";let h=document.createElement("h3"),p=document.createElement("p");h.textContent=(i+1)+". "+step[language==="tr"?0:1];p.textContent=step[language==="tr"?2:3];box.append(h,p);stage.appendChild(box)});}
function advance(){if(revealed<questions[at].st.length){revealed++;render()}else if(at<questions.length-1){at++;revealed=0;render()}else{at=0;revealed=0;render()}}function previous(){if(at>0){at--;revealed=0;render()}}el("lang").onchange=e=>{language=e.target.value;localStorage.setItem("elif-ub02-lang",language);render()};el("help").onclick=()=>alert(dict[language].help);el("next").onclick=advance;el("prev").onclick=previous;document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;if(e.key===" "||e.key==="Enter"){e.preventDefault();advance()}if(e.key==="ArrowRight"){at=Math.min(questions.length-1,at+1);revealed=0;render()}if(e.key==="ArrowLeft")previous()});render();
</script></body></html>
