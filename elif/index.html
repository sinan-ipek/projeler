<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elif</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f4;color:#171c28;font:16px system-ui,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:15px 20px}
button{cursor:pointer;font:inherit}
.home{background:#ffd84f;border:1px solid #d9ac00;border-radius:12px;width:47px;height:47px;display:grid;place-items:center}
.home svg{width:27px;height:27px;fill:#111}
.utility{padding:12px 15px;border-radius:12px;border:1px solid #cbd1dc;background:white;font-weight:700}
main{width:min(950px,94%);margin:auto;text-align:center}h1{font-size:clamp(32px,5vw,56px);margin:0 0 35px}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:20px}
.links a{display:grid;place-items:center;min-width:210px;min-height:100px;padding:20px;border-radius:20px;text-decoration:none;background:white;color:#172033;border:1px solid #d5dce8;font-size:24px;font-weight:750;box-shadow:0 12px 28px #15223d1c;transition:.2s}
.links a:hover{transform:translateY(-4px);box-shadow:0 16px 32px #15223d30}
footer{padding:10px;color:#9097a3;font-size:11px}
dialog{border:1px solid #d5dce8;border-radius:18px;padding:25px;max-width:380px;box-shadow:0 16px 40px #0003}
dialog::backdrop{background:#0005}
</style></head><body>
<header>
<button class="home" onclick="location.href='../index.html'" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 1 11h3v11h7v-7h3v7h7V11h3L12 2z"/></svg></button>
<select class="utility" id="language" aria-label="Dil"><option value="tr">Türkçe</option><option value="de">Deutsch</option><option value="en">English</option></select>
<button class="utility" onclick="document.querySelector('dialog').showModal()" aria-label="Help">?</button>
</header>
<main><h1 id="heading">Elif</h1><div class="links"><a href="ub03/index.html">Übungsblatt 3</a></div></main>
<footer>v1.0 · Elif ders sunumları</footer>
<dialog><p id="helpText">Bir düğmeye bas. İlgili sayfa açılır.</p><button class="utility" onclick="this.closest('dialog').close()">OK</button></dialog>
<script>
const lang=document.querySelector('#language');
lang.value=localStorage.getItem('elif-lang')||'tr';
function tr(){let l=lang.value;document.documentElement.lang=l;
document.querySelector('#helpText').textContent=({tr:'Bir düğmeye bas. İlgili sayfa açılır.',de:'Klicke auf einen Knopf. Die Seite öffnet sich.',en:'Click a button to open the page.'})[l];
document.querySelector('#heading').textContent=({tr:'Elif',de:'Elif',en:'Elif'})[l];}
lang.addEventListener('change',()=>{localStorage.setItem('elif-lang',lang.value);tr()});tr();
</script></body></html>
