 Zahlen auflisten","−3’ten 8’e kadar bütün tam sayılar kalır.","Es bleiben alle ganzen Zahlen von −3 bis 8."],["Sonuç","Ergebnis","{−3,−2,−1,0,1,2,3,4,5,6,7,8}; toplam 12 eleman.","{−3,−2,−1,0,1,2,3,4,5,6,7,8}; insgesamt 12 Elemente."]]],["1(b)(ii)","Küme farkı","Mengendifferenz","{x∈ℤ | −2<x≤π} ∖ {x∈ℕ | x≤2}",[["İlk kümeyi yaz","Erste Menge bilden","π yaklaşık 3,14 olduğundan ilk küme {−1,0,1,2,3}.","Da π ungefähr 3,14 ist, lautet die erste Menge {−1,0,1,2,3}."],["İkinci kümeyi yaz","Zweite Menge bilden","ℕ sıfırı içeriyorsa ikinci küme {0,1,2}.","Falls 0∈ℕ gilt, ist die zweite Menge {0,1,2}."],["Çıkarma yap","Differenz bilden","0,1,2 silinir; sonuç {−1,3}.","0,1,2 werden entfernt; Ergebnis {−1,3}."],["Tanım uyarısı","Definitionshinweis","ℕ sıfırı içermezse cevap {−1,0,3} olur. Bu sunum 0∈ℕ kabul ediyor.","Falls ℕ die Null nicht enthält, lautet das Ergebnis {−1,0,3}. Hier nehmen wir 0∈ℕ an."]]],["2(a)","Üç kümenin kesişimi","Schnitt von drei Mengen","M∩N∩O",[["Birleşen bölgeleri bul","Überlappungen finden","M, N ve O üçüne birden ait olan noktalar seçilir.","Wähle Punkte, die gleichzeitig in M, N und O liegen."],["Boya","Schraffieren","Yalnızca üç dairenin ortak merkez bölgesini boya.","Färbe ausschließlich den gemeinsamen Bereich aller drei Kreise."]],"a"],["2(b)","Emilim yasası","Absorptionsgesetz","M∩(M∪N)=M",[["Birleşimi kur","Vereinigung bilden","M∪N, M’nin tüm elemanlarını zaten içerir.","M∪N enthält bereits jedes Element von M."],["Kesişimi al","Schnitt bilden","M ile bu birleşimin kesişimi yine M’dir.","Der Schnitt dieser Vereinigung mit M ist daher wieder M."]],"b"],["2(c)","Kesişim farkı","Differenz einer Schnittmenge","M∖(N∩O)",[["Önce N∩O","Zuerst N∩O","N ile O’nun kesiştiği bölgeyi belirle.","Bestimme zunächst den Schnittbereich von N und O."],["M’den çıkar","Von M abziehen","Bu kesişimle ortak olan kısmı M’den sil.","Entferne den Teil von M, der zugleich in N und O liegt."]],"c"],["2(d)","Simetrik fark","Symmetrische Differenz","(M∖N)∪(N∖M)",[["M∖N"," arpım","Kartesisches Produkt","A={0,2}, B={1,b}, b≠1; A×B",[["Bileşenleri eşleştir","Elemente paaren","A’nın her elemanı B’nin her elemanıyla sıralı çift oluşturur.","Jedes Element von A wird mit jedem Element von B zu einem geordneten Paar verbunden."],["Dört çifti yaz","Vier Paare notieren","A×B={(0,1),(0,b),(2,1),(2,b)}.","A×B={(0,1),(0,b),(2,1),(2,b)}."],["Say","Zählen","b≠1 olduğundan dört çift farklıdır.","Wegen b≠1 sind die vier Paare verschieden."]]],["4(a)(ii)","16 altküme: kuvvet kümesi","16 Teilmengen: Potenzmenge","P(A×B), |A×B|=4",[["Kısaltma kullan","Abkürzungen verwenden","u=(0,1), v=(0,b), w=(2,1), z=(2,b) al.","Setze u=(0,1), v=(0,b), w=(2,1), z=(2,b)."],["0 ve 1 elemanlı","0 und 1 Element","∅; {u},{v},{w},{z}.","∅; {u},{v},{w},{z}."],["2 elemanlı","2 Elemente","{u,v},{u,w},{u,z},{v,w},{v,z},{w,z}.","{u,v},{u,w},{u,z},{v,w},{v,z},{w,z}."],["3 elemanlı","3 Elemente","{u,v,w},{u,v,z},{u,w,z},{v,w,z}.","{u,v,w},{u,v,z},{u,w,z},{v,w,z}."],["4 elemanlı ve sayım","4 Elemente und Anzahl","{u,v,w,z}. Toplam 1+4+6+4+1=16.","{u,v,w,z}. Insgesamt 1+4+6+4+1=16."]]],["4(b)","Kuvvet kümesinde kesişim","Schnitt von Potenzmengen","P(C∩D)=P(C)∩P(D)",[["İleri kapsama","Hinrichtung","T∈P(C∩D) ise T⊆C∩D; dolayısıyla T⊆C ve T⊆D.","Aus T∈P(C∩D) folgt T⊆C∩D, also T⊆C und T⊆D."],["Sonuç","Folgerung","T hem P(C) hem P(D) içindedir.","T liegt sowohl in P(C) als auch in P(D)."],["Geri kapsama","Rückrichtung","T∈P(C)∩P(D) ise T⊆C ve T⊆D, yani T⊆C∩D.","Aus T∈P(C)∩P(D) folgen T⊆C und T⊆D, somit T⊆C∩D."],["Eşitlik","Gleichheit","İki yön birlikte eşitliği kanıtlar.","Beide Inklusionen zusammen beweisen die Gleichheit."]]],["5(a)","Kardinalite örneği","Beispiel zur Kardinalität","|A∩B|=2, |A∪B|=3",[["Kümeleri seç","Mengen wählen","A={1,2,3}, B={1,2} seç.","Wähle A={1,2,3} und B={1,2}."],["Kontrol et","Prüfen","A∩B={1,2}: 2 eleman. A∪B={1,2,3}: 3 eleman.","A∩B={1,2} hat 2 Elemente, A∪B={1,2,3} hat 3 Elemente."]]],["5(b)","Birleşimin kardinalitesi","Kardinalität der Vereinigung","|A∪
