const topics=[{"tr":"Cisim nedir?","de":"Was ist ein Körper?","rule":"(K,+,·) · 0≠1","important":["Bir cisimde toplama ve çarpma tanımlıdır; sıfır dışındaki her elemanın çarpma tersi vardır.","In einem Körper sind Addition und Multiplikation definiert; jedes Element außer Null besitzt ein multiplikatives Inverses."],"examples":[["ℚ bir cisimdir: 2/3+1/6=5/6; (2/3)⁻¹=3/2.","ℚ ist ein Körper: 2/3+1/6=5/6; (2/3)⁻¹=3/2."],["ℝ bir cisimdir: √2·(1/√2)=1.","ℝ ist ein Körper: √2·(1/√2)=1."],["ℤ bir cisim değildir: 2'nin ℤ içinde çarpma tersi yoktur.","ℤ ist kein Körper: 2 besitzt in ℤ kein multiplikatives Inverses."]]},{"tr":"Dokuz cisim aksiyomu","de":"Die neun Körperaxiome","rule":"K1–K4: + · K5–K8: · · K9: dağılma / Distributivität","important":["K1/K5 birleşme; K2/K6 değişme; K3/K7 etkisiz eleman; K4/K8 ters eleman; K9 dağılma yasası.","K1/K5 Assoziativität; K2/K6 Kommutativität; K3/K7 neutrales Element; K4/K8 inverses Element; K9 Distributivgesetz."],"examples":[["Birleşme: (2+3)+4=2+(3+4)=9.","Assoziativität: (2+3)+4=2+(3+4)=9."],["Ters eleman: 7+(−7)=0; (3/5)·(5/3)=1.","Inverse: 7+(−7)=0; (3/5)·(5/3)=1."],["Dağılma: 3(4+5)=3·4+3·5=27.","Distributivität: 3(4+5)=3·4+3·5=27."]]},{"tr":"Sıfır, bir ve tersin tekliği","de":"Eindeutigkeit von Null, Eins und Inversen","rule":"a+0=a · a·1=a · a+(−a)=0","important":["Toplama etkisiz elemanı 0, çarpma etkisiz elemanı 1 tektir; ters eleman da tektir.","Die neutralen Elemente 0 und 1 sind eindeutig; ebenso das jeweilige inverse Element."],"examples":[["İki sıfır 0 ve e olsa: 0=0+e=e. Demek ki aynı elemandır.","Gäbe es zwei Nullen 0 und e: 0=0+e=e. Also sind sie identisch."],["a+b=0 ve a+c=0 ise b=b+0=b+(a+c)=(b+a)+c=0+c=c.","Aus a+b=0 und a+c=0 folgt b=b+0=b+(a+c)=(b+a)+c=0+c=c."],["3/4 elemanının çarpma tersi yalnızca 4/3'tür; 0'ın çarpma tersi yoktur.","Das multiplikative Inverse von 3/4 ist eindeutig 4/3; Null besitzt keines."]]},{"tr":"Cisimde temel ispatlar","de":"Grundlegende Beweise im Körper","rule":"0·a=0 · (−1)a=−a · (−1)(−1)=1","important":["Cisim aksiyomlarıyla bilinen hesap kuralları kanıtlanabilir; sonuçları aksiyom sanma.","Vertraute Rechenregeln folgen erst aus den Körperaxiomen; sie sind keine zusätzlichen Axiome."],"examples":[["0·a=(0+0)·a=0·a+0·a. İki taraftan 0·a çıkar: 0·a=0.","0·a=(0+0)·a=0·a+0·a. Addiere das additive Inverse: 0·a=0."],["a+(−1)a=(1+(−1))a=0a=0. Dolayısıyla (−1)a=−a.","a+(−1)a=(1+(−1))a=0a=0. Folglich (−1)a=−a."],["(−1)(−1)=−(−1)=1; iki eksi çarpılınca artı olur.","(−1)(−1)=−(−1)=1; Minus mal Minus ist Plus."]]},{"tr":"Sıfır bölen yokluğu","de":"Nullteilerfreiheit","rule":"ab=0 ⇔ a=0 veya b=0","important":["Cisimde sıfır bölen yoktur. İspatta a≠0 varsayılır ve a⁻¹ ile çarpılır.","In einem Körper gibt es keine Nullteiler. Für den Beweis nehme a≠0 an und multipliziere mit a⁻¹."],"examples":[["5x=0 (ℚ içinde): 5⁻¹=1/5 ⇒ x=0.","5x=0 (in ℚ): 5⁻¹=1/5 ⇒ x=0."],["(x−2)(x+3)=0 (ℝ içinde): x=2 veya x=−3.","(x−2)(x+3)=0 (in ℝ): x=2 oder x=−3."],["ℤ₆ bir cisim değil: 2·3≡0 (mod 6), fakat 2 ve 3 sıfır değil.","ℤ₆ ist kein Körper: 2·3≡0 (mod 6), aber 2 und 3 sind nicht Null."]]},{"tr":"Değişmeli grup","de":"Abelsche Gruppe","rule":"(M,∘): birleşme + etkisiz + ters + değişme","important":["Bir grup için birleşme, etkisiz ve ters eleman gerekir; değişme özelliği eklenirse değişmeli (Abel) grup olur.","Für eine Gruppe braucht man Assoziativität, ein neutrales und inverse Elemente; mit Kommutativität ist sie abelsch."],"examples":[["(ℤ,+) değişmeli gruptur: etkisiz eleman 0, 8'in tersi −8.","(ℤ,+) ist abelsch: neutrales Element 0, Inverses von 8 ist −8."],["(ℚ∖{0},·) değişmeli gruptur: etkisiz eleman 1, 2/5'in tersi 5/2.","(ℚ∖{0},·) ist abelsch: neutrales Element 1, Inverses von 2/5 ist 5/2."],["(ℕ,+) grup değildir: 3'ün toplama tersi −3, ℕ içinde yoktur.","(ℕ,+) ist keine Gruppe: −3 gehört nicht zu ℕ."]]},{"tr":"Magma, yarıgrup, monoid, grup","de":"Magma, Halbgruppe, Monoid, Gruppe","rule":"Magma ⊃ yarıgrup ⊃ monoid ⊃ grup","important":["Magma kapalı ikili işlem; yarıgrup ayrıca birleşme; monoid ayrıca etkisiz; grup ayrıca ters; değişmeli grup ayrıca değişme ister.","Magma: abgeschlossene Verknüpfung; Halbgruppe: zusätzlich assoziativ; Monoid: zusätzlich neutral; Gruppe: zusätzlich invers; abelsch: zusätzlich kommutativ."],"examples":[["(ℕ₀,+) monoidtir: 0 var, ama 2'nin toplama tersi yok.","(ℕ₀,+) ist ein Monoid: 0 ist neutral, aber 2 hat kein additives Inverses."],["Pozitif tam sayılar çarpma ile değişmeli monoiddir; 2'nin tersi kümede yok.","Positive ganze Zahlen unter Multiplikation bilden ein kommutatives Monoid; 2 hat dort kein Inverses."],["Sıfır olmayan gerçek sayılar çarpma ile değişmeli gruptur.","Die reellen Zahlen ohne Null bilden unter Multiplikation eine abelsche Gruppe."]]},{"tr":"Grupta sadeleştirme ve tersler","de":"Kürzen und Inverse in Gruppen","rule":"ba=ca ⇒ b=c ; ab=ac ⇒ b=c","important":["Değişme özelliği olmayan gruplarda da soldan ve sağdan sadeleştirme mümkündür; hangi taraftan çarptığına dikkat et.","Auch in nichtabelschen Gruppen darf man links und rechts kürzen; achte auf die Seite der Multiplikation."],"examples":[["a+x=a+y ⇒ a⁻¹(ax)=a⁻¹(ay) ⇒ x=y.","a+x=a+y (additiv) ⇒ (−a)+(a+x)=(−a)+(a+y) ⇒ x=y."],["ba=ca ⇒ (ba)a⁻¹=(ca)a⁻¹ ⇒ b=c.","ba=ca ⇒ (ba)a⁻¹=(ca)a⁻¹ ⇒ b=c."],["ab=ac ⇒ a⁻¹(ab)=a⁻¹(ac) ⇒ b=c.","ab=ac ⇒ a⁻¹(ab)=a⁻¹(ac) ⇒ b=c."]]},{"tr":"Cisim ve vektör uzayı bağı","de":"Körper und Vektorraum","rule":"(K,+) ve (K∖{0},·) değişmeli grup","important":["Cisim: iki değişmeli grup ve bunları bağlayan dağılma yasası. Vektör uzayındaki skalerler bir cisimden gelir.","Ein Körper besteht aus zwei abelschen Gruppen plus Distributivgesetz. Skalare eines Vektorraums kommen aus einem Körper."],"examples":[["ℝ², ℝ üzerinde vektör uzayıdır: 2·(1,3)=(2,6).","ℝ² ist ein Vektorraum über ℝ: 2·(1,3)=(2,6)."],["ℚ², ℚ üzerinde vektör uzayıdır: (1/2)(2,4)=(1,2).","ℚ² ist ein Vektorraum über ℚ: (1/2)(2,4)=(1,2)."],["(ℤ,+,·) cisim olmadığından standart anlamda ℤ üzerinde vektör uzayı tanımlamayız; ℤ-modül tanımlarız.","Da ℤ kein Körper ist, spricht man nicht von einem Vektorraum über ℤ, sondern von einem ℤ-Modul."]]},{"tr":"Karakteristik","de":"Charakteristik","rule":"char(K)=en küçük n>0: n·1=0; yoksa 0","important":["Bir cismin karakteristiği sıfır ya da asal sayıdır. Sonlu cisimlerde karakteristik sıfır olamaz.","Die Charakteristik eines Körpers ist 0 oder eine Primzahl. Endliche Körper haben positive Charakteristik."],"examples":[["ℚ'da 1+⋯+1 hiçbir pozitif n için 0 olmaz: char(ℚ)=0.","In ℚ ist 1+⋯+1 für kein positives n gleich 0: char(ℚ)=0."],["𝔽₂ içinde 1+1=0: char(𝔽₂)=2.","In 𝔽₂ gilt 1+1=0: char(𝔽₂)=2."],["𝔽₅ içinde 1+1+1+1+1=0: char(𝔽₅)=5.","In 𝔽₅ gilt 1+1+1+1+1=0: char(𝔽₅)=5."]]},{"tr":"Modüler aritmetik","de":"Modulare Arithmetik","rule":"a mod n = bölmenin kalanı (0≤r<n)","important":["Modüler toplama ve çarpmada işlem yapılır, sonra n'ye bölümünden kalan alınır.","Bei modularer Addition und Multiplikation berechnet man zuerst die Operation und anschließend den Rest modulo n."],"examples":[["17 mod 5=2, çünkü 17=3·5+2.","17 mod 5=2, denn 17=3·5+2."],["𝔽₅ içinde 4+3≡7≡2 (mod 5).","In 𝔽₅ gilt 4+3≡7≡2 (mod 5)."],["𝔽₇ içinde 5·3≡15≡1 (mod 7); bu yüzden 5⁻¹=3.","In 𝔽₇ gilt 5·3≡15≡1 (mod 7); daher 5⁻¹=3."]]},{"tr":"Sonlu cisimler 𝔽₂ ve 𝔽₃","de":"Endliche Körper 𝔽₂ und 𝔽₃","rule":"𝔽ₚ={0,…,p−1}, p asal","important":["𝔽ₚ, p asal olduğunda cisimdir. Mod 2 toplama XOR ile aynıdır. Bir cismin eleman sayısı en az 2'dir.","𝔽ₚ ist für primzahliges p ein Körper. Addition modulo 2 entspricht XOR. Jeder Körper hat mindestens zwei Elemente."],"examples":[["𝔽₂: 1+1=0; 1·1=1 (mod 2).","𝔽₂: 1+1=0; 1·1=1 (mod 2)."],["𝔽₃: 2+2≡1; 2·2≡1 (mod 3), yani 2 kendi tersidir.","𝔽₃: 2+2≡1; 2·2≡1 (mod 3); 2 ist sein eigenes Inverses."],["𝔽₅: 2⁻¹=3 çünkü 2·3≡1 (mod 5).","𝔽₅: 2⁻¹=3, denn 2·3≡1 (mod 5)."]]},{"tr":"Uygulamalar: bitler, küp, Set!","de":"Anwendungen: Bits, Würfel, Set!","rule":"𝔽₂ⁿ · grup işlemleri · 𝔽₃⁴","important":["Bit dizileri 𝔽₂ üzerinde vektörlerdir; Rubik küpünün hamleleri değişmeli olmayan grup oluşturur; Set! kartları 𝔽₃⁴ ile modellenir.","Bitfolgen sind Vektoren über 𝔽₂; Rubik-Würfel-Züge bilden eine nichtabelsche Gruppe; Set!-Karten lassen sich als 𝔽₃⁴ modellieren."],"examples":[["Bit dizileri: (1,0,1)+(1,1,0)=(0,1,1) (mod 2).","Bitfolgen: (1,0,1)+(1,1,0)=(0,1,1) (mod 2)."],["Rubik küpü: Önce üst yüz, sonra sağ yüz döndürmek genelde ters sıradan farklı sonuç verir.","Zauberwürfel: Erst die obere, dann die rechte Seite zu drehen ergibt meist ein anderes Ergebnis als in umgekehrter Reihenfolge."],["Set!: A=(0,0,0,0), B=(1,1,1,1), C=(2,2,2,2); A+B+C=(0,0,0,0) mod 3.","Set!: A=(0,0,0,0), B=(1,1,1,1), C=(2,2,2,2); A+B+C=(0,0,0,0) mod 3."]]}];
const ui={"tr":{"name":"Cisimler ve Gruplar","subtitle":"MAFI 1 • TU Dortmund • Konu anlatımı","selector":"Konu seç","important":"Bilmen gerekenler","examples":"Çözümlü örnekler","step":"Örnek","next":"Sonraki örnek","more":"Sonraki konu","prev":"Önceki konu","all":"Tüm örnekleri göster","help":"Konu seç. Sağdaki örnekleri tek tek aç. Türkçe ve Almanca arasında geçiş yapabilirsin.","footer":"v1.1 · 13 konu · her konuda 3 çözümlü örnek · iki dil","hint":"Örnekler sırayla açılır. Konu menüsüyle istediğin yere gidebilirsin.","source":"Kaynak: TU Dortmund, Mathematik für Informatik 1, Körper (45 sayfa)."},"de":{"name":"Körper und Gruppen","subtitle":"MAFI 1 • TU Dortmund • Lernpräsentation","selector":"Thema wählen","important":"Das musst du wissen","examples":"Gelöste Beispiele","step":"Beispiel","next":"Nächstes Beispiel","more":"Nächstes Thema","prev":"Vorheriges Thema","all":"Alle Beispiele zeigen","help":"Wähle ein Thema. Öffne die Beispiele rechts Schritt für Schritt. Du kannst zwischen Deutsch und Türkisch wechseln.","footer":"v1.1 · 13 Themen · je 3 gelöste Beispiele · zweisprachig","hint":"Die Beispiele erscheinen nacheinander. Mit dem Menü kannst du jedes Thema direkt öffnen.","source":"Quelle: TU Dortmund, Mathematik für Informatik 1, Körper (45 Seiten)."}};
const enTopics=[["What is a field?","A field has addition and multiplication; every nonzero element has a multiplicative inverse.",["ℚ is a field: 2/3+1/6=5/6 and (2/3)⁻¹=3/2.","ℝ is a field: √2·(1/√2)=1.","ℤ is not a field: 2 has no multiplicative inverse in ℤ."]],["The nine field axioms","K1/K5 associativity; K2/K6 commutativity; K3/K7 identity; K4/K8 inverse; K9 distributivity.",["Associativity: (2+3)+4=2+(3+4)=9.","Inverses: 7+(−7)=0, and (3/5)·(5/3)=1.","Distributivity: 3(4+5)=3·4+3·5=27."]],["Uniqueness of zero, one and inverses","The additive identity 0, multiplicative identity 1, and inverses are unique.",["If 0 and e are both additive identities, then 0=0+e=e.","If a+b=0 and a+c=0, then b=b+0=b+(a+c)=(b+a)+c=0+c=c.","The multiplicative inverse of 3/4 is uniquely 4/3; zero has none."]],["Basic proofs in a field","Familiar arithmetic identities follow from field axioms; they are not additional axioms.",["0·a=(0+0)·a=0·a+0·a. Cancel 0·a on each side to get 0·a=0.","a+(−1)a=(1+(−1))a=0a=0. Thus (−1)a=−a.","(−1)(−1)=−(−1)=1: negative times negative is positive."]],["No zero divisors","A field has no zero divisors. To prove this, suppose a≠0 and multiply by a⁻¹.",["In ℚ, 5x=0 ⇒ x=(1/5)·0=0.","In ℝ, (x−2)(x+3)=0 ⇒ x=2 or x=−3.","ℤ₆ is not a field: 2·3≡0 (mod 6), but neither factor is zero."]],["Abelian groups","A group has associativity, an identity and inverses; an abelian group also has commutativity.",["(ℤ,+) is an abelian group: identity 0, inverse of 8 is −8.","(ℚ∖{0},·) is an abelian group: identity 1, inverse of 2/5 is 5/2.","(ℕ,+) is not a group: the additive inverse −3 of 3 is not in ℕ."]],["Magma, semigroup, monoid, group","Magma: closed binary operation; semigroup adds associativity; monoid adds identity; group adds inverses; abelian adds commutativity.",["(ℕ₀,+) is a monoid: 0 is an identity, but 2 has no additive inverse.","Positive integers under multiplication form a commutative monoid; the inverse of 2 is absent.","Nonzero real numbers under multiplication form an abelian group."]],["Cancellation and inverses in groups","Left and right cancellation work even in nonabelian groups; multiply on the appropriate side.",["In additive notation, a+x=a+y ⇒ (−a)+(a+x)=(−a)+(a+y) ⇒ x=y.","ba=ca ⇒ (ba)a⁻¹=(ca)a⁻¹ ⇒ b=c.","ab=ac ⇒ a⁻¹(ab)=a⁻¹(ac) ⇒ b=c."]],["Fields and vector spaces","A field consists of two abelian groups linked by distributivity. Scalars in a vector space come from a field.",["ℝ² is a vector space over ℝ: 2·(1,3)=(2,6).","ℚ² is a vector space over ℚ: (1/2)(2,4)=(1,2).","Since ℤ is not a field, the corresponding structure is a ℤ-module, not a vector space over ℤ."]],["Characteristic of a field","The characteristic of a field is zero or a prime. A finite field cannot have characteristic zero.",["In ℚ no positive sum 1+⋯+1 equals 0: char(ℚ)=0.","In 𝔽₂, 1+1=0: char(𝔽₂)=2.","In 𝔽₅, 1+1+1+1+1=0: char(𝔽₅)=5."]],["Modular arithmetic","For modular addition or multiplication, compute first and then reduce the answer modulo n.",["17 mod 5=2 because 17=3·5+2.","In 𝔽₅, 4+3≡7≡2 (mod 5).","In 𝔽₇, 5·3≡15≡1 (mod 7), hence 5⁻¹=3."]],["Finite fields 𝔽₂ and 𝔽₃","𝔽ₚ is a field when p is prime. Addition modulo 2 equals XOR. A field has at least two elements.",["In 𝔽₂, 1+1=0 and 1·1=1.","In 𝔽₃, 2+2≡1 and 2·2≡1, so 2 is its own inverse.","In 𝔽₅, 2⁻¹=3 because 2·3≡1 (mod 5)."]],["Applications: bits, cube, Set!","Bit strings are vectors over 𝔽₂; Rubik's Cube moves form a nonabelian group; Set! cards can be modeled by 𝔽₃⁴.",["Bit strings: (1,0,1)+(1,1,0)=(0,1,1) (mod 2).","Rubik's Cube: turning the top then the right face generally differs from reversing their order.","Set!: A=(0,0,0,0), B=(1,1,1,1), C=(2,2,2,2); their sum is zero mod 3."]]];
