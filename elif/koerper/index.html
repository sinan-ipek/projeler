gn-items:center;gap:9px;margin-top:16px}.actions button{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--fg);font:inherit;font-weight:750;cursor:pointer}.actions .primary{background:var(--blue);color:white;border-color:var(--blue)}.actions button:disabled{opacity:.45;cursor:default}.count{font-size:13px;color:var(--muted)}.progress{height:7px;background:#ebf1f8;border-radius:9px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#2c75ee;transition:width .25s}.meta{font-size:12px;color:var(--muted);line-height:1.6}.foot{margin:20px 18px 7px;color:#929cab;font-size:11px}.visible-empty{padding:25px;color:var(--muted);border:1px dashed #cdd9e8;border-radius:14px}.pill{font-weight:780;color:#637b9b;font-size:12px;text-transform:uppercase;letter-spacing:.05em}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:950px){.shell{grid-template-columns:1fr}.box{padding:18px}.bar{flex-wrap:wrap}.brand{font-size:17px}}@media(max-width:580px){.topcontrols{width:100%;justify-content:flex-end}.topcontrols select{flex:1}.bar{padding:10px}.shell{padding:0 9px}.box{padding:15px}}

const topics=[{"tr":"Cisim nedir?","de":"Was ist ein Körper?","rule":"(K,+,·) · 0≠1","important":["Bir cisimde toplama ve çarpma tanımlıdır; sıfır dışındaki her elemanın çarpma tersi vardır.","In einem Körper sind Addition und Multiplikation definiert; jedes Element außer Null besitzt ein multiplikatives Inverses."],"examples":[["ℚ bir cisimdir: 2/3+1/6=5/6; (2/3)⁻¹=3/2.","ℚ ist ein Körper: 2/3+1/6=5/6; (2/3)⁻¹=3/2."],["ℝ bir cisimdir: √2·(1/√2)=1.","ℝ ist ein Körper: √2·(1/√2)=1."],["ℤ bir cisim değildir: 2'nin ℤ içinde çarpma tersi yoktur.","ℤ ist kein Körper: 2 besitzt in ℤ kein multiplikatives Inverses."]]},{"tr":"Dokuz cisim aksiyomu","de":"Die neun Körperaxiome","rule":"K1–K4: + · K5–K8: · · K9: dağılma / Distributivität","important":["K1/K5 birleşme; K2/K6 değişme; K3/K7 etkisiz eleman; K4/K8 ters eleman; K9 dağılma yasası.","K1/K5 Assoziativität; K2/K6 Kommutativität; K3/K7 neutrales Element; K4/K8 inverses Element; K9 Distributivgesetz."],"examples":[["Birleşme: (2+3)+4=2+(3+4)=9.","Assoziativität: (2+3)+4=2+(3+4)=9."],["Ters eleman: 7+(−7)=0; (3/5)·(5/3)=1.","Inverse: 7+(−7)=0; (3/5)·(5/3)=1."],["Dağılma: 3(4+5)=3·4+3·5=27.","Distributivität: 3(4+5)=3·4+3·5=27."]]},{"tr":"Sıfır, bir ve tersin tekliği","de":"Eindeutigkeit von Null, Eins und Inversen","rule":"a+0=a · a·1=a · a+(−a)=0","important":["Toplama etkisiz elemanı 0, çarpma etkisiz elemanı 1 tektir; ters eleman da tektir.","Die neutralen Elemente 0 und 1 sind eindeutig; ebenso das jeweilige inverse Element."],"examples":[["İki sıfır 0 ve e olsa: 0=0+e=e. Demek ki aynı elemandır.","Gäbe es zwei Nullen 0 und e: 0=0+e=e. Also sind sie identisch."],["a+b=0 ve a+c=0 ise b=b+0=b+(a+c)=(b+a)+c=0+c=c.","Aus a+b=0 und a+c=0 folgt b=b+0=b+(a+c)=(b+a)+c=0+c=c."],["3/4 elemanının çarpma tersi yalnızca 4/3'tür; 0'ın çarpma tersi yoktur.","Das multiplikative Inverse von 3/4 ist eindeutig 4/3; Null besitzt keines."]]},{"tr":"Cisimde temel ispatlar","de":"Grundlegende Beweise im Körper","rule":"0·a=0 · (−1)a=−a · (−1)(−1)=1","important":["Cisim aksiyomlarıyla bilinen hesap kuralları kanıtlanabilir; sonuçları aksiyom sanma.","Vertraute Rechenregeln folgen erst aus den Körperaxiomen; sie sind keine zusätzlichen Axiome."],"examples":[["0·a=(0+0)·a=0·a+0·a. İki taraftan 0·a çıkar: 0·a=0.","0·a=(0+0)·a=0·a+0·a. Addiere das additive Inverse: 0·a=0."],["a+(−1)a=(1+(−1))a=0a=0. Dolayısıyla (−1)a=−a.","a+(−1)a=(1+(−1))a=0a=0. Folglich (−1)a=−a."],["(−1)(−1)=−(−1)=1; iki eksi çarpılınca artı olur.","(−1)(−1)=−(−1)=1; Minus mal Minus ist Plus."]]},{"tr":"Sıfır bölen yokluğu","de":"Nullteilerfreiheit","rule":"ab=0 ⇔ a=0 veya b=0","important":["Cisimde sıfır bölen yoktur. İspatta a≠0 varsayılır ve a⁻¹ ile çarpılır.","In einem Körper gibt es keine Nullteiler. Für den Beweis nehme a≠0 an und multipliziere mit a⁻¹."],"examples":[["5x=0 (ℚ içinde): 5⁻¹=1/5 ⇒ x=0.","5x=0 (in ℚ): 5⁻¹=1/5 ⇒ x=0."],["(x−2)(x+3)=0 (ℝ içinde): x=2 veya x=−3.","(x−2)(x+3)=0 (in ℝ): x=2 oder x=−3."],["ℤ₆ bir cisim değil: 2·3≡0 (mod 6), fakat 2 ve 3 sıfır değil.","ℤ₆ ist kein Körper: 2·3≡0 (mod 6), aber 2 und 3 sind nicht Null."]]},{"tr":"Değişmeli grup","de":"Abelsche Gruppe","rule":"(M,∘): birleşme + etkisiz + ters + değişme","important":["Bir grup için birleşme, etkisiz ve ters eleman gerekir; değişme özelliği eklenirse değişmeli (Abel) grup olur.","Für eine Gruppe braucht man Assoziativität, ein neutrales und inverse Elemente; mit Kommutativität ist sie abelsch."],"examples":[["(ℤ,+) değişmeli gruptur: etkisiz eleman 0, 8'in tersi −8.","(ℤ,+) ist abelsch: neutrales Element 0, Inverses von 8 ist −8."],["(ℚ∖{0},·) değişmeli gruptur: etkisiz eleman 1, 2/5'in tersi 5/2.","(ℚ∖{0},·) ist abelsch: neutrales Element 1, Inverses von 2/5 ist 5/2."],["(ℕ,+) grup değildir: 3'ün toplama tersi −3, ℕ içinde yoktur.","(ℕ,+) ist keine Gruppe: −3 gehört nicht zu ℕ."]]},{"tr":"Magma, yarıgrup, monoid, grup","de":"Magma, Halbgruppe, Monoid, Gruppe","rule":"Magma ⊃ yarıgrup ⊃ monoid ⊃ grup","important":["Magma kapalı ikili işlem; yarıgrup ayrıca birleşme; monoid ayrıca etkisiz; grup ayrıca ters; değişmeli grup ayrıca değişme ister.","Magma: abgeschlossene Verknüpfung; Halbgruppe: zusätzlich assoziativ; Monoid: zusätzlich neutral; Gruppe: zusätzlich invers; abelsch: zusätzlich kommutativ."],"examples":[["(ℕ₀,+) monoidtir: 0 var, ama 2'nin toplama tersi yok.","(ℕ₀,+) ist ein Monoid: 0 ist neutral, aber 2 hat kein additives Inverses."],["Pozitif tam sayılar çarpma ile değişmeli monoiddir; 2'nin tersi kümede yok.","Positive ganze Zahlen unter Multiplikation bilden ein kommutatives Monoid; 2 hat dort kein Inverses."],["Sıfır olmayan gerçek sayılar çarpma ile değişmeli gruptur.","Die reellen Zahlen ohne Null bilden unter Multiplikation eine abelsche Gruppe."]]},{"tr":"Grupta sadeleştirme ve tersler","de":"Kürzen und Inverse in Gruppen","rule":"ba=ca ⇒ b=c ; ab=ac ⇒ b=c","important":["Değişme özelliği olmayan gruplarda da soldan ve sağdan sadeleştirme mümkündür; hangi taraftan çarptığına dikkat et.","Auch in nichtabelschen Gruppen darf man links und rechts kürzen; achte auf die Seite der Multiplikation."],"examples":[["a+x=a+y ⇒ a⁻¹(ax)=a⁻¹(ay) ⇒ x=y.","a+x=a+y (additiv) ⇒ (−a)+(a+x)=(−a)+(a+y) ⇒ x=y."],["ba=ca ⇒ (ba)a⁻¹=(ca)a⁻¹ ⇒ b=c.","ba=ca ⇒ (ba)a⁻¹=(ca)a⁻¹ ⇒ b=c."],["ab=ac ⇒ a⁻¹(ab)=a⁻¹(ac) ⇒ b=c.","ab=ac ⇒ a⁻¹(ab)=a⁻¹(ac) ⇒ b=c."]]},{"tr":"Cisim ve vektör uzayı bağı","de":"Körper und Vektorraum","rule":"(K,+) ve (K∖{0},·) değişmeli grup","important":["Cisim: iki değişmeli grup ve bunları bağlayan dağılma yasası. Vektör uzayındaki skalerler bir cisimden gelir.","Ein Körper besteht aus zwei abelschen Gruppen plus Distributivgesetz. Skalare eines Vektorraums kommen aus einem Körper."],"examples":[["ℝ², ℝ üzerinde vektör uzayıdır: 2·(1,3)=(2,6).","ℝ² ist ein Vektorraum über ℝ: 2·(1,3)=(2,6)."],["ℚ², ℚ üzerinde vektör uzayıdır: (1/2)(2,4)=(1,2).","ℚ² ist ein Vektorraum über ℚ: (1/2)(2,4)=(1,2)."],["(ℤ,+,·) cisim olmadığından standart anlamda ℤ üzerinde vektör uzayı tanımlamayız; ℤ-modül tanımlarız.","Da ℤ kein Körper ist, spricht man nicht von einem Vektorraum über ℤ, sondern von einem ℤ-Modul."]]},{"tr":"Karakteristik","de":"Charakteristik","rule":"char(K)=en küçük n>0: n·1=0; yoksa 0","important":["Bir cismin karakteristiği sıfır ya da asal sayıdır. Sonlu cisimlerde karakteristik sıfır olamaz.","Die Charakteristik eines Körpers ist 0 oder eine Primzahl. Endliche Körper haben positive Charakteristik."],"examples":[["ℚ'da 1+⋯+1 hiçbir pozitif n için 0 olmaz: char(ℚ)=0.","In ℚ ist 1+⋯+1 für kein positives n gleich 0: char(ℚ)=0."],["𝔽₂ içinde 1+1=0: char(𝔽₂)=2.","In 𝔽₂ gilt 1+1=0: char(𝔽₂)=2."],["𝔽₅ içinde 1+1+1+1+1=0: char(𝔽₅)=5.","In 𝔽₅ gilt 1+1+1+1+1=0: char(𝔽₅)=5."]]},{"tr":"Modüler aritmetik","de":"Modulare Arithmetik","rule":"a mod n = bölmenin kalanı (0≤r<n)","important":["Modüler toplama ve çarpmada işlem yapılır, sonra n'ye bölümünden kalan alınır.","Bei modularer Addition und Multiplikation berechnet man zuerst die Operation und anschließend den Rest modulo n."],"examples":[["17 mod 5=2, çünkü 17=3·5+2.","17 mod 5=2, denn 17=3·5+2."],["𝔽₅ içinde 4+3≡7≡2 (mod 5).","In 𝔽₅ gilt 4+3≡7≡2 (mod 5)."],["𝔽₇ içinde 5·3≡15≡1 (mod 7); bu yüzden 5⁻¹=3.","In 𝔽₇ gilt 5·3≡15≡1 (mod 7); daher 5⁻¹=3."]]},{"tr":"Sonlu cisimler 𝔽₂ ve 𝔽₃","de":"Endliche Körper 𝔽₂ und 𝔽₃","rule":"𝔽ₚ={0,…,p−1}, p asal","important":["𝔽ₚ, p asal olduğunda cisimdir. Mod 2 toplama XOR ile aynıdır. Bir cismin eleman sayısı en az 2'dir.","𝔽ₚ ist für primzahliges p ein Körper. Addition modulo 2 entspricht XOR. Jeder Körper hat mindestens zwei Elemente."],"examples":[["𝔽₂: 1+1=0; 1·1=1 (mod 2).","𝔽₂: 1+1=0; 1·1=1 (mod 2)."],["𝔽₃: 2+2≡1; 2·2≡1 (mod 3), yani 2 kendi tersidir.","𝔽₃: 2+2≡1; 2·2≡1 (mod 3); 2 ist sein eigenes Inverses."],["𝔽₅: 2⁻¹=3 çünkü 2·3≡1 (mod 5).","𝔽₅: 2⁻¹=3, denn 2·3≡1 (mod 5)."]]},{"tr":"Uygulamalar: bitler, küp, Set!","de":"Anwendungen: Bits, Würfel, Set!","rule":"𝔽₂ⁿ · grup işlemleri · 𝔽₃⁴","important":["Bit dizileri 𝔽₂ üzerinde vektörlerdir; Rubik küpünün hamleleri değişmeli olmayan grup oluşturur; Set! kartları 𝔽₃⁴ ile modellenir.","Bitfolgen sind Vektoren über 𝔽₂; Rubik-Würfel-Züge bilden eine nichtabelsche Gruppe; Set!-Karten lassen sich als 𝔽₃⁴ modellieren."],"examples":[["Bit dizileri: (1,0,1)+(1,1,0)=(0,1,1) (mod 2).","Bitfolgen: (1,0,1)+(1,1,0)=(0,1,1) (mod 2)."],["Rubik küpü: Önce üst yüz, sonra sağ yüz döndürmek genelde ters sıradan farklı sonuç verir.","Zauberwürfel: Erst die obere, dann die rechte Seite zu drehen ergibt meist ein anderes Ergebnis als in umgekehrter Reihenfolge."],["Set!: A=(0,0,0,0), B=(1,1,1,1), C=(2,2,2,2); A+B+C=(0,0,0,0) mod 3.","Set!: A=(0,0,0,0), B=(1,1,1,1), C=(2,2,2,2); A+B+C=(0,0,0,0) mod 3."]]}];
const ui={"tr":{"name":"Cisimler ve Gruplar","subtitle":"MAFI 1 • TU Dortmund • Konu anlatımı","selector":"Konu seç","important":"Bilmen gerekenler","examples":"Çözümlü örnekler","step":"Örnek","next":"Sonraki örnek","more":"Sonraki konu","prev":"Önceki konu","all":"Tüm örnekleri göster","help":"Konu seç. Sağdaki örnekleri tek tek aç. Türkçe ve Almanca arasında geçiş yapabilirsin.","footer":"v2.0 · 13 konu · her konuda 3 çözümlü örnek · iki dil","hint":"Örnekler sırayla açılır. Konu menüsüyle istediğin yere gidebilirsin.","source":"Kaynak: TU Dortmund, Mathematik für Informatik 1, Körper (45 sayfa)."},"de":{"name":"Körper und Gruppen","subtitle":"MAFI 1 • TU Dortmund • Lernpräsentation","selector":"Thema wählen","important":"Das musst du wissen","examples":"Gelöste Beispiele","step":"Beispiel","next":"Nächstes Beispiel","more":"Nächstes Thema","prev":"Vorheriges Thema","all":"Alle Beispiele zeigen","help":"Wähle ein Thema. Öffne die Beispiele rechts Schritt für Schritt. Du kannst zwischen Deutsch und Türkisch wechseln.","footer":"v2.0 · 13 Themen · je 3 gelöste Beispiele · zweisprachig","hint":"Die Beispiele erscheinen nacheinander. Mit dem Menü kannst du jedes Thema direkt öffnen.","source":"Quelle: TU Dortmund, Mathematik für Informatik 1, Körper (45 Seiten)."}};
const lessonData=[{"p":"3–10","tr":[["Temel fikir","Sayıların görünüşleri farklı olsa da aynı işlem kurallarını sağlayabilirler. ℚ, ℝ ve ℂ için ortak kuralları tek tek tekrar etmek yerine (K,+,·) yapısını inceleriz. K bir küme; + ve · ise K×K→K biçiminde, sonuçları yine K içinde kalan iki işlemdir."],["Tanımın anlamı","Cisim olması için toplama ve çarpma kurallarının tamamı sağlanmalıdır. Özellikle her a≠0 için a·a⁻¹=1 olacak a⁻¹∈K bulunmalıdır. Sıfıra bu koşul uygulanmaz; ayrıca 0 ile 1 birbirinden farklıdır."],["Nasıl kontrol edilir?","Önce işlemlerin küme içinde kapalı olduğuna, sonra aksiyomlara bak. Bir özelliğin tek bir karşı-örnekle bozulması cisim olmamaya yeter; örneğin (ℤ,+,·) içinde 2'nin çarpma tersi bulunmaz."],["Sınavda dikkat","Bir cismin işlemleri mutlaka alışılmış toplama ve çarpma olmak zorunda değildir; ⊕ ve ⊙ gibi başka işlemler de olabilir. İşlemleri yalnızca sembollerinden değil, verilen tanımlarından hareketle kontrol et."]],"de":[["Grundidee","Obwohl Zahlenmengen verschieden aussehen, können sie dieselben Rechengesetze erfüllen. Statt die Regeln für ℚ, ℝ und ℂ immer wieder aufzuschreiben, untersuchen wir die Struktur (K,+,·). Die beiden Operationen bilden K×K nach K ab."],["Die Definition verstehen","Alle Körperaxiome müssen gelten. Insbesondere besitzt jedes a≠0 ein Element a⁻¹∈K mit a·a⁻¹=1. Für die Null wird dies gerade nicht verlangt; zudem gilt 0≠1."],["Prüfstrategie","Kontrolliere zuerst die Abgeschlossenheit der Operationen und dann die Axiome. Ein einziges Gegenbeispiel reicht, um zu zeigen, dass etwas kein Körper ist: In ℤ besitzt 2 kein multiplikatives Inverses."],["Prüfungshinweis","Die Operationen müssen nicht die üblichen + und · sein; man kann sie auch ⊕ und ⊙ nennen. Entscheidend sind die angegebenen Definitionen, nicht das Symbol."]],"en":[["Core idea","Different number systems can obey the same arithmetic rules. Instead of checking the rules separately for ℚ, ℝ and ℂ, we study a structure (K,+,·), where each operation maps K×K into K."],["Meaning of the definition","Every field axiom must hold. In particular, for every nonzero a there is a multiplicative inverse a⁻¹∈K satisfying a·a⁻¹=1. Zero is excluded, and 0≠1."],["How to check","First verify closure, then examine each axiom. One counterexample is enough to disprove the field property: 2 has no multiplicative inverse inside ℤ."],["Exam tip","The operations need not be ordinary addition and multiplication; they may be denoted by ⊕ and ⊙. Use their definitions, not their symbols."]]},{"p":"3–10, 19","tr":[["Toplama aksiyomları K1–K4","K1 birleşme: (a+b)+c=a+(b+c). K2 değişme: a+b=b+a. K3 etkisiz eleman: a+0=a. K4 toplama tersi: her a için a+(−a)=0. Bu dört kural (K,+) yapısını değişmeli grup yapar."],["Çarpma aksiyomları K5–K8","K5 birleşme: (ab)c=a(bc). K6 değişme: ab=ba. K7 çarpmanın etkisiz elemanı: a·1=a ve 0≠1. K8 yalnızca sıfır dışındaki her a için a·a⁻¹=1. Dolayısıyla (K∖{0},·) değişmeli gruptur."],["İki işlemin bağlantısı K9","Dağılma yasası: a(b+c)=ab+ac. Çarpmanın toplamaya dağıldığını söyler. PDF'de sağdan dağılma, çarpmanın değişme özelliğiyle türetiliyor: (a+b)c=c(a+b)=ca+cb=ac+bc."],["Neden ezberlemek yerine ayırmalısın?","İspatta hangi aksiyomu kullandığını söylemek önemlidir. Örneğin parantezin yerini değiştirmek birleşme, elemanların sırasını değiştirmek değişme özelliğidir; bunlar aynı şey değildir."]],"de":[["Addition: K1–K4","K1 Assoziativität: (a+b)+c=a+(b+c). K2 Kommutativität: a+b=b+a. K3 neutrales Element 0. K4 additives Inverses −a. Damit ist (K,+) eine abelsche Gruppe."],["Multiplikation: K5–K8","K5 Assoziativität: (ab)c=a(bc). K6 Kommutativität: ab=ba. K7 neutrales Element 1 mit 0≠1. K8 jedes a≠0 besitzt a⁻¹. Daher ist (K∖{0},·) eine abelsche Gruppe."],["Verbindung: K9","Distributivität: a(b+c)=ab+ac. Das rechte Distributivgesetz folgt aus der Kommutativität: (a+b)c=c(a+b)=ca+cb=ac+bc."],["Wichtiger Unterschied","Beim Beweis die benutzten Axiome benennen. Klammern anders setzen ist Assoziativität; die Reihenfolge vertauschen ist Kommutativität. Das sind verschiedene Regeln."]],"en":[["Addition: K1–K4","K1 associativity: (a+b)+c=a+(b+c); K2 commutativity: a+b=b+a; K3 identity 0; K4 additive inverse −a. Thus (K,+) is an abelian group."],["Multiplication: K5–K8","K5 associativity: (ab)c=a(bc); K6 commutativity: ab=ba; K7 identity 1 with 0≠1; K8 inverse a⁻¹ for every a≠0. Hence (K∖{0},·) is an abelian group."],["Connection: K9","Distributivity means a(b+c)=ab+ac. Right distributivity follows by commutativity: (a+b)c=c(a+b)=ca+cb=ac+bc."],["Key distinction","State which axiom is used. Moving parentheses invokes associativity; swapping the order invokes commutativity. These are not the same rule."]]},{"p":"11–12","tr":[["Etkisiz elemanın tekliği","İki toplama etkisiz elemanı 0 ve e olduğunu varsayalım. 0, e ile toplandığında 0+e=e (0 etkisiz olduğundan); aynı zamanda 0+e=0 (e etkisiz olduğundan). Buradan e=0 gelir. Aynı mantık çarpmanın 1 elemanı için geçerlidir."],["Ters elemanın tekliği","a'nın iki toplama tersi b ve c olsaydı b=b+0=b+(a+c)=(b+a)+c=0+c=c. Böylece −a tektir. Sıfır dışındaki elemanların çarpma terslerinin tekliği de benzer biçimde gösterilir."],["Neden a≠0 koşulu var?","0·x=0 olduğundan 0·x=1 eşitliği hiçbir x için sağlanamaz (0≠1). Bu yüzden 0'ın çarpma tersi yoktur. Buna karşılık 0'ın toplama tersi yine 0'dır."],["İspat tekniği","Bir elemanın tekliğini göstermek için aynı özelliği sağlayan iki aday alıp birbirlerine eşit olduklarını ispatla. Bu yöntem ileride vektör uzayındaki sıfır vektör ve ters vektör için de kullanılır."]],"de":[["Eindeutigkeit des neutralen Elements","Angenommen, 0 und e seien additive neutrale Elemente. Dann gilt 0+e=e (weil 0 neutral ist), zugleich 0+e=0 (weil e neutral ist). Also e=0. Für die Eins folgt die Eindeutigkeit analog."],["Eindeutigkeit des Inversen","Hätte a zwei additive Inverse b und c, so gilt b=b+0=b+(a+c)=(b+a)+c=0+c=c. Also ist −a eindeutig. Dasselbe Argument funktioniert für multiplikative Inverse von a≠0."],["Warum a≠0?","Wegen 0·x=0 ist 0·x=1 unmöglich, da 0≠1. Somit besitzt 0 kein multiplikatives Inverses; sein additives Inverses ist hingegen 0."],["Beweismethode","Um Eindeutigkeit zu zeigen, nimmt man zwei mögliche Kandidaten und beweist, dass sie gleich sind. Dieselbe Methode wird später bei Vektorräumen verwendet."]],"en":[["Uniqueness of identities","Suppose 0 and e are additive identities. Then 0+e=e because 0 is an identity, and 0+e=0 because e is an identity. Thus e=0. The same argument proves uniqueness of 1."],["Uniqueness of inverses","If b and c are both additive inverses of a, then b=b+0=b+(a+c)=(b+a)+c=0+c=c. A similar proof works for multiplicative inverses of a≠0."],["Why a≠0?","Since 0·x=0, the equation 0·x=1 is impossible when 0≠1. Zero has no multiplicative inverse, but its additive inverse is zero."],["Proof technique","To prove uniqueness, assume two candidates exist and show they must coincide. This method is reused in vector spaces."]]},{"p":"12–19","tr":[["0 ile çarpma neden sıfırdır?","0·a=(0+0)·a=0·a+0·a. Her iki tarafa 0·a'nın toplama tersini ekleyince 0=0·a çıkar. Bu sonuç PDF'de ayrı bir önerme olarak kanıtlanıyor; aksiyom diye kabul edilmiyor."],["(−1)a=−a nasıl çıkar?","a+(−1)a=1·a+(−1)·a=(1+(−1))·a=0·a=0. Demek ki (−1)a, a'nın toplama tersidir. Tersin tekliği nedeniyle (−1)a=−a."],["İki eksinin çarpımı","(−1)(−1)=−(−1)=1. Bu, bir önceki özelliğin a=−1 için uygulanması ve −1'in toplama tersinin 1 olmasıyla anlaşılır."],["İspatın omurgası","Sadece sayı yerleştirmek yerine aksiyomlar arasında zincir kur: etkisiz eleman → dağılma → ters eleman → tek olma. PDF 13–17. sayfalarda bu zinciri satır satır gösterir."]],"de":[["Warum ist 0·a=0?","0·a=(0+0)·a=0·a+0·a. Addiert man auf beiden Seiten das additive Inverse von 0·a, erhält man 0=0·a. Das ist ein Satz, kein zusätzliches Axiom."],["Wie folgt (−1)a=−a?","a+(−1)a=1·a+(−1)·a=(1+(−1))·a=0·a=0. Also ist (−1)a das additive Inverse von a; wegen dessen Eindeutigkeit gilt (−1)a=−a."],["Minus mal Minus","(−1)(−1)=−(−1)=1. Wende die vorangegangene Regel auf a=−1 an und beachte, dass das additive Inverse von −1 die 1 ist."],["Beweisstruktur","Verbinde die Axiome: neutrales Element → Distributivität → Inverses → Eindeutigkeit. Die PDF-Seiten 13–17 führen diese Kette schrittweise vor."]],"en":[["Why is 0·a=0?","0·a=(0+0)·a=0·a+0·a. Add the additive inverse of 0·a to both sides to obtain 0=0·a. This is a theorem, not another axiom."],["Deriving (−1)a=−a","a+(−1)a=1·a+(−1)·a=(1+(−1))·a=0·a=0. Hence (−1)a is the additive inverse of a; uniqueness gives (−1)a=−a."],["Negative times negative","(−1)(−1)=−(−1)=1. Apply the previous rule with a=−1 and note that the additive inverse of −1 is 1."],["Proof structure","Build a chain: identity → distributivity → inverse → uniqueness. The PDF develops these identities step by step on pages 13–17."]]},{"p":"18–19","tr":[["İfadenin anlamı","a·b=0 ise en az bir çarpan sıfırdır. Bu, herhangi bir halkada zorunlu değildir; cisimlerin ayırt edici özelliklerindendir."],["İspat","a·b=0 ve a≠0 olsun. a'nın çarpma tersi vardır. a⁻¹(ab)=(a⁻¹a)b=1·b=b, öte yandan a⁻¹·0=0. Dolayısıyla b=0. a=0 durumunda sonuç zaten doğrudur."],["Neden denklemlerde işe yarar?","(x−2)(x+3)=0 gibi ifadeyi iki ayrı durumla çözeriz. Bu mantığı ℤ₆ içinde kullanmak yanlış olur; çünkü 2·3≡0 (mod 6) iken ne 2 ne 3 sıfırdır."],["Kavramsal bağlantı","Çarpma tersiyle sadeleştirme yalnızca sıfır olmayan çarpan için yapılabilir. Her iki tarafı sıfıra bölmek veya sıfırın tersini kullanmak geçersizdir."]],"de":[["Bedeutung","Aus a·b=0 folgt, dass mindestens einer der Faktoren Null ist. Diese Eigenschaft gilt nicht in jedem Ring, wohl aber in jedem Körper."],["Beweis","Seien ab=0 und a≠0. Dann existiert a⁻¹. Es gilt a⁻¹(ab)=(a⁻¹a)b=1·b=b, während a⁻¹·0=0 ist. Also b=0. Für a=0 ist die Aussage bereits erfüllt."],["Anwendung auf Gleichungen","Aus (x−2)(x+3)=0 ergeben sich zwei Fälle. In ℤ₆ wäre diese Argumentation unzulässig, denn 2·3≡0 (mod 6), obwohl beide Faktoren ungleich Null sind."],["Verbindung zum Kürzen","Mit einem Faktor darf man nur dann kürzen, wenn er ungleich Null ist und damit ein Inverses besitzt. Division durch Null ist nicht erlaubt."]],"en":[["Meaning","If a·b=0, at least one factor is zero. This fails in some rings but is guaranteed in every field."],["Proof","Suppose ab=0 and a≠0. Then a⁻¹ exists. Multiplying gives a⁻¹(ab)=(a⁻¹a)b=b, while a⁻¹·0=0. Hence b=0. If a=0 the result is immediate."],["Solving equations","The equation (x−2)(x+3)=0 splits into two cases. Do not use the same reasoning in ℤ₆: 2·3≡0 (mod 6) even though both factors are nonzero."],["Connection to cancellation","You may cancel a factor only when it is nonzero and has an inverse. Dividing by zero is invalid."]]},{"p":"22–25","tr":[["Grup nedir?","Bir küme M ve üzerinde ∘ ikili işlemi verilsin. İşlem birleşmeli olmalı; bir etkisiz eleman e bulunmalı; her a için işlem altında ters a⁻¹ bulunmalıdır. Bu üç koşul grup oluşturur."],["Değişmeli (Abel) grup","Bunlara ek olarak a∘b=b∘a her a,b için doğruysa grup değişmelidir. Örneğin (ℤ,+) değişmelidir. Ama bütün gruplar değişmeli değildir."],["Toplamsal ve çarpımsal gösterim","Toplamsal gösterimde etkisiz 0, ters −a; çarpımsal gösterimde etkisiz 1, ters a⁻¹ yazılır. Genel bir işlem için ∘ ve e sembolleri kullanılır."],["İki önemli karşılaştırma","(ℤ,+) değişmeli gruptur ama (ℤ,·) grup değildir: 2'nin çarpma tersi ℤ'de yoktur. (ℚ∖{0},·) ise değişmeli gruptur."]],"de":[["Was ist eine Gruppe?","Gegeben sind eine Menge M und eine binäre Verknüpfung ∘. Sie muss assoziativ sein; es muss ein neutrales Element e geben; und jedes a besitzt ein inverses Element a⁻¹. Diese drei Bedingungen definieren eine Gruppe."],["Abelsche Gruppe","Gilt zusätzlich a∘b=b∘a für alle a,b, ist die Gruppe abelsch. Zum Beispiel ist (ℤ,+) abelsch, aber nicht jede Gruppe ist kommutativ."],["Additive und multiplikative Schreibweise","Additiv heißen das neutrale Element 0 und das Inverse −a; multiplikativ schreibt man 1 und a⁻¹. Allgemein kann man ∘ und e benutzen."],["Vergleich","(ℤ,+) ist abelsch, aber (ℤ,·) ist keine Gruppe, weil 2 dort kein multiplikatives Inverses besitzt. Dagegen ist (ℚ∖{0},·) abelsch."]],"en":[["Definition of a group","A set M with a binary operation ∘ is a group if the operation is associative, an identity e exists, and every element a has an inverse a⁻¹."],["Abelian groups","If a∘b=b∘a for all a,b, the group is abelian. For instance, (ℤ,+) is abelian, but not every group is commutative."],["Two notations","Additive notation uses identity 0 and inverse −a; multiplicative notation uses 1 and a⁻¹. General notation uses ∘ and e."],["Comparison","(ℤ,+) is abelian, whereas (ℤ,·) is not a group because 2 has no inverse in ℤ. By contrast (ℚ∖{0},·) is abelian."]]},{"p":"25–26","tr":[["Yapıların basamakları","Magma yalnızca küme içinde kapalı bir ikili işlem gerektirir. İşlem birleşmeliyse yarıgrup; ayrıca etkisiz eleman varsa monoid; her elemanın tersi de varsa grup olur."],["Değişmelilik ayrıca kontrol edilir","a∘b=b∘a eklenirse değişmeli grup elde edilir. PDF bu sınıflandırmayı farklı aksiyom kümelerinden yola çıkarak veriyor."],["Örneklerle karşılaştır","(ℕ₀,+) bir monoiddir; 0 etkisizdir ama pozitif sayıların toplama tersi yoktur. (ℤ,+) değişmeli gruptur. (ℤ∖{0},·) çarpma işleminde monoidtir ama grup değildir."],["Yaygın hata","Bir işlemin etkisiz elemanı varsa otomatik olarak her elemanın tersi bulunduğunu sanma. Monoid ile grup arasındaki temel fark bu ters eleman koşuludur."]],"de":[["Hierarchie der Strukturen","Ein Magma hat eine abgeschlossene binäre Verknüpfung. Ist diese assoziativ, erhält man eine Halbgruppe; mit neutralem Element einen Monoid; mit Inversen für alle Elemente eine Gruppe."],["Zusätzlich kommutativ","Wenn darüber hinaus a∘b=b∘a gilt, entsteht eine abelsche Gruppe. Die PDF ordnet die Strukturen nach ihren Axiomen."],["Vergleich","(ℕ₀,+) ist ein Monoid: 0 ist neutral, aber positive Zahlen besitzen keine additiven Inversen. (ℤ,+) ist abelsch. (ℤ∖{0},·) ist ein Monoid, aber keine Gruppe."],["Häufiger Fehler","Aus der Existenz eines neutralen Elements folgt nicht die Existenz von Inversen. Genau das unterscheidet einen Monoid von einer Gruppe."]],"en":[["Hierarchy","A magma only needs a closed binary operation. Associativity makes a semigroup; an identity makes a monoid; inverses for every element make a group."],["Add commutativity","Adding a∘b=b∘a yields an abelian group. The PDF organizes these structures by which axioms they satisfy."],["Compare examples","(ℕ₀,+) is a monoid: zero is an identity but positive integers have no additive inverses. (ℤ,+) is abelian. (ℤ∖{0},·) is a monoid but not a group."],["Common pitfall","Having an identity does not imply that every element has an inverse. That is the decisive difference between monoids and groups."]]},{"p":"28–29","tr":[["Soldan ve sağdan sadeleştirme","Grupta b∘a=c∘a ise sağdan a⁻¹ ile çarpıp b=c buluruz. a∘b=a∘c ise soldan a⁻¹ ile çarpıp b=c elde ederiz. İşlemin değişmeli olması gerekmez."],["Terslerin yönleri","Değişmeli olmayan grupta çarpmanın sırası önemlidir. (ba)a⁻¹=b(aa⁻¹) doğru bir sadeleştirmedir; rastgele yer değiştirmek doğru değildir."],["Sağ ters ve sağ etkisiz","PDF'de sağ tersin sol ters, sağ etkisizin sol etkisiz olduğu gösteriliyor. Bunun nedeni yalnızca birleşme, etkisiz eleman ve ters aksiyomlarıdır; değişme aksiyomu kullanılmaz."],["İspat şablonu","Eşitliğin iki tarafına aynı taraftan ters elemanı uygula, birleşme özelliğiyle grupla ve etkisiz elemanı sadeleştir. Bu şablon soru çözümünde sık çıkar."]],"de":[["Links und rechts kürzen","In einer Gruppe folgt aus b∘a=c∘a durch Rechtsmultiplikation mit a⁻¹ die Gleichheit b=c. Aus a∘b=a∘c folgt b=c durch Linksmultiplikation. Kommutativität ist nicht erforderlich."],["Reihenfolge ist wichtig","In nichtabelschen Gruppen kommt es auf die Reihenfolge an. (ba)a⁻¹=b(aa⁻¹) ist erlaubt; willkürliches Vertauschen nicht."],["Rechtsinvers und rechtsneutral","In der PDF wird gezeigt, dass Rechtsinverse auch Linksinverse und rechtsneutrale Elemente auch linksneutral sind, ohne das Kommutativitätsaxiom zu verwenden."],["Beweisschema","Multipliziere beide Seiten auf derselben geeigneten Seite mit dem Inversen, klammere mit Assoziativität um und verwende das neutrale Element."]],"en":[["Left and right cancellation","In a group, b∘a=c∘a implies b=c by multiplying on the right by a⁻¹. Likewise a∘b=a∘c implies b=c by multiplying on the left. Commutativity is unnecessary."],["Order matters","In nonabelian groups the order of factors matters. (ba)a⁻¹=b(aa⁻¹) is valid; arbitrary reordering is not."],["Right versus left identities","The PDF proves that right inverses are also left inverses and right identities are also left identities without assuming commutativity."],["Proof pattern","Multiply both sides by the inverse on the correct side, reassociate, and simplify using the identity."]]},{"p":"20–22, 30","tr":[["Cisim-grup ilişkisi","Bir cisimde (K,+) değişmeli grup, (K∖{0},·) da değişmeli gruptur. Bu iki yapı bağımsız değildir: dağılma yasası onları bağlar."],["Vektör uzayındaki skaler","Vektörler bir vektör uzayına aitken, skalerler bir cisimden gelir. ℝ üzerindeki vektör uzayı ile ℂ üzerindeki vektör uzayı farklı yapılardır; hangi cismin kullanıldığı belirtilmelidir."],["PDF'deki Satz 2.32","(K,+,·) bir cisimdir ancak ve ancak (K,+) ve (K∖{0},·) değişmeli gruplardır ve dağılma yasası sağlanır. Bu, dokuz aksiyomun daha düzenli yazımıdır."],["Neden programlamada önemli?","Bit dizileri üzerinde 𝔽₂, üçlü koordinatlar üzerinde 𝔽₃ gibi farklı skaler cisimler kullanılabilir. Vektör uzayının kuralları aynı kalırken hesaplamalar değişir."]],"de":[["Zusammenhang","In einem Körper ist (K,+) eine abelsche Gruppe und (K∖{0},·) ebenfalls eine. Beide Strukturen werden durch das Distributivgesetz verbunden."],["Skalare von Vektorräumen","Vektoren gehören zum Vektorraum, ihre Skalare zu einem Körper. Ein Vektorraum über ℝ und einer über ℂ sind unterschiedliche Strukturen; der zugrunde liegende Körper muss angegeben werden."],["Satz 2.32 der PDF","(K,+,·) ist genau dann ein Körper, wenn (K,+) und (K∖{0},·) abelsche Gruppen sind und die Distributivität gilt. Das ist eine übersichtliche Fassung der neun Axiome."],["Informatikbezug","Bitfolgen über 𝔽₂ oder Koordinaten über 𝔽₃ nutzen verschiedene Skalarkörper. Die Vektorraumregeln bleiben, die konkrete Arithmetik ändert sich."]],"en":[["Field-group connection","In a field, (K,+) and (K∖{0},·) are both abelian groups, tied together by distributivity."],["Scalars in vector spaces","Vectors belong to a vector space; scalars come from a field. A vector space over ℝ is not the same structure as one over ℂ: the scalar field must be stated."],["The PDF's Theorem 2.32","(K,+,·) is a field if and only if (K,+) and (K∖{0},·) are abelian groups and distributivity holds. This reorganizes the nine axioms."],["Computer science connection","Bit strings over 𝔽₂ and coordinates over 𝔽₃ use different scalar fields. Vector-space axioms remain the same while arithmetic changes."]]},{"p":"32–34","tr":[["Karakteristik nasıl tanımlanır?","n·1 ifadesi, 1'in n kez toplanmasıdır. Pozitif n için n·1=0 ilk kez gerçekleşiyorsa en küçük böyle n, char(K)'dir. Hiç gerçekleşmiyorsa karakteristik 0'dır."],["Neden asal sayı?","Karakteristik n=rs şeklinde bileşik olsaydı (r·1)(s·1)=n·1=0 olurdu. Cisimde sıfır bölen bulunmadığından r·1=0 veya s·1=0 çıkar; bu da n'nin en küçük pozitif sayı olmasına ters düşer."],["Sıfır karakteristik","ℚ, ℝ ve ℂ içinde 1'i pozitif sayıda toplarsan asla 0 elde etmezsin; hepsinin karakteristiği 0'dır."],["Sınavda önemli mantık ayrımı","'Karakteristik sıfırdan farklıysa asaldır' önermesi tek başına sonlu cisimlerin varlığını kanıtlamaz. Sonlu cisim örneği ayrıca inşa edilir; PDF özellikle bu ayrımı vurgular."]],"de":[["Definition","n·1 bezeichnet die Summe aus n Einsen. Gibt es ein kleinstes positives n mit n·1=0, so ist dieses n die Charakteristik char(K). Sonst gilt char(K)=0."],["Warum prim?","Wäre n=rs zusammengesetzt, dann (r·1)(s·1)=n·1=0. Da ein Körper keine Nullteiler besitzt, müsste r·1=0 oder s·1=0 gelten; das widerspricht der Minimalität von n."],["Charakteristik Null","In ℚ, ℝ und ℂ wird eine positive Summe von Einsen nie gleich Null. Daher besitzen alle drei Körper Charakteristik 0."],["Logischer Hinweis","Der Satz 'char(K)≠0 ⇒ char(K) ist prim' beweist allein nicht die Existenz endlicher Körper. Diese müssen separat konstruiert werden; darauf weist die PDF ausdrücklich hin."]],"en":[["Definition","n·1 denotes a sum of n copies of 1. If a smallest positive n satisfies n·1=0, that n is char(K). If none exists, char(K)=0."],["Why prime?","If n=rs were composite, then (r·1)(s·1)=n·1=0. A field has no zero divisors, so r·1=0 or s·1=0, contradicting the minimality of n."],["Characteristic zero","In ℚ, ℝ and ℂ no positive sum of copies of 1 equals zero. Thus all have characteristic zero."],["Logic warning","The statement 'nonzero characteristic is prime' does not itself prove that finite fields exist. They must be constructed separately, as the PDF emphasizes."]]},{"p":"34–35","tr":[["Bölme ve kalan","m mod n=r demek m=k·n+r, 0≤r<n olacak tamsayı k bulunduğu anlamına gelir (n>0). Sonuç, n'ye bölümün kalanıdır."],["İşlem sırası","𝔽ₚ içindeki a⊕b=(a+b) mod p ve a⊙b=(ab) mod p. Önce normal toplama ya da çarpma yapılır, ardından sonuç 0 ile p−1 arasındaki temsilciye indirilir."],["Eşdeğerlik bağlantısı","a≡b (mod n) ifadesi n sayısının a−b farkını böldüğü anlamına gelir. Böylece farklı tamsayılar aynı kalan sınıfını temsil edebilir."],["Sık hata","m mod n sonucunu n'ye eşit yazma; kalan her zaman 0≤r<n koşulunu sağlar. Ayrıca mod 6 gibi bileşik modüllerde sıfır dışındaki her elemanın tersi bulunmaz."]],"de":[["Division mit Rest","m mod n=r bedeutet: Es gibt eine ganze Zahl k mit m=kn+r und 0≤r<n (n>0). Der Modulo-Wert ist der Rest der Division."],["Rechenreihenfolge","In 𝔽ₚ gelten a⊕b=(a+b) mod p und a⊙b=(ab) mod p. Zuerst wird gerechnet, anschließend auf den Vertreter zwischen 0 und p−1 reduziert."],["Kongruenz","a≡b (mod n) bedeutet, dass n die Differenz a−b teilt. Verschiedene ganze Zahlen repräsentieren dieselbe Restklasse."],["Häufiger Fehler","Ein Rest kann nie gleich n sein; stets gilt 0≤r<n. Bei zusammengesetztem Modul wie 6 besitzt zudem nicht jedes Element ungleich Null ein Inverses."]],"en":[["Division with remainder","m mod n=r means m=kn+r for some integer k, with 0≤r<n and n>0. Modulo returns the remainder."],["Order of operations","In 𝔽ₚ, a⊕b=(a+b) mod p and a⊙b=(ab) mod p. Compute first, then reduce to a representative from 0 to p−1."],["Congruence","a≡b (mod n) means n divides a−b. Different integers may represent the same remainder class."],["Common error","A remainder is never equal to n: 0≤r<n. With a composite modulus such as 6, nonzero elements may lack inverses."]]},{"p":"34–37","tr":[["𝔽ₚ yapısı","p asal olmak üzere 𝔽ₚ={0,1,…,p−1}. Toplama ve çarpma p'ye göre kalan alınarak yapılır. Her sıfır dışı sınıfın çarpma tersi bulunduğu için bu yapı cisimdir."],["𝔽₂: iki eleman","𝔽₂={0,1}. 1+1=0 (mod 2), 1·1=1. Toplama işlemi XOR ile aynı doğruluk tablosunu verir; bilişimde bu nedenle çok kullanılır."],["𝔽₃: üç eleman","𝔽₃={0,1,2}. 2+2=1 ve 2·2=1 olur. 2'nin çarpma tersi yine 2'dir, çünkü çarpımları 1 kalanı verir."],["Neden asal şartı?","Mod 4'te 2·2≡0 olmasına rağmen 2≠0'dır; sıfır bölen ortaya çıkar. Dolayısıyla ℤ/4ℤ cisim değildir. PDF ilk örnekler olarak 𝔽₂ ve 𝔽₃'ün işlem tablolarını gösterir."]],"de":[["Struktur von 𝔽ₚ","Für eine Primzahl p ist 𝔽ₚ={0,1,…,p−1}. Addition und Multiplikation werden modulo p ausgeführt. Jedes Element ungleich Null besitzt ein Inverses, also ist 𝔽ₚ ein Körper."],["𝔽₂: zwei Elemente","𝔽₂={0,1}. Es gelten 1+1=0 (mod 2) und 1·1=1. Die Addition besitzt dieselbe Wahrheitstafel wie XOR und ist deshalb für die Informatik wichtig."],["𝔽₃: drei Elemente","𝔽₃={0,1,2}. Hier gilt 2+2=1 und 2·2=1. Die 2 ist ihr eigenes multiplikatives Inverses."],["Warum prim?","Modulo 4 gilt 2·2≡0, obwohl 2≠0. Es entstehen Nullteiler; daher ist ℤ/4ℤ kein Körper. Die PDF zeigt Operationstabellen für 𝔽₂ und 𝔽₃."]],"en":[["Structure of 𝔽ₚ","For a prime p, 𝔽ₚ={0,1,…,p−1} with addition and multiplication modulo p. Every nonzero element has an inverse, so 𝔽ₚ is a field."],["𝔽₂: two elements","𝔽₂={0,1}, with 1+1=0 mod 2 and 1·1=1. Addition has the same truth table as XOR, which is useful in computing."],["𝔽₃: three elements","𝔽₃={0,1,2}. Here 2+2=1 and 2·2=1. The element 2 is its own multiplicative inverse."],["Why prime?","Modulo 4, 2·2≡0 although 2≠0. Zero divisors appear, so ℤ/4ℤ is not a field. The PDF illustrates 𝔽₂ and 𝔽₃ with operation tables."]]},{"p":"36, 40–43","tr":[["Bit dizileri ve 𝔽₂","Uzunluğu n olan bit dizileri 𝔽₂ⁿ elemanlarıdır. Toplama her koordinatta mod 2 yapılır. Örneğin 101+110=011 (mod 2). Bu, bit dizilerini vektör olarak ele almamızı sağlar."],["Rubik küpünün grubu","Küpün hamleleri ve hamle dizileri bileşke işlemiyle grup oluşturur. Art arda yapılan hamlelerin sırası genellikle sonucu değiştirir; bu nedenle grup değişmeli değildir."],["Set! ve 𝔽₃⁴","Set! oyunundaki dört özellik üçer değer alır. Her kartı (a,b,c,d)∈𝔽₃⁴ vektörüyle kodlayabiliriz. Üç kart bir set oluşturduğunda bu vektörlerin toplamı sıfırdır."],["Sınav için bağ kur","Aynı cebirsel dil, sayılar, vektörler, bit dizileri ve oyun hamleleri için kullanılabilir. Önce kümenin elemanlarını, sonra işlemi ve aksiyomları belirle."]],"de":[["Bitfolgen und 𝔽₂","Bitfolgen der Länge n sind Elemente von 𝔽₂ⁿ. Addiert wird koordinatenweise modulo 2, zum Beispiel 101+110=011. So können Bitfolgen als Vektoren behandelt werden."],["Zauberwürfelgruppe","Die Drehungen und Folgen von Drehungen bilden unter Hintereinanderausführung eine Gruppe. Die Reihenfolge der Drehungen beeinflusst gewöhnlich das Ergebnis; die Gruppe ist nichtabelsch."],["Set! und 𝔽₃⁴","Beim Spiel Set! besitzen vier Merkmale jeweils drei mögliche Werte. Jede Karte lässt sich als (a,b,c,d)∈𝔽₃⁴ kodieren. Drei Karten bilden ein Set, wenn ihre Vektorsumme Null ist."],["Prüfungsbezug","Dieselbe algebraische Sprache beschreibt Zahlen, Vektoren, Bitfolgen und Bewegungen. Bestimme zuerst die Menge, dann die Verknüpfung und überprüfe die Axiome."]],"en":[["Bit strings and 𝔽₂","Bit strings of length n are elements of 𝔽₂ⁿ. Addition is coordinatewise modulo 2, for example 101+110=011. Thus bit strings can be treated as vectors."],["Rubik's Cube group","Cube turns and sequences of turns form a group under composition. The order of turns typically affects the result, so the group is nonabelian."],["Set! and 𝔽₃⁴","In Set!, four attributes each have three values. Each card can be represented by (a,b,c,d)∈𝔽₃⁴. Three cards form a set when their vector sum is zero."],["Exam connection","The same algebraic language models numbers, vectors, bit strings and transformations. First identify the set, then its operation, then test the axioms."]]}];
const enTopics=[["What is a field?","A field has addition and multiplication; every nonzero element has a multiplicative inverse.",["ℚ is a field: 2/3+1/6=5/6 and (2/3)⁻¹=3/2.","ℝ is a field: √2·(1/√2)=1.","ℤ is not a field: 2 has no multiplicative inverse in ℤ."]],["The nine field axioms","K1/K5 associativity; K2/K6 commutativity; K3/K7 identity; K4/K8 inverse; K9 distributivity.",["Associativity: (2+3)+4=2+(3+4)=9.","Inverses: 7+(−7)=0, and (3/5)·(5/3)=1.","Distributivity: 3(4+5)=3·4+3·5=27."]],["Uniqueness of zero, one and inverses","The additive identity 0, multiplicative identity 1, and inverses are unique.",["If 0 and e are both additive identities, then 0=0+e=e.","If a+b=0 and a+c=0, then b=b+0=b+(a+c)=(b+a)+c=0+c=c.","The multiplicative inverse of 3/4 is uniquely 4/3; zero has none."]],["Basic proofs in a field","Familiar arithmetic identities follow from field axioms; they are not additional axioms.",["0·a=(0+0)·a=0·a+0·a. Cancel 0·a on each side to get 0·a=0.","a+(−1)a=(1+(−1))a=0a=0. Thus (−1)a=−a.","(−1)(−1)=−(−1)=1: negative times negative is positive."]],["No zero divisors","A field has no zero divisors. To prove this, suppose a≠0 and multiply by a⁻¹.",["In ℚ, 5x=0 ⇒ x=(1/5)·0=0.","In ℝ, (x−2)(x+3)=0 ⇒ x=2 or x=−3.","ℤ₆ is not a field: 2·3≡0 (mod 6), but neither factor is zero."]],["Abelian groups","A group has associativity, an identity and inverses; an abelian group also has commutativity.",["(ℤ,+) is an abelian group: identity 0, inverse of 8 is −8.","(ℚ∖{0},·) is an abelian group: identity 1, inverse of 2/5 is 5/2.","(ℕ,+) is not a group: the additive inverse −3 of 3 is not in ℕ."]],["Magma, semigroup, monoid, group","Magma: closed binary operation; semigroup adds associativity; monoid adds identity; group adds inverses; abelian adds commutativity.",["(ℕ₀,+) is a monoid: 0 is an identity, but 2 has no additive inverse.","Positive integers under multiplication form a commutative monoid; the inverse of 2 is absent.","Nonzero real numbers under multiplication form an abelian group."]],["Cancellation and inverses in groups","Left and right cancellation work even in nonabelian groups; multiply on the appropriate side.",["In additive notation, a+x=a+y ⇒ (−a)+(a+x)=(−a)+(a+y) ⇒ x=y.","ba=ca ⇒ (ba)a⁻¹=(ca)a⁻¹ ⇒ b=c.","ab=ac ⇒ a⁻¹(ab)=a⁻¹(ac) ⇒ b=c."]],["Fields and vector spaces","A field consists of two abelian groups linked by distributivity. Scalars in a vector space come from a field.",["ℝ² is a vector space over ℝ: 2·(1,3)=(2,6).","ℚ² is a vector space over ℚ: (1/2)(2,4)=(1,2).","Since ℤ is not a field, the corresponding structure is a ℤ-module, not a vector space over ℤ."]],["Characteristic of a field","The characteristic of a field is zero or a prime. A finite field cannot have characteristic zero.",["In ℚ no positive sum 1+⋯+1 equals 0: char(ℚ)=0.","In 𝔽₂, 1+1=0: char(𝔽₂)=2.","In 𝔽₅, 1+1+1+1+1=0: char(𝔽₅)=5."]],["Modular arithmetic","For modular addition or multiplication, compute first and then reduce the answer modulo n.",["17 mod 5=2 because 17=3·5+2.","In 𝔽₅, 4+3≡7≡2 (mod 5).","In 𝔽₇, 5·3≡15≡1 (mod 7), hence 5⁻¹=3."]],["Finite fields 𝔽₂ and 𝔽₃","𝔽ₚ is a field when p is prime. Addition modulo 2 equals XOR. A field has at least two elements.",["In 𝔽₂, 1+1=0 and 1·1=1.","In 𝔽₃, 2+2≡1 and 2·2≡1, so 2 is its own inverse.","In 𝔽₅, 2⁻¹=3 because 2·3≡1 (mod 5)."]],["Applications: bits, cube, Set!","Bit strings are vectors over 𝔽₂; Rubik's Cube moves form a nonabelian group; Set! cards can be modeled by 𝔽₃⁴.",["Bit strings: (1,0,1)+(1,1,0)=(0,1,1) (mod 2).","Rubik's Cube: turning the top then the right face generally differs from reversing their order.","Set!: A=(0,0,0,0), B=(1,1,1,1), C=(2,2,2,2); their sum is zero mod 3."]]];
