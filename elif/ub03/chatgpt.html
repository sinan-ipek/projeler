<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFI 1 • Übungsblatt 03 • Animierte Lösungspräsentation</title>

<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
    svg: { fontCache: 'global' }
  };

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --paper:#ffffff;
  --ink:#172033;
  --muted:#64748b;
  --line:#dbe3ef;
  --blue:#2f6fed;
  --blue2:#eaf1ff;
  --green:#148a64;
  --green2:#e9f8f2;
  --amber:#f4c542;
  --amber2:#fff7d1;
  --red:#d9485f;
  --red2:#fff0f2;
  --violet:#7657d7;
  --shadow:0 18px 55px rgba(29,45,80,.12);
  --radius:24px;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden;overflow-y:auto}
button{font:inherit}
button:focus-visible{outline:3px solid rgba(47,111,237,.28);outline-offset:3px}

#app{
  min-height:100dvh;
  height:auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:14px 18px;
  border-bottom:1px solid rgba(219,227,239,.9);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.brand-dot{
  width:14px;height:14px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  box-shadow:0 0 0 5px #edf2ff;
  flex:0 0 auto;
}
.brand-title{
  font-weight:850;
  letter-spacing:-.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.actions{
  display:flex;
  align-items:center;
  gap:9px;
}
.icon-btn,.lang-btn{
  height:44px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  box-shadow:0 5px 18px rgba(29,45,80,.07);
  cursor:pointer;
  transition:.18s ease;
}
.icon-btn:hover,.lang-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(29,45,80,.11)}
.home-btn{
  width:44px;
  background:#ffd84f;
  border-color:#e4ba1e;
  color:#111;
  font-size:22px;
  display:grid;
  place-items:center;
}
.help-btn{width:44px;font-size:20px;font-weight:900}
.lang-wrap{position:relative}
.lang-btn{padding:0 13px;display:flex;align-items:center;gap:8px;font-weight:750}
.lang-menu{
  position:absolute;
  top:52px;
  right:0;
  min-width:170px;
  padding:7px;
  border-radius:15px;
  border:1px solid var(--line);
  background:#fff;
  box-shadow:var(--shadow);
  display:none;
  z-index:40;
}
.lang-menu.open{display:block;animation:pop .18s ease}
.lang-option{
  width:100%;
  border:0;
  background:transparent;
  padding:10px 11px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
}
.lang-option:hover{background:#f2f5fa}

.presentation{
  min-height:0;
  position:relative;
  padding:18px 18px 10px;
}

.slide{
  height:auto;
  min-height:0;
  max-width:1500px;
  margin:0 auto;
  display:none;
}
.slide.active{
  display:grid;
  grid-template-columns:minmax(330px,.85fr) minmax(0,1.55fr);
  gap:18px;
  animation:slideIn .32s ease;
}

.card{
  background:var(--paper);
  border:1px solid rgba(219,227,239,.9);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  min-height:0;
}

.problem-panel{
  padding:24px;
  display:flex;
  flex-direction:column;
  overflow:visible;
}
.task-chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  align-self:flex-start;
  font-size:12px;
  font-weight:850;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--blue);
  background:var(--blue2);
  border:1px solid #cfe0ff;
  border-radius:999px;
  padding:7px 10px;
}
.problem-title{
  font-size:clamp(25px,2.1vw,39px);
  line-height:1.08;
  letter-spacing:-.035em;
  margin:16px 0 12px;
}
.problem-de{
  padding:16px 17px;
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:18px;
  line-height:1.58;
  color:#334155;
  font-size:15px;
}
.goal{
  margin-top:16px;
  padding:14px 16px;
  border-radius:16px;
  background:var(--amber2);
  border:1px solid #f2df82;
  line-height:1.55;
}
.goal b{display:block;margin-bottom:5px}
.mini-note{
  margin-top:auto;
  padding-top:18px;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.solution-panel{
  padding:22px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  min-height:0;
  overflow:visible;
}
.solution-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:12px;
}
.solution-title{
  font-size:20px;
  font-weight:850;
}
.progress{
  flex:0 0 210px;
}
.progress-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin-bottom:7px;
}
.progress-track{
  height:8px;
  background:#edf1f6;
  border-radius:99px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  border-radius:99px;
  transition:width .32s ease;
}

.stage{
  min-height:0;
  overflow:visible;
  padding:8px 4px 8px 2px;
  display:grid;
  align-content:start;
  gap:12px;
}

.step{
  opacity:0;
  transform:translateY(14px) scale(.985);
  pointer-events:none;
  max-height:0;
  overflow:hidden;
  margin:0;
  padding:0 16px;
  border:1px solid transparent;
  border-radius:18px;
  transition:
    opacity .34s ease,
    transform .34s ease,
    max-height .48s ease,
    padding .34s ease,
    margin .34s ease,
    border-color .34s ease,
    background .34s ease;
}
.step.visible{
  opacity:1;
  transform:none;
  pointer-events:auto;
  max-height:none;
  margin:0;
  padding:15px 16px;
  background:#fff;
  border-color:var(--line);
  box-shadow:0 7px 22px rgba(29,45,80,.055);
}
.step.current{
  background:linear-gradient(180deg,#fff,#fbfdff);
  border-color:#bfd3ff;
  box-shadow:0 10px 28px rgba(47,111,237,.12);
}
.step-label{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.075em;
  color:var(--blue);
  text-transform:uppercase;
  margin-bottom:8px;
}
.step-num{
  width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--blue);
  color:#fff;
  font-size:12px;
}
.step p{
  margin:6px 0;
  line-height:1.58;
}
.mathbox{
  margin-top:10px;
  padding:12px 14px;
  border-radius:14px;
  background:#f8fafc;
  border:1px solid #e1e8f0;
  overflow:auto;
}
.good{color:var(--green);font-weight:800}
.bad{color:var(--red);font-weight:800}
.hi{
  display:inline-block;
  background:#fff1a9;
  border-radius:7px;
  padding:0 5px;
  animation:hiPulse 1.5s ease-in-out infinite;
}

.visual{
  margin-top:12px;
  border-radius:17px;
  border:1px dashed #c9d4e4;
  background:linear-gradient(180deg,#fbfdff,#f7faff);
  min-height:120px;
  padding:14px;
  overflow:hidden;
}
.relation-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  min-height:86px;
}
.node{
  min-width:72px;
  min-height:52px;
  padding:10px 13px;
  border-radius:14px;
  border:2px solid #cbd8eb;
  background:#fff;
  display:grid;
  place-items:center;
  font-weight:850;
  box-shadow:0 8px 18px rgba(29,45,80,.06);
}
.node.blue{border-color:#8bb1ff;background:#f0f5ff}
.node.green{border-color:#89d7bd;background:#effbf7}
.node.red{border-color:#efa1ae;background:#fff4f5}
.arrow{
  position:relative;
  width:80px;
  height:4px;
  background:#9fb6df;
  border-radius:99px;
  overflow:visible;
}
.arrow::after{
  content:"";
  position:absolute;right:-2px;top:50%;
  width:12px;height:12px;
  border-top:4px solid #718bb8;
  border-right:4px solid #718bb8;
  transform:translateY(-50%) rotate(45deg);
}
.arrow.flow::before{
  content:"";
  position:absolute;
  width:18px;height:4px;border-radius:99px;background:var(--blue);
  left:-20px;top:0;
  animation:flow 1.5s linear infinite;
}

.matrix{
  display:grid;
  grid-template-columns:repeat(2,72px);
  gap:10px;
  justify-content:center;
}
.pair{
  height:58px;
  border:2px solid #cad6e8;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#fff;
  font-weight:800;
}
.pair.hot{border-color:#f1c21f;background:#fff8cf;animation:breathe 1.6s ease-in-out infinite}
.pair.cool{border-color:#74bfa6;background:#effbf7}

.ladder{
  display:flex;
  align-items:flex-end;
  gap:8px;
  min-height:130px;
  justify-content:center;
}
.rung{
  width:58px;
  border-radius:12px 12px 4px 4px;
  background:linear-gradient(180deg,#b7ccff,#6d92ed);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:8px;
  color:#17366d;
  font-weight:900;
  animation:rise .6s both;
}
.rung:nth-child(1){height:50px}
.rung:nth-child(2){height:70px;animation-delay:.08s}
.rung:nth-child(3){height:92px;animation-delay:.16s}
.rung:nth-child(4){height:118px;animation-delay:.24s}

.cycle{
  display:grid;
  grid-template-columns:1fr 70px 1fr 70px 1fr;
  align-items:center;
  gap:5px;
}
.cycle .bubble{
  min-height:92px;border-radius:50%;
  border:2px solid #bfd0eb;background:#fff;
  display:grid;place-items:center;text-align:center;padding:8px;
  font-weight:850;
}
.cycle .go{
  font-size:34px;text-align:center;color:var(--blue);
  animation:nudge 1.1s ease-in-out infinite;
}
.cycle .back{
  grid-column:1/-1;text-align:center;color:var(--violet);font-weight:850;margin-top:4px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:13px;
}
.control-left,.control-right{display:flex;gap:9px;align-items:center}
.ctrl{
  height:44px;
  padding:0 15px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}
.ctrl.primary{
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
.ctrl:disabled{opacity:.42;cursor:not-allowed}
.keyboard-tip{font-size:12px;color:var(--muted)}

.bottom{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 18px 8px;
  position:relative;
}
.version{
  position:absolute;
  left:20px;
  bottom:9px;
  font-size:11px;
  color:#8b95a7;
}
.counter{
  font-size:12px;
  color:var(--muted);
  font-weight:750;
}

.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(15,23,42,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}
.modal-backdrop.open{display:flex;animation:fade .16s ease}
.modal{
  width:min(500px,100%);
  background:#fff;
  border-radius:22px;
  box-shadow:0 25px 70px rgba(15,23,42,.28);
  padding:22px;
  border:1px solid var(--line);
}
.modal h3{margin:0 0 10px;font-size:22px}
.modal p{line-height:1.65;color:#475569}
.modal .close{float:right;border:0;background:#eef2f7;width:36px;height:36px;border-radius:10px;cursor:pointer;font-weight:900}

.intro{
  grid-column:1/-1;
  padding:34px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:28px;
  align-items:center;
}
.intro h1{
  font-size:clamp(42px,5vw,78px);
  line-height:.98;
  letter-spacing:-.05em;
  margin:10px 0 16px;
}
.intro p{font-size:18px;line-height:1.62;color:#526079;max-width:780px}
.intro-visual{
  min-height:390px;
  display:grid;
  place-items:center;
  position:relative;
}
.orbit{
  width:290px;height:290px;border-radius:50%;
  border:2px dashed #c5d5ef;
  position:relative;
  animation:spin 18s linear infinite;
}
.orbit .planet{
  position:absolute;width:72px;height:72px;border-radius:20px;
  display:grid;place-items:center;font-weight:900;
  box-shadow:0 10px 28px rgba(29,45,80,.12);
  transform:translate(-50%,-50%);
}
.p1{left:50%;top:0;background:#eaf1ff;color:#2f6fed}
.p2{left:100%;top:50%;background:#e9f8f2;color:#148a64}
.p3{left:50%;top:100%;background:#fff7d1;color:#a17600}
.p4{left:0;top:50%;background:#f3edff;color:#7657d7}
.center-ball{
  position:absolute;width:145px;height:145px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow);
  display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;
  border:1px solid var(--line);
}
.start-btn{
  margin-top:10px;height:52px;padding:0 20px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer;
}

@media (max-width:980px){
  .slide.active{grid-template-columns:1fr}
  .problem-panel{max-height:none}
  .solution-panel{min-height:0}
  .presentation{padding:10px}
  .intro{grid-template-columns:1fr;overflow:auto}
  .intro-visual{min-height:260px}
  .orbit{width:220px;height:220px}
  .version{display:none}
  .keyboard-tip{display:none}
}
@media (max-width:650px){
  .brand-sub{display:none}
  .brand-title{font-size:14px}
  .lang-btn span.label{display:none}
  .slide.active{gap:10px}
  .problem-panel,.solution-panel{padding:15px}
  .solution-head{display:block}
  .progress{margin-top:10px;max-width:none}
  .cycle{grid-template-columns:1fr}
  .cycle .go{transform:rotate(90deg)}
  .cycle .back{grid-column:1}
}

@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flow{from{left:-20px}to{left:100%}}
@keyframes breathe{50%{transform:scale(1.045);box-shadow:0 0 0 8px rgba(244,197,66,.16)}}
@keyframes hiPulse{50%{box-shadow:0 0 0 6px rgba(244,197,66,.18)}}
@keyframes rise{from{transform:scaleY(.15);transform-origin:bottom;opacity:.2}to{transform:scaleY(1);opacity:1}}
@keyframes nudge{50%{transform:translateX(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.presentation{height:auto}.slide.active{align-items:start}.problem-panel,.solution-panel{height:auto;max-height:none}.solution-panel{grid-template-rows:auto auto auto}.stage{max-height:none;overflow:visible}.step.visible{max-height:none;overflow:visible}.problem-de,.mathbox{overflow-x:auto}.topbar{position:sticky;top:0}.jumpmenu{min-width:150px;max-width:min(35vw,380px);padding:10px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);font:14px system-ui}@media(max-width:1000px){.slide.active{grid-template-columns:1fr}.problem-panel{max-height:none}.solution-panel{min-height:0}}@media(max-width:650px){.jumpmenu{min-width:90px;max-width:35vw;font-size:12px;padding:6px}.actions{gap:4px}.topbar{flex-wrap:wrap}}
</style>
</head>

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <div>
        <div class="brand-title">MAFI 1 • Übungsblatt 03</div>
        <div class="brand-sub">Animasyonlu çözüm sunumu</div>
      </div>
    </div>

    <div class="actions">
      <select id="jump" class="jumpmenu" aria-label="Soru ve şık seç"></select>
      <button class="icon-btn home-btn" id="homeBtn" title="Home" aria-label="Home">⌂</button>

      <div class="lang-wrap">
        <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
          <span>🌐</span><span class="label" id="langLabel">Dil</span><span>▾</span>
        </button>
        <div class="lang-menu" id="langMenu">
          <button class="lang-option" data-lang="tr">Türkçe</button>
          <button class="lang-option" data-lang="de">Deutsch</button>
          
        </div>
      </div>

      <button class="icon-btn help-btn" id="helpBtn" title="Help" aria-label="Help">?</button>
    </div>
  </header>

  <main class="presentation" id="presentation"></main>

  <footer class="bottom">
    <div class="version">v1.2 · Türkçe/Deutsch tam sunum</div>
    <div class="counter" id="slideCounter"></div>
  </footer>
</div>

<div class="modal-backdrop" id="helpModal">
  <div class="modal">
    <button class="close" id="closeHelp">×</button>
    <h3 id="helpTitle">Yardım</h3>
    <p id="helpText">
      Bu sayfa soruları adım adım gösterir. “Sonraki adım” düğmesine bas.
      Çözüm yavaş yavaş açılır. Sağ ve sol ok tuşlarıyla slayt değişir.
    </p>
  </div>
</div>

<script>
const UI = {
  tr:{
    language:"Dil", helpTitle:"Yardım",
    helpText:"Bu sayfa soruları adım adım gösterir. “Sonraki adım” düğmesine bas. Çözüm yavaş yavaş açılır. Sağ ve sol ok tuşlarıyla slayt değişir.",
    solution:"Çözüm akışı", step:"Adım", prev:"Önceki", next:"Sonraki slayt", nextStep:"Sonraki adım",
    reset:"Baştan", goal:"Amaç", tip:"← → slayt • Boşluk: adım",
    introText:"Bu sunum, Übungsblatt 03 içindeki bütün soruları tek tek çözer. Her adım ayrı açılır; böylece ispatın neden çalıştığını takip edebilirsin.",
    start:"Başla"
  },
  de:{
    language:"Sprache", helpTitle:"Hilfe",
    helpText:"Diese Seite zeigt die Aufgaben Schritt für Schritt. Klicke auf „Nächster Schritt“. Mit den Pfeiltasten wechselst du die Folie.",
    solution:"Lösungsweg", step:"Schritt", prev:"Zurück", next:"Nächste Folie", nextStep:"Nächster Schritt",
    reset:"Neu", goal:"Ziel", tip:"← → Folie • Leertaste: Schritt",
    introText:"Diese Präsentation löst alle Aufgaben aus Übungsblatt 03 Schritt für Schritt. Jeder Beweisschritt erscheint einzeln.",
    start:"Start"
  },
  en:{
    language:"Language", helpTitle:"Help",
    helpText:"This page shows each problem step by step. Click “Next step”. Use the left and right arrow keys to change slides.",
    solution:"Solution flow", step:"Step", prev:"Previous", next:"Next slide", nextStep:"Next step",
    reset:"Restart", goal:"Goal", tip:"← → slide • Space step",
    introText:"This presentation solves every problem from Worksheet 03 step by step. Each proof step appears separately.",
    start:"Start"
  }
};

const slides = [
{
  intro:true,
  title:"Übungsblatt 03",
  subtitle:"Relationen • Ordnungen • Induktion • Beweistechniken"
},
{
  chip:"Aufgabe 1(a)",
  title:"Fonksiyon eşitliği neden bir eşdeğerlik bağıntısıdır?",
  de:`Die Relation \\(\\simeq\\) zwischen Funktionen \\(f,g:X\\to Y\\) ist definiert durch
      \\[f\\simeq g \\iff \\forall x\\in X:\\; f(x)=g(x).\\]
      Beweisen Sie, dass \\(\\simeq\\) eine Äquivalenzrelation ist.`,
  goal:"Reflexivität, Symmetrie ve Transitivität özelliklerinin üçünü de göstermek.",
  steps:[
    {
      title:"Ne kanıtlamalıyız?",
      html:`Bir bağıntının eşdeğerlik bağıntısı olması için üç özellik gerekir:
      <b>refleksif</b>, <b>simetrik</b>, <b>transitif</b>.
      <div class="visual relation-row"><div class="node blue">f</div><div class="arrow flow"></div><div class="node green">g</div></div>`

{

      title:"(i) ⇒ (ii)",
      html:`\\(z\\in f^{-1}(f(A))\\) al.

const germanData = [null,{"title":"Warum ist punktweise Funktionsgleichheit eine Äquivalenzrelation?","goal":"Reflexivität, Symmetrie und Transitivität nachweisen.","steps":[["Was müssen wir zeigen?","Eine Äquivalenzrelation muss <b>reflexiv</b>, <b>symmetrisch</b> und <b>transitiv</b> sein. <div class=\"visual relation-row\"><div class=\"node blue\">f</div><div class=\"arrow flow\"></div><div class=\"node green\">g</div></div>"],["Reflexivität","Jede Funktion ist an jeder Stelle mit sich selbst gleich.<div class=\"mathbox\">\\[\\forall x\\in X:\\;f(x)=f(x)\\Longrightarrow f\\simeq f.\\]</div>Wir verwenden die <span class=\"hi\">Reflexivität der Gleichheit</span>."],["Symmetrie","Sei \\(f\\simeq g\\). Dann gilt \\(f(x)=g(x)\\) für alle \\(x\\). Wegen der Symmetrie der Gleichheit folgt:<div class=\"mathbox\">\\[f(x)=g(x)\\Rightarrow g(x)=f(x)\\Rightarrow g\\simeq f.\\]</div>"],["Transitivität","Seien \\(f\\simeq g\\) und \\(g\\simeq h\\). Für jedes \\(x\\) gilt:<div class=\"mathbox\">\\[f(x)=g(x)\\quad\\text{und}\\quad g(x)=h(x)\\Rightarrow f(x)=h(x).\\]</div>Also \\(f\\simeq h\\)."],["Ergebnis","Alle drei Eigenschaften sind erfüllt:<p class=\"good\">✓ reflexiv &nbsp; ✓ symmetrisch &nbsp; ✓ transitiv</p><div class=\"mathbox\">\\[\\boxed{\\simeq\\text{ ist eine Äquivalenzrelation.}}\\]</div>"]]},{"title":"Äquivalenzrelation für beliebige Relationen","goal":"Für jedes x die zugehörigen Teilmengen von Y vergleichen und die drei Eigenschaften nachweisen.","steps":[["Die Menge zu einem festen x","Wähle ein festes \\(x\\). Sammle alle \\(y\\), die in R mit x verbunden sind:<div class=\"mathbox\">\\[R_x:=\\{y\\in Y\\mid(x,y)\\in R\\}.\\]</div>Die Definition besagt: \\(R\\simeq_r S\\) genau dann, wenn \\(R_x=S_x\\) für jedes \\(x\\)."],["Reflexivität","Jede Menge ist mit sich selbst gleich:<div class=\"mathbox\">\\[\\forall x:\\;R_x=R_x\\Rightarrow R\\simeq_r R.\\]</div>"],["Symmetrie","Sei \\(R\\simeq_r S\\). Dann \\(R_x=S_x\\) für alle \\(x\\). Wegen der Symmetrie der Mengengleichheit gilt:<div class=\"mathbox\">\\[R_x=S_x\\Rightarrow S_x=R_x\\Rightarrow S\\simeq_r R.\\]</div>"],["Transitivität","Aus \\(R\\simeq_r S\\) und \\(S\\simeq_r T\\) folgt für jedes x:<div class=\"mathbox\">\\[R_x=S_x,\\;S_x=T_x\\Rightarrow R_x=T_x.\\]</div>Also \\(R\\simeq_r T\\)."],["Ergebnis","Entscheidend sind hier die drei Eigenschaften der <b>Mengengleichheit</b>.<div class=\"mathbox\">\\[\\boxed{\\simeq_r\\text{ ist ebenfalls eine Äquivalenzrelation.}}\\]</div>"]]},{"title":"Wann stimmen lexikographische Ordnung L und E überein?","goal":"Ein einfaches Beispiel finden, in dem kein anderes Paar vergleichbar sein muss.","steps":[["Wähle eine einelementige Menge","Sei \\(A=\\{0\\}\\) und \\(R=\\{(0,0)\\}\\).<div class=\"visual matrix\"><div class=\"pair hot\">(0,0)</div></div>"],["Wie viele Elemente hat A²?","Genau eines:<div class=\"mathbox\">\\[A^2=\\{(0,0)\\}.\\]</div>"],["E und L prüfen","Wir müssen nur \\((0,0)\\) mit sich selbst vergleichen. Beide Definitionen sind wahr:<div class=\"mathbox\">\\[(0,0)E(0,0)\\quad\\text{und}\\quad(0,0)L(0,0).\\]</div>"],["Ergebnis","Weitere Paare gibt es nicht. Beide Relationen sind daher gleich:<div class=\"mathbox\">\\[\\boxed{L=E=\\{((0,0),(0,0))\\}.}\\]</div>"]]},{"title":"Ein Gegenbeispiel für L ≠ E","goal":"Bei strikt kleiner erster Koordinate ist L unabhängig von der zweiten Koordinate; E ist das nicht.","steps":[["Beispiel wählen","Sei \\(A=\\{0,1\\}\\) und \\(R=\\le\\). Wir vergleichen:<div class=\"visual matrix\"><div class=\"pair hot\">(0,1)</div><div class=\"pair cool\">(1,0)</div></div>"],["Prüfung von L","Da \\(0<1\\), entscheidet bereits die erste Koordinate:<div class=\"mathbox\">\\[0\\le1\\;\\land\\;(\\neg(1\\le0)\\lor1\\le0).\\]</div>\\(\\neg(1\\le0)\\) ist wahr. Also <span class=\"good\">gilt L</span>."],["Prüfung von E","E verlangt die Bedingung in beiden Koordinaten:<div class=\"mathbox\">\\[0\\le1\\;\\land\\;1\\le0.\\]</div>Die zweite Aussage ist falsch; also <span class=\"bad\">gilt E nicht</span>."],["Ergebnis","Für dieselben Paare gilt L, aber nicht E:<div class=\"mathbox\">\\[\\boxed{L\\neq E.}\\]</div>"]]},{"title":"Warum ist E immer eine partielle Ordnung?","goal":"Reflexivität, Antisymmetrie und Transitivität beweisen.","steps":[["Reflexivität","R ist reflexiv. Deshalb gelten \\(aRa\\) und \\(bRb\\).<div class=\"mathbox\">\\[(a,b)E(a,b).\\]</div>"],["Voraussetzung für Antisymmetrie","Angenommen, \\((a,b)E(a',b')\\) und \\((a',b')E(a,b)\\). Nach Definition gelten:<div class=\"mathbox\">\\[aRa',\\;a'Ra,\\;bRb',\\;b'Rb.\\]</div>"],["Antisymmetrie von R verwenden","Aus \\(aRa'\\land a'Ra\\) folgt \\(a=a'\\). Aus \\(bRb'\\land b'Rb\\) folgt \\(b=b'\\).<div class=\"mathbox\">\\[(a,b)=(a',b').\\]</div>"],["Transitivität","Seien \\((a,b)E(a',b')\\) und \\((a',b')E(a'',b'')\\). Aus der Transitivität von R folgt:<div class=\"mathbox\">\\[aRa',\\;a'Ra''\\Rightarrow aRa'',\\qquad bRb',\\;b'Rb''\\Rightarrow bRb''.\\]</div>Damit \\((a,b)E(a'',b'')\\)."],["Ergebnis","Alle drei Eigenschaften sind nachgewiesen:<div class=\"mathbox\">\\[\\boxed{E\\text{ ist eine partielle Ordnung.}}\\]</div>"]]},{"title":"Warum ist E nicht immer total?","goal":"Zwei Elemente von A² finden, die bezüglich E nicht vergleichbar sind.","steps":[["Sei A={0,1}","Wir nehmen \\(R=\\le\\) und betrachten:<div class=\"visual matrix\"><div class=\"pair hot\">(0,1)</div><div class=\"pair hot\">(1,0)</div></div>"],["Erste Richtung","Für \\((0,1)E(1,0)\\) müssten beide Bedingungen gelten:<div class=\"mathbox\">\\[0\\le1\\;\\land\\;1\\le0.\\]</div>Das ist falsch."],["Umgekehrte Richtung","Für \\((1,0)E(0,1)\\) bräuchten wir:<div class=\"mathbox\">\\[1\\le0\\;\\land\\;0\\le1.\\]</div>Auch das ist falsch."],["Ergebnis","Keines der beiden Paare steht bezüglich E vor dem anderen.<div class=\"mathbox\">\\[\\boxed{E\\text{ muss nicht total sein.}}\\]</div>"]]},{"title":"Beweis der Antisymmetrie von L","goal":"Gelten beide L-Richtungen, dann zuerst a=a′ und anschließend b=b′ zeigen.","steps":[["Beide Richtungen annehmen","Es gelten \\((a,b)L(a',b')\\) und \\((a',b')L(a,b)\\). Daraus folgen insbesondere:<div class=\"mathbox\">\\[aRa'\\quad\\text{und}\\quad a'Ra.\\]</div>"],["Erste Koordinaten sind gleich","Da R antisymmetrisch ist, folgt:<div class=\"mathbox\">\\[a=a'.\\]</div>"],["Zur Klammer in L zurückkehren","Wegen \\(a=a'\\) ist \\(a'Ra\\) aufgrund der Reflexivität wahr. Deshalb ist<div class=\"mathbox\">\\[\\neg(a'Ra)\\]</div><span class=\"bad\">falsch</span>. Damit die Disjunktion in der Definition von L dennoch wahr bleibt, muss \\(bRb'\\) gelten."],["Auch die Gegenrichtung verwenden","Aus \\((a',b')L(a,b)\\) folgt mit demselben Argument:<div class=\"mathbox\">\\[b'Rb.\\]</div>"],["Zweite Koordinaten sind gleich","Die Antisymmetrie von R liefert:<div class=\"mathbox\">\\[bRb'\\land b'Rb\\Rightarrow b=b'.\\]</div>Also sind die Paare gleich:<div class=\"mathbox\">\\[\\boxed{L\\text{ ist antisymmetrisch.}}\\]</div>"]]},{"title":"Vollständige Induktion: n! ≥ 2ⁿ","goal":"Induktionsanfang, Induktionsvoraussetzung und Induktionsschritt durchführen.","steps":[["Induktionsanfang n=4","Wir prüfen:<div class=\"mathbox\">\\[4!=24\\ge16=2^4.\\]</div>Der Induktionsanfang gilt."],["Induktionsvoraussetzung","Für ein festes \\(n\\ge4\\) nehmen wir an:<div class=\"mathbox\">\\[n!\\ge2^n.\\]</div>"],["Den Fall n+1 beginnen","Zu zeigen ist:<div class=\"mathbox\">\\[(n+1)!\\ge2^{n+1}.\\]</div>Wir zerlegen die linke Seite:<div class=\"mathbox\">\\[(n+1)!=(n+1)n!.\\]</div>"],["Induktionsvoraussetzung einsetzen","Aus \\(n!\\ge2^n\\) folgt nach Multiplikation mit \\(n+1>0\\):<div class=\"mathbox\">\\[(n+1)n!\\ge(n+1)2^n.\\]</div>"],["Letzter Vergleich","Da \\(n\\ge4\\), gilt \\(n+1\\ge5\\ge2\\). Deshalb:<div class=\"mathbox\">\\[(n+1)2^n\\ge2\\cdot2^n=2^{n+1}.\\]</div><div class=\"visual ladder\"><div class=\"rung\">4</div><div class=\"rung\">n</div><div class=\"rung\">n+1</div><div class=\"rung\">✓</div></div>"],["Ergebnis","Der Induktionsbeweis ist abgeschlossen:<div class=\"mathbox\">\\[\\boxed{\\forall n\\ge4:\\;n!\\ge2^n.}\\]</div>"]]},{"title":"Jede k-fache Verkettung einer injektiven Funktion ist injektiv","goal":"Aus gleichen Funktionswerten der (k+1)-fachen Verkettung auf gleiche Eingaben schließen.","steps":[["Induktionsanfang k=1","Es gilt \\(f^1=f\\). Nach Voraussetzung ist f injektiv.<div class=\"mathbox\">\\[f^1\\text{ ist injektiv.}\\]</div>"],["Induktionsvoraussetzung","Für ein festes \\(k\\ge1\\) sei \\(f^k\\) injektiv."],["Injektivität nachweisen","Wir nehmen \\(f^{k+1}(x)=f^{k+1}(y)\\) an. Da \\(f^{k+1}=f^k\\circ f\\), ist dies gleichbedeutend mit:<div class=\"mathbox\">\\[f^k(f(x))=f^k(f(y)).\\]</div><div class=\"visual relation-row\"><div class=\"node blue\">x</div><div class=\"arrow flow\"></div><div class=\"node\">f(x)</div><div class=\"arrow flow\"></div><div class=\"node green\">fᵏ(f(x))</div></div>"],["Zuerst die Injektivität von fᵏ","Nach der Induktionsvoraussetzung ist \\(f^k\\) injektiv. Daher:<div class=\"mathbox\">\\[f^k(f(x))=f^k(f(y))\\Rightarrow f(x)=f(y).\\]</div>"],["Dann die Injektivität von f","Auch f ist injektiv. Folglich:<div class=\"mathbox\">\\[f(x)=f(y)\\Rightarrow x=y.\\]</div>Also ist \\(f^{k+1}\\) injektiv."],["Ergebnis","Mit vollständiger Induktion folgt:<div class=\"mathbox\">\\[\\boxed{\\forall k\\ge1:\\;f^k\\text{ ist injektiv}.}\\]</div>"]]},{"title":"Distributivgesetz für n Mengen","goal":"Im Fall n+1 das Distributivgesetz und die Induktionsvoraussetzung kombinieren.","steps":[["Induktionsanfang n=1","Beide Seiten sind identisch:<div class=\"mathbox\">\\[A_1\\cup C=A_1\\cup C.\\]</div>"],["Induktionsvoraussetzung","Für ein festes \\(n\\ge1\\) gelte:<div class=\"mathbox\">\\[(A_1\\cap\\cdots\\cap A_n)\\cup C=(A_1\\cup C)\\cap\\cdots\\cap(A_n\\cup C).\\]</div>"],["Den Fall n+1 zusammenfassen","Setze \\(B:=A_1\\cap\\cdots\\cap A_n\\). Die linke Seite ist nun:<div class=\"mathbox\">\\[(B\\cap A_{n+1})\\cup C.\\]</div>"],["Distributivgesetz anwenden","Mit dem vorgegebenen Gesetz folgt:<div class=\"mathbox\">\\[(B\\cap A_{n+1})\\cup C=(B\\cup C)\\cap(A_{n+1}\\cup C).\\]</div>"],["Induktionsvoraussetzung für B∪C","Ersetze \\(B\\cup C\\) mit der Induktionsvoraussetzung:<div class=\"mathbox\">\\[((A_1\\cup C)\\cap\\cdots\\cap(A_n\\cup C))\\cap(A_{n+1}\\cup C).\\]</div>"],["Ergebnis","Dies ist genau die Behauptung für n+1:<div class=\"mathbox\">\\[\\boxed{(A_1\\cap\\cdots\\cap A_{n+1})\\cup C=\\bigcap_{i=1}^{n+1}(A_i\\cup C).}\\]</div>"]]},{"title":"Kontraposition mit Fallunterscheidung","goal":"Statt der ursprünglichen Implikation ihre Kontraposition beweisen.","steps":[["Kontraposition formulieren","Die Aussage lautet:<div class=\"mathbox\">\\[A\\cup B=A\\cap B\\Rightarrow A=B.\\]</div>Ihre Kontraposition:<div class=\"mathbox\">\\[A\\neq B\\Rightarrow A\\cup B\\neq A\\cap B.\\]</div>"],["Was bedeutet A ≠ B?","Sind zwei Mengen verschieden, gibt es ein Element in genau einer der Mengen. Wir unterscheiden zwei Fälle:<div class=\"mathbox\">\\[\\exists x\\in A\\setminus B\\quad\\text{oder}\\quad\\exists x\\in B\\setminus A.\\]</div>"],["Fall 1","Sei \\(x\\in A\\setminus B\\). Dann liegt x in \\(A\\cup B\\), aber nicht in \\(A\\cap B\\). Damit sind die Mengen verschieden."],["Fall 2","Sei \\(x\\in B\\setminus A\\). Wieder liegt x in \\(A\\cup B\\), aber nicht in \\(A\\cap B\\)."],["Ergebnis","In beiden Fällen gilt die Kontraposition. Also ist die ursprüngliche Aussage bewiesen:<div class=\"mathbox\">\\[\\boxed{A\\cup B=A\\cap B\\Rightarrow A=B.}\\]</div>"]]},{"title":"Ringschluss: (i) ⇒ (ii) ⇒ (iii) ⇒ (i)","goal":"Drei Implikationen nacheinander beweisen, um die Äquivalenz zu erhalten.","steps":[["Plan des Ringschlusses","Wir zeigen die folgenden drei Implikationen:<div class=\"visual cycle\"><div class=\"bubble\">(i)<br>injektiv</div><div class=\"go\">→</div><div class=\"bubble\">(ii)<br>Urbild</div><div class=\"go\">→</div><div class=\"bubble\">(iii)<br>Faser</div><div class=\"back\">↘ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (iii) → (i) &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ↙</div></div>"],["(i) ⇒ (ii)","Sei \\(z\\in f^{-1}(f(A))\\). Dann liegt \\(f(z)\\) in \\(f(A)\\). Also existiert \\(a\\in A\\) mit \\(f(z)=f(a)\\). Wegen der Injektivität von f folgt \\(z=a\\in A\\).<div class=\"mathbox\">\\[f^{-1}(f(A))\\subseteq A.\\]</div>"],["(ii) ⇒ (iii): zunächst ⊆","Wähle in (ii) die Menge \\(A=\\{x\\}\\):<div class=\"mathbox\">\\[f^{-1}(f(\\{x\\}))\\subseteq\\{x\\}.\\]</div>Da \\(f(\\{x\\})=\\{f(x)\\}\\), folgt<div class=\"mathbox\">\\[f^{-1}(\\{f(x)\\})\\subseteq\\{x\\}.\\]</div>"],["(ii) ⇒ (iii): umgekehrte Inklusion","Da immer \\(f(x)\\in\\{f(x)\\}\\) gilt, folgt:<div class=\"mathbox\">\\[x\\in f^{-1}(\\{f(x)\\}).\\]</div>Damit \\(\\{x\\}\\subseteq f^{-1}(\\{f(x)\\})\\). Zusammen mit der anderen Inklusion ergibt sich Gleichheit."],["(iii) ⇒ (i)","Nehmen wir \\(f(x)=f(y)\\) an. Dann \\(y\\in f^{-1}(\\{f(x)\\})\\). Aus (iii) folgt, dass diese Menge gleich \\(\\{x\\}\\) ist. Also \\(y=x\\).<div class=\"mathbox\">\\[\\boxed{f\\text{ ist injektiv}.}\\]</div>"],["Der Ring ist geschlossen","Alle drei Implikationen wurden gezeigt:<div class=\"mathbox\">\\[\\boxed{(i)\\Rightarrow(ii)\\Rightarrow(iii)\\Rightarrow(i)}\\]</div>Folglich sind die drei Aussagen äquivalent."]]},{"title":"Widerspruch mit Fallunterscheidung: 3 Elemente passen nicht injektiv auf 2 Werte","goal":"Injektivität annehmen und zeigen, dass für das dritte Element kein freier Wert bleibt.","steps":[["Widerspruchsannahme","Angenommen, es gäbe eine injektive Funktion f. Dann gilt entweder \\(f(1)=1\\) oder \\(f(1)=2\\). Andere Werte gibt es nicht."],["Fall 1: f(1)=1","Wegen der Injektivität muss \\(f(2)\\neq1\\) gelten, also \\(f(2)=2\\). Was kann \\(f(3)\\) sein?<div class=\"visual relation-row\"><div class=\"node blue\">1</div><div class=\"arrow flow\"></div><div class=\"node green\">1</div><div class=\"node blue\">2</div><div class=\"arrow flow\"></div><div class=\"node green\">2</div><div class=\"node red\">3 ?</div></div>"],["Kein freier Wert für das dritte Element","Die Zielmenge ist \\(\\{1,2\\}\\). Falls \\(f(3)=1\\), dann \\(f(1)=f(3)\\). Falls \\(f(3)=2\\), dann \\(f(2)=f(3)\\). Beide Möglichkeiten widersprechen der Injektivität."],["Fall 2: f(1)=2","Die Injektivität erzwingt nun \\(f(2)=1\\). Für \\(f(3)\\) bleiben nur 1 und 2; beide Werte sind bereits vergeben. Wieder ein Widerspruch."],["Widerspruch","In beiden Fällen entsteht ein Widerspruch. Damit ist die Annahme falsch.<div class=\"mathbox\">\\[\\boxed{\\text{Es gibt keine injektive Abbildung }f:\\{1,2,3\\}\\to\\{1,2\\}.}\\]</div>"]]}];

(Ringschluss).","Şu türde bire bir fonksiyon bulunmadığını kanıtlayın:\n\\[f:\\{1,2,3\\}\\to\\{1,2\\}.\\]\n<b>İstenen teknik:</b> Çelişkiyle ispat ve durumlara ayırma."];
const footerEl = document.querySelector(".version");
const brandSubEl = document.querySelector(".brand-sub");
UI.tr.miniNote = "Önce soldaki soruyu oku. Sonra sağdaki çözümü adım adım aç. Her adım, ispatın nasıl ilerlediğini gösterir.";
UI.de.miniNote = "Lies zuerst die Aufgabe links. Öffne dann rechts die Lösung Schritt für Schritt. Jeder Schritt zeigt, wie der Beweis weitergeht.";
UI.tr.slideChip = "Soru";
UI.de.slideChip = "Aufgabe";
UI.tr.introSubtitle = "Bağıntılar • Sıralamalar • Tümevarım • İspat teknikleri";
UI.de.introSubtitle = "Relationen • Ordnungen • Induktion • Beweistechniken";
UI.tr.course = "Bilişim için Matematik 1";
UI.de.course = "Mathematik für Informatik 1";
UI.tr.brand = "Animasyonlu çözüm sunumu";
UI.de.brand = "Animierte Lösungspräsentation";
UI.tr.version = "v1.2 · Bütün sorular ve çözüm adımları Türkçe";
UI.de.version = "v1.2 · Alle Aufgaben und Lösungsschritte auf Deutsch";
function applyLanguage(chosen){
  if(chosen!=="tr" && chosen!=="de") chosen="tr";
  lang=chosen;
  document.documentElement.lang=chosen;
  document.title=chosen==="de"?"MAFI 1 – Übungsblatt 03 – Animierte Lösungspräsentation":"MAFI 1 – Übungsblatt 03 – Animasyonlu Çözüm Sunumu";
  brandSubEl.textContent=UI[lang].brand;
  footerEl.textContent=UI[lang].version;
  slides[0].subtitle=UI[lang].introSubtitle;
  for(let i=1;i<slides.length;i++){
    const source=chosen==="de"?germanData[i]:turkishData[i];
    const slide=slides[i];
    slide.title=source.title;
    slide.goal=source.goal;
    slide.chip=(chosen==="de"?"Aufgabe ":"Soru ")+slide.chip.replace(/^(Aufgabe|Soru)\s*/,"");
    slide.de=chosen==="de"?germanStatements[i]:turkishStatements[i];
    slide.steps.forEach((st,j)=>{
      st.title=chosen==="de"?source.steps[j][0]:source.steps[j].title;
      st.html=chosen==="de"?source.steps[j][1]:source.steps[j].html;
      if(chosen==="tr"){
        st.html=st.html.replace(/\\text\{ ist eine Äquivalenzrelation\.\}/g,"\\text{ bir eşdeğerlik bağıntısıdır.}")
          .replace(/\\text\{ ist ebenfalls eine Äquivalenzrelation\.\}/g,"\\text{ de bir eşdeğerlik bağıntısıdır.}")
          .replace(/\\text\{ ist eine partielle Ordnung\.\}/g,"\\text{ bir kısmi sıralamadır.}")
          .replace(/\\text\{ muss nicht total sein\.\}/g,"\\text{ her zaman tam sıralama değildir.}")
          .replace(/\\text\{ ist antisymmetrisch\.\}/g,"\\text{ antisimetri özelliğini sağlar.}")
          .replace(/\\text\{ ist injektiv\}/g,"\\text{ bire birdir}")
          .replace(/\\text\{Es gibt keine injektive Abbildung \}/g,"\\text{Bire bir fonksiyon yoktur: }");
      }
    });
  }
  langBtn.setAttribute("aria-label",UI[lang].language);
  localStorage.setItem("elif-ub03-lang",lang);
  if(typeof updateJump==="function")updateJump();
  render();
}

let slideIndex = 0;
let revealed = 0;

const presentation = document.getElementById("presentation");
const slideCounter = document.getElementById("slideCounter");
const langBtn = document.getElementById("langBtn");
const langMenu = document.getElementById("langMenu");
const langLabel = document.getElementById("langLabel");
const helpModal = document.getElementById("helpModal");

function render(){
  presentation.innerHTML = "";
  slides.forEach((s,i)=>{
    const el = document.createElement("section");
    el.className = "slide" + (i===slideIndex ? " active":"");
    el.dataset.index = i;

    if(s.intro){
      el.innerHTML = `
        <div class="card intro">
          <div>
            <div class="task-chip">${UI[lang].course}</div>
            <h1>${s.title}</h1>
            <p><b>${s.subtitle}</b></p>
            <p>${UI[lang].introText}</p>
            <button class="start-btn" onclick="goTo(1)">${UI[lang].start} →</button>
          </div>
          <div class="intro-visual">
            <div class="orbit">
              <div class="planet p1">≃</div>
              <div class="planet p2">E / L</div>
              <div class="planet p3">∑</div>
              <div class="planet p4">⇒</div>
            </div>
            <div class="center-ball">ÜB<br>03</div>
          </div>
        </div>`;
    }else{
      const stepHtml = s.steps.map((st,idx)=>`
        <article class="step ${idx<revealed ? "visible":""} ${idx===revealed-1 ? "current":""}" data-step="${idx}">
          <div class="step-label"><span class="step-num">${idx+1}</span>${UI[lang].step} ${idx+1} • ${st.title}</div>
          <div>${st.html}</div>
        </article>`).join("");

      const pct = s.steps.length ? Math.round((revealed/s.steps.length)*100) : 0;

      el.innerHTML = `
        <aside class="card problem-panel">
          <div class="task-chip">${s.chip}</div>
          <h2 class="problem-title">${s.title}</h2>
          <div class="problem-de">${s.de}</div>
          <div class="goal"><b>${UI[lang].goal}</b>${s.goal}</div>
          <div class="mini-note">${UI[lang].miniNote}</div>
        </aside>

        <section class="card solution-panel">
          <div class="solution-head">
            <div class="solution-title">${UI[lang].solution}</div>
            <div class="progress">
              <div class="progress-top"><span>${revealed}/${s.steps.length}</span><span>${pct}%</span></div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
          </div>

          <div class="stage">${stepHtml}</div>

          <div class="controls">
            <div class="control-left">
              <button class="ctrl" onclick="prevSlide()" ${slideIndex===0?"disabled":""}>← ${UI[lang].prev}</button>
              <button class="ctrl" onclick="resetSteps()" ${revealed===0?"disabled":""}>↺ ${UI[lang].reset}</button>
            </div>
            <div class="keyboard-tip">${UI[lang].tip}</div>
            <div class="control-right">
              <button class="ctrl primary" onclick="primaryAction()">${revealed < s.steps.length ? UI[lang].nextStep : UI[lang].next + " →"}</button>
            </div>
          </div>
        </section>`;
    }

    presentation.appendChild(el);
  });

  slideCounter.textContent = `${slideIndex+1} / ${slides.length}`;
  document.getElementById("jump").value=String(slideIndex);
  langLabel.textContent = UI[lang].language;
  document.getElementById("helpTitle").textContent = UI[lang].helpTitle;
  document.getElementById("helpText").textContent = UI[lang].helpText;

  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear?.();
    MathJax.typesetPromise([presentation]).catch(()=>{});
  }

  requestAnimationFrame(()=>{
    const current = presentation.querySelector(".slide.active .step.current");
    current?.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
}

function primaryAction(){
  const s = slides[slideIndex];
  if(s.intro){ nextSlide(); return; }
  if(revealed < s.steps.length){
    revealed++;
    render();
  }else{
    nextSlide();
  }
}
function resetSteps(){ revealed=0; render(); }
function nextSlide(){
  if(slideIndex < slides.length-1){
    slideIndex++;
    revealed=0;
    render();
  }
}
function prevSlide(){
  if(slideIndex>0){
    slideIndex--;
    revealed=0;
    render();
  }
}
function goTo(i){
  slideIndex = Math.max(0,Math.min(slides.length-1,i));
  revealed=0;
  render();
}
window.primaryAction=primaryAction;
window.resetSteps=resetSteps;
window.nextSlide=nextSlide;
window.prevSlide=prevSlide;
window.goTo=goTo;
const jumper=document.getElementById("jump");
function updateJump(){const previous=String(slideIndex);jumper.replaceChildren();slides.forEach((s,i)=>{if(i===0)return;let option=document.createElement("option");option.value=String(i);option.textContent=s.chip+" · "+s.title;jumper.appendChild(option)});jumper.value=previous;}
jumper.onchange=e=>goTo(Number(e.target.value));


document.getElementById("homeBtn").addEventListener("click",()=>{
  window.location.href="https://sinan-ipek.github.io/projeler/index.html";
});

langBtn.addEventListener("click",(e)=>{
  e.stopPropagation();
  langMenu.classList.toggle("open");
  langBtn.setAttribute("aria-expanded",langMenu.classList.contains("open"));
});
document.querySelectorAll(".lang-option").forEach(btn=>{
  btn.addEventListener("click",()=>{
    langMenu.classList.remove("open");
    applyLanguage(btn.dataset.lang);
  });
});
document.addEventListener("click",()=>langMenu.classList.remove("open"));

document.getElementById("helpBtn").addEventListener("click",()=>helpModal.classList.add("open"));
document.getElementById("closeHelp").addEventListener("click",()=>helpModal.classList.remove("open"));
helpModal.addEventListener("click",(e)=>{ if(e.target===helpModal) helpModal.classList.remove("open"); });

document.addEventListener("keydown",(e)=>{
  if(helpModal.classList.contains("open")){
    if(e.key==="Escape") helpModal.classList.remove("open");
    return;
  }
  if(e.key==="ArrowRight") nextSlide();
  else if(e.key==="ArrowLeft") prevSlide();
  else if(e.key===" " || e.key==="Enter"){
    e.preventDefault();
    primaryAction();
  }
});

applyLanguage(lang);
</script>
