<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ziyaret İstatistikleri</title>
<style>
*{box-sizing:border-box}
body{font:14px system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#fff;color:#172036;margin:0}
main{width:min(390px,calc(100% - 32px));margin:44px auto 60px}
h1{font-size:18px;margin:0 0 24px;font-weight:600}
h2{font-size:14px;font-weight:600;margin:26px 0 11px}
#period{font-size:13px;text-align:right;margin:0 0 3px}
svg{width:100%;height:auto;display:block}
#zoom{width:100%;margin:12px 0 0;accent-color:#2362ae;cursor:pointer}
.ends{display:flex;justify-content:space-between;font-size:11px;color:#666}
table{width:100%;border-collapse:collapse}
td{padding:7px 1px;border-bottom:1px solid #eee}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#status{font-size:12px;line-height:1.6;color:#707b90;margin-top:18px}
.back{position:absolute;top:12px;left:15px;font-size:12px;text-decoration:none;color:#536070}
.back:hover{text-decoration:underline}
</style></head>
<body><a class="back" href="/projeler/">← Ana sayfa</a>
<main>
<h1>Ziyaretler — <span id="total">…</span></h1>
<div id="period">Son 7 gün</div>
<svg viewBox="0 0 350 185" aria-label="Ziyaret grafiği" role="img">
<path d="M43 12V153H341" stroke="currentColor" stroke-width="2" fill="none"/>
<g id="ticks"></g><polyline id="line" stroke="#2465b1" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" points=""/>
<g id="dates"></g>
</svg>
<input type="range" min="0" max="1000" step="1" value="0" id="zoom" aria-label="Zaman ölçeği">
<div class="ends"><span>7 gün</span><span>Başlangıçtan beri</span></div>
<h2>Sayfalar</h2><table><tbody id="pages"></tbody></table>
<p id="status" role="status">İstatistikler yükleniyor…</p>
</main>
<div style="position:fixed;bottom:5px;left:8px;color:#888;font:10px system-ui">v1.2 · Tüm projeler ve sıfır ziyaret gösterimi</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('tr-TR');
const ns='http://www.w3.org/2000/svg';
const ymd=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const dayDate=str=>new Date(str+'T12:00:00');
const addDays=(d,n)=>{const a=new Date(d);a.setDate(a.getDate()+n);return a};
const today=new Date();today.setHours(12,0,0,0);
let dataset=null;
let catalog=[];
async function loadCatalog(){
 try {
  const response=await fetch('/projeler/index.html',{cache:'no-store'});
  if(!response.ok)return;
  const doc=new DOMParser().parseFromString(await response.text(),'text/html');
  const seen=new Set();
  catalog=Array.from(doc.querySelectorAll('.grid a[href]')).map(a=>{
   const url=new URL(a.getAttribute('href'),location.origin+'/projeler/');
   const path=url.pathname.replace(/\/(index|launch)\.html$/i,'').replace(/\/$/,'');
   return {path,name:a.textContent.trim()};
  }).filter(item=>{if(!item.path.startsWith('/projeler/')||seen.has(item.path))return false;seen.add(item.path);return true;});
 } catch(e) { console.warn('Proje listesi alınamadı:',e); }
 if(dataset)show();
}
function svgText(parent,x,y,value,anchor='end'){
 const t=document.createElementNS(ns,'text');
 t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anchor);
 t.setAttribute('font-size','11');t.setAttribute('fill','currentColor');t.textContent=value;parent.append(t);
}
function draw(series,labels){
 const high=Math.max(1,...series);
 const top=Math.max(4,Math.ceil(high/4)*4);
 const ticks=$('ticks');ticks.replaceChildren();
 for(let i=0;i<=4;i++)svgText(ticks,35,155-i*32+3,fmt(top*i/4));
 const len=series.length;
 $('line').setAttribute('points',series.map((n,i)=>(48+(len===1?0:i*284/(len-1)))+','+(151-(n/top)*130)).join(' '));
 const dates=$('dates');dates.replaceChildren();
 svgText(dates,48,175,labels[0]||'','start');svgText(dates,332,175,labels[1]||'','end');
}
function show(){
 if(!dataset)return;
 const initial=dayDate(dataset.first_day);
 const totalDays=Math.max(7,Math.round((today-initial)/86400000)+1);
 const r=Number($('zoom').value)/1000;
 const span=Math.min(totalDays,Math.round(7*Math.pow(totalDays/7,r)));
 const from=addDays(today,1-span);
 $('period').textContent=span>=totalDays?'Başlangıçtan beri':'Son '+span+' gün';
 const dates=Array.from({length:span},(_,i)=>ymd(addDays(from,i)));
 const buckets=Math.min(50,span);
 const values=[];
 for(let b=0;b<buckets;b++){
  const a=Math.floor(b*span/buckets),e=Math.floor((b+1)*span/buckets);
  let count=0;
  for(let i=a;i<e;i++)count+=Number(dataset.total_daily?.[dates[i]]||0);
  values.push(count);
 }
 draw(values,[ymd(from),ymd(today)]);
 const rows=(dataset.pages||[]).map(page=>{
   const n=dates.reduce((sum,day)=>sum+Number(page.daily?.[day]||0),0);
   return {path:page.path.replace(/\/$/,''),name:page.title||page.path,number:n};
 });
 const known=new Set(rows.map(p=>p.path));
 for(const project of catalog){
  if(!known.has(project.path))rows.push({...project,number:0});
 }
 rows.sort((a,b)=>b.number-a.number||a.name.localeCompare(b.name,'tr'));
 $('pages').replaceChildren();
 for(const item of rows){
  const tr=document.createElement('tr'),left=document.createElement('td'),right=document.createElement('td');
  left.textContent=item.name;right.textContent=fmt(item.number);tr.append(left,right);$('pages').append(tr);
 }
 const sum=dates.reduce((a,d)=>a+Number(dataset.total_daily?.[d]||0),0);
 $('total').textContent=fmt(sum);
 $('status').textContent='Son güncelleme: '+new Date(dataset.updated_at).toLocaleString('tr-TR')+' · 0 görünen sayfalarda henüz ölçülmüş ziyaret yok.';
}
$('zoom').addEventListener('input',show);
loadCatalog();
fetch('./data.json?updated='+Date.now(),{cache:'no-store'}).then(async r=>{
 if(!r.ok)throw new Error('Henüz günlük veri dosyası oluşturulmadı.');
 const d=await r.json();
 if(!d||!d.first_day||!d.pages||!d.total_daily)throw new Error('Veri biçimi geçersiz.');
 dataset=d;show();
}).catch(e=>{$('total').textContent='—';$('status').textContent=e.message+' GitHub görevi ve API anahtarı ayarlandıktan sonra grafik otomatik dolacak.'});
})();
</script><script src="/projeler/shared-ui.js?v=20261018-home"></script>
</body></html>
