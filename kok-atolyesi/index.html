<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kök</title>
<style>
:root{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --line:#d8deea;
  --text:#1f2d3d;
  --muted:#66768c;
  --accent:#2f64d6;
  --accent-soft:#e9f0ff;
  --extract:#c6284b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.main{max-width:980px;margin:24px auto;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 22px;box-shadow:0 10px 28px rgba(18,34,60,.06)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title{font-size:28px;font-weight:800;letter-spacing:.2px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.counter{font-weight:800}
.level{padding:6px 10px;border-radius:999px;background:#eef3fb;color:#52647d;font-size:13px;font-weight:700}
button{font:inherit;border:none;cursor:pointer}
#newBtn{background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;font-weight:800}
#newBtn:hover{filter:brightness(.97)}
.status{margin-top:14px;min-height:24px;color:#4a5d77;font-size:15px}
.stage{position:relative;margin-top:14px;min-height:290px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.expression{position:relative;width:100%;height:180px;font-size:clamp(28px,4.3vw,52px);line-height:1.1}
/* Kökün sol kenarı hiçbir çarpan eklenip çıkarıldığında yer değiştirmez. */
.radical{position:absolute;left:43%;top:16px;display:inline-flex;align-items:flex-start;padding-left:54px;min-height:0;gap:0;white-space:nowrap}
.outside{position:absolute;right:57%;top:16px;height:auto;display:inline-flex;align-items:center;justify-content:flex-end;gap:0;min-width:68px;white-space:nowrap;padding:0 8px 0 0}
.degree{position:absolute;left:3px;top:26%;transform:translateY(-50%);min-width:28px;height:30px;padding:0 3px;border-radius:6px;border:2px solid transparent;background:transparent;color:#2f4260;font-weight:800;font-size:23px;display:grid;place-items:center;transition:background .15s,border-color .15s;z-index:2}
.degree.implicit{color:transparent}
.degree:hover,.degree:focus-visible{background:#fff2be;border-color:#f0c645;color:#2f4260;outline:none}
.rootmark{position:absolute;left:0;top:0;height:96px;width:120px;pointer-events:none;color:#213142;z-index:1}.rootmark svg{display:block;width:100%;height:100%}
.inside{display:inline-flex;align-items:baseline;min-height:70px;margin-top:0;padding:8px 8px 6px 1px;border-top:4px solid transparent;flex-wrap:wrap;gap:4px;line-height:1.1}
.factor{display:inline-flex;align-items:center;justify-content:center;min-width:22px;padding:5px 4px;border-radius:10px;border:2px solid transparent;background:transparent;color:#23384d;font-size:1em;transition:.15s}
.factor.clickable:hover,.factor.clickable:focus-visible{background:var(--accent-soft);border-color:#a9bef4;outline:none}
.factor.extractable{color:var(--extract);font-weight:800;background:#fff2f5;transition:color .4s ease,background-color .4s ease}
.factor.finished{opacity:.92}
.expression.compact .factor{padding-left:0;padding-right:0;min-width:0}
.expression.compact .inside,.expression.compact .outside-row{gap:0}
.factor-group-space{display:inline-flex;align-items:baseline;gap:4px;visibility:hidden;min-width:96px;justify-content:center;flex-shrink:0}
.root-unit-product-dot{position:absolute;color:#8a97ab;pointer-events:none;line-height:1;transform:translate(-50%,-50%);z-index:3}.dot{color:#8a97ab;transition:opacity .13s ease}.dot.fade-out{opacity:0}
.fraction-action{cursor:pointer}.fraction-action:hover .num{border-bottom-color:#2f64d6}.empty-fraction-one{display:inline-flex;align-items:center;justify-content:center;min-width:1em}.frac{display:inline-flex;flex-direction:column;align-items:center;min-width:44px;font-size:.76em;line-height:1.15}
.frac .num{display:flex;align-items:center;justify-content:center;border-bottom:2.5px solid currentColor;padding:0 6px 4px;min-height:26px}
.frac .den{display:flex;align-items:center;justify-content:center;padding:4px 6px 0;min-height:26px}
.outside .frac{position:relative}.outside .frac .num{position:relative;border-bottom-color:transparent}.outside .frac .num{transition:transform .3s cubic-bezier(.25,.1,.25,1)}.outside .frac .num{transform:none}.outside .frac .num::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.5px;background:currentColor;transform-origin:center;animation:outsideFractionBar .42s ease-out both}@keyframes outsideFractionBar{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.outside .frac{width:max-content}
.outside .frac .num,.outside .frac .den{width:100%;min-width:0;text-align:center;position:relative}
.outside .frac .num{border-bottom:2.5px solid currentColor}
.outside .frac .num::after{display:none}
.outside .frac .num,.outside .frac .den{transition:padding .24s ease}
.outside .frac .empty-fraction-one{position:relative}.outside .frac .has-incoming>.empty-fraction-one{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
.outside .frac .dynamic-fraction-row{display:contents}
.outside .frac .incoming-factor{visibility:hidden}
.outside-row{display:inline-flex;align-items:baseline;gap:0}.outside-slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.15em;position:relative}.outside-slot.empty{visibility:hidden}.outside-dot{display:inline-flex;align-items:center;justify-content:center;min-width:.45em;color:#8a97ab}.outside-dot.hidden{visibility:hidden}.factor.colorized{font-weight:800}
.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.float-token,.bubble,.burst{position:absolute;pointer-events:none;z-index:20}
.float-token{transform:translate(-50%,-50%);font-size:clamp(28px,4.3vw,52px);font-weight:800;color:var(--extract);transition:left .44s cubic-bezier(.2,.75,.3,1), top .44s cubic-bezier(.2,.75,.3,1), transform .28s ease, opacity .28s ease}
/* Paket yazısı oluşurken ve balon içindeyken aynı metriklere sahip olsun. */
.float-token:has(.power-pack){display:flex;align-items:center;justify-content:center;line-height:normal}
.power-pack{vertical-align:baseline;line-height:1}
.power-base{display:inline-block;line-height:1}
.power-pack{position:relative;display:inline-block;line-height:1.15;padding-right:.38em;white-space:nowrap;vertical-align:middle}
.power-pack sup{position:absolute;right:0;top:-.10em;font-size:.56em;line-height:1;vertical-align:baseline}
.bubble.waiting{pointer-events:auto;cursor:pointer;opacity:1!important;transition:opacity .25s ease}.bubble.waiting:hover{filter:brightness(1.07)}.bubble{transform:translate(-50%,-50%);min-width:54px;min-height:54px;padding:6px 12px;border-radius:999px;border:3px solid var(--extract);background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,4.3vw,52px);font-weight:800;color:var(--extract);box-shadow:none;opacity:0;transition:opacity .32s ease}
.burst{width:42px;height:42px;transform:translate(-50%,-50%);opacity:1;animation:fadeBurst .42s ease forwards}
.burst i{position:absolute;left:50%;top:50%;width:2px;height:11px;background:var(--extract);transform-origin:center -10px;border-radius:4px}
@keyframes fadeBurst{from{opacity:1;transform:translate(-50%,-50%) scale(.7)}to{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
@media (max-width:640px){
  .main{margin:14px auto}
  .panel{padding:14px 14px 18px}
  .title{font-size:24px}
  .stage{min-height:250px}
  .radical{left:38%}.outside{right:62%;min-width:0}
}
.difficulty{display:inline-flex;gap:4px;background:#edf1f7;padding:4px;border-radius:12px}.difficulty-btn{font-size:15px;font-weight:750;color:#52647d;background:transparent;border-radius:9px;padding:8px 13px}.difficulty-btn.active{background:#2f64d6;color:white;box-shadow:0 1px 5px #213b6d24}.difficulty-btn:focus-visible{outline:2px solid #15274b;outline-offset:2px}
.math-keyboard[hidden]{display:none}
.math-keyboard{width:min(100%,560px);margin:5px 0 12px;padding:12px;background:#f5f8fd;border:1px solid #c6d3e5;border-radius:14px;box-shadow:0 8px 22px #1b37501c}
.math-keyboard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#334961;font-size:14px}
#closeMathKeyboard{background:transparent;color:#64748b;border:0;font-size:25px;padding:0 7px;cursor:pointer}
.math-keyboard-keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.math-keyboard-keys button{min-height:39px;padding:5px 1px;border:1px solid #cdd7e5;border-radius:9px;background:#fff;color:#213142;font:700 19px Cambria,"Cambria Math",serif;cursor:pointer}
.math-keyboard-keys button:active{background:#dbeafe}
.math-keyboard-keys .math-special{background:#e7efff;color:#204d9b}
.math-keyboard-keys .math-delete{background:#fff0ee;color:#9b3f33}
@media(max-width:520px){.math-keyboard{padding:8px}.math-keyboard-keys{gap:4px}.math-keyboard-keys button{font-size:17px;min-height:37px}}
.custom-root-form{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:22px 0 5px;opacity:.62;transition:opacity .2s ease}.custom-root-form:hover,.custom-root-form:focus-within{opacity:1}
.custom-root-form label{font-size:14px;font-weight:700;color:#51607a}
.custom-root-form input{min-width:190px;max-width:340px;flex:1;border:1px solid #b4c0cf;border-radius:10px;padding:10px 12px;font:600 18px Cambria,serif;background:white;color:#213142}
.custom-root-form button{padding:10px 15px;border-radius:10px;background:#265fc5;color:white;border:0;font-weight:750;cursor:pointer}
.custom-root-error{font-size:13px;color:#b53a36}
.nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#homeBtn{display:inline-flex;align-items:center;justify-content:center;min-height:36px}
</style>
</head>
<body>
<main class="main">
  <section class="panel">
    <div class="toolbar">
      <div>
        <div class="title">Kök</div>
        <div class="meta" style="margin-top:6px">
          <span class="counter" id="counter"></span>
          <span class="level" id="level"></span>
        </div>
      </div>
      <div class="nav-actions"><div class="difficulty" role="group" aria-label="Zorluk seviyesi"><button type="button" class="difficulty-btn active" data-difficulty="easy" aria-pressed="true">Kolay</button><button type="button" class="difficulty-btn" data-difficulty="medium" aria-pressed="false">Orta</button><button type="button" class="difficulty-btn" data-difficulty="advanced" aria-pressed="false">İleri</button></div><button id="newBtn">Yeni soru</button><a id="homeBtn" href="../index.html" aria-label="Öğren ana sayfasına dön" title="Ana sayfa"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 28 L32 8 L50 28 L50 56 L14 56 Z" fill="#f7d916" stroke="#222222" stroke-width="4.5" stroke-linejoin="round"/><path d="M8 28 L32 8 L56 28" fill="none" stroke="#222222" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="40" width="16" height="16" fill="#d9d9d9" stroke="#222222" stroke-width="4.5" stroke-linejoin="round"/></svg></a></div>
    </div>

    <div class="status" id="status"></div>

    <div class="stage" id="stage">
      <svg class="overlay" id="overlay"></svg>
      <div class="expression">
        <span class="outside" id="outside"></span>
        <span class="radical">
          <button id="degree" class="degree implicit" aria-label="Kök derecesi">2</button>
          <span class="rootmark" aria-hidden="true"><svg viewBox="0 0 120 96" preserveAspectRatio="none"><path class="root-path" d="M 3 40 L 16 40 L 30 88 L 53 3 L 117 3" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span>
          <span class="inside" id="inside"></span>
        </span>
      </div>
    </div>
    <form id="customRootForm" class="custom-root-form" autocomplete="off">
      <label for="customRootInput">Kendi kökünü yaz</label>
      <input id="customRootInput" type="text" spellcheck="false" placeholder="√(24x²), ∛54, √(72/25)" aria-label="Kök ifadesi" />
      <button type="submit">Başlat</button>
      <span id="customRootError" class="custom-root-error" role="status"></span>
    </form>
    <div id="mathKeyboard" class="math-keyboard" hidden aria-label="Matematik klavyesi">
      <div class="math-keyboard-head"><strong>Matematik klavyesi</strong><button type="button" id="closeMathKeyboard" aria-label="Klavyeyi kapat">×</button></div>
      <div class="math-keyboard-keys" id="mathKeyboardKeys"></div>
    </div>
  </section>
</main>

<script>
(()=>{
  'use strict';

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const overlay = $('overlay');
  const insideEl = $('inside');
  const outsideEl = $('outside');

  const pools = {
    1: [
      {d:2,n:12,label:'Karekök'}, {d:2,n:18,label:'Karekök'}, {d:2,n:20,label:'Karekök'},
      {d:2,n:24,label:'Karekök'}, {d:2,n:28,label:'Karekök'}, {d:2,n:40,label:'Karekök'},
      {d:2,n:45,label:'Karekök'}, {d:2,n:50,label:'Karekök'}, {d:2,n:60,label:'Karekök'},
      {d:2,n:72,label:'Karekök'}, {d:2,n:75,label:'Karekök'}, {d:2,n:80,label:'Karekök'},
      {d:2,n:90,label:'Karekök'}, {d:2,n:98,label:'Karekök'}, {d:2,n:108,label:'Karekök'}
    ],
    2: [
      {d:3,n:16,label:'Küpkök'}, {d:3,n:24,label:'Küpkök'}, {d:3,n:54,label:'Küpkök'},
      {d:3,n:81,label:'Küpkök'}, {d:3,n:108,label:'Küpkök'}, {d:3,n:128,label:'Küpkök'},
      {d:3,n:162,label:'Küpkök'}, {d:3,n:200,label:'Küpkök'}, {d:3,n:250,label:'Küpkök'},
      {d:3,n:432,label:'Küpkök'}
    ],
    3: [
      {d:2,n:12,vars:{x:2},label:'Değişkenli karekök'},
      {d:2,n:18,vars:{x:4,y:2},label:'Değişkenli karekök'},
      {d:2,n:20,vars:{a:2},label:'Değişkenli karekök'},
      {d:2,n:45,vars:{x:2,y:3},label:'Değişkenli karekök'},
      {d:3,n:16,vars:{a:3},label:'Değişkenli küpkök'},
      {d:3,n:54,vars:{x:3},label:'Değişkenli küpkök'},
      {d:3,n:24,vars:{y:6},label:'Değişkenli küpkök'}
    ],
    4: [
      {d:2,n:72,den:25,label:'Kesirli karekök'},
      {d:2,n:48,den:75,label:'Kesirli karekök'},
      {d:2,n:27,den:16,vars:{x:2},label:'Kesirli karekök'},
      {d:2,n:72,den:50,vars:{a:2},label:'Kesirli karekök'},
      {d:3,n:54,den:125,label:'Kesirli küpkök'},
      {d:3,n:16,den:54,vars:{x:3},label:'Kesirli küpkök'},
      {d:3,n:250,den:16,label:'Kesirli küpkök'}
    ]
  };

  let questionNo = 0;
  let difficulty = 'easy';
  let levelQuestionNo = 0;
  let current = null;
  let phase = 'seed';
  let inner = [];
  let outer = [];
  let nextId = 1;
  let animating = false;
  let placementLocked = false;
  let compactProduct = false;
  let rootUnitStage = 0;
  let outsideFractionStarted = false;
  let insideFractionCollapsed = false;
  const palette = ['#d7264d','#2a9d55','#7a3dd8','#e07a14','#147ca8','#b5419d'];
  let plannedSlots = {num:0, den:0};
  let nextSlotByPart = {num:0, den:0};
  let nextGroupId = 1;
  let pendingGroups = new Set();
  let exitingGroups = new Set();

  function deepClone(obj){return JSON.parse(JSON.stringify(obj));}
  function randomFrom(arr){return deepClone(arr[Math.floor(Math.random()*arr.length)]);}
  function makeQuestion(){
    const r=Math.random();
    let stageNo;
    if(difficulty==='easy'){
      stageNo=levelQuestionNo<=5?1:(r<.82?1:2);
    }else if(difficulty==='medium'){
      stageNo=r<.55?2:r<.85?3:1;
    }else{
      stageNo=r<.72?4:r<.90?3:r<.97?2:1;
    }
    return {...randomFrom(pools[stageNo]),stageNo};
  }

  function primeFactors(n){
    const out = [];
    let x = n;
    for(let p=2; p*p<=x; p++){
      while(x % p === 0){ out.push(p); x /= p; }
    }
    if(x > 1) out.push(x);
    return out;
  }

  function token(type, base, side, part='num', exp=1){
    return {id:nextId++, type, base, side, part, exp};
  }

  function tokenText(t){
    if(t.type === 'num') return String(t.base);
    return String(t.base) + (t.exp > 1 ? `<sup style="font-size:.56em">${t.exp}</sup>` : '');
  }

  function kindKey(t){
    return `${t.part}|${t.type}|${t.base}`;
  }

  function clearExtractionMarks(){
    inner.forEach(t => {
      delete t.extractGroupId;
      delete t.extractColor;
    });
  }

  function buildExtractionPlan(){
    // Önceden paketlenmiş grupların kimliklerini ve slotlarını koru.

    const buckets = {};
    inner.forEach(t => {
      if(t.type==='var' && t.exp===current.d && !t.extractGroupId){
        const gid=nextGroupId++;
        t.extractGroupId=gid;
        t.extractColor=palette[(gid-1)%palette.length];
        plannedSlots[t.part]=Math.max(plannedSlots[t.part],nextSlotByPart[t.part]+1);
      }
    });
    inner.forEach(t => {
      if(t.exp !== 1 || t.extractGroupId) return;
      const k = kindKey(t);
      (buckets[k] ||= []).push(t);
    });

    let colorIndex = 0;
    Object.keys(buckets).sort().forEach(k => {
      const groupTokens = buckets[k];
      const groupCount = Math.floor(groupTokens.length / current.d);
      if(groupCount <= 0) return;
      const part = k.split('|')[0];
      plannedSlots[part] = Math.max(plannedSlots[part], nextSlotByPart[part] + groupCount + pendingGroups.size);
      for(let g = 0; g < groupCount; g++){
        const color = palette[colorIndex % palette.length];
        colorIndex += 1;
        const groupId = nextGroupId++;
        for(let j = 0; j < current.d; j++){
          const tok = groupTokens[g * current.d + j];
          tok.extractGroupId = groupId;
          tok.extractColor = color;
        }
      }
    });
    // Henüz açılmamış bir çarpan da gelecekte slot gerektirebilir.
    for(const part of ['num','den']){
      const all=[];
      inner.filter(t=>t.part===part).forEach(t=>{
        if(t.type==='num') all.push(...primeFactors(t.base).map(String));
        else for(let i=0;i<t.exp;i++) all.push(String(t.base));
      });
      const counts={};all.forEach(x=>counts[x]=(counts[x]||0)+1);
      const potential=Object.values(counts).reduce((sum,n)=>sum+Math.floor(n/current.d),0);
      plannedSlots[part]=Math.max(plannedSlots[part],nextSlotByPart[part]+potential);
    }
  }

  function colorOf(t){
    if(t.side === 'in') return isExtractable(t) ? (t.extractColor || '') : '';
    return t.color || '';
  }

  function displayLabel(){
    const stages = {
      1:'1. aşama · karekök',
      2:'2. aşama · küpkök',
      3:'3. aşama · değişkenler',
      4:'4. aşama · kesirler'
    };
    const titles={easy:'Kolay',medium:'Orta',advanced:'İleri'};
    return titles[difficulty]+' · '+stages[current.stageNo].split(' · ')[1];
  }

  function setStatus(text){ $('status').textContent = text; }

  function startQuestion(custom=null){
    questionNo += 1;
    if(custom && typeof custom==='object')current=custom;
    else{levelQuestionNo += 1;current=makeQuestion();}
    phase = 'seed';
    inner = [];
    outer = [];
    animating = false;
    placementLocked = false;
    compactProduct = false;
    rootUnitStage = 0;
    outsideFractionStarted = false;
    insideFractionCollapsed = false;
    document.querySelector('.expression').classList.remove('compact');
    document.querySelector('.radical').style.left = '';
    outsideEl.style.right = '';
    outsideEl.style.top = '16px';
    plannedSlots = {num:0, den:0};
    nextSlotByPart = {num:0, den:0};
    nextGroupId = 1;
    pendingGroups = new Set();
    exitingGroups = new Set();
    stage.querySelectorAll('.bubble,.float-token,.burst').forEach(el => el.remove());
    $('counter').textContent = `Soru ${questionNo}`;
    $('level').textContent = displayLabel();
    $('degree').textContent = current.d;
    $('degree').classList.toggle('implicit', current.d === 2);
    $('degree').setAttribute('aria-label', `${current.d}. dereceden kök`);
    inner=originalInsideTokens();
    buildExtractionPlan();
    phase=anyExtractable()?'extract':inner.some(canExpand)?'seed':'merge';
    if(phase==='merge' && !anyMergeable() && !fractionCanReduce()) phase='format';
    setStatus('Açmak istediğin çarpana tıkla.');
    render();
  }

  function originalInsideTokens(){
    const arr = [token('num', current.n, 'in', 'num')];
    for(const [v, exp] of Object.entries(current.vars || {})) arr.push(token('var', v, 'in', 'num', exp));
    if(current.den) arr.push(token('num', current.den, 'in', 'den'));
    return arr;
  }

  function canExpand(t){
    return t.side==='in' && ((t.type==='num' && primeFactors(t.base).length>1) ||
      (t.type==='var' && t.exp>current.d));
  }
  function expandOnly(tok){
    if(!canExpand(tok)) return;
    const pos=inner.findIndex(t=>t.id===tok.id);
    if(pos<0) return;
    const parts=tok.type==='num'
      ?(current.den && Number.isInteger(Math.round(tok.base**(1/current.d))) &&
          Math.round(tok.base**(1/current.d))**current.d===tok.base
          ?Array(current.d).fill(Math.round(tok.base**(1/current.d)))
          :primeFactors(tok.base)).map(n=>token('num',n,'in',tok.part))
      :Array.from({length:Math.floor(tok.exp/current.d)},()=>token('var',tok.base,'in',tok.part,current.d))
        .concat(tok.exp%current.d ? [token('var',tok.base,'in',tok.part,tok.exp%current.d)] : []);
    inner.splice(pos,1,...parts);
    buildExtractionPlan();
    phase=(anyExtractable()||inner.some(canExpand))?'extract':'merge';
    render();
    reserveHorizontalSpace();
    if(tok.type==='var'){
      const pending=parts.filter(t=>t.exp===current.d && t.extractGroupId);
      const queue=()=> {
        const next=pending.shift();
        if(next && inner.some(t=>t.id===next.id)){
          extractGroup(next,()=>setTimeout(queue,30));
        }
      };
      if(pending.length) requestAnimationFrame(queue);
    }
    if(phase==='merge' && !anyMergeable()) readyToCompact();
  }

  function listForRender(side){
    if(phase === 'seed') return side === 'in' ? inner : [];
    return side === 'in' ? inner : outer;
  }

  function groupFor(tok){
    if(!tok.extractGroupId) return [];
    return inner.filter(t => t.extractGroupId === tok.extractGroupId);
  }

  function isExtractable(tok){
    if(!['extract','seed'].includes(phase) || tok.side !== 'in') return false;
    return !!tok.extractGroupId && !pendingGroups.has(tok.extractGroupId) && (groupFor(tok).length === current.d || (tok.type==='var' && tok.exp===current.d && groupFor(tok).length===1));
  }

  function anyExtractable(){
    return inner.some(t => isExtractable(t));
  }

  function bucketTokens(side, part){
    const src = side === 'in' ? inner : outer;
    return src.filter(t => t.part === part);
  }

  function bucketHasMergeable(side, part){
    const bucket = bucketTokens(side, part);
    if(bucket.length < 2) return false;
    let numberCount = 0;
    const vars = {};
    for(const t of bucket){
      if(t.type === 'num') numberCount += 1;
      else vars[t.base] = (vars[t.base] || 0) + 1;
    }
    if(numberCount > 1) return true;
    return Object.values(vars).some(v => v > 1);
  }

  function anyMergeable(){
    return bucketHasMergeable('in','num') || bucketHasMergeable('in','den') || bucketHasMergeable('out','num') || bucketHasMergeable('out','den');
  }

  function tokenClickable(tok){
    if(animating) return false;
    if(phase === 'seed') return canExpand(tok) || isExtractable(tok);
    if(phase === 'extract') return isExtractable(tok) || canExpand(tok);
    if(phase === 'merge') return bucketHasMergeable(tok.side, tok.part) || (tok.side==='in' && (fractionCanReduce() || rootIsOne())) || (tok.side==='out' && hasOutsideLiteralProduct(tok.part));
    if(phase === 'format') return true;
    if(phase === 'unit') return tok.side==='in' && tok.type==='num' && tok.base===1;
    if(phase === 'done' && rootUnitStage===0 && rootIsOne()) return tok.side==='in';
    return false;
  }

  function tokenClasses(tok){
    const classes = ['factor'];
    if(tokenClickable(tok)) classes.push('clickable');
    if(isExtractable(tok)) classes.push('extractable');
    if(phase === 'done') classes.push('finished');
    return classes.join(' ');
  }

  function renderToken(tok){
    const btn = document.createElement('button');
    btn.className = tokenClasses(tok);
    btn.dataset.id = tok.id;
    btn.innerHTML = tokenText(tok);
    const c = colorOf(tok);
    if(c){
      btn.classList.add('colorized');
      btn.style.color = c;
      if(isExtractable(tok)) btn.style.backgroundColor = c + '18';
    }
    if(tok.extractGroupId && pendingGroups.has(tok.extractGroupId)) btn.style.visibility = 'hidden';
    btn.disabled = !tokenClickable(tok);
    btn.onclick = () => handleToken(tok);
    return btn;
  }

  // Noktalar durum verisi değildir: yalnızca sahnede kalan matematiksel
  // çarpanların komşuluğundan üretilir. Bekleyen balon TEK çarpandır.
  function appendBucket(parent, arr, showOne){
    if(arr.length === 0){
      if(showOne) parent.appendChild(document.createTextNode('1'));
      return;
    }

    const units = [];
    const visited = new Set();
    for(const tok of arr){
      const gid = tok.extractGroupId;
      if(gid && pendingGroups.has(gid)){
        if(visited.has(gid)) continue;
        visited.add(gid);
        units.push({kind: exitingGroups.has(gid) ? 'departed' : 'bubble',
          tokens: arr.filter(t => t.extractGroupId === gid)});
      }else{
        units.push({kind:'factor', tokens:[tok]});
      }
    }

    let previousReal = false;
    for(const unit of units){
      const real = unit.kind !== 'departed';
      if(real && previousReal && !compactProduct){
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.textContent = '·';
        parent.appendChild(dot);
      }

      if(unit.kind === 'factor'){
        parent.appendChild(renderToken(unit.tokens[0]));
      }else{
        // Alanı koru: diğer sayılar balon çıkarken sıçramaz.
        // Balonun kendisi animasyon katmanında gösteriliyor.
        const anchor = document.createElement('span');
        anchor.className = 'factor-group-space';
        anchor.dataset.groupId = String(unit.tokens[0].extractGroupId);
        anchor.setAttribute('aria-hidden','true');
        unit.tokens.forEach((tok,i) => {
          if(i > 0){
            const gap = document.createElement('span');
            gap.className = 'dot';
            gap.textContent = '·';
            gap.style.visibility = 'hidden';
            anchor.appendChild(gap);
          }
          const ghost = renderToken(tok);
          ghost.style.visibility = 'hidden';
          anchor.appendChild(ghost);
        });
        parent.appendChild(anchor);
      }
      if(real) previousReal = true;
    }
  }

  // Kesirli dış alanda rezervasyon yoktur. Görünür terimler yerleşimi belirler.
  // incoming=true öğe sadece animasyon hedefini ölçmek için gizlice oluşturulur.
  function renderDynamicFractionPart(parent, part){
    const tokens=outer.filter(t=>t.part===part)
      .sort((a,b)=>{
        if(a.joinedProduct&&a.joinedProduct===b.joinedProduct){
          return (a.type==='num'?0:1)-(b.type==='num'?0:1) ||
                 String(a.base).localeCompare(String(b.base));
        }
        return (b.arrivalOrder||0)-(a.arrivalOrder||0);
      });
    const real=tokens.filter(t=>!t.incoming);
    if(!real.length){
      const one=document.createElement('span');
      one.className='empty-fraction-one';
      one.textContent='1';
      parent.appendChild(one);
    }
    const arriving=tokens.filter(t=>t.incoming);
    if(arriving.length && !real.length) parent.classList.add('has-incoming');
    // Hedefleri satırın doğal genişliğine dahil et, sabit slotlara yerleştirme.
    // Gelen terim daha görünür değilken yer tutan 1 ortada kalır.
    const row=document.createElement('span');
    row.className='outside-row dynamic-fraction-row';
    tokens.forEach((tok,i)=>{
      if(i>0 && !compactProduct && !tok.incoming && !tokens[i-1].incoming &&
         !(tok.joinedProduct && tok.joinedProduct===tokens[i-1].joinedProduct)){
        const dot=document.createElement('span');
        dot.className='outside-dot';
        dot.textContent='·';
        row.appendChild(dot);
      }
      const node=renderToken(tok);
      if(tok.incoming){
        node.classList.add('incoming-factor');
        node.style.visibility='hidden';
      }
      row.appendChild(node);
    });
    if(tokens.length) parent.appendChild(row);
  }

  function renderOutsidePart(parent, part){
    const row = document.createElement('span');
    row.className = 'outside-row';
    const tokens = outer.filter(t => t.part === part).sort((a,b)=>(a.slot ?? 999)-(b.slot ?? 999));
    if(phase === 'extract'){
      const bySlot = {};
      tokens.forEach(t => bySlot[t.slot] = t);
      const total = plannedSlots[part] || tokens.length;
      for(let slot = total - 1; slot >= 0; slot--){
        if(slot < total - 1){
          const dot = document.createElement('span');
          dot.className = 'outside-dot' + ((bySlot[slot] && bySlot[slot+1]) ? '' : ' hidden');
          dot.textContent = '·';
          row.appendChild(dot);
        }
        const slotEl = document.createElement('span');
        slotEl.className = 'outside-slot' + (bySlot[slot] ? '' : ' empty');
        slotEl.dataset.slot = String(slot);
        slotEl.dataset.part = part;
        if(bySlot[slot]) slotEl.appendChild(renderToken(bySlot[slot]));
        else {
          const ghost = document.createElement('span');
          ghost.className = 'factor';
          ghost.textContent = '8';
          slotEl.appendChild(ghost);
        }
        row.appendChild(slotEl);
      }
      if(total === 0){
        const slotEl = document.createElement('span');
        slotEl.className = 'outside-slot empty';
        slotEl.dataset.slot = '0';
        slotEl.dataset.part = part;
        const ghost = document.createElement('span');
        ghost.className = 'factor';
        ghost.textContent = '8';
        slotEl.appendChild(ghost);
        row.appendChild(slotEl);
      }
    } else {
      if(tokens.length === 0) return;
      tokens.sort((a,b)=>(a.slot ?? 999)-(b.slot ?? 999)).forEach((tok, idx) => {
        if(idx > 0 && !compactProduct){
          const dot = document.createElement('span');
          dot.className = 'outside-dot';
          dot.textContent = '·';
          row.appendChild(dot);
        }
        row.appendChild(renderToken(tok));
      });
    }
    parent.appendChild(row);
  }

  function renderZone(side, el){
    el.replaceChildren();
    const arr = listForRender(side);
    if(side === 'out'){
      if(current.den && (outsideFractionStarted || outer.some(t=>t.part==='den'))){
        const frac = document.createElement('span');
        frac.className = 'frac';
        const num = document.createElement('span');
        num.className = 'num';
        const den = document.createElement('span');
        den.className = 'den';
        renderDynamicFractionPart(num, 'num');
        renderDynamicFractionPart(den, 'den');
        frac.append(num, den);
        el.appendChild(frac);
      } else {
        renderOutsidePart(el, 'num');
      }
      return;
    }
    if(current.den && !insideFractionCollapsed && rootUnitStage===0){
      const frac = document.createElement('span');
      frac.className = 'frac';
      const num = document.createElement('span');
      num.className = 'num';
      const den = document.createElement('span');
      den.className = 'den';
      appendBucket(num, arr.filter(t => t.part === 'num'), side === 'in' || arr.length > 0);
      appendBucket(den, arr.filter(t => t.part === 'den'), true);
      frac.append(num, den);
      if(phase==='merge' && fractionCanReduce()){
        frac.classList.add('fraction-action');
        frac.title='Kesri sadeleştir';
        frac.addEventListener('click',e=>{
          if(!animating){e.stopPropagation();reduceInnerFraction();}
        });
      }
      el.appendChild(frac);
    } else {
      appendBucket(el, arr.filter(t => t.part === 'num'), side === 'in');
    }
  }

  // Beyaz tahtadaki üç kontrol noktasıyla aynı geometri ilkesi:
  // başlangıç, dip ve çatı. Tek çizgi bütün bağlantıları pürüzsüz tutar.
  let rootGeometry=null;
  let rootMorphFrame=0;
  function drawRootGeometry(geometry){
    const mark=document.querySelector('.rootmark');
    const svg=mark.querySelector('svg');
    const path=mark.querySelector('.root-path');
    const {w,h}=geometry;
    mark.style.width=w+'px';
    mark.style.height=h+'px';
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    const top=3, low=h-8;
    const startY=top+(low-top)*0.39;
    const x0=3, x1=16, x2=30, x3=53, xEnd=w-3;
    path.setAttribute('d',`M ${x0} ${startY} L ${x1} ${startY} L ${x2} ${low} L ${x3} ${top} L ${xEnd} ${top}`);
  }
  function updateRootGeometry(w,h){
    const target={w:Math.max(76,Math.ceil(w)),h:Math.max(92,Math.ceil(h))};
    if(rootGeometry && Math.abs(rootGeometry.w-target.w)<1 && Math.abs(rootGeometry.h-target.h)<1)return;
    cancelAnimationFrame(rootMorphFrame);
    const from=rootGeometry||target;
    const begin=performance.now(),duration=260;
    const move=now=>{
      const u=Math.min(1,(now-begin)/duration);
      const e=u*u*(3-2*u);
      drawRootGeometry({w:from.w+(target.w-from.w)*e,h:from.h+(target.h-from.h)*e});
      if(u<1)rootMorphFrame=requestAnimationFrame(move);
      else rootGeometry=target;
    };
    // İlk çizim zıplamasızdır; sonraki boyut değişimleri yumuşak ilerler.
    if(!rootGeometry){rootGeometry=target;drawRootGeometry(target);}
    else rootMorphFrame=requestAnimationFrame(move);
  }
  function alignFormula(){
    const radical=document.querySelector('.radical');
    const inside=insideEl.getBoundingClientRect();
    const desiredHeight=Math.max(96,Math.ceil(inside.height+12));
    // Çatı kök içinin o anki gerçek genişliğine göre uzar.
    const desiredWidth=54+inside.width;
    radical.style.paddingLeft='54px';
    updateRootGeometry(desiredWidth,desiredHeight);
    // Kesir varsa merkezlerini değil, kesir çizgilerini hizala.
    const inFraction = insideEl.querySelector('.frac');
    const outFraction = outsideEl.querySelector('.frac');
    let correction = 0;
    if(inFraction && outFraction){
      const innerBar = inFraction.querySelector('.num');
      const outerBar = outFraction.querySelector('.num');
      const ir=innerBar.getBoundingClientRect();
      const or=outerBar.getBoundingClientRect();
      correction=ir.bottom-or.bottom;
    }else{
      const inReference = inFraction || insideEl.querySelector('.factor');
      const outReference = outFraction || outsideEl.querySelector('.factor');
      if(inReference && outReference){
        const ir=inReference.getBoundingClientRect();
        const or=outReference.getBoundingClientRect();
        correction=(ir.top+ir.height/2)-(or.top+or.height/2);
      }
    }
    if(Math.abs(correction)>0.75){
      const oldTop=parseFloat(outsideEl.style.top || '16');
      outsideEl.style.top=(oldTop+correction)+'px';
    }
  }
  function alignRootUnitProductDot(){
    const expression=document.querySelector('.expression');
    let dot=expression.querySelector('.root-unit-product-dot');
    const show=rootUnitStage===1 && outer.some(t=>!t.incoming) && !compactProduct;
    if(!show){if(dot)dot.remove();return;}
    if(!dot){
      dot=document.createElement('span');
      dot.className='root-unit-product-dot';
      dot.textContent='·';
      dot.setAttribute('aria-hidden','true');
      expression.appendChild(dot);
    }
    const outsideRect=outsideEl.getBoundingClientRect();
    const one=insideEl.querySelector('.factor') || insideEl;
    const oneRect=one.getBoundingClientRect();
    const frame=expression.getBoundingClientRect();
    dot.style.left=((outsideRect.right+oneRect.left)/2-frame.left)+'px';
    dot.style.top=((oneRect.top+oneRect.bottom)/2-frame.top)+'px';
  }

  function render(){
    renderZone('out', outsideEl);
    const radicalElement=document.querySelector('.radical');
    const rootShape=radicalElement.querySelector('.rootmark');
    const degreeElement=radicalElement.querySelector('.degree');
    // Kök sembolü yoksa kök derecesi de hiçbir koşulda görünmez.
    degreeElement.style.visibility=rootUnitStage===0?'':'hidden';
    degreeElement.disabled=rootUnitStage!==0;
    if(rootUnitStage===2){
      insideEl.replaceChildren();
      radicalElement.style.visibility='hidden';
    }else{
      radicalElement.style.visibility='';
      renderZone('in',insideEl);
      rootShape.style.visibility=rootUnitStage===1?'hidden':'';
      insideEl.style.borderTopColor=rootUnitStage===1?'transparent':'';
    }
    requestAnimationFrame(() => {
      alignFormula();
      alignRootUnitProductDot();
      // Her balon, kendi grubunun yer tutucusunun tam merkezinde kalır.
      stage.querySelectorAll('.bubble.waiting[data-group-id]').forEach(bubble => {
        const anchor=insideEl.querySelector(`.factor-group-space[data-group-id="${bubble.dataset.groupId}"]`);
        if(!anchor) return;
        const rect=anchor.getBoundingClientRect();
        const stageRect=stage.getBoundingClientRect();
        bubble.style.left=(rect.left-stageRect.left+rect.width/2)+'px';
        bubble.style.top=(rect.top-stageRect.top+rect.height/2)+'px';
      });
    });
  }

  function handleToken(tok){
    if(animating) return;
    if(phase === 'seed' && isExtractable(tok)) extractGroup(tok);
    else if(phase === 'seed') expandOnly(tok);
    else if(phase === 'extract' && isExtractable(tok)) extractGroup(tok);
    else if(phase === 'extract' && canExpand(tok)) expandOnly(tok);
    else if(phase === 'merge'){
      if(tok.side==='in' && rootIsOne() && advanceUnitRoot()) return;
      if(tok.side==='out' && compactOutsideProduct(tok.part)) return;
      if(tok.side==='in' && reduceInnerFraction()) return;
      simplifyBucket(tok.side,tok.part);
    }
    else if(phase === 'format') compactAndFinish();
    else if(phase === 'unit') advanceUnitRoot();
    else if(phase === 'done' && rootUnitStage===0 && rootIsOne()) advanceUnitRoot();
  }

  function centerOf(el){
    const stageRect = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return {x: r.left - stageRect.left + r.width/2, y: r.top - stageRect.top + r.height/2};
  }

  function average(points){
    const total = points.reduce((acc,p)=>({x:acc.x+p.x, y:acc.y+p.y}), {x:0,y:0});
    return {x: total.x/points.length, y: total.y/points.length};
  }

  function makeFloatClone(node, point, color=''){
    const clone = document.createElement('div');
    clone.className = 'float-token';
    clone.innerHTML = node.innerHTML;
    clone.style.left = point.x + 'px';
    clone.style.top = point.y + 'px';
    if(color) clone.style.color = color;
    stage.appendChild(clone);
    return clone;
  }

  function fadeInternalDots(groupNodes){
    if(!groupNodes || !groupNodes.length) return;
    const parent = groupNodes[0].parentElement;
    if(!parent) return;
    const selected = new Set(groupNodes);
    const kids = [...parent.children];

    function nearestFactor(start, step){
      let i = start + step;
      while(i >= 0 && i < kids.length){
        const el = kids[i];
        if(el.classList && el.classList.contains('factor')) return el;
        i += step;
      }
      return null;
    }

    kids.forEach((el, idx) => {
      if(!el.classList.contains('dot')) return;
      const leftFactor = nearestFactor(idx, -1);
      const rightFactor = nearestFactor(idx, 1);
      if(leftFactor && rightFactor && selected.has(leftFactor) && selected.has(rightFactor)){
        el.classList.add('fade-out');
      }
    });
  }

  // Balon dışarı çıkarken yalnızca iki gerçek, görünür çarpanı bağlayan noktalar kalır.
  function fadeOrphanProductDots(){
    const regions = [insideEl, ...insideEl.querySelectorAll('.num, .den')];
    regions.forEach(parent => {
      const children = [...parent.children];
      // Disabled factors are still numbers; visibility alone determines presence.
      const isPresent = el => el && el.classList?.contains('factor') &&
        el.style.visibility !== 'hidden' && el.style.opacity !== '0';
      children.forEach((dot, i) => {
        if(!dot.classList?.contains('dot')) return;
        const left = children.slice(0,i).reverse().find(el => el.classList?.contains('factor'));
        const right = children.slice(i+1).find(el => el.classList?.contains('factor'));
        if(!isPresent(left) || !isPresent(right)) dot.classList.add('fade-out');
      });
    });
  }

  function getOutsideTarget(part, slot){
    const stageRect = stage.getBoundingClientRect();
    const slotEl = outsideEl.querySelector(`.outside-slot[data-part="${part}"][data-slot="${slot}"]`);
    // Eksik slot yüzünden animasyonun kilitlenmesini önle.
    const fallback=slotEl || outsideEl.querySelector(part==='den'?'.frac .den':'.frac .num') || outsideEl;
    const r = fallback.getBoundingClientRect();
    return {x: r.left - stageRect.left + r.width/2, y: r.top - stageRect.top + r.height/2};
  }

  function clearOverlay(){
    overlay.replaceChildren();
  }

  function animateBubble(label, start, target, color, done, bubble, part){
    clearOverlay();
    bubble.classList.remove('waiting');
    bubble.style.pointerEvents = 'none';
    bubble.onclick = null;
    const box = stage.getBoundingClientRect();
    overlay.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);

    const rootRect = document.querySelector('.rootmark').getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const rootLeft=rootRect.left-stageRect.left;
    const rootTop=rootRect.top-stageRect.top;
    const rootBottom=rootRect.bottom-stageRect.top;
    const turnX=rootLeft+24;
    const fromNorth=current.den && part==='num';
    const viaY=fromNorth?rootTop-30:rootBottom+14;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',
      `M ${start.x} ${start.y} C ${start.x-12} ${viaY}, ${turnX+28} ${viaY}, ${turnX} ${viaY} S ${target.x+16} ${target.y+4}, ${target.x} ${target.y}`);
    path.setAttribute('fill','none');
    overlay.appendChild(path);
    const len = path.getTotalLength();
    const duration = 720;
    const t0 = performance.now();

    function frame(now){
      const p = Math.min(1, (now - t0) / duration);
      const eased = p * p * (3 - 2 * p); // yavaş → hızlı → yavaş
      const pt = path.getPointAtLength(len * eased);
      bubble.style.left = pt.x + 'px';
      bubble.style.top = pt.y + 'px';
      bubble.style.opacity = String(Math.min(1, p / .12, (1 - p) / .10));
      if(p < 1) requestAnimationFrame(frame);
      else {
        bubble.remove();
        burst(target, color);
        setTimeout(() => { clearOverlay(); done(); }, 90);
      }
    }
    requestAnimationFrame(frame);
  }

  function burst(point, color=''){
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.left = point.x + 'px';
    b.style.top = point.y + 'px';
    for(let i=0;i<8;i++){
      const ray = document.createElement('i');
      ray.style.transform = `translate(-50%,-50%) rotate(${i*45}deg)`;
      if(color) ray.style.background = color;
      b.appendChild(ray);
    }
    stage.appendChild(b);
    setTimeout(() => b.remove(), 420);
  }

  function packageLabel(group){
    if(!group.length) return '';
    const t=group[0];
    return '<span class="power-pack"><span class="power-base">'+String(t.base)+'</span><sup>'+current.d+'</sup></span>';
  }
  function extractGroup(tok, onPacked){

    const group = groupFor(tok);
    if(group.length !== current.d && !(group.length===1 && tok.type==='var' && tok.exp===current.d)) return;
    animating = true;
    const session = questionNo;
    pendingGroups.add(tok.extractGroupId);

    const nodes = group
      .map(g => document.querySelector(`[data-id="${g.id}"]`))
      .filter(Boolean);

    const points = nodes.map(centerOf);
    const middle = average(points);
    const tint = colorOf(tok);
    const packageHtml=packageLabel(group);
    const direct=group.length===1 && tok.type==='var' && tok.exp===current.d;
    const showBubble=()=>{
      if(session!==questionNo)return;
        const bubble = document.createElement('button');
        bubble.type = 'button';
        bubble.className = 'bubble waiting';
        bubble.dataset.groupId = String(tok.extractGroupId);
        bubble.innerHTML = packageHtml;
        bubble.setAttribute('aria-label', 'Kök dışına çıkarmak için tıkla');
        bubble.title = 'Dışarı çıkar';
        if(tint){ bubble.style.color = tint; bubble.style.borderColor = tint; }
        bubble.style.left = middle.x + 'px';
        bubble.style.top = middle.y + 'px';
        stage.appendChild(bubble);
        animating = false;
        render();
        setStatus('Balona tıkla veya başka bir renkli grubu paketle.');
        bubble.onclick = () => {
          if(animating || session !== questionNo) return;
          animating = true;
          // İçeride balonun yerini alan tek çarpanı kaldır.
          // Noktaları yeniden türetmeden önce eski noktaları kısa fade-out ile söndür.
          exitingGroups.add(tok.extractGroupId);
          const region = current.den
            ? insideEl.querySelector(tok.part === 'den' ? '.den' : '.num')
            : insideEl;
          if(region){
            const dots = [...region.querySelectorAll('.dot')];
            dots.forEach(dot => dot.classList.add('fade-out'));
          }
          setTimeout(() => {
            if(session === questionNo) render();
          }, 130);
          const start = centerOf(bubble);
          const assignedSlot = nextSlotByPart[tok.part]++;
          const fractionalTarget=current.den && (outsideFractionStarted || tok.part==='den');
          const incoming=token(tok.type,tok.base,'out',tok.part,1);
          incoming.slot=assignedSlot;
          incoming.arrivalOrder=assignedSlot+1;
          incoming.incoming=true;
          if(tok.part==='den') outsideFractionStarted=true;
          if(fractionalTarget) outer.push(incoming);
          render();
          requestAnimationFrame(() => {
            if(session !== questionNo) return;
            let target;
            if(fractionalTarget){
              const node=outsideEl.querySelector('[data-id="'+incoming.id+'"]');
              target=node ? centerOf(node) : centerOf(outsideEl);
            }else{
              target=getOutsideTarget(tok.part,assignedSlot);
            }
            animateBubble(packageHtml, start, target, tint, () => {
          if(session !== questionNo) return;
          pendingGroups.delete(tok.extractGroupId);
          exitingGroups.delete(tok.extractGroupId);
        inner = inner.filter(t => !group.some(g => g.id === t.id));
        if(fractionalTarget){
          incoming.incoming=false;
          incoming.color='';
        }else{
          const outTok=token(tok.type,tok.base,'out',tok.part,1);
          outTok.slot=assignedSlot;
          outTok.color='';
          outTok.arrivalOrder=assignedSlot+1;
          outer.push(outTok);
        }
        animating = false;
        if(anyExtractable() || pendingGroups.size || inner.some(canExpand)){
          phase = 'extract';
          setStatus('Renkli grupları paketle veya bekleyen balonlara tıkla.');
          render();
        } else {
          phase = 'merge';
          setStatus('Bir çarpana bas; bulunduğu yerdeki çarpanlar toparlansın.');
          if(!anyMergeable()) readyToCompact();
          else render();
        }
            }, bubble, tok.part);
          });
        };
        if(typeof onPacked==='function') onPacked();
    };
    if(direct){
      // Zaten kök derecesine eşit kuvvet: tek tıklamada doğrudan balon.
      nodes.forEach(node=>node.style.opacity='0');
      showBubble();
      return;
    }
    const clones=nodes.map((node,i)=>makeFloatClone(node,points[i],tint));
    nodes.forEach(node=>node.style.opacity='0');
    fadeInternalDots(nodes);
    requestAnimationFrame(()=>{
      clones.forEach(clone=>{
        clone.style.opacity='1';
        clone.style.left=middle.x+'px';
        clone.style.top=middle.y+'px';
      });
    });
    setTimeout(()=>{
      if(session!==questionNo)return;
      clones.forEach(c=>c.remove());
      const combined=makeFloatClone(nodes[0],middle,tint);
      combined.innerHTML=packageHtml;
      combined.style.transition='none';
      combined.style.transform='translate(-50%,-50%)';
      setTimeout(()=>{
        if(session!==questionNo)return;
        showBubble();
        combined.remove();
      },340);
    },510);
  }

  function simplifyBucket(side, part){
    if(!bucketHasMergeable(side, part)){
      if(!anyMergeable()) readyToCompact();
      return;
    }

    const source = side === 'in' ? inner : outer;
    const keep = source.filter(t => t.part !== part);
    const bucket = source.filter(t => t.part === part);

    let numberProduct = 1;
    let numberCount = 0;
    const vars = {};

    for(const t of bucket){
      if(t.type === 'num'){
        numberProduct *= t.base;
        numberCount += 1;
      } else {
        vars[t.base] = (vars[t.base] || 0) + t.exp;
      }
    }

    const result = [];
    if(numberCount > 0 && (numberProduct !== 1 || Object.keys(vars).length === 0)){
      result.push(token('num', numberProduct, side, part));
    }
    Object.keys(vars).sort().forEach(v => result.push(token('var', v, side, part, vars[v])));

    if(side === 'in') inner = [...keep, ...result];
    else outer = [...keep, ...result];

    render();

    if(anyMergeable() || fractionCanReduce()) setStatus('Bir çarpana daha bas.');
    else readyToCompact();
  }

  function gcd(a,b){while(b){[a,b]=[b,a%b]}return a||1;}
  function normalizeFraction(){
    if(!current.den || insideFractionCollapsed) return false;
    const nums=inner.filter(t=>t.type==='num' && t.part==='num');
    const dens=inner.filter(t=>t.type==='num' && t.part==='den');
    const n=nums.reduce((p,t)=>p*t.base,1);
    const d=dens.reduce((p,t)=>p*t.base,1);
    const g=gcd(n,d);
    const vars=inner.filter(t=>t.type==='var');
    const result=[];
    if(n/g!==1 || (d/g===1 && vars.length===0)){
      result.push(token('num',n/g,'in','num'));
    }
    result.push(...vars);
    if(d/g!==1) result.push(token('num',d/g,'in','den'));
    const changed=g>1 || dens.length===0 || nums.length>1 || dens.length>1;
    if(!changed) return false;
    inner=result;
    insideFractionCollapsed=d/g===1;
    return true;
  }
  function fractionCanReduce(){
    if(!current.den || insideFractionCollapsed || phase==='extract' || phase==='seed') return false;
    const n=inner.filter(t=>t.type==='num'&&t.part==='num').reduce((v,t)=>v*t.base,1);
    const d=inner.filter(t=>t.type==='num'&&t.part==='den').reduce((v,t)=>v*t.base,1);
    return gcd(n,d)>1 || !inner.some(t=>t.part==='den');
  }
  function reduceInnerFraction(){
    if(!fractionCanReduce() || !normalizeFraction()) return false;
    if(phase==='merge' && !anyMergeable()) phase='format';
    render();
    setStatus('Kesir sadeleşti. Devam etmek için tıkla.');
    return true;
  }
  function rootIsOne(){return inner.length===1 && inner[0].type==='num' && inner[0].base===1;}
  function readyToCompact(){
    phase = 'format';
    render();
    setStatus('Son yazım için ifadeye tıkla.');
  }

  function hasOutsideLiteralProduct(part=null){
    return (part?[part]:['num','den']).some(p=>{
      const a=outer.filter(t=>t.part===p&&!t.incoming);
      return a.length>1;
    });
  }

  // Gerçek çarpma yapılır: 3·2·a -> 6a, x·x·3 -> 3x².
  // Yalnızca seçilen kesir parçası toparlanır.
  function compactOutsideProduct(part=null){
    const parts=part?[part]:['num','den'];
    let changed=false;
    const next=outer.filter(t=>t.incoming||!parts.includes(t.part));
    for(const p of parts){
      const a=outer.filter(t=>t.part===p&&!t.incoming);
      if(a.length<2){next.push(...a);continue;}
      changed=true;
      let number=1;
      const vars=new Map();
      for(const t of a){
        if(t.type==='num') number*=t.base;
        else vars.set(String(t.base),(vars.get(String(t.base))||0)+(t.exp||1));
      }
      const order=Math.max(0,...a.map(t=>t.arrivalOrder||0));
      const pieces=[];
      if(number!==1 || vars.size===0) pieces.push(token('num',number,'out',p));
      for(const [v,exponent] of [...vars].sort(([x],[y])=>x.localeCompare(y))){
        pieces.push(token('var',v,'out',p,exponent));
      }
      const gid='joined-'+nextId;
      pieces.forEach((t,i)=>{
        t.arrivalOrder=order-i*0.001;
        t.joinedProduct=gid;
        next.push(t);
      });
    }
    if(!changed)return false;
    outer=next;
    render();
    setStatus('Çarpanlar toparlandı.');
    return true;
  }

  function hasActualOutsideFactors(){
    return outer.some(t=>!t.incoming && !(t.type==='num' && t.base===1));
  }
  function advanceUnitRoot(){
    if(!rootIsOne() && rootUnitStage===0) return false;
    if(rootUnitStage===0){
      rootUnitStage=1;
      phase='unit';
      render();
      setStatus('Kök 1 oldu. Bir kez daha 1’e tıkla.');
      return true;
    }
    if(rootUnitStage===1){
      rootUnitStage=2;
      if(!hasActualOutsideFactors()){
        outer=outer.filter(t=>t.incoming);
        outer.push(token('num',1,'out','num'));
      }else{
        outer=outer.filter(t=>t.incoming || !(t.type==='num' && t.base===1));
      }
      compactOutsideProduct('num');
      compactOutsideProduct('den');
      compactProduct=true;
      document.querySelector('.expression').classList.add('compact');
      phase='done';
      render();
      setStatus('İşlem tamamlandı.');
      return true;
    }
    return false;
  }

  function compactAndFinish(){
    // Öncelik matematiksel değerindir; yazım biçimi kökün 1 olmasını engellemez.
    if(advanceUnitRoot())return;
    if(normalizeFraction()){
      render();
      setStatus('Kesir sadeleşti. Devam etmek için tıkla.');
      return;
    }
    if(compactOutsideProduct()) return;
    compactOutsideProduct('num');
    compactOutsideProduct('den');
    compactProduct=true;
    document.querySelector('.expression').classList.add('compact');
    phase='done';render();setStatus('İşlem tamamlandı.');
  }

  // Çarpanlara ayrılmış en geniş gösterimin kaplayacağı yer bir kez ölçülür.
  // Bundan sonra kökün konumu animasyon süresince sabit kalır.
  function reserveHorizontalSpace(){
    if(placementLocked) return;
    const expression = document.querySelector('.expression');
    const root = document.querySelector('.radical');
    const r = expression.getBoundingClientRect();
    const insideR = insideEl.getBoundingClientRect();
    const rightOverflow = insideR.right - (r.right - 12);
    if(rightOverflow > 0){
      const currentLeft = root.getBoundingClientRect().left - r.left;
      const shift = Math.min(rightOverflow + 12, Math.max(0,currentLeft - 75));
      const newLeft = currentLeft-shift;
      root.style.left = newLeft+'px';
      outsideEl.style.right = `calc(100% - ${newLeft}px)`;
    }
    placementLocked = true;
  }

  function finish(){
    phase = 'done';
    render();
    setStatus('İşlem tamamlandı.');
  }

  document.querySelector('.expression').addEventListener('click', () => {
    if(phase === 'format' && !animating) compactAndFinish();
  });
  function selectDifficulty(value){
    if(!['easy','medium','advanced'].includes(value) || value===difficulty)return;
    difficulty=value;
    levelQuestionNo=0;
    document.querySelectorAll('.difficulty-btn').forEach(btn=>{
      const active=btn.dataset.difficulty===difficulty;
      btn.classList.toggle('active',active);
      btn.setAttribute('aria-pressed',String(active));
    });
    startQuestion();
  }
  document.querySelectorAll('.difficulty-btn').forEach(btn=>{
    btn.addEventListener('click',()=>selectDifficulty(btn.dataset.difficulty));
  });
  function parseCustomRoot(raw){
    let str=raw.trim().replace(/\s+/g,'').replace(/[×·*]/g,'');
    let d=2;
    if(str.startsWith('∛')){d=3;str=str.slice(1);}
    else if(str.startsWith('√'))str=str.slice(1);
    else throw Error('İfadeye √ veya ∛ ile başla.');
    if(str.startsWith('(')&&str.endsWith(')'))str=str.slice(1,-1);
    const fraction=str.split('/');
    if(fraction.length>2)throw Error('Yalnızca tek kesir çizgisi destekleniyor.');
    function part(rawPart){
      if(!rawPart)throw Error('Pay veya payda boş olamaz.');
      const vars={};let n=1,pos=0;
      while(pos<rawPart.length){
        const remaining=rawPart.slice(pos);
        const integer=remaining.match(/^\d+/);
        if(integer){
          const value=Number(integer[0]);
          if(!Number.isSafeInteger(value)||value<1)throw Error('Pozitif tam sayılar kullan.');
          n*=value;pos+=integer[0].length;
        }else{
          const letter=remaining.match(/^[a-zA-Z]/);
          if(!letter)throw Error('Sayı ve harfli çarpımlar kullan.');
          const name=letter[0];pos++;
          const tail=rawPart.slice(pos);
          const normal=tail.match(/^\^(\d+)/);
          const raised=tail.match(/^[⁰¹²³⁴⁵⁶⁷⁸⁹]+/);
          let exponent=1;
          if(normal){exponent=Number(normal[1]);pos+=normal[0].length;}
          else if(raised){
            const supers={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
            exponent=Number([...raised[0]].map(c=>supers[c]).join(''));pos+=raised[0].length;
          }
          if(!Number.isInteger(exponent)||exponent<1||exponent>12)throw Error('Üs 1 ile 12 arasında olmalı.');
          vars[name]=(vars[name]||0)+exponent;
        }
        if(!Number.isSafeInteger(n)||n>1000000)throw Error('Çarpım en fazla 1.000.000 olabilir.');
      }
      return {n,vars};
    }
    const top=part(fraction[0]);
    const bottom=fraction.length===2?part(fraction[1]):null;
    if(bottom&&Object.keys(bottom.vars).length)throw Error('Paydada harf henüz desteklenmiyor.');
    return {d,n:top.n,vars:top.vars,...(bottom?{den:bottom.n}:{}),stageNo:bottom?4:Object.keys(top.vars).length?3:d===3?2:1};
  }
  document.getElementById('customRootForm').addEventListener('submit',event=>{
    event.preventDefault();
    const error=document.getElementById('customRootError');
    try{const question=parseCustomRoot(document.getElementById('customRootInput').value);error.textContent='';startQuestion(question);}
    catch(err){error.textContent=err.message;}
  });
  // Giriş alanına odaklanınca açılan, imleç konumuna yazan matematik klavyesi.
  (function setupMathKeyboard(){
    const input=document.getElementById('customRootInput');
    const keyboard=document.getElementById('mathKeyboard');
    const keys=document.getElementById('mathKeyboardKeys');
    const symbols=[
      ['√','√'],['∛','∛'],['x²','²'],['x³','³'],['xⁿ','^'],['a','a'],['b','b'],['x','x'],
      ['7','7'],['8','8'],['9','9'],['/','/'],['(','('],[')',')'],['y','y'],['z','z'],
      ['4','4'],['5','5'],['6','6'],['·','·'],['1','1'],['2','2'],['3','3'],['0','0'],
      ['←','left'],['→','right'],['⌫','back'],['Sil','clear']
    ];
    function insert(value){
      const a=input.selectionStart??input.value.length;
      const b=input.selectionEnd??a;
      let cursor=a;
      if(value==='clear'){input.value='';cursor=0;}
      else if(value==='back'){
        if(a!==b){input.setRangeText('',a,b,'start');cursor=a;}
        else if(a>0){input.setRangeText('',a-1,a,'start');cursor=a-1;}
      }else if(value==='left')cursor=Math.max(0,a-1);
      else if(value==='right')cursor=Math.min(input.value.length,b+1);
      else{input.setRangeText(value,a,b,'end');cursor=a+value.length;}
      input.focus({preventScroll:true});
      input.setSelectionRange(cursor,cursor);
      document.getElementById('customRootError').textContent='';
    }
    symbols.forEach(([label,value])=>{
      const btn=document.createElement('button');
      btn.type='button';btn.textContent=label;
      if(['√','∛','²','³','^','/'].includes(value))btn.classList.add('math-special');
      if(['back','clear'].includes(value))btn.classList.add('math-delete');
      btn.addEventListener('pointerdown',event=>event.preventDefault());
      btn.addEventListener('click',()=>insert(value));
      keys.appendChild(btn);
    });
    input.addEventListener('focus',()=>{keyboard.hidden=false;});
    document.getElementById('closeMathKeyboard').addEventListener('click',()=>{
      keyboard.hidden=true;input.blur();
    });
    document.getElementById('customRootForm').addEventListener('submit',()=>{keyboard.hidden=true;});
  })();
  $('newBtn').onclick = () => startQuestion();
  $('degree').onclick = () => {
    $('degree').classList.remove('implicit');
    setTimeout(() => { if(current && current.d === 2 && rootUnitStage === 0) $('degree').classList.add('implicit'); }, 900);
  };

  startQuestion();
})();
