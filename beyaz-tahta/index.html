      const radius=(pointerType==='touch' ? Math.max(22,base) : base)/viewZoom;
      if(Math.hypot(p.x-h.x,p.y-h.y)<=radius) return h.name;
    }

    const isTriangle=
      selected.kind==='polygon' &&
      selected.shapeName==='triangle' &&
      polygonWorldVertices(selected).length===3;

    if(!special.length && isTriangle){
      const verts=polygonWorldVertices(selected);
      for(let i=0;i<verts.length;i++){
        const hitR=(pointerType==='touch' ? 22 : 11)/viewZoom;
        if(Math.hypot(p.x-verts[i].x,p.y-verts[i].y)<=hitR){
          return 'vertex-'+i;
        }
      }
    }

    if(selected.source==='menu' || (!special.length && !isTriangle)){
      const entries=[
        ['nw',oc.nw],['ne',oc.ne],['se',oc.se],['sw',oc.sw]
      ];
      const hitR=(pointerType==='touch' ? 22 : 11)/viewZoom;
      for(const [name,h] of entries){
        if(Math.hypot(p.x-h.x,p.y-h.y)<=hitR) return name;
      }
    }

    if(!(selected.kind==='ellipse' && selected.shapeName==='circle')){
      const hitR=(pointerType==='touch' ? 22 : 11)/viewZoom;
      if(Math.hypot(p.x-oc.rotate.x,p.y-oc.rotate.y)<=hitR) return 'rotate';
    }

    return null;
  }

  function pointInPolygon(pt,verts){
    let inside=false;
    for(let i=0,j=verts.length-1;i<verts.length;j=i++){
      const xi=verts[i].x, yi=verts[i].y;
      const xj=verts[j].x, yj=verts[j].y;
      const intersect=((yi>pt.y)!=(yj>pt.y)) &&
        (pt.x < (xj-xi)*(pt.y-yi)/((yj-yi)||1e-9)+xi);
      if(intersect) inside=!inside;
    }
    return inside;
  }

  function isFillableObject(o){
    return !!o && !o.locked &&
      (o.kind==='rect' || o.kind==='ellipse' || o.kind==='polygon');
  }

  function pointInsideFillableObject(o,p){
    if(!isFillableObject(o)) return false;

    if(o.kind==='rect'){
      const a=-(o.angle||0), cs=Math.cos(a), sn=Math.sin(a);
      const dx=p.x-o.center.x,dy=p.y-o.center.y;
      const x=dx*cs-dy*sn;
      const y=dx*sn+dy*cs;
      return Math.abs(x)<=o.w/2 && Math.abs(y)<=o.h/2;
    }

    if(o.kind==='ellipse'){
      const a=-(o.angle||0), cs=Math.cos(a), sn=Math.sin(a);
      const dx=p.x-o.center.x,dy=p.y-o.center.y;
      const x=dx*cs-dy*sn;
      const y=dx*sn+dy*cs;
      const rx=Math.max(1,o.rx),ry=Math.max(1,o.ry);
      return (x*x)/(rx*rx)+(y*y)/(ry*ry)<=1;
    }

    if(o.kind==='polygon'){
      const verts=polygonWorldVertices(o);
      return verts.length>=3 && pointInPolygon(p,verts);
    }

    return false;
  }

  function hitFillableObject(p){
    for(let i=objects.length-1;i>=0;i--){
      const o=objects[i];
      if(pointInsideFillableObject(o,p)) return i;
    }
    return -1;
  }

  function hitTestObject(p){
    for(let i=objects.length-1;i>=0;i--){
      const b=objectBounds(objects[i]);
      if(b && pointInBounds(p,b,6/viewZoom)) return i;
    }
    return -1;
  }

  function hitTestObjectAny(p){
    for(let i=objects.length-1;i>=0;i--){
      const b=objectBounds(objects[i]);
      if(b && pointInBounds(p,b,6/viewZoom)) return i;
    }
    return -1;
  }

  function reflectPointAcross(p,pivot,axis){
    if(axis==='horizontal'){
      return {x:2*pivot.x-p.x,y:p.y};
    }
    return {x:p.x,y:2*pivot.y-p.y};
  }

  function reflectedAngle(angle,axis){
    const a=Number(angle)||0;
    return axis==='horizontal' ? Math.PI-a : -a;
  }

  function reflectObject(o,pivot,axis){
    if(!o || !pivot) return;

    if(o.kind==='line'){
      o.a=reflectPointAcross(o.a,pivot,axis);
      o.b=reflectPointAcross(o.b,pivot,axis);
      o.boxAngle=reflectedAngle(
        Number.isFinite(o.boxAngle) ? o.boxAngle : 0,
        axis
      );
      return;
    }

    if(o.kind==='stroke'){
      o.points=(o.points||[]).map(p=>reflectPointAcross(p,pivot,axis));
      o.boxAngle=reflectedAngle(
        Number.isFinite(o.boxAngle) ? o.boxAngle : 0,
        axis
      );
      return;
    }

    if(o.kind==='polygon'){
      const verts=polygonWorldVertices(o).map(p=>reflectPointAcross(p,pivot,axis));
      const source=o.source;
      const shapeName=o.shapeName;
      const fillColor=o.fillColor;
      const locked=o.locked;
      const groupId=o.groupId;
      setPolygonWorldVerticesPreserveAngle(o,verts,0,source,shapeName);
      o.fillColor=fillColor;
      o.locked=locked;
      o.groupId=groupId;
      o.boxAngle=0;
      return;
    }

    if(o.center){
      o.center=reflectPointAcross(o.center,pivot,axis);
    }

    if(o.kind==='text'){
      o.angle=reflectedAngle(o.angle||0,axis);
      o.boxAngle=reflectedAngle(
        Number.isFinite(o.boxAngle) ? o.boxAngle : 0,
        axis
      );
      return;
    }

    if(o.kind==='rect' || o.kind==='ellipse'){
      o.angle=reflectedAngle(o.angle||0,axis);
      o.boxAngle=reflectedAngle(
        Number.isFinite(o.boxAngle) ? o.boxAngle : 0,
        axis
      );
      return;
    }

    if(o.kind==='image' || o.kind==='axes' || o.kind==='parabola' || o.kind==='symbol'){
      o.angle=reflectedAngle(o.angle||0,axis);
      o.mirrorY=!o.mirrorY;
      o.boxAngle=reflectedAngle(
        Number.isFinite(o.boxAngle) ? o.boxAngle : 0,
        axis
      );
      return;
    }
  }

  function translateObject(o,dx,dy){
    if(o.kind==='line'){
      o.a.x+=dx;o.a.y+=dy;o.b.x+=dx;o.b.y+=dy;
    }else if(o.kind==='ellipse' || o.kind==='rect' || o.kind==='polygon' || o.kind==='parabola' || o.kind==='axes' || o.kind==='image' || o.kind==='text' || o.kind==='symbol'){
      o.center.x+=dx;o.center.y+=dy;
      if(o.kind==='polygon' && o.baseVertices){
        o.baseVertices=o.baseVertices.map(p=>({x:p.x+dx,y:p.y+dy}));
      }
    }else if(o.kind==='stroke'){
      o.points=o.points.map(p=>({x:p.x+dx,y:p.y+dy}));
    }
  }

  function rotateObject(o,delta){
    if(o.kind==='line'){
      const c={x:(o.a.x+o.b.x)/2,y:(o.a.y+o.b.y)/2};
      o.a=rotatePoint(o.a,c,delta);
      o.b=rotatePoint(o.b,c,delta);
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;

    }else if(o.kind==='ellipse' || o.kind==='rect' || o.kind==='polygon' || o.kind==='parabola' || o.kind==='axes' || o.kind==='image' || o.kind==='text' || o.kind==='symbol'){
      // Circle rotation is intentionally ignored.
      if(o.kind==='ellipse' && o.shapeName==='circle') return;
      o.angle=(o.angle||0)+delta;
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;

    }else if(o.kind==='stroke'){
      const box=orientedSelectionBox(o);
      const c=box ? box.center : {x:bbox(o.points).cx,y:bbox(o.points).cy};
      o.points=o.points.map(p=>rotatePoint(p,c,delta));
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;
    }
  }




  function setPolygonWorldVerticesPreserveAngle(o, worldVerts, angle, source, shapeName){
    if(!worldVerts || !worldVerts.length) return;

    const center={
      x:worldVerts.reduce((s,v)=>s+v.x,0)/worldVerts.length,
      y:worldVerts.reduce((s,v)=>s+v.y,0)/worldVerts.length
    };

    const cs=Math.cos(-angle), sn=Math.sin(-angle);
    const baseVertices=worldVerts.map(v=>{
      const dx=v.x-center.x, dy=v.y-center.y;
      return {
        x:center.x + dx*cs - dy*sn,
        y:center.y + dx*sn + dy*cs
      };
    });

    o.kind='polygon';
    o.center=center;
    o.angle=angle;
    o.baseVertices=baseVertices;
    if(source!==undefined) o.source=source;
    if(shapeName!==undefined) o.shapeName=shapeName;
  }

  function moveMenuHandleFromSnapshot(o,snap,handle,p){
    if(!o || !snap) return false;

    // LINE endpoints work for every line, including ink-recognized AB segments.
    if(snap.kind==='line' && handle.startsWith('endpoint-')){
      const i=Number(handle.split('-')[1]);
      o.a={...snap.a}; o.b={...snap.b};
      if(i===0) o.a={x:p.x,y:p.y};
      if(i===1) o.b={x:p.x,y:p.y};
      return true;
    }

    if(snap.source!=='menu') return false;

    // POLYGON vertices (triangle, hexagon, future menu polygons)
    if(snap.kind==='polygon' && handle.startsWith('vertex-')){
      const i=Number(handle.split('-')[1]);
      const verts=polygonWorldVertices(snap);
      if(!Number.isInteger(i) || i<0 || i>=verts.length) return false;

      verts[i]={x:p.x,y:p.y};

      // Preserve the polygon's existing local coordinate frame.
      setPolygonWorldVerticesPreserveAngle(
        o,
        verts,
        snap.angle||0,
        'menu',
        snap.shapeName
      );
      return true;
    }

    // RECTANGLE: moving one actual corner turns it into a freely editable quadrilateral.
    if(snap.kind==='rect' && handle.startsWith('rectvertex-')){
      const i=Number(handle.split('-')[1]);
      const verts=rectWorldVertices(snap);
      if(!Number.isInteger(i) || i<0 || i>=4) return false;

      verts[i]={x:p.x,y:p.y};

      // Convert to a freely editable quadrilateral, BUT preserve the
      // rectangle's local rotation frame. The bounding box therefore keeps
      // the same orientation after a corner is moved.
      delete o.w; delete o.h;
      setPolygonWorldVerticesPreserveAngle(
        o,
        verts,
        snap.angle||0,
        'menu',
        'quadrilateral'
      );
      return true;
    }

    if(snap.kind==='symbol' && snap.symbolType==='sqrt' && (handle==='sqrt-roof' || handle==='sqrt-leg' || handle==='sqrt-start')){
      const a=snap.angle||0;
      const cs=Math.cos(-a), sn=Math.sin(-a);
      const dx=p.x-snap.center.x, dy=p.y-snap.center.y;
      const lx=dx*cs-dy*sn;
      const ly=(dx*sn+dy*cs) * (snap.mirrorY ? -1 : 1);

      Object.assign(o, JSON.parse(JSON.stringify(snap)));
      if(handle==='sqrt-roof'){
        o.roofLen=Math.max(18,lx);
      }else if(handle==='sqrt-leg'){
        o.legDepth=Math.max(6,ly);
      }else if(handle==='sqrt-start'){
        const height=Math.max(24,Number(snap.height)||72);
        const topY=-height/2;
        o.startOffset=Math.max(topY + 4, Math.min((snap.legDepth||34) - 4, ly));
      }
      o.boxAngle=Number.isFinite(snap.boxAngle) ? snap.boxAngle : (snap.angle||0);
      return true;
    }

    // ELLIPSE cardinal handles. Keep opposite side fixed in local coordinates.
    if(snap.kind==='ellipse' && handle.startsWith('ellipse-')){
      const a=snap.angle||0;
      const cs=Math.cos(-a), sn=Math.sin(-a);
      const dx=p.x-snap.center.x, dy=p.y-snap.center.y;
      const lx=dx*cs-dy*sn;
      const ly=dx*sn+dy*cs;

      let cx=0,cy=0,rx=snap.rx,ry=snap.ry;

      if(handle==='ellipse-e'){
        const opp=-snap.rx;
        cx=(lx+opp)/2;
        rx=Math.max(6,Math.abs(lx-opp)/2);
      }else if(handle==='ellipse-w'){
        const opp=snap.rx;
        cx=(lx+opp)/2;
        rx=Math.max(6,Math.abs(opp-lx)/2);
      }else if(handle==='ellipse-s'){
        const opp=-snap.ry;
        cy=(ly+opp)/2;
        ry=Math.max(6,Math.abs(ly-opp)/2);
      }else if(handle==='ellipse-n'){
        const opp=snap.ry;
        cy=(ly+opp)/2;
        ry=Math.max(6,Math.abs(opp-ly)/2);
      }

      // Local center offset back to world.
      const ccs=Math.cos(a), ss=Math.sin(a);
      o.center={
        x:snap.center.x + cx*ccs - cy*ss,
        y:snap.center.y + cx*ss + cy*ccs
      };
      o.rx=rx; o.ry=ry;
      o.angle=a;
      o.source='menu';
      return true;
    }

    return false;
  }

  function moveTriangleVertexFromSnapshot(o,snap,vertexIndex,p){
    if(!o || !snap || snap.kind!=='polygon' || snap.shapeName!=='triangle') return;

    const verts=polygonWorldVertices(snap);
    if(verts.length!==3 || vertexIndex<0 || vertexIndex>2) return;

    verts[vertexIndex]={x:p.x,y:p.y};

    // Preserve the triangle's current local rotation frame.
    setPolygonWorldVerticesPreserveAngle(
      o,
      verts,
      snap.angle||0,
      snap.source,
      'triangle'
    );
  }


  function resizeObjectLocalFromSnapshot(o,snap,p,handle,uniformScale=false){
    const box=orientedSelectionBox(snap);
    if(!box) return false;

    const lp=worldToLocal(box,p);
    const opposite={
      nw:{x:box.maxX,y:box.maxY},
      ne:{x:box.minX,y:box.maxY},
      se:{x:box.minX,y:box.minY},
      sw:{x:box.maxX,y:box.minY}
    }[handle];
    if(!opposite) return false;

    const newMinX=Math.min(lp.x,opposite.x);
    const newMaxX=Math.max(lp.x,opposite.x);
    const newMinY=Math.min(lp.y,opposite.y);
    const newMaxY=Math.max(lp.y,opposite.y);

    let newW=Math.max(12,newMaxX-newMinX);
    let newH=Math.max(12,newMaxY-newMinY);

    let sx=newW/Math.max(1,box.w);
    let sy=newH/Math.max(1,box.h);

    let usedMinX=newMinX, usedMaxX=newMaxX, usedMinY=newMinY, usedMaxY=newMaxY;

    if(uniformScale){
      const s=Math.max(sx,sy);
      sx=s;
      sy=s;

      const targetW=Math.max(12,box.w*s);
      const targetH=Math.max(12,box.h*s);

      const isLeft = handle==='nw' || handle==='sw';
      const isTop  = handle==='nw' || handle==='ne';

      if(isLeft){
        usedMaxX=opposite.x;
        usedMinX=usedMaxX-targetW;
      }else{
        usedMinX=opposite.x;
        usedMaxX=usedMinX+targetW;
      }

      if(isTop){
        usedMaxY=opposite.y;
        usedMinY=usedMaxY-targetH;
      }else{
        usedMinY=opposite.y;
        usedMaxY=usedMinY+targetH;
      }

      newW=targetW;
      newH=targetH;
    }

    const localCenter={
      x:(usedMinX+usedMaxX)/2,
      y:(usedMinY+usedMaxY)/2
    };
    const newCenter=localToWorld(box,localCenter);

    if(snap.kind==='rect'){
      o.center=newCenter;
      o.w=Math.max(12,snap.w*sx);
      o.h=Math.max(12,snap.h*sy);
      o.angle=snap.angle||0;
      return true;
    }

    if(snap.kind==='ellipse'){
      o.center=newCenter;
      if(snap.shapeName==='circle'){
        const s=Math.max(sx,sy);
        o.rx=Math.max(6,snap.rx*s);
        o.ry=o.rx;
      }else{
        o.rx=Math.max(6,snap.rx*sx);
        o.ry=Math.max(6,snap.ry*sy);
      }
      o.angle=snap.angle||0;
      return true;
    }

    if(snap.kind==='parabola'){
      o.center=newCenter;
      o.w=Math.max(24,snap.w*sx);
      o.h=Math.max(24,snap.h*sy);
      o.angle=snap.angle||0;
      return true;
    }

    if(snap.kind==='image'){
      o.center=newCenter;
      o.w=Math.max(24,snap.w*sx);
      o.h=Math.max(24,snap.h*sy);
      o.angle=snap.angle||0;
      return true;
    }

    if(snap.kind==='text'){
      o.center=newCenter;
      o.w=Math.max(24,snap.w*sx);
      o.h=Math.max(20,snap.h*sy);
      o.fontSize=Math.max(6,(snap.fontSize||24)*sy);
      o.angle=snap.angle||0;
      o.boxAngle=Number.isFinite(snap.boxAngle) ? snap.boxAngle : (snap.angle||0);
      return true;
    }

    if(snap.kind==='symbol'){
      o.center=newCenter;
      o.angle=snap.angle||0;
      if(snap.symbolType==='sqrt'){
        o.radicalW=Math.max(18,(snap.radicalW||90)*sx);
        o.roofLen=Math.max(18,(snap.roofLen||110)*sx);
        o.height=Math.max(18,(snap.height||72)*sy);
        o.legDepth=Math.max(6,(snap.legDepth||34)*sy);
        o.startOffset=(Number.isFinite(snap.startOffset) ? snap.startOffset : 0.10*(snap.height||72))*sy;
      }else if(snap.symbolType==='integral'){
        o.w=Math.max(10,(snap.w||50)*sx);
        o.h=Math.max(22,(snap.h||130)*sy);
      }
      return true;
    }

    if(snap.kind==='axes'){
      o.center=newCenter;
      o.w=Math.max(24,snap.w*sx);
      o.h=Math.max(24,snap.h*sy);
      o.angle=snap.angle||0;
      return true;
    }

    if(snap.kind==='polygon'){
      const oldBox=orientedSelectionBox(snap);
      const verts=polygonWorldVertices(snap);
      const newVerts=verts.map(v=>{
        const lv=worldToLocal(oldBox,v);
        const nx=(lv.x-oldBox.minX)*sx + usedMinX;
        const ny=(lv.y-oldBox.minY)*sy + usedMinY;
        return localToWorld(oldBox,{x:nx,y:ny});
      });

      setPolygonWorldVerticesPreserveAngle(
        o,
        newVerts,
        snap.angle||0,
        snap.source,
        snap.shapeName
      );
      return true;
    }

    if(snap.kind==='line'){
      const oldBox=orientedSelectionBox(snap);
      const la=worldToLocal(oldBox,snap.a);
      const lb=worldToLocal(oldBox,snap.b);
      const mapPt=l=>localToWorld(oldBox,{
        x:(l.x-oldBox.minX)*sx + usedMinX,
        y:(l.y-oldBox.minY)*sy + usedMinY
      });
      o.a=mapPt(la);
      o.b=mapPt(lb);
      return true;
    }

    if(snap.kind==='stroke'){
      const oldBox=orientedSelectionBox(snap);
      o.points=snap.points.map(v=>{
        const lv=worldToLocal(oldBox,v);
        const nx=(lv.x-oldBox.minX)*sx + usedMinX;
        const ny=(lv.y-oldBox.minY)*sy + usedMinY;
        return localToWorld(oldBox,{x:nx,y:ny});
      });
      return true;
    }

    return false;
  }

  function resizeObjectFromSnapshot(o,snap,startB,p,handle){
    const opp={
      nw:{x:startB.x+startB.w,y:startB.y+startB.h},
      ne:{x:startB.x,y:startB.y+startB.h},
      se:{x:startB.x,y:startB.y},
      sw:{x:startB.x+startB.w,y:startB.y}
    }[handle];
    if(!opp) return;

    const newW=Math.max(12,Math.abs(p.x-opp.x));
    const newH=Math.max(12,Math.abs(p.y-opp.y));
    const newCx=(p.x+opp.x)/2;
    const newCy=(p.y+opp.y)/2;
    const sx=newW/Math.max(1,startB.w);
    const sy=newH/Math.max(1,startB.h);

    if(o.kind==='line'){
      const c={x:startB.cx,y:startB.cy};
      o.a={
        x:newCx+(snap.a.x-c.x)*sx,
        y:newCy+(snap.a.y-c.y)*sy
      };
      o.b={
        x:newCx+(snap.b.x-c.x)*sx,
        y:newCy+(snap.b.y-c.y)*sy
      };
    }else if(o.kind==='ellipse'){
      o.center={x:newCx,y:newCy};
      if(o.shapeName==='circle'){
        const s=Math.max(sx,sy);
        o.rx=Math.max(6,snap.rx*s);
        o.ry=o.rx;
      }else{
        o.rx=Math.max(6,snap.rx*sx);
        o.ry=Math.max(6,snap.ry*sy);
      }
    }else if(o.kind==='rect'){
      o.center={x:newCx,y:newCy};
      o.w=Math.max(12,snap.w*sx);
      o.h=Math.max(12,snap.h*sy);
    }else if(o.kind==='polygon'){
      const c={x:startB.cx,y:startB.cy};
      o.center={x:newCx,y:newCy};
      if(snap.baseVertices){
        o.baseVertices=snap.baseVertices.map(v=>({
          x:newCx+(v.x-c.x)*sx,
          y:newCy+(v.y-c.y)*sy
        }));
      }
    }else if(o.kind==='image'){
      o.center={x:newCx,y:newCy};
      o.w=Math.max(24,snap.w*sx);
      o.h=Math.max(24,snap.h*sy);
      o.angle=snap.angle||0;
    }else if(o.kind==='stroke'){
      const c={x:startB.cx,y:startB.cy};
      o.points=snap.points.map(v=>({
        x:newCx+(v.x-c.x)*sx,
        y:newCy+(v.y-c.y)*sy
      }));
    }
  }


  function drawAdaptiveGrid(){
    const rect=canvas.getBoundingClientRect();
    const screenW=Math.max(1,rect.width);
    const screenH=Math.max(1,rect.height);

    // Visible world rectangle.
    const left=(0-viewX)/viewZoom;
    const top=(0-viewY)/viewZoom;
    const right=(screenW-viewX)/viewZoom;
    const bottom=(screenH-viewY)/viewZoom;

    // 24 world units reproduces the old grid at zoom=1.
    // When zooming out, promote every 4th line to the new major grid.
    let majorStep=24;
    while(majorStep*viewZoom<22){
      majorStep*=4;
    }

    // At high zoom, the existing large square stays large and child grids
    // appear inside it. We can reveal more than one nested level.
    const levels=[
      {
        step:majorStep,
        alpha:.78,
        width:1.0,
        color:'rgba(218,223,231,.78)'
      }
    ];

    let childStep=majorStep/4;
    let depth=0;
    while(childStep*viewZoom>=8 && depth<3){
      const alpha=Math.max(.26,.54-depth*.12);
      levels.push({
        step:childStep,
        alpha,
        width:.72,
        color:`rgba(232,235,241,${alpha})`
      });
      childStep/=4;
      depth++;
    }

    // Draw finer levels first; stronger parent lines go on top.
    levels.sort((a,b)=>a.step-b.step);

    ctx.save();

    for(const level of levels){
      const step=level.step;
      if(!Number.isFinite(step) || step<=0) continue;

      const startX=Math.floor(left/step)*step;
      const endX=Math.ceil(right/step)*step;
      const startY=Math.floor(top/step)*step;
      const endY=Math.ceil(bottom/step)*step;

      ctx.beginPath();

      // Guard against pathological line counts at extreme view states.
      let count=0;
      for(let x=startX;x<=endX+step*.5;x+=step){
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        if(++count>1200) break;
      }

      count=0;
      for(let y=startY;y<=endY+step*.5;y+=step){
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        if(++count>1200) break;
      }

      ctx.strokeStyle=level.color;
      ctx.lineWidth=level.width/viewZoom;
      ctx.stroke();
    }

    ctx.restore();
  }

  function redraw(){
    // Clear in device pixels, then render the infinite world through the camera.
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.setTransform(
      dpr*viewZoom,0,
      0,dpr*viewZoom,
      dpr*viewX,dpr*viewY
    );

    drawAdaptiveGrid();

    for(const o of objects){
      if(o.kind==='stroke') drawSmoothStroke(o.points,o.style);
      else if(o.kind==='image') drawImageObject(o);
      else if(o.kind==='text') drawTextObject(o);
      else drawShape(o);
    }
    for(const item of remoteLiveInk.values()){
      if(item && item.points && item.points.length){
        drawSmoothStroke(item.points,item.style);
      }
    }

    if(drawing && points.length){
      if(lockedShape){
        // Otomatik şekil aktifleştiğinde ham ink yerine canlı geometrik öneriyi göster.
        drawShape(lockedShape,true);
      }else{
        drawSmoothStroke(points,strokeStyle());
        if(previewRecognized) drawShape(previewRecognized,true);
      }
    }
    if(mode==='select'){
      drawSelection();
      if(selectAction==='marquee') drawMarquee();
    }

    if(mode==='eraser' && eraserCursor){
      ctx.save();
      ctx.beginPath();
      ctx.arc(eraserCursor.x,eraserCursor.y,eraserRadius/viewZoom,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,.72)';
      ctx.strokeStyle='#667085';
      ctx.lineWidth=1.25/viewZoom;
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function bbox(pts){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of pts){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}
    return {x:minX,y:minY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
  }

  function simplifyRDP(pts, eps){
    if(pts.length<3) return pts.slice();
    const a=pts[0], b=pts[pts.length-1];
    let maxD=0, idx=0;
    const vx=b.x-a.x, vy=b.y-a.y, len2=vx*vx+vy*vy || 1;
    for(let i=1;i<pts.length-1;i++){
      const p=pts[i];
      let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/len2; t=Math.max(0,Math.min(1,t));
      const px=a.x+t*vx, py=a.y+t*vy;
      const d=Math.hypot(p.x-px,p.y-py);
      if(d>maxD){maxD=d;idx=i}
    }
    if(maxD>eps){
      const l=simplifyRDP(pts.slice(0,idx+1),eps);
      const r=simplifyRDP(pts.slice(idx),eps);
      return l.slice(0,-1).concat(r);
    }
    return [a,b];
  }

  function lineCandidate(pts, style){
    const a=pts[0], b=pts[pts.length-1];
    const chord=dist(a,b);
    if(chord<35) return null;
    let max=0,sum=0;
    const vx=b.x-a.x,vy=b.y-a.y,len2=vx*vx+vy*vy||1;
    for(const p of pts){
      let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/len2;t=Math.max(0,Math.min(1,t));
      const q={x:a.x+t*vx,y:a.y+t*vy};
      const d=dist(p,q);max=Math.max(max,d);sum+=d;
    }
    const avg=sum/pts.length;
    if(max<Math.max(10,chord*.05) && avg<Math.max(5,chord*.025))
      return {kind:'line',a,b,style};
    return null;
  }

  function principalFrame(pts){
    let cx=0,cy=0;
    for(const p of pts){cx+=p.x;cy+=p.y}
    cx/=pts.length;cy/=pts.length;
    let xx=0,yy=0,xy=0;
    for(const p of pts){
      const dx=p.x-cx,dy=p.y-cy;
      xx+=dx*dx;yy+=dy*dy;xy+=dx*dy;
    }
    const angle=.5*Math.atan2(2*xy,xx-yy);
    const cs=Math.cos(-angle),sn=Math.sin(-angle);
    const local=pts.map(p=>{
      const dx=p.x-cx,dy=p.y-cy;
      return {x:dx*cs-dy*sn,y:dx*sn+dy*cs};
    });
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of local){
      minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
      maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);
    }
    // Center of oriented bounds, transformed back to world.
    const lcx=(minX+maxX)/2,lcy=(minY+maxY)/2;
    const ccs=Math.cos(angle),ss=Math.sin(angle);
    const center={x:cx+lcx*ccs-lcy*ss,y:cy+lcx*ss+lcy*ccs};
    return {center,angle,w:maxX-minX,h:maxY-minY,local,minX,minY,maxX,maxY};
  }

  function trimOvershootForClosedIntent(pts){
    if(pts.length<10) return pts.slice();
    const b=bbox(pts), scale=Math.max(30,Math.min(b.w,b.h));
    // Find the first late point that returns close to start. Anything after it is likely closure overshoot.
    const start=pts[0];
    let best=-1;
    for(let i=Math.floor(pts.length*.55);i<pts.length;i++){
      if(dist(start,pts[i]) < scale*.28){best=i;break}
    }
    if(best>0) return pts.slice(0,best+1);
    return pts.slice();
  }

  function cleanSimplifiedCorners(simp, pts){
    const b=bbox(pts);
    const scale=Math.max(20,Math.min(b.w,b.h));
    const closeTol=Math.max(20,scale*.30);
    let out=simp.slice();

    if(out.length>3 && dist(out[0],out[out.length-1])<closeTol) out.pop();

    const minSeg=Math.max(7,scale*.045);
    const cleaned=[];
    for(const p of out){
      if(!cleaned.length || dist(cleaned[cleaned.length-1],p)>minSeg) cleaned.push(p);
    }
    if(cleaned.length>3 && dist(cleaned[0],cleaned[cleaned.length-1])<minSeg*1.7) cleaned.pop();

    // Remove obvious fake closure corners.
    let changed=true;
    while(changed && cleaned.length>3){
      changed=false;
      const n=cleaned.length;
      let perimeter=0;
      for(let i=0;i<n;i++) perimeter+=dist(cleaned[i],cleaned[(i+1)%n]);

      let remove=-1, weakness=0;
      for(let i=0;i<n;i++){
        const prev=cleaned[(i-1+n)%n], cur=cleaned[i], next=cleaned[(i+1)%n];
        const l1=dist(prev,cur), l2=dist(cur,next);
        const avg=perimeter/n;
        const v1={x:prev.x-cur.x,y:prev.y-cur.y};
        const v2={x:next.x-cur.x,y:next.y-cur.y};
        const den=Math.max(1e-9,Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y));
        const angle=Math.acos(Math.max(-1,Math.min(1,(v1.x*v2.x+v1.y*v2.y)/den)));
        const straightness=Math.abs(Math.PI-angle);

        let w=0;
        const shortRatio=Math.min(l1,l2)/Math.max(1,avg);
        if(shortRatio<.30) w+=(.30-shortRatio)*2.5;
        if(straightness<.18) w+=(.18-straightness)*3.5;

        if(w>weakness){weakness=w;remove=i}
      }

      if(remove>=0 && weakness>.14){
        cleaned.splice(remove,1);
        changed=true;
      }
    }
    return cleaned;
  }

  function cornersAtTolerance(pts,factor){
    const b=bbox(pts);
    const eps=Math.max(4.5,Math.min(b.w,b.h)*factor);
    return cleanSimplifiedCorners(simplifyRDP(pts,eps),pts);
  }

  function pointToSegmentDistance(p,a,b){
    const vx=b.x-a.x,vy=b.y-a.y;
    const len2=vx*vx+vy*vy || 1;
    let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/len2;
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(p.x-(a.x+t*vx),p.y-(a.y+t*vy));
  }

  function polygonStrokeError(pts,verts){
    if(!verts || verts.length<3) return Infinity;
    let sum=0;
    for(const p of pts){
      let best=Infinity;
      for(let i=0;i<verts.length;i++){
        best=Math.min(best,pointToSegmentDistance(p,verts[i],verts[(i+1)%verts.length]));
      }
      sum+=best;
    }
    const b=bbox(pts);
    return (sum/Math.max(1,pts.length))/Math.max(1,Math.hypot(b.w,b.h));
  }

  function resamplePolyline(pts, count=72){
    if(!pts || pts.length<2) return pts ? pts.slice() : [];
    const d=[0];
    for(let i=1;i<pts.length;i++) d.push(d[i-1]+dist(pts[i-1],pts[i]));
    const total=d[d.length-1];
    if(total<1) return pts.slice();

    const out=[];
    let j=1;
    for(let k=0;k<count;k++){
      const target=total*k/(count-1);
      while(j<d.length-1 && d[j]<target) j++;
      const d0=d[j-1],d1=d[j];
      const t=(target-d0)/Math.max(1e-9,d1-d0);
      out.push({
        x:pts[j-1].x+(pts[j].x-pts[j-1].x)*t,
        y:pts[j-1].y+(pts[j].y-pts[j-1].y)*t
      });
    }
    return out;
  }

  function angleDiff(a,b){
    let d=a-b;
    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;
    return d;
  }

  function turningCorners(pts){
    /*
      Robust polygon-corner detector:
      resample stroke uniformly, then look for strong changes in tangent
      direction. This is much more stable for pentagons/hexagons than simply
      asking RDP how many points remain.
    */
    const trimmed=trimOvershootForClosedIntent(pts);
    const rs=resamplePolyline(trimmed,84);
    if(rs.length<20) return [];

    const b=bbox(trimmed);
    const scale=Math.max(1,Math.hypot(b.w,b.h));
    const step=4;
    const candidates=[];

    for(let i=step;i<rs.length-step;i++){
      const a=rs[i-step], p=rs[i], c=rs[i+step];
      const a1=Math.atan2(p.y-a.y,p.x-a.x);
      const a2=Math.atan2(c.y-p.y,c.x-p.x);
      const turn=Math.abs(angleDiff(a2,a1));

      // Ignore very weak bends; hand-drawn polygon corners are usually clear.
      if(turn>0.30){
        candidates.push({i,p,turn});
      }
    }

    // Non-maximum suppression: retain one strongest sample per actual corner.
    candidates.sort((u,v)=>v.turn-u.turn);
    const chosen=[];
    const minIndexGap=8;
    for(const c of candidates){
      if(chosen.every(q=>Math.abs(c.i-q.i)>minIndexGap)){
        chosen.push(c);
        if(chosen.length>=8) break;
      }
    }

    chosen.sort((u,v)=>u.i-v.i);

    // Merge first/last if they are the same closure corner.
    if(chosen.length>3){
      const first=chosen[0], last=chosen[chosen.length-1];
      if(dist(first.p,last.p)<scale*.10){
        if(first.turn>=last.turn) chosen.pop();
        else chosen.shift();
      }
    }
    return chosen.map(c=>({x:c.p.x,y:c.p.y,turn:c.turn}));
  }

  function robustPolygonIntent(pts){
    const corners=turningCorners(pts);
    if(corners.length<3) return null;

    /*
      Prefer 3..6 corners. If noise yields 7/8, remove weakest turns until six.
      This is intentionally biased toward a usable polygon rather than failure.
    */
    let work=corners.slice();
    while(work.length>6){
      let weakest=0;
      for(let i=1;i<work.length;i++){
        if((work[i].turn||0)<(work[weakest].turn||0)) weakest=i;
      }
      work.splice(weakest,1);
    }

    if(work.length<3 || work.length>6) return null;

    const verts=work.map(p=>({x:p.x,y:p.y}));
    const err=polygonStrokeError(trimOvershootForClosedIntent(pts),verts);
    return {n:verts.length,corners:verts,error:err};
  }

  function candidateModels(pts){
    const factors=[.032,.040,.048,.056,.066,.078,.092,.11];
    const bestByN=new Map();

    for(const f of factors){
      const corners=cornersAtTolerance(pts,f);
      if(corners.length<3 || corners.length>6) continue;
      const error=polygonStrokeError(pts,corners);
      const old=bestByN.get(corners.length);
      if(!old || error<old.error){
        bestByN.set(corners.length,{n:corners.length,corners,error});
      }
    }
    return [...bestByN.values()];
  }

  function cornerCountCandidate(pts){
    const models=candidateModels(pts);
    if(!models.length) return cornersAtTolerance(pts,.056);

    const tri=models.find(m=>m.n===3);
    const quad=models.find(m=>m.n===4);

    // A 4th corner is accepted only if it improves the fit clearly.
    if(tri && quad && tri.error <= quad.error*1.32 + .003){
      return tri.corners;
    }

    let best=null;
    for(const m of models){
      const score=m.error+(m.n-3)*.004;
      if(!best || score<best.score) best={...m,score};
    }
    return best.corners;
  }
  function polygonCentroid(verts){
    let x=0,y=0;
    for(const p of verts){x+=p.x;y+=p.y}
    return {x:x/verts.length,y:y/verts.length};
  }

  function polygonIdeal(kindN, pts, style){
    const frame=principalFrame(pts);

    if(kindN===3){
      // Use the best detected three corner positions themselves.
      // Thus the ideal triangle keeps the user's side ratios and angles.
      const models=candidateModels(pts);
      const tri=models.find(m=>m.n===3);
      let verts=tri ? tri.corners.map(p=>({x:p.x,y:p.y})) : cornerCountCandidate(pts).slice(0,3);

      if(verts.length!==3 || !verts.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))){
        const b=bbox(pts);
        verts=[
          {x:b.cx,y:b.y},
          {x:b.x+b.w,y:b.y+b.h},
          {x:b.x,y:b.y+b.h}
        ];
      }

      const center=polygonCentroid(verts);
      return {
        kind:'polygon',
        center,
        angle:0,
        baseVertices:verts,
        style,
        shapeName:'triangle'
      };
    }

    if(kindN===4){
      return {
        kind:'rect',
        center:frame.center,
        w:frame.w,
        h:frame.h,
        angle:frame.angle,
        style,
        shapeName:Math.abs(frame.w-frame.h)/Math.max(frame.w,frame.h)<.16?'square':'rectangle'
      };
    }

    if(kindN===5 || kindN===6){
      /*
        Recognition source:
        - kindN===5 or 6 comes from the polygon recognizer (v7 logic)

        Output rule requested by user:
        - 5 corners => regular pentagon
        - 6 corners => regular hexagon

        We preserve:
        - approximate center
        - approximate size
        - rough orientation

        But the final polygon itself is mathematically regular.
      */
      const turnModel=typeof robustPolygonIntent==='function' ? robustPolygonIntent(pts) : null;
      const rawVerts=(turnModel && turnModel.n===kindN)
        ? turnModel.corners.map(p=>({x:p.x,y:p.y}))
        : cornerCountCandidate(pts).slice(0,kindN).map(p=>({x:p.x,y:p.y}));

      if(rawVerts.length!==kindN || !rawVerts.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))){
        return null;
      }

      const center=polygonCentroid(rawVerts);

      let radius=0;
      for(const p of rawVerts){
        radius += Math.hypot(p.x-center.x,p.y-center.y);
      }
      radius /= kindN;
      if(!Number.isFinite(radius) || radius < 5) return null;

      // Preserve the user's rough orientation via the first detected corner.
      const rot=Math.atan2(rawVerts[0].y-center.y, rawVerts[0].x-center.x);
      const verts=regularPolygon(center.x,center.y,radius,radius,kindN,rot);

      return {
        kind:'polygon',
        center,
        angle:0,
        baseVertices:verts,
        style,
        shapeName:kindN===5 ? 'regular pentagon' : 'regular hexagon'
      };
    }
    return null;
  }
  function ellipseCandidateLoose(pts,style){
    const trimmed=trimOvershootForClosedIntent(pts);
    const frame=principalFrame(trimmed);
    if(Math.min(frame.w,frame.h)<28) return null;

    const cs=Math.cos(-frame.angle),sn=Math.sin(-frame.angle);
    const rx=frame.w/2, ry=frame.h/2;
    let err=0, useful=0;
    for(const p of trimmed){
      const dx=p.x-frame.center.x,dy=p.y-frame.center.y;
      const x=dx*cs-dy*sn, y=dx*sn+dy*cs;
      const rr=Math.sqrt((x/(rx||1))**2+(y/(ry||1))**2);
      if(Number.isFinite(rr)){err+=Math.abs(rr-1);useful++}
    }
    err/=Math.max(1,useful);

    const b=bbox(trimmed);
    const closeGap=dist(trimmed[0],trimmed[trimmed.length-1]);
    const perimeterScale=Math.max(b.w,b.h);
    // Permit incomplete circles/ellipses, but not a clearly open arc.
    const closurePlausible = closeGap < perimeterScale*.52;
    if(err<.20 && closurePlausible){
      return {
        kind:'ellipse',center:frame.center,rx,ry,angle:frame.angle,style,
        shapeName: Math.abs(rx-ry)/Math.max(rx,ry)<.14?'circle':'ellipse'
      };
    }
    return null;
  }

  function polygonCandidateLoose(pts,style){
    const trimmed=trimOvershootForClosedIntent(pts);
    const b=bbox(trimmed);
    if(Math.min(b.w,b.h)<28) return null;

    const closeGap=dist(trimmed[0],trimmed[trimmed.length-1]);

    // Slightly more permissive than v3: the user need not close the polygon exactly.
    if(closeGap > Math.max(b.w,b.h)*.68) return null;

    const turnModel=robustPolygonIntent(trimmed);
    if(turnModel && (turnModel.n===5 || turnModel.n===6)){
      return polygonIdeal(turnModel.n,trimmed,style);
    }

    const corners=cornerCountCandidate(trimmed);
    if(corners.length>=3 && corners.length<=6){
      return polygonIdeal(corners.length,trimmed,style);
    }
    return null;
  }


  function rectangleEdgeFitError(pts){
    /*
      Rotate the stroke into its principal frame and ask:
      how close is each point to one of the four sides of its oriented bbox?

      Rectangle/square -> very low error.
      Ellipse/circle    -> noticeably higher error because most curved points
                           sit away from the four bbox edges.
    */
    const trimmed=trimOvershootForClosedIntent(pts);
    const frame=principalFrame(trimmed);
    if(!frame || frame.w<10 || frame.h<10) return Infinity;

    const cx=frame.center.x, cy=frame.center.y;
    const cs=Math.cos(-frame.angle), sn=Math.sin(-frame.angle);

    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    const local=[];
    for(const p of trimmed){
      const dx=p.x-cx,dy=p.y-cy;
      const x=dx*cs-dy*sn;
      const y=dx*sn+dy*cs;
      local.push({x,y});
      minX=Math.min(minX,x); maxX=Math.max(maxX,x);
      minY=Math.min(minY,y); maxY=Math.max(maxY,y);
    }

    const diag=Math.max(1,Math.hypot(maxX-minX,maxY-minY));
    let sum=0;
    for(const p of local){
      const d=Math.min(
        Math.abs(p.x-minX),
        Math.abs(p.x-maxX),
        Math.abs(p.y-minY),
        Math.abs(p.y-maxY)
      );
      sum+=d;
    }
    return (sum/Math.max(1,local.length))/diag;
  }

  function ellipseFitErrorValue(pts){
    const trimmed=trimOvershootForClosedIntent(pts);
    const frame=principalFrame(trimmed);
    if(!frame || Math.min(frame.w,frame.h)<10) return Infinity;

    const cs=Math.cos(-frame.angle),sn=Math.sin(-frame.angle);
    const rx=frame.w/2, ry=frame.h/2;
    if(rx<1 || ry<1) return Infinity;

    let err=0,useful=0;
    for(const p of trimmed){
      const dx=p.x-frame.center.x,dy=p.y-frame.center.y;
      const x=dx*cs-dy*sn;
      const y=dx*sn+dy*cs;
      const rr=Math.sqrt((x/rx)**2+(y/ry)**2);
      if(Number.isFinite(rr)){
        err+=Math.abs(rr-1);
        useful++;
      }
    }
    return err/Math.max(1,useful);
  }

  function rectangleHasStrongEvidence(pts){
    const rectErr=rectangleEdgeFitError(pts);
    const ellErr=ellipseFitErrorValue(pts);

    /*
      Typical intention:
      - true rectangle: rectErr is very small and clearly beats ellipse fit
      - true ellipse: ellipse fit wins strongly

      The absolute guard prevents a random closed scribble from becoming a box.
    */
    return rectErr < 0.055 && rectErr < ellErr*0.72;
  }


  function clamp01(v){
    return Math.max(0, Math.min(1, v));
  }

  function closureScore(pts){
    const trimmed=trimOvershootForClosedIntent(pts);
    if(!trimmed || trimmed.length<2) return 0;
    const b=bbox(trimmed);
    const maxDim=Math.max(1, Math.max(b.w,b.h));
    const gap=dist(trimmed[0], trimmed[trimmed.length-1]);
    // 1 = very closed, 0 = too open
    return clamp01(1 - gap/(maxDim*0.72));
  }

  function buildEllipseIdeal(pts, style){
    const trimmed=trimOvershootForClosedIntent(pts);
    const frame=principalFrame(trimmed);
    if(!frame || Math.min(frame.w,frame.h)<28) return null;
    const rx=frame.w/2, ry=frame.h/2;
    if(!Number.isFinite(rx) || !Number.isFinite(ry) || rx<1 || ry<1) return null;
    return {
      kind:'ellipse',
      center:frame.center,
      rx, ry,
      angle:frame.angle,
      style,
      shapeName: Math.abs(rx-ry)/Math.max(rx,ry)<.16 ? 'circle' : 'ellipse'
    };
  }

  function lineScore(pts){
    const a=pts[0], b=pts[pts.length-1];
    const chord=dist(a,b);
    if(chord<35) return 0;
    let max=0,sum=0,pathLen=0;
    const vx=b.x-a.x,vy=b.y-a.y,len2=vx*vx+vy*vy||1;
    for(let i=1;i<pts.length;i++) pathLen += dist(pts[i-1],pts[i]);
    for(const p of pts){
      let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/len2;
      t=Math.max(0,Math.min(1,t));
      const q={x:a.x+t*vx,y:a.y+t*vy};
      const d=dist(p,q); max=Math.max(max,d); sum+=d;
    }
    const avg=sum/pts.length;
    const straightness=clamp01(chord/Math.max(chord,pathLen)); // 1 if pathLen≈chord
    const avgScore=clamp01(1 - avg/Math.max(5,chord*.03));
    const maxScore=clamp01(1 - max/Math.max(10,chord*.06));
    return 0.45*straightness + 0.30*avgScore + 0.25*maxScore;
  }

  function ellipseScore(pts){
    const err=ellipseFitErrorValue(pts);
    const close=closureScore(pts);
    const rectErr=rectangleEdgeFitError(pts);

    const fitScore=clamp01(1 - err/0.24);
    // Ellipses should not lie strongly on four straight edges.
    const edgePenalty=clamp01(1 - clamp01((0.07-rectErr)/0.05)); // near 0 if very rectangle-like
    return 0.60*fitScore + 0.22*close + 0.18*edgePenalty;
  }

  function rectangleScore(pts){
    const rectErr=rectangleEdgeFitError(pts);
    const ellErr=ellipseFitErrorValue(pts);
    const close=closureScore(pts);
    const corners=cornerCountCandidate(trimOvershootForClosedIntent(pts)).length;

    const fitScore=clamp01(1 - rectErr/0.075);
    const cornerScore=(corners===4) ? 1 : (corners===3 || corners===5 ? 0.40 : 0.10);
    const beatsEllipse=clamp01((ellErr - rectErr + 0.02)/0.10);
    return 0.46*fitScore + 0.22*close + 0.18*cornerScore + 0.14*beatsEllipse;
  }

  function triangleScore(pts){
    const trimmed=trimOvershootForClosedIntent(pts);
    const close=closureScore(trimmed);
    const models=candidateModels(trimmed);
    const tri=models.find(m=>m.n===3);
    if(!tri) return 0;
    const quad=models.find(m=>m.n===4);

    const fitScore=clamp01(1 - tri.error/0.06);
    const rivalry = quad ? clamp01((quad.error - tri.error + 0.01)/0.04) : 1;
    return 0.58*fitScore + 0.20*close + 0.22*rivalry;
  }

  function regularPolygonScore(pts, n){
    const trimmed=trimOvershootForClosedIntent(pts);
    const close=closureScore(trimmed);
    const turn=robustPolygonIntent(trimmed);
    if(!turn || turn.n!==n) return 0;

    const fitScore=clamp01(1 - turn.error/0.085);
    const exactNBoost=1; // because turn.n===n exactly
    return 0.64*fitScore + 0.24*close + 0.12*exactNBoost;
  }

  function buildRectIdeal(pts, style){
    return polygonIdeal(4, trimOvershootForClosedIntent(pts), style);
  }

  function buildTriangleIdeal(pts, style){
    return polygonIdeal(3, trimOvershootForClosedIntent(pts), style);
  }

  function buildRegularPolygonIdeal(pts, n, style){
    return polygonIdeal(n, trimOvershootForClosedIntent(pts), style);
  }


  function solve3x3(A,b){
    // Gaussian elimination for a small 3x3 system.
    const m=[
      [A[0][0],A[0][1],A[0][2],b[0]],
      [A[1][0],A[1][1],A[1][2],b[1]],
      [A[2][0],A[2][1],A[2][2],b[2]]
    ];

    for(let col=0;col<3;col++){
      let pivot=col;
      for(let r=col+1;r<3;r++){
        if(Math.abs(m[r][col])>Math.abs(m[pivot][col])) pivot=r;
      }
      if(Math.abs(m[pivot][col])<1e-9) return null;
      if(pivot!==col){ const tmp=m[col];m[col]=m[pivot];m[pivot]=tmp; }

      const d=m[col][col];
      for(let c=col;c<4;c++) m[col][c]/=d;

      for(let r=0;r<3;r++){
        if(r===col) continue;
        const f=m[r][col];
        for(let c=col;c<4;c++) m[r][c]-=f*m[col][c];
      }
    }
    return [m[0][3],m[1][3],m[2][3]];
  }

  function fitCircleLeastSquares(pts){
    /*
      Fit:
        x² + y² + D x + E y + F = 0
      by least squares.

      Unlike the PCA/bounding-box ellipse test, this directly asks:
      "What circle best fits the user's stroke?"
    */
    const trimmed=trimOvershootForClosedIntent(pts);
    if(!trimmed || trimmed.length<8) return null;

    let sx=0,sy=0;
    for(const p of trimmed){sx+=p.x;sy+=p.y}
    const ox=sx/trimmed.length, oy=sy/trimmed.length;

    let sxx=0,syy=0,sxy=0,sx1=0,sy1=0;
    let bx=0,by=0,b1=0;

    for(const p0 of trimmed){
      const x=p0.x-ox, y=p0.y-oy;
      const z=-(x*x+y*y);
      sxx+=x*x; syy+=y*y; sxy+=x*y;
      sx1+=x; sy1+=y;
      bx+=x*z; by+=y*z; b1+=z;
    }

    const sol=solve3x3(
      [[sxx,sxy,sx1],[sxy,syy,sy1],[sx1,sy1,trimmed.length]],
      [bx,by,b1]
    );
    if(!sol) return null;

    const [D,E,F]=sol;
    const cxLocal=-D/2, cyLocal=-E/2;
    const r2=cxLocal*cxLocal+cyLocal*cyLocal-F;
    if(!Number.isFinite(r2) || r2<=0) return null;

    const radius=Math.sqrt(r2);
    const center={x:cxLocal+ox,y:cyLocal+oy};

    let sumAbs=0,sumSq=0,maxErr=0;
    for(const p of trimmed){
      const rr=Math.hypot(p.x-center.x,p.y-center.y);
      const e=Math.abs(rr-radius);
      sumAbs+=e;
      sumSq+=e*e;
      maxErr=Math.max(maxErr,e);
    }

    const meanAbs=(sumAbs/trimmed.length)/Math.max(1,radius);
    const rms=Math.sqrt(sumSq/trimmed.length)/Math.max(1,radius);
    const maxRel=maxErr/Math.max(1,radius);

    return {center,radius,meanAbs,rms,maxRel,points:trimmed};
  }

  function straightRunEvidence(pts){
    /*
      Measures how much of the stroke behaves like long straight runs.
      Rectangles/squares have a lot; circles have very little.
    */
    const rs=resamplePolyline(trimOvershootForClosedIntent(pts),84);
    if(rs.length<16) return 0;

    const step=3;
    let straight=0,total=0;
    for(let i=step;i<rs.length-step;i++){
      const a=rs[i-step],p=rs[i],c=rs[i+step];
      const a1=Math.atan2(p.y-a.y,p.x-a.x);
      const a2=Math.atan2(c.y-p.y,c.x-p.x);
      const turn=Math.abs(angleDiff(a2,a1));
      total++;
      if(turn<0.10) straight++;
    }
    return straight/Math.max(1,total);
  }

  function circleCandidateRobust(pts,style){
    const fit=fitCircleLeastSquares(pts);
    if(!fit) return null;

    const b=bbox(fit.points);
    const aspect=Math.min(b.w,b.h)/Math.max(1,Math.max(b.w,b.h));
    const close=closureScore(fit.points);
    const straight=straightRunEvidence(fit.points);

    /*
      Intentionally generous for hand drawing:
      - aspect >= .72 permits noticeably imperfect circles
      - normalized mean radial error <= .16
      - enough closure
      - reject shapes dominated by straight sides
    */
    const plausible =
      aspect >= .72 &&
      fit.meanAbs <= .16 &&
      fit.rms <= .20 &&
      close >= .34 &&
      straight <= .62;

    if(!plausible) return null;

    return {
      shape:{
        kind:'ellipse',
        center:fit.center,
        rx:fit.radius,
        ry:fit.radius,
        angle:0,
        style,
        shapeName:'circle'
      },
      score:
        0.46*clamp01(1-fit.meanAbs/.16) +
        0.18*clamp01(1-fit.rms/.20) +
        0.16*aspect +
        0.12*close +
        0.08*clamp01(1-straight/.62)
    };
  }


  function openStrokeLineIntent(pts){
    /*
      A single open A→B stroke should become AB even if it is curved.
      We only send the stroke to polygon/ellipse recognition when there is
      convincing closure or several strong directional turns.
    */
    if(!pts || pts.length<4) return false;

    const b=bbox(pts);
    const maxDim=Math.max(1,Math.max(b.w,b.h));
    const gap=dist(pts[0],pts[pts.length-1]);

    let pathLen=0;
    for(let i=1;i<pts.length;i++) pathLen+=dist(pts[i-1],pts[i]);
    const chord=Math.max(1,gap);

    // Strong corner count from a uniformly resampled stroke.
    const rs=resamplePolyline(pts,64);
    let strongTurns=0;
    const step=3;
    for(let i=step;i<rs.length-step;i++){
      const a=rs[i-step], p=rs[i], c=rs[i+step];
      const a1=Math.atan2(p.y-a.y,p.x-a.x);
      const a2=Math.atan2(c.y-p.y,c.x-p.x);
      const turn=Math.abs(angleDiff(a2,a1));
      if(turn>0.48) strongTurns++;
    }

    // If endpoints are clearly separate, the stroke is not trying to close.
    const clearlyOpen = gap > maxDim*.42;

    // A simple curved line may be longer than its chord, but should not contain
    // repeated sharp corners or loop around on itself.
    const pathRatio=pathLen/chord;
    const simpleOpenCurve = pathRatio < 1.85 && strongTurns <= 5;

    return clearlyOpen && simpleOpenCurve;
  }

  function forceABLine(pts,style){
    if(!pts || pts.length<2) return null;
    return {
      kind:'line',
      a:{x:pts[0].x,y:pts[0].y},
      b:{x:pts[pts.length-1].x,y:pts[pts.length-1].y},
      style,
      shapeName:'line'
    };
  }

  function recognize(pts){
    try{
      if(pts.length<6) return null;
      const style=strokeStyle();

      // NEW: an open A→B stroke remains a line even if the hand path is curved.
      if(openStrokeLineIntent(pts)){
        return forceABLine(pts,style);
      }

      const trimmed=trimOvershootForClosedIntent(pts);

      // 1) Straight line keeps the familiar v6 behavior.
      const lineCand=lineCandidate(trimmed,style);
      const sLine=lineScore(trimmed);
      if(lineCand && sLine>0.78) return lineCand;

      /*
        2) Circle is now an independent geometric model.
        It no longer depends on the generic ellipse score.
      */
      const circle=circleCandidateRobust(trimmed,style);

      // Compute rectangle evidence before accepting circle.
      const rectCand=buildRectIdeal(trimmed,style);
      const sRect=rectangleScore(trimmed);

      if(circle){
        /*
          A rectangle may only steal the result when it has clearly stronger
          four-straight-edge evidence. This prevents "almost round" hand circles
          from being rejected by tiny corner noise.
        */
        if(rectCand && rectangleHasStrongEvidence(trimmed) && sRect > circle.score + 0.10){
          return rectCand;
        }
        return circle.shape;
      }

      // 3) Generic ellipse for non-circular ellipses.
      const ellCand=buildEllipseIdeal(trimmed,style);
      const sEll=ellipseScore(trimmed);

      // 4) Triangle / rectangle.
      const triCand=buildTriangleIdeal(trimmed,style);
      const sTri=triangleScore(trimmed);

      // Strong rectangle evidence wins over ellipse.
      if(rectCand && rectangleHasStrongEvidence(trimmed) && sRect>=0.56){
        return rectCand;
      }

      if(ellCand && sEll>=0.54){
        return ellCand;
      }

      // 5) v7 turning-angle engine for 5/6-gons.
      const turnModel=robustPolygonIntent(trimmed);
      if(turnModel && (turnModel.n===5 || turnModel.n===6)){
        const pg=buildRegularPolygonIdeal(trimmed,turnModel.n,style);
        if(pg) return pg;
      }

      if(triCand && sTri>=0.54) return triCand;
      if(rectCand && sRect>=0.54) return rectCand;

      return null;

    }catch(err){
      console.warn('Tanıma adayı atlandı:',err);
      statusEl.textContent='Şekil tanıma başarısız oldu — çizim ink olarak kalacak';
      return null;
    }
  }
  function armHold(){
    clearTimeout(holdTimer);
    holdTimer=setTimeout(()=>{
      if(!drawing || points.length<4 || lockedShape) return;
      const idle=performance.now()-lastMoveTime;
      if(idle<480) return;

      const recognized=recognize(points);
      if(recognized){
        lockedShape=JSON.parse(JSON.stringify(recognized));
        lockedShapeType=lockedShape.kind;
        lockPointer={x:points[points.length-1].x,y:points[points.length-1].y};

        if(lockedShape.kind==='line'){
          lockAnchor={x:points[0].x,y:points[0].y};
          lockedShape.a={...lockAnchor};
          lockedShape.b={...lockPointer};
          statusEl.textContent='Doğru aktif — A sabit, B’yi sürükleyebilirsin';
        }else{
          rotationCenter={...lockedShape.center};
          rotationStartPointerAngle=Math.atan2(
            lockPointer.y-rotationCenter.y,
            lockPointer.x-rotationCenter.x
          );
          rotationStartShapeAngle=lockedShape.angle||0;
          transformStartRadius=Math.max(
            8,
            Math.hypot(
              lockPointer.x-rotationCenter.x,
              lockPointer.y-rotationCenter.y
            )
          );
          lockedShapeSnapshot=JSON.parse(JSON.stringify(lockedShape));
          statusEl.textContent=
            (lockedShape.shapeName||'Şekil')+
            ' algılandı — merkezden uzaklık boyutu, merkez çevresindeki hareket dönüşü değiştirir';
        }
        previewRecognized=null;
      }else{
        statusEl.textContent='Şekil algılanmadı';
      }
      redraw();
    },560);
  }

  function eraserPointSegDistance(p,a,b){
    const vx=b.x-a.x, vy=b.y-a.y;
    const wx=p.x-a.x, wy=p.y-a.y;
    const vv=vx*vx+vy*vy;
    if(vv<1e-9) return Math.hypot(p.x-a.x,p.y-a.y);
    let t=(wx*vx+wy*vy)/vv;
    t=Math.max(0,Math.min(1,t));
    const qx=a.x+t*vx,qy=a.y+t*vy;
    return Math.hypot(p.x-qx,p.y-qy);
  }

  function eraserSampleSegment(a,b,step=4){
    const d=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y));
    const n=Math.max(1,Math.ceil(d/step));
    const out=[];
    for(let i=0;i<=n;i++){
      const t=i/n;
      out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
    }
    return out;
  }

  function isErasableInk(o){
    // Both ink-created and menu-created drawable objects can be erased,
    // but locked objects are always protected from the eraser.
    return !!o &&
      !o.locked &&
      ['stroke','line','ellipse','rect','polygon','parabola','axes','symbol'].includes(o.kind);
  }

  function inkObjectHit(o,p,r){
    if(!isErasableInk(o)) return false;

    if(o.kind==='stroke'){
      const pts=o.points||[];
      if(pts.length===1) return Math.hypot(pts[0].x-p.x,pts[0].y-p.y)<=r;
      for(let i=1;i<pts.length;i++){
        if(eraserPointSegDistance(p,pts[i-1],pts[i])<=r) return true;
      }
      return false;
    }

    if(o.kind==='line'){
      return eraserPointSegDistance(p,o.a,o.b)<=r;
    }

    if(o.kind==='ellipse'){
      const a=-(o.angle||0), cs=Math.cos(a), sn=Math.sin(a);
      const dx=p.x-o.center.x, dy=p.y-o.center.y;
      const x=dx*cs-dy*sn, y=dx*sn+dy*cs;
      const rx=Math.max(1,o.rx), ry=Math.max(1,o.ry);
      const q=Math.sqrt((x*x)/(rx*rx)+(y*y)/(ry*ry));
      const tol=r/Math.max(10,Math.min(rx,ry));
      return Math.abs(q-1)<=tol;
    }

    if(o.kind==='parabola'){
      const pts=[];
      const n=100, a=o.angle||0;
      for(let i=0;i<=n;i++){
        const u=-1+2*i/n;
        const q={
          x:o.center.x+u*(o.w/2),
          y:o.center.y+(o.mirrorY?-1:1)*(o.h/2-(u*u)*o.h)
        };
        pts.push(rotatePoint(q,o.center,a));
      }
      for(let i=1;i<pts.length;i++){
        if(eraserPointSegDistance(p,pts[i-1],pts[i])<=r) return true;
      }
      return false;
    }

    if(o.kind==='axes'){
      const a=o.angle||0, hw=o.w/2, hh=o.h/2;
      const sy=o.mirrorY ? -1 : 1;
      const left=rotatePoint({x:o.center.x-hw,y:o.center.y},o.center,a);
      const right=rotatePoint({x:o.center.x+hw,y:o.center.y},o.center,a);
      const top=rotatePoint({x:o.center.x,y:o.center.y-sy*hh},o.center,a);
      const bottom=rotatePoint({x:o.center.x,y:o.center.y+sy*hh},o.center,a);

      return eraserPointSegDistance(p,left,right)<=r ||
             eraserPointSegDistance(p,bottom,top)<=r;
    }

    let verts=[];
    if(o.kind==='rect'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      verts=[
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(v=>rotatePoint(v,o.center,a));
    }else if(o.kind==='polygon'){
      verts=polygonWorldVertices(o);
    }

    if(verts.length){
      for(let i=0;i<verts.length;i++){
        if(eraserPointSegDistance(p,verts[i],verts[(i+1)%verts.length])<=r) return true;
      }
    }

    return false;
  }

  function eraseWholeInkAt(p){
    let changed=false;
    for(let i=objects.length-1;i>=0;i--){
      if(inkObjectHit(objects[i],p,eraserRadius/viewZoom)){
        objects.splice(i,1);
        changed=true;
      }
    }
    return changed;
  }

  function splitSampledStroke(points,style,p,r){
    if(!points || points.length<2) return null;

    let removed=false;
    const chunks=[];
    let cur=[];

    for(const pt of points){
      if(Math.hypot(pt.x-p.x,pt.y-p.y)<=r){
        removed=true;
        if(cur.length>=2) chunks.push(cur);
        cur=[];
      }else{
        cur.push({x:pt.x,y:pt.y});
      }
    }
    if(cur.length>=2) chunks.push(cur);

    if(!removed) return null;

    return chunks.map(pts=>({
      kind:'stroke',
      points:pts,
      style:JSON.parse(JSON.stringify(style||{}))
    }));
  }

  function sampleInkObject(o){
    if(o.kind==='stroke'){
      const pts=[];
      for(let i=1;i<o.points.length;i++){
        const seg=eraserSampleSegment(o.points[i-1],o.points[i],3);
        if(i>1) seg.shift();
        pts.push(...seg);
      }
      return pts;
    }

    if(o.kind==='line'){
      return eraserSampleSegment(o.a,o.b,3);
    }

    if(o.kind==='ellipse'){
      const pts=[], n=140, a=o.angle||0;
      for(let i=0;i<=n;i++){
        const t=i*Math.PI*2/n;
        const local={
          x:o.center.x+Math.cos(t)*o.rx,
          y:o.center.y+Math.sin(t)*o.ry
        };
        pts.push(rotatePoint(local,o.center,a));
      }
      return pts;
    }

    if(o.kind==='symbol'){
      return symbolWorldPoints(o);
    }

    if(o.kind==='parabola'){
      const pts=[], n=140, a=o.angle||0;
      for(let i=0;i<=n;i++){
        const u=-1+2*i/n;
        const q={
          x:o.center.x+u*(o.w/2),
          y:o.center.y+(o.mirrorY?-1:1)*(o.h/2-(u*u)*o.h)
        };
        pts.push(rotatePoint(q,o.center,a));
      }
      return pts;
    }

    if(o.kind==='axes'){
      const a=o.angle||0, hw=o.w/2, hh=o.h/2;
      const sy=o.mirrorY ? -1 : 1;
      const left=rotatePoint({x:o.center.x-hw,y:o.center.y},o.center,a);
      const right=rotatePoint({x:o.center.x+hw,y:o.center.y},o.center,a);
      const top=rotatePoint({x:o.center.x,y:o.center.y-sy*hh},o.center,a);
      const bottom=rotatePoint({x:o.center.x,y:o.center.y+sy*hh},o.center,a);

      return {
        axes:true,
        xPts:eraserSampleSegment(left,right,3),
        yPts:eraserSampleSegment(bottom,top,3)
      };
    }

    let verts=[];
    if(o.kind==='rect'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      verts=[
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(v=>rotatePoint(v,o.center,a));
    }else if(o.kind==='polygon'){
      verts=polygonWorldVertices(o);
    }

    if(verts.length){
      const pts=[];
      for(let i=0;i<verts.length;i++){
        const seg=eraserSampleSegment(verts[i],verts[(i+1)%verts.length],3);
        if(i>0) seg.shift();
        pts.push(...seg);
      }
      return pts;
    }

    return [];
  }

  function erasePointInkAt(p){
    let changed=false;
    const next=[];

    for(const o of objects){
      if(!isErasableInk(o) || !inkObjectHit(o,p,eraserRadius/viewZoom)){
        next.push(o);
        continue;
      }

      const sampled=sampleInkObject(o);

      if(sampled && sampled.axes){
        const xParts=splitSampledStroke(sampled.xPts,o.style,p,eraserRadius/viewZoom);
        const yParts=splitSampledStroke(sampled.yPts,o.style,p,eraserRadius/viewZoom);

        if(xParts===null && yParts===null){
          next.push(o);
        }else{
          if(xParts===null){
            next.push({kind:'stroke',points:sampled.xPts,style:JSON.parse(JSON.stringify(o.style||{}))});
          }else{
            next.push(...xParts);
          }

          if(yParts===null){
            next.push({kind:'stroke',points:sampled.yPts,style:JSON.parse(JSON.stringify(o.style||{}))});
          }else{
            next.push(...yParts);
          }

          changed=true;
        }
      }else{
        const parts=splitSampledStroke(sampled,o.style,p,eraserRadius/viewZoom);

        if(parts===null){
          next.push(o);
        }else{
          next.push(...parts);
          changed=true;
        }
      }
    }

    if(changed) objects=next;
    return changed;
  }

  function closeContextMenu(){
    contextMenu.classList.remove('open');
  }

  function updateContextMenuState(){
    const targets=contextTargetIndices
      .map(i=>objects[i])
      .filter(Boolean);
    if(!targets.length){
      closeContextMenu();
      return;
    }

    const allLocked=targets.every(o=>!!o.locked);
    lockMenuIcon.textContent=allLocked ? '🔒' : '🔓';
    lockMenuText.textContent=allLocked ? 'Kilidi aç' : 'Kilitle';

    const gids=[...new Set(targets.map(o=>o.groupId).filter(Boolean))];
    const oneWholeGroup=
      gids.length===1 &&
      targets.every(o=>o.groupId===gids[0]) &&
      indicesForGroupId(gids[0]).length===targets.length;

    if(oneWholeGroup){
      groupMenuIcon.textContent='▤';
      groupMenuText.textContent='Grubu aç';
      groupToggleBtn.disabled=false;
    }else{
      groupMenuIcon.textContent='▦';
      groupMenuText.textContent='Grupla';
      groupToggleBtn.disabled=targets.length<2;
    }

    flipHorizontalBtn.disabled=false;
    flipVerticalBtn.disabled=false;
    deleteContextBtn.disabled=targets.every(o=>!!o.locked);
  }

  function openContextMenu(screenP,indices){
    contextTargetIndices=expandGroupedIndices(
      (indices||[]).filter(i=>Number.isInteger(i) && i>=0 && i<objects.length)
    );

    if(!contextTargetIndices.length) return;

    updateContextMenuState();

    const menuW=190, menuH=272;
    const r=wrap.getBoundingClientRect();
    const x=Math.max(6,Math.min(screenP.x,r.width-menuW-6));
    const y=Math.max(6,Math.min(screenP.y,r.height-menuH-6));
    contextMenu.style.left=x+'px';
    contextMenu.style.top=y+'px';
    contextMenu.classList.add('open');
  }

  function reorderContextTargets(toFront){
    const valid=[...new Set(contextTargetIndices)]
      .filter(i=>Number.isInteger(i) && i>=0 && i<objects.length)
      .sort((a,b)=>a-b);

    if(!valid.length){
      closeContextMenu();
      return;
    }

    saveState();

    const chosenSet=new Set(valid);
    const chosen=valid.map(i=>objects[i]);
    const remaining=objects.filter((_,i)=>!chosenSet.has(i));

    if(toFront){
      // objects[] çizim sırasında baştan sona render edildiği için,
      // sona eklenen seçim gerçekten bütün nesnelerin üstüne çıkar.
      objects=remaining.concat(chosen);
      contextTargetIndices=chosen.map((_,k)=>remaining.length+k);
    }else{
      // Dizinin başına alınan seçim gerçekten bütün nesnelerin altına iner.
      objects=chosen.concat(remaining);
      contextTargetIndices=chosen.map((_,k)=>k);
    }

    // Keep all targets selected after their indices change, including locked ones.
    setSelection(contextTargetIndices.filter(i=>objects[i]));

    redraw();
    statusEl.textContent=toFront
      ? (chosen.length>1 ? `${chosen.length} nesne en öne getirildi` : 'Nesne en öne getirildi')
      : (chosen.length>1 ? `${chosen.length} nesne en arkaya gönderildi` : 'Nesne en arkaya gönderildi');

    closeContextMenu();
  }

  bringFrontBtn.addEventListener('click',e=>{
    e.stopPropagation();
    reorderContextTargets(true);
  });

  sendBackBtn.addEventListener('click',e=>{
    e.stopPropagation();
    reorderContextTargets(false);
  });

  function reflectContextTargets(axis){
    const valid=expandGroupedIndices(contextTargetIndices)
      .filter(i=>Number.isInteger(i) && i>=0 && i<objects.length);

    if(!valid.length){
      closeContextMenu();
      return;
    }

    const b=groupSelectionBounds(valid);
    if(!b){
      closeContextMenu();
      return;
    }

    saveState();
    const pivot={x:b.cx,y:b.cy};
    for(const i of valid){
      reflectObject(objects[i],pivot,axis);
    }

    contextTargetIndices=valid;
    setSelection(valid.filter(i=>objects[i]));

    statusEl.textContent=axis==='horizontal'
      ? (valid.length>1 ? `${valid.length} nesne yatayda yansıtıldı` : 'Nesne yatayda yansıtıldı')
      : (valid.length>1 ? `${valid.length} nesne dikeyde yansıtıldı` : 'Nesne dikeyde yansıtıldı');

    closeContextMenu();
    redraw();
  }

  function toggleContextGroup(){
    const valid=expandGroupedIndices(contextTargetIndices)
      .filter(i=>Number.isInteger(i) && i>=0 && i<objects.length);

    if(!valid.length){
      closeContextMenu();
      return;
    }

    const gids=[...new Set(valid.map(i=>objects[i] && objects[i].groupId).filter(Boolean))];
    const oneWholeGroup=
      gids.length===1 &&
      valid.every(i=>objects[i] && objects[i].groupId===gids[0]) &&
      indicesForGroupId(gids[0]).length===valid.length;

    if(oneWholeGroup){
      saveState();
      for(const i of valid){
        if(objects[i]) delete objects[i].groupId;
      }
      setSelection(valid.filter(i=>objects[i]));
      statusEl.textContent='Grup açıldı';
      closeContextMenu();
      redraw();
      return;
    }

    if(valid.length<2){
      closeContextMenu();
      return;
    }

    saveState();
    const gid=makeGroupId();
    for(const i of valid){
      if(objects[i]) objects[i].groupId=gid;
    }
    contextTargetIndices=valid;
    setSelection(valid.filter(i=>objects[i]));
    statusEl.textContent=`${valid.length} nesne gruplandı`;
    closeContextMenu();
    redraw();
  }

  flipHorizontalBtn.addEventListener('click',e=>{
    e.stopPropagation();
    reflectContextTargets('horizontal');
  });

  flipVerticalBtn.addEventListener('click',e=>{
    e.stopPropagation();
    reflectContextTargets('vertical');
  });

  groupToggleBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(groupToggleBtn.disabled) return;
    toggleContextGroup();
  });

  lockToggleBtn.addEventListener('click',e=>{
    e.stopPropagation();
    const valid=contextTargetIndices
      .filter(i=>Number.isInteger(i) && i>=0 && i<objects.length);
    if(!valid.length){
      closeContextMenu();
      return;
    }

    const allLocked=valid.every(i=>objects[i] && objects[i].locked);
    const newLocked=!allLocked;

    saveState();
    for(const i of valid){
      if(objects[i]) objects[i].locked=newLocked;
    }

    if(newLocked){
      // Kilitli nesneler artık seçilebilir olduğundan seçim korunur.
      setSelection(valid);
      statusEl.textContent=valid.length>1
        ? `${valid.length} nesne kilitlendi`
        : 'Nesne kilitlendi';
    }else{
      setSelection(valid);
      statusEl.textContent=valid.length>1
        ? `${valid.length} nesnenin kilidi açıldı`
        : 'Nesnenin kilidi açıldı';
    }

    closeContextMenu();
    redraw();
  });

  deleteContextBtn.addEventListener('click',e=>{
    e.stopPropagation();

    const deletable=expandGroupedIndices(contextTargetIndices)
      .filter(i=>Number.isInteger(i) && i>=0 && i<objects.length)
      .filter(i=>objects[i] && !objects[i].locked)
      .sort((a,b)=>b-a);

    if(!deletable.length){
      statusEl.textContent='Kilitli nesneler silinemez';
      closeContextMenu();
      redraw();
      return;
    }

    saveState();

    for(const i of deletable){
      objects.splice(i,1);
    }

    const count=deletable.length;
    contextTargetIndices=[];
    setSelection([]);
    closeContextMenu();
    redraw();

    statusEl.textContent=count>1
      ? `${count} nesne silindi`
      : 'Nesne silindi';
  });

  document.addEventListener('pointerdown',e=>{
    if(!contextMenu.contains(e.target) && e.target!==canvas){
      closeContextMenu();
    }
  });

  canvas.addEventListener('pointerdown',e=>{
    const screenP=screenPointFromEvent(e);
    const p=pFromEvent(e);

    if(e.pointerType==='touch'){
      e.preventDefault();

      activeTouches.set(e.pointerId,{...screenP});
      try{ canvas.setPointerCapture(e.pointerId); }catch(_){}

      // Once a two-finger gesture has ended, the remaining finger must be
      // lifted before another one-finger tool action may start.
      if(suppressTouchUntilAllUp){
        return;
      }

      if(activeTouches.size>=2){
        if(activeTouches.size===2) beginTwoFingerGesture();
        return;
      }

      touchToolPointerId=e.pointerId;
      touchActionObjectsSnapshot=JSON.stringify(objects);
      touchActionSelectionSnapshot={
        indices:selectedIndices.slice(),
        selectedIndex,
        groupSelectionAngle
      };
      touchActionUndoDepth=undoStack.length;

      armTouchLongPress(e,screenP,p);
    }

    if(e.pointerType==='pen' && mode==='select'){
      armTouchLongPress(e,screenP,p);
    }

    // Left-clicking empty canvas closes the object context menu.
    if(e.button===0 && contextMenu.classList.contains('open')){
      const hitForMenuClose=hitTestObjectAny(p);
      if(hitForMenuClose<0){
        closeContextMenu();
      }
    }

    // Right button: click = context menu, drag = pan.
    if(e.button===2){
      e.preventDefault();
      closeContextMenu();
      rightPress={
        pointerId:e.pointerId,
        startScreen:{...screenP},
        startView:{x:viewX,y:viewY},
        hit:hitTestObjectAny(p),
        dragged:false
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }

    if(mode==='text'){
      if(e.button!==0) return;
      e.preventDefault();
      e.stopPropagation();
      closeContextMenu();
      beginTextEditingAt(p,'',-1);
      return;
    }

    if(mode==='fill'){
      closeContextMenu();
      const hit=hitFillableObject(p);
      if(hit>=0){
        saveState();
        objects[hit].fillColor=currentFillColor;
        redraw();
        statusEl.textContent='Nesne dolduruldu';
      }else{
        statusEl.textContent='Doldurulabilir kapalı bir nesneye tıkla';
      }
      return;
    }

    if(mode==='eraser'){
      canvas.setPointerCapture(e.pointerId);
      erasing=true;
      eraserLastPoint=p;
      eraserCursor=p;
      eraserChanged=false;
      selectedIndex=-1;

      saveState();
      const changed=(eraserKind==='stroke')
        ? eraseWholeInkAt(p)
        : erasePointInkAt(p);
      eraserChanged=eraserChanged||changed;

      statusEl.textContent=(eraserKind==='stroke')
        ? 'Silgi — nesne silme'
        : `Silgi — ${eraserRadius}px`;
      redraw();
      return;
    }

    if(mode==='select'){
      canvas.setPointerCapture(e.pointerId);

      // Multi-selection transform handles.
      if(selectedIndices.length>1){
        const gh=hitGroupSelectionHandle(p,e.pointerType);
        if(gh){
          saveState();
          selectStart=p;
          activeHandle=gh;
          groupBoxSnapshot=groupOrientedBox();
          groupSnapshots=selectedIndices.map(i=>({
            index:i,
            object:cloneObject(objects[i])
          }));
          selectSnapshot=null;
          selectAction=(gh==='rotate') ? 'groupRotate' : 'groupResize';
          redraw();
          return;
        }
      }

      // Single-selection edit handles remain unchanged.
      if(selectedIndices.length<=1){
        const h=hitSelectionHandle(p,e.pointerType);
        if(h && selectedIndex>=0){
          saveState();
          setSelection([selectedIndex]);
          selectStart=p;
          selectSnapshot=JSON.parse(JSON.stringify(objects[selectedIndex]));
          groupSnapshots=null;
          activeHandle=h;
          selectAction=
            (h==='rotate') ? 'rotate' :
            (
              h.startsWith('vertex-') ||
              h.startsWith('endpoint-') ||
              h.startsWith('rectvertex-') ||
              h.startsWith('ellipse-') ||
              h.startsWith('sqrt-')
            ) ? 'point' :
            'resize';
          redraw();
          return;
        }
      }

      const hit=hitTestObject(p);

      if(hit>=0){
        const clickedIndices=expandGroupedIndices([hit]);

        if(e.ctrlKey || e.metaKey){
          const next=new Set(selectedIndices);
          const allAlreadySelected=clickedIndices.every(i=>next.has(i));

          if(allAlreadySelected){
            for(const i of clickedIndices) next.delete(i);
          }else{
            for(const i of clickedIndices) next.add(i);
          }

          setSelection([...next]);

          // Ctrl/Cmd-click changes only the selection list.
          // Movement starts on a later normal drag/click.
          selectAction=null;
          selectStart=null;
          selectSnapshot=null;
          groupSnapshots=null;
          groupBoxSnapshot=null;
          activeHandle=null;

          redraw();
          statusEl.textContent=selectedIndices.length
            ? `${selectedIndices.length} nesne seçili`
            : 'Seçim kaldırıldı';
          return;
        }

        const hitAlreadySelected=selectedIndices.includes(hit);

        // Clicking a new object collapses to a single selection.
        if(!hitAlreadySelected){
          setSelection([hit]);
        }

        // Locked objects are selectable so their bounding box is visible,
        // but any selection containing a locked object remains non-editable.
        const selectionHasLocked=selectedIndices.some(
          i=>objects[i] && objects[i].locked
        );

        if(selectionHasLocked){
          selectAction=null;
          selectStart=null;
          selectSnapshot=null;
          groupSnapshots=null;
          groupBoxSnapshot=null;
          activeHandle=null;
          redraw();
          statusEl.textContent=selectedIndices.length>1
            ? `${selectedIndices.length} nesne seçili — kilitli seçim`
            : 'Kilitli nesne seçildi';
          return;
        }

        const movingIndices=selectedIndices.length ? selectedIndices.slice() : [hit];

        saveState();

        // Alt-drag duplicates the current selection and moves the copies.
        if(e.altKey && hitAlreadySelected){
          const dupIndices=duplicateSelection(movingIndices);
          setSelection(dupIndices);
        }

        selectStart=p;
        activeHandle=null;
        groupBoxSnapshot=null;

        if(selectedIndices.length>1){
          groupSnapshots=selectedIndices.map(i=>({
            index:i,
            object:cloneObject(objects[i])
          }));
          selectSnapshot=null;
          selectAction='groupMove';
        }else{
          selectedIndex=selectedIndices[0];
          selectSnapshot=cloneObject(objects[selectedIndex]);
          groupSnapshots=null;
          selectAction='move';
        }

        redraw();
        return;
      }

      // Empty-space drag starts marquee selection.
      setSelection([]);
      marqueeStart=p;
      marqueeEnd=p;
      selectStart=p;
      selectSnapshot=null;
      groupSnapshots=null;
      groupBoxSnapshot=null;
      activeHandle=null;
      selectAction='marquee';
      redraw();
      return;
    }
    if(mode!=='ink') return;
    canvas.setPointerCapture(e.pointerId);
    inkPointerId=e.pointerId;
    drawing=true; points=[p];

    liveInkId=makeObjectId();
    liveInkSentIndex=0;
    liveInkLastSentAt=0;
    collabBroadcastLiveInk(true);
    previewRecognized=null;
    lockedShape=null;
    lockedShapeType=null;
    lockAnchor=null;
    rotationCenter=null;
    lockedShapeSnapshot=null;
    transformStartRadius=1;
    lockPointer=null;
    rotationStartPointerAngle=0;
    rotationStartShapeAngle=0;
    lastMoveTime=performance.now();
    statusEl.textContent='Çiziliyor…';
    armHold();
  });

  canvas.addEventListener('pointermove',e=>{
    const screenP=screenPointFromEvent(e);
    const p=pFromEvent(e);

    if(e.pointerType==='touch'){
      e.preventDefault();

      if(activeTouches.has(e.pointerId)){
        activeTouches.set(e.pointerId,{...screenP});
      }

      if(touchGesture){
        updateTwoFingerGesture();
        return;
      }

      if(suppressTouchUntilAllUp) return;
      if(e.pointerId!==touchToolPointerId) return;

      if(
        touchLongPressPointerId===e.pointerId &&
        touchLongPressStartScreen &&
        Math.hypot(
          screenP.x-touchLongPressStartScreen.x,
          screenP.y-touchLongPressStartScreen.y
        )>10
      ){
        clearTouchLongPress();
      }
    }

    if(e.pointerType==='pen'){
      if(
        touchLongPressPointerId===e.pointerId &&
        touchLongPressStartScreen &&
        Math.hypot(
          screenP.x-touchLongPressStartScreen.x,
          screenP.y-touchLongPressStartScreen.y
        )>10
      ){
        clearTouchLongPress();
      }
    }

    if(rightPress && e.pointerId===rightPress.pointerId){
      const dx=screenP.x-rightPress.startScreen.x;
      const dy=screenP.y-rightPress.startScreen.y;
      if(!rightPress.dragged && Math.hypot(dx,dy)>4){
        rightPress.dragged=true;
        isPanning=true;
        panPointerId=e.pointerId;
        panStartScreen=rightPress.startScreen;
        panStartView=rightPress.startView;
        canvas.style.cursor='grabbing';
      }

      if(rightPress.dragged){
        viewX=rightPress.startView.x+dx;
        viewY=rightPress.startView.y+dy;
        redraw();
        if(textEditing) positionTextEditor();
      }
      return;
    }

    if(isPanning && e.pointerId===panPointerId){
      viewX=panStartView.x+(screenP.x-panStartScreen.x);
      viewY=panStartView.y+(screenP.y-panStartScreen.y);
      redraw();
      return;
    }

    if(mode==='eraser'){
      eraserCursor=p;

      if(erasing){
        const samples=eraserLastPoint
          ? eraserSampleSegment(eraserLastPoint,p,4)
          : [p];

        let changed=false;
        for(const sp of samples){
          changed=((eraserKind==='stroke')
            ? eraseWholeInkAt(sp)
            : erasePointInkAt(sp)) || changed;
        }
        eraserChanged=eraserChanged||changed;
        eraserLastPoint=p;
      }

      redraw();
      return;
    }

    if(mode==='select' && selectAction){
      if(selectAction==='marquee'){
        marqueeEnd=p;
        redraw();
        return;
      }

      if(selectAction==='groupRotate'){
        if(!groupSnapshots || !groupBoxSnapshot) return;

        const c=groupBoxSnapshot.center;
        const a0=Math.atan2(selectStart.y-c.y,selectStart.x-c.x);
        const a1=Math.atan2(p.y-c.y,p.x-c.x);
        const delta=a1-a0;
        groupSelectionAngle=(groupBoxSnapshot.angle||0)+delta;

        for(const item of groupSnapshots){
          objects[item.index]=cloneObject(item.object);
          rotateObjectAround(objects[item.index],c,delta);
        }
        redraw();
        return;
      }

      if(selectAction==='groupResize'){
        if(!groupSnapshots || !groupBoxSnapshot) return;

        const box=groupBoxSnapshot;
        const corners={
          nw:{x:box.minX,y:box.minY},
          ne:{x:box.maxX,y:box.minY},
          se:{x:box.maxX,y:box.maxY},
          sw:{x:box.minX,y:box.maxY}
        };
        const opposites={nw:'se',ne:'sw',se:'nw',sw:'ne'};
        const dragged=corners[activeHandle];
        const opposite=corners[opposites[activeHandle]];
        if(!dragged || !opposite) return;

        const lp=worldToLocal(box,p);

        let sx=Math.abs(lp.x-opposite.x)/Math.max(1,box.w);
        let sy=Math.abs(lp.y-opposite.y)/Math.max(1,box.h);
        sx=Math.max(.06,sx);
        sy=Math.max(.06,sy);

        if(e.shiftKey){
          const s=Math.max(sx,sy);
          sx=s;
          sy=s;
        }

        function scalePointLocal(pt){
          const lp0=worldToLocal(box,pt);
          const nx=opposite.x+(lp0.x-opposite.x)*sx;
          const ny=opposite.y+(lp0.y-opposite.y)*sy;
          return localToWorld(box,{x:nx,y:ny});
        }

        for(const item of groupSnapshots){
          const o=cloneObject(item.object);

          if(o.kind==='line'){
            o.a=scalePointLocal(o.a);
            o.b=scalePointLocal(o.b);

          }else if(o.kind==='stroke'){
            o.points=o.points.map(scalePointLocal);

          }else if(o.kind==='polygon'){
            o.center=scalePointLocal(o.center);
            if(o.baseVertices) o.baseVertices=o.baseVertices.map(scalePointLocal);

          }else if(o.kind==='rect'){
            o.center=scalePointLocal(o.center);
            o.w=Math.max(12,o.w*sx);
            o.h=Math.max(12,o.h*sy);

          }else if(o.kind==='ellipse'){
            o.center=scalePointLocal(o.center);
