            o.rx=Math.max(6,o.rx*sx);
            o.ry=Math.max(6,o.ry*sy);

          }else if(o.kind==='parabola'){
            o.center=scalePointLocal(o.center);
            o.w=Math.max(24,o.w*sx);
            o.h=Math.max(24,o.h*sy);

          }else if(o.kind==='image'){
            o.center=scalePointLocal(o.center);
            o.w=Math.max(24,o.w*sx);
            o.h=Math.max(24,o.h*sy);

          }else if(o.kind==='symbol'){
            o.center=scalePointLocal(o.center);
            if(o.symbolType==='sqrt'){
              o.radicalW=Math.max(18,(o.radicalW||90)*sx);
              o.roofLen=Math.max(18,(o.roofLen||110)*sx);
              o.height=Math.max(18,(o.height||72)*sy);
              o.legDepth=Math.max(6,(o.legDepth||34)*sy);
              o.startOffset=(Number.isFinite(o.startOffset) ? o.startOffset : 0.10*(o.height||72))*sy;
            }else if(o.symbolType==='integral'){
              o.w=Math.max(10,(o.w||50)*sx);
              o.h=Math.max(22,(o.h||130)*sy);
            }

          }else if(o.kind==='text'){
            o.center=scalePointLocal(o.center);
            o.w=Math.max(24,o.w*sx);
            o.h=Math.max(20,o.h*sy);
            o.fontSize=Math.max(6,(o.fontSize||24)*sy);

          }else if(o.kind==='axes'){
            o.center=scalePointLocal(o.center);
            o.w=Math.max(24,o.w*sx);
            o.h=Math.max(24,o.h*sy);
          }

          objects[item.index]=o;
        }

        redraw();
        return;
      }

      if(selectAction==='groupMove'){
        if(!groupSnapshots) return;
        const dx=p.x-selectStart.x,dy=p.y-selectStart.y;
        for(const item of groupSnapshots){
          objects[item.index]=cloneObject(item.object);
          translateObject(objects[item.index],dx,dy);
        }
        redraw();
        return;
      }

      if(selectedIndex<0) return;
      const o=objects[selectedIndex];
      if(!o || !selectSnapshot) return;

      if(selectAction==='move'){
        const dx=p.x-selectStart.x,dy=p.y-selectStart.y;
        objects[selectedIndex]=JSON.parse(JSON.stringify(selectSnapshot));
        translateObject(objects[selectedIndex],dx,dy);

      }else if(selectAction==='rotate'){
        const box=orientedSelectionBox(selectSnapshot);
        if(box){
          const c=box.center;
          const a0=Math.atan2(selectStart.y-c.y,selectStart.x-c.x);
          const a1=Math.atan2(p.y-c.y,p.x-c.x);
          objects[selectedIndex]=JSON.parse(JSON.stringify(selectSnapshot));
          rotateObject(objects[selectedIndex],a1-a0);
        }

      }else if(selectAction==='point'){
        objects[selectedIndex]=JSON.parse(JSON.stringify(selectSnapshot));

        const handled=moveMenuHandleFromSnapshot(
          objects[selectedIndex],
          selectSnapshot,
          String(activeHandle),
          p
        );

        // Backward compatibility: auto-recognized triangle still uses vertex editing.
        if(!handled && String(activeHandle).startsWith('vertex-')){
          const vertexIndex=Number(String(activeHandle).split('-')[1]);
          moveTriangleVertexFromSnapshot(
            objects[selectedIndex],
            selectSnapshot,
            vertexIndex,
            p
          );
        }

      }else if(selectAction==='resize'){
        objects[selectedIndex]=JSON.parse(JSON.stringify(selectSnapshot));

        const handled=resizeObjectLocalFromSnapshot(
          objects[selectedIndex],
          selectSnapshot,
          p,
          activeHandle,
          e.shiftKey
        );

        // Fallback for objects that don't support local resize yet.
        if(!handled){
          const startB=objectBounds(selectSnapshot);
          if(startB){
            resizeObjectFromSnapshot(
              objects[selectedIndex],
              selectSnapshot,
              startB,
              p,
              activeHandle
            );
          }
        }
      }
      redraw();
      return;
    }

    if(!drawing || mode!=='ink') return;
    if(inkPointerId!==null && e.pointerId!==inkPointerId) return;

    if(lockedShape){
      if(lockedShape.kind==='line'){
        // Çizgi: A sabit, B fareyi takip eder.
        lockedShape.a={...lockAnchor};
        lockedShape.b={x:p.x,y:p.y};
        statusEl.textContent='Doğru aktif — B noktası hareket ediyor';

      }else{
        /*
          Hold sonrası otomatik şekil için tek hareket iki bilgiyi taşır:
          - merkezden uzaklık  -> uniform boyutlandırma
          - merkez etrafı açı  -> döndürme
          Dairede dönüş görsel olarak anlamsız olduğundan yalnızca ölçek uygulanır.
        */
        const center=rotationCenter || lockedShape.center;
        const startShape=lockedShapeSnapshot || lockedShape;

        const currentRadius=Math.max(
          2,
          Math.hypot(p.x-center.x,p.y-center.y)
        );
        const scale=Math.max(
          .12,
          Math.min(12,currentRadius/Math.max(1,transformStartRadius))
        );

        lockedShape=JSON.parse(JSON.stringify(startShape));
        scaleObjectUniformAround(lockedShape,center,scale);

        const isCircle=
          lockedShape.kind==='ellipse' &&
          lockedShape.shapeName==='circle';

        if(isCircle){
          lockedShape.angle=0;
          statusEl.textContent='Daire aktif — merkezden uzaklık çapı değiştiriyor';
        }else{
          const a=Math.atan2(p.y-center.y,p.x-center.x);
          let delta=a-rotationStartPointerAngle;
          while(delta>Math.PI) delta-=Math.PI*2;
          while(delta<-Math.PI) delta+=Math.PI*2;

          if(Number.isFinite(lockedShape.angle)){
            lockedShape.angle=rotationStartShapeAngle+delta;
          }else{
            rotateObjectAround(lockedShape,center,delta);
          }

          statusEl.textContent=
            (lockedShape.shapeName||'Şekil')+
            ' — aynı anda boyutlandırılıyor ve döndürülüyor';
        }
      }
      redraw();
      return;
    }

    const prev=points[points.length-1];
    if(dist(prev,p)>1.5){
      points.push(p);
      lastMoveTime=performance.now();
      previewRecognized=null;
      armHold();
      collabBroadcastLiveInk(false);
      redraw();
    }
  });
  canvas.addEventListener('pointerleave',()=>{
    if(mode==='eraser' && !erasing){
      eraserCursor=null;
      redraw();
    }
  });

  function finishPointer(e){
    if(e.pointerType==='pen'){
      const wasPenLongPress=
        touchLongPressTriggered &&
        touchLongPressPointerId===e.pointerId;

      if(touchLongPressPointerId===e.pointerId){
        clearTouchLongPress();
      }

      if(wasPenLongPress){
        touchLongPressTriggered=false;
        selectAction=null;
        selectStart=null;
        selectSnapshot=null;
        groupSnapshots=null;
        groupBoxSnapshot=null;
        activeHandle=null;
        redraw();
        return;
      }
    }

    if(e.pointerType==='touch'){
      const wasLongPress=
        touchLongPressTriggered &&
        touchLongPressPointerId===e.pointerId;

      if(touchLongPressPointerId===e.pointerId){
        clearTouchLongPress();
      }

      activeTouches.delete(e.pointerId);

      if(touchGesture){
        if(activeTouches.size<2){
          touchGesture=null;
          suppressTouchUntilAllUp=activeTouches.size>0;
          cancelCurrentTouchToolAction(false);
          statusEl.textContent=suppressTouchUntilAllUp
            ? 'Diğer parmağı da kaldır'
            : 'Hazır';
          redraw();
        }
        return;
      }

      if(suppressTouchUntilAllUp){
        if(activeTouches.size===0){
          suppressTouchUntilAllUp=false;
          touchToolPointerId=null;
          statusEl.textContent='Hazır';
        }
        return;
      }

      if(wasLongPress){
        touchLongPressTriggered=false;
        cancelCurrentTouchToolAction(false);
        redraw();
        return;
      }

      if(e.pointerId!==touchToolPointerId){
        return;
      }
    }

    if(rightPress && e.pointerId===rightPress.pointerId){
      const rp=rightPress;
      rightPress=null;

      if(e.type==='pointercancel'){
        isPanning=false;
        panPointerId=null;
        panStartScreen=null;
        panStartView=null;
        closeContextMenu();
        restoreToolCursor();
        redraw();
        return;
      }

      if(rp.dragged){
        isPanning=false;
        panPointerId=null;
        panStartScreen=null;
        panStartView=null;
        restoreToolCursor();
        redraw();
        return;
      }

      const hit=rp.hit;
      if(hit>=0 && objects[hit]){
        let targets=[];
        if(selectedIndices.includes(hit) && selectedIndices.length){
          // Sağ tıklanan nesne mevcut seçimin içindeyse,
          // kilitli/kilitsiz ayrımı yapmadan tüm seçim hedeflenir.
          targets=selectedIndices.slice();
        }else{
          mode='select';
          selectBtn.classList.add('active');
          inkBtn.classList.remove('active');
          eraserBtn.classList.remove('active');
          eraserCursor=null;
          setSelection([hit]);
          targets=selectedIndices.length ? selectedIndices.slice() : [hit];
          redraw();
        }
        openContextMenu(rp.startScreen,targets);
      }else{
        closeContextMenu();
      }
      restoreToolCursor();
      return;
    }

    if(isPanning && e.pointerId===panPointerId){
      isPanning=false;
      panPointerId=null;
      panStartScreen=null;
      panStartView=null;
      restoreToolCursor();
      redraw();
      return;
    }

    if(mode==='eraser'){
      erasing=false;
      eraserLastPoint=null;

      // If the eraser touched nothing, remove the unnecessary undo snapshot.
      if(!eraserChanged && undoStack.length) undoStack.pop();
      eraserChanged=false;
      if(e.pointerType==='touch'){
        touchToolPointerId=null;
        touchActionObjectsSnapshot=null;
        touchActionSelectionSnapshot=null;
        touchActionUndoDepth=undoStack.length;
      }
      redraw();
      return;
    }

    if(mode==='select'){
      if(selectAction==='marquee'){
        const r=marqueeRect();
        if(r && r.w>3 && r.h>3){
          const hits=[];
          for(let i=0;i<objects.length;i++){
            const b=objectBounds(objects[i]);
            if(boundsInsideRect(b,r)) hits.push(i);
          }
          setSelection(hits);
          statusEl.textContent = hits.length
            ? `${hits.length} nesne seçildi`
            : 'Seçim yok';
        }else{
          setSelection([]);
        }
      }

      selectAction=null;
      selectStart=null;
      selectSnapshot=null;
      groupSnapshots=null;
      groupBoxSnapshot=null;
      activeHandle=null;
      marqueeStart=null;
      marqueeEnd=null;
      if(e.pointerType==='touch'){
        touchToolPointerId=null;
        touchActionObjectsSnapshot=null;
        touchActionSelectionSnapshot=null;
        touchActionUndoDepth=undoStack.length;
      }
      redraw();
      return;
    }

    if(!drawing){
      if(e.pointerType==='touch'){
        touchToolPointerId=null;
        touchActionObjectsSnapshot=null;
        touchActionSelectionSnapshot=null;
        touchActionUndoDepth=undoStack.length;
      }
      return;
    }
    if(inkPointerId!==null && e.pointerId!==inkPointerId) return;
    clearTimeout(holdTimer);
    saveState();

    let committedObject=null;

    if(lockedShape){
      // Sol tuşun bırakılması otomatik şeklin kabulüdür.
      const accepted=JSON.parse(JSON.stringify(lockedShape));
      accepted.boxAngle=0;
      accepted.id=liveInkId || makeObjectId();
      objects.push(accepted);
      committedObject=accepted;
      statusEl.textContent = lockedShape.kind==='line'
        ? 'Doğru kabul edildi — B son konumunda sabitlendi'
        : 'Şekil kabul edildi';
    }else if(previewRecognized){
      const accepted=JSON.parse(JSON.stringify(previewRecognized));
      accepted.boxAngle=0;
      accepted.id=liveInkId || makeObjectId();
      objects.push(accepted);
      committedObject=accepted;
      statusEl.textContent='Şekle dönüştürüldü';
    }else{
      const accepted={
        id:liveInkId || makeObjectId(),
        kind:'stroke',
        points:points.map(p=>({x:p.x,y:p.y})),
        style:strokeStyle(),
        boxAngle:0
      };
      objects.push(accepted);
      committedObject=accepted;
      statusEl.textContent='Ink olarak bırakıldı';
    }

    collabBroadcastLiveInk(true);
    collabCommitLiveObject(committedObject);

    drawing=false;
    points=[];
    previewRecognized=null;
    lockedShape=null;
    lockedShapeType=null;
    lockAnchor=null;
    rotationCenter=null;
    lockedShapeSnapshot=null;
    transformStartRadius=1;
    lockPointer=null;
    inkPointerId=null;
    if(e.pointerType==='touch'){
      touchToolPointerId=null;
      touchActionObjectsSnapshot=null;
      touchActionSelectionSnapshot=null;
      touchActionUndoDepth=undoStack.length;
    }
    redraw();
  }
  canvas.addEventListener('pointerup',finishPointer);
  canvas.addEventListener('pointercancel',finishPointer);

  canvas.addEventListener('contextmenu',e=>{
    e.preventDefault();
  });

  canvas.addEventListener('wheel',e=>{
    e.preventDefault();

    const s=screenPointFromEvent(e);
    const worldBefore=screenToWorld(s);

    // Smooth exponential zoom works consistently for mouse wheels and trackpads.
    const factor=Math.exp(-e.deltaY*0.0014);
    const nextZoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,viewZoom*factor));

    if(Math.abs(nextZoom-viewZoom)<1e-6) return;

    viewZoom=nextZoom;

    // Keep the world point under the cursor fixed on screen.
    viewX=s.x-worldBefore.x*viewZoom;
    viewY=s.y-worldBefore.y*viewZoom;

    redraw();
    if(textEditing) positionTextEditor();
  },{passive:false});


  function closeFileMenu(){
    fileMenu.classList.remove('open');
  }

  function boardFilePayload(){
    return {
      format:'sinan-ipek-whiteboard',
      version:1,
      savedAt:new Date().toISOString(),
      boardId:COLLAB_BOARD_ID,
      objects:collabSerializableObjects()
    };
  }

  function safeBoardFilename(){
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    return `Beyaz_Tahta_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.whiteboard`;
  }

  function safeBoardPngFilename(){
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    return `Beyaz_Tahta_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.png`;
  }

  function captureVisibleBoardCanvas(){
    // Ekranda görünen tahta alanını yakala.
    // Araç çubuğu zaten canvas dışında. Seçim çerçevesi ve silgi imleci
    // ise canvas üzerinde çizildiği için yakalama anında geçici olarak gizlenir.
    const selectionSnapshot={
      selectedIndex,
      selectedIndices:selectedIndices.slice()
    };
    const eraserCursorSnapshot=eraserCursor;

    try{
      selectedIndex=-1;
      selectedIndices=[];
      eraserCursor=null;
      redraw();

      const exportCanvas=document.createElement('canvas');
      exportCanvas.width=canvas.width;
      exportCanvas.height=canvas.height;
      const exportCtx=exportCanvas.getContext('2d');

      // Paylaşılan PNG her zaman opak beyaz arka plana sahip olsun.
      exportCtx.save();
      exportCtx.setTransform(1,0,0,1,0,0);
      exportCtx.fillStyle='#ffffff';
      exportCtx.fillRect(0,0,exportCanvas.width,exportCanvas.height);
      exportCtx.restore();

      exportCtx.drawImage(canvas,0,0);
      return exportCanvas;
    }finally{
      selectedIndex=selectionSnapshot.selectedIndex;
      selectedIndices=selectionSnapshot.selectedIndices;
      eraserCursor=eraserCursorSnapshot;
      redraw();
    }
  }

  function canvasToPngBlob(sourceCanvas){
    return new Promise((resolve,reject)=>{
      sourceCanvas.toBlob(blob=>{
        if(blob) resolve(blob);
        else reject(new Error('PNG oluşturulamadı'));
      },'image/png');
    });
  }

  function downloadBlob(blob,filename){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  async function shareCurrentBoard(){
    try{
      const exportCanvas=captureVisibleBoardCanvas();
      const blob=await canvasToPngBlob(exportCanvas);
      const filename=safeBoardPngFilename();
      const file=new File([blob],filename,{type:'image/png'});

      // Telefon/tablet ve destekleyen masaüstü tarayıcılarda sistemin
      // normal paylaşım penceresini aç.
      if(navigator.share){
        const shareData={
          title:'Beyaz Tahta',
          text:'Beyaz Tahta görüntüsü',
          files:[file]
        };

        if(!navigator.canShare || navigator.canShare({files:[file]})){
          try{
            await navigator.share(shareData);
            statusEl.textContent='Tahta görüntüsü paylaşıldı';
            return;
          }catch(err){
            // Kullanıcı paylaşım penceresini kapattıysa indirme başlatma.
            if(err && err.name==='AbortError'){
              statusEl.textContent='Paylaşma iptal edildi';
              return;
            }
            console.warn('Sistem paylaşımı kullanılamadı, PNG indiriliyor:',err);
          }
        }
      }

      // Web Share / dosya paylaşımı desteklenmiyorsa PNG indir.
      downloadBlob(blob,filename);
      statusEl.textContent='Paylaşım desteklenmedi — PNG indirildi';
    }catch(err){
      console.error('Tahta paylaşılamadı:',err);
      statusEl.textContent='Tahta görüntüsü oluşturulamadı';
    }
  }

  async function downloadCurrentBoard(){
    try{
      const payload=boardFilePayload();
      const text=JSON.stringify(payload,null,2);
      const suggestedName=safeBoardFilename();

      // Chromium tabanlı tarayıcılarda gerçek sistem "Farklı Kaydet"
      // penceresini aç. Kullanıcı burada adı/konumu değiştirebilir.
      if('showSaveFilePicker' in window){
        try{
          const handle=await window.showSaveFilePicker({
            suggestedName,
            types:[
              {
                description:'Beyaz Tahta dosyası',
                accept:{
                  'application/json':['.whiteboard']
                }
              }
            ],
            excludeAcceptAllOption:false
          });

          const writable=await handle.createWritable();
          await writable.write(text);
          await writable.close();

          statusEl.textContent=`${objects.length} nesneli tahta kaydedildi`;
          return;
        }catch(err){
          // Kullanıcı kayıt penceresini iptal ettiyse hata mesajı gösterme.
          if(err && err.name==='AbortError'){
            statusEl.textContent='Kaydetme iptal edildi';
            return;
          }
          console.warn('Sistem kayıt penceresi kullanılamadı, indirme yöntemine geçiliyor:',err);
        }
      }

      // showSaveFilePicker desteklenmiyorsa klasik tarayıcı indirmesi.
      const blob=new Blob(
        [text],
        {type:'application/json;charset=utf-8'}
      );
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=suggestedName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),0);

      statusEl.textContent=`${objects.length} nesneli tahta yerel dosyaya kaydedildi`;
    }catch(err){
      console.error('Tahta kaydedilemedi:',err);
      statusEl.textContent='Tahta kaydedilemedi';
    }
  }

  function normalizeLoadedBoardPayload(parsed){
    // Yeni .whiteboard biçimi
    if(
      parsed &&
      parsed.format==='sinan-ipek-whiteboard' &&
      Array.isArray(parsed.objects)
    ){
      return JSON.parse(JSON.stringify(parsed.objects));
    }

    // Eski/elle hazırlanmış yalın object-array dosyaları için uyumluluk.
    if(Array.isArray(parsed)){
      return JSON.parse(JSON.stringify(parsed));
    }

    throw new Error('Geçerli bir whiteboard dosyası değil');
  }

  async function applyPendingBoardLoad(){
    if(!pendingBoardLoad || !Array.isArray(pendingBoardLoad.objects)){
      hideBoardLoadConfirmation();
      pendingBoardLoad=null;
      return;
    }

    const incoming=JSON.parse(JSON.stringify(pendingBoardLoad.objects));
    pendingBoardLoad=null;
    hideBoardLoadConfirmation();

    // Undo, yalnızca yüklemeyi yapan bu tarayıcıda eski tahtayı geri alma
    // imkânı sağlar. Ortak odadaki diğer cihazlar yeni state'i görür.
    saveState();

    objects=incoming;
    ensureUniqueObjectIds();
    setSelection([]);
    closeContextMenu();
    closeFileMenu();
    if(textEditing) closeTextEditor(false);
    remoteLiveInk.clear();

    collabRebuildLiveSnapshot();
    collabLastSignature=collabSignature(objects);
    redraw();

    // Hızlı yol: bağlı cihazlara tam tahta değişimini anında bildir.
    collabBroadcast('board_replace',{
      objects:collabSerializableObjects()
    });

    // Kalıcı checkpoint: aynı state'i Supabase main tahtasına yaz.
    if(collabEnabled && collabClient){
      try{
        const state=collabSerializableObjects();
        const {error}=await collabClient
          .from(COLLAB_TABLE)
          .upsert({
            id:COLLAB_BOARD_ID,
            state,
            updated_at:new Date().toISOString(),
            updated_by:COLLAB_CLIENT_ID
          },{onConflict:'id'});

        if(error) throw error;
        collabLastSignature=collabSignature(state);
        collabRebuildLiveSnapshot();
        statusEl.textContent=`Kaydedilmiş tahta ortak odaya yüklendi — ${objects.length} nesne`;
      }catch(err){
        console.error('Kaydedilmiş tahta Supabase’e yazılamadı:',err);
        statusEl.textContent='Tahta yerelde açıldı; ortak odaya kalıcı yazma başarısız';
      }
    }else{
      statusEl.textContent=`Kaydedilmiş tahta açıldı — ${objects.length} nesne`;
    }
  }

  function closeTextEditor(commit=true){
    if(!textEditing || textEditorFinishing) return;
    textEditorFinishing=true;

    const state=textEditing;
    const value=textEditor.value;
    const clean=value.replace(/\r/g,'');

    if(commit){
      const visualW=Math.max(40,textEditor.offsetWidth);
      const visualH=Math.max(30,Math.max(textEditor.offsetHeight,textEditor.scrollHeight));
      const w=visualW/viewZoom;
      const h=visualH/viewZoom;

      if(state.isNew){
        if(clean.trim()!==''){
          saveState();
          objects.push({
            kind:'text',
            center:{...state.center},
            w,h,
            angle:0,
            text:clean,
            fontSize:state.fontSize,
            style:{...state.style},
            source:'text',
            shapeName:'text',
            boxAngle:0
          });
          setSelection([objects.length-1]);
        }
      }else if(state.index>=0 && objects[state.index]){
        objects[state.index].text=clean;
        objects[state.index].w=w;
        objects[state.index].h=h;
        if(clean.trim()===''){
          objects.splice(state.index,1);
          setSelection([]);
        }else{
          setSelection([state.index]);
        }
      }
    }

    textEditor.style.display='none';
    textEditor.value='';
    textEditing=null;
    textEditorFinishing=false;
    redraw();
  }

  function positionTextEditor(){
    if(!textEditing) return;
    const s=worldToScreenPoint(textEditing.center);
    const w=Math.max(80,textEditing.w*viewZoom);
    const h=Math.max(44,textEditing.h*viewZoom);
    const fontPx=Math.max(10,textEditing.fontSize*viewZoom);

    textEditor.style.left=s.x+'px';
    textEditor.style.top=s.y+'px';
    textEditor.style.width=w+'px';
    textEditor.style.height=h+'px';
    textEditor.style.fontSize=fontPx+'px';
    textEditor.style.color=(textEditing.style && textEditing.style.color) || currentColor;
    textEditor.style.transform=`translate(-50%,-50%) rotate(${textEditing.angle||0}rad)`;
  }

  function beginTextEditingAt(center,initialText='',existingIndex=-1){
    if(textEditing) closeTextEditor(true);

    let state;
    if(existingIndex>=0 && objects[existingIndex] && objects[existingIndex].kind==='text'){
      const o=objects[existingIndex];
      saveState();
      state={
        index:existingIndex,
        isNew:false,
        center:{...o.center},
        w:o.w,
        h:o.h,
        angle:o.angle||0,
        fontSize:o.fontSize||24,
        style:{...(o.style||{color:currentColor,width:+widthEl.value})}
      };
      textEditor.value=o.text||'';
    }else{
      state={
        index:-1,
        isNew:true,
        center:{...center},
        w:260/viewZoom,
        h:90/viewZoom,
        angle:0,
        fontSize:24/viewZoom,
        style:{color:currentColor,width:+widthEl.value}
      };
      textEditor.value=initialText;
    }

    textEditing=state;
    positionTextEditor();
    textEditor.style.display='block';
    textEditor.focus();
    const end=textEditor.value.length;
    textEditor.setSelectionRange(end,end);
    statusEl.textContent='Metin yaz — bitirmek için kutunun dışına tıkla';
  }

    const b=textEditor.selectionEnd ?? a;
    textEditor.setRangeText(symbol,a,b,'end');

  function makeFunctionStroke(type,cx,cy,scale,style){
    const pts=[];

    if(type==='sinx'){
      // x in [-pi, pi], finite two-period-width style segment.
      const n=180;
      const halfW=150*scale;
      const amp=65*scale;
      for(let i=0;i<=n;i++){
        const t=-Math.PI + (2*Math.PI*i/n);
        pts.push({
          x:cx + (t/Math.PI)*halfW,
          y:cy - Math.sin(t)*amp
        });
      }
      return {
        kind:'stroke',
        points:pts,
        style,
        source:'menu',
        shapeName:'sin x',
        boxAngle:0
      };
    }

    if(type==='tanx'){
      // Keep away from +/- pi/2 asymptotes so this is a clean finite curve.
      const n=160;
      const limit=1.18;
      const halfW=145*scale;
      const ampScale=42*scale;
      for(let i=0;i<=n;i++){
        const t=-limit + (2*limit*i/n);
        pts.push({
          x:cx + (t/limit)*halfW,
          y:cy - Math.tan(t)*ampScale
        });
      }
      return {
        kind:'stroke',
        points:pts,
        style,
        source:'menu',
        shapeName:'tan x',
        boxAngle:0
      };
    }

    if(type==='ex'){
      // x in [-2.2, 2.0], vertically centered finite exponential segment.
      const n=170;
      const xmin=-2.2, xmax=2.0;
      const halfW=145*scale;
      const yScale=22*scale;
      const baseY=cy + 48*scale;
      for(let i=0;i<=n;i++){
        const x=xmin+(xmax-xmin)*i/n;
        const xn=(x-(xmin+xmax)/2)/((xmax-xmin)/2);
        pts.push({
          x:cx + xn*halfW,
          y:baseY - Math.exp(x)*yScale
        });
      }
      return {
        kind:'stroke',
        points:pts,
        style,
        source:'menu',
        shapeName:'eˣ',
        boxAngle:0
      };
    }
    if(type==='x3'){
      // Finite cubic curve y = x³.
      const n=180;
      const limit=1.75;
      const halfW=145*scale;
      const yScale=22*scale;

      for(let i=0;i<=n;i++){
        const x=-limit + (2*limit*i/n);
        pts.push({
          x:cx + (x/limit)*halfW,
          y:cy - (x*x*x)*yScale
        });
      }

      return {
        kind:'stroke',
        points:pts,
        style,
        source:'menu',
        shapeName:'x³',
        boxAngle:0
      };
    }

    return null;
  }

  addShapeBtn.onclick=()=>{
    saveState();
    const r=canvas.getBoundingClientRect();
    const centerWorld=screenToWorld({x:r.width/2,y:r.height/2});
    const cx=centerWorld.x, cy=centerWorld.y;
    const insertionScale=1/viewZoom;
    const style=strokeStyle(), t=shapeType.value;
    if(t==='line') objects.push({kind:'line',a:{x:cx-100*insertionScale,y:cy},b:{x:cx+100*insertionScale,y:cy},style,source:'menu',boxAngle:0});
    if(t==='rect') objects.push({kind:'rect',center:{x:cx,y:cy},w:180*insertionScale,h:110*insertionScale,angle:0,style,shapeName:'rectangle',source:'menu'});
    if(t==='ellipse') objects.push({kind:'ellipse',center:{x:cx,y:cy},rx:95*insertionScale,ry:60*insertionScale,angle:0,style,shapeName:'ellipse',source:'menu'});
    if(t==='parabola') {
      objects.push({
        kind:'parabola',
        center:{x:cx,y:cy},
        w:220*insertionScale,
        h:150*insertionScale,
        angle:0,
        style,
        shapeName:'parabola',
        source:'menu',
        boxAngle:0
      });
    }

    if(t==='sinx' || t==='tanx' || t==='ex' || t==='x3'){
      const fn=makeFunctionStroke(t,cx,cy,insertionScale,style);
      if(fn) objects.push(fn);
    }

    if(t==='triangle') {
      // Menu triangle: simple upright isosceles triangle using current polygon schema.
      const base=[
        {x:cx,      y:cy-80*insertionScale},
        {x:cx+95*insertionScale,   y:cy+65*insertionScale},
        {x:cx-95*insertionScale,   y:cy+65*insertionScale}
      ];
      objects.push({
        kind:'polygon',
        center:{x:cx,y:cy},
        baseVertices:base,
        angle:0,
        style,
        shapeName:'triangle',
        source:'menu',
        boxAngle:0
      });
    }
    if(t==='pentagon') {
      // Menu pentagon: mathematically regular pentagon.
      const radius=90*insertionScale;
      const base=[];
      for(let i=0;i<5;i++){
        const a=-Math.PI/2 + i*Math.PI*2/5;
        base.push({
          x:cx+Math.cos(a)*radius,
          y:cy+Math.sin(a)*radius
        });
      }
      objects.push({
        kind:'polygon',
        center:{x:cx,y:cy},
        baseVertices:base,
        angle:0,
        style,
        shapeName:'regular pentagon',
        source:'menu',
        boxAngle:0
      });
    }

    if(t==='axes') {
      objects.push({
        kind:'axes',
        center:{x:cx,y:cy},
        w:240*insertionScale,
        h:180*insertionScale,
        angle:0,
        style,
        shapeName:'x-y axes',
        source:'menu',
        boxAngle:0
      });
    }

    if(t==='hexagon') {
      // Menu hexagon: mathematically regular hexagon.
      // Build vertices locally; no dependency on any helper function.
      const radius=90*insertionScale;
      const base=[];
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        base.push({
          x:cx+Math.cos(a)*radius,
          y:cy+Math.sin(a)*radius
        });
      }
      objects.push({
        kind:'polygon',
        center:{x:cx,y:cy},
        baseVertices:base,
        angle:0,
        style,
        shapeName:'regular hexagon',
        source:'menu',
        boxAngle:0
      });
    }
    redraw();statusEl.textContent='Şekil eklendi';
  };

  undoBtn.onclick=()=>{
    if(textEditing) closeTextEditor(true);
    if(!undoStack.length) return;
    redoStack.push(JSON.stringify(objects));
    objects=JSON.parse(undoStack.pop());
    ensureUniqueObjectIds();
    setSelection([]);
    redraw();
  };
  redoBtn.onclick=()=>{
    if(textEditing) closeTextEditor(true);
    if(!redoStack.length) return;
    undoStack.push(JSON.stringify(objects));
    objects=JSON.parse(redoStack.pop());
    ensureUniqueObjectIds();
    setSelection([]);
    redraw();
  };
  clearBtn.onclick=()=>{
    if(textEditing) closeTextEditor(true);
    if(!objects.length) return;

    const count=objects.length;
    saveState();
    objects=[];
    setSelection([]);
    redraw();
    statusEl.textContent=`${count} nesne silindi`;
  };


  window.addEventListener('error',e=>{
    console.error(e.error||e.message);
    statusEl.textContent='Bir çizim hatası atlandı — uygulama çalışmaya devam ediyor';
    e.preventDefault();
  });


  window.addEventListener('keydown',e=>{
    const cmd=e.ctrlKey || e.metaKey;

    if(mode==='select' && selectedIndices.length && (e.key==='Delete' || e.key==='Backspace')){
      e.preventDefault();

      const deletable=selectedIndices
        .filter(i=>i>=0 && i<objects.length && objects[i] && !objects[i].locked)
        .sort((a,b)=>b-a);

      if(!deletable.length){
        statusEl.textContent='Kilitli nesneler silinemez';
        redraw();
        return;
      }

      saveState();

      for(const i of deletable){
        objects.splice(i,1);
      }

      const count=deletable.length;
      setSelection([]);
      redraw();
      statusEl.textContent=`${count} nesne silindi`;
      return;
    }

    if(mode==='select' && cmd && e.key.toLowerCase()==='c' && selectedIndices.length){
      e.preventDefault();
      internalClipboard=selectedIndices
        .map(i=>objects[i])
        .filter(Boolean)
        .map(cloneObject);
      statusEl.textContent=`${internalClipboard.length} nesne kopyalandı`;
      return;
    }

    if(e.key==='Escape'){
      setSelection([]);
      selectAction=null;
      marqueeStart=null;
      marqueeEnd=null;
      redraw();
    }
  });

  function openFeedbackModal(){
    feedbackModal.classList.add('open');
    feedbackModal.setAttribute('aria-hidden','false');
    feedbackText.value='';
    feedbackCount.textContent='0 / 1500';
    feedbackStatus.textContent='';
    feedbackStatus.className='feedbackStatus';
    sendFeedbackBtn.disabled=false;
    sendFeedbackBtn.textContent='Gönder';
    setTimeout(()=>feedbackText.focus(),0);
  }

  function closeFeedbackModal(){
    feedbackModal.classList.remove('open');
    feedbackModal.setAttribute('aria-hidden','true');
  }

  async function sendFeedbackMessage(){
    const message=feedbackText.value.trim();

    feedbackStatus.className='feedbackStatus';
    feedbackStatus.textContent='';

    if(!message){
      feedbackStatus.classList.add('error');
      feedbackStatus.textContent='Lütfen önce bir mesaj yazın.';
      feedbackText.focus();
      return;
    }

    if(!window.supabase || !window.supabase.createClient){
      feedbackStatus.classList.add('error');
      feedbackStatus.textContent='Mesaj sistemi şu anda kullanılamıyor.';
      return;
    }

    sendFeedbackBtn.disabled=true;
    sendFeedbackBtn.textContent='Gönderiliyor…';
    feedbackStatus.textContent='Mesaj gönderiliyor…';

    try{
      const client=collabClient || window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {auth:{persistSession:false,autoRefreshToken:false}}
      );

      const {error}=await client
        .from('feedback_messages')
        .insert({message:`[Beyaz Tahta | ${location.pathname}] ${message}`});

      if(error) throw error;

      feedbackStatus.classList.add('success');
      feedbackStatus.textContent='Mesajınız gönderildi. Teşekkürler.';
      statusEl.textContent='Mesajınız gönderildi — teşekkürler';

      setTimeout(()=>{
        closeFeedbackModal();
      },700);

    }catch(err){
      console.error('Mesaj gönderilemedi:',err);

      const raw=(err && (err.message || err.details || err.hint || err.code)) ? String(err.message || err.details || err.hint || err.code) : '';
      const tableMissing =
        /feedback_messages/i.test(raw) &&
        /(not found|does not exist|schema cache|42P01|PGRST)/i.test(raw);

      feedbackStatus.classList.add('error');

      if(tableMissing){
        feedbackStatus.textContent='Mesaj sistemi henüz kurulmamış. Supabase içinde feedback_messages tablosu oluşturulmalı.';
      }else{
        feedbackStatus.textContent='Mesaj gönderilemedi. İnternet bağlantısını veya mesaj sistemini kontrol edin.';
      }

      statusEl.textContent='Mesaj gönderilemedi';
      sendFeedbackBtn.disabled=false;
      sendFeedbackBtn.textContent='Gönder';
    }
  }

  creatorSignature.addEventListener('click',openFeedbackModal);
  cancelFeedbackBtn.addEventListener('click',closeFeedbackModal);
  sendFeedbackBtn.addEventListener('click',sendFeedbackMessage);

  feedbackText.addEventListener('input',()=>{
    feedbackCount.textContent=`${feedbackText.value.length} / 1500`;
  });

  feedbackModal.addEventListener('pointerdown',e=>{
    if(e.target===feedbackModal) closeFeedbackModal();
  });

  feedbackText.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      e.preventDefault();
      closeFeedbackModal();
    }else if((e.ctrlKey || e.metaKey) && e.key==='Enter'){
      e.preventDefault();
      sendFeedbackMessage();
    }
  });

  resize();
  initCollaboration();
})();
</script>
