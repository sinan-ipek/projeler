<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Whiteboard Ink Prototype v15.34 Axis Aligned Initial Boxes</title>
<style>
  :root{
    --bg:#f6f7f9;
    --panel:#ffffff;
    --border:#d9dde5;
    --text:#1f2430;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  #app{height:100%;display:flex;flex-direction:column}
  #toolbar{
    height:58px;background:var(--panel);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;padding:8px 12px;z-index:5;
    box-shadow:0 2px 10px rgba(0,0,0,.04)
  }
  button,select,input[type=color]{
    height:38px;border:1px solid var(--border);background:white;border-radius:10px;padding:0 12px;
    font-size:14px;cursor:pointer
  }
  button.active{background:#eaf1ff;border-color:#9db7ff;color:#1747b0}
  button:hover{background:#f3f5f8}
  .sep{width:1px;height:30px;background:var(--border);margin:0 2px}
  #stageWrap{
    position:relative;
    flex:1;
    overflow:hidden;
    background:#ffffff;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
  #status{margin-left:auto;font-size:12px;color:#687080}
  .label{font-size:12px;color:#667085}
  .iconBtn{
    width:38px;
    min-width:38px;
    max-width:38px;
    height:36px;
    padding:0;
    flex:0 0 38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    line-height:1;
  }
  .iconBtn svg{width:21px;height:21px;display:block}
  #color{width:38px;height:36px;padding:3px;cursor:pointer}
  #width{width:54px}
  #shapeType{max-width:112px}

  #contextMenu{
    position:absolute;
    display:none;
    min-width:154px;
    padding:6px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);
    z-index:40;
  }
  #contextMenu.open{display:block}
  #contextMenu button{
    width:100%;
    height:36px;
    display:flex;
    align-items:center;
    gap:9px;
    justify-content:flex-start;
    border:0;
    background:transparent;
    padding:0 10px;
  }
  #contextMenu button:hover{background:#f3f5f8}
  #contextMenu button:disabled{
    opacity:.42;
    cursor:default;
    background:transparent;
  }
  #deleteContextBtn:not(:disabled){color:#b42318}
  #deleteContextBtn:not(:disabled):hover{background:#fff1f0}
  #lockMenuIcon{font-size:17px;width:22px;text-align:center}
  #imageInput{display:none}

  #textEditor{
    position:absolute;
    display:none;
    z-index:35;
    box-sizing:border-box;
    resize:none;
    overflow:hidden;
    padding:4px 6px;
    border:1.5px solid #2563eb;
    border-radius:4px;
    outline:none;
    background:rgba(255,255,255,.96);
    color:#111;
    font-family:"Comic Neue","Trebuchet MS","Segoe UI","Arial Rounded MT Bold","Arial","Comic Sans MS",sans-serif;
    line-height:1.25;
    transform-origin:center center;
    box-shadow:0 2px 10px rgba(37,99,235,.12);
  }

  .fileWrap{position:relative;display:inline-flex}
  #fileMenu{
    position:absolute;
    top:42px;
    left:0;
    display:none;
    min-width:150px;
    padding:6px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);
    z-index:45;
  }
  #fileMenu.open{display:block}
  #fileMenu button{
    width:100%;
    height:36px;
    border:0;
    background:transparent;
    display:flex;
    align-items:center;
    gap:9px;
    justify-content:flex-start;
    padding:0 10px;
  }
  #fileMenu button:hover{background:#f3f5f8}
  #boardFileInput{display:none}

  #boardLoadConfirm{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(17,24,39,.22);
    z-index:80;
  }
  #boardLoadConfirm.open{display:flex}
  .boardConfirmCard{
    width:min(420px,calc(100% - 32px));
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 18px 50px rgba(0,0,0,.18);
    padding:18px;
  }
  .boardConfirmTitle{
    font-size:16px;
    font-weight:650;
    margin-bottom:8px;
    color:#111827;
  }
  .boardConfirmText{
    font-size:13px;
    line-height:1.45;
    color:#4b5563;
  }
  .boardConfirmActions{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
  .boardConfirmActions button{
    min-width:92px;
  }

  .eraserWrap{position:relative;display:inline-flex}
  #eraserMenu{
    position:absolute;top:42px;left:0;
    display:none;gap:6px;align-items:center;
    padding:6px;background:#fff;border:1px solid var(--border);
    border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);
    z-index:20;
  }
  #eraserMenu.open{display:flex}
  .eraserOption{
    width:38px;height:38px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:9px;
  }
  .eraserOption.active{background:#eaf1ff;border-color:#9db7ff}
  .eraserOption svg{display:block}
  .dashCircle{
    border:1.6px dashed currentColor;border-radius:50%;
    display:block;
  }
  .dashCircle.small{width:8px;height:8px}
  .dashCircle.medium{width:18px;height:18px}
  .dashCircle.large{width:30px;height:30px}

  .fillWrap{position:relative;display:inline-flex}
  #fillBtn{
    width:38px;height:36px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    position:relative;
  }
  #fillBtn svg{width:22px;height:22px;display:block}
  #fillSwatch{
    position:absolute;
    right:5px;
    bottom:4px;
    width:10px;
    height:10px;
    border-radius:50%;
    border:1px solid #667085;
    background:#facc15;
  }
  #fillMenu{
    position:absolute;top:42px;left:0;
    display:none;
    grid-template-columns:repeat(3,34px);
    gap:7px;
    padding:8px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    z-index:25;
  }
  #fillMenu.open{display:grid}
  .fillColorOption{
    width:34px;height:34px;padding:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:9px;
  }
  .fillColorOption .colorSwatch{width:22px;height:22px}
  .fillColorOption.active{background:#eaf1ff;border-color:#9db7ff}

  .colorWrap{position:relative;display:inline-flex}
  #colorBtn{
    width:38px;height:36px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .colorSwatch{
    width:20px;height:20px;border-radius:50%;
    border:1px solid #8c94a3;
    display:block;
  }
  #colorMenu{
    position:absolute;top:42px;left:0;
    display:none;
    grid-template-columns:repeat(3,34px);
    gap:7px;
    padding:8px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
    z-index:20;
  }
  #colorMenu.open{display:grid}
  .colorOption{
    width:34px;height:34px;padding:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:9px;
  }
  .colorOption .colorSwatch{width:22px;height:22px}
  .colorOption.active{background:#eaf1ff;border-color:#9db7ff}

  .creator-signature{
    position:fixed;
    right:16px;
    bottom:12px;
    z-index:20;
    width:auto;
    height:auto;
    min-width:0;
    padding:2px 3px;
    border:0;
    border-radius:4px;
    background:transparent;
    color:#9a9a9a;
    font:400 13px/1.2 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    letter-spacing:.15px;
    user-select:none;
    -webkit-user-select:none;
    transition:color .16s ease, opacity .16s ease;
    opacity:.82;
    cursor:pointer;
  }
  .creator-signature:hover,
  .creator-signature:focus-visible{
    background:transparent;
    color:#111;
    opacity:1;
    outline:none;
  }

  #feedbackModal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:120;
    background:rgba(17,24,39,.18);
    padding:18px;
  }
  #feedbackModal.open{display:flex}
  .feedbackCard{
    width:min(420px,calc(100vw - 36px));
    background:#fff;
    border:1px solid #dfe3e8;
    border-radius:14px;
    box-shadow:0 18px 55px rgba(0,0,0,.18);
    padding:16px;
  }
  .feedbackTitle{
    font-size:16px;
    font-weight:650;
    color:#222;
    margin-bottom:5px;
  }
  .feedbackSub{
    font-size:12px;
    line-height:1.4;
    color:#6b7280;
    margin-bottom:10px;
  }
  #feedbackText{
    width:100%;
    min-height:120px;
    resize:vertical;
    border:1px solid #cfd5dc;
    border-radius:9px;
    padding:10px 11px;
    outline:none;
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    color:#222;
    background:#fff;
  }
  #feedbackText:focus{
    border-color:#8da6c8;
    box-shadow:0 0 0 3px rgba(83,119,166,.10);
  }
  .feedbackStatus{
    min-height:18px;
    margin-top:8px;
    font-size:12px;
    line-height:1.35;
    color:#6b7280;
  }
  .feedbackStatus.error{color:#b42318}
  .feedbackStatus.success{color:#18794e}
  .feedbackBottom{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
  }
  #feedbackCount{
    margin-right:auto;
    font-size:11px;
    color:#8a919b;
  }
  .feedbackBottom button{
    height:34px;
    border-radius:8px;
    padding:0 12px;
  }
  #sendFeedbackBtn{
    background:#20242a;
    border-color:#20242a;
    color:#fff;
  }
  #sendFeedbackBtn:hover{background:#111418}
  #sendFeedbackBtn:disabled{opacity:.55;cursor:default}

  @media (pointer:coarse){
    .creator-signature{
      right:12px;
      bottom:10px;
      font-size:12px;
    }
  }

</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="homeBtn" class="iconBtn" title="Ana sayfa" aria-label="Ana sayfa">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 11.2 12 4l8.5 7.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.5 10.5V20h13v-9.5M9.2 20v-5.8h5.6V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="fileWrap">
      <button id="fileBtn" class="iconBtn" title="Dosya" aria-label="Dosya">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 4.5h6l2 2h7v13h-15z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M4.5 8h15" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <div id="fileMenu" role="menu" aria-label="Dosya menüsü">
        <button id="saveBoardBtn" role="menuitem">
          <span style="font-size:16px;width:22px;text-align:center">↓</span>
          <span>Kaydet</span>
        </button>
        <button id="openBoardBtn" role="menuitem">
          <span style="font-size:16px;width:22px;text-align:center">↑</span>
          <span>Aç</span>
        </button>
        <button id="shareBoardBtn" role="menuitem">
          <span style="font-size:16px;width:22px;text-align:center">↗</span>
          <span>Paylaş</span>
        </button>
      </div>
      <input id="boardFileInput" type="file" accept=".whiteboard,.json,application/json">
    </div>

    <button id="inkBtn" class="active iconBtn" title="Ink" aria-label="Ink">✎</button>

    <div class="colorWrap">
      <button id="colorBtn" class="iconBtn" title="Renk" aria-label="Renk">
        <span id="currentColorSwatch" class="colorSwatch" style="background:#111111"></span>
      </button>

      <div id="colorMenu" role="menu" aria-label="Renk paleti">
        <button class="colorOption active" data-color="#111111" title="Siyah" aria-label="Siyah"><span class="colorSwatch" style="background:#111111"></span></button>
        <button class="colorOption" data-color="#7e22ce" title="Mor" aria-label="Mor"><span class="colorSwatch" style="background:#7e22ce"></span></button>
        <button class="colorOption" data-color="#172554" title="Lacivert" aria-label="Lacivert"><span class="colorSwatch" style="background:#172554"></span></button>
        <button class="colorOption" data-color="#2563eb" title="Mavi" aria-label="Mavi"><span class="colorSwatch" style="background:#2563eb"></span></button>
        <button class="colorOption" data-color="#16a34a" title="Yeşil" aria-label="Yeşil"><span class="colorSwatch" style="background:#16a34a"></span></button>
        <button class="colorOption" data-color="#facc15" title="Sarı" aria-label="Sarı"><span class="colorSwatch" style="background:#facc15"></span></button>
        <button class="colorOption" data-color="#f97316" title="Turuncu" aria-label="Turuncu"><span class="colorSwatch" style="background:#f97316"></span></button>
        <button class="colorOption" data-color="#dc2626" title="Kırmızı" aria-label="Kırmızı"><span class="colorSwatch" style="background:#dc2626"></span></button>
        <button class="colorOption" data-color="#ffffff" title="Beyaz" aria-label="Beyaz"><span class="colorSwatch" style="background:#ffffff;border-color:#667085"></span></button>
        <button class="colorOption" data-color="#d1d5db" title="Açık gri" aria-label="Açık gri"><span class="colorSwatch" style="background:#d1d5db"></span></button>
        <button class="colorOption" data-color="#6b7280" title="Orta gri" aria-label="Orta gri"><span class="colorSwatch" style="background:#6b7280"></span></button>
        <button class="colorOption" data-color="#8b5e3c" title="Kahverengi" aria-label="Kahverengi"><span class="colorSwatch" style="background:#8b5e3c"></span></button>
      </div>
    </div>

    <select id="width" title="Kalınlık" aria-label="Kalınlık">
      <option value="2">2</option>
      <option value="4" selected>4</option>
      <option value="6">6</option>
      <option value="9">9</option>
    </select>

    <button id="selectBtn" class="iconBtn" title="Seç" aria-label="Seç">↖</button>

    <div class="eraserWrap">
      <button id="eraserBtn" class="iconBtn" title="Silgi" aria-label="Silgi">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7.1 18.2 3.8 14.9a2.2 2.2 0 0 1 0-3.1l7.5-7.5a2.2 2.2 0 0 1 3.1 0l5.3 5.3a2.2 2.2 0 0 1 0 3.1l-5.5 5.5H7.1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="m8 8 8 8M7.1 18.2h11.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <div id="eraserMenu" role="menu" aria-label="Silgi seçenekleri">
        <button class="eraserOption active" data-eraser-kind="stroke" title="Tüm ink'i sil" aria-label="Tüm ink'i sil">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M7.1 18.2 3.8 14.9a2.2 2.2 0 0 1 0-3.1l7.5-7.5a2.2 2.2 0 0 1 3.1 0l5.3 5.3a2.2 2.2 0 0 1 0 3.1l-5.5 5.5H7.1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m8 8 8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="eraserOption" data-eraser-kind="point" data-radius="6" title="Küçük noktasal silgi" aria-label="Küçük noktasal silgi">
          <span class="dashCircle small" aria-hidden="true"></span>
        </button>
        <button class="eraserOption" data-eraser-kind="point" data-radius="14" title="Orta noktasal silgi" aria-label="Orta noktasal silgi">
          <span class="dashCircle medium" aria-hidden="true"></span>
        </button>
        <button class="eraserOption" data-eraser-kind="point" data-radius="26" title="Büyük noktasal silgi" aria-label="Büyük noktasal silgi">
          <span class="dashCircle large" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div class="fillWrap">
      <button id="fillBtn" class="iconBtn" title="Nesne içini doldur" aria-label="Nesne içini doldur">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7.2 4.5 8.8 8.8-5.8 5.8a2.2 2.2 0 0 1-3.1 0l-3.2-3.2a2.2 2.2 0 0 1 0-3.1l5.8-5.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m5.8 11.2 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M17.5 16.5c0 1.7 1.2 3 2.6 3s2.4-1.1 2.4-2.5c0-1.5-2.4-4.2-2.4-4.2s-2.6 2.5-2.6 3.7Z" transform="translate(-1.6 -1.3) scale(.85)" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span id="fillSwatch" aria-hidden="true"></span>
      </button>
      <div id="fillMenu" role="menu" aria-label="Dolgu renkleri">
        <button class="fillColorOption" data-fill-color="#111111" title="Siyah"><span class="colorSwatch" style="background:#111111"></span></button>
        <button class="fillColorOption" data-fill-color="#7e22ce" title="Mor"><span class="colorSwatch" style="background:#7e22ce"></span></button>
        <button class="fillColorOption" data-fill-color="#172554" title="Lacivert"><span class="colorSwatch" style="background:#172554"></span></button>
        <button class="fillColorOption" data-fill-color="#2563eb" title="Mavi"><span class="colorSwatch" style="background:#2563eb"></span></button>
        <button class="fillColorOption" data-fill-color="#16a34a" title="Yeşil"><span class="colorSwatch" style="background:#16a34a"></span></button>
        <button class="fillColorOption active" data-fill-color="#facc15" title="Sarı"><span class="colorSwatch" style="background:#facc15"></span></button>
        <button class="fillColorOption" data-fill-color="#f97316" title="Turuncu"><span class="colorSwatch" style="background:#f97316"></span></button>
        <button class="fillColorOption" data-fill-color="#dc2626" title="Kırmızı"><span class="colorSwatch" style="background:#dc2626"></span></button>
        <button class="fillColorOption" data-fill-color="#ffffff" title="Beyaz"><span class="colorSwatch" style="background:#ffffff;border-color:#667085"></span></button>
        <button class="fillColorOption" data-fill-color="#d1d5db" title="Açık gri"><span class="colorSwatch" style="background:#d1d5db"></span></button>
        <button class="fillColorOption" data-fill-color="#6b7280" title="Orta gri"><span class="colorSwatch" style="background:#6b7280"></span></button>
        <button class="fillColorOption" data-fill-color="#8b5e3c" title="Kahverengi"><span class="colorSwatch" style="background:#8b5e3c"></span></button>
      </div>
    </div>

    <div class="sep"></div>

    <select id="shapeType" title="Şekil" aria-label="Şekil">
      <option value="line">Çizgi</option>
      <option value="rect">Dikdörtgen</option>
      <option value="ellipse">Elips</option>
      <option value="parabola">Parabol</option>
      <option value="sinx">sin x</option>
      <option value="tanx">tan x</option>
      <option value="ex">eˣ</option>
      <option value="x3">x³</option>
      <option value="triangle">Üçgen</option>
      <option value="pentagon">Beşgen</option>
      <option value="hexagon">Altıgen</option>
      <option value="axes">x-y</option>
    </select>

    <button id="addShape" class="iconBtn" title="Ekle" aria-label="Ekle">＋</button>

    <button id="textBtn" class="iconBtn" title="Metin kutusu" aria-label="Metin kutusu">
      <span style="font:600 20px/1 'Comic Neue','Trebuchet MS','Segoe UI','Arial Rounded MT Bold',Arial,'Comic Sans MS',sans-serif">T</span>
    </button>
    <button id="sqrtBtn" class="iconBtn" title="Karekök sembolü" aria-label="Karekök sembolü">
      <svg viewBox="0 0 30 24" aria-hidden="true" style="width:25px;height:22px;display:block">
        <path d="M2.5 13.5 L6.2 13.5 L8.2 20 L11.8 12.5 L15 4.5 L28 4.5"
              fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="integralBtn" class="iconBtn" title="İntegral sembolü" aria-label="İntegral sembolü">
      <svg viewBox="0 0 20 30" aria-hidden="true" style="width:17px;height:25px;display:block">
        <path d="M13.7 2.3
                 C7.8 1.8 7.1 6.0 7.4 10.3
                 C7.7 14.6 11.1 15.5 10.4 20.0
                 C9.8 24.1 8.5 28.0 3.6 27.7"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <button id="imageBtn" class="iconBtn" title="Fotoğraf ekle" aria-label="Fotoğraf ekle">
      <svg viewBox="0 0 24 24" aria-hidden="true">

  const COLLAB_BOARD_ID = 'main';

    (globalThis.crypto && crypto.randomUUID)

      : 'client_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)

  let collabClient = null;

  let collabSendInFlight = false;

  // v16.1 — low-latency Broadcast layer
  let collabLiveSnapshot = new Map();
  let collabLastLiveReceivedAt = 0;
  let collabLocalDirty = false;

  // Local in-progress ink is not yet inside objects[], so it has its own
  // temporary realtime stream.
  let liveInkId = null;
  let liveInkSentIndex = 0;
  let liveInkLastSentAt = 0;

  let selectedIndices = [];
  let nextGroupId = 1;

  let selectStart = null;
  let selectSnapshot = null;
  let groupSnapshots = null;

  let textEditorFinishing = false;

  let erasing = false;
  let eraserKind = 'stroke';
  let eraserRadius = 14;
  let eraserLastPoint = null;
  let eraserCursor = null;
  let eraserChanged = false;

  // Tablet / touch input layer.
  // Mouse and pen keep the existing desktop behavior.
  const activeTouches = new Map();
  let touchGesture = null;
  let touchToolPointerId = null;
  let touchActionObjectsSnapshot = null;
  let touchActionSelectionSnapshot = null;
  let touchActionUndoDepth = 0;
  let suppressTouchUntilAllUp = false;
  let inkPointerId = null;

  let touchLongPressTimer = null;
  let touchLongPressPointerId = null;
  let touchLongPressTriggered = false;
  let touchLongPressStartScreen = null;
  let touchLongPressStartWorld = null;

  let dpr = Math.max(1, window.devicePixelRatio || 1);

  function resize(){
    const r = wrap.getBoundingClientRect();
    canvas.width = Math.round(r.width*dpr);
    canvas.height = Math.round(r.height*dpr);
    canvas.style.width = r.width+'px';
    canvas.style.height = r.height+'px';
    redraw();
    if(textEditing) positionTextEditor();
  }
  window.addEventListener('resize', resize);

  function screenToWorld(p){
    return {
      x:(p.x-viewX)/viewZoom,
      y:(p.y-viewY)/viewZoom
    };
  }

  function worldToScreenPoint(p){
    return {
      x:p.x*viewZoom+viewX,
      y:p.y*viewZoom+viewY
    };
  }

  function screenPointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }

  function pFromEvent(e){
    const s=screenPointFromEvent(e);
    const w=screenToWorld(s);
    return {
      x:w.x,
      y:w.y,
      t:performance.now(),
      pressure:e.pressure||0.5
    };
  }

  function touchMidpoint(a,b){
    return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  }

  function touchDistance(a,b){
    return Math.hypot(b.x-a.x,b.y-a.y);
  }

  function clearTouchLongPress(){
    clearTimeout(touchLongPressTimer);
    touchLongPressTimer=null;
    touchLongPressPointerId=null;
    touchLongPressStartScreen=null;
    touchLongPressStartWorld=null;
  }

  function cancelCurrentTouchToolAction(restoreObjects=true){
    clearTimeout(holdTimer);

    if(drawing && liveInkId){
      collabCancelLiveInk();
    }

    if(restoreObjects && touchActionObjectsSnapshot!==null){
      try{
        objects=JSON.parse(touchActionObjectsSnapshot);
      }catch(_){}
      if(undoStack.length>touchActionUndoDepth){
        undoStack.length=touchActionUndoDepth;
      }
      if(touchActionSelectionSnapshot){
        selectedIndices=touchActionSelectionSnapshot.indices.slice();
        selectedIndex=touchActionSelectionSnapshot.selectedIndex;
        groupSelectionAngle=touchActionSelectionSnapshot.groupSelectionAngle;
        normalizeSelection();
      }
    }

    drawing=false;
    points=[];
    previewRecognized=null;
    lockedShape=null;
    lockedShapeType=null;
    lockAnchor=null;
    rotationCenter=null;
    lockedShapeSnapshot=null;
    transformStartRadius=1;
    lockPointer=null;
    inkPointerId=null;

    erasing=false;
    eraserLastPoint=null;
    eraserChanged=false;

    selectAction=null;
    selectStart=null;
    selectSnapshot=null;
    groupSnapshots=null;
    groupBoxSnapshot=null;
    activeHandle=null;
    marqueeStart=null;
    marqueeEnd=null;

    touchToolPointerId=null;
    touchActionObjectsSnapshot=null;
    touchActionSelectionSnapshot=null;
    touchActionUndoDepth=undoStack.length;
  }

  function beginTwoFingerGesture(){
    clearTouchLongPress();
    touchLongPressTriggered=false;

    // Cancel any one-finger drawing/drag/erase that may have begun
    // before the second finger arrived.
    cancelCurrentTouchToolAction(true);

    const pts=[...activeTouches.values()];
    if(pts.length<2) return;

    const a=pts[0], b=pts[1];
    const mid=touchMidpoint(a,b);
    const dist=Math.max(1,touchDistance(a,b));
    const anchorWorld={
      x:(mid.x-viewX)/viewZoom,
      y:(mid.y-viewY)/viewZoom
    };

    touchGesture={
      startDistance:dist,
      startZoom:viewZoom,
      anchorWorld
    };
    suppressTouchUntilAllUp=false;
    closeContextMenu();
    if(textEditing) closeTextEditor(true);
    statusEl.textContent='İki parmak: kaydır / yakınlaştır';
    redraw();
  }

  function updateTwoFingerGesture(){
    if(!touchGesture || activeTouches.size<2) return;
    const pts=[...activeTouches.values()];
    const a=pts[0], b=pts[1];
    const mid=touchMidpoint(a,b);
    const dist=Math.max(1,touchDistance(a,b));

    const factor=dist/touchGesture.startDistance;
    const nextZoom=Math.max(
      MIN_ZOOM,
      Math.min(MAX_ZOOM,touchGesture.startZoom*factor)
    );

    viewZoom=nextZoom;
    viewX=mid.x-touchGesture.anchorWorld.x*viewZoom;
    viewY=mid.y-touchGesture.anchorWorld.y*viewZoom;

    redraw();
    if(textEditing) positionTextEditor();
  }

  function openTouchContextMenuAt(screenP,worldP){
    const hit=hitTestObjectAny(worldP);
    if(hit<0 || !objects[hit]){
      closeContextMenu();
      return;
    }

    let targets=[];
    if(selectedIndices.includes(hit) && selectedIndices.length){
      // Seçimin içindeki herhangi bir nesneye uzun basılırsa,
      // kilitli olsa bile bağlam menüsü tüm seçime uygulanır.
      targets=selectedIndices.slice();
    }else{
      setSelection([hit]);
      targets=selectedIndices.length ? selectedIndices.slice() : [hit];
    }

    redraw();
    openContextMenu(screenP,targets);
  }

  function armTouchLongPress(e,screenP,worldP){
    clearTouchLongPress();

    const isTouch=e.pointerType==='touch';
    const isPen=e.pointerType==='pen';

    if((!isTouch && !isPen) || mode!=='select') return;
    if(isTouch && activeTouches.size!==1) return;

    touchLongPressPointerId=e.pointerId;
    touchLongPressStartScreen={...screenP};
    touchLongPressStartWorld={x:worldP.x,y:worldP.y};
    touchLongPressTriggered=false;

    touchLongPressTimer=setTimeout(()=>{
      if(
        (isTouch && (activeTouches.size!==1 || !activeTouches.has(e.pointerId))) ||
        touchGesture ||
        suppressTouchUntilAllUp
      ) return;

      touchLongPressTriggered=true;
      cancelCurrentTouchToolAction(true);
      openTouchContextMenuAt(
        touchLongPressStartScreen,
        touchLongPressStartWorld
      );
      statusEl.textContent='Nesne menüsü';
    },620);
  }

  function restoreToolCursor(){
    if(isPanning){
      canvas.style.cursor='grabbing';
    }else if(mode==='ink'){
      canvas.style.cursor='default';
    }else if(mode==='eraser'){
      canvas.style.cursor='none';
    }else if(mode==='text'){
      canvas.style.cursor='text';
    }else{
      canvas.style.cursor='default';
    }
  }


  function collabConfigured(){
    return (
      typeof SUPABASE_URL==='string' &&
      typeof SUPABASE_ANON_KEY==='string' &&
      SUPABASE_URL.startsWith('https://') &&
      !SUPABASE_URL.includes('YOUR_SUPABASE') &&
      SUPABASE_ANON_KEY.length>20 &&
      !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')
    );
  }

  function makeObjectId(){
    return (
      (globalThis.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'obj_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)
    );
  }

  function ensureUniqueObjectIds(){
    const seen=new Set();
    let changed=false;

    for(const o of objects){
      if(!o || typeof o!=='object') continue;
      if(!o.id || typeof o.id!=='string' || seen.has(o.id)){
        o.id=makeObjectId();
        changed=true;
      }
      seen.add(o.id);
    }
    return changed;
  }

  function collabSerializableObjects(){
    ensureUniqueObjectIds();
    return JSON.parse(JSON.stringify(objects));
  }

  function collabSignature(state=objects){
    try{
      return JSON.stringify(state);
    }catch(_){
      return '';
    }
  }

  function collabSetStatus(message){
    if(message) statusEl.textContent=message;
  }


  function collabRebuildLiveSnapshot(){
    const next=new Map();
    ensureUniqueObjectIds();
    for(const o of objects){
      if(!o || !o.id) continue;
      try{
        next.set(o.id,JSON.stringify(o));
      }catch(_){}
    }
    collabLiveSnapshot=next;
  }

  function collabBroadcast(event,payload){
    if(!collabEnabled || !collabChannel) return;
    try{
      collabChannel.send({
        type:'broadcast',
        event,
        payload:{
          clientId:COLLAB_CLIENT_ID,
          ...payload
        }
      });
    }catch(err){
      console.warn('Broadcast gönderilemedi:',err);
    }
  }

  function collabApplyLiveDelta(payload){
    if(!payload || payload.clientId===COLLAB_CLIENT_ID) return;

    const upserts=Array.isArray(payload.upserts) ? payload.upserts : [];
    const deletes=Array.isArray(payload.deletes) ? payload.deletes : [];

    collabApplyingRemote=true;
    try{
      let removedSomething=false;

      if(deletes.length){
        const del=new Set(deletes);
        if(objects.some(o=>o && del.has(o.id))) removedSomething=true;
        objects=objects.filter(o=>o && !del.has(o.id));
      }

      for(const incoming of upserts){
        if(!incoming || !incoming.id) continue;
        const copy=JSON.parse(JSON.stringify(incoming));
        const idx=objects.findIndex(o=>o && o.id===copy.id);
        if(idx>=0) objects[idx]=copy;
        else objects.push(copy);
      }

      if(removedSomething){
        // Index tabanlı seçimlerin kaymasını önle.
        setSelection([]);
      }else{
        normalizeSelection();
      }

      collabLastLiveReceivedAt=Date.now();
      collabRebuildLiveSnapshot();
      redraw();
    }finally{
      collabApplyingRemote=false;
    }
  }

  function collabApplyLiveInk(payload){
    if(!payload || payload.clientId===COLLAB_CLIENT_ID) return;
    const id=payload.id;
    if(!id) return;

    collabLastLiveReceivedAt=Date.now();

    if(payload.action==='start'){
      remoteLiveInk.set(id,{
        id,
        points:Array.isArray(payload.points)
          ? payload.points.map(p=>({x:p.x,y:p.y}))
          : [],
        style:payload.style || {color:'#111827',width:3}
      });
      redraw();
      return;
    }

    if(payload.action==='append'){
      let item=remoteLiveInk.get(id);
      if(!item){
        item={
          id,
          points:[],
          style:payload.style || {color:'#111827',width:3}
        };
        remoteLiveInk.set(id,item);
      }
      if(Array.isArray(payload.points)){
        for(const p of payload.points){
          item.points.push({x:p.x,y:p.y});
        }
      }
      redraw();
      return;
    }

    if(payload.action==='cancel' || payload.action==='end'){
      remoteLiveInk.delete(id);
      redraw();
    }
  }

  function collabApplyLiveCommit(payload){
    if(!payload || payload.clientId===COLLAB_CLIENT_ID) return;
    const incoming=payload.object;
    if(!incoming || !incoming.id) return;

    collabApplyingRemote=true;
    try{
      remoteLiveInk.delete(incoming.id);
      const copy=JSON.parse(JSON.stringify(incoming));
      const idx=objects.findIndex(o=>o && o.id===copy.id);
      if(idx>=0) objects[idx]=copy;
      else objects.push(copy);

      collabLastLiveReceivedAt=Date.now();
      collabRebuildLiveSnapshot();
      normalizeSelection();
      redraw();
    }finally{
      collabApplyingRemote=false;
    }
  }

  function collabApplyBoardReplace(payload){
    if(!payload || payload.clientId===COLLAB_CLIENT_ID) return;
    if(!Array.isArray(payload.objects)) return;

    collabApplyingRemote=true;
    try{
      objects=JSON.parse(JSON.stringify(payload.objects));
      ensureUniqueObjectIds();
      setSelection([]);
      closeContextMenu();
      if(textEditing) closeTextEditor(false);
      remoteLiveInk.clear();

      collabLastLiveReceivedAt=Date.now();
      collabLastSignature=collabSignature(objects);
      collabRebuildLiveSnapshot();
      redraw();
      statusEl.textContent='Ortak tahta başka bir cihazdan geri yüklendi';
    }finally{
      collabApplyingRemote=false;
    }
  }

  function collabBroadcastLiveInk(force=false){
    if(!collabEnabled || !liveInkId || !drawing || !points.length) return;

    const now=performance.now();
    if(!force && now-liveInkLastSentAt<24) return;

    if(liveInkSentIndex===0){
      collabBroadcast('live_ink',{
        action:'start',
        id:liveInkId,
        points:[{x:points[0].x,y:points[0].y}],
        style:strokeStyle()
      });
      liveInkSentIndex=1;
    }

    if(points.length>liveInkSentIndex){
      const chunk=points
        .slice(liveInkSentIndex)
        .map(p=>({x:p.x,y:p.y}));

      collabBroadcast('live_ink',{
        action:'append',
        id:liveInkId,
        points:chunk,
        style:strokeStyle()
      });
      liveInkSentIndex=points.length;
    }

    liveInkLastSentAt=now;
  }

  function collabCancelLiveInk(){
    if(liveInkId){
      collabBroadcast('live_ink',{
        action:'cancel',
        id:liveInkId
      });
    }
    liveInkId=null;
    liveInkSentIndex=0;
    liveInkLastSentAt=0;
  }

  function collabCommitLiveObject(o){
    if(!o) return;
    if(!o.id) o.id=liveInkId || makeObjectId();

    collabBroadcast('live_object_commit',{
      object:JSON.parse(JSON.stringify(o))
    });

    if(liveInkId){
      collabBroadcast('live_ink',{
        action:'end',
        id:liveInkId
      });
    }

    liveInkId=null;
    liveInkSentIndex=0;
    liveInkLastSentAt=0;
  }

  function collabBroadcastDeltaTick(){
    if(!collabEnabled || collabApplyingRemote) return;

    ensureUniqueObjectIds();

    const current=new Map();
    const upserts=[];

    for(const o of objects){
      if(!o || !o.id) continue;

      let serialized='';
      try{
        serialized=JSON.stringify(o);
      }catch(_){
        continue;
      }

      current.set(o.id,serialized);
      if(collabLiveSnapshot.get(o.id)!==serialized){
        upserts.push(JSON.parse(serialized));
      }
    }

    const deletes=[];
    for(const id of collabLiveSnapshot.keys()){
      if(!current.has(id)) deletes.push(id);
    }

    if(!upserts.length && !deletes.length) return;

    collabLiveSnapshot=current;
    collabLocalDirty=true;

    collabBroadcast('live_delta',{upserts,deletes});

    // Broadcast gives fluid motion; database remains the durable checkpoint.
    collabScheduleSend(120);
  }

  async function collabSendBoardNow(){
    if(!collabEnabled || !collabClient || collabApplyingRemote) return;

    if(collabSendInFlight){
      collabSendAgain=true;
      return;
    }

    collabSendInFlight=true;
    collabSendAgain=false;

    try{
      const state=collabSerializableObjects();
      const signature=collabSignature(state);

      const {error}=await collabClient
        .from(COLLAB_TABLE)
        .upsert({
          id:COLLAB_BOARD_ID,
          state,
          updated_at:new Date().toISOString(),
          updated_by:COLLAB_CLIENT_ID
        },{onConflict:'id'});

      if(error) throw error;
      collabLastSignature=signature;
    }catch(err){
      console.error('Realtime gönderim hatası:',err);
      collabSetStatus('Ortak tahta bağlantısında gönderim hatası');
    }finally{
      collabSendInFlight=false;
      if(collabSendAgain){
        collabSendAgain=false;
        setTimeout(collabSendBoardNow,40);
      }
    }
  }

  function collabScheduleSend(delay=80){
    if(!collabEnabled || collabApplyingRemote) return;
    clearTimeout(collabSendTimer);
    collabSendTimer=setTimeout(collabSendBoardNow,delay);
  }

  function collabApplyRemoteState(nextState,updatedBy=''){
    if(!Array.isArray(nextState)) return;
    if(updatedBy===COLLAB_CLIENT_ID) return;

    const incoming=JSON.parse(JSON.stringify(nextState));
    const sig=collabSignature(incoming);
    if(sig===collabLastSignature) return;

    collabApplyingRemote=true;
    try{
      objects=incoming;
      ensureUniqueObjectIds();

      setSelection([]);
      closeContextMenu();
      if(textEditing) closeTextEditor(false);

      collabLastSignature=collabSignature(objects);
      collabRebuildLiveSnapshot();
      redraw();
    }finally{
      collabApplyingRemote=false;
    }
  }

  async function initCollaboration(){
    ensureUniqueObjectIds();
    collabLastSignature=collabSignature(objects);

    if(!collabConfigured()){
      console.info('Ortak tahta altyapısı hazır; Supabase URL ve anon key bekleniyor.');
      collabSetStatus('Yerel mod — ortak tahta için Supabase ayarı gerekiyor');
      return;
    }

    if(!window.supabase || !window.supabase.createClient){
      collabSetStatus('Supabase kütüphanesi yüklenemedi');
      return;
    }

    try{
      collabClient=window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth:{persistSession:false,autoRefreshToken:false},
          realtime:{params:{eventsPerSecond:20}}
        }
      );

      // Önce ortak tahtanın mevcut halini yükle.
      const {data,error}=await collabClient
        .from(COLLAB_TABLE)
        .select('id,state,updated_at,updated_by')
        .eq('id',COLLAB_BOARD_ID)
        .maybeSingle();

      if(error) throw error;

      if(data && Array.isArray(data.state)){
        collabApplyRemoteState(data.state,data.updated_by||'');
      }else{
        const initialState=collabSerializableObjects();
        const {error:insertError}=await collabClient
          .from(COLLAB_TABLE)
          .upsert({
            id:COLLAB_BOARD_ID,
            state:initialState,
            updated_at:new Date().toISOString(),
            updated_by:COLLAB_CLIENT_ID
          },{onConflict:'id'});

        if(insertError) throw insertError;
        collabLastSignature=collabSignature(initialState);
      }

      collabChannel=collabClient
        .channel(
          'whiteboard:'+COLLAB_BOARD_ID,
          {config:{broadcast:{self:false,ack:false}}}
        )
        .on(
          'broadcast',
          {event:'live_delta'},
          ({payload})=>collabApplyLiveDelta(payload)
        )
        .on(
          'broadcast',
          {event:'live_ink'},
          ({payload})=>collabApplyLiveInk(payload)
        )
        .on(
          'broadcast',
          {event:'live_object_commit'},
          ({payload})=>collabApplyLiveCommit(payload)
        )
        .on(
          'broadcast',
          {event:'board_replace'},
          ({payload})=>collabApplyBoardReplace(payload)
        )
        .on(
          'postgres_changes',
          {
            event:'*',
            schema:'public',
            table:COLLAB_TABLE,
            filter:'id=eq.'+COLLAB_BOARD_ID
          },
          payload=>{
            const row=payload.new;
            if(!row || !Array.isArray(row.state)) return;
            if((row.updated_by||'')===COLLAB_CLIENT_ID) return;

            // Broadcast normalde bu değişikliği daha önce getirmiş olur.
            // PostgreSQL olayı yalnızca kaçırılmış mesajlar için fallback'tir.
            if(Date.now()-collabLastLiveReceivedAt<900) return;
            if(drawing || erasing || selectAction) return;

            collabApplyRemoteState(row.state,row.updated_by||'');
          }
        )
        .subscribe(status=>{
          if(status==='SUBSCRIBED'){
            collabEnabled=true;
            collabLastSignature=collabSignature(objects);
            collabRebuildLiveSnapshot();
            collabSetStatus('Ortak tahta bağlı — canlı senkronizasyon');
          }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
            collabSetStatus('Ortak tahta bağlantı hatası');
          }
        });

      // Nesne hareketlerini ~30 FPS Broadcast ile aktar.
      setInterval(collabBroadcastDeltaTick,33);

    }catch(err){
      console.error('Ortak tahta başlatılamadı:',err);
      collabEnabled=false;
      collabSetStatus('Yerel mod — ortak tahta bağlantısı kurulamadı');
    }
  }

  function saveState(){
    undoStack.push(JSON.stringify(objects));
    if(undoStack.length>60) undoStack.shift();
    redoStack = [];
  }

  function strokeStyle(){
    return {color:currentColor,width:+widthEl.value};
  }

  function drawSmoothStroke(pts, style){
    if(pts.length<2) return;
    ctx.save();
    ctx.strokeStyle = style.color;
    ctx.lineWidth = style.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i].x+pts[i+1].x)/2;
      const my=(pts[i].y+pts[i+1].y)/2;
      ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
    }
    const last=pts[pts.length-1];
    ctx.lineTo(last.x,last.y);
    ctx.stroke();
    ctx.restore();
  }

  function rotatePoint(p,c,a){
    const cs=Math.cos(a), sn=Math.sin(a);
    const dx=p.x-c.x, dy=p.y-c.y;
    return {x:c.x+dx*cs-dy*sn,y:c.y+dx*sn+dy*cs};
  }

  function regularPolygon(cx,cy,rx,ry,n,rot=0){
    const verts=[];
    if(!Number.isFinite(cx) || !Number.isFinite(cy) ||
       !Number.isFinite(rx) || !Number.isFinite(ry) ||
       !Number.isFinite(n) || n<3){
      return verts;
    }
    for(let i=0;i<n;i++){
      const a=rot+i*Math.PI*2/n;
      verts.push({
        x:cx+Math.cos(a)*rx,
        y:cy+Math.sin(a)*ry
      });
    }
    return verts;
  }

  function finitePoint(p){
    return p && Number.isFinite(p.x) && Number.isFinite(p.y);
  }

  function symbolLocalControlPoints(o){
    if(!o || o.kind!=='symbol') return null;
    const sy=o.mirrorY ? -1 : 1;

    if(o.symbolType==='sqrt'){
      const radicalW=Math.max(24,Number(o.radicalW)||90);
      const roofLen=Math.max(18,Number(o.roofLen)||110);
      const height=Math.max(24,Number(o.height)||72);
      const legDepth=Math.max(8,Number(o.legDepth)||34);
      const startOffset=Number.isFinite(o.startOffset) ? o.startOffset : 0.10*height;
      const topY=-height/2;
      return {
        roof:{x:roofLen,y:topY*sy},
        leg:{x:-radicalW*0.34,y:legDepth*sy},
        start:{x:-radicalW*0.58,y:startOffset*sy}
      };
    }

    return null;
  }

  function symbolLocalPoints(o){
    if(!o || o.kind!=='symbol') return [];
    const sy=o.mirrorY ? -1 : 1;

    if(o.symbolType==='sqrt'){
      const radicalW=Math.max(24,Number(o.radicalW)||90);
      const roofLen=Math.max(18,Number(o.roofLen)||110);
      const height=Math.max(24,Number(o.height)||72);
      const legDepth=Math.max(8,Number(o.legDepth)||34);
      const startOffset=Number.isFinite(o.startOffset) ? o.startOffset : 0.10*height;
      const topY=-height/2;
      return [
        {x:-radicalW*0.58,y:startOffset*sy},
        {x:-radicalW*0.42,y:startOffset*sy},
        {x:-radicalW*0.34,y:legDepth*sy},
        {x:0,y:topY*sy},
        {x:roofLen,y:topY*sy}
      ];
    }

    if(o.symbolType==='integral'){
      const w=Math.max(14,Number(o.w)||50);
      const h=Math.max(36,Number(o.h)||130);
      const pts=[];

      const bez=(p0,p1,p2,p3,t)=>{
        const u=1-t;
        return {
          x:u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
          y:u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
        };
      };

      const top={x: 0.30*w,y:-0.50*h*sy};
      const mid={x: 0.00*w,y: 0.00*h*sy};
      const bot={x:-0.30*w,y: 0.50*h*sy};

      const c1={x:-0.14*w,y:-0.52*h*sy};
      const c2={x:-0.11*w,y:-0.14*h*sy};
      const c3={x: 0.11*w,y: 0.14*h*sy};
      const c4={x: 0.14*w,y: 0.52*h*sy};

      const n=44;
      for(let i=0;i<=n;i++) pts.push(bez(top,c1,c2,mid,i/n));
      for(let i=1;i<=n;i++) pts.push(bez(mid,c3,c4,bot,i/n));
      return pts;
    }

    return [];
  }

  function symbolWorldPoints(o){
    const pts=symbolLocalPoints(o);
    const a=o.angle||0;
    return pts.map(lp=>rotatePoint({x:o.center.x+lp.x,y:o.center.y+lp.y},o.center,a));
  }

  function symbolWorldHandles(o){
    if(!o || o.kind!=='symbol') return [];
    const cp=symbolLocalControlPoints(o);
    if(!cp) return [];
    const a=o.angle||0;
    const out=[];
    if(cp.roof){
      const p=rotatePoint({x:o.center.x+cp.roof.x,y:o.center.y+cp.roof.y},o.center,a);
      out.push({name:'sqrt-roof',x:p.x,y:p.y});
    }
    if(cp.leg){
      const p=rotatePoint({x:o.center.x+cp.leg.x,y:o.center.y+cp.leg.y},o.center,a);
      out.push({name:'sqrt-leg',x:p.x,y:p.y});
    }
    if(cp.start){
      const p=rotatePoint({x:o.center.x+cp.start.x,y:o.center.y+cp.start.y},o.center,a);
      out.push({name:'sqrt-start',x:p.x,y:p.y});
    }
    return out;
  }

  function makeSqrtSymbol(cx,cy,scale,style){
    return {
      kind:'symbol',
      symbolType:'sqrt',
      center:{x:cx,y:cy},
      radicalW:48*scale,
      roofLen:66*scale,
      height:39*scale,
      legDepth:19*scale,
      startOffset:0.10*39*scale,
      angle:0,
      mirrorY:false,
      style:{...style},
      source:'menu',
      shapeName:'sqrt',
      boxAngle:0
    };
  }

  function makeIntegralSymbol(cx,cy,scale,style){
    return {
      kind:'symbol',
      symbolType:'integral',
      center:{x:cx,y:cy},
      w:25*scale,
      h:72.5*scale,
      angle:0,
      mirrorY:false,
      style:{...style},
      source:'menu',
      shapeName:'integral',
      boxAngle:0
    };
  }

  function textFontFamily(){
    return '"Comic Neue","Trebuchet MS","Segoe UI","Arial Rounded MT Bold","Arial","Comic Sans MS",sans-serif';
  }

  function layoutTextLines(text,maxWidth,fontSize){
    const raw=String(text??'').replace(/\r/g,'').split('\n');
    const lines=[];
    ctx.save();
    ctx.font=`${fontSize}px ${textFontFamily()}`;

    for(const paragraph of raw){
      if(paragraph===''){
        lines.push('');
        continue;
      }

      const words=paragraph.split(/(\s+)/).filter(Boolean);
      let line='';

      for(const word of words){
        const candidate=line+word;
        if(line && ctx.measureText(candidate).width>maxWidth){
          lines.push(line.trimEnd());
          line=word.trimStart();

          // Break a single very long token if necessary.
          if(ctx.measureText(line).width>maxWidth){
            let chunk='';
            for(const ch of line){
              const c=chunk+ch;
              if(chunk && ctx.measureText(c).width>maxWidth){
                lines.push(chunk);
                chunk=ch;
              }else{
                chunk=c;
              }
            }
            line=chunk;
          }
        }else{
          line=candidate;
        }
      }
      lines.push(line.trimEnd());
    }

    ctx.restore();
    return lines.length ? lines : [''];
  }

  function drawTextObject(o){
    if(!o || !o.center) return;
    const fontSize=Math.max(4,Number(o.fontSize)||24);
    const w=Math.max(12,Number(o.w)||120);
    const h=Math.max(12,Number(o.h)||40);
    const pad=Math.max(2,fontSize*.18);
    const lineHeight=fontSize*1.25;
    const lines=layoutTextLines(o.text||'',Math.max(4,w-2*pad),fontSize);

    ctx.save();
    ctx.translate(o.center.x,o.center.y);
    ctx.rotate(o.angle||0);
    ctx.beginPath();
    ctx.rect(-w/2,-h/2,w,h);
    ctx.clip();

    ctx.fillStyle=(o.style && o.style.color) || '#111111';
    ctx.font=`${fontSize}px ${textFontFamily()}`;
    ctx.textBaseline='top';
    ctx.textAlign='left';

    let y=-h/2+pad;
    for(const line of lines){
      if(y+lineHeight>h/2+lineHeight*.15) break;
      ctx.fillText(line,-w/2+pad,y);
      y+=lineHeight;
    }
    ctx.restore();
  }

  function drawShape(o, ghost=false){
    if(!o || !o.kind || !o.style) return;

    ctx.save();
    try{
      ctx.strokeStyle = ghost ? '#2563eb' : (o.style.color || '#111111');
      ctx.lineWidth = ghost ? Math.max(2,Number(o.style.width)||2) : (Number(o.style.width)||2);
      ctx.lineCap='round';
      ctx.lineJoin='round';
      if(ghost){ctx.setLineDash([6,5]);ctx.globalAlpha=.88}

      ctx.beginPath();

      if(o.kind==='symbol'){
        const pts=symbolWorldPoints(o);
        if(!pts.length || !pts.every(finitePoint)) return;
        pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));

      }else if(o.kind==='line'){
        if(!finitePoint(o.a) || !finitePoint(o.b)) return;
        ctx.moveTo(o.a.x,o.a.y);
        ctx.lineTo(o.b.x,o.b.y);

      }else if(o.kind==='ellipse'){
        if(!finitePoint(o.center)) return;
        const rx=Math.abs(Number(o.rx)), ry=Math.abs(Number(o.ry));
        if(!Number.isFinite(rx)||!Number.isFinite(ry)||rx<1||ry<1) return;
        ctx.ellipse(o.center.x,o.center.y,rx,ry,Number(o.angle)||0,0,Math.PI*2);

      }else if(o.kind==='rect'){
        if(!finitePoint(o.center)) return;
        const w=Math.abs(Number(o.w)), h=Math.abs(Number(o.h));
        if(!Number.isFinite(w)||!Number.isFinite(h)||w<1||h<1) return;
        const hw=w/2,hh=h/2,a=Number(o.angle)||0;
        const verts=[
          {x:o.center.x-hw,y:o.center.y-hh},
          {x:o.center.x+hw,y:o.center.y-hh},
          {x:o.center.x+hw,y:o.center.y+hh},
          {x:o.center.x-hw,y:o.center.y+hh}
        ].map(p=>rotatePoint(p,o.center,a));
        if(!verts.every(finitePoint)) return;
        verts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
        ctx.closePath();

      }else if(o.kind==='parabola'){
        if(!finitePoint(o.center)) return;
        const w=Math.max(1,Math.abs(Number(o.w)||1));
        const h=Math.max(1,Math.abs(Number(o.h)||1));
        const a=Number(o.angle)||0;

        const n=64;
        for(let i=0;i<=n;i++){
          const u=-1 + 2*i/n;
          // Finite upward-opening parabola segment:
          // vertex at local y=+h/2, endpoints at local y=-h/2.
          const sy=o.mirrorY ? -1 : 1;
          const local={
            x:o.center.x + u*(w/2),
            y:o.center.y + sy*(h/2 - (u*u)*h)
          };
          const q=rotatePoint(local,o.center,a);
          if(i===0) ctx.moveTo(q.x,q.y);
          else ctx.lineTo(q.x,q.y);
        }

      }else if(o.kind==='polygon'){
        if(!finitePoint(o.center)) return;
        let verts=null;
        if(Array.isArray(o.baseVertices) && o.baseVertices.length>=3){
          const a=Number(o.angle)||0;
          verts=o.baseVertices.map(p=>rotatePoint(p,o.center,a));
        }else if(Array.isArray(o.vertices) && o.vertices.length>=3){
          verts=o.vertices;
        }
        if(!verts || !verts.every(finitePoint)) return;
        verts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
        ctx.closePath();

      }else if(o.kind==='axes'){
        if(!finitePoint(o.center)) return;
        const w=Math.abs(Number(o.w)), h=Math.abs(Number(o.h));
        if(!Number.isFinite(w)||!Number.isFinite(h)||w<1||h<1) return;

        const a=Number(o.angle)||0;
        const hw=w/2, hh=h/2;
        const sy=o.mirrorY ? -1 : 1;
        const left=rotatePoint({x:o.center.x-hw,y:o.center.y},o.center,a);
        const right=rotatePoint({x:o.center.x+hw,y:o.center.y},o.center,a);
        const top=rotatePoint({x:o.center.x,y:o.center.y-sy*hh},o.center,a);
        const bottom=rotatePoint({x:o.center.x,y:o.center.y+sy*hh},o.center,a);

        // x axis
        ctx.moveTo(left.x,left.y);
        ctx.lineTo(right.x,right.y);

        // y axis
        ctx.moveTo(bottom.x,bottom.y);
        ctx.lineTo(top.x,top.y);

        // arrow heads
        const ah=10;
        function addArrow(tip,from){
          const ang=Math.atan2(tip.y-from.y,tip.x-from.x);
          ctx.moveTo(tip.x,tip.y);
          ctx.lineTo(tip.x+Math.cos(ang+2.6)*ah,tip.y+Math.sin(ang+2.6)*ah);
          ctx.moveTo(tip.x,tip.y);
          ctx.lineTo(tip.x+Math.cos(ang-2.6)*ah,tip.y+Math.sin(ang-2.6)*ah);
        }
        addArrow(right,left);
        addArrow(top,bottom);

      }else{
        return;
      }

      if(!ghost && o.fillColor && (o.kind==='ellipse' || o.kind==='rect' || o.kind==='polygon')){
        ctx.save();
        ctx.fillStyle=o.fillColor;
        ctx.fill();
        ctx.restore();
      }

      ctx.stroke();

      if(o.kind==='axes'){
        const a=Number(o.angle)||0;
        const sy=o.mirrorY ? -1 : 1;
        const right=rotatePoint({x:o.center.x+o.w/2,y:o.center.y},o.center,a);
        const top=rotatePoint({x:o.center.x,y:o.center.y-sy*o.h/2},o.center,a);
        ctx.fillStyle = ghost ? '#2563eb' : (o.style.color || '#111111');
        ctx.font='14px Arial, sans-serif';
        ctx.fillText('x',right.x+7,right.y+4);
        ctx.fillText('y',top.x+5,top.y-7);
      }
    }catch(err){
      console.warn('Geçersiz şekil adayı atlandı:',err,o);
    }finally{
      ctx.restore();
    }
  }

  function getCachedImage(src){
    if(!src) return null;
    let img=imageCache.get(src);
    if(img) return img;

    img=new Image();
    img.onload=()=>redraw();
    img.onerror=()=>redraw();
    img.src=src;
    imageCache.set(src,img);
    return img;
  }

  function drawImageObject(o){
    if(!o || !o.src || !o.center) return;
    const img=getCachedImage(o.src);

    ctx.save();
    ctx.translate(o.center.x,o.center.y);
    ctx.rotate(o.angle||0);
    if(o.mirrorY) ctx.scale(1,-1);

    if(img && img.complete && img.naturalWidth){
      ctx.drawImage(img,-o.w/2,-o.h/2,o.w,o.h);
    }else{
      ctx.fillStyle='#f3f4f6';
      ctx.strokeStyle='#9ca3af';
      ctx.lineWidth=1/viewZoom;
      ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
      ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
    }
    ctx.restore();
  }

  function addImageDataURL(src,naturalW,naturalH){
    if(!src) return;

    const r=canvas.getBoundingClientRect();
    const c=screenToWorld({x:r.width/2,y:r.height/2});

    const nw=Math.max(1,naturalW||800);
    const nh=Math.max(1,naturalH||600);
    const fit=Math.min(1,420/nw,320/nh);
    const screenW=nw*fit;
    const screenH=nh*fit;

    saveState();
    const index=objects.length;
    objects.push({
      kind:'image',
      center:{x:c.x,y:c.y},
      w:screenW/viewZoom,
      h:screenH/viewZoom,
      angle:0,
      src,
      locked:false,
      source:'image',
      boxAngle:0
    });

    mode='select';
    fillBtn.classList.remove('active');
    closeFillMenu();
    inkBtn.classList.remove('active');
    eraserBtn.classList.remove('active');
    selectBtn.classList.add('active');
    setSelection([index]);
    restoreToolCursor();
    redraw();
    statusEl.textContent='Fotoğraf eklendi';
  }

  function loadImageFile(file){
    if(!file || !file.type || !file.type.startsWith('image/')) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const src=String(reader.result||'');
      const img=new Image();
      img.onload=()=>addImageDataURL(src,img.naturalWidth,img.naturalHeight);
      img.src=src;
    };
    reader.readAsDataURL(file);
  }

  function objectBounds(o){
    if(!o) return null;

    if(o.kind==='text'){
      const hw=Math.max(6,(Number(o.w)||12)/2);
      const hh=Math.max(6,(Number(o.h)||12)/2);
      const a=o.angle||0;
      const pts=[
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
      return bbox(pts);
    }

    if(o.kind==='symbol'){
      const pts=symbolWorldPoints(o);
      return pts.length ? bbox(pts) : null;
    }

    if(o.kind==='image'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      const pts=[
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
      return bbox(pts);
    }

    if(o.kind==='line'){
      const minX=Math.min(o.a.x,o.b.x), maxX=Math.max(o.a.x,o.b.x);
      const minY=Math.min(o.a.y,o.b.y), maxY=Math.max(o.a.y,o.b.y);
      return {x:minX,y:minY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
    }

    if(o.kind==='ellipse'){
      const a=o.angle||0, rx=o.rx, ry=o.ry;
      const ex=Math.sqrt((rx*Math.cos(a))**2+(ry*Math.sin(a))**2);
      const ey=Math.sqrt((rx*Math.sin(a))**2+(ry*Math.cos(a))**2);
      return {x:o.center.x-ex,y:o.center.y-ey,w:2*ex,h:2*ey,cx:o.center.x,cy:o.center.y};
    }

    if(o.kind==='rect'){
      return bbox(rectWorldVertices(o));
    }

    if(o.kind==='polygon'){
      const pts=polygonWorldVertices(o);
      return pts.length ? bbox(pts) : null;
    }

    if(o.kind==='parabola'){
      const pts=[],a=o.angle||0;
      for(let i=0;i<=48;i++){
        const u=-1+2*i/48;
        const q={
          x:o.center.x+u*(o.w/2),
          y:o.center.y+(o.mirrorY?-1:1)*(o.h/2-(u*u)*o.h)
        };
        pts.push(rotatePoint(q,o.center,a));
      }
      return bbox(pts);
    }

    if(o.kind==='axes'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      const pts=[
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
      return bbox(pts);
    }

    if(o.kind==='stroke') return bbox(o.points||[]);
    return null;
  }

  function polygonWorldVertices(o){
    if(!o || o.kind!=='polygon') return [];
    const source=o.baseVertices || o.vertices || [];
    if(!source.length) return [];
    if(o.baseVertices && o.center){
      return source.map(p=>rotatePoint(p,o.center,o.angle||0));
    }
    return source.map(p=>({x:p.x,y:p.y}));
  }


  function rectWorldVertices(o){
    if(!o || o.kind!=='rect' || !o.center) return [];
    const hw=o.w/2, hh=o.h/2, a=o.angle||0;
    return [
      {x:o.center.x-hw,y:o.center.y-hh},
      {x:o.center.x+hw,y:o.center.y-hh},
      {x:o.center.x+hw,y:o.center.y+hh},
      {x:o.center.x-hw,y:o.center.y+hh}
    ].map(p=>rotatePoint(p,o.center,a));
  }

  function ellipseWorldHandles(o){
    if(!o || o.kind!=='ellipse' || !o.center) return [];
    const a=o.angle||0;
    const raw=[
      {name:'ellipse-e',x:o.center.x+o.rx,y:o.center.y},
      {name:'ellipse-s',x:o.center.x,y:o.center.y+o.ry},
      {name:'ellipse-w',x:o.center.x-o.rx,y:o.center.y},
      {name:'ellipse-n',x:o.center.x,y:o.center.y-o.ry}
    ];
    return raw.map(h=>({...h,...rotatePoint(h,o.center,a)}));
  }

  function menuEditHandles(o){
    if(!o || o.source!=='menu') return [];

    if(o.kind==='line'){
      return [
        {name:'endpoint-0',x:o.a.x,y:o.a.y},
        {name:'endpoint-1',x:o.b.x,y:o.b.y}
      ];
    }

    if(o.kind==='polygon'){
      return polygonWorldVertices(o).map((p,i)=>({
        name:'vertex-'+i,x:p.x,y:p.y
      }));
    }

    if(o.kind==='rect'){
      return rectWorldVertices(o).map((p,i)=>({
        name:'rectvertex-'+i,x:p.x,y:p.y
      }));
    }

    if(o.kind==='ellipse'){
      return ellipseWorldHandles(o);
    }

    if(o.kind==='symbol'){
      return symbolWorldHandles(o);
    }

    return [];
  }


  function objectRotation(o){
    if(!o) return 0;
    if(o.kind==='ellipse' || o.kind==='rect' || o.kind==='polygon' || o.kind==='parabola' || o.kind==='axes' || o.kind==='image' || o.kind==='symbol') return o.angle||0;
    if(o.kind==='line'){
      return Math.atan2(o.b.y-o.a.y,o.b.x-o.a.x);
    }
    return 0;
  }

  function selectionSamplePoints(o){
    if(!o) return [];

    if(o.kind==='line') return [{...o.a},{...o.b}];
    if(o.kind==='stroke') return (o.points||[]).map(p=>({x:p.x,y:p.y}));
    if(o.kind==='symbol') return symbolWorldPoints(o);

    if(o.kind==='text' || o.kind==='image'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      return [
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
    }

    if(o.kind==='rect') return rectWorldVertices(o);
    if(o.kind==='polygon') return polygonWorldVertices(o);

    if(o.kind==='ellipse'){
      const pts=[],a=o.angle||0;
      for(let i=0;i<32;i++){
        const t=i*Math.PI*2/32;
        const q={x:o.center.x+Math.cos(t)*o.rx,y:o.center.y+Math.sin(t)*o.ry};
        pts.push(rotatePoint(q,o.center,a));
      }
      return pts;
    }

    if(o.kind==='parabola'){
      const pts=[],a=o.angle||0;
      for(let i=0;i<=48;i++){
        const u=-1+2*i/48;
        const q={
          x:o.center.x+u*(o.w/2),
          y:o.center.y+(o.mirrorY?-1:1)*(o.h/2-(u*u)*o.h)
        };
        pts.push(rotatePoint(q,o.center,a));
      }
      return pts;
    }

    if(o.kind==='axes'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      return [
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
    }

    return [];
  }

  function orientedSelectionBox(o){
    if(!o) return null;

    // New objects start with boxAngle = 0, so their first bounding box is
    // horizontal/vertical. Explicit rotation increments boxAngle, so the box
    // then rotates together with the object.
    const angle=Number.isFinite(o.boxAngle) ? o.boxAngle : 0;
    const pts=selectionSamplePoints(o);
    if(!pts.length) return null;

    const worldB=bbox(pts);
    const c0={x:worldB.cx,y:worldB.cy};
    const cs=Math.cos(-angle), sn=Math.sin(-angle);

    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of pts){
      const dx=p.x-c0.x,dy=p.y-c0.y;
      const x=dx*cs-dy*sn;
      const y=dx*sn+dy*cs;
      minX=Math.min(minX,x); maxX=Math.max(maxX,x);
      minY=Math.min(minY,y); maxY=Math.max(maxY,y);
    }

    const offX=(minX+maxX)/2;
    const offY=(minY+maxY)/2;
    const ca=Math.cos(angle),sa=Math.sin(angle);
    const center={
      x:c0.x+offX*ca-offY*sa,
      y:c0.y+offX*sa+offY*ca
    };

    const w=Math.max(1,maxX-minX);
    const h=Math.max(1,maxY-minY);

    return {
      center,
      angle,
      minX:-w/2,maxX:w/2,
      minY:-h/2,maxY:h/2,
      w,h
    };
  }

  function localToWorld(box,p){
    const cs=Math.cos(box.angle),sn=Math.sin(box.angle);
    return {
      x:box.center.x + p.x*cs - p.y*sn,
      y:box.center.y + p.x*sn + p.y*cs
    };
  }

  function worldToLocal(box,p){
    const dx=p.x-box.center.x,dy=p.y-box.center.y;
    const cs=Math.cos(-box.angle),sn=Math.sin(-box.angle);
    return {
      x:dx*cs-dy*sn,
      y:dx*sn+dy*cs
    };
  }

  function orientedBoxCorners(box,pad=8){
    if(!box) return null;
    const minX=box.minX-pad,maxX=box.maxX+pad;
    const minY=box.minY-pad,maxY=box.maxY+pad;
    return {
      nw:localToWorld(box,{x:minX,y:minY}),
      ne:localToWorld(box,{x:maxX,y:minY}),
      se:localToWorld(box,{x:maxX,y:maxY}),
      sw:localToWorld(box,{x:minX,y:maxY}),
      topCenter:localToWorld(box,{x:(minX+maxX)/2,y:minY}),
      rotate:localToWorld(box,{x:(minX+maxX)/2,y:minY-28}),
      local:{minX,maxX,minY,maxY}
    };
  }


  function normalizeSelection(){
    selectedIndices = selectedIndices
      .filter(i=>Number.isInteger(i) && i>=0 && i<objects.length)
      .filter(i=>objects[i])
      .filter((v,i,a)=>a.indexOf(v)===i);

    if(selectedIndices.length===1){
      selectedIndex=selectedIndices[0];
    }else if(selectedIndices.length===0){
      selectedIndex=-1;
    }else{
      selectedIndex=-1;
    }
  }

  function makeGroupId(){
    return 'group-' + (nextGroupId++);
  }

  function indicesForGroupId(groupId){
    if(!groupId) return [];
    const out=[];
    for(let i=0;i<objects.length;i++){
      if(objects[i] && objects[i].groupId===groupId) out.push(i);
    }
    return out;
  }

  function expandGroupedIndices(indices){
    const out=new Set();
    for(const i of (indices||[])){
      if(!Number.isInteger(i) || i<0 || i>=objects.length || !objects[i]) continue;
      const gid=objects[i].groupId;
      if(gid){
        for(const gi of indicesForGroupId(gid)) out.add(gi);
      }else{
        out.add(i);
      }
    }
    return [...out].sort((a,b)=>a-b);
  }

  function setSelection(indices){
    selectedIndices=expandGroupedIndices(indices||[]);
    groupSelectionAngle=0;
    normalizeSelection();
  }

  function groupSelectionBounds(indices=selectedIndices){
    if(!indices.length) return null;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    let any=false;
    for(const i of indices){
      const b=objectBounds(objects[i]);
      if(!b) continue;
      minX=Math.min(minX,b.x);
      minY=Math.min(minY,b.y);
      maxX=Math.max(maxX,b.x+b.w);
      maxY=Math.max(maxY,b.y+b.h);
      any=true;
    }
    if(!any) return null;
    return {x:minX,y:minY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
  }


  function objectSamplePointsForGroup(o){
    if(!o) return [];

    if(o.kind==='stroke') return (o.points||[]).map(p=>({x:p.x,y:p.y}));
    if(o.kind==='line') return [{...o.a},{...o.b}];

    if(o.kind==='image'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      return [
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
    }

    if(o.kind==='rect'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      return [
        {x:o.center.x-hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y-hh},
        {x:o.center.x+hw,y:o.center.y+hh},
        {x:o.center.x-hw,y:o.center.y+hh}
      ].map(p=>rotatePoint(p,o.center,a));
    }

    if(o.kind==='polygon') return polygonWorldVertices(o);

    if(o.kind==='ellipse'){
      const pts=[],a=o.angle||0;
      for(let i=0;i<20;i++){
        const t=i*Math.PI*2/20;
        const q={x:o.center.x+Math.cos(t)*o.rx,y:o.center.y+Math.sin(t)*o.ry};
        pts.push(rotatePoint(q,o.center,a));
      }
      return pts;
    }

    if(o.kind==='axes'){
      const hw=o.w/2,hh=o.h/2,a=o.angle||0;
      return [
        rotatePoint({x:o.center.x-hw,y:o.center.y},o.center,a),
        rotatePoint({x:o.center.x+hw,y:o.center.y},o.center,a),
        rotatePoint({x:o.center.x,y:o.center.y-hh},o.center,a),
        rotatePoint({x:o.center.x,y:o.center.y+hh},o.center,a)
      ];
    }

    const b=objectBounds(o);
    return b ? [
      {x:b.x,y:b.y},
      {x:b.x+b.w,y:b.y},
      {x:b.x+b.w,y:b.y+b.h},
      {x:b.x,y:b.y+b.h}
    ] : [];
  }

  function groupOrientedBox(indices=selectedIndices){
    const pts=[];
    for(const i of indices){
      if(objects[i]) pts.push(...selectionSamplePoints(objects[i]));
    }
    if(!pts.length) return null;

    const angle=Number.isFinite(groupSelectionAngle) ? groupSelectionAngle : 0;
    const wb=bbox(pts);
    const c0={x:wb.cx,y:wb.cy};
    const cs=Math.cos(-angle),sn=Math.sin(-angle);

    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of pts){
      const dx=p.x-c0.x,dy=p.y-c0.y;
      const x=dx*cs-dy*sn;
      const y=dx*sn+dy*cs;
      minX=Math.min(minX,x); maxX=Math.max(maxX,x);
      minY=Math.min(minY,y); maxY=Math.max(maxY,y);
    }

    const offX=(minX+maxX)/2,offY=(minY+maxY)/2;
    const ca=Math.cos(angle),sa=Math.sin(angle);
    const center={
      x:c0.x+offX*ca-offY*sa,
      y:c0.y+offX*sa+offY*ca
    };

    const w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY);
    return {
      center,angle,
      minX:-w/2,maxX:w/2,
      minY:-h/2,maxY:h/2,
      w,h
    };
  }

  function hitGroupSelectionHandle(p,pointerType='mouse'){
    if(selectedIndices.length<2) return null;
    if(selectedIndices.some(i=>objects[i] && objects[i].locked)) return null;
    const box=groupOrientedBox();
    if(!box) return null;
    const oc=orientedBoxCorners(box,8/viewZoom);

    const hitR=(pointerType==='touch' ? 22 : 11)/viewZoom;
    for(const [name,h] of [['nw',oc.nw],['ne',oc.ne],['se',oc.se],['sw',oc.sw]]){
      if(Math.hypot(p.x-h.x,p.y-h.y)<=hitR) return name;
    }
    if(Math.hypot(p.x-oc.rotate.x,p.y-oc.rotate.y)<=hitR) return 'rotate';
    return null;
  }

  function rotateObjectAround(o,c,delta){
    if(o.kind==='line'){
      o.a=rotatePoint(o.a,c,delta);
      o.b=rotatePoint(o.b,c,delta);
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;
      return;
    }

    if(o.kind==='stroke'){
      o.points=o.points.map(p=>rotatePoint(p,c,delta));
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;
      return;
    }

    if(o.kind==='polygon'){
      o.center=rotatePoint(o.center,c,delta);
      if(o.baseVertices){
        o.baseVertices=o.baseVertices.map(p=>rotatePoint(p,c,delta));
      }
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;
      return;
    }

    if(o.kind==='rect' || o.kind==='ellipse' || o.kind==='parabola' || o.kind==='axes' || o.kind==='image' || o.kind==='text' || o.kind==='symbol'){
      o.center=rotatePoint(o.center,c,delta);
      o.angle=(o.angle||0)+delta;
      o.boxAngle=(Number.isFinite(o.boxAngle) ? o.boxAngle : 0)+delta;
    }
  }

  function scaleObjectUniformAround(o,anchor,s){
    s=Math.max(.06,s);

    const scalePt=p=>({
      x:anchor.x+(p.x-anchor.x)*s,
      y:anchor.y+(p.y-anchor.y)*s
    });

    if(o.kind==='line'){
      o.a=scalePt(o.a); o.b=scalePt(o.b);
      return;
    }

    if(o.kind==='stroke'){
      o.points=o.points.map(scalePt);
      return;
    }

    if(o.kind==='polygon'){
      o.center=scalePt(o.center);
      if(o.baseVertices) o.baseVertices=o.baseVertices.map(scalePt);
      return;
    }

    if(o.kind==='rect'){
      o.center=scalePt(o.center);
      o.w=Math.max(12,o.w*s);
      o.h=Math.max(12,o.h*s);
      return;
    }

    if(o.kind==='ellipse'){
      o.center=scalePt(o.center);
      o.rx=Math.max(6,o.rx*s);
      o.ry=Math.max(6,o.ry*s);
      return;
    }

    if(o.kind==='parabola'){
      o.center=scalePt(o.center);
      o.w=Math.max(24,o.w*s);
      o.h=Math.max(24,o.h*s);
      return;
    }

    if(o.kind==='image'){
      o.center=scalePt(o.center);
      o.w=Math.max(24,o.w*s);
      o.h=Math.max(24,o.h*s);
      return;
    }

    if(o.kind==='text'){
      o.center=scalePt(o.center);
      o.w=Math.max(24,o.w*s);
      o.h=Math.max(20,o.h*s);
      o.fontSize=Math.max(6,(o.fontSize||24)*s);
      return;
    }

    if(o.kind==='symbol'){
      o.center=scalePt(o.center);
      if(o.symbolType==='sqrt'){
        o.radicalW=Math.max(18,(o.radicalW||90)*s);
        o.roofLen=Math.max(18,(o.roofLen||110)*s);
        o.height=Math.max(18,(o.height||72)*s);
        o.legDepth=Math.max(6,(o.legDepth||34)*s);
        o.startOffset=(Number.isFinite(o.startOffset) ? o.startOffset : 0.10*(o.height||72))*s;
      }else if(o.symbolType==='integral'){
        o.w=Math.max(10,(o.w||50)*s);
        o.h=Math.max(22,(o.h||130)*s);
      }
      return;
    }

    if(o.kind==='axes'){
      o.center=scalePt(o.center);
      o.w=Math.max(24,o.w*s);
      o.h=Math.max(24,o.h*s);
    }
  }

  function drawGroupSelection(){
    const box=groupOrientedBox();
    if(!box) return;
    const oc=orientedBoxCorners(box,8/viewZoom);
    const hasLocked=selectedIndices.some(i=>objects[i] && objects[i].locked);

    ctx.save();
    ctx.strokeStyle='#2563eb';
    ctx.lineWidth=1.5/viewZoom;
    ctx.setLineDash([6/viewZoom,4/viewZoom]);

    ctx.beginPath();
    ctx.moveTo(oc.nw.x,oc.nw.y);
    ctx.lineTo(oc.ne.x,oc.ne.y);
    ctx.lineTo(oc.se.x,oc.se.y);
    ctx.lineTo(oc.sw.x,oc.sw.y);
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);

    // Kilitli bir nesne seçimin içindeyse bounding box görünür kalır,
    // ancak düzenleme tutamaçları gösterilmez.
    if(!hasLocked){
      for(const p of [oc.nw,oc.ne,oc.se,oc.sw]){
        ctx.beginPath();
        ctx.fillStyle='white';
        ctx.strokeStyle='#2563eb';
        ctx.rect(p.x-5/viewZoom,p.y-5/viewZoom,10/viewZoom,10/viewZoom);
        ctx.fill();
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(oc.topCenter.x,oc.topCenter.y);
      ctx.lineTo(oc.rotate.x,oc.rotate.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle='white';
      ctx.arc(oc.rotate.x,oc.rotate.y,6/viewZoom,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  function marqueeRect(){
    if(!marqueeStart || !marqueeEnd) return null;
    const x=Math.min(marqueeStart.x,marqueeEnd.x);
    const y=Math.min(marqueeStart.y,marqueeEnd.y);
    const w=Math.abs(marqueeEnd.x-marqueeStart.x);
    const h=Math.abs(marqueeEnd.y-marqueeStart.y);
    return {x,y,w,h};
  }

  function drawMarquee(){
    const r=marqueeRect();
    if(!r) return;
    ctx.save();
    ctx.fillStyle='rgba(37,99,235,.08)';
    ctx.strokeStyle='#2563eb';
    ctx.lineWidth=1.25/viewZoom;
    ctx.setLineDash([5/viewZoom,4/viewZoom]);
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeRect(r.x,r.y,r.w,r.h);
    ctx.restore();
  }

  function boundsInsideRect(b,r){
    return b &&
      b.x>=r.x &&
      b.y>=r.y &&
      b.x+b.w<=r.x+r.w &&
      b.y+b.h<=r.y+r.h;
  }

  function objectPointInsideSelection(i,p){
    const b=objectBounds(objects[i]);
    return !!(b && pointInBounds(p,b,6));
  }

  function cloneObject(o){
    return JSON.parse(JSON.stringify(o));
  }

  function remapGroupIdsForCopies(copies){
    const gidMap=new Map();
    for(const copy of copies){
      if(!copy || !copy.groupId) continue;
      if(!gidMap.has(copy.groupId)) gidMap.set(copy.groupId,makeGroupId());
      copy.groupId=gidMap.get(copy.groupId);
    }
    return copies;
  }

  function duplicateSelection(indices){
    const originals=indices.map(i=>objects[i]).filter(Boolean);
    const copies=remapGroupIdsForCopies(originals.map(cloneObject));
    const start=objects.length;
    for(const copy of copies) objects.push(copy);
    return Array.from({length:copies.length},(_,k)=>start+k);
  }

  function drawSelection(){
    normalizeSelection();

    if(selectedIndices.length>1){
      drawGroupSelection();
      return;
    }

    if(selectedIndices.length===1 && selectedIndex<0){
      selectedIndex=selectedIndices[0];
    }

    if(selectedIndex<0 || !objects[selectedIndex]) return;
    const selected=objects[selectedIndex];

    // Kilitli nesne seçilebilir; yalnızca bounding box gösterilir.
    // Taşıma / resize / rotate tutamaçları bilinçli olarak gizlidir.
    if(selected.locked){
      const lockedBox=orientedSelectionBox(selected);
      if(!lockedBox) return;
      const lockedOc=orientedBoxCorners(lockedBox,8/viewZoom);
      if(!lockedOc) return;

      ctx.save();
      ctx.strokeStyle='#2563eb';
      ctx.lineWidth=1.5/viewZoom;
      ctx.setLineDash([5/viewZoom,4/viewZoom]);
      ctx.beginPath();
      ctx.moveTo(lockedOc.nw.x,lockedOc.nw.y);
      ctx.lineTo(lockedOc.ne.x,lockedOc.ne.y);
      ctx.lineTo(lockedOc.se.x,lockedOc.se.y);
      ctx.lineTo(lockedOc.sw.x,lockedOc.sw.y);
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
      return;
    }

    const rawSpecial=menuEditHandles(selected);
    const special=(selected.kind==='ellipse') ? [] : rawSpecial;

    // LINE: always show A and B, regardless of whether it came from menu or ink recognition.
    if(selected.kind==='line'){
      const lineHandles=[
        {name:'endpoint-0',x:selected.a.x,y:selected.a.y},
        {name:'endpoint-1',x:selected.b.x,y:selected.b.y}
      ];
      ctx.save();
      for(const hnd of lineHandles){
        ctx.beginPath();
        ctx.fillStyle='white';
        ctx.strokeStyle='#2563eb';
        ctx.arc(hnd.x,hnd.y,6/viewZoom,0,Math.PI*2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
      return;
    }

    const box=orientedSelectionBox(selected);
    if(!box) return;
    const oc=orientedBoxCorners(box,8/viewZoom);
    if(!oc) return;

    ctx.save();
    ctx.strokeStyle='#2563eb';
    ctx.lineWidth=1.5/viewZoom;
    ctx.setLineDash([5/viewZoom,4/viewZoom]);

    // Rotated bounding box polygon
    ctx.beginPath();
    ctx.moveTo(oc.nw.x,oc.nw.y);
    ctx.lineTo(oc.ne.x,oc.ne.y);
    ctx.lineTo(oc.se.x,oc.se.y);
    ctx.lineTo(oc.sw.x,oc.sw.y);
    ctx.closePath();
    ctx.stroke();
    ctx.setLineDash([]);

    // Shape's own editable points
    if(special.length){
      for(const hnd of special){
        ctx.beginPath();
        ctx.fillStyle='white';
        ctx.strokeStyle='#2563eb';
        const rr=hnd.name.startsWith('sqrt-') ? 7/viewZoom : 6/viewZoom;
        ctx.arc(hnd.x,hnd.y,rr,0,Math.PI*2);
        ctx.fill();
        ctx.stroke();
      }
    }else{
      const isTriangle=
        selected.kind==='polygon' &&
        selected.shapeName==='triangle' &&
        polygonWorldVertices(selected).length===3;

      if(isTriangle){
        const verts=polygonWorldVertices(selected);
        for(const p of verts){
          ctx.beginPath();
          ctx.fillStyle='white';
          ctx.strokeStyle='#2563eb';
          ctx.arc(p.x,p.y,6/viewZoom,0,Math.PI*2);
          ctx.fill();
          ctx.stroke();
        }
      }
    }

    // Bounding-box resize handles
    const showBBoxHandles = selected.source==='menu' || !special.length;
    if(showBBoxHandles){
      for(const p of [oc.nw,oc.ne,oc.se,oc.sw]){
        ctx.beginPath();
        ctx.fillStyle='white';
        ctx.strokeStyle='#2563eb';
        ctx.rect(p.x-5/viewZoom,p.y-5/viewZoom,10/viewZoom,10/viewZoom);
        ctx.fill();
        ctx.stroke();
      }
    }

    const canRotate=!(selected.kind==='ellipse' && selected.shapeName==='circle');
    if(canRotate){
      ctx.beginPath();
      ctx.moveTo(oc.topCenter.x,oc.topCenter.y);
      ctx.lineTo(oc.rotate.x,oc.rotate.y);
      ctx.strokeStyle='#2563eb';
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle='white';
      ctx.arc(oc.rotate.x,oc.rotate.y,6/viewZoom,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  function pointInBounds(p,b,pad=8){
    return p.x>=b.x-pad && p.x<=b.x+b.w+pad &&
           p.y>=b.y-pad && p.y<=b.y+b.h+pad;
  }

  function hitSelectionHandle(p,pointerType='mouse'){
    if(selectedIndex<0) return null;
    const selected=objects[selectedIndex];
    if(!selected || selected.locked) return null;

    const rawSpecial=menuEditHandles(selected);

    // LINE: A/B endpoints are interactive for every line object.
    if(selected.kind==='line'){
      const lineHandles=[
        {name:'endpoint-0',x:selected.a.x,y:selected.a.y},
        {name:'endpoint-1',x:selected.b.x,y:selected.b.y}
      ];
      const hitR=(pointerType==='touch' ? 22 : 11)/viewZoom;
      for(const h of lineHandles){
        if(Math.hypot(p.x-h.x,p.y-h.y)<=hitR) return h.name;
      }
      return null;
    }

    const box=orientedSelectionBox(selected);
    if(!box) return null;
    const oc=orientedBoxCorners(box,8/viewZoom);

    const special=(selected.kind==='ellipse') ? [] : rawSpecial;
    for(const h of special){
      const base=h.name.startsWith('sqrt-') ? 15 : 11;
