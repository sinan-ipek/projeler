function tokens(input){let s=input.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/×/g,'*').replace(/÷/g,':').replace(/,/g,'.');let out=[],i=0;while(i<s.length){let rest=s.slice(i),m;if((m=/^(?:\d+)?\.\(\d+\)/.exec(rest))){out.push({t:'repeat',v:m[0]});i+=m[0].length;continue}if((m=/^\d+(?:\.\d+)?/.exec(rest))){out.push({t:'number',v:m[0]});i+=m[0].length;continue}if(rest.startsWith('sqrt')){out.push({t:'sqrt'});i+=4;continue}if('()+-*/:^'.includes(s[i])){out.push({t:s[i]});i++;continue}throw Error('unknown character '+s[i])}out.push({t:'eof'});return out}
