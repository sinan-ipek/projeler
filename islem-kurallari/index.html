let progress;try{progress=JSON.parse(localStorage.getItem('number-progress')||'{}')}catch{progress={}};let level=0,question=0,tree=null,initial=null,steps=[],snapshots=[],workflow=null,everFast=false,helpUsed=false,doneRecorded=false;let testMode=localStorage.getItem('number-test-mode')!=='off';
function isUnlocked(n){if(testMode||n===0)return true;return !!progress[n-1]?.unlocked}function pdata(n){return progress[n]||(progress[n]={done:[],recent:[],unlocked:false})}function save(){localStorage.setItem('number-progress',JSON.stringify(progress))}
function nextUnsolved(l,after){let done=pdata(l).done;for(let k=1;k<=LEVELS[l][1].length;k++){let i=(after+k)%LEVELS[l][1].length;if(!done.includes(i))return i}return -1}
function masteryText(l){let p=pdata(l),total=LEVELS[l][1].length,correct=p.recent.filter(Boolean).length;if(testMode)return language==='tr'?'Test modu: Bütün düzeyler açık. Öğrenci ilerlemesi korunur.':language==='de'?'Testmodus: Alle Stufen offen. Fortschritt bleibt erhalten.':'Test mode: All levels available. Progress is preserved.';if(p.unlocked)return language==='tr'?'Düzey tamamlandı. Sonraki düzey açık.':language==='de'?'Stufe abgeschlossen. Nächste Stufe offen.':'Level complete. Next level unlocked.';if(p.done.length<total)return language==='tr'?`${total-p.done.length} örnek henüz tamamlanmadı. İşaretsiz örneklere geç.`:language==='de'?`${total-p.done.length} Aufgaben fehlen noch. Wähle Aufgaben ohne Häkchen.`:`${total-p.done.length} exercises remain. Choose those without a check.`;return language==='tr'?`12 örnek tamamlandı. Son 5 çözümün ${correct} tanesi yardımsız yavaş modda; en az 4 gerekli. Tekrar çözebilirsin.`:language==='de'?`12 Aufgaben gelöst. ${correct} der letzten 5 ohne Hilfe im langsamen Modus; 4 nötig. Bitte wiederholen.`:`12 complete. ${correct} of the last 5 were independent slow solutions; 4 required. Repeat exercises.`}
function levelUI(){$('testMode').checked=testMode;$('testModeLabel').textContent=language==='tr'?'Test modu (tüm düzeyler açık)':language==='de'?'Testmodus (alle Stufen offen)':'Test mode (all levels open)';let list=$('levelList');list.innerHTML='';LEVELS.forEach(([name],i)=>{let b=document.createElement('button');b.className='lv'+(level===i?' current':'');b.disabled=!isUnlocked(i);b.innerHTML=`<span>${!isUnlocked(i)?'🔒 ':''}${i+1}. ${name}</span><span class="stat">${pdata(i).done.length}/12</span>`;b.onclick=()=>loadExample(i,0);list.append(b)});$('unlockInfo').textContent=masteryText(level);$('levelName').textContent=`${level+1}. ${LEVELS[level][0]}`;$('questionCount').textContent=`${pdata(level).done.length}/12 ${T('complete')}`;$('bar').style.width=`${Math.min(100,pdata(level).done.length/12*100)}%`;const bar=$('examplebar');bar.innerHTML='';LEVELS[level][1].forEach((s,i)=>{let b=document.createElement('button');b.className='ex'+(i===question?' active':'');b.textContent=`${i+1}${pdata(level).done.includes(i)?' ✓':''}`;b.title=s;b.onclick=()=>loadExample(level,i);bar.append(b)})}
function loadExample(l,q){level=l;question=q;$('expr').value=LEVELS[l][1][q];start();levelUI()}function start(){try{tree=parse($('expr').value);initial=clone(tree);steps=['Başlangıç'];snapshots=[];workflow=null;doneRecorded=false;everFast=mode==='fast';$('tip').classList.remove('error');paint()}catch(e){$('tip').textContent=`${T('invalid')} ${e.message}`;$('tip').classList.add('error');console.warn(e)}}
function snapshot(){snapshots.push({tree:clone(tree),steps:steps.slice(),workflow:workflow?clone(workflow):null})}function transform(id,replacement,note){snapshot();tree=replace(tree,id,()=>replacement);steps.push(note);workflow=null;paint()}
function clicked(id){

 let parentId=Number(id.slice(5)),node=search(tree,parentId);
 if(!node||node.kind!=='bin'||!['+','-'].includes(node.op)||node.a?.kind!=='bin'||!['+','-'].includes(node.a.op))return;
 let a=val(node.a.b),b=val(node.b);if(!a||!b)return;

 // Preserve the sign before the selected pair: A-B+C = A-(B-C).

}

function search(x,id){if(!x)return null;if(x.id===id)return x;return search(x.a,id)||search(x.b,id)||search(x.x,id)}
function factorStep(){if(!workflow)return;let node=search(tree,workflow.id);if(!node)return;let a=val(node.a),b=val(node.b);let d=a.d/gcd(a.d,b.d)*b.d;let an=a.n*(d/a.d),bn=b.n*(d/b.d);snapshot();let updated=binary(node.op,num(an,d),num(bn,d));tree=replace(tree,node.id,()=>updated);steps.push(`Ortak payda: ${d}. Genişletme: ×${d/a.d}, ×${d/b.d}`);workflow={id:updated.id,phase:'expanded'};paint()}
function markComplete(){if(doneRecorded||!tree||candidates(tree).length!==0||!val(tree)||$('expr').value!==LEVELS[level][1][question])return;if(!valueReady(tree)&&!(['num','frac'].includes(tree.kind)))return;doneRecorded=true;let p=pdata(level);if(!p.done.includes(question))p.done.push(question);p.recent.push(!everFast&&!helpUsed);p.recent=p.recent.slice(-5);if(p.done.length>=12&&p.recent.length>=5&&p.recent.filter(Boolean).length>=4)p.unlocked=true;save();levelUI()}
// TeX owns every baseline and fraction bar; overlays never affect layout.
const NS='http://www.w3.org/2000/svg';
function S(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);if(parent)parent.append(el);return el}
function texFor(x){
 const wrap=t=>'\\class{ast'+x.id+'}{'+t+'}';
 if(x.kind==='num'){const n=x.v.n,d=x.v.d;return wrap(d===1n?String(n):'\\frac{'+n+'}{'+d+'}')}
 if(x.kind==='repeat')return wrap(x.whole+','+x.pre+'\\overline{'+x.cycle+'}');
 if(x.kind==='group')return wrap('\\left('+texFor(x.x)+'\\right)');
 if(x.kind==='unary')return wrap('-'+texFor(x.x));
 if(x.kind==='root')return wrap('\\sqrt{'+texFor(x.x)+'}');
 if(x.kind==='pow')return wrap('{'+texFor(x.a)+'}^{'+texFor(x.b)+'}');
 if(x.kind==='frac')return wrap('\\dfrac{'+texFor(x.a)+'}{'+texFor(x.b)+'}');
 if(x.kind==='bin'){
   const op={'*':'\\cdot',':':'\\div','/':'\\div','-':'-','+':'+'}[x.op]||x.op;
   return wrap(texFor(x.a)+'\\class{op'+x.id+'}{'+op+'}'+texFor(x.b));

}
let renderToken=0,overlay=null,mathWrapper=null,boxes=new Map(),arrowLayer=null;
function getRect(el,origin){const r=el.getBoundingClientRect();return {x:r.left-origin.left,y:r.top-origin.top,w:r.width,h:r.height}}
function region(c){
 const q=boxes.get(c.id);if(!q)return null;
 if(c.kind!=='adjacent')return q;
 const first=boxes.get(c.first),last=boxes.get(c.last),parent=search(tree,c.id);
 if(!first||!last)return null;
 const op=mathWrapper.querySelector('.op'+parent.a.id);
 const sign=op?getRect(op,mathWrapper.getBoundingClientRect()):null;
 const x=sign?Math.min(sign.x,first.x):first.x-12;

}
function clearArrows(){if(arrowLayer){arrowLayer.remove();arrowLayer=null}}
function drawArrows(c){

 const inside=c.side==='left'?n.a.x:n.b.x,source=c.side==='left'?n.b:n.a;

function updateState(available){
 const actions=$('actions');actions.innerHTML='';
 if(workflow?.phase==='factors'){
  const node=search(tree,workflow.id),a=val(node.a),b=val(node.b);
  if(a&&b){const d=a.d/gcd(a.d,b.d)*b.d,btn=document.createElement('button');btn.className='btn primary';btn.textContent=a.d+' × '+d/a.d+' = '+d+' · '+b.d+' × '+d/b.d+' = '+d;btn.onclick=factorStep;actions.append(btn)}
 }

function paint(){

  if(token!==renderToken)return;

   const n=search(tree,workflow.id);
   for(const part of [n?.a,n?.b]){const r=part&&boxes.get(part.id);if(r)S('rect',{x:r.x-3,y:r.y-2,width:r.w+6,height:r.h+4,rx:5,class:'focusRect'},overlay)}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
