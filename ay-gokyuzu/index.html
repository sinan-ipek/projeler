<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ay Gökyüzü Simülasyonu</title>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 40% 30%,
            #14223a 0%,
            #070d18 45%,
            #02050b 100%
        );

    color: white;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
}


/* =========================================================
   HOME
   ========================================================= */

#homeBtn {
    position: absolute;

    left: 18px;
    top: 18px;

    z-index: 50;

    width: 46px;
    height: 46px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    color: white;

    background: rgba(8,18,32,0.88);

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 8px 24px rgba(0,0,0,0.30);

    backdrop-filter: blur(10px);

    font-size: 22px;
}

#homeBtn:hover {
    background: rgba(24,45,70,0.95);
}


/* =========================================================
   ÜST KONTROLLER
   ========================================================= */

#topControls {
    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    align-items: stretch;

    gap: 10px;

    z-index: 20;
}


/* =========================================================
   TARİH PANELİ
   ========================================================= */

#datePanel {
    display: flex;
    align-items: center;

    gap: 16px;

    padding: 12px 18px;

    border-radius: 18px;

    background: rgba(8,18,32,0.82);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.16);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.35);
}

.dateControl {
    width: 172px;
}

.dateHeader {
    display: flex;
    align-items: baseline;
    justify-content: space-between;

    margin-bottom: 7px;
}

.dateTitle {
    font-size: 12px;

    opacity: 0.68;

    letter-spacing: 0.08em;

    text-transform: uppercase;
}

.dateValue {
    font-size: 20px;

    font-weight: 650;
}

input[type="range"] {
    width: 100%;

    cursor: pointer;
}


/* =========================================================
   İKİ KÜÇÜK BAYRAK
   ========================================================= */

#topFlags {
    display: flex;
    align-items: stretch;

    gap: 7px;
}

.flagCard {
    width: 74px;
    height: 76px;

    padding: 7px 5px 5px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 4px;

    border-radius: 13px;

    background: rgba(8,18,32,0.82);

    backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.28);
}

.flagImageBox {
    width: 50px;
    height: 33px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 4px;

    background: rgba(0,0,0,0.20);
}

.flagImage {
    display: none;

    width: 100%;
    height: 100%;

    object-fit: contain;
}

.flagEmoji {
    display: none;

    font-size: 28px;

    line-height: 1;
}

.flagCountry {
    width: 100%;

    overflow: hidden;

    text-align: center;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 9.5px;

    line-height: 1.1;

    font-weight: 600;

    color: rgba(255,255,255,0.92);
}


/* =========================================================
   AY + DÜNYA ORTAK ALANI
   ========================================================= */

#workspace {
    position: absolute;

    top: 126px;
    left: 50%;

    transform: translateX(-50%);

    width: min(
        calc(100vw - 56px),
        1022px
    );

    display: flex;
    align-items: flex-start;

    gap: 12px;

    z-index: 5;
}


/* =========================================================
   AY PANELİ
   ========================================================= */

#moonPanel {
    position: relative;

    flex: 1 1 auto;

    min-width: 0;

    height: min(67vh,620px);

    min-height: 430px;

    border-radius: 24px;

    overflow: hidden;

    background: #02050a;

    border: 1px solid rgba(255,255,255,0.17);

    box-shadow:
        0 18px 65px rgba(0,0,0,0.48);
}

#moonCanvas {
    width: 100%;
    height: 100%;

    display: block;
}

#moonPanelTitle {
    position: absolute;

    left: 18px;
    top: 15px;

    font-size: 13px;

    letter-spacing: 0.08em;

    text-transform: uppercase;

    color: rgba(255,255,255,0.68);

    pointer-events: none;
}

#moonInfo {
    position: absolute;

    left: 18px;
    bottom: 19px;

    padding: 10px 13px;

    border-radius: 12px;

    background: rgba(0,0,0,0.42);

    backdrop-filter: blur(7px);

    font-size: 13px;

    line-height: 1.55;

    color: rgba(255,255,255,0.89);

    pointer-events: none;
}

#moonStatus {
    position: absolute;

    right: 18px;
    bottom: 19px;

    padding: 8px 12px;

    border-radius: 999px;

    background: rgba(0,0,0,0.42);

    font-size: 12px;

    pointer-events: none;
}


/* =========================================================
   DÜNYA PANELİ
   ========================================================= */

#globeBox {
    position: relative;

    flex: 0 0 360px;

    width: 360px;
    height: 410px;

    border-radius: 24px;

    background:
        linear-gradient(
            160deg,
            rgba(18,36,58,0.92),
            rgba(4,11,21,0.92)
        );

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 18px 65px rgba(0,0,0,0.42);

    overflow: hidden;
}

#globeTitle {
    position: absolute;

    top: 15px;
    left: 18px;

    z-index: 3;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 0.08em;

    color: rgba(255,255,255,0.68);

    pointer-events: none;
}

#globeHint {
    position: absolute;

    top: 36px;
    left: 18px;

    z-index: 3;

    font-size: 11px;

    color: rgba(255,255,255,0.45);

    pointer-events: none;
}

#globeCanvas {
    display: block;

    width: 100%;
    height: 350px;

    cursor: grab;

    touch-action: none;
}

#globeCanvas:active {
    cursor: grabbing;
}

#locationInfo {
    position: absolute;

    left: 16px;
    right: 16px;
    bottom: 15px;

    display: flex;
    justify-content: space-between;

    gap: 10px;

    font-size: 12px;

    color: rgba(255,255,255,0.78);
}

.coord {
    font-variant-numeric: tabular-nums;
}


/* =========================================================
   ALT YAZILAR
   ========================================================= */

#mainTitle {
    position: absolute;

    left: 30px;
    bottom: 25px;

    font-size: 17px;

    font-weight: 450;

    color: rgba(255,255,255,0.68);

    z-index: 3;
}

#timeNotice {
    position: absolute;

    right: 28px;
    bottom: 25px;

    font-size: 11px;

    color: rgba(255,255,255,0.42);

    text-align: right;

    z-index: 3;
}


/* =========================================================
   ORTA GENİŞLİK
   ========================================================= */

@media (max-width: 1120px) {

    .dateControl {
        width: 142px;
    }

    #workspace {
        width: calc(100vw - 36px);
    }

    #globeBox {
        flex-basis: 330px;

        width: 330px;
    }
}


/* =========================================================
   MOBİL / DAR EKRAN
   ========================================================= */

@media (max-width: 820px) {

    #homeBtn {
        left: 10px;
        top: 10px;

        width: 40px;
        height: 40px;

        font-size: 19px;
    }

    #topControls {
        top: 10px;
        left: 58px;
        right: 8px;

        transform: none;

        gap: 5px;
    }

    #datePanel {
        flex: 1;

        min-width: 0;

        gap: 5px;

        padding: 8px 8px;
    }

    .dateControl {
        flex: 1;

        width: auto;
        min-width: 0;
    }

    .dateValue {
        font-size: 14px;
    }

    .dateTitle {
        font-size: 9px;
    }

    #topFlags {
        gap: 4px;
    }

    .flagCard {
        width: 52px;
        height: 61px;

        padding: 4px 3px;
    }

    .flagImageBox {
        width: 40px;
        height: 26px;
    }

    .flagCountry {
        font-size: 8px;
    }

    #workspace {
        top: 105px;

        width: calc(100vw - 20px);

        gap: 8px;
    }

    #moonPanel {
        min-height: 360px;

        height: 52vh;
    }

    #globeBox {
        flex-basis: 250px;

        width: 250px;
        height: 300px;
    }

    #globeCanvas {
        height: 250px;
    }

    #locationInfo {
        left: 10px;
        right: 10px;

        font-size: 10px;
    }

    #mainTitle,
    #timeNotice {
        display: none;
    }
}


@media (max-width: 620px) {

    #topControls {
        right: 5px;
    }

    #datePanel {
        gap: 3px;

        padding: 7px 5px;
    }

    .dateHeader {
        margin-bottom: 3px;
    }

    .dateValue {
        font-size: 12px;
    }

    .dateTitle {
        font-size: 8px;
    }

    .flagCard {
        width: 44px;
    }

    .flagImageBox {
        width: 35px;
        height: 23px;
    }

    .flagCountry {
        font-size: 7px;
    }

    #workspace {
        display: block;

        top: 98px;
    }

    #moonPanel {
        width: 100%;

        height: 48vh;

        min-height: 330px;
    }

    #globeBox {
        position: absolute;

        right: 0;
        top: calc(48vh + 8px);

        width: 220px;
        height: 260px;
    }

    #globeCanvas {
        height: 212px;
    }
}

</style>
</head>

<body>

<div id="app">

    <a

        </div>


        <!--
            1. Bayrak:
            Kırmızı noktanın bulunduğu ülke.

            2. Bayrak:
            En yakın Ay/hilal sembollü bayrak.
        -->

        <div id="topFlags">

                </div>

                <div

                    Almanya
                </div>

            </div>


            <div

                <div class="flagImageBox">

                    <img

                </div>

                <div

                    Türkiye

            </div>

        </div>

    </div>


    <!-- =====================================================

         ===================================================== -->

    <div id="workspace">

        <div id="moonPanel">

            <canvas id="moonCanvas"></canvas>

            <div id="moonPanelTitle">

            <div id="moonInfo"></div>

        <div id="globeBox">

                Gözlem Konumu

            <div id="globeHint">
                Kırmızı noktayı sürükle · Küreyi çevir · Tekerlek: zoom

            <canvas id="globeCanvas"></canvas>

            <div id="locationInfo">

                <span>

                    <b

                    </b>

        </div>

    </div>


    <div id="mainTitle">
        Ay · Dünya · Tarih
    </div>


    <div id="timeNotice">
        Gökyüzü konumu yaklaşık<br>
        yerel güneş saati 22:00 için hesaplanır.

</div>

function countryCodeToEmoji(
    code
) {

    if (
        !code
    ) {

        return "🏳️";
    }


    let result =
        "";


    for (
        const char
        of
        code.toUpperCase()
    ) {

        result +=
            String.fromCodePoint(
                127397 +
                char.charCodeAt(0)
            );
    }


    return result;
}


function installFlagHandlers(
    image,
    emoji
) {

    image.addEventListener(
        "load",

        () => {

            image.style.display =
                "block";


            emoji.style.display =
                "none";
        }
    );


    image.addEventListener(
        "error",

        () => {

            image.style.display =
                "none";


            emoji.style.display =
                "block";
        }
    );
}

    emoji.textContent =

            );

}

function normalizeDegrees(
    value
) {

    value %=
        360;


    if (
        value < 0
    ) {

        value +=
            360;
    }


    return value;
}


function getCompassDirection(
    angle
) {

    const directions = [
        "K",
        "KD",
        "D",
        "GD",
        "G",
        "GB",
        "B",
        "KB"
    ];


    return directions[
        Math.round(
            angle / 45
        ) % 8
    ];
}

   CANVAS
   ============================================================ */

function resizeCanvas(
    canvas,
    context
) {

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        Math.min(
            window.devicePixelRatio ||
            1,
            2
        );


    canvas.width =
        Math.round(
            rect.width *
            ratio
        );


    canvas.height =
        Math.round(
            rect.height *
            ratio
        );


    context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    return {
        width:
            rect.width,

        height:
            rect.height
    };
}

function randomSeeded(
    n
) {

    const x =
        Math.sin(
            n * 12.9898 +
            78.233
        )
        *
        43758.5453;


    return (
        x -
        Math.floor(x)
    );
}


function createStars(
    width,
    height
) {

    stars =
        [];


    const count =
        Math.floor(
            width *
            height /
            1700
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        stars.push(
            {
                x:
                    randomSeeded(
                        i * 5 + 1
                    )
                    *
                    width,

                y:
                    randomSeeded(
                        i * 5 + 2
                    )
                    *
                    height
                    *
                    0.83,

                r:
                    0.25
                    +
                    randomSeeded(
                        i * 5 + 3
                    )
                    *
                    1.05,

                a:
                    0.2
                    +
                    randomSeeded(
                        i * 5 + 4
                    )
                    *
                    0.55
            }
        );
    }
}

const phaseCanvas =
    document.createElement(
        "canvas"
    );


const phaseCtx =
    phaseCanvas.getContext(
        "2d"
    );


function smoothstep(
    edge0,
    edge1,
    x
) {

    let t =
        (
            x -
            edge0
        )
        /
        (
            edge1 -
            edge0
        );


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    return (
        t *
        t *
        (
            3 -
            2 * t
        )
    );
}


function createPhaseShadow(
    size,
    fraction,
    orientation
) {

    phaseCanvas.width =
        size;


    phaseCanvas.height =
        size;


    const image =
        phaseCtx.createImageData(
            size,
            size
        );


    const data =
        image.data;


    const sunZ =
        2 *
        fraction
        -
        1;


    const projectedSun =
        Math.sqrt(
            Math.max(
                0,
                1 -
                sunZ *
                sunZ
            )
        );


    const sunX =
        Math.sin(
            orientation
        )
        *
        projectedSun;


    const sunY =
        Math.cos(
            orientation
        )
        *
        projectedSun;


    const center =
        size / 2;


    const radius =
        size * 0.49;


    for (
        let py = 0;
        py < size;
        py++
    ) {

        for (
            let px = 0;
            px < size;
            px++
        ) {

            const index =
                (
                    py *
                    size +
                    px
                )
                *
                4;


            const x =
                (
                    px -
                    center
                )
                /
                radius;


            const y =
                -(
                    py -
                    center
                )
                /
                radius;


            const r2 =
                x *
                x +
                y *
                y;


            if (
                r2 > 1
            ) {

                data[
                    index + 3
                ] =
                    0;


                continue;
            }


            const z =
                Math.sqrt(
                    Math.max(
                        0,
                        1 -
                        r2
                    )
                );


            const dot =
                x *
                sunX +
                y *
                sunY +
                z *
                sunZ;


            const illuminated =
                smoothstep(
                    -0.018,
                    0.018,
                    dot
                );
