<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orantı</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#111;background:#fff}header{padding:14px 18px;border-bottom:1px solid #ddd;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}header small{color:#666}.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 9px;color:#111}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}.card{border:1px solid #ddd;border-radius:10px;overflow:hidden;min-width:0}.head{padding:8px 10px;background:#fafafa;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:8px}.ttl{font-weight:700}.stat{font-size:11px;color:#666;margin-top:3px}.num{font-size:22px;font-weight:700;text-align:right}.num small{display:block;font-size:9px;color:#777;font-weight:400}canvas{width:100%;height:420px;display:block;background:#fff;touch-action:none}.solid{font-size:11px;margin-left:5px}@media(max-width:950px){.grid{grid-template-columns:1fr}canvas{height:500px}.tools{margin-left:0}}
</style></head><body><header><div><h1>Orantı: S ∝ d, S ∝ A, S ∝ V</h1><small>Tutamaçları sürükle; nokta sayısının uzunluk, alan ve hacimle nasıl değiştiğini izle.</small></div><div class="tools"><label><input id="theory" type="checkbox" checked> teorik doğru</label><button id="clear">Grafikleri temizle</button><button id="newpts">Yeni noktalar</button></div></header><div class="grid">
<section class="card"><div class="head"><div><div class="ttl">1B — Doğru parçası</div><div id="st1" class="stat"></div></div><div id="n1" class="num">0<small>nokta S</small></div></div><canvas id="c1"></canvas></section>
<section class="card"><div class="head"><div><div class="ttl">2B — Dikdörtgen</div><div id="st2" class="stat"></div></div><div id="n2" class="num">0<small>nokta S</small></div></div><canvas id="c2"></canvas></section>
<section class="card"><div class="head"><div><div class="ttl">3B — Hacim <select id="solid" class="solid"><option value="cyl">Silindir</option><option value="sphere">Küre</option><option value="box">Dikdörtgen prizma</option><option value="cone">Koni</option></select></div><div id="st3" class="stat"></div></div><div id="n3" class="num">0<small>nokta S</small></div></div><canvas id="c3"></canvas></section>
</div><script>
(()=>{'use strict';const $=x=>document.getElementById(x),C={b:'#2563eb',g:'#16a34a',o:'#ea580c',p:'#db2777',q:'#0891b2',grid:'#e5e7eb',gray:'#c7c7c7',txt:'#111'},S={d:6.2,w:6.5,h:3.8,r:2.1,z:4.8,a:3.8,b:2.8,solid:'cyl'},H=[[],[],[]],G=[{}, {}, {}];let P1=[],P2=[],P3=[],drag=null,show=1;
function rng(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function seed(){let r=rng(Date.now()>>>0);P1=Array.from({length:750},()=>[r()*10,r()-.5]);P2=Array.from({length:1080},()=>[r()*10,r()*6]);P3=Array.from({length:2400},()=>[(r()*2-1)*3.2,(r()*2-1)*3.2,r()*7]);clearH();draw()}
function vol(){return S.solid==='sphere'?4*Math.PI*S.r**3/3:S.solid==='box'?S.a*S.b*S.z:S.solid==='cone'?Math.PI*S.r*S.r*S.z/3:Math.PI*S.r*S.r*S.z}
function in3(p){let[x,y,z]=p;if(S.solid==='sphere')return x*x+y*y+(z-S.r)**2<=S.r*S.r;if(S.solid==='box')return Math.abs(x)<=S.a/2&&Math.abs(y)<=S.b/2&&z<=S.z;if(S.solid==='cone'){if(z>S.z)return 0;let rr=S.r*(1-z/S.z);return x*x+y*y<=rr*rr}return x*x+y*y<=S.r*S.r&&z<=S.z}
function counts(){return[P1.filter(p=>p[0]<=S.d).length,P2.filter(p=>p[0]<=S.w&&p[1]<=S.h).length,P3.filter(in3).length]}
function vals(){let n=counts();return[[S.d,n[0]],[S.w*S.h,n[1]],[vol(),n[2]]]}
function add(){vals().forEach((p,i)=>{let h=H[i],q=h[h.length-1];if(!q||Math.abs(q[0]-p[0])>.005||q[1]!==p[1]){h.push(p);if(h.length>120)h.shift()}})}function clearH(){H.forEach(h=>h.length=0);add()}
function fit(c){let d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,r.width,r.height]}
function dot(x,a,b,r,col){x.beginPath();x.arc(a,b,r,0,7);x.fillStyle=col;x.fill()}function handle(x,a,b,col){dot(x,a,b,7,col);x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}
function chart(x,W,Hh,hist,xmax,ymax,col,k,label){let L=34,R=10,T=Hh*.60,B=22,ww=W-L-R,hh=Hh-T-B;x.strokeStyle=C.grid;x.lineWidth=1;for(let i=0;i<6;i++){let xx=L+ww*i/5;x.beginPath();x.moveTo(xx,T);x.lineTo(xx,T+hh);x.stroke()}for(let i=0;i<5;i++){let yy=T+hh*i/4;x.beginPath();x.moveTo(L,yy);x.lineTo(L+ww,yy);x.stroke()}if(show){x.save();x.setLineDash([5,4]);x.strokeStyle=C.g;x.beginPath();x.moveTo(L,T+hh);let ex=Math.min(xmax,ymax/k);x.lineTo(L+ww*ex/xmax,T+hh-hh*k*ex/ymax);x.stroke();x.restore()}x.strokeStyle=col;x.globalAlpha=.3;x.beginPath();hist.forEach((p,i)=>{let xx=L+ww*p[0]/xmax,yy=T+hh-hh*p[1]/ymax;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.globalAlpha=1;hist.forEach((p,i)=>dot(x,L+ww*p[0]/xmax,T+hh-hh*p[1]/ymax,i===hist.length-1?4:2,i===hist.length-1?C.txt:col));x.fillStyle='#555';x.font='10px Arial';x.fillText(label,L+ww/2,Hh-5);x.save();x.translate(10,T+hh/2);x.rotate(-Math.PI/2);x.fillText('S',0,0);x.restore()}
function d1(){let[x,W,Hh]=fit($('c1')),L=30,R=W-24,Y=Hh*.28,E=L+(R-L)*S.d/10;G[0]={L,R,Y,E};x.strokeStyle='#bbb';x.lineWidth=2;x.beginPath();x.moveTo(L,Y);x.lineTo(R,Y);x.stroke();x.strokeStyle=C.b;x.lineWidth=4;x.beginPath();x.moveTo(L,Y);x.lineTo(E,Y);x.stroke();P1.forEach(p=>dot(x,L+(R-L)*p[0]/10,Y+p[1]*14,p[0]<=S.d?2:1.3,p[0]<=S.d?C.b:C.gray));handle(x,E,Y,C.b);let n=counts()[0];$('n1').firstChild.nodeValue=n;$('st1').innerHTML=`d=<b>${S.d.toFixed(2)}</b> · S/d=<b>${(n/S.d).toFixed(1)}</b>`;chart(x,W,Hh,H[0],10,773,C.b,75,'d')}
function d2(){let[x,W,Hh]=fit($('c2')),L=30,R=W-20,T=18,Y=Hh*.52,ww=R-L,hh=Y-T,X=L+ww*S.w/10,U=Y-hh*S.h/6;G[1]={L,Y,ww,hh,X,U};x.strokeStyle='#bbb';x.strokeRect(L,T,ww,hh);P2.forEach(p=>{let yes=p[0]<=S.w&&p[1]<=S.h;dot(x,L+ww*p[0]/10,Y-hh*p[1]/6,yes?2:1.2,yes?C.g:C.gray)});x.fillStyle='rgba(22,163,74,.08)';x.fillRect(L,U,X-L,Y-U);x.strokeStyle=C.g;x.lineWidth=3;x.strokeRect(L,U,X-L,Y-U);handle(x,X,U,C.b);let A=S.w*S.h,n=counts()[1];$('n2').firstChild.nodeValue=n;$('st2').innerHTML=`A=<b>${A.toFixed(2)}</b> · S/A=<b>${(n/A).toFixed(1)}</b>`;chart(x,W,Hh,H[1],60,1112,C.g,18,'A')}
function proj(p,cx,base,sx,sy,sz){return[cx+(p[0]-p[1])*sx,base-p[2]*sz+(p[0]+p[1])*sy]}
function ell(x,cx,cy,rx,ry){x.beginPath();x.ellipse(cx,cy,Math.abs(rx),Math.abs(ry),0,0,7);x.stroke()}
function d3(){let[x,W,Hh]=fit($('c3')),cx=W*.5,base=Hh*.49,sx=Math.min(W/17,22),sy=sx*.32,sz=Math.min(Hh/18,14),top=base-S.z*sz;G[2]={cx,base,sx,sz};x.strokeStyle=C.o;x.lineWidth=2.3;let v=P3.filter(in3),step=Math.max(1,Math.ceil(v.length/350));if(S.solid==='sphere'){let R=S.r*sx*1.25,cy=base-S.r*sz;G[2].r=[cx+R,cy];G[2].cy=cy;x.fillStyle='rgba(234,88,12,.07)';x.beginPath();x.arc(cx,cy,R,0,7);x.fill();x.stroke();x.globalAlpha=.35;ell(x,cx,cy,R,R*.32);x.globalAlpha=1;for(let i=0;i<v.length;i+=step){let q=proj(v[i],cx,base,sx*.95,sy,sz);dot(x,q[0],q[1],1.5,C.o)}x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+R,cy);x.strokeStyle=C.b;x.stroke();handle(x,cx+R,cy,C.b)}else if(S.solid==='box'){let aw=S.a*sx*.72,dp=S.b*sx*.38,L=cx-aw/2,R=cx+aw/2;G[2].a=[R,base];G[2].b=[cx,base+dp];G[2].h=[L,top];x.strokeStyle=C.o;x.strokeRect(L,top,aw,base-top);x.beginPath();x.moveTo(L,top);x.lineTo(L+dp,top-dp*.35);x.lineTo(R+dp,top-dp*.35);x.lineTo(R,top);x.moveTo(R+dp,top-dp*.35);x.lineTo(R+dp,base-dp*.35);x.lineTo(R,base);x.stroke();for(let i=0;i<v.length;i+=step){let q=proj(v[i],cx,base,sx*.72,sy*.8,sz);dot(x,q[0],q[1],1.5,C.o)}handle(x,R,base,C.b);handle(x,cx,base+dp,C.p);handle(x,L,top,C.q)}else{let rx=S.r*sx*1.38,ry=S.r*sx*.44;G[2].r=[cx+rx,base];G[2].h=[cx,top];x.fillStyle='rgba(234,88,12,.07)';x.strokeStyle=C.o;if(S.solid==='cone'){x.beginPath();x.moveTo(cx,top);x.lineTo(cx-rx,base);x.lineTo(cx+rx,base);x.closePath();x.fill();x.stroke();ell(x,cx,base,rx,ry)}else{x.beginPath();x.moveTo(cx-rx,base);x.lineTo(cx-rx,top);x.moveTo(cx+rx,base);x.lineTo(cx+rx,top);x.stroke();ell(x,cx,top,rx,ry);ell(x,cx,base,rx,ry)}for(let i=0;i<v.length;i+=step){let q=proj(v[i],cx,base,sx,sy,sz);dot(x,q[0],q[1],1.5,C.o)}handle(x,cx+rx,base,C.b);handle(x,cx,top,C.q)}let V=vol(),n=counts()[2],names={cyl:'Silindir',sphere:'Küre',box:'Dikdörtgen prizma',cone:'Koni'},f={cyl:'πr²h',sphere:'4πr³/3',box:'abh',cone:'πr²h/3'};$('n3').firstChild.nodeValue=n;$('st3').innerHTML=`${names[S.solid]} · V=${f[S.solid]}=${V.toFixed(2)} · S/V=<b>${(n/V).toFixed(1)}</b>`;let mv=S.solid==='sphere'?4*Math.PI*3.2**3/3:S.solid==='box'?5.4*4.2*7:S.solid==='cone'?Math.PI*3.2**2*7/3:Math.PI*3.2**2*7,k=2400/(6.4*6.4*7);chart(x,W,Hh,H[2],mv,k*mv*1.15,C.o,k,'V')}
function draw(){d1();d2();d3()}function pos(e,c){let r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}function near(p,q){return q&&(p[0]-q[0])**2+(p[1]-q[1])**2<600}
$('c1').onpointerdown=e=>{let p=pos(e,$('c1'));if(near(p,[G[0].E,G[0].Y]))drag='d'};$('c1').onpointermove=e=>{if(drag!=='d')return;let p=pos(e,$('c1'));S.d=Math.max(.3,Math.min(10,(p[0]-G[0].L)/(G[0].R-G[0].L)*10));add();draw()};$('c2').onpointerdown=e=>{if(near(pos(e,$('c2')),[G[1].X,G[1].U]))drag='rect'};$('c2').onpointermove=e=>{if(drag!=='rect')return;let p=pos(e,$('c2'));S.w=Math.max(.3,Math.min(10,(p[0]-G[1].L)/G[1].ww*10));S.h=Math.max(.3,Math.min(6,(G[1].Y-p[1])/G[1].hh*6));add();draw()};$('c3').onpointerdown=e=>{let p=pos(e,$('c3')),g=G[2];drag=near(p,g.r)?'r':near(p,g.h)?'z':near(p,g.a)?'a':near(p,g.b)?'b':null};$('c3').onpointermove=e=>{if(!drag)return;let p=pos(e,$('c3')),g=G[2];if(drag==='r')S.r=Math.max(.35,Math.min(3.2,(p[0]-g.cx)/(g.sx*(S.solid==='sphere'?1.25:1.38))));if(drag==='z')S.z=Math.max(.45,Math.min(7,(g.base-p[1])/g.sz));if(drag==='a')S.a=Math.max(.5,Math.min(5.4,2*Math.abs(p[0]-g.cx)/(g.sx*.72)));if(drag==='b')S.b=Math.max(.5,Math.min(4.2,(p[1]-g.base)/(g.sx*.38)));add();draw()};[...document.querySelectorAll('canvas')].forEach(c=>{c.onpointerup=()=>{drag=null;add();draw()};c.onpointerleave=()=>{drag=null}});$('solid').onchange=e=>{S.solid=e.target.value;clearH();draw()};$('theory').onchange=e=>{show=e.target.checked;draw()};$('clear').onclick=()=>{clearH();draw()};$('newpts').onclick=seed;addEventListener('resize',draw);seed()})();
</script></body></html>
