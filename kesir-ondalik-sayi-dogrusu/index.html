<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kesir – Ondalık Sayı Doğrusu</title>

<style>
:root{
  --panel:#ffffff;
  --text:#172033;
  --muted:#657089;
  --line:#263247;
  --minor:#9aa4b5;
  --accent:#2f6fed;
  --border:#dfe5ef;
  --track:#cfd6e2;
  --shadow:0 10px 30px rgba(23,32,51,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#f8faff,#f3f6fb);
}

.app{
  position:relative;
  max-width:1200px;
  margin:0 auto;
  padding:22px;
}

/* =========================================================
   PANELLER
========================================================= */

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
}

/* =========================================================
   NOKTALARI SİL
   Sağ üst köşe, üstten en az 40 px
========================================================= */

.clear-floating{
  position:absolute;
  top:40px;
  right:24px;
  z-index:20;

  border:1px solid var(--border);
  background:#fff;
  color:var(--text);

  border-radius:11px;
  padding:10px 15px;

  font-weight:750;
  cursor:pointer;

  box-shadow:0 4px 14px rgba(23,32,51,.08);
}

.clear-floating:hover{
  background:#f6f8fc;
}

/* =========================================================
   SAYI DOĞRUSU
========================================================= */

.stage{
  position:relative;
  padding:18px 10px 18px;
  overflow:hidden;
  touch-action:none;
}

svg{
  display:block;
  width:100%;
  height:500px;

  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

.hint{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin:0 12px 4px;
}

#gridLayer > :not(.empty-overlay){
  pointer-events:none;
}

.empty-overlay{
  fill:transparent;
  cursor:crosshair;
}

.axis-main{
  stroke:var(--line);
  stroke-width:3;
  stroke-linecap:round;
}

.tick-major{
  stroke:var(--line);
  stroke-width:2.3;
}

.tick-minor{
  stroke:var(--minor);
  stroke-width:1.35;
}

.tick-label{
  fill:#364158;
  font-size:15px;
  font-weight:750;
  text-anchor:middle;
}

.segment-label{
  fill:#7a8598;
  font-size:12px;
  text-anchor:middle;
}

/* =========================================================
   NOKTALAR
========================================================= */

.point-dot{
  stroke:#fff;
  stroke-width:3;
  cursor:grab;
}

.point-dot.selected{
  stroke:#111827;
  stroke-width:4;
}

.point-hit{
  fill:transparent;
  cursor:grab;
}

.cluster-ring{
  fill:none;
  stroke:#111827;
  stroke-width:1.5;
  stroke-dasharray:4 4;
  opacity:.25;
  pointer-events:none;
}

.label-line{
  stroke-width:1.45;
  opacity:.38;
  pointer-events:none;
}

.label-group{
  cursor:grab;
}

.label-group:active,
.point-dot:active,
.point-hit:active{
  cursor:grabbing;
}

.name-pill{
  fill:rgba(255,255,255,.98);
  rx:8;
  ry:8;
}

.name-text{
  font-size:16px;
  font-weight:900;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.value-text{
  font-size:16px;
  font-weight:800;
  dominant-baseline:middle;
  pointer-events:none;
}

/*
  Tam sayılı kesir:
      1
  2  ─
      3

  Pay ve payda küçük yazılır, aradaki yatay çizgi kesir çizgisidir.
*/
.mixed-whole-text{
  font-size:16px;
  font-weight:800;
  dominant-baseline:middle;
  pointer-events:none;
}

.mixed-frac-text{
  font-size:11px;
  font-weight:800;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.mixed-frac-bar{
  stroke-width:1.5;
  stroke-linecap:round;
  pointer-events:none;
}

/* =========================================================
   a SÜRGÜSÜ
   Sayı doğrusunun altında, arada en az 40 px
========================================================= */

.slider-panel{
  position:absolute;
  left:80px;
  right:80px;
  top:310px;

  padding:14px 18px 16px;

  border-radius:0;
  background:transparent;
  border:none;
  box-shadow:none;

  z-index:8;
}

.slider-row{
  display:grid;
  grid-template-columns:auto minmax(260px,1fr) auto;
  align-items:center;
  gap:18px;
}

.slider-title{
  font-weight:800;
  white-space:nowrap;
}

.a-badge{
  min-width:70px;
  text-align:center;
  padding:8px 12px;
  border-radius:12px;

  background:#eef3ff;
  color:#174aa8;

  font-weight:800;
  font-size:18px;
}

.slider-area{
  min-width:0;

  /*
    YENİ KURAL:
    Fader'ın yatay uzunluğu önceki sürümün %50'si.
  */
  width:50%;
  justify-self:center;
}

.slider-scale{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  margin-top:5px;

  color:#7a8598;
  font-size:9px;
  text-align:center;
}

.slider-scale span{
  transform:translateX(0);
}

/* =========================================================
   ÖZEL RANGE — ESKİ MÜZİK SETİ / FADER GÖRÜNÜMÜ

   - Rayın iki tarafı da aynı renkte.
   - Sol taraf dolu/mavi görünmez.
   - Ortada koyu bir kanal vardır.
   - Başlık dikey, kalın, fiziksel bir sürgü kolu gibi görünür.
========================================================= */

.division-slider{
  width:100%;
  height:24px;

  margin:0;
  padding:0;

  background:transparent;
  outline:none;

  appearance:none;
  -webkit-appearance:none;

  cursor:pointer;
}

/* Chrome / Edge / Safari */
.division-slider::-webkit-slider-runnable-track{
  height:6px;

  border-radius:3px;

  background:
    linear-gradient(
      to bottom,
      #9aa3af 0%,
      #c3cad3 22%,
      #d9dee5 50%,
      #b8c0ca 78%,
      #8f98a5 100%
    );

  border:1px solid #7f8894;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.75),
    inset 0 -1px 2px rgba(0,0,0,.18),
    0 1px 1px rgba(255,255,255,.8);
}

/*
  Rayın tam ortasında eski cihazlardaki sürgü yuvası hissini
  veren koyu kanal görünümü, slider-area pseudo-element ile çizilir.
*/
.slider-area{
  min-width:0;
  width:50%;
  justify-self:center;
  position:relative;
}

.slider-area::before{
  content:"";

  position:absolute;

  left:0;
  right:0;

  top:10px;

  height:2px;

  border-radius:2px;

  background:#626b76;

  box-shadow:
    inset 0 1px 2px rgba(0,0,0,.55),
    0 1px 0 rgba(255,255,255,.45);

  pointer-events:none;
}

/*
  Dikey fader başlığı
*/
.division-slider::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;

  width:10px;
  height:20px;

  margin-top:-8px;

  border-radius:2px;

  border:
    1px solid
    #5c6570;

  background:
    linear-gradient(
      to right,
      #7f8894 0%,
      #cfd5dc 18%,
      #f2f4f6 46%,
      #d9dee4 68%,
      #858e99 100%
    );

  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.7),
    inset -1px 0 0 rgba(0,0,0,.12),
    0 2px 5px rgba(0,0,0,.28);

  position:relative;

  transition:
    transform .07s ease,
    box-shadow .07s ease;
}

/* Firefox */
.division-slider::-moz-range-track{
  height:6px;

  border-radius:3px;

  background:
    linear-gradient(
      to bottom,
      #9aa3af 0%,
      #c3cad3 22%,
      #d9dee5 50%,
      #b8c0ca 78%,
      #8f98a5 100%
    );

  border:1px solid #7f8894;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.75),
    inset 0 -1px 2px rgba(0,0,0,.18),
    0 1px 1px rgba(255,255,255,.8);
}

/*
  Firefox'ın sol tarafı farklı renge boyamasını açıkça engelle.
*/
.division-slider::-moz-range-progress{
  height:6px;

  border-radius:3px;

  background:
    linear-gradient(
      to bottom,
      #9aa3af 0%,
      #c3cad3 22%,
      #d9dee5 50%,
      #b8c0ca 78%,
      #8f98a5 100%
    );

  border:none;
}

.division-slider::-moz-range-thumb{
  width:10px;
  height:20px;

  border-radius:2px;

  border:1px solid #5c6570;

  background:
    linear-gradient(
      to right,
      #7f8894 0%,
      #cfd5dc 18%,
      #f2f4f6 46%,
      #d9dee4 68%,
      #858e99 100%
    );

  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.7),
    inset -1px 0 0 rgba(0,0,0,.12),
    0 2px 5px rgba(0,0,0,.28);

  transition:
    transform .07s ease,
    box-shadow .07s ease;
}

/*
  Fader başlığının ortasına ince siyah çizgi:
  eski müzik setlerinde konumu okumayı kolaylaştıran işaret.
  Native thumb içine pseudo-element eklenemediği için,
  bunu thumb'ın gölgesiyle taklit ediyoruz.
*/
.division-slider::-webkit-slider-thumb{
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.75),
    inset -1px 0 0 rgba(0,0,0,.12),
    inset 0 9px 0 -8px #3e4650,
    0 2px 5px rgba(0,0,0,.28);
}

.division-slider::-moz-range-thumb{
  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.75),
    inset -1px 0 0 rgba(0,0,0,.12),
    inset 0 9px 0 -8px #3e4650,
    0 2px 5px rgba(0,0,0,.28);
}

/*
  Snap anında kısa mekanik vurgu.
*/
.division-slider.snap-pulse::-webkit-slider-thumb{
  transform:scaleY(1.08);

  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.75),
    inset -1px 0 0 rgba(0,0,0,.12),
    inset 0 9px 0 -8px #3e4650,
    0 0 0 3px rgba(90,100,112,.12),
    0 3px 7px rgba(0,0,0,.3);
}

.division-slider.snap-pulse::-moz-range-thumb{
  transform:scaleY(1.08);

  box-shadow:
    inset 1px 0 0 rgba(255,255,255,.75),
    inset -1px 0 0 rgba(0,0,0,.12),
    inset 0 9px 0 -8px #3e4650,
    0 0 0 3px rgba(90,100,112,.12),
    0 3px 7px rgba(0,0,0,.3);
}

@media(max-width:760px){

  .app{
    padding:10px;
  }

  .clear-floating{
    top:40px;
    right:14px;
  }

  svg{
    height:450px;
  }

  .slider-panel{
    left:26px;
    right:26px;
    top:285px;
    padding:12px 12px 14px;
  }

  .slider-row{
    grid-template-columns:1fr auto;
    gap:10px 12px;
  }

  .slider-title{
    grid-column:1 / -1;
  }

  .slider-area{
    grid-column:1;
    width:50%;
    justify-self:center;
  }

  .a-badge{
    grid-column:2;
  }

  .slider-scale{
    font-size:9px;
  }
}

/* HOME */
.home-button{
  position:fixed;
  top:20px;
  left:20px;
  z-index:1000;
  text-decoration:none;
  background:white;
  padding:8px 14px;
  border-radius:8px;
  font-size:14px;
  color:black;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.home-button:hover{background:#f6f8fc;}

</style>
</head>

<body>

<a class="home-button" href="../index.html">← Home</a>


<div class="app">

  <button
    id="clearBtn"
    class="clear-floating"
    type="button"
  >
    Noktaları sil
  </button>


  <div class="panel stage">

    <svg
      id="numberLine"
      viewBox="0 0 1160 500"
      role="img"
      aria-label="-3 ile +3 arasında sayı doğrusu"
    >
      <g id="gridLayer"></g>
      <g id="pointLayer"></g>
      <g id="labelLayer"></g>
    </svg>

  <div class="slider-panel">

    <div class="slider-row">

      <div class="slider-title">
        İki tam sayı arası kaç eşit parça?
      </div>

      <div class="slider-area">

        <input
          id="divisionSlider"
          class="division-slider"
          type="range"
          min="1"
          max="12"
          step="1"
          value="4"
          aria-label="Bölme sayısı"
        >

        <div class="slider-scale" aria-hidden="true">
          <span>1</span>
          <span>2</span>
          <span>3</span>
          <span>4</span>
          <span>5</span>
          <span>6</span>
          <span>7</span>
          <span>8</span>
          <span>9</span>
          <span>10</span>
          <span>11</span>
          <span>12</span>
        </div>

      </div>

      <div
        id="aBadge"
        class="a-badge"
      >
        a = 4
      </div>

    </div>

  </div>

    <div class="hint">
      Sayı doğrusuna tıklayarak nokta ekleyin.
      Noktayı veya harfini sürükleyebilirsiniz.
      Hareket süreklidir; 1/a katlarına yaklaşınca güçlü biçimde snap olur.
      Harfe kısa tıklamak değer gösterimini değiştirir.
    </div>

  </div>




</div>


<script>
(() => {

'use strict';

/* =========================================================
   DOM
========================================================= */

const svg =
  document.getElementById('numberLine');

const gridLayer =
  document.getElementById('gridLayer');

const pointLayer =
  document.getElementById('pointLayer');

const labelLayer =
  document.getElementById('labelLayer');

const slider =
  document.getElementById('divisionSlider');

const aBadge =
  document.getElementById('aBadge');

const clearBtn =
  document.getElementById('clearBtn');


/* =========================================================
   SABİTLER
========================================================= */

const W = 1160;
const H = 500;

const LEFT = 85;
const RIGHT = 1075;

const AXIS_EXTEND = 28;

const AXIS_LEFT =
  LEFT - AXIS_EXTEND;

const AXIS_RIGHT =
  RIGHT + AXIS_EXTEND;

const AXIS_Y = 250;

const MIN = -3;
const MAX = 3;

const DOT_R = 12;

/*
  YENİ KURAL:
  İki veya daha fazla nokta tam olarak çakıştığında
  birleşik nokta HER ZAMAN camgöbeği renginde gösterilir.
*/
const OVERLAP_COLOR = '#00FFFF';

const EPS = 1e-7;

const NAME_W = 30;
const NAME_H = 28;

const LABEL_GAP = 7;

const BASE_LABEL_VERTICAL_DISTANCE = 50;

const LABEL_STAIR_GAP = 4;

/*
  Sürüklenen A'nın etiketi sabit kalırken
  yolundaki sabit B, C... etiketlerinin
  yukarı çıkacağı basamak.
*/
const DRAG_ESCAPE_Y = 38;


/*
  SNAP

  Tek bir eşik yerine iki eşik kullanıyoruz:

  1. ENGAGE:
     Nokta bölme çizgisine yeterince yaklaşınca snap olur.

  2. RELEASE:
     Snap olduktan sonra biraz daha fazla uzaklaşmadan
     yapışmayı bırakmaz.

  Bu histerezis snap'i daha belirgin hissettirir.
*/
const SNAP_ENGAGE_MAX_PX = 10;

const SNAP_RELEASE_MAX_PX = 20;


/* =========================================================
   DURUM
========================================================= */

let divisions =
  Number(
    slider.value
  );

let points = [];

let selectedId = null;

let nextPointNumber = 0;

let drag = null;

let lastSliderValue =
  Number(
    slider.value
  );

let sliderPulseTimer = null;


/* =========================================================
   RENKLER
========================================================= */

const palette = [

  {
    display:'#e53935',
    mix:'#ff0000'
  },

  {
    display:'#179447',
    mix:'#00ff00'
  },

  {
    display:'#1565c0',
    mix:'#0000ff'
  },

  {
    display:'#f57c00',
    mix:'#ff8a00'
  },

  {
    display:'#7b1fa2',
    mix:'#8a2be2'
  },

  {
    display:'#008fa8',
    mix:'#00ffff'
  },

  {
    display:'#d81b60',
    mix:'#ff1493'
  },

  {
    display:'#795548',
    mix:'#8b4513'
  },

  {
    display:'#616161',
    mix:'#808080'
  },

  {
    display:'#689f38',
    mix:'#7cb342'
  },

  {
    display:'#512da8',
    mix:'#5e35b1'
  },

  {
    display:'#c62828',
    mix:'#e53935'
  }

];


function hslToHex(
  h,
  s,
  l
){

  s /= 100;
  l /= 100;

  const c =
    (
      1
      -
      Math.abs(
        2*l - 1
      )
    )
    *
    s;

  const x =
    c
    *
    (
      1
      -
      Math.abs(
        (h/60)%2 - 1
      )
    );

  const m =
    l - c/2;

  let r = 0;
  let g = 0;
  let b = 0;


  if(h < 60){

    [
      r,
      g,
      b
    ] =
    [
      c,
      x,
      0
    ];

  }

  else if(h < 120){

    [
      r,
      g,
      b
    ] =
    [
      x,
      c,
      0
    ];

  }

  else if(h < 180){

    [
      r,
      g,
      b
    ] =
    [
      0,
      c,
      x
    ];

  }

  else if(h < 240){

    [
      r,
      g,
      b
    ] =
    [
      0,
      x,
      c
    ];

  }

  else if(h < 300){

    [
      r,
      g,
      b
    ] =
    [
      x,
      0,
      c
    ];

  }

  else{

    [
      r,
      g,
      b
    ] =
    [
      c,
      0,
      x
    ];

  }


  return (
    '#'
    +
    [
      r,
      g,
      b
    ]
    .map(
      value =>
        Math.round(          (value+m)*255
        )
        .toString(16)
        .padStart(
          2,
          '0'
        )
    )
    .join('')
  );

}


function colorForIndex(
  index
){

  if(
    index
    <
    palette.length
  ){

    return palette[index];

  }


  const h =
    (
      index
      *
      137.508
    )
    %
    360;


  return {

    display:
      hslToHex(
        h,
        72,
        42
      ),

    mix:
      hslToHex(
        h,
        88,
        50
      )

  };

}


/* =========================================================
   YARDIMCILAR
========================================================= */

function svgEl(
  name,
  attrs = {}
){

  const el =
    document.createElementNS(
      'http://www.w3.org/2000/svg',
      name
    );


  for(
    const [
      key,
      value
    ]
    of
    Object.entries(
      attrs
    )
  ){

    el.setAttribute(
      key,
      value
    );

  }


  return el;

}


function clamp(
  n,
  lo,
  hi
){

  return Math.max(
    lo,
    Math.min(
      hi,
      n
    )
  );

}


function valueToX(
  value
){

  return (
    LEFT
    +
    (
      (
        value - MIN
      )
      /
      (
        MAX - MIN
      )
    )
    *
    (
      RIGHT - LEFT
    )
  );

}


function xToValue(
  x
){

  return (
    MIN
    +
    (
      (
        x - LEFT
      )
      /
      (
        RIGHT - LEFT
      )
    )
    *
    (
      MAX - MIN
    )
  );

}


function pointName(
  index
){

  let n =
    index + 1;

  let output =
    '';


  while(
    n > 0
  ){

    n--;


    output =
      String.fromCharCode(
        65
        +
        (
          n % 26
        )
      )
      +
      output;


    n =
      Math.floor(
        n / 26
      );

  }


  return output;

}


function gcd(
  a,
  b
){

  a =
    Math.abs(
      a
    );

  b =
    Math.abs(
      b
    );


  while(
    b
  ){

    [
      a,
      b
    ] =
    [
      b,
      a % b
    ];

  }


  return a || 1;

}


/* =========================================================
   HAFİF HAPTİK GERİ BİLDİRİM
========================================================= */

function tinyVibration(
  ms = 8
){

  try{

    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        ms
      );

    }

  }
  catch(error){

    /* Desteklenmeyen tarayıcıda sessizce devam et. */

  }

}


/* =========================================================
   SNAP
========================================================= */

function snapToSubdivision(
  value
){

  const snapped =
    Math.round(
      value
      *
      divisions
    )
    /
    divisions;


  return clamp(
    snapped,
    MIN,
    MAX
  );

}


/*
  Bölme çizgileri arasındaki piksel uzaklığı.
*/
function subdivisionSpacingPx(){

  return (
    RIGHT - LEFT
  )
  /
  (
    (
      MAX - MIN
    )
    *
    divisions
  );

}


/*
  Güçlü fakat hâlâ continuous hissini koruyan snap.

  a büyüdükçe bölmeler yaklaşacağı için eşikler
  bölme aralığına göre otomatik küçülür.
*/
function applySubdivisionMagnet(
  value
){

  value =
    clamp(
      value,
      MIN,
      MAX
    );


  const spacing =
    subdivisionSpacingPx();


  const engagePx =
    Math.min(
      SNAP_ENGAGE_MAX_PX,
      spacing * 0.38
    );


  const releasePx =
    Math.min(
      SNAP_RELEASE_MAX_PX,
      spacing * 0.68
    );


  /*
    Halihazırda bir snap noktasına yapışıksa,
    release eşiği aşılana kadar orada tut.
  */
  if(
    drag
    &&
    drag.snapValue !== null
  ){

    const snappedX =
      valueToX(
        drag.snapValue
      );


    const currentX =
      valueToX(
        value
      );


    if(
      Math.abs(
        currentX
        -
        snappedX
      )
      <=
      releasePx
    ){

      return drag.snapValue;

    }


    drag.snapValue =
      null;

  }


  /*
    En yakın 1/a katını bul.
  */
  const nearest =
    Math.round(
      value
      *
      divisions
    )
    /
    divisions;


  const snappedValue =
    clamp(
      nearest,
      MIN,
      MAX
    );


  const currentX =
    valueToX(
      value
    );


  const snapX =
    valueToX(
      snappedValue
    );


  if(
    Math.abs(
      currentX
      -
      snapX
    )
    <=
    engagePx
  ){

    if(
      drag
      &&
      drag.snapValue !==
      snappedValue
    ){

      drag.snapValue =
        snappedValue;


      tinyVibration(
        9
      );

    }


    return snappedValue;

  }


  return value;

}


/* =========================================================
   KESİR / ONDALIK GÖSTERİMLERİ
========================================================= */

function pedagogicalValue(
  value
){

  return (
    Math.round(
      value
      *
      divisions
    )
    /
    divisions
  );

}


function fractionData(
  value
){

  const v =
    pedagogicalValue(
      value
    );


  let rawNum =
    Math.round(
      v
      *
      divisions
    );


  const rawDen =
    divisions;


  if(
    Math.abs(
      rawNum
    )
    <
    1e-9
  ){

    rawNum = 0;

  }


  const g =
    gcd(
      rawNum,
      rawDen
    );


  return {

    rawNum,

    rawDen,

    num:
      rawNum / g,

    den:
      rawDen / g

  };

}


function rawFractionText(
  value
){

  const {
    rawNum,
    rawDen
  } =
    fractionData(
      value
    );


  return (
    `${rawNum}/${rawDen}`
  );

}


function reducedFractionText(
  value
){

  const {
    num,
    den
  } =
    fractionData(
      value
    );


  return (
    den === 1
  )
  ?
  `${num}`
  :
  `${num}/${den}`;

}


function hasMixedNumber(
  value
){

  const {
    num,
    den
  } =
    fractionData(
      value
    );


  return (
    den !== 1
    &&
    Math.abs(
      num
    )
    >
    den
  );

}


function mixedNumberParts(
  value
){

  const {
    num,
    den
  } =
    fractionData(
      value
    );


  const sign =
    num < 0
    ?
    '-'
    :
    '';


  const absNum =
    Math.abs(
      num
    );


  const whole =
    Math.floor(
      absNum
      /
      den
    );


  const rem =
    absNum
    %
    den;


  return {

    wholeText:
      `${sign}${whole}`,

    numerator:
      rem,

    denominator:
      den

  };

}


function mixedNumberText(
  value
){

  const {
    wholeText,
    numerator,
    denominator
  } =
    mixedNumberParts(
      value
    );


  return (
    numerator === 0
  )
  ?
  wholeText
  :
  `${wholeText} ${numerator}/${denominator}`;

}


function isTerminatingDenominator(
  den
){

  let d =
    den;


  while(
    d % 2 === 0
  ){

    d /= 2;

  }


  while(
    d % 5 === 0
  ){

    d /= 5;

  }


  return (
    d === 1
  );

}


function decimalText(
  value
){

  const {
    num,
    den
  } =
    fractionData(
      value
    );


  if(
    num === 0
  ){

    return '0';

  }


  const numeric =
    num / den;


  if(
    isTerminatingDenominator(
      den
    )
  ){

    return numeric
      .toFixed(
        12
      )
      .replace(
        /0+$/,
        ''
      )
      .replace(
        /\.$/,
        ''
      )
      .replace(
        '.',
        ','
      );

  }


  const sign =
    numeric < 0
    ?
    '-'
    :
    '';


  const absNum =
    Math.abs(
      num
    );


  const whole =
    Math.floor(
      absNum
      /
      den
    );


  let remainder =
    absNum
    %
    den;


  const seen =
    new Map();


  const digits =
    [];


  let repeatStart =
    -1;


  while(
    remainder !== 0
    &&
    digits.length < 12
  ){

    if(
      seen.has(
        remainder
      )
    ){

      repeatStart =
        seen.get(
          remainder
        );

      break;

    }


    seen.set(
      remainder,
      digits.length
    );


    remainder *= 10;


    digits.push(
      Math.floor(
        remainder
        /
        den
      )
    );


    remainder %=
      den;

  }


  let shownDigits;


  if(
    repeatStart >= 0
  ){

    const prefix =
      digits.slice(
        0,
        repeatStart
      );


    const cycle =
      digits.slice(
        repeatStart
      );


    shownDigits =
      cycle.length === 1
      ?
      prefix.concat(
        [
          cycle[0],
          cycle[0],
          cycle[0]
        ]
      )
      :
      prefix.concat(
        cycle
      );

  }

  else{

    shownDigits =
      digits;

  }


  return (
    `${sign}${whole},${shownDigits.join('')}...`
  );

}


function availableFormats(
  point
){

  const formats =
    [
      'raw',
      'reduced'
    ];


  if(
    hasMixedNumber(
      point.value
    )
  ){

    formats.push(
      'mixed'
    );

  }


  formats.push(
    'decimal'
  );


  return formats;

}


function normalizePointFormat(
  point
){

  const formats =
    availableFormats(
      point
    );


  if(
    !formats.includes(
      point.format
    )
  ){

    point.format =
      'raw';

  }

}


function cyclePointFormat(
  point
){

  normalizePointFormat(
    point
  );


  const formats =
    availableFormats(
      point
    );


  const i =
    formats.indexOf(
      point.format
    );


  point.format =
    formats[
      (
        i + 1
      )
      %
      formats.length
    ];

}


function formattedPointValue(
  point
){

  normalizePointFormat(
    point
  );


  switch(    point.format
  ){

    case 'reduced':

      return reducedFractionText(
        point.value
      );


    case 'mixed':

      return mixedNumberText(
        point.value
      );


    case 'decimal':

      return decimalText(
        point.value
      );


    default:

      return rawFractionText(
        point.value
      );

  }

}

function clusterMap(){

  const map =
    new Map();


  for(
    const point
    of
    points
  ){

    const key =
      point.value
      .toFixed(
        7
      );


    if(
      !map.has(
        key
      )
    ){

      map.set(
        key,
        []
      );

    }


    map.get(
      key
    )
    .push(
      point
    );

  }


  return map;

}


function screenBlend(
  hexColors
){

  if(
    hexColors.length === 1
  ){

    return hexColors[0];

  }


  let r = 0;
  let g = 0;
  let b = 0;


  for(
    const hex
    of
    hexColors
  ){

    const rr =
      parseInt(
        hex.slice(
          1,
          3
        ),
        16
      )
      /
      255;


    const gg =
      parseInt(
        hex.slice(
          3,
          5
        ),
        16
      )
      /
      255;


    const bb =
      parseInt(
        hex.slice(
          5,
          7
        ),
        16
      )
      /
      255;


    r =
      1
      -
      (
        1 - r
      )
      *
      (
        1 - rr
      );


    g =
      1
      -
      (
        1 - g
      )
      *
      (
        1 - gg
      );


    b =
      1
      -
      (
        1 - b
      )
      *
      (
        1 - bb
      );

  }


  return (
    '#'
    +
    [
      r,
      g,
      b
    ]
    .map(
      c =>
        Math.round(
          c * 255
        )
        .toString(
          16
        )
        .padStart(
          2,
          '0'
        )
    )
    .join('')
  );

}


/* =========================================================
   ETİKET GEOMETRİSİ
========================================================= */

function estimateTextWidth(
  text
){

  return Math.max(
    18,
    text.length * 9
  );

}


function fullLabelRect(
  cx,
  cy,
  valueString
){

  const valueW =
    estimateTextWidth(
      `= ${valueString}`
    );


  return {

    x1:
      cx
      -
      NAME_W / 2,

    x2:
      cx
      +
      NAME_W / 2
      +
      LABEL_GAP
      +
      valueW,

    y1:
      cy
      -
      NAME_H / 2
      -
      3,

    y2:
      cy
      +
      NAME_H / 2
      +
      3

  };

}


function rectsOverlap(
  a,
  b,
  pad = 0
){

  return !(

    a.x2 + pad < b.x1

    ||

    a.x1 - pad > b.x2

    ||

    a.y2 + pad < b.y1

    ||

    a.y1 - pad > b.y2

  );

}


/* =========================================================
   SABİT ETİKETLERİN NORMAL MERDİVEN DÜZENİ
========================================================= */

function layoutStationaryPoints(
  stationaryPoints
){

  const result =
    new Map();


  const occupied =
    [];


  const ordered =
    [
      ...stationaryPoints
    ]
    .sort(
      (
        a,
        b
      ) => {

        if(
          Math.abs(
            a.value
            -
            b.value
          )
          <
          EPS
        ){

          return (
            points.indexOf(
              a
            )
            -
            points.indexOf(
              b
            )
          );

        }


        return (
          a.value
          -
          b.value
        );

      }
    );


  for(
    const point
    of
    ordered
  ){

    const cx =
      valueToX(
        point.value
      );


    const valueString =
      formattedPointValue(
        point
      );


    let cy =
      AXIS_Y
      -
      BASE_LABEL_VERTICAL_DISTANCE;


    let rect =
      fullLabelRect(
        cx,
        cy,
        valueString
      );


    let changed =
      true;


    while(
      changed
    ){

      changed =
        false;


      for(
        const prev
        of
        occupied
      ){

        if(
          !rectsOverlap(
            rect,
            prev.rect
          )
        ){

          continue;

        }


        const halfH =
          (
            rect.y2
            -
            rect.y1
          )
          /
          2;


        cy =
          prev.rect.y1
          -
          LABEL_STAIR_GAP
          -
          halfH;


        rect =
          fullLabelRect(
            cx,
            cy,
            valueString
          );


        changed =
          true;


        break;

      }

    }


    result.set(
      point.id,
      {

        cx,

        cy,

        rect

      }
    );


    occupied.push(
      {

        pointId:
          point.id,

        rect

      }
    );

  }


  return result;

}


/* =========================================================
   SÜRÜKLENEN ETİKETE YOL VERME
========================================================= */

function makeLabelLayout(){

  const activeDraggedId =
    (
      drag
      &&
      drag.moved
    )
    ?
    drag.pointId
    :
    null;


  const draggedPoint =
    activeDraggedId === null
    ?
    null
    :
    points.find(
      point =>
        point.id
        ===
        activeDraggedId
    );


  const stationaryPoints =
    points.filter(
      point =>
        point.id
        !==
        activeDraggedId
    );


  const result =
    layoutStationaryPoints(
      stationaryPoints
    );


  if(
    !draggedPoint
  ){

    return result;

  }


  /*
    Sürüklenen A'nın etiketi:
    - sadece yatay hareket eder
    - yüksekliği değişmez
  */
  const draggedCx =
    valueToX(
      draggedPoint.value
    );


  const draggedCy =
    AXIS_Y
    -
    BASE_LABEL_VERTICAL_DISTANCE;


  const draggedRect =
    fullLabelRect(
      draggedCx,
      draggedCy,
      formattedPointValue(
        draggedPoint
      )
    );


  result.set(
    draggedPoint.id,
    {

      cx:
        draggedCx,

      cy:
        draggedCy,

      rect:
        draggedRect

    }
  );


  /*
    Aynı fiziksel konumdaki sabit noktaları grupla.
    B=C gibi bir grup birlikte yukarı kalkar.
  */
  const groups =
    new Map();


  for(
    const point
    of
    stationaryPoints
  ){

    const key =
      point.value
      .toFixed(
        7
      );


    if(
      !groups.has(
        key
      )
    ){

      groups.set(
        key,
        []
      );

    }


    groups.get(
      key
    )
    .push(
      point
    );

  }


  const groupsToLift =
    [];


  for(
    const group
    of
    groups.values()
  ){

    const hit =
      group.some(
        point => {

          const layout =
            result.get(
              point.id
            );


          return (
            layout
            &&
            rectsOverlap(
              layout.rect,
              draggedRect
            )
          );

        }
      );


    if(
      hit
    ){

      groupsToLift.push(
        group
      );

    }

  }


  /*
    Yol verme:
    Sürüklenen A sabit kalır,
    çakışan sabit grup yukarı çıkar.
  */
  for(
    const group
    of
    groupsToLift
  ){

    let lift =
      DRAG_ESCAPE_Y;


    while(
      true
    ){

      const candidateRects =
        group.map(
          point => {

            const layout =
              result.get(
                point.id
              );


            return {

              pointId:
                point.id,

              rect:{

                x1:
                  layout.rect.x1,

                x2:
                  layout.rect.x2,

                y1:
                  layout.rect.y1
                  -
                  lift,
                y2:
                  layout.rect.y2
                  -
                  lift

              }

            };

          }
        );


      const hitsDragged =
        candidateRects.some(
          candidate =>
            rectsOverlap(
              candidate.rect,
              draggedRect
            )
        );


      if(
        hitsDragged
      ){

        lift +=
          DRAG_ESCAPE_Y;


        continue;

      }


      const hitsOther =
        candidateRects.some(
          candidate =>

            stationaryPoints.some(
              other => {

                if(
                  group.some(
                    member =>
                      member.id
                      ===
                      other.id
                  )
                ){

                  return false;

                }


                const otherLayout =
                  result.get(
                    other.id
                  );


                if(
                  !otherLayout
                ){

                  return false;

                }


                return rectsOverlap(
                  candidate.rect,
                  otherLayout.rect
                );

              }
            )
        );


      if(
        hitsOther
      ){

        lift +=
          DRAG_ESCAPE_Y;


        continue;

      }


      break;

    }


    for(
      const point
      of
      group
    ){

      const layout =
        result.get(
          point.id
        );


      result.set(
        point.id,
        {

          cx:
            layout.cx,

          cy:
            layout.cy
            -
            lift,

          rect:{

            x1:
              layout.rect.x1,

            x2:
              layout.rect.x2,

            y1:
              layout.rect.y1
              -
              lift,

            y2:
              layout.rect.y2
              -
              lift

          }

        }
      );

    }

  }


  return result;

}

            centerY,

          x2:
            fractionCenterX
            +
            fractionWidth / 2,

          y2:
            centerY,

          stroke:
            point.color,

          class:
            'mixed-frac-bar'

        }
      );


    group.appendChild(
      bar
    );


    const denominatorEl =
      svgEl(
        'text',
        {

          x:
            fractionCenterX,

          y:
            centerY + 9,

          fill:
            point.color,

          class:
            'mixed-frac-text'

        }
      );


    denominatorEl.textContent =
      denominatorText;


    group.appendChild(
      denominatorEl
    );


    return;
  }


  const value =
    svgEl(
      'text',
      {

        x:
          startX,

        y:
          centerY,

        fill:
          point.color,

        class:
          'value-text',

        'text-anchor':
          'start'

      }
    );


  value.textContent =
    `= ${formattedPointValue(point)}`;


  group.appendChild(
    value
  );

}


/* =========================================================
   ÇİZİM
========================================================= */

function renderPoints(){

  pointLayer.replaceChildren();

  labelLayer.replaceChildren();


  const clusters =
    clusterMap();


  const labelLayout =
    makeLabelLayout();


  /* ---------- fiziksel noktalar ---------- */

  for(
    const cluster
    of
    clusters.values()
  ){

    const x =
      valueToX(
        cluster[0].value
      );


    const blended =
      cluster.length === 1
      ?
      cluster[0].color
      :
      OVERLAP_COLOR;


    const selectedInCluster =
      cluster.some(
        point =>
          point.id
          ===
          selectedId
      );


    if(
      cluster.length > 1
    ){

      pointLayer.appendChild(

        svgEl(
          'circle',
          {

            cx:x,

            cy:
              AXIS_Y,

            r:
              DOT_R + 6,

            class:
              'cluster-ring'

          }
        )

      );

    }


    const hit =
      svgEl(
        'circle',
        {

          cx:x,

          cy:
            AXIS_Y,

          r:
            DOT_R + 9,

          class:
            'point-hit'

        }
      );


    hit.dataset.clusterValue =
      String(
        cluster[0].value
      );


    hit.addEventListener(
      'pointerdown',
      onClusterPointerDown
    );


    pointLayer.appendChild(
      hit
    );


    const dot =
      svgEl(
        'circle',
        {

          cx:x,

          cy:
            AXIS_Y,

          r:
            DOT_R,

          fill:
            blended,

          class:
            'point-dot'
            +
            (
              selectedInCluster
              ?
              ' selected'
              :
              ''
            )

        }
      );


    dot.dataset.clusterValue =
      String(
        cluster[0].value
      );


    dot.addEventListener(
      'pointerdown',
      onClusterPointerDown
    );


    pointLayer.appendChild(
      dot
    );

  }


  /* ---------- harf + değer ---------- */

  for(
    const point
    of
    points
  ){

    const layout =
      labelLayout.get(
        point.id
      );


    if(
      !layout
    ){

      continue;

    }


    const pointX =
      valueToX(
        point.value
      );


    const group =
      svgEl(
        'g',
        {

          class:
            'label-group'

        }
      );


    group.dataset.pointId =
      String(
        point.id
      );


    group.addEventListener(
      'pointerdown',
      onLabelPointerDown
    );


    group.appendChild(

      svgEl(
        'line',
        {

          x1:
            pointX,

          y1:
            AXIS_Y,

          x2:
            layout.cx,

          y2:
            layout.cy,

          stroke:
            point.color,

          class:
            'label-line'

        }
      )

    );


    group.appendChild(

      svgEl(
        'rect',
        {

          x:
            layout.cx
            -
            NAME_W / 2,

          y:
            layout.cy
            -
            NAME_H / 2,

          width:
            NAME_W,

          height:
            NAME_H,

          fill:
            'white',

          stroke:
            point.color,

          'stroke-width':
            point.id
            ===
            selectedId
            ?
            3
            :
            1.6,

          class:
            'name-pill'

        }
      )

    );


    const name =
      svgEl(
        'text',
        {

          x:
            layout.cx,

          y:
            layout.cy + 1,

          fill:
            point.color,

          class:
            'name-text'

        }
      );


    name.textContent =
      point.name;


    group.appendChild(
      name
    );


    appendPointValueDisplay(
      group,
      point,
      layout
    );


    labelLayer.appendChild(
      group
    );

  }

}


function renderAll(){

  aBadge.textContent =
    `a = ${divisions}`;


  renderGrid();

  renderPoints();

}


/* =========================================================
   POINTER
========================================================= */

function svgPointFromEvent(
  event
){

  const point =
    svg.createSVGPoint();


  point.x =
    event.clientX;


  point.y =
    event.clientY;


  const ctm =
    svg.getScreenCTM();


  return (
    ctm
  )
  ?
  point.matrixTransform(
    ctm.inverse()
  )
  :
  {

    x:
      event.clientX,

    y:
      event.clientY

  };

}


/* =========================================================
   NOKTA EKLE
========================================================= */

function addPointAtX(
  x
){

  const value =
    snapToSubdivision(

      xToValue(

        clamp(
          x,
          LEFT,
          RIGHT
        )

      )

    );


  const colorSpec =
    colorForIndex(
      points.length
    );


  const point = {

    id:
      Date.now()
      +
      Math.random(),

    name:
      pointName(
        nextPointNumber++
      ),

    color:
      colorSpec.display,

    mixColor:
      colorSpec.mix,

    value,

    format:
      'raw'

  };


  points.push(
    point
  );


  selectedId =
    point.id;


  renderPoints();

}


function onEmptyPointerDown(
  event
){

  if(
    event.pointerType ===
    'mouse'
    &&
    event.button !== 0
  ){

    return;

  }


  const point =
    svgPointFromEvent(
      event
    );


  if(

    point.x >=
    LEFT - 20

    &&

    point.x <=
    RIGHT + 20

    &&

    Math.abs(
      point.y
      -
      AXIS_Y
    )
    <=
    62

  ){

    event.preventDefault();


    addPointAtX(
      point.x
    );

  }

}


/* =========================================================
   SÜRÜKLEME
========================================================= */

function startDrag(
  pointId,
  event,
  source
){

  const point =
    points.find(
      item =>
        item.id
        ===
        pointId
    );


  if(
    !point
  ){

    return;

  }


  selectedId =
    pointId;


  drag = {

    pointId,

    pointerId:
      event.pointerId,

    source,

    moved:
      false,

    startClientX:
      event.clientX,

    startClientY:
      event.clientY,

    /*
      Güçlü snap için histerezis durumu.
    */
    snapValue:
      null

  };


  event.currentTarget
    .setPointerCapture?.(
      event.pointerId
    );


  document.addEventListener(
    'pointermove',
    onPointerMove,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointerup',
    onPointerUp,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointercancel',
    onPointerUp,
    {
      passive:false
    }
  );


  renderPoints();

}


function onLabelPointerDown(
  event
){

  if(
    event.pointerType ===
    'mouse'
    &&
    event.button !== 0
  ){

    return;

  }


  event.stopPropagation();

  event.preventDefault();


  startDrag(

    Number(
      event.currentTarget
        .dataset
        .pointId
    ),

    event,

    'label'

  );

}


function onClusterPointerDown(
  event
){

  if(
    event.pointerType ===
    'mouse'
    &&
    event.button !== 0
  ){

    return;

  }


  event.stopPropagation();

  event.preventDefault();


  const value =
    Number(
      event.currentTarget
        .dataset
        .clusterValue
    );


  const cluster =
    points.filter(
      point =>
        Math.abs(
          point.value
          -
          value
        )
        <
        EPS
    );


  if(
    cluster.length === 1
  ){

    startDrag(
      cluster[0].id,
      event,
      'dot'
    );


    return;

  }


  const selected =
    cluster.find(
      point =>
        point.id
        ===
        selectedId
    );


  if(
    selected
  ){

    startDrag(
      selected.id,
      event,
      'dot'
    );

  }

}


function onPointerMove(
  event
){

  if(
    !drag
    ||
    event.pointerId
    !==
    drag.pointerId
  ){

    return;

  }


  event.preventDefault();


  const dx =
    event.clientX
    -
    drag.startClientX;


  const dy =
    event.clientY
    -
    drag.startClientY;


  if(
    Math.hypot(
      dx,
      dy
    )
    >
    4
  ){

    drag.moved =
      true;

  }


  if(
    !drag.moved
  ){

    return;

  }


  const pointer =
    svgPointFromEvent(
      event
    );


  const point =
    points.find(
      item =>
        item.id
        ===
        drag.pointId
    );

  if(
    !point
  ){

    return;

  }


  let newValue =
    xToValue(

      clamp(
        pointer.x,
        LEFT,
        RIGHT
      )

    );


  newValue =
    applySubdivisionMagnet(
      newValue
    );


  if(
    Math.abs(
      point.value
      -
      newValue
    )
    >
    EPS
  ){

    point.value =
      newValue;


    normalizePointFormat(
      point
    );


    renderPoints();

  }

}


function cleanupDragListeners(){

  document.removeEventListener(
    'pointermove',
    onPointerMove
  );


  document.removeEventListener(
    'pointerup',
    onPointerUp
  );


  document.removeEventListener(
    'pointercancel',
    onPointerUp
  );

}


function onPointerUp(
  event
){

  if(
    !drag
    ||
    event.pointerId
    !==
    drag.pointerId
  ){

    return;

  }


  const finished =
    drag;


  drag =
    null;


  cleanupDragListeners();


  if(
    finished.source ===
    'label'
    &&
    !finished.moved
  ){

    const point =
      points.find(
        item =>
          item.id
          ===
          finished.pointId
      );


    if(
      point
    ){

      cyclePointFormat(
        point
      );

    }

  }


  /*
    Drag bitince geçici yol verme davranışı kalkar.
  */
  renderPoints();

}


/* =========================================================
   a SÜRGÜSÜ SNAP GERİ BİLDİRİMİ
========================================================= */

function pulseSliderSnap(){

  slider.classList.remove(
    'snap-pulse'
  );


  /*
    Reflow:
    ardışık snaplerde animasyon yeniden başlasın.
  */
  void slider.offsetWidth;


  slider.classList.add(
    'snap-pulse'
  );


  if(
    sliderPulseTimer
  ){

    clearTimeout(
      sliderPulseTimer
    );

  }


  sliderPulseTimer =
    setTimeout(
      () => {

        slider.classList.remove(
          'snap-pulse'
        );

      },
      90
    );

}


/* =========================================================
   KONTROLLER
========================================================= */

slider.addEventListener(
  'input',
  () => {

    const newValue =
      Number(
        slider.value
      );


    /*
      Range zaten step=1 olduğu için matematiksel olarak
      1,2,3...12 konumlarına snap olur.

      Buna görsel + hafif haptik vurgu ekliyoruz.
    */
    if(
      newValue
      !==
      lastSliderValue
    ){

      lastSliderValue =
        newValue;


      pulseSliderSnap();


      tinyVibration(
        7
      );

    }


    divisions =
      newValue;


    for(
      const point
      of
      points
    ){

      normalizePointFormat(
        point
      );

    }


    renderAll();

  }
);


clearBtn.addEventListener(
  'click',
  () => {

    points =
      [];


    selectedId =
      null;


    nextPointNumber =
      0;


    renderPoints();

  }
);


renderAll();

})();
</script>
