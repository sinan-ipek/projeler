<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zihinden 3'e Bölme</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #17304a;
        background:
            radial-gradient(circle at top, #ffffff 0%, #eef7ff 52%, #dcecf8 100%);
    }

    .app {
        width: min(900px, 96vw);
        margin: 0 auto;
        padding: 24px 15px 50px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px;
        font-size: clamp(25px, 4vw, 38px);
    }

    .subtitle {
        margin-bottom: 20px;
        color: #66788b;
        font-size: 16px;
    }

    #equation {
        min-height: 95px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 13px;
        font-size: clamp(31px, 6vw, 50px);
        font-weight: 700;
        white-space: nowrap;
    }

    #answerBox {
        width: 105px;
        height: 72px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 4px dashed #8aa6bd;
        border-radius: 19px;
        color: #176fbc;
        background: rgba(255, 255, 255, .65);
        transition:
            background .3s ease,
            border-color .3s ease,
            transform .3s ease,
            box-shadow .3s ease;
    }

    #answerBox.filled {
        border-style: solid;
        border-color: #2e8dd7;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(35, 126, 197, .20);
        animation: answerBounce .55s ease;
    }

    @keyframes answerBounce {
        0%   { transform: scale(.65); }
        55%  { transform: scale(1.18); }
        100% { transform: scale(1); }
    }

    #stage {
        position: relative;
        width: 100%;
        min-height: 500px;
        overflow: hidden;
        border: 1px solid rgba(70, 120, 160, .08);
        border-radius: 28px;
        background: rgba(255, 255, 255, .74);
        box-shadow: 0 12px 35px rgba(35, 77, 110, .12);
    }

    .blob {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: pointer;
        font-weight: 700;
        color: #133b5d;
        border: 3px solid rgba(55, 144, 211, .68);
        background:
            radial-gradient(circle at 34% 28%,
                #ffffff 0%,
                #ddf5ff 27%,
                #8ed6fa 68%,
                #55b6e7 100%);
        box-shadow:
            inset -8px -10px 18px rgba(33, 127, 188, .16),
            inset 8px 8px 16px rgba(255, 255, 255, .70),
            0 10px 20px rgba(43, 120, 170, .17);
        transition:
            left .65s cubic-bezier(.18, .85, .28, 1.15),
            top .65s cubic-bezier(.18, .85, .28, 1.15),
            width .38s ease,
            height .38s ease,
            font-size .38s ease,
            transform .65s ease,
            opacity .35s ease,
            border-radius .45s ease;
    }

    .blob:hover {
        filter: brightness(1.03);
    }

    #sourceBlob {
        left: 50%;
        top: 125px;
        z-index: 10;
        width: 165px;
        height: 120px;
        transform: translate(-50%, -50%);
        border-radius: 52% 48% 58% 42% / 46% 55% 45% 54%;
        font-size: 45px;
    }

    #sourceBlob:hover {
        transform: translate(-50%, -50%) scale(1.06);
    }

    #sourceBlob.breaking {
        pointer-events: none;
        animation: sourceBreak .42s ease forwards;
    }

    @keyframes sourceBreak {
        0% {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        45% {
            transform: translate(-50%, -50%) scale(1.18);
        }
        100% {
            transform: translate(-50%, -50%) scale(.15);
            opacity: 0;
        }
    }

    .partBlob {
        top: 220px;
        width: 155px;
        height: 112px;
        opacity: 0;
        pointer-events: none;
        font-size: 40px;
    }

    #leftBlob {
        left: 27%;
        border-radius: 60% 40% 52% 48% / 48% 58% 42% 52%;
    }

    #rightBlob {
        left: 73%;
        border-radius: 44% 56% 61% 39% / 56% 43% 57% 44%;
    }

    .partBlob.active {
        opacity: 1;
        pointer-events: auto;
    }

    /* Bölme sonucu damla yalnızca biraz küçülür. */
    .partBlob.divided {
        width: 138px;
        height: 99px;
        border-radius: 54% 46% 51% 49% / 54% 43% 57% 46%;
        font-size: 36px;
    }

    .partBlob.ready {
        animation: readyBlob 1.2s ease-in-out infinite;
    }

    @keyframes readyBlob {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50%      { transform: translate(-50%, -50%) scale(1.055); }
    }

    .shrinking {
        pointer-events: none;
        animation: shrinkDrop .48s ease forwards;
    }

    @keyframes shrinkDrop {
        0%   { transform: translate(-50%, -50%) scale(1); }
        35%  { transform: translate(-50%, -50%) scale(1.08, .96) rotate(3deg); }
        72%  { transform: translate(-50%, -50%) scale(.88, 1.04) rotate(-3deg); }
        100% { transform: translate(-50%, -50%) scale(.94); }
    }

    .newSmallDrop {
        animation: smallDropAppear .45s ease;
    }

    @keyframes smallDropAppear {
        0%   { transform: translate(-50%, -50%) scale(.88, 1.08); }
        55%  { transform: translate(-50%, -50%) scale(1.06, .96); }
        100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* =====================================================
       MATEMATİKSEL SU SİMÜLASYONU
    ===================================================== */

    #fluidLayer {
        position: absolute;
        left: 50%;
        top: 335px;
        z-index: 30;
        width: min(560px, 92%);
        height: 210px;
        transform: translate(-50%, -50%);
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s ease;
    }

    #fluidLayer.visible {
        opacity: 1;
    }

    #fluidLayer.clickable {
        cursor: pointer;
        pointer-events: auto;
    }

    #fluidCanvas {
        width: 100%;
        height: 100%;
        display: block;
    }

    #fluidLayer.clickable:hover {
        filter: brightness(1.025);
    }

    .flyingFinal {
        position: fixed;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 145px;
        height: 105px;
        pointer-events: none;
        border: 3px solid rgba(55, 144, 211, .68);
        border-radius: 58% 42% 51% 49% / 46% 57% 43% 54%;
        color: #133b5d;
        background:
            radial-gradient(circle at 34% 28%,
                #ffffff 0%,
                #ddf5ff 27%,
                #8ed6fa 68%,
                #55b6e7 100%);
        box-shadow: 0 10px 20px rgba(43, 120, 170, .22);
        font-size: 42px;
        font-weight: 700;
    }

    #instruction {
        position: absolute;
        right: 0;
        bottom: 22px;
        left: 0;
        padding: 0 20px;
        color: #647688;
        font-size: 17px;
        font-weight: 600;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    button,
    .home-link {
        border: none;
        padding: 12px 23px;
        border-radius: 13px;
        cursor: pointer;
        font: 700 16px Arial, Helvetica, sans-serif;
        transition: transform .18s ease, box-shadow .18s ease;
    }

    button:hover,
    .home-link:hover {
        transform: translateY(-2px);
    }

    #newQuestionButton {
        color: #ffffff;
        background: #287fd2;
        box-shadow: 0 5px 14px rgba(40, 127, 210, .24);
    }

    #exampleButton,
    .home-link {
        color: #34495c;
        background: #eef2f6;
    }

    .home-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }

    @media (max-width: 600px) {
        #equation {
            gap: 8px;
        }

        #answerBox {
            width: 82px;
            height: 60px;
        }

        #stage {
            min-height: 480px;
        }

        #sourceBlob {
            width: 145px;
            height: 105px;
            font-size: 39px;
        }

        .partBlob {
            width: 125px;
            height: 94px;
            font-size: 33px;
        }

        #leftBlob {
            left: 24%;
        }

        #rightBlob {
            left: 76%;
        }

        .partBlob.divided {
            width: 114px;
            height: 85px;
            font-size: 31px;
        }

        #fluidLayer {
            width: 100%;
            height: 190px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;
            scroll-behavior: auto !important;
        }
    }
</style>
</head>

<body>
<div class="app">
    <h1>Zihinden 3'e Bölme</h1>

    <div class="subtitle">
        Sayıyı uygun parçalara ayır ve zihinden böl.
    </div>

    <div id="equation">
        <span id="equationNumber">165</span>
        <span>:</span>
        <span>3</span>
        <span>=</span>
        <span id="answerBox"><span id="answerText"></span></span>
    </div>

    <div id="stage">
        <div id="sourceBlob" class="blob">165</div>
        <div id="leftBlob" class="blob partBlob">150</div>
        <div id="rightBlob" class="blob partBlob">15</div>

        <div
            id="fluidLayer"
            role="button"
            tabindex="-1"
            aria-label="Birleşmiş sonuç damlası"
        >
            <canvas id="fluidCanvas"></canvas>
        </div>

        <div id="instruction" aria-live="polite">165'e tıkla.</div>
    </div>

    <div class="controls">
        <button id="newQuestionButton">Yeni Soru</button>
        <button id="exampleButton">165 Örneği</button>
        <a class="home-link" href="../index.html">Ana Sayfa</a>
    </div>
</div>

<script>
    const sourceBlob = document.getElementById("sourceBlob");
    const leftBlob = document.getElementById("leftBlob");
    const rightBlob = document.getElementById("rightBlob");
    const fluidLayer = document.getElementById("fluidLayer");
    const fluidCanvas = document.getElementById("fluidCanvas");
    const fluidContext = fluidCanvas.getContext("2d", { alpha: true });
    const equationNumber = document.getElementById("equationNumber");
    const answerBox = document.getElementById("answerBox");
    const answerText = document.getElementById("answerText");
    const instruction = document.getElementById("instruction");
    const newQuestionButton = document.getElementById("newQuestionButton");
    const exampleButton = document.getElementById("exampleButton");

    let originalNumber = 165;
    let leftNumber = 150;
    let rightNumber = 15;
    let leftResult = 50;
    let rightResult = 5;
    let finalResult = 55;

    let hasSplit = false;
    let leftDivided = false;
    let rightDivided = false;
    let mergeStarted = false;
    let completed = false;
    let busy = false;

    let fluidAnimationId = 0;
    let fluidStartTime = 0;
    let fluidSettled = false;
    let fluidInitialHalfDistance = 119;
    let fluidBaseRadius = 48;

    /*
        Simülasyon, düşük çözünürlüklü görünmez bir tuvalde hesaplanır.
        Sonra ana tuvale yumuşatılarak büyütülür. Bu yöntem telefonda da
        akıcı çalışırken sınırın pürüzsüz görünmesini sağlar.
    */
    const simulationCanvas = document.createElement("canvas");
    const simulationContext = simulationCanvas.getContext("2d", { alpha: true });
    const SIMULATION_WIDTH = 420;
    const SIMULATION_HEIGHT = 158;

    simulationCanvas.width = SIMULATION_WIDTH;
    simulationCanvas.height = SIMULATION_HEIGHT;

    const simulationImage = simulationContext.createImageData(
        SIMULATION_WIDTH,
        SIMULATION_HEIGHT
    );

    function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
    }

    function smoothStep(edge0, edge1, value) {
        const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return amount * amount * (3 - 2 * amount);
    }

    function easeInOutCubic(value) {
        return value < .5
            ? 4 * value * value * value
            : 1 - Math.pow(-2 * value + 2, 3) / 2;
    }

    function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
    }

    function calculateParts(number) {
        let firstPart = Math.floor(number / 30) * 30;

        if (firstPart === number) {
            firstPart -= 30;
        }

        return [firstPart, number - firstPart];
    }

    function resetPartBlob(element, value, targetLeft) {
        element.className = "blob partBlob";
        element.textContent = value;
        element.style.left = targetLeft;
        element.style.top = "220px";
        element.style.opacity = "0";
        element.style.pointerEvents = "none";
        element.style.transform = "translate(-50%, -50%)";
    }

    function stopFluidSimulation() {
        if (fluidAnimationId) {
            cancelAnimationFrame(fluidAnimationId);
        }

        fluidAnimationId = 0;
        fluidSettled = false;
        fluidLayer.className = "";
        fluidLayer.tabIndex = -1;
        fluidContext.clearRect(0, 0, fluidCanvas.width, fluidCanvas.height);
    }

    function setupQuestion(number) {
        originalNumber = number;

        const parts = calculateParts(number);
        leftNumber = parts[0];
        rightNumber = parts[1];
        leftResult = leftNumber / 3;
        rightResult = rightNumber / 3;
        finalResult = originalNumber / 3;

        hasSplit = false;
        leftDivided = false;
        rightDivided = false;
        mergeStarted = false;
        completed = false;
        busy = false;

        stopFluidSimulation();

        equationNumber.textContent = originalNumber;
        answerText.textContent = "";
        answerBox.classList.remove("filled");

        sourceBlob.textContent = originalNumber;
        sourceBlob.className = "blob";
        sourceBlob.style.opacity = "1";
        sourceBlob.style.pointerEvents = "auto";
        sourceBlob.style.transform = "translate(-50%, -50%)";

        resetPartBlob(leftBlob, leftNumber, "27%");
        resetPartBlob(rightBlob, rightNumber, "73%");

        instruction.textContent = originalNumber + "'e tıkla.";

        document.querySelectorAll(".flyingFinal").forEach(element => {
            element.remove();
        });
    }

    function prepareFlyingPart(element) {
        element.classList.add("active");
        element.style.left = "50%";
        element.style.top = "125px";
        element.style.opacity = "1";
        element.style.pointerEvents = "none";
        element.style.transform = "translate(-50%, -50%) scale(.25)";
    }

    function splitNumber() {
        if (hasSplit || busy) {
            return;
        }

        hasSplit = true;
        busy = true;
        instruction.textContent = "Sayı iki parçaya ayrılıyor.";

        sourceBlob.classList.add("breaking");
        prepareFlyingPart(leftBlob);
        prepareFlyingPart(rightBlob);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                leftBlob.style.left = "27%";
                leftBlob.style.top = "235px";
                leftBlob.style.transform =
                    "translate(-50%, -50%) rotate(-7deg)";

                rightBlob.style.left = "73%";
                rightBlob.style.top = "235px";
                rightBlob.style.transform =
                    "translate(-50%, -50%) rotate(7deg)";
            });
        });

        setTimeout(() => {
            leftBlob.style.transform = "translate(-50%, -50%)";
            rightBlob.style.transform = "translate(-50%, -50%)";
            leftBlob.style.pointerEvents = "auto";
            rightBlob.style.pointerEvents = "auto";
            busy = false;
            instruction.textContent = "İstediğin parçaya tıkla.";
        }, 720);
    }

    function handlePartClick(side) {
        if (!hasSplit || busy || mergeStarted) {
            return;
        }

        const isLeft = side === "left";
        const divided = isLeft ? leftDivided : rightDivided;

        if (!divided) {
            divideBlob(side);
            return;
        }

        if (leftDivided && rightDivided) {
            mergeDrops();
            return;
        }

        instruction.textContent = "Önce diğer parçayı da 3'e böl.";
    }

    function divideBlob(side) {
        busy = true;

        const isLeft = side === "left";
        const element = isLeft ? leftBlob : rightBlob;
        const result = isLeft ? leftResult : rightResult;

        element.classList.add("shrinking");
        element.style.pointerEvents = "none";

        setTimeout(() => {
            element.classList.remove("shrinking");
            element.classList.add("divided");
            element.textContent = result;
            element.classList.add("newSmallDrop");

            if (isLeft) {
                leftDivided = true;
            }
            else {
                rightDivided = true;
            }

            setTimeout(() => {
                element.classList.remove("newSmallDrop");
                element.style.pointerEvents = "auto";
                busy = false;
                checkBothDivided();
            }, 440);
        }, 470);
    }

    function checkBothDivided() {
        if (leftDivided && rightDivided) {
            leftBlob.classList.add("ready");
            rightBlob.classList.add("ready");
            instruction.textContent =
                "Şimdi iki damladan birine tekrar tıkla.";
        }
        else {
            instruction.textContent = "Diğer parçayı da 3'e böl.";
        }
    }

    function sizeFluidCanvas() {
        const rectangle = fluidLayer.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        fluidCanvas.width = Math.max(1, Math.round(rectangle.width * pixelRatio));
        fluidCanvas.height = Math.max(1, Math.round(rectangle.height * pixelRatio));
    }

    /*
        Damlanın örtük yüzeyi:

                    r⁴
        F(x,y) = Σ ─────────────
                  (d² + ε)²

        F = 1 sınırı, görünen su yüzeyidir. İki alan birbirine değince
        arada matematiksel olarak kendiliğinden bir boyun oluşur.

        scaleX * scaleY = 1 tutulduğu için titreşim sırasında yaklaşık
        alan, yani iki boyutlu hacim korunur.
    */
    function fluidField(x, y, state) {
        let value = 0;

        for (const drop of state.drops) {
            const localX = (x - drop.x) / state.scaleX;
            const localY = (y - drop.y) / state.scaleY;
            const distanceSquared =
                localX * localX + localY * localY + 7;
            const radiusSquared = drop.radius * drop.radius;

            value +=
                (radiusSquared * radiusSquared) /
                (distanceSquared * distanceSquared);
        }

        return value;
    }

    function getFluidState(elapsedSeconds) {
        const centerX = SIMULATION_WIDTH / 2;
        const centerY = SIMULATION_HEIGHT / 2 + 2;

        /* İlk yaklaşma: iki ayrı damla hâlâ açıkça görülür. */
        const approach = clamp(elapsedSeconds / .62, 0, 1);
        const approachEase = easeInOutCubic(approach);

        /* Temastan sonra merkezler hızla kaynaşır. */
        const coalescence = clamp((elapsedSeconds - .62) / 1.08, 0, 1);
        const coalescenceEase = easeOutCubic(coalescence);

        let halfDistance;

        if (elapsedSeconds < .62) {
            halfDistance =
                fluidInitialHalfDistance -
                (fluidInitialHalfDistance - fluidBaseRadius * 1.46) *
                approachEase;
        }
        else {
            halfDistance =
                fluidBaseRadius * 1.46 * (1 - coalescenceEase);
        }

        const afterContact = Math.max(0, elapsedSeconds - .62);
        const oscillationEnvelope = Math.exp(-1.35 * afterContact);

        /*
            Yüzey gerilimi titreşimi: önce yatay uzama, sonra dikey
            uzama. Çarpım 1 olduğu için alan korunur.
        */
        const deformation = elapsedSeconds < .62
            ? .025 * Math.sin(elapsedSeconds * 8)
            : .235 * oscillationEnvelope * Math.sin(afterContact * 10.4);

        const scaleX = Math.exp(deformation);
        const scaleY = 1 / scaleX;

        /* Temas anındaki küçük yukarı-aşağı hareket su hissini artırır. */
        const verticalWobble = elapsedSeconds < .62
            ? 2.8 * Math.sin(elapsedSeconds * 7.5)
            : 7.5 * Math.exp(-1.65 * afterContact) *
                Math.sin(afterContact * 11.2);

        /*
            Ters dördüncü kuvvet alanında iki kaynak üst üste geldiğinde
            yarıçap 2^(1/4) katına çıkar. Kaynak yarıçapını birleşme
            boyunca yine 2^(1/4) kat büyütürsek son yarıçap sqrt(2)
            kat olur. Böylece son alan iki ilk damlanın alanları toplamıdır.
        */
        const radiusGrowth =
            1 +
            (Math.pow(2, .25) - 1) *
            smoothStep(0, 1, coalescence);
        const currentRadius = fluidBaseRadius * radiusGrowth;

        return {
            scaleX,
            scaleY,
            drops: [
                {
                    x: centerX - halfDistance,
                    y: centerY - verticalWobble,
                    radius: currentRadius
                },
                {
                    x: centerX + halfDistance,
                    y: centerY + verticalWobble,
                    radius: currentRadius
                }
            ]
        };
    }

    function renderFluidPixels(state) {
        const pixels = simulationImage.data;
        let pixelIndex = 0;

        for (let y = 0; y < SIMULATION_HEIGHT; y++) {
            for (let x = 0; x < SIMULATION_WIDTH; x++) {
                let field = 0;
                let gradientX = 0;
                let gradientY = 0;

                /*
                    Alan ve türevleri aynı döngüde hesaplanır. Bu,
                    simülasyonu özellikle telefonlarda belirgin biçimde
                    hızlandırır.
                */
                for (const drop of state.drops) {
                    const localX = (x - drop.x) / state.scaleX;
                    const localY = (y - drop.y) / state.scaleY;
                    const distanceSquared =
                        localX * localX + localY * localY + 7;
                    const radiusSquared = drop.radius * drop.radius;
                    const radiusFourth = radiusSquared * radiusSquared;
                    const distanceFourth =
                        distanceSquared * distanceSquared;
                    const distanceSixth =
                        distanceFourth * distanceSquared;

                    field += radiusFourth / distanceFourth;
                    gradientX +=
                        -4 * radiusFourth * localX /
                        (state.scaleX * distanceSixth);
                    gradientY +=
                        -4 * radiusFourth * localY /
                        (state.scaleY * distanceSixth);
                }

                const alpha = smoothStep(.78, 1.07, field);

                if (alpha <= .002) {
                    pixels[pixelIndex] = 0;
                    pixels[pixelIndex + 1] = 0;
                    pixels[pixelIndex + 2] = 0;
                    pixels[pixelIndex + 3] = 0;
                    pixelIndex += 4;
                    continue;
                }

                /* Alan gradyanı, yüzey normalini ve ışığı verir. */
                const gradientLength =
                    Math.hypot(gradientX, gradientY) || 1;

                const normalX = gradientX / gradientLength;
                const normalY = gradientY / gradientLength;
                const surfaceLightWeight = Math.exp(
                    -Math.abs(field - 1) * 1.8
                );
                const light = clamp(
                    .67 + surfaceLightWeight *
                    (-normalX * .18 - normalY * .28),
                    .18,
                    1
                );

                const depth = clamp((field - 1) * .36, 0, 1);
                const edge = 1 - smoothStep(.92, 1.22, field);

                let red = 91 + light * 83 + depth * 7;
                let green = 179 + light * 55 + depth * 8;
                let blue = 226 + light * 27 + depth * 8;

                /* Kenardaki mavi yüzey gerilimi çizgisi. */
                red -= edge * 37;
                green -= edge * 25;
                blue -= edge * 5;

                /* Sol üstteki beyaz yansıma. */
                const highlightX = x - SIMULATION_WIDTH * .43;
                const highlightY = y - SIMULATION_HEIGHT * .31;
                const highlight = Math.exp(
                    -(
                        highlightX * highlightX / 5200 +
                        highlightY * highlightY / 680
                    )
                ) * alpha;

                red += highlight * 52;
                green += highlight * 43;
                blue += highlight * 24;

                pixels[pixelIndex] = clamp(Math.round(red), 0, 255);
                pixels[pixelIndex + 1] = clamp(Math.round(green), 0, 255);
                pixels[pixelIndex + 2] = clamp(Math.round(blue), 0, 255);
                pixels[pixelIndex + 3] = Math.round(alpha * 248);
                pixelIndex += 4;
            }
        }

        simulationContext.putImageData(simulationImage, 0, 0);
    }

    function drawFluidNumbers(elapsedSeconds) {
        const width = fluidCanvas.width;
        const height = fluidCanvas.height;
        const scale = width / SIMULATION_WIDTH;
        const centerX = width / 2;
        const centerY = height / 2 + 2 * scale;

        const approach = clamp(elapsedSeconds / .62, 0, 1);
        const coalescence = clamp((elapsedSeconds - .62) / 1.08, 0, 1);

        let halfDistance;

        if (elapsedSeconds < .62) {
            halfDistance = (
                fluidInitialHalfDistance -
                (fluidInitialHalfDistance - fluidBaseRadius * 1.46) *
                easeInOutCubic(approach)
            ) * scale;
        }
        else {
            halfDistance =
                fluidBaseRadius * 1.46 *
                (1 - easeOutCubic(coalescence)) *
                scale;
        }

        const oldNumberOpacity =
            1 - smoothStep(.56, 1.12, elapsedSeconds);
        const resultNumberOpacity =
            smoothStep(.92, 1.42, elapsedSeconds);

        fluidContext.save();
        fluidContext.textAlign = "center";
        fluidContext.textBaseline = "middle";
        fluidContext.font =
            `700 ${Math.round(34 * scale)}px Arial, Helvetica, sans-serif`;
        fluidContext.fillStyle = "#133b5d";

        fluidContext.globalAlpha = oldNumberOpacity;
        fluidContext.fillText(leftResult, centerX - halfDistance, centerY);
        fluidContext.fillText(rightResult, centerX + halfDistance, centerY);

        fluidContext.globalAlpha = resultNumberOpacity;
        fluidContext.font =
            `700 ${Math.round(40 * scale)}px Arial, Helvetica, sans-serif`;
        fluidContext.fillText(finalResult, centerX, centerY);
        fluidContext.restore();
    }

    function drawFluidFrame(elapsedSeconds) {
        const state = getFluidState(elapsedSeconds);
        renderFluidPixels(state);

        fluidContext.clearRect(0, 0, fluidCanvas.width, fluidCanvas.height);
        fluidContext.imageSmoothingEnabled = true;
        fluidContext.imageSmoothingQuality = "high";
        fluidContext.drawImage(
            simulationCanvas,
            0,
            0,
            fluidCanvas.width,
            fluidCanvas.height
        );

        drawFluidNumbers(elapsedSeconds);
    }

    function animateFluid(timestamp) {
        if (!fluidStartTime) {
            fluidStartTime = timestamp;
        }

        const elapsedSeconds = (timestamp - fluidStartTime) / 1000;
        drawFluidFrame(elapsedSeconds);

        if (elapsedSeconds >= 2.65 && !fluidSettled) {
            fluidSettled = true;
            busy = false;
            fluidLayer.classList.add("clickable");
            fluidLayer.tabIndex = 0;
            instruction.textContent = finalResult + "'e tıkla.";
        }

        /*
            Yerleşince de çok küçük, sönümlü bir yüzey hareketi sürer.
            Böylece sonuç donmuş bir plastik şekle dönüşmez.
        */
        if (elapsedSeconds < 4.2) {
            fluidAnimationId = requestAnimationFrame(animateFluid);
        }
        else {
            fluidAnimationId = 0;
        }
    }

    function startFluidSimulation() {
        sizeFluidCanvas();

        const leftRectangle = leftBlob.getBoundingClientRect();
        const rightRectangle = rightBlob.getBoundingClientRect();
        const layerRectangle = fluidLayer.getBoundingClientRect();
        const coordinateScale =
            SIMULATION_WIDTH / Math.max(1, layerRectangle.width);
        const leftCenter =
            leftRectangle.left + leftRectangle.width / 2;
        const rightCenter =
            rightRectangle.left + rightRectangle.width / 2;

        fluidInitialHalfDistance =
            Math.abs(rightCenter - leftCenter) * .5 * coordinateScale;
        fluidBaseRadius =
            (leftRectangle.width + rightRectangle.width) * .25 *
            coordinateScale;

        fluidStartTime = 0;
        fluidSettled = false;
        fluidLayer.className = "visible";
        fluidLayer.tabIndex = -1;
        fluidAnimationId = requestAnimationFrame(animateFluid);
    }

    function mergeDrops() {
        if (mergeStarted || busy) {
            return;
        }

        mergeStarted = true;
        busy = true;

        leftBlob.classList.remove("ready");
        rightBlob.classList.remove("ready");
        leftBlob.style.pointerEvents = "none";
        rightBlob.style.pointerEvents = "none";
        instruction.textContent = "İki sonuç su gibi birleşiyor.";

        /*
            DOM damlaları yerinde erirken, aynı konumlarda matematiksel
            su alanı devralır. Böylece sahnede ani bir sıçrama olmaz.
        */
        leftBlob.style.left = "31%";
        leftBlob.style.top = "335px";
        leftBlob.style.transform =
            "translate(-50%, -50%) rotate(-5deg)";

        rightBlob.style.left = "69%";
        rightBlob.style.top = "335px";
        rightBlob.style.transform =
            "translate(-50%, -50%) rotate(5deg)";

        setTimeout(() => {
            startFluidSimulation();
            leftBlob.style.opacity = "0";
            rightBlob.style.opacity = "0";
        }, 620);
    }

    function moveResultToAnswer() {
        if (!mergeStarted || !fluidSettled || completed || busy) {
            return;
        }

        completed = true;
        busy = true;
        fluidLayer.classList.remove("clickable");
        fluidLayer.tabIndex = -1;
        instruction.textContent = "Sonuç yerine gidiyor.";

        const layerRectangle = fluidLayer.getBoundingClientRect();
        const endRectangle = answerBox.getBoundingClientRect();

        const coordinateScale = layerRectangle.width / SIMULATION_WIDTH;
        const startWidth =
            2 * fluidBaseRadius * Math.SQRT2 * coordinateScale;
        const startHeight = startWidth;
        const startLeft =
            layerRectangle.left + (layerRectangle.width - startWidth) / 2;
        const startTop =
            layerRectangle.top + (layerRectangle.height - startHeight) / 2;

        const flying = document.createElement("div");
        flying.className = "flyingFinal";
        flying.textContent = finalResult;
        flying.style.left = startLeft + "px";
        flying.style.top = startTop + "px";
        flying.style.width = startWidth + "px";
        flying.style.height = startHeight + "px";
        document.body.appendChild(flying);

        fluidLayer.style.opacity = "0";

        const targetWidth = endRectangle.width * .77;
        const targetHeight = endRectangle.height * .77;
        const endLeft =
            endRectangle.left + (endRectangle.width - targetWidth) / 2;
        const endTop =
            endRectangle.top + (endRectangle.height - targetHeight) / 2;
        const middleLeft = (startLeft + endLeft) / 2;
        const middleTop = Math.min(startTop, endTop) - 85;

        const animation = flying.animate(
            [
                {
                    left: startLeft + "px",
                    top: startTop + "px",
                    width: startWidth + "px",
                    height: startHeight + "px",
                    transform: "rotate(0deg) scale(1)",
                    borderRadius:
                        "58% 42% 51% 49% / 46% 57% 43% 54%"
                },
                {
                    offset: .22,
                    left: (startLeft - 15) + "px",
                    top: (startTop - 42) + "px",
                    transform: "rotate(-9deg) scale(.95, 1.15)",
                    borderRadius:
                        "50% 50% 44% 56% / 62% 54% 46% 38%"
                },
                {
                    offset: .55,
                    left: middleLeft + "px",
                    top: middleTop + "px",
                    transform: "rotate(8deg) scale(1.07, .94)"
                },
                {
                    left: endLeft + "px",
                    top: endTop + "px",
                    width: targetWidth + "px",
                    height: targetHeight + "px",
                    transform: "rotate(0deg) scale(1)",
                    borderRadius: "50%"
                }
            ],
            {
                duration: 950,
                easing: "cubic-bezier(.26, .72, .35, 1)",
                fill: "forwards"
            }
        );

        animation.onfinish = () => {
            flying.remove();
            stopFluidSimulation();
            fluidLayer.style.opacity = "";
            answerText.textContent = finalResult;
            answerBox.classList.add("filled");
            instruction.textContent = "İşlem tamamlandı.";
            busy = false;
        };
    }

    sourceBlob.addEventListener("click", splitNumber);
    leftBlob.addEventListener("click", () => handlePartClick("left"));
    rightBlob.addEventListener("click", () => handlePartClick("right"));
    fluidLayer.addEventListener("click", moveResultToAnswer);

    fluidLayer.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            moveResultToAnswer();
        }
    });

    newQuestionButton.addEventListener("click", () => {
        let number;

        do {
            number = (Math.floor(Math.random() * 80) + 20) * 3;
        }
        while (number < 60 || number > 297);

        setupQuestion(number);
    });

    exampleButton.addEventListener("click", () => {
        setupQuestion(165);
    });

    window.addEventListener("resize", () => {
        if (mergeStarted && !completed) {
            sizeFluidCanvas();
        }
    });

    setupQuestion(165);
</script>
</body>
</html>
