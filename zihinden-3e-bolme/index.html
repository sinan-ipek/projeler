<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zihinden 3'e Bölme</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #17304a;
        background:
            radial-gradient(circle at top,
                #ffffff 0%,
                #eef7ff 52%,
                #dcecf8 100%);
    }

    .app {
        width: min(900px, 96vw);
        margin: 0 auto;
        padding: 24px 15px 50px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px;
        font-size: clamp(25px, 4vw, 38px);
    }

    .subtitle {
        margin-bottom: 20px;
        color: #66788b;
        font-size: 16px;
    }

    #equation {
        min-height: 95px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 13px;
        font-size: clamp(31px, 6vw, 50px);
        font-weight: 700;
        white-space: nowrap;
    }

    #answerBox {
        width: 105px;
        height: 72px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 4px dashed #8aa6bd;
        border-radius: 19px;
        color: #176fbc;
        background: rgba(255, 255, 255, .65);
        transition:
            background .3s ease,
            border-color .3s ease,
            transform .3s ease,
            box-shadow .3s ease;
    }

    #answerBox.filled {
        border-style: solid;
        border-color: #2e8dd7;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(35, 126, 197, .20);
        animation: answerBounce .55s ease;
    }

    @keyframes answerBounce {
        0%   { transform: scale(.65); }
        55%  { transform: scale(1.18); }
        100% { transform: scale(1); }
    }

    #stage {
        position: relative;
        width: 100%;
        min-height: 500px;
        overflow: hidden;
        border: 1px solid rgba(70, 120, 160, .08);
        border-radius: 28px;
        background: rgba(255, 255, 255, .74);
        box-shadow: 0 12px 35px rgba(35, 77, 110, .12);
    }

    #waterCanvas {
        position: absolute;
        inset: 0;
        z-index: 5;
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
    }

    #instruction {
        position: absolute;
        right: 0;
        bottom: 22px;
        left: 0;
        z-index: 10;
        padding: 0 20px;
        pointer-events: none;
        color: #647688;
        font-size: 17px;
        font-weight: 600;
    }

    .flyingFinalCanvas {
        position: fixed;
        z-index: 9999;
        display: block;
        pointer-events: none;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    button,
    .home-link {
        border: none;
        padding: 12px 23px;
        border-radius: 13px;
        cursor: pointer;
        font: 700 16px Arial, Helvetica, sans-serif;
        transition: transform .18s ease, box-shadow .18s ease;
    }

    button:hover,
    .home-link:hover {
        transform: translateY(-2px);
    }

    #newQuestionButton {
        color: #ffffff;
        background: #287fd2;
        box-shadow: 0 5px 14px rgba(40, 127, 210, .24);
    }

    #exampleButton,
    .home-link {
        color: #34495c;
        background: #eef2f6;
    }

    .home-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }

    @media (max-width: 600px) {
        #equation {
            gap: 8px;
        }

        #answerBox {
            width: 82px;
            height: 60px;
        }

        #stage {
            min-height: 480px;
        }
    }
</style>
</head>

<body>
<div class="app">
    <h1>Zihinden 3'e Bölme</h1>

    <div class="subtitle">
        Sayıyı uygun parçalara ayır ve zihinden böl.
    </div>

    <div id="equation">
        <span id="equationNumber">165</span>
        <span>:</span>
        <span>3</span>
        <span>=</span>
        <span id="answerBox"><span id="answerText"></span></span>
    </div>

    <div id="stage">
        <canvas
            id="waterCanvas"
            role="button"
            tabindex="0"
            aria-label="Su damlası"
        ></canvas>

        <div id="instruction" aria-live="polite">165'e tıkla.</div>
    </div>

    <div class="controls">
        <button id="newQuestionButton">Yeni Soru</button>
        <button id="exampleButton">165 Örneği</button>
        <a class="home-link" href="../index.html">Ana Sayfa</a>
    </div>
</div>

<script>
    const stage = document.getElementById("stage");
    const waterCanvas = document.getElementById("waterCanvas");
    const waterContext = waterCanvas.getContext("2d", { alpha: true });
    const equationNumber = document.getElementById("equationNumber");
    const answerBox = document.getElementById("answerBox");
    const answerText = document.getElementById("answerText");
    const instruction = document.getElementById("instruction");
    const newQuestionButton = document.getElementById("newQuestionButton");
    const exampleButton = document.getElementById("exampleButton");

    const simulationCanvas = document.createElement("canvas");
    const simulationContext = simulationCanvas.getContext("2d", {
        alpha: true
    });

    let simulationImage = null;
    let stageWidth = 1;
    let stageHeight = 1;
    let simulationWidth = 1;
    let simulationHeight = 1;
    let deviceScale = 1;

    let originalNumber = 165;
    let leftNumber = 150;
    let rightNumber = 15;
    let leftResult = 50;
    let rightResult = 5;
    let finalResult = 55;

    let drops = [];
    let floatingLabels = [];
    let sceneMode = "source";
    let busy = false;
    let completed = false;
    let leftDivided = false;
    let rightDivided = false;

    let animationFrame = 0;
    let sceneVersion = 0;

    function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
    }

    function lerp(start, end, amount) {
        return start + (end - start) * amount;
    }

    function smoothStep(edge0, edge1, value) {
        const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return amount * amount * (3 - 2 * amount);
    }

    function easeInOutCubic(value) {
        return value < .5
            ? 4 * value * value * value
            : 1 - Math.pow(-2 * value + 2, 3) / 2;
    }

    function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
    }

    function keyframeProgress(progress, frames) {
        if (progress <= frames[0][0]) {
            return frames[0][1];
        }

        for (let index = 1; index < frames.length; index++) {
            const previous = frames[index - 1];
            const current = frames[index];

            if (progress <= current[0]) {
                const local = smoothStep(
                    previous[0],
                    current[0],
                    progress
                );

                return lerp(previous[1], current[1], local);
            }
        }

        return frames[frames.length - 1][1];
    }

    function calculateParts(number) {
        let firstPart = Math.floor(number / 30) * 30;

        if (firstPart === number) {
            firstPart -= 30;
        }

        return [firstPart, number - firstPart];
    }

    function createDrop(x, y, radius, value, side = "") {
        return {
            x,
            y,
            radius,
            value,
            side,
            opacity: 1,
            textOpacity: 1,
            nextValue: null,
            nextTextOpacity: 0,
            aspect: 0,
            rotation: 0,
            brightness: 1
        };
    }

    function resizeCanvases() {
        const rectangle = stage.getBoundingClientRect();

        stageWidth = Math.max(1, rectangle.width);
        stageHeight = Math.max(1, rectangle.height);
        deviceScale = Math.min(window.devicePixelRatio || 1, 2);

        waterCanvas.width = Math.round(stageWidth * deviceScale);
        waterCanvas.height = Math.round(stageHeight * deviceScale);

        simulationWidth = Math.max(
            220,
            Math.min(480, Math.round(stageWidth * .58))
        );
        simulationHeight = Math.max(
            240,
            Math.round(simulationWidth * stageHeight / stageWidth)
        );

        simulationCanvas.width = simulationWidth;
        simulationCanvas.height = simulationHeight;
        simulationImage = simulationContext.createImageData(
            simulationWidth,
            simulationHeight
        );
    }

    /*
        Her damlanın su yüzeyi, örtük bir alanla tanımlanır:

                      r⁴
        F(x, y) = Σ ─────────────
                    (d² + ε)²

        F = 1 çizgisi görünen damla yüzeyidir. İki damlanın alanları
        birbirine değdiğinde aradaki boyun kendiliğinden oluşur.

        aspect değişkeni sönümlü salınım yapar. Yatay ölçek e^aspect,
        dikey ölçek e^-aspect seçildiğinden ikisinin çarpımı daima 1'dir;
        yani titreşim sırasında damlanın alanı korunur.
    */
    function renderWaterField() {
        const pixels = simulationImage.data;
        const scaleX = simulationWidth / stageWidth;
        const scaleY = simulationHeight / stageHeight;
        const preparedDrops = drops
            .filter(drop => drop.opacity > .002)
            .map(drop => {
                const radius =
                    drop.radius * (scaleX + scaleY) * .5;
                const radiusSquared = radius * radius;
                const horizontalScale = Math.exp(drop.aspect);

                return {
                    centerX: drop.x * scaleX,
                    centerY: drop.y * scaleY,
                    radiusSquared,
                    radiusFourth: radiusSquared * radiusSquared,
                    horizontalScale,
                    verticalScale: 1 / horizontalScale,
                    cosine: Math.cos(drop.rotation),
                    sine: Math.sin(drop.rotation),
                    opacity: drop.opacity
                };
            });
        let pixelIndex = 0;

        for (let y = 0; y < simulationHeight; y++) {
            for (let x = 0; x < simulationWidth; x++) {
                let field = 0;
                let gradientX = 0;
                let gradientY = 0;

                for (const drop of preparedDrops) {
                    const deltaX = x - drop.centerX;
                    const deltaY = y - drop.centerY;
                    const rotatedX =
                        deltaX * drop.cosine + deltaY * drop.sine;
                    const rotatedY =
                        -deltaX * drop.sine + deltaY * drop.cosine;
                    const localX = rotatedX / drop.horizontalScale;
                    const localY = rotatedY / drop.verticalScale;

                    /* Uzak piksellerde pahalı hesabı atla. */
                    if (
                        localX * localX + localY * localY >
                        drop.radiusSquared * 9
                    ) {
                        continue;
                    }

                    const distanceSquared =
                        localX * localX + localY * localY + 7;
                    const distanceFourth =
                        distanceSquared * distanceSquared;
                    const distanceSixth =
                        distanceFourth * distanceSquared;

                    field +=
                        drop.opacity * drop.radiusFourth / distanceFourth;

                    const localGradientX =
                        -4 * drop.opacity * drop.radiusFourth * localX /
                        (drop.horizontalScale * distanceSixth);
                    const localGradientY =
                        -4 * drop.opacity * drop.radiusFourth * localY /
                        (drop.verticalScale * distanceSixth);

                    gradientX +=
                        localGradientX * drop.cosine -
                        localGradientY * drop.sine;
                    gradientY +=
                        localGradientX * drop.sine +
                        localGradientY * drop.cosine;
                }

                /*
                    Geniş alfa geçişi keskin bir kontur oluşmasını önler.
                    Damlanın kenarı ikinci örnekteki gibi yumuşakça erir.
                */
                const alpha = smoothStep(.55, 1.12, field);

                if (alpha <= .002) {
                    pixels[pixelIndex] = 0;
                    pixels[pixelIndex + 1] = 0;
                    pixels[pixelIndex + 2] = 0;
                    pixels[pixelIndex + 3] = 0;
                    pixelIndex += 4;
                    continue;
                }

                const gradientLength =
                    Math.hypot(gradientX, gradientY) || 1;
                const normalX = gradientX / gradientLength;
                const normalY = gradientY / gradientLength;
                const surfaceWeight = Math.exp(
                    -Math.abs(field - 1) * 1.8
                );
                const light = clamp(
                    .74 + surfaceWeight *
                    (-normalX * .045 - normalY * .065),
                    .60,
                    .88
                );
                const depth = clamp((field - 1) * .22, 0, 1);
                const edge = 1 - smoothStep(.64, 1.20, field);

                /*
                    Renk geçişi özellikle dar tutulur. Böylece içeride
                    parlak bir grafik gradyanı ve kenarda mavi çizgi
                    oluşmaz; bütün damla yumuşak turkuaz kalır.
                */
                let red = 145 + light * 18 + depth * 3 - edge * 8;
                let green = 208 + light * 18 + depth * 2 - edge * 2;
                let blue = 231 + light * 16 + depth + edge * 5;

                /* Sol üstte çok hafif, yayvan bir su yansıması. */
                const highlight = clamp(
                    (-normalX - normalY) * .035 * surfaceWeight,
                    0,
                    .06
                );

                red += highlight * 45;
                green += highlight * 38;
                blue += highlight * 22;

                pixels[pixelIndex] = clamp(Math.round(red), 0, 255);
                pixels[pixelIndex + 1] = clamp(Math.round(green), 0, 255);
                pixels[pixelIndex + 2] = clamp(Math.round(blue), 0, 255);
                pixels[pixelIndex + 3] = Math.round(alpha * 248);
                pixelIndex += 4;
            }
        }

        simulationContext.putImageData(simulationImage, 0, 0);
    }

    function drawNumbers() {
        waterContext.save();
        waterContext.scale(deviceScale, deviceScale);
        waterContext.textAlign = "center";
        waterContext.textBaseline = "middle";
        waterContext.fillStyle = "#133b5d";

        for (const drop of drops) {
            const fontSize = clamp(drop.radius * .58, 29, 46);

            waterContext.font =
                `700 ${fontSize}px Arial, Helvetica, sans-serif`;

            if (drop.value !== null && drop.value !== undefined) {
                waterContext.globalAlpha =
                    drop.opacity * drop.textOpacity;
                waterContext.fillText(drop.value, drop.x, drop.y + 1);
            }

            if (drop.nextValue !== null && drop.nextValue !== undefined) {
                waterContext.globalAlpha =
                    drop.opacity * drop.nextTextOpacity;
                waterContext.fillText(
                    drop.nextValue,
                    drop.x,
                    drop.y + 1
                );
            }
        }

        for (const label of floatingLabels) {
            waterContext.globalAlpha = label.opacity;
            waterContext.font =
                `700 ${label.fontSize}px Arial, Helvetica, sans-serif`;
            waterContext.fillText(label.value, label.x, label.y);
        }

        waterContext.restore();
    }

    function renderScene() {
        renderWaterField();

        waterContext.clearRect(
            0,
            0,
            waterCanvas.width,
            waterCanvas.height
        );

        waterContext.save();
        waterContext.shadowColor = "rgba(37, 125, 180, .18)";
        waterContext.shadowBlur = 10 * deviceScale;
        waterContext.shadowOffsetY = 5 * deviceScale;
        waterContext.filter = `blur(${1.7 * deviceScale}px)`;
        waterContext.imageSmoothingEnabled = true;
        waterContext.imageSmoothingQuality = "high";
        waterContext.drawImage(
            simulationCanvas,
            0,
            0,
            waterCanvas.width,
            waterCanvas.height
        );
        waterContext.restore();

        drawNumbers();
    }

    function animate(duration, update, version = sceneVersion) {
        return new Promise(resolve => {
            const startTime = performance.now();

            cancelAnimationFrame(animationFrame);

            function frame(now) {
                if (version !== sceneVersion) {
                    resolve(false);
                    return;
                }

                const rawProgress = clamp(
                    (now - startTime) / duration,
                    0,
                    1
                );

                update(rawProgress);
                renderScene();

                if (rawProgress < 1) {
                    animationFrame = requestAnimationFrame(frame);
                }
                else {
                    animationFrame = 0;
                    resolve(true);
                }
            }

            animationFrame = requestAnimationFrame(frame);
        });
    }

    async function touchRipple(drop, strength = .072) {
        const version = sceneVersion;
        const originalAspect = drop.aspect;
        const originalRotation = drop.rotation;

        const finished = await animate(360, progress => {
            const envelope = Math.exp(-2.7 * progress);

            drop.aspect =
                originalAspect +
                strength * envelope * Math.sin(progress * Math.PI * 5);
            drop.rotation =
                originalRotation +
                .035 * envelope * Math.sin(progress * Math.PI * 4);
        }, version);

        if (finished) {
            drop.aspect = originalAspect;
            drop.rotation = originalRotation;
            renderScene();
        }

        return finished;
    }

    async function touchRippleGroup(group, strength = .072) {
        const version = sceneVersion;
        const originalStates = group.map(drop => ({
            aspect: drop.aspect,
            rotation: drop.rotation
        }));

        const finished = await animate(440, progress => {
            const envelope = Math.exp(-2.9 * progress);
            const ripple =
                strength * envelope *
                Math.sin(progress * Math.PI * 5.2);
            const smallTurn =
                .025 * envelope *
                Math.sin(progress * Math.PI * 4);

            group.forEach((drop, index) => {
                drop.aspect =
                    originalStates[index].aspect + ripple;
                drop.rotation =
                    originalStates[index].rotation + smallTurn;
            });
        }, version);

        if (finished) {
            group.forEach((drop, index) => {
                drop.aspect = originalStates[index].aspect;
                drop.rotation = originalStates[index].rotation;
            });
            renderScene();
        }

        return finished;
    }

    function setupQuestion(number) {
        sceneVersion += 1;
        cancelAnimationFrame(animationFrame);
        animationFrame = 0;

        originalNumber = number;

        const parts = calculateParts(number);
        leftNumber = parts[0];
        rightNumber = parts[1];
        leftResult = leftNumber / 3;
        rightResult = rightNumber / 3;
        finalResult = originalNumber / 3;

        busy = false;
        completed = false;
        leftDivided = false;
        rightDivided = false;
        sceneMode = "source";
        floatingLabels = [];

        equationNumber.textContent = originalNumber;
        answerText.textContent = "";
        answerBox.classList.remove("filled");

        const sourceX = stageWidth / 2;
        const sourceY = 125;
        const visibleRadius = stageWidth < 500 ? 67 : 72;
        const halfMassRadius =
            visibleRadius / Math.pow(2, .25);

        /*
            Damla en baştan itibaren aynı iki su kütlesinden oluşur.
            Kütlelerin merkezleri tam çakıştığı için dışarıdan tek bir
            yuvarlak damla görünür. Bölünmede yeni şekil yaratılmaz;
            bu iki mevcut merkez birbirinden uzaklaşır.
        */
        drops = [
            createDrop(
                sourceX,
                sourceY,
                halfMassRadius,
                leftNumber,
                "left"
            ),
            createDrop(
                sourceX,
                sourceY,
                halfMassRadius,
                rightNumber,
                "right"
            )
        ];

        drops[0].textOpacity = 0;
        drops[1].textOpacity = 0;

        floatingLabels = [
            {
                x: sourceX,
                y: sourceY + 1,
                value: originalNumber,
                opacity: 1,
                fontSize: clamp(visibleRadius * .60, 39, 45)
            }
        ];

        instruction.textContent = originalNumber + "'e tıkla.";

        document.querySelectorAll(".flyingFinalCanvas").forEach(element => {
            element.remove();
        });

        renderScene();
    }

    async function splitNumber() {
        if (busy || sceneMode !== "source") {
            return;
        }

        busy = true;
        const version = sceneVersion;
        const leftDrop = drops[0];
        const rightDrop = drops[1];

        instruction.textContent = "Damla titreşiyor.";

        /* Önce dokunulan gerçek bir su damlası gibi hafifçe dalgalanır. */
        const touched = await touchRippleGroup(drops, .070);

        if (!touched || version !== sceneVersion) {
            return;
        }

        instruction.textContent = "Damla iki yana doğru uzuyor.";

        const sourceX = leftDrop.x;
        const sourceY = leftDrop.y;
        const leftTargetX = stageWidth * (stageWidth < 500 ? .25 : .27);
        const rightTargetX = stageWidth * (stageWidth < 500 ? .75 : .73);
        const targetY = 235;

        const separated = await animate(1550, progress => {
            /*
                Eşik çevresindeki hareket özellikle yavaşlatılır:
                önce ovalleşme, sonra iki lob, ardından ince boyun ve
                en son kopma açıkça görülebilsin.
            */
            const separation = keyframeProgress(progress, [
                [0, 0],
                [.24, .17],
                [.48, .31],
                [.64, .39],
                [.76, .50],
                [1, 1]
            ]);
            const verticalMovement = keyframeProgress(progress, [
                [0, 0],
                [.48, .28],
                [.76, .62],
                [1, 1]
            ]);
            const textArrival = smoothStep(.54, .82, progress);
            const sourceFade = 1 - smoothStep(.30, .62, progress);
            const afterPinch = Math.max(0, progress - .64);
            const wobble = progress < .64
                ? .018 * Math.sin(progress * Math.PI * 3)
                : .070 * Math.exp(-5.2 * afterPinch) *
                    Math.sin(afterPinch * Math.PI * 9);

            leftDrop.x = lerp(sourceX, leftTargetX, separation);
            rightDrop.x = lerp(sourceX, rightTargetX, separation);
            leftDrop.y = lerp(sourceY, targetY, verticalMovement);
            rightDrop.y = lerp(sourceY, targetY, verticalMovement);
            leftDrop.aspect = wobble;
            rightDrop.aspect = wobble;
            leftDrop.rotation = 0;
            rightDrop.rotation = 0;
            leftDrop.textOpacity = textArrival;
            rightDrop.textOpacity = textArrival;
            floatingLabels[0].opacity = sourceFade;

            if (progress < .43) {
                instruction.textContent =
                    "Damla iki yana doğru uzuyor.";
            }
            else if (progress < .68) {
                instruction.textContent =
                    "Ortadaki su boynu inceliyor.";
            }
            else {
                instruction.textContent =
                    "İki damla birbirinden ayrılıyor.";
            }
        }, version);

        if (!separated || version !== sceneVersion) {
            return;
        }

        leftDrop.aspect = 0;
        rightDrop.aspect = 0;
        leftDrop.rotation = 0;
        rightDrop.rotation = 0;
        floatingLabels = [];
        sceneMode = "parts";
        busy = false;
        instruction.textContent = "İstediğin parçaya tıkla.";
        renderScene();
    }

    async function divideDrop(index) {
        if (busy || sceneMode !== "parts") {
            return;
        }

        const drop = drops[index];
        const alreadyDivided = drop.side === "left"
            ? leftDivided
            : rightDivided;

        if (alreadyDivided) {
            if (leftDivided && rightDivided) {
                mergeDrops(index);
            }
            else {
                instruction.textContent =
                    "Önce diğer parçayı da 3'e böl.";
            }

            return;
        }

        busy = true;
        const version = sceneVersion;
        const result = drop.side === "left"
            ? leftResult
            : rightResult;
        const startRadius = drop.radius;
        const targetRadius = startRadius * .90;

        instruction.textContent = "Damla titreşiyor.";

        const touched = await touchRipple(drop, .062);

        if (!touched || version !== sceneVersion) {
            return;
        }

        drop.nextValue = result;
        drop.nextTextOpacity = 0;

        const divided = await animate(610, progress => {
            const movement = easeInOutCubic(progress);
            const oscillation =
                .052 * Math.exp(-2.4 * progress) *
                Math.sin(progress * Math.PI * 5);

            drop.radius = lerp(startRadius, targetRadius, movement);
            drop.aspect = oscillation;
            drop.textOpacity = 1 - smoothStep(.12, .62, progress);
            drop.nextTextOpacity = smoothStep(.38, .88, progress);
        }, version);

        if (!divided || version !== sceneVersion) {
            return;
        }

        drop.radius = targetRadius;
        drop.value = result;
        drop.nextValue = null;
        drop.textOpacity = 1;
        drop.nextTextOpacity = 0;
        drop.aspect = 0;

        if (drop.side === "left") {
            leftDivided = true;
        }
        else {
            rightDivided = true;
        }

        busy = false;

        if (leftDivided && rightDivided) {
            instruction.textContent =
                "Şimdi iki damladan birine tekrar tıkla.";
        }
        else {
            instruction.textContent = "Diğer parçayı da 3'e böl.";
        }

        renderScene();
    }

    async function mergeDrops(clickedIndex) {
        if (
            busy ||
            sceneMode !== "parts" ||
            !leftDivided ||
            !rightDivided
        ) {
            return;
        }

        busy = true;
        sceneMode = "merging";
        const version = sceneVersion;

        instruction.textContent = "Damla titreşiyor.";

        const touched = await touchRipple(drops[clickedIndex], .052);

        if (!touched || version !== sceneVersion) {
            return;
        }

        instruction.textContent = "İki sonuç su gibi birleşiyor.";

        const leftDrop = drops.find(drop => drop.side === "left");
        const rightDrop = drops.find(drop => drop.side === "right");
        const leftStart = { x: leftDrop.x, y: leftDrop.y };
        const rightStart = { x: rightDrop.x, y: rightDrop.y };
        const baseRadius = (leftDrop.radius + rightDrop.radius) / 2;
        const centerX = stageWidth / 2;
        const centerY = 335;

        floatingLabels = [
            {
                x: centerX,
                y: centerY + 1,
                value: finalResult,
                opacity: 0,
                fontSize: 43
            }
        ];

        const merged = await animate(2150, progress => {
            /*
                Yaklaşma hızlı başlar; temas, köprü ve fıstık evreleri
                daha yavaş geçer. Böylece birleşme üst üste binme gibi
                değil, yüzey gerilimiyle kaynaşma gibi görünür.
            */
            const movement = keyframeProgress(progress, [
                [0, 0],
                [.40, .55],
                [.60, .70],
                [.76, .82],
                [.90, .94],
                [1, 1]
            ]);
            const coalescence = smoothStep(.58, 1, progress);
            const radiusGrowth =
                1 +
                (Math.pow(2, .25) - 1) * coalescence;
            const afterContact = Math.max(0, progress - .60);
            const oscillation = progress < .60
                ? .018 * Math.sin(progress * Math.PI * 3)
                : .16 * Math.exp(-4.2 * afterContact) *
                    Math.sin(afterContact * Math.PI * 7);

            leftDrop.x = lerp(leftStart.x, centerX, movement);
            rightDrop.x = lerp(rightStart.x, centerX, movement);
            leftDrop.y = lerp(leftStart.y, centerY, movement);
            rightDrop.y = lerp(rightStart.y, centerY, movement);
            leftDrop.radius = baseRadius * radiusGrowth;
            rightDrop.radius = baseRadius * radiusGrowth;
            leftDrop.aspect = oscillation;
            rightDrop.aspect = oscillation;
            leftDrop.rotation = 0;
            rightDrop.rotation = 0;
            leftDrop.textOpacity =
                1 - smoothStep(.56, .78, progress);
            rightDrop.textOpacity =
                1 - smoothStep(.56, .78, progress);
            floatingLabels[0].opacity =
                smoothStep(.72, .94, progress);

            if (progress < .50) {
                instruction.textContent =
                    "İki damla birbirine yaklaşıyor.";
            }
            else if (progress < .68) {
                instruction.textContent =
                    "Temas noktasında su köprüsü oluşuyor.";
            }
            else if (progress < .86) {
                instruction.textContent =
                    "İki damla tek yüzeyde kaynaşıyor.";
            }
            else {
                instruction.textContent =
                    "Yeni damla yuvarlaklaşıyor.";
            }
        }, version);

        if (!merged || version !== sceneVersion) {
            return;
        }

        const resultRadius = baseRadius * Math.SQRT2;

        drops = [
            createDrop(
                centerX,
                centerY,
                resultRadius,
                finalResult,
                "result"
            )
        ];
        drops[0].aspect = .075;
        floatingLabels = [];

        /* Birleşme sonrası yüzey gerilimi birkaç kez sönümlenir. */
        const settled = await animate(880, progress => {
            drops[0].aspect =
                .075 * Math.exp(-3.4 * progress) *
                Math.cos(progress * Math.PI * 5);
            drops[0].rotation =
                .025 * Math.exp(-3 * progress) *
                Math.sin(progress * Math.PI * 4);
        }, version);

        if (!settled || version !== sceneVersion) {
            return;
        }

        drops[0].aspect = 0;
        drops[0].rotation = 0;
        sceneMode = "result";
        busy = false;
        instruction.textContent = finalResult + "'e tıkla.";
        renderScene();
    }

    function moveResultToAnswer() {
        if (
            busy ||
            completed ||
            sceneMode !== "result" ||
            drops.length !== 1
        ) {
            return;
        }

        completed = true;
        busy = true;
        const resultDrop = drops[0];
        const stageRectangle = stage.getBoundingClientRect();
        const endRectangle = answerBox.getBoundingClientRect();
        const diameter = resultDrop.radius * 2;
        const cropPadding = 24;
        const cropSize = diameter + cropPadding * 2;
        const startLeft =
            stageRectangle.left + resultDrop.x - cropSize / 2;
        const startTop =
            stageRectangle.top + resultDrop.y - cropSize / 2;

        instruction.textContent = "Sonuç yerine gidiyor.";

        /*
            Yeni bir CSS baloncuğu çizilmez. Mevcut su damlasının
            canvas üzerindeki gerçek pikselleri kırpılıp kopyalanır.
            Böylece sıçrama sırasında bile stil değişemez.
        */
        const flying = document.createElement("canvas");
        flying.className = "flyingFinalCanvas";
        flying.width = Math.round(cropSize * deviceScale);
        flying.height = Math.round(cropSize * deviceScale);
        flying.style.left = startLeft + "px";
        flying.style.top = startTop + "px";
        flying.style.width = cropSize + "px";
        flying.style.height = cropSize + "px";

        const flyingContext = flying.getContext("2d", { alpha: true });
        const sourceLeft =
            (resultDrop.x - cropSize / 2) * deviceScale;
        const sourceTop =
            (resultDrop.y - cropSize / 2) * deviceScale;

        flyingContext.drawImage(
            waterCanvas,
            sourceLeft,
            sourceTop,
            cropSize * deviceScale,
            cropSize * deviceScale,
            0,
            0,
            flying.width,
            flying.height
        );

        document.body.appendChild(flying);

        resultDrop.opacity = 0;
        renderScene();

        const targetWidth = endRectangle.width * .94;
        const targetHeight = endRectangle.height * .94;
        const endLeft =
            endRectangle.left + (endRectangle.width - targetWidth) / 2;
        const endTop =
            endRectangle.top + (endRectangle.height - targetHeight) / 2;
        const middleLeft = (startLeft + endLeft) / 2;
        const middleTop = Math.min(startTop, endTop) - 85;

        const animation = flying.animate(
            [
                {
                    left: startLeft + "px",
                    top: startTop + "px",
                    width: cropSize + "px",
                    height: cropSize + "px",
                    transform: "rotate(0deg) scale(1)",
                    opacity: 1
                },
                {
                    offset: .22,
                    left: (startLeft - 15) + "px",
                    top: (startTop - 42) + "px",
                    transform: "rotate(-7deg) scale(.96, 1.10)"
                },
                {
                    offset: .55,
                    left: middleLeft + "px",
                    top: middleTop + "px",
                    transform: "rotate(7deg) scale(1.05, .96)"
                },
                {
                    left: endLeft + "px",
                    top: endTop + "px",
                    width: targetWidth + "px",
                    height: targetHeight + "px",
                    transform: "rotate(0deg) scale(1)",
                    opacity: 1
                }
            ],
            {
                duration: 950,
                easing: "cubic-bezier(.26, .72, .35, 1)",
                fill: "forwards"
            }
        );

        animation.onfinish = () => {
            flying.remove();
            answerText.textContent = finalResult;
            answerBox.classList.add("filled");
            instruction.textContent = "İşlem tamamlandı.";
            busy = false;
        };
    }

    function findTouchedDrop(x, y) {
        let closestIndex = -1;
        let closestDistance = Infinity;

        drops.forEach((drop, index) => {
            if (drop.opacity <= .05) {
                return;
            }

            const distance = Math.hypot(x - drop.x, y - drop.y);
            const hitRadius = Math.max(drop.radius * 1.18, 48);

            if (distance <= hitRadius && distance < closestDistance) {
                closestIndex = index;
                closestDistance = distance;
            }
        });

        return closestIndex;
    }

    function handleCanvasActivation(clientX, clientY) {
        if (busy) {
            return;
        }

        const rectangle = waterCanvas.getBoundingClientRect();
        const x = clientX - rectangle.left;
        const y = clientY - rectangle.top;
        const touchedIndex = findTouchedDrop(x, y);

        if (touchedIndex < 0) {
            return;
        }

        if (sceneMode === "source") {
            splitNumber();
        }
        else if (sceneMode === "parts") {
            divideDrop(touchedIndex);
        }
        else if (sceneMode === "result") {
            moveResultToAnswer();
        }
    }

    waterCanvas.addEventListener("pointerdown", event => {
        handleCanvasActivation(event.clientX, event.clientY);
    });

    waterCanvas.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") {
            return;
        }

        event.preventDefault();

        if (busy) {
            return;
        }

        if (sceneMode === "source") {
            splitNumber();
        }
        else if (sceneMode === "result") {
            moveResultToAnswer();
        }
    });

    newQuestionButton.addEventListener("click", () => {
        let number;

        do {
            number = (Math.floor(Math.random() * 80) + 20) * 3;
        }
        while (number < 60 || number > 297);

        setupQuestion(number);
    });

    exampleButton.addEventListener("click", () => {
        setupQuestion(165);
    });

    window.addEventListener("resize", () => {
        const previousWidth = stageWidth;
        const previousHeight = stageHeight;

        resizeCanvases();

        if (previousWidth > 1 && previousHeight > 1) {
            const horizontalRatio = stageWidth / previousWidth;
            const verticalRatio = stageHeight / previousHeight;

            drops.forEach(drop => {
                drop.x *= horizontalRatio;
                drop.y *= verticalRatio;
                drop.radius *= Math.sqrt(
                    horizontalRatio * verticalRatio
                );
            });

            floatingLabels.forEach(label => {
                label.x *= horizontalRatio;
                label.y *= verticalRatio;
            });
        }

        renderScene();
    });

    resizeCanvases();
    setupQuestion(165);
</script>
</body>
</html>
