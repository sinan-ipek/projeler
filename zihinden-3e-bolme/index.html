<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zihinden 3'e Bölme</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #17304a;
        background:
            radial-gradient(circle at top,
                #ffffff 0%,
                #eef7ff 52%,
                #dcecf8 100%);
    }

    .app {
        width: min(900px, 96vw);
        margin: 0 auto;
        padding: 24px 15px 50px;
        text-align: center;
    }

    h1 {
        margin: 0 0 8px;
        font-size: clamp(25px, 4vw, 38px);
    }

    .subtitle {
        margin-bottom: 20px;
        color: #66788b;
        font-size: 16px;
    }

    #equation {
        min-height: 95px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 13px;
        font-size: clamp(31px, 6vw, 50px);
        font-weight: 700;
        white-space: nowrap;
    }

    #answerBox {
        width: 105px;
        height: 72px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border: 4px dashed #8aa6bd;
        border-radius: 19px;
        color: #176fbc;
        background: rgba(255, 255, 255, .65);
        transition:
            background .3s ease,
            border-color .3s ease,
            transform .3s ease,
            box-shadow .3s ease;
    }

    #answerBox.filled {
        border-style: solid;
        border-color: #2e8dd7;
        background: #ffffff;
        box-shadow: 0 8px 20px rgba(35, 126, 197, .20);
        animation: answerBounce .55s ease;
    }

    @keyframes answerBounce {
        0%   { transform: scale(.65); }
        55%  { transform: scale(1.18); }
        100% { transform: scale(1); }
    }

    #stage {
        position: relative;
        width: 100%;
        min-height: 500px;
        overflow: hidden;
        border: 1px solid rgba(70, 120, 160, .08);
        border-radius: 28px;
        background: rgba(255, 255, 255, .74);
        box-shadow: 0 12px 35px rgba(35, 77, 110, .12);
    }

    #waterCanvas {
        position: absolute;
        inset: 0;
        z-index: 5;
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
    }

    #instruction {
        position: absolute;
        right: 0;
        bottom: 22px;
        left: 0;
        z-index: 10;
        padding: 0 20px;
        pointer-events: none;
        color: #647688;
        font-size: 17px;
        font-weight: 600;
    }

    .flyingFinalCanvas {
        position: fixed;
        z-index: 9999;
        display: block;
        pointer-events: none;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    button,
    .home-link {
        border: none;
        padding: 12px 23px;
        border-radius: 13px;
        cursor: pointer;
        font: 700 16px Arial, Helvetica, sans-serif;
        transition: transform .18s ease, box-shadow .18s ease;
    }

    button:hover,
    .home-link:hover {
        transform: translateY(-2px);
    }

    #newQuestionButton {
        color: #ffffff;
        background: #287fd2;
        box-shadow: 0 5px 14px rgba(40, 127, 210, .24);
    }

    #exampleButton,
    .home-link {
        color: #34495c;
        background: #eef2f6;
    }

    .home-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }

    @media (max-width: 600px) {
        #equation {
            gap: 8px;
        }

        #answerBox {
            width: 82px;
            height: 60px;
        }

        #stage {
            min-height: 480px;
        }
    }
</style>
</head>

<body>
<div class="app">
    <h1>Zihinden 3'e Bölme</h1>

    <div class="subtitle">
        Sayıyı uygun parçalara ayır ve zihinden böl.
    </div>

    <div id="equation">
        <span id="equationNumber">165</span>
        <span>:</span>
        <span>3</span>
        <span>=</span>
        <span id="answerBox"><span id="answerText"></span></span>
    </div>

    <div id="stage">
        <canvas
            id="waterCanvas"
            role="button"
            tabindex="0"
            aria-label="Su damlası"
        ></canvas>

        <div id="instruction" aria-live="polite">165'e tıkla.</div>
    </div>

    <div class="controls">
        <button id="newQuestionButton">Yeni Soru</button>
        <button id="exampleButton">165 Örneği</button>
        <a class="home-link" href="../index.html">Ana Sayfa</a>
    </div>
</div>

<script>
    const stage = document.getElementById("stage");
    const waterCanvas = document.getElementById("waterCanvas");
    const waterContext = waterCanvas.getContext("2d", { alpha: true });
    const equationNumber = document.getElementById("equationNumber");
    const answerBox = document.getElementById("answerBox");
    const answerText = document.getElementById("answerText");
    const instruction = document.getElementById("instruction");
    const newQuestionButton = document.getElementById("newQuestionButton");
    const exampleButton = document.getElementById("exampleButton");

    const simulationCanvas = document.createElement("canvas");
    const simulationContext = simulationCanvas.getContext("2d", {
        alpha: true
    });

    let simulationImage = null;
    let stageWidth = 1;
    let stageHeight = 1;
    let simulationWidth = 1;
    let simulationHeight = 1;
    let deviceScale = 1;

    let originalNumber = 165;
    let leftNumber = 150;
    let rightNumber = 15;
    let leftResult = 50;
    let rightResult = 5;
    let finalResult = 55;

    let drops = [];
    let floatingLabels = [];
    let waterParticles = [];
    let particleDensity = new Float32Array(1);
    let particleMorph = 0;
    let particleUnifiedScale = 1;
    let particleGroupScale = {
        left: 1,
        right: 1
    };
    let waterOpacity = 1;
    let sourceVisibleRadius = 72;
    let sceneMode = "source";
    let busy = false;
    let completed = false;
    let leftDivided = false;
    let rightDivided = false;

    let animationFrame = 0;
    let sceneVersion = 0;

    function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
    }

    function lerp(start, end, amount) {
        return start + (end - start) * amount;
    }

    function smoothStep(edge0, edge1, value) {
        const amount = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return amount * amount * (3 - 2 * amount);
    }

    function easeInOutCubic(value) {
        return value < .5
            ? 4 * value * value * value
            : 1 - Math.pow(-2 * value + 2, 3) / 2;
    }

    function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
    }

    function keyframeProgress(progress, frames) {
        if (progress <= frames[0][0]) {
            return frames[0][1];
        }

        for (let index = 1; index < frames.length; index++) {
            const previous = frames[index - 1];
            const current = frames[index];

            if (progress <= current[0]) {
                const local = smoothStep(
                    previous[0],
                    current[0],
                    progress
                );

                return lerp(previous[1], current[1], local);
            }
        }

        return frames[frames.length - 1][1];
    }

    function calculateParts(number) {
        let firstPart = Math.floor(number / 30) * 30;

        if (firstPart === number) {
            firstPart -= 30;
        }

        return [firstPart, number - firstPart];
    }

    function createDrop(x, y, radius, value, side = "") {
        return {
            x,
            y,
            radius,
            value,
            side,
            opacity: 1,
            textOpacity: 1,
            nextValue: null,
            nextTextOpacity: 0,
            aspect: 0,
            rotation: 0,
            brightness: 1
        };
    }

    function resizeCanvases() {
        const rectangle = stage.getBoundingClientRect();

        stageWidth = Math.max(1, rectangle.width);
        stageHeight = Math.max(1, rectangle.height);
        deviceScale = Math.min(window.devicePixelRatio || 1, 2);

        waterCanvas.width = Math.round(stageWidth * deviceScale);
        waterCanvas.height = Math.round(stageHeight * deviceScale);

        simulationWidth = Math.max(
            180,
            Math.min(300, Math.round(stageWidth * .38))
        );
        simulationHeight = Math.max(
            160,
            Math.round(simulationWidth * stageHeight / stageWidth)
        );

        simulationCanvas.width = simulationWidth;
        simulationCanvas.height = simulationHeight;
        simulationImage = simulationContext.createImageData(
            simulationWidth,
            simulationHeight
        );
        particleDensity = new Float32Array(
            simulationWidth * simulationHeight
        );
    }

    function makeDiskPoints(count, radius, phase = 0) {
        const points = [];
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        for (let index = 0; index < count; index++) {
            const radial = radius * Math.sqrt((index + .35) / count);
            const angle = index * goldenAngle + phase;

            points.push({
                x: Math.cos(angle) * radial,
                y: Math.sin(angle) * radial
            });
        }

        return points;
    }

    function initializeWaterParticles(centerX, centerY, visibleRadius) {
        const count = 48;
        const halfCount = count / 2;
        const unified = makeDiskPoints(count, visibleRadius * .72, .3);
        const orderedIndices = unified
            .map((point, index) => ({ index, x: point.x }))
            .sort((first, second) => first.x - second.x)
            .map(item => item.index);
        const leftIndices = new Set(orderedIndices.slice(0, halfCount));
        const leftTargets = makeDiskPoints(
            halfCount,
            visibleRadius * .60,
            .15
        );
        const rightTargets = makeDiskPoints(
            halfCount,
            visibleRadius * .60,
            Math.PI + .15
        );
        let leftTargetIndex = 0;
        let rightTargetIndex = 0;

        waterParticles = unified.map((point, index) => {
            const group = leftIndices.has(index) ? "left" : "right";
            const splitPoint = group === "left"
                ? leftTargets[leftTargetIndex++]
                : rightTargets[rightTargetIndex++];

            return {
                x: centerX + point.x,
                y: centerY + point.y,
                vx: 0,
                vy: 0,
                group,
                unifiedX: point.x,
                unifiedY: point.y,
                splitX: splitPoint.x,
                splitY: splitPoint.y
            };
        });

        particleMorph = 0;
        particleUnifiedScale = 1;
        particleGroupScale.left = 1;
        particleGroupScale.right = 1;
        waterOpacity = 1;
    }

    function getParticleTarget(particle) {
        if (drops.length === 1) {
            const resultDrop = drops[0];

            return {
                x: resultDrop.x +
                    particle.unifiedX * particleUnifiedScale,
                y: resultDrop.y +
                    particle.unifiedY * particleUnifiedScale
            };
        }

        const groupDrop = drops.find(drop => {
            return drop.side === particle.group;
        });
        const groupScale = particleGroupScale[particle.group];
        const localX = lerp(
            particle.unifiedX * particleUnifiedScale,
            particle.splitX * groupScale,
            particleMorph
        );
        const localY = lerp(
            particle.unifiedY * particleUnifiedScale,
            particle.splitY * groupScale,
            particleMorph
        );

        return {
            x: groupDrop.x + localX,
            y: groupDrop.y + localY
        };
    }

    function stepWaterParticles(deltaSeconds, stiffness = 108) {
        const limitedDelta = Math.min(deltaSeconds || .016, .055);
        const substeps = 2;
        const step = limitedDelta / substeps;

        for (let substep = 0; substep < substeps; substep++) {
            for (const particle of waterParticles) {
                const target = getParticleTarget(particle);
                const accelerationX =
                    (target.x - particle.x) * stiffness;
                const accelerationY =
                    (target.y - particle.y) * stiffness;

                particle.vx += accelerationX * step;
                particle.vy += accelerationY * step;

                const damping = Math.exp(-11.5 * step);
                particle.vx *= damping;
                particle.vy *= damping;
            }

            /*
                Yakın parçacıklar birbirinin içine giremez. Bu basınç
                etkisi yüzeyin kusursuz iki daireye dönüşmesini engeller
                ve kopma anında küçük, doğal düzensizlikler üretir.
            */
            for (let first = 0; first < waterParticles.length; first++) {
                for (
                    let second = first + 1;
                    second < waterParticles.length;
                    second++
                ) {
                    const firstParticle = waterParticles[first];
                    const secondParticle = waterParticles[second];
                    const deltaX = secondParticle.x - firstParticle.x;
                    const deltaY = secondParticle.y - firstParticle.y;
                    const distanceSquared =
                        deltaX * deltaX + deltaY * deltaY;
                    const minimumDistance = 9.5;

                    if (
                        distanceSquared <= .0001 ||
                        distanceSquared >= minimumDistance * minimumDistance
                    ) {
                        continue;
                    }

                    const distance = Math.sqrt(distanceSquared);
                    const pressure =
                        (minimumDistance - distance) * 13 * step;
                    const normalX = deltaX / distance;
                    const normalY = deltaY / distance;

                    firstParticle.vx -= normalX * pressure;
                    firstParticle.vy -= normalY * pressure;
                    secondParticle.vx += normalX * pressure;
                    secondParticle.vy += normalY * pressure;
                }
            }

            for (const particle of waterParticles) {
                particle.x += particle.vx * step;
                particle.y += particle.vy * step;
            }
        }
    }

    function addParticleImpulse(groups, strength = 42) {
        const selected = waterParticles.filter(particle => {
            return groups.includes(particle.group);
        });
        const centerX = selected.reduce(
            (sum, particle) => sum + particle.x,
            0
        ) / selected.length;
        const centerY = selected.reduce(
            (sum, particle) => sum + particle.y,
            0
        ) / selected.length;

        selected.forEach((particle, index) => {
            const deltaX = particle.x - centerX;
            const deltaY = particle.y - centerY;
            const length = Math.hypot(deltaX, deltaY) || 1;
            const unevenness = 1 + .035 * Math.sin(index * 2.31);

            particle.vx +=
                deltaX / length * strength * unevenness;
            particle.vy +=
                deltaY / length * strength * unevenness;
        });
    }

    function snapParticlesToTargets(groups = null) {
        for (const particle of waterParticles) {
            if (groups && !groups.includes(particle.group)) {
                continue;
            }

            const target = getParticleTarget(particle);
            particle.x = target.x;
            particle.y = target.y;
            particle.vx = 0;
            particle.vy = 0;
        }
    }

    /*
        Su yüzeyi tek bir daire veya iki metaball ile çizilmez.
        Her parçacık kompakt bir yoğunluk çekirdeği bırakır. Bütün
        çekirdeklerin ortak eş yoğunluk sınırı görünen damladır.
    */
    function renderWaterField() {
        const pixels = simulationImage.data;
        const scaleX = simulationWidth / stageWidth;
        const scaleY = simulationHeight / stageHeight;
        const averageScale = (scaleX + scaleY) * .5;
        const influenceRadius = Math.max(12, 40 * averageScale);
        const influenceSquared = influenceRadius * influenceRadius;

        particleDensity.fill(0);

        for (const particle of waterParticles) {
            const centerX = particle.x * scaleX;
            const centerY = particle.y * scaleY;
            const minimumX = Math.max(
                1,
                Math.floor(centerX - influenceRadius)
            );
            const maximumX = Math.min(
                simulationWidth - 2,
                Math.ceil(centerX + influenceRadius)
            );
            const minimumY = Math.max(
                1,
                Math.floor(centerY - influenceRadius)
            );
            const maximumY = Math.min(
                simulationHeight - 2,
                Math.ceil(centerY + influenceRadius)
            );

            for (let y = minimumY; y <= maximumY; y++) {
                const deltaY = y - centerY;

                for (let x = minimumX; x <= maximumX; x++) {
                    const deltaX = x - centerX;
                    const distanceSquared =
                        deltaX * deltaX + deltaY * deltaY;

                    if (distanceSquared >= influenceSquared) {
                        continue;
                    }

                    const normalized =
                        1 - distanceSquared / influenceSquared;
                    const contribution =
                        normalized * normalized * normalized;

                    particleDensity[y * simulationWidth + x] +=
                        contribution;
                }
            }
        }

        let pixelIndex = 0;

        for (let y = 0; y < simulationHeight; y++) {
            for (let x = 0; x < simulationWidth; x++) {
                const densityIndex = y * simulationWidth + x;
                const density = particleDensity[densityIndex];
                const alpha =
                    smoothStep(.50, .76, density) * waterOpacity;

                if (alpha <= .002) {
                    pixels[pixelIndex] = 0;
                    pixels[pixelIndex + 1] = 0;
                    pixels[pixelIndex + 2] = 0;
                    pixels[pixelIndex + 3] = 0;
                    pixelIndex += 4;
                    continue;
                }

                /*
                    Yoğunluk, rengin merkezde çok hafif derinleşmesi
                    için yeterlidir. Her pikselde yüzey normali ve üstel
                    ışık hesabı yapmak özellikle telefonda gereksiz bir
                    gecikme oluşturuyordu.
                */
                const depth = smoothStep(.55, 1.18, density);

                pixels[pixelIndex] = Math.round(157 - depth * 7);
                pixels[pixelIndex + 1] = Math.round(222 - depth * 5);
                pixels[pixelIndex + 2] = Math.round(241 - depth * 3);
                pixels[pixelIndex + 3] = Math.round(alpha * 248);
                pixelIndex += 4;
            }
        }

        simulationContext.putImageData(simulationImage, 0, 0);
    }

    function getParticleCenters() {
        const centers = {
            all: { x: 0, y: 0, count: 0 },
            left: { x: 0, y: 0, count: 0 },
            right: { x: 0, y: 0, count: 0 }
        };

        for (const particle of waterParticles) {
            centers.all.x += particle.x;
            centers.all.y += particle.y;
            centers.all.count += 1;

            const groupCenter = centers[particle.group];
            groupCenter.x += particle.x;
            groupCenter.y += particle.y;
            groupCenter.count += 1;
        }

        for (const center of Object.values(centers)) {
            if (center.count > 0) {
                center.x /= center.count;
                center.y /= center.count;
            }
        }

        return centers;
    }

    function drawNumbers() {
        const particleCenters = getParticleCenters();

        waterContext.save();
        waterContext.scale(deviceScale, deviceScale);
        waterContext.textAlign = "center";
        waterContext.textBaseline = "middle";
        waterContext.fillStyle = "#133b5d";

        for (const drop of drops) {
            const fontSize = clamp(drop.radius * .58, 29, 46);
            const centerKey =
                drop.side === "left" || drop.side === "right"
                    ? drop.side
                    : "all";
            const particleCenter = particleCenters[centerKey];
            const numberX = particleCenter.count
                ? particleCenter.x
                : drop.x;
            const numberY = particleCenter.count
                ? particleCenter.y
                : drop.y;

            waterContext.font =
                `700 ${fontSize}px Arial, Helvetica, sans-serif`;

            if (drop.value !== null && drop.value !== undefined) {
                waterContext.globalAlpha =
                    drop.opacity * drop.textOpacity;
                waterContext.fillText(drop.value, numberX, numberY + 1);
            }

            if (drop.nextValue !== null && drop.nextValue !== undefined) {
                waterContext.globalAlpha =
                    drop.opacity * drop.nextTextOpacity;
                waterContext.fillText(
                    drop.nextValue,
                    numberX,
                    numberY + 1
                );
            }
        }

        for (const label of floatingLabels) {
            const labelCenter = label.followParticles
                ? particleCenters.all
                : null;
            const labelX = labelCenter && labelCenter.count
                ? labelCenter.x
                : label.x;
            const labelY = labelCenter && labelCenter.count
                ? labelCenter.y
                : label.y;

            waterContext.globalAlpha = label.opacity;
            waterContext.font =
                `700 ${label.fontSize}px Arial, Helvetica, sans-serif`;
            waterContext.fillText(label.value, labelX, labelY);
        }

        waterContext.restore();
    }

    function renderScene() {
        renderWaterField();

        waterContext.clearRect(
            0,
            0,
            waterCanvas.width,
            waterCanvas.height
        );

        waterContext.save();
        waterContext.shadowColor = "rgba(37, 125, 180, .18)";
        waterContext.shadowBlur = 10 * deviceScale;
        waterContext.shadowOffsetY = 5 * deviceScale;
        waterContext.filter = `blur(${1.7 * deviceScale}px)`;
        waterContext.imageSmoothingEnabled = true;
        waterContext.imageSmoothingQuality = "high";
        waterContext.drawImage(
            simulationCanvas,
            0,
            0,
            waterCanvas.width,
            waterCanvas.height
        );
        waterContext.restore();

        drawNumbers();
    }

    function animate(duration, update, version = sceneVersion) {
        return new Promise(resolve => {
            const startTime = performance.now();
            let previousTime = startTime;

            cancelAnimationFrame(animationFrame);

            function frame(now) {
                if (version !== sceneVersion) {
                    resolve(false);
                    return;
                }

                const rawProgress = clamp(
                    (now - startTime) / duration,
                    0,
                    1
                );
                const deltaSeconds = Math.min(
                    (now - previousTime) / 1000,
                    .034
                );
                previousTime = now;

                update(rawProgress, deltaSeconds);
                renderScene();

                if (rawProgress < 1) {
                    animationFrame = requestAnimationFrame(frame);
                }
                else {
                    animationFrame = 0;
                    resolve(true);
                }
            }

            animationFrame = requestAnimationFrame(frame);
        });
    }

    async function touchRipple(drop, strength = .072) {
        const version = sceneVersion;
        const groups = drop.side === "left" || drop.side === "right"
            ? [drop.side]
            : ["left", "right"];

        addParticleImpulse(groups, 12 + strength * 75);

        const finished = await animate(220, (progress, deltaSeconds) => {
            stepWaterParticles(deltaSeconds, 112);
        }, version);

        if (finished) {
            renderScene();
        }

        return finished;
    }

    async function touchRippleGroup(group, strength = .072) {
        const version = sceneVersion;
        const groups = [...new Set(group.map(drop => drop.side))]
            .filter(side => side === "left" || side === "right");

        addParticleImpulse(groups, 13 + strength * 80);

        const finished = await animate(240, (progress, deltaSeconds) => {
            stepWaterParticles(deltaSeconds, 110);
        }, version);

        if (finished) {
            renderScene();
        }

        return finished;
    }

    function setupQuestion(number) {
        sceneVersion += 1;
        cancelAnimationFrame(animationFrame);
        animationFrame = 0;

        originalNumber = number;

        const parts = calculateParts(number);
        leftNumber = parts[0];
        rightNumber = parts[1];
        leftResult = leftNumber / 3;
        rightResult = rightNumber / 3;
        finalResult = originalNumber / 3;

        busy = false;
        completed = false;
        leftDivided = false;
        rightDivided = false;
        sceneMode = "source";
        floatingLabels = [];

        equationNumber.textContent = originalNumber;
        answerText.textContent = "";
        answerBox.classList.remove("filled");

        const sourceX = stageWidth / 2;
        const sourceY = 125;
        const visibleRadius = stageWidth < 500 ? 67 : 72;
        sourceVisibleRadius = visibleRadius;
        const halfMassRadius =
            visibleRadius / Math.pow(2, .25);

        /*
            Damla en baştan itibaren aynı iki su kütlesinden oluşur.
            Kütlelerin merkezleri tam çakıştığı için dışarıdan tek bir
            yuvarlak damla görünür. Bölünmede yeni şekil yaratılmaz;
            bu iki mevcut merkez birbirinden uzaklaşır.
        */
        drops = [
            createDrop(
                sourceX,
                sourceY,
                halfMassRadius,
                leftNumber,
                "left"
            ),
            createDrop(
                sourceX,
                sourceY,
                halfMassRadius,
                rightNumber,
                "right"
            )
        ];

        drops[0].textOpacity = 0;
        drops[1].textOpacity = 0;

        floatingLabels = [
            {
                x: sourceX,
                y: sourceY + 1,
                value: originalNumber,
                opacity: 1,
                fontSize: clamp(visibleRadius * .60, 39, 45),
                followParticles: true
            }
        ];

        initializeWaterParticles(
            sourceX,
            sourceY,
            visibleRadius
        );

        instruction.textContent = originalNumber + "'e tıkla.";

        document.querySelectorAll(".flyingFinalCanvas").forEach(element => {
            element.remove();
        });

        renderScene();
    }

    async function splitNumber() {
        if (busy || sceneMode !== "source") {
            return;
        }

        busy = true;
        const version = sceneVersion;
        const leftDrop = drops[0];
        const rightDrop = drops[1];

        instruction.textContent = "Damla titreşiyor.";
        addParticleImpulse(["left", "right"], 18);

        const sourceX = leftDrop.x;
        const sourceY = leftDrop.y;
        const leftTargetX = stageWidth * (stageWidth < 500 ? .25 : .27);
        const rightTargetX = stageWidth * (stageWidth < 500 ? .75 : .73);
        const targetY = 235;

        let splitKickApplied = false;

        const separated = await animate(900, (progress, deltaSeconds) => {
            const splitProgress = clamp(
                (progress - .12) / .88,
                0,
                1
            );

            /*
                Kısa dokunma tepkisi ve ayrılma aynı animasyonun
                parçalarıdır; arada bekleme yoktur.
            */
            const separation = keyframeProgress(splitProgress, [
                [0, 0],
                [.24, .17],
                [.48, .31],
                [.64, .39],
                [.76, .50],
                [1, 1]
            ]);
            const verticalMovement = keyframeProgress(splitProgress, [
                [0, 0],
                [.48, .28],
                [.76, .62],
                [1, 1]
            ]);
            const textArrival = smoothStep(.54, .82, splitProgress);
            const sourceFade = 1 - smoothStep(.30, .62, splitProgress);
            const afterPinch = Math.max(0, splitProgress - .64);
            const wobble = splitProgress < .64
                ? .008 * Math.sin(splitProgress * Math.PI * 2)
                : .024 * Math.exp(-8 * afterPinch) *
                    Math.sin(afterPinch * Math.PI * 6);

            leftDrop.x = lerp(sourceX, leftTargetX, separation);
            rightDrop.x = lerp(sourceX, rightTargetX, separation);
            leftDrop.y = lerp(sourceY, targetY, verticalMovement);
            rightDrop.y = lerp(sourceY, targetY, verticalMovement);
            leftDrop.aspect = wobble;
            rightDrop.aspect = wobble;
            leftDrop.rotation = 0;
            rightDrop.rotation = 0;
            leftDrop.textOpacity = textArrival;
            rightDrop.textOpacity = textArrival;
            floatingLabels[0].opacity = sourceFade;
            particleMorph = smoothStep(.08, .82, splitProgress);

            if (!splitKickApplied && splitProgress >= .64) {
                splitKickApplied = true;

                waterParticles.forEach((particle, index) => {
                    particle.vx += particle.group === "left" ? -7 : 7;
                    particle.vy += Math.sin(index * 1.71) * 1.1;
                });
            }

            stepWaterParticles(deltaSeconds, 112);

            if (progress < .12) {
                instruction.textContent = "Damla titreşiyor.";
            }
            else if (splitProgress < .43) {
                instruction.textContent =
                    "Damla iki yana doğru uzuyor.";
            }
            else if (splitProgress < .68) {
                instruction.textContent =
                    "Ortadaki su boynu inceliyor.";
            }
            else {
                instruction.textContent =
                    "İki damla birbirinden ayrılıyor.";
            }
        }, version);

        if (!separated || version !== sceneVersion) {
            return;
        }

        particleMorph = 1;

        leftDrop.aspect = 0;
        rightDrop.aspect = 0;
        leftDrop.rotation = 0;
        rightDrop.rotation = 0;
        snapParticlesToTargets();
        floatingLabels = [];
        sceneMode = "parts";
        busy = false;
        instruction.textContent = "İstediğin parçaya tıkla.";
        renderScene();
    }

    async function divideDrop(index) {
        if (busy || sceneMode !== "parts") {
            return;
        }

        const drop = drops[index];
        const alreadyDivided = drop.side === "left"
            ? leftDivided
            : rightDivided;

        if (alreadyDivided) {
            if (leftDivided && rightDivided) {
                mergeDrops(index);
            }
            else {
                instruction.textContent =
                    "Önce diğer parçayı da 3'e böl.";
            }

            return;
        }

        busy = true;
        const version = sceneVersion;
        const result = drop.side === "left"
            ? leftResult
            : rightResult;
        const startRadius = drop.radius;
        const targetRadius = startRadius * .90;
        const startParticleScale = particleGroupScale[drop.side];
        const targetParticleScale = startParticleScale * .90;

        instruction.textContent = "Damla titreşiyor.";
        addParticleImpulse([drop.side], 16);

        drop.nextValue = result;
        drop.nextTextOpacity = 0;

        const divided = await animate(400, (progress, deltaSeconds) => {
            const changeProgress = clamp(
                (progress - .18) / .82,
                0,
                1
            );
            const movement = easeInOutCubic(changeProgress);

            drop.radius = lerp(startRadius, targetRadius, movement);
            drop.textOpacity =
                1 - smoothStep(.12, .62, changeProgress);
            drop.nextTextOpacity =
                smoothStep(.38, .88, changeProgress);
            particleGroupScale[drop.side] = lerp(
                startParticleScale,
                targetParticleScale,
                movement
            );
            stepWaterParticles(deltaSeconds, 114);

            instruction.textContent = progress < .18
                ? "Damla titreşiyor."
                : "Damla küçülüyor.";
        }, version);

        if (!divided || version !== sceneVersion) {
            return;
        }

        drop.radius = targetRadius;
        drop.value = result;
        drop.nextValue = null;
        drop.textOpacity = 1;
        drop.nextTextOpacity = 0;
        drop.aspect = 0;
        particleGroupScale[drop.side] = targetParticleScale;
        snapParticlesToTargets([drop.side]);

        if (drop.side === "left") {
            leftDivided = true;
        }
        else {
            rightDivided = true;
        }

        busy = false;

        if (leftDivided && rightDivided) {
            instruction.textContent =
                "Şimdi iki damladan birine tekrar tıkla.";
        }
        else {
            instruction.textContent = "Diğer parçayı da 3'e böl.";
        }

        renderScene();
    }

    async function mergeDrops(clickedIndex) {
        if (
            busy ||
            sceneMode !== "parts" ||
            !leftDivided ||
            !rightDivided
        ) {
            return;
        }

        busy = true;
        sceneMode = "merging";
        const version = sceneVersion;

        instruction.textContent = "Damla titreşiyor.";
        addParticleImpulse([drops[clickedIndex].side], 15);

        const leftDrop = drops.find(drop => drop.side === "left");
        const rightDrop = drops.find(drop => drop.side === "right");
        const leftStart = { x: leftDrop.x, y: leftDrop.y };
        const rightStart = { x: rightDrop.x, y: rightDrop.y };
        const baseRadius = (leftDrop.radius + rightDrop.radius) / 2;
        const centerX = stageWidth / 2;
        const centerY = 335;
        const resultRadius = baseRadius * Math.SQRT2;
        const resultUnifiedScale =
            resultRadius / sourceVisibleRadius;

        floatingLabels = [
            {
                x: centerX,
                y: centerY + 1,
                value: finalResult,
                opacity: 0,
                fontSize: 43,
                followParticles: true
            }
        ];

        let contactImpulseApplied = false;

        const merged = await animate(900, (progress, deltaSeconds) => {
            const mergeProgress = clamp(
                (progress - .12) / .88,
                0,
                1
            );

            /*
                Yaklaşma hızlı başlar; temas, köprü ve fıstık evreleri
                daha yavaş geçer. Böylece birleşme üst üste binme gibi
                değil, yüzey gerilimiyle kaynaşma gibi görünür.
            */
            const movement = keyframeProgress(mergeProgress, [
                [0, 0],
                [.40, .55],
                [.60, .70],
                [.76, .82],
                [.90, .94],
                [1, 1]
            ]);
            const coalescence = smoothStep(.58, 1, mergeProgress);
            const radiusGrowth =
                1 +
                (Math.pow(2, .25) - 1) * coalescence;
            const afterContact = Math.max(0, mergeProgress - .60);
            const oscillation = mergeProgress < .60
                ? .006 * Math.sin(mergeProgress * Math.PI * 2)
                : .045 * Math.exp(-8 * afterContact) *
                    Math.sin(afterContact * Math.PI * 5);

            leftDrop.x = lerp(leftStart.x, centerX, movement);
            rightDrop.x = lerp(rightStart.x, centerX, movement);
            leftDrop.y = lerp(leftStart.y, centerY, movement);
            rightDrop.y = lerp(rightStart.y, centerY, movement);
            leftDrop.radius = baseRadius * radiusGrowth;
            rightDrop.radius = baseRadius * radiusGrowth;
            leftDrop.aspect = oscillation;
            rightDrop.aspect = oscillation;
            leftDrop.rotation = 0;
            rightDrop.rotation = 0;
            leftDrop.textOpacity =
                1 - smoothStep(.56, .78, mergeProgress);
            rightDrop.textOpacity =
                1 - smoothStep(.56, .78, mergeProgress);
            floatingLabels[0].opacity =
                smoothStep(.72, .94, mergeProgress);
            particleMorph =
                1 - smoothStep(.52, .96, mergeProgress);
            particleUnifiedScale = lerp(
                1,
                resultUnifiedScale,
                smoothStep(.62, 1, mergeProgress)
            );

            if (!contactImpulseApplied && mergeProgress >= .61) {
                contactImpulseApplied = true;

                waterParticles.forEach((particle, index) => {
                    particle.vx += particle.group === "left" ? 5 : -5;
                    particle.vy += Math.cos(index * 1.37) * .9;
                });
            }

            stepWaterParticles(deltaSeconds, 116);

            if (progress < .12) {
                instruction.textContent = "Damla titreşiyor.";
            }
            else if (mergeProgress < .50) {
                instruction.textContent =
                    "İki damla birbirine yaklaşıyor.";
            }
            else if (mergeProgress < .68) {
                instruction.textContent =
                    "Temas noktasında su köprüsü oluşuyor.";
            }
            else if (mergeProgress < .86) {
                instruction.textContent =
                    "İki damla tek yüzeyde kaynaşıyor.";
            }
            else {
                instruction.textContent =
                    "Yeni damla yuvarlaklaşıyor.";
            }
        }, version);

        if (!merged || version !== sceneVersion) {
            return;
        }

        drops = [
            createDrop(
                centerX,
                centerY,
                resultRadius,
                finalResult,
                "result"
            )
        ];
        drops[0].aspect = 0;
        floatingLabels = [];
        particleMorph = 0;
        particleUnifiedScale = resultUnifiedScale;

        drops[0].aspect = 0;
        drops[0].rotation = 0;
        snapParticlesToTargets();
        sceneMode = "result";
        busy = false;
        instruction.textContent = finalResult + "'e tıkla.";
        renderScene();
    }

    function moveResultToAnswer() {
        if (
            busy ||
            completed ||
            sceneMode !== "result" ||
            drops.length !== 1
        ) {
            return;
        }

        completed = true;
        busy = true;
        const resultDrop = drops[0];
        const stageRectangle = stage.getBoundingClientRect();
        const endRectangle = answerBox.getBoundingClientRect();
        const diameter = resultDrop.radius * 2;
        const cropPadding = 24;
        const cropSize = diameter + cropPadding * 2;
        const startLeft =
            stageRectangle.left + resultDrop.x - cropSize / 2;
        const startTop =
            stageRectangle.top + resultDrop.y - cropSize / 2;

        instruction.textContent = "Sonuç yerine gidiyor.";

        /*
            Yeni bir CSS baloncuğu çizilmez. Mevcut su damlasının
            canvas üzerindeki gerçek pikselleri kırpılıp kopyalanır.
            Böylece sıçrama sırasında bile stil değişemez.
        */
        const flying = document.createElement("canvas");
        flying.className = "flyingFinalCanvas";
        flying.width = Math.round(cropSize * deviceScale);
        flying.height = Math.round(cropSize * deviceScale);
        flying.style.left = startLeft + "px";
        flying.style.top = startTop + "px";
        flying.style.width = cropSize + "px";
        flying.style.height = cropSize + "px";

        const flyingContext = flying.getContext("2d", { alpha: true });
        const sourceLeft =
            (resultDrop.x - cropSize / 2) * deviceScale;
        const sourceTop =
            (resultDrop.y - cropSize / 2) * deviceScale;

        flyingContext.drawImage(
            waterCanvas,
            sourceLeft,
            sourceTop,
            cropSize * deviceScale,
            cropSize * deviceScale,
            0,
            0,
            flying.width,
            flying.height
        );

        document.body.appendChild(flying);

        resultDrop.opacity = 0;
        waterOpacity = 0;
        renderScene();

        const targetWidth = endRectangle.width * .94;
        const targetHeight = endRectangle.height * .94;
        const endLeft =
            endRectangle.left + (endRectangle.width - targetWidth) / 2;
        const endTop =
            endRectangle.top + (endRectangle.height - targetHeight) / 2;
        const middleLeft = (startLeft + endLeft) / 2;
        const middleTop = Math.min(startTop, endTop) - 85;

        const animation = flying.animate(
            [
                {
                    left: startLeft + "px",
                    top: startTop + "px",
                    width: cropSize + "px",
                    height: cropSize + "px",
                    transform: "rotate(0deg) scale(1)",
                    opacity: 1
                },
                {
                    offset: .22,
                    left: (startLeft - 15) + "px",
                    top: (startTop - 42) + "px",
                    transform: "rotate(-7deg) scale(.96, 1.10)"
                },
                {
                    offset: .55,
                    left: middleLeft + "px",
                    top: middleTop + "px",
                    transform: "rotate(7deg) scale(1.05, .96)"
                },
                {
                    left: endLeft + "px",
                    top: endTop + "px",
                    width: targetWidth + "px",
                    height: targetHeight + "px",
                    transform: "rotate(0deg) scale(1)",
                    opacity: 1
                }
            ],
            {
                duration: 700,
                easing: "cubic-bezier(.26, .72, .35, 1)",
                fill: "forwards"
            }
        );

        animation.onfinish = () => {
            flying.remove();
            answerText.textContent = finalResult;
            answerBox.classList.add("filled");
            instruction.textContent = "İşlem tamamlandı.";
            busy = false;
        };
    }

    function findTouchedDrop(x, y) {
        let closestIndex = -1;
        let closestDistance = Infinity;

        drops.forEach((drop, index) => {
            if (drop.opacity <= .05) {
                return;
            }

            const distance = Math.hypot(x - drop.x, y - drop.y);
            const hitRadius = Math.max(drop.radius * 1.18, 48);

            if (distance <= hitRadius && distance < closestDistance) {
                closestIndex = index;
                closestDistance = distance;
            }
        });

        return closestIndex;
    }

    function handleCanvasActivation(clientX, clientY) {
        if (busy) {
            return;
        }

        const rectangle = waterCanvas.getBoundingClientRect();
        const x = clientX - rectangle.left;
        const y = clientY - rectangle.top;
        const touchedIndex = findTouchedDrop(x, y);

        if (touchedIndex < 0) {
            return;
        }

        if (sceneMode === "source") {
            splitNumber();
        }
        else if (sceneMode === "parts") {
            divideDrop(touchedIndex);
        }
        else if (sceneMode === "result") {
            moveResultToAnswer();
        }
    }

    waterCanvas.addEventListener("pointerdown", event => {
        handleCanvasActivation(event.clientX, event.clientY);
    });

    waterCanvas.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") {
            return;
        }

        event.preventDefault();

        if (busy) {
            return;
        }

        if (sceneMode === "source") {
            splitNumber();
        }
        else if (sceneMode === "result") {
            moveResultToAnswer();
        }
    });

    newQuestionButton.addEventListener("click", () => {
        let number;

        do {
            number = (Math.floor(Math.random() * 80) + 20) * 3;
        }
        while (number < 60 || number > 297);

        setupQuestion(number);
    });

    exampleButton.addEventListener("click", () => {
        setupQuestion(165);
    });

    window.addEventListener("resize", () => {
        const previousWidth = stageWidth;
        const previousHeight = stageHeight;

        resizeCanvases();

        if (previousWidth > 1 && previousHeight > 1) {
            const horizontalRatio = stageWidth / previousWidth;
            const verticalRatio = stageHeight / previousHeight;

            drops.forEach(drop => {
                drop.x *= horizontalRatio;
                drop.y *= verticalRatio;
                drop.radius *= Math.sqrt(
                    horizontalRatio * verticalRatio
                );
            });

            floatingLabels.forEach(label => {
                label.x *= horizontalRatio;
                label.y *= verticalRatio;
            });

            const localScale = Math.sqrt(
                horizontalRatio * verticalRatio
            );

            waterParticles.forEach(particle => {
                particle.x *= horizontalRatio;
                particle.y *= verticalRatio;
                particle.vx *= horizontalRatio;
                particle.vy *= verticalRatio;
                particle.unifiedX *= localScale;
                particle.unifiedY *= localScale;
                particle.splitX *= localScale;
                particle.splitY *= localScale;
            });

            sourceVisibleRadius *= localScale;
        }

        renderScene();
    });

    resizeCanvases();
    setupQuestion(165);
</script>
</body>
</html>
