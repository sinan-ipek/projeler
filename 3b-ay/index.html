/* Sağ üstteki ışık kumandası tam bir ışık yönü alanıdır.
   Merkez = ışık kameradan gelir.
   Kenar = ışık tam yandan gelir ve Ay yarım görünür.
   Kenarın dış halkasına doğru sürüklemek = ışık Ay'ın arkasına geçer.
   Böylece hilal evrelerine kadar geniş bir aydınlatma açısı elde edilir. */
let lightX=0.46, lightY=-0.38;
let lightZ=0.80;

function updateLightFromControl(){
    const length=Math.hypot(lightX,lightY,lightZ)||1;
    const distance=8;
    mainLight.position.set(
        lightX/length*distance,
        -lightY/length*distance,
        lightZ/length*distance
    );

    /* Kontrol noktasının ekrandaki konumu x/y'dir.
       Işık arkaya geçtiğinde noktanın çevresinde halka gösterilir. */
    const displayRadius=lightZ>=0 ? 0.68 : 0.92;
    const xyLen=Math.hypot(lightX,lightY);
    let dx=0,dy=0;
    if(xyLen>0.0001){
        dx=lightX/xyLen*displayRadius*Math.sqrt(Math.max(0,1-lightZ*lightZ));
        dy=lightY/xyLen*displayRadius*Math.sqrt(Math.max(0,1-lightZ*lightZ));
    }
    lightDot.style.left=((dx+1)*50)+"%";
    lightDot.style.top=((dy+1)*50)+"%";
    lightDot.style.boxShadow=lightZ>=0
        ?"0 0 7px rgba(255,255,255,.95),0 0 15px rgba(255,255,255,.6)"
        :"0 0 0 3px rgba(255,255,255,.38),0 0 12px rgba(255,255,255,.35)";
}

function setLightFromPointer(e){
    const rect=lightControl.getBoundingClientRect();
    let x=(e.clientX-(rect.left+rect.width/2))/(rect.width/2);
    let y=(e.clientY-(rect.top+rect.height/2))/(rect.height/2);
    const r=Math.hypot(x,y);

    /* İç bölge: ön yarımküre.
       r ≈ 0.68: ışık tam yandan gelir -> yarım Ay.
       Dış halka: ışık giderek arka yarımküreye geçer. */
    const HALF_RADIUS=0.68;
    const MAX_RADIUS=0.94;
    const rr=Math.min(r,MAX_RADIUS);

    let azX=1,azY=0;
    if(r>0.0001){azX=x/r;azY=y/r;}

    let theta;
    if(rr<=HALF_RADIUS){
        theta=(rr/HALF_RADIUS)*(Math.PI/2);
    }else{
        theta=Math.PI/2+
              ((rr-HALF_RADIUS)/(MAX_RADIUS-HALF_RADIUS))*(Math.PI/2*0.88);
    }

    lightX=azX*Math.sin(theta);
    lightY=azY*Math.sin(theta);
    lightZ=Math.cos(theta);

    /* Beyaz nokta doğrudan imleci takip etsin. */
    const px=azX*rr;
    const py=azY*rr;
    lightDot.style.left=((px+1)*50)+"%";
    lightDot.style.top=((py+1)*50)+"%";
    lightDot.style.boxShadow=lightZ>=0
        ?"0 0 7px rgba(255,255,255,.95),0 0 15px rgba(255,255,255,.6)"
        :"0 0 0 3px rgba(255,255,255,.38),0 0 12px rgba(255,255,255,.35)";

    const length=Math.hypot(lightX,lightY,lightZ)||1;
    const distance=8;
    mainLight.position.set(
        lightX/length*distance,
        -lightY/length*distance,
        lightZ/length*distance
    );
}

let lightDragging=false;
lightControl.addEventListener("pointerdown",e=>{

    setLightFromPointer(e);

});

    setLightFromPointer(e);
    e.preventDefault();

});
lightControl.addEventListener("pointerup",e=>{
    lightDragging=false;
    try{lightControl.releasePointerCapture(e.pointerId)}catch{}

});

function circleToData(circle){

        angularRadius:circle.angularRadius,

            CIRCLE_STORAGE_KEY,
            JSON.stringify(circles.map(circleToData))
        );
    }catch(err){
        console.warn("Daireler kaydedilemedi:",err);
    }
}

function scheduleCircleSave(){
    if(restoringCircles)return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(saveCirclesNow,120);
}

function restoreSavedCircles(){
    let data=null;
    try{
        const raw=localStorage.getItem(CIRCLE_STORAGE_KEY);
        if(!raw)return;
        data=JSON.parse(raw);
    }catch(err){
        console.warn("Kayıtlı daireler okunamadı:",err);
        return;
    }

    if(!Array.isArray(data))return;

    restoringCircles=true;
    try{
        for(const item of data){
            if(!item || !item.centerNormal)continue;
            const n=new THREE.Vector3(
                Number(item.centerNormal.x),
                Number(item.centerNormal.y),
                Number(item.centerNormal.z)
            );
            if(!Number.isFinite(n.x)||!Number.isFinite(n.y)||!Number.isFinite(n.z)||n.lengthSq()<0.5)continue;

            const radius=THREE.MathUtils.clamp(
                Number(item.angularRadius)||DEFAULT_RADIUS,
                MIN_RADIUS,
                MAX_RADIUS
            );
            const color=(typeof item.color==="string")?item.color:circleColor.value;
            const circle=new MoonCircle(n.normalize(),radius,color);
            circles.push(circle);
        }
    }finally{
        restoringCircles=false;
        updateCircleCount();
    }
}

function deleteCircle(circle){
    if(!circle)return;
    const index=circles.indexOf(circle);
    if(index<0)return;
    circleGroup.remove(circle.line);
    circle.geometry.dispose();
    circle.material.dispose();
    circles.splice(index,1);
    updateCircleCount();
    if(activeCircle===circle)activeCircle=null;
    if(selectedCircle===circle)selectedCircle=null;
    saveCirclesNow();
}

function clearAllCircles(){
    for(const circle of circles){
        circleGroup.remove(circle.line);
        circle.geometry.dispose();
        circle.material.dispose();
    }
    circles.length=0;
    updateCircleCount();
    activeCircle=null;
    selectedCircle=null;
    try{localStorage.removeItem(CIRCLE_STORAGE_KEY)}catch{}
}


function directionToUV(n){
    let phi=Math.atan2(n.z,-n.x);
    if(phi<0) phi+=Math.PI*2;
    const u=phi/(Math.PI*2);
    const theta=Math.acos(THREE.MathUtils.clamp(n.y,-1,1));
    const v=1-theta/Math.PI;
    return {u,v};
}

function sampleDEMFromUV(u,v){
    if(!dem) return demMid;
    u=((u%1)+1)%1;
    v=THREE.MathUtils.clamp(v,0,1);
    const x=u*(DEM_W-1);
    const y=(1-v)*(DEM_H-1);
    const x0=Math.floor(x), y0=Math.floor(y);
    const x1=(x0+1)%DEM_W, y1=Math.min(y0+1,DEM_H-1);
    const tx=x-x0, ty=y-y0;
    const a=dem[y0*DEM_W+x0], b=dem[y0*DEM_W+x1];
    const c=dem[y1*DEM_W+x0], d=dem[y1*DEM_W+x1];
    return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,tx),THREE.MathUtils.lerp(c,d,tx),ty);
}

function radiusForDirection(n){
    if(!dem || demMax===demMin) return MOON_RADIUS;
    const {u,v}=directionToUV(n);
    const h=sampleDEMFromUV(u,v);
    const normalized=(h-demMid)/(demMax-demMin);
    return MOON_RADIUS*(1+normalized*RELIEF_AMPLITUDE);
}

function applyDisplacementToMoonGeometry(){
    if(!moonGeometry || !dem)return;
    const pos=moonGeometry.attributes.position;
    const uv=moonGeometry.attributes.uv;
    const p=new THREE.Vector3();

    for(let i=0;i<pos.count;i++){
        p.fromBufferAttribute(pos,i).normalize();
        const h=sampleDEMFromUV(uv.getX(i),uv.getY(i));
        const normalized=(h-demMid)/(demMax-demMin);
        const r=MOON_RADIUS*(1+normalized*RELIEF_AMPLITUDE);
        pos.setXYZ(i,p.x*r,p.y*r,p.z*r);
    }

    pos.needsUpdate=true;
    moonGeometry.computeVertexNormals();
    moonGeometry.computeBoundingSphere();

    for(const c of circles)c.update();
}

function updateDisplacement(){
    RELIEF_AMPLITUDE=Number(displaceSlider.value)/1000;
    if(displaceValue)displaceValue.textContent=RELIEF_AMPLITUDE.toFixed(3);
    applyDisplacementToMoonGeometry();
}

displaceSlider.addEventListener("input",updateDisplacement);

function qualitySpec(level=activeQuality){
    return QUALITY_LEVELS[level]||QUALITY_LEVELS.high;
}

function setQuality(level,{force=false}={}){
    if(!QUALITY_LEVELS[level])return;
    if(!force && level===activeQuality && moonGeometry)return;
    activeQuality=level;
    const spec=qualitySpec(level);
    const oldGeometry=moonGeometry;
    moonGeometry=new THREE.SphereGeometry(MOON_RADIUS,spec.w,spec.h);
    applyDisplacementToMoonGeometry();
    if(moonMesh){
        moonMesh.geometry=moonGeometry;
    }else{
        moonMesh=new THREE.Mesh(moonGeometry,textureEnabled?texturedMaterial:plasterMaterial);
        moonMesh.visible=modelVisible;
        moonRoot.add(moonMesh);
    }
    if(oldGeometry && oldGeometry!==moonGeometry)oldGeometry.dispose();
    qualityCooldownUntil=performance.now()+3500;
    updateQualityButton();
}

function updateQualityButton(){
    if(!qualityButton)return;
    const L=t();
    qualityButton.textContent=qualityMode==="auto"?"AUTO":L.q[qualityMode];
    const q=L.q[activeQuality];
    qualityButton.title=qualityMode==="auto"
        ?L.qualityAuto.replace("{q}",q)
        :L.qualityFixed.replace("{q}",L.q[qualityMode]);
}

function cycleQualityMode(){
    const modes=["auto","low","normal","high"];
    qualityMode=modes[(modes.indexOf(qualityMode)+1)%modes.length];
    highFpsSince=0;
    fpsWindowStart=performance.now(); fpsFrames=0;
    if(qualityMode!=="auto")setQuality(qualityMode,{force:true});
    updateQualityButton();
}
qualityButton.addEventListener("click",cycleQualityMode);

function buildDisplacedMoon(){
    setQuality(activeQuality,{force:true});
}

async function loadDEM(){
    status.textContent=t().loadingDem;
    const response=await fetch(DEM_URL);
    if(!response.ok) throw new Error(`LDEM yüklenemedi: ${response.status}`);
    const buffer=await response.arrayBuffer();
    if(buffer.byteLength!==DEM_W*DEM_H*2) throw new Error("LDEM veri boyutu beklenenden farklı");
    dem=new Uint16Array(buffer);
    demMin=65535; demMax=0;
    for(let i=0;i<dem.length;i++){
        if(dem[i]<demMin) demMin=dem[i];
        if(dem[i]>demMax) demMax=dem[i];
    }
    demMid=(demMin+demMax)/2;
}

function loadTexture(){
    return new Promise((resolve,reject)=>{
        new THREE.TextureLoader().load(TEXTURE_URL,tex=>{
            tex.colorSpace=THREE.SRGBColorSpace;
            tex.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());
            tex.minFilter=THREE.LinearMipmapLinearFilter;
            tex.magFilter=THREE.LinearFilter;
            texturedMaterial.map=tex;
            texturedMaterial.needsUpdate=true;
            resolve();
        },undefined,reject);
    });
}

class MoonCircle{
    constructor(centerNormal,angularRadius=DEFAULT_RADIUS,color=currentColor){
        this.centerNormal=centerNormal.clone().normalize();
        this.angularRadius=angularRadius;
        this.geometry=new LineGeometry();
        const circleColorValue=color instanceof THREE.Color?color:new THREE.Color(color);
        this.material=new LineMaterial({color:circleColorValue.getHex(),linewidth:CIRCLE_LINE_WIDTH,worldUnits:false,depthTest:true,depthWrite:false,transparent:true,opacity:1});
        this.material.resolution.set(innerWidth,innerHeight);
        this.line=new Line2(this.geometry,this.material);
        this.line.userData.circle=this;
        circleGroup.add(this.line);
        this.update();
    }
    setCenter(n){this.centerNormal.copy(n).normalize();this.update();scheduleCircleSave();}
    setRadius(r){this.angularRadius=THREE.MathUtils.clamp(r,MIN_RADIUS,MAX_RADIUS);this.update();scheduleCircleSave();}
    setColor(c){this.material.color.copy(c);scheduleCircleSave();}
    update(){
        const n=this.centerNormal.clone().normalize();
        const helper=Math.abs(n.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
        const u=new THREE.Vector3().crossVectors(helper,n).normalize();
        const v=new THREE.Vector3().crossVectors(n,u).normalize();
        const positions=[];
        const cosR=Math.cos(this.angularRadius),sinR=Math.sin(this.angularRadius);
        for(let i=0;i<=CIRCLE_SEGMENTS;i++){
            const a=i/CIRCLE_SEGMENTS*Math.PI*2;
            const dir=n.clone().multiplyScalar(cosR)
                .add(u.clone().multiplyScalar(Math.cos(a)*sinR))
                .add(v.clone().multiplyScalar(Math.sin(a)*sinR)).normalize();
            /* Rakım sıfır: her nokta doğrudan LDEM ile tanımlanan yüzey yarıçapına oturur. */
            const r=radiusForDirection(dir);
            positions.push(dir.x*r,dir.y*r,dir.z*r);
        }
        this.geometry.dispose();
        this.geometry=new LineGeometry();
        this.geometry.setPositions(positions);
        this.line.geometry=this.geometry;
        this.line.computeLineDistances();
    }
}

function updateCircleCount(){circleCount.textContent=String(circles.length);}

function createCircleFromLocalPoint(localPoint){
    const circle=new MoonCircle(localPoint.clone().normalize(),DEFAULT_RADIUS,currentColor.clone());
    circles.push(circle);
    updateCircleCount();
    scheduleCircleSave();
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function setPointer(e){
    const r=renderer.domElement.getBoundingClientRect();
    pointer.x=((e.clientX-r.left)/r.width)*2-1;
    pointer.y=-((e.clientY-r.top)/r.height)*2+1;
    raycaster.setFromCamera(pointer,camera);
}

function intersectMoon(e){
    if(!moonMesh) return null;
    setPointer(e);
    const wasVisible=moonMesh.visible;
    moonMesh.visible=true;
    moonMesh.updateMatrixWorld(true);
    const hits=raycaster.intersectObject(moonMesh,false);
    moonMesh.visible=wasVisible;
    if(!hits.length) return null;
    return moonRoot.worldToLocal(hits[0].point.clone());
}

function circleAt(e){
    if(!circles.length)return null;
    setPointer(e);
    raycaster.params.Line2={threshold:4};
    const hits=raycaster.intersectObjects(circles.map(c=>c.line),false);
    return hits.length?hits[0].object.userData.circle:null;
}

/* Ay yüzeyindeki tıklamanın herhangi bir dairenin içinde olup olmadığını bulur.
   Çember çizgisi ayrıca circleAt() ile yakalanır ve yarıçap değiştirmeye ayrılır. */
function circleInteriorAt(e){
    if(!circles.length)return null;
    const hit=intersectMoon(e);
    if(!hit)return null;
    const n=hit.clone().normalize();
    let best=null;
    let bestAngle=Infinity;
    for(const circle of circles){
        const angle=circle.centerNormal.angleTo(n);
        if(angle<circle.angularRadius && angle<bestAngle){
            bestAngle=angle;
            best=circle;
        }
    }
    return best?{circle:best,hit}:null;
}

let mode=null,activeCircle=null,selectedCircle=null;
let downX=0,downY=0,lastX=0,lastY=0,moved=false;
let inertiaX=0,inertiaY=0,lastMoveTime=performance.now();
const DRAG_THRESHOLD=4;

/* Çember taşırken kavrama noktasının merkeze sıçramasını engeller. */
let circleGrabNormal=null;
let circleStartCenter=null;

function applyRotation(rx,ry){
    const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion).normalize();
    const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion).normalize();
    moonRoot.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(up,rx));
    moonRoot.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(right,ry));
    moonRoot.quaternion.normalize();
}
function rotateMoon(dx,dy){applyRotation(dx*ROTATION_SPEED,dy*ROTATION_SPEED);}

function moveCircle(e){
    if(!activeCircle||!circleGrabNormal||!circleStartCenter)return;
    const hit=intersectMoon(e); if(!hit)return;
    const current=hit.clone().normalize();
    const q=new THREE.Quaternion().setFromUnitVectors(circleGrabNormal,current);
    activeCircle.setCenter(circleStartCenter.clone().applyQuaternion(q).normalize());
}
function resizeCircle(e){
    if(!activeCircle)return;
    const hit=intersectMoon(e); if(!hit)return;
    activeCircle.setRadius(activeCircle.centerNormal.angleTo(hit.clone().normalize()));
}

renderer.domElement.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    renderer.domElement.setPointerCapture(e.pointerId);
    downX=lastX=e.clientX; downY=lastY=e.clientY; moved=false; lastMoveTime=performance.now();
    inertiaX=inertiaY=0;

    /* Öncelik 1: çember çizgisi -> yarıçap değiştir. */
    const edgeCircle=circleAt(e);
    if(edgeCircle){
        activeCircle=edgeCircle;
        selectedCircle=edgeCircle;
        mode="resizeCircle";
        renderer.domElement.style.cursor="ew-resize";
        e.preventDefault();
        return;
    }

    /* Öncelik 2: dairenin içi -> daireyi taşı. */
    const inside=circleInteriorAt(e);
    if(inside){
        activeCircle=inside.circle;
        selectedCircle=inside.circle;
        mode="moveCircle";
        circleGrabNormal=inside.hit.clone().normalize();
        circleStartCenter=activeCircle.centerNormal.clone();
        renderer.domElement.style.cursor="grabbing";
        e.preventDefault();
        return;
    }

    /* Daire dışında kalan Ay yüzeyi -> Ay'ı döndür. */
    selectedCircle=null;
    mode="rotate";
});

renderer.domElement.addEventListener("pointermove",e=>{
    if(!mode){
        const edge=circleAt(e);
        if(edge){
            renderer.domElement.style.cursor="ew-resize";
        }else{
            const inside=circleInteriorAt(e);
            renderer.domElement.style.cursor=inside?"grab":"default";
        }
        return;
    }
    const now=performance.now();
    const dt=THREE.MathUtils.clamp(now-lastMoveTime,4,50);
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.hypot(e.clientX-downX,e.clientY-downY)>DRAG_THRESHOLD)moved=true;
    if(mode==="rotate"&&moved){
        rotateMoon(dx,dy);
        const f=16.666/dt;
        inertiaX=THREE.MathUtils.clamp(inertiaX*.35+dx*ROTATION_SPEED*f*.65,-MAX_INERTIA_SPEED,MAX_INERTIA_SPEED);
        inertiaY=THREE.MathUtils.clamp(inertiaY*.35+dy*ROTATION_SPEED*f*.65,-MAX_INERTIA_SPEED,MAX_INERTIA_SPEED);
        renderer.domElement.style.cursor="grabbing";
    }else if(mode==="moveCircle"){moveCircle(e);inertiaX=inertiaY=0;}
    else if(mode==="resizeCircle"){resizeCircle(e);inertiaX=inertiaY=0;}
    lastX=e.clientX;lastY=e.clientY;lastMoveTime=now;
});

renderer.domElement.addEventListener("pointerup",e=>{
    if(mode==="moveCircle"||mode==="resizeCircle"||(mode==="rotate"&&!moved))inertiaX=inertiaY=0;
    mode=null;activeCircle=null;circleGrabNormal=null;circleStartCenter=null;moved=false;
    renderer.domElement.style.cursor="default";
    try{renderer.domElement.releasePointerCapture(e.pointerId)}catch{}
});

renderer.domElement.addEventListener("dblclick",e=>{
    if(e.button!==0||circleAt(e))return;
    const hit=intersectMoon(e); if(!hit)return;
    inertiaX=inertiaY=0;
    createCircleFromLocalPoint(hit);
});

renderer.domElement.addEventListener("pointercancel",()=>{
    mode=null;activeCircle=null;circleGrabNormal=null;circleStartCenter=null;moved=false;
});
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());

renderer.domElement.addEventListener("wheel",e=>{
    e.preventDefault();
    const dir=new THREE.Vector3();camera.getWorldDirection(dir);
    camera.position.addScaledVector(dir,-e.deltaY*.0025);
    let d=THREE.MathUtils.clamp(camera.position.length(),MOON_RADIUS+.4,18);
    camera.position.normalize().multiplyScalar(d);camera.lookAt(0,0,0);
},{passive:false});

textureButton.addEventListener("click",()=>{
    textureEnabled=!textureEnabled;
    if(moonMesh)moonMesh.material=textureEnabled?texturedMaterial:plasterMaterial;
    textureButton.classList.toggle("off",!textureEnabled);
});
modelButton.addEventListener("click",()=>{
    modelVisible=!modelVisible;
    if(moonMesh)moonMesh.visible=modelVisible;
    modelButton.classList.toggle("off",!modelVisible);
});
colorInput.addEventListener("input",()=>{
    currentColor=new THREE.Color(colorInput.value);
});
clearCirclesButton.addEventListener("click",()=>{
    clearAllCircles();
});

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    circles.forEach(c=>c.material.resolution.set(innerWidth,innerHeight));
});

async function init(){
    try{
        status.textContent=t().loadingDem;
        await loadDEM();
        status.textContent=t().geometry;
        buildDisplacedMoon();
        restoreSavedCircles();
        status.textContent=t().loadingTexture;
        await loadTexture();
        status.textContent=t().ready;
        setTimeout(()=>status.style.opacity="0",1600);
    }catch(err){
        console.error(err);
        status.textContent=t().loadFail+err.message;
        if(!moonMesh){dem=null;demMin=0;demMax=65535;demMid=32767.5;buildDisplacedMoon();restoreSavedCircles();}
    }
}
function updateAutoQuality(now){
    if(qualityMode!=="auto")return;
    fpsFrames++;
    const elapsed=now-fpsWindowStart;
    if(elapsed<3000)return;
    const fps=fpsFrames*1000/elapsed;
    fpsFrames=0; fpsWindowStart=now;

    if(now<qualityCooldownUntil)return;
    const idx=QUALITY_ORDER.indexOf(activeQuality);
    if(fps<27 && idx>0){
        setQuality(QUALITY_ORDER[idx-1]);
        highFpsSince=0;
        return;
    }
    if(fps>54 && idx<QUALITY_ORDER.length-1){
        if(!highFpsSince)highFpsSince=now;
        if(now-highFpsSince>10000){
            setQuality(QUALITY_ORDER[idx+1]);
            highFpsSince=0;
        }
    }else{
        highFpsSince=0;
    }
}

function animate(now=performance.now()){
    requestAnimationFrame(animate);
    if(mode===null&&(Math.abs(inertiaX)>MIN_INERTIA_SPEED||Math.abs(inertiaY)>MIN_INERTIA_SPEED))applyRotation(inertiaX,inertiaY);
    renderer.render(scene,camera);
    updateAutoQuality(now);
}
applyLanguage();
init();
animate();
</script>
</body>
</html>
