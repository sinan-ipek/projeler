<title>Ceva Teoremi v1.4</title>
<style>
:root{--bg:#fff;--fg:#161b22;--line:#263543;--sub:#66727d;--red:#ff3347}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg)}
body.dark{--bg:#101217;--fg:#f4f4f5;--line:#f4f4f5;--sub:#adb6c0}
.page{max-width:1800px;margin:auto;padding:20px 28px 24px}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.btn{cursor:pointer;background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:999px;padding:12px 19px;font-size:16px}
.btn.secondary{background:transparent;color:var(--fg)}
.opt{display:flex;align-items:center;gap:8px;font-size:15px}
.opt input{width:18px;height:18px;accent-color:var(--fg)}
#homeBtn.si-home-btn{width:48px!important;height:48px!important;min-width:48px!important;max-width:48px!important;padding:0!important;background:#ffdf49!important;border:0!important;border-radius:12px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;box-shadow:0 5px 12px rgba(0,0,0,.23),0 2px 4px rgba(0,0,0,.12)!important;text-decoration:none!important;transition:transform .16s ease}
#homeBtn.si-home-btn svg{width:27px!important;height:27px!important;fill:#000!important}
#homeBtn.si-home-btn svg path{fill:#000!important;stroke:none!important}
#homeBtn:hover{background:#ffe451!important;transform:translateY(-2px)}
#scene{display:block;width:100%;height:auto;background:var(--bg);border-radius:16px}
.heading{font:600 30px Inter,system-ui,sans-serif;fill:var(--fg)}
.note{font:400 18px Inter,system-ui,sans-serif;fill:var(--sub)}
.edge{stroke:var(--line);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cevian{stroke:var(--sub);stroke-width:2.5;opacity:.58;fill:none}
.dot{fill:var(--fg)}
.label{font:600 31px Inter,system-ui,sans-serif;fill:var(--fg)}
.highlight{stroke:var(--red);stroke-width:9;stroke-linecap:round;fill:none;filter:url(#glow)}
.highlight-core{stroke:#ffe5e8;stroke-width:2.4;stroke-linecap:round}
.frac{font:500 38px Inter,system-ui,sans-serif;fill:var(--fg);text-anchor:middle}
.frac-line{stroke:var(--fg);stroke-width:2.6;stroke-linecap:round}
.formula-symbol{font:600 40px Inter,system-ui,sans-serif;fill:var(--fg);text-anchor:middle;dominant-baseline:middle}
#hand{filter:drop-shadow(0 2px 3px rgba(0,0,0,.16));pointer-events:none}
.version{position:fixed;right:12px;bottom:9px;font-size:12px;color:#888}
#status{margin-left:auto;color:var(--sub);font-size:14px}
@media(max-width:720px){.page{padding:12px}.controls{gap:8px}#status{width:100%;margin-left:0}}
</style></head>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg";
const hand=$("hand");
  function restoreHandCutout() {
    const handImage = hand.querySelector('image');
    if (!handImage) return;
    const original = handImage.getAttribute('href');
    if (!original || !original.startsWith('data:image/')) return;
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h || w*h > 3000000) return;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0);
        const imageData = ctx.getImageData(0,0,w,h);
        const rgba = imageData.data;
        const pixels = w*h;
        const seen = new Uint8Array(pixels);
        const queue = new Int32Array(pixels);
        let head = 0, tail = 0;
        const isBackground = (p) => {
          const i = p*4;
          const r=rgba[i],g=rgba[i+1],b=rgba[i+2];
          const bright = Math.max(r,g,b);
          // Limit propagation to a nearly black, low-saturation matte.
          return rgba[i+3] < 15 || (bright < 66 && bright-Math.min(r,g,b) < 39);
        };
        const enqueue = (p) => {
          if (seen[p] || !isBackground(p)) return;
          seen[p] = 1;
          queue[tail++] = p;
        };
        for (let x=0;x<w;x++){enqueue(x);enqueue((h-1)*w+x);}
        for (let y=0;y<h;y++){enqueue(y*w);enqueue(y*w+w-1);}
        while(head<tail){
          const p=queue[head++];
          const x=p%w, y=(p-x)/w;
