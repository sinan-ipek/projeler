<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ceva Teoremi · v1.0</title>
<style>
:root{--bg:#f8f8f6;--ink:#1d2630;--soft:#7a8490;--edge:#263544;--gold:#e4a931;--blue:#368abf;--red:#e46c50}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif}
body.dark{--bg:#111419;--ink:#f2f2f3;--soft:#abb4c1;--edge:#dce3ec;--gold:#f0bb59;--blue:#66b9ec;--red:#ff947c}
.page{max-width:1750px;margin:auto;padding:19px 27px 24px}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.button{font:600 15px/1.2 inherit;cursor:pointer;border:1px solid var(--ink);color:var(--bg);background:var(--ink);border-radius:11px;padding:12px 18px;min-height:44px}
.button.secondary{background:transparent;color:var(--ink)}
.button:hover{opacity:.86}
.switch{display:inline-flex;gap:7px;align-items:center;font-size:14px;margin-left:5px}
.switch input{accent-color:var(--ink);width:17px;height:17px}
#homeBtn.si-home-btn{width:48px!important;height:48px!important;min-width:48px!important;max-width:48px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;background:#ffdf49!important;border:0!important;border-radius:12px!important;box-shadow:0 5px 12px rgba(0,0,0,.23),0 2px 4px rgba(0,0,0,.12)!important;text-decoration:none!important}
#homeBtn.si-home-btn svg{width:27px!important;height:27px!important;fill:#000!important}
#homeBtn.si-home-btn svg path{fill:#000!important;stroke:none!important}
#homeBtn:hover{background:#ffe451!important;transform:translateY(-2px)}
.stage{width:100%;display:block;border-radius:17px;background:var(--bg)}
svg{width:100%;height:auto;display:block}
.header{font-size:38px;font-weight:600;fill:var(--ink)}
.subtitle{font-size:21px;fill:var(--soft)}
.outline{stroke:var(--edge);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ceva{fill:none;stroke-width:6;stroke-linecap:round}
.point{fill:var(--ink)}
.point-label{font-size:29px;fill:var(--ink);font-weight:650}
.formula-label{font-size:32px;fill:var(--ink);font-weight:550;text-anchor:middle}
.bar{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.product{fill:var(--ink)}
.final{font-size:45px;fill:var(--ink);font-weight:600;text-anchor:middle}
.note{font-size:22px;fill:var(--soft)}
.version{position:fixed;bottom:9px;right:12px;color:#888;font-size:12px;pointer-events:none}
#status{font-size:14px;color:var(--soft);margin-left:auto}
@media(max-width:780px){.page{padding:12px}.header{font-size:35px}.toolbar{gap:8px}#status{width:100%;margin-left:0}}
</style>
</head>
<body>
<main class="page">
<div class="toolbar">
<a href="/projeler/" id="homeBtn" class="si-home-btn" aria-label="Ana Sayfa · Startseite" title="Ana Sayfa · Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 2 11.2l1.4 1.7L5 11.6V21h5.1v-6.2h3.8V21H19v-9.4l1.6 1.3 1.4-1.7L12 2.6Z"/></svg></a>
<button type="button" id="play" class="button">Oynat</button>
<button type="button" id="reset" class="button secondary">Başa dön</button>
<label class="switch"><input id="dark" type="checkbox"> Siyah arka plan</label>
<span id="status" aria-live="polite">Başlamak için Oynat'a basın</span>
</div>
<svg id="scene" class="stage" viewBox="0 0 1700 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ceva teoremi: AD, BE ve CF doğruları O noktasında kesişir. BD/DC çarpı CE/EA çarpı AF/FB eşittir 1.">
<text class="header" x="850" y="85" text-anchor="middle">CEVA TEOREMİ</text>
<text class="subtitle" x="850" y="125" text-anchor="middle">Üç cevian · Bir kesişim noktası · Bir çarpım</text>
<g id="triangle">
<path class="outline" d="M170 180 L820 220 L510 735 Z"/>
</g>
<g id="cevians">
<line id="AD" class="ceva" stroke="var(--gold)"/>
<line id="BE" class="ceva" stroke="var(--blue)"/>
<line id="CF" class="ceva" stroke="var(--red)"/>
</g>
<g id="vertices"></g>
<g id="intersection"><circle id="halo" r="18" fill="none" stroke="var(--ink)" stroke-width="1.5" opacity="0"/><circle id="O" r="6" class="point" opacity="0"/><text id="Olabel" class="point-label" opacity="0">O</text></g>
<g id="equation">
<text x="1055" y="385" class="subtitle" text-anchor="middle">Ceva bağıntısı</text>
<g id="frac0" opacity="0"><text x="955" y="476" class="formula-label">|BD|</text><line x1="895" y1="502" x2="1015" y2="502" class="bar"/><text x="955" y="555" class="formula-label">|DC|</text></g>
<g id="frac1" opacity="0"><text x="1180" y="476" class="formula-label">|CE|</text><line x1="1120" y1="502" x2="1240" y2="502" class="bar"/><text x="1180" y="555" class="formula-label">|EA|</text></g>
<g id="frac2" opacity="0"><text x="1405" y="476" class="formula-label">|AF|</text><line x1="1345" y1="502" x2="1465" y2="502" class="bar"/><text x="1405" y="555" class="formula-label">|FB|</text></g>
<circle id="mul0" cx="1067.5" cy="502" r="5.1" class="product" opacity="0"/>
<circle id="mul1" cx="1292.5" cy="502" r="5.1" class="product" opacity="0"/>
<text id="equals" x="1528" y="516" class="final" opacity="0">=</text>
<text id="one" x="1595" y="516" class="final" opacity="0">1</text>
<text id="result" x="1250" y="663" class="note" text-anchor="middle" opacity="0">Üç cevian tek noktada kesişirse çarpım 1'dir.</text>
</g>
</svg>
</main>
<div class="version">v1.0 · Ceva</div>
<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const svgNS="http://www.w3.org/2000/svg";
const P={A:{x:170,y:180},B:{x:820,y:220},C:{x:510,y:735}};
const mass={A:0.34,B:0.29,C:0.37};
// Barycentric construction guarantees concurrency exactly.
function weighted(p,q,u,v){return {x:(p.x*u+q.x*v)/(u+v),y:(p.y*u+q.y*v)/(u+v)};}
const Pts={
 D:weighted(P.B,P.C,mass.B,mass.C),
 E:weighted(P.C,P.A,mass.C,mass.A),
 F:weighted(P.A,P.B,mass.A,mass.B),
 O:{x:P.A.x*mass.A+P.B.x*mass.B+P.C.x*mass.C,
    y:P.A.y*mass.A+P.B.y*mass.B+P.C.y*mass.C}
};
Object.assign(P,Pts);
const labels={A:[-25,-17],B:[14,-7],C:[6,39],D:[18,23],E:[-32,23],F:[0,-18]};
const vertices=$("vertices");
for(const name of ["A","B","C","D","E","F"]){
 const p=P[name];
 const dot=document.createElementNS(svgNS,"circle");
 dot.setAttribute("cx",p.x);dot.setAttribute("cy",p.y);dot.setAttribute("r",name==="A"||name==="B"||name==="C"?6:5);
 dot.setAttribute("class","point");vertices.appendChild(dot);
 const tx=document.createElementNS(svgNS,"text");
 tx.setAttribute("x",p.x+labels[name][0]);tx.setAttribute("y",p.y+labels[name][1]);
 tx.setAttribute("class","point-label");tx.setAttribute("text-anchor","middle");
 tx.textContent=name;vertices.appendChild(tx);
}
$("O").setAttribute("cx",P.O.x);$("O").setAttribute("cy",P.O.y);
$("halo").setAttribute("cx",P.O.x);$("halo").setAttribute("cy",P.O.y);
$("Olabel").setAttribute("x",P.O.x+18);$("Olabel").setAttribute("y",P.O.y-11);
const segments=[["AD","A","D"],["BE","B","E"],["CF","C","F"]];
segments.forEach(([id,a,b])=>{
 const el=$(id);el.setAttribute("x1",P[a].x);el.setAttribute("y1",P[a].y);
 el.setAttribute("x2",P[b].x);el.setAttribute("y2",P[b].y);
 const len=Math.hypot(P[a].x-P[b].x,P[a].y-P[b].y);
 el.dataset.length=String(len);
 el.style.strokeDasharray=String(len);
});
const duration=13.4;
let time=0,playing=false,last=0,token=0;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=t=>{t=clamp(t);return t*t*(3-2*t);};
function show(id,alpha){$(id).setAttribute("opacity",String(clamp(alpha)));}
function render(t){
 const draw=[ease((t-1.0)/2.0),ease((t-3.2)/2.0),ease((t-5.4)/2.0)];
 segments.forEach(([id],i)=>{
   const el=$(id);el.style.strokeDashoffset=String((1-draw[i])*Number(el.dataset.length));
 });
 const o=ease((t-7.5)/0.7);
 show("O",o);show("halo",o);show("Olabel",o);
 const f=[ease((t-8.5)/0.75),ease((t-9.4)/0.75),ease((t-10.3)/0.75)];
 f.forEach((v,i)=>show("frac"+i,v));
 show("mul0",f[1]);show("mul1",f[2]);
 const eq=ease((t-11.35)/0.7);
 show("equals",eq);show("one",ease((t-11.75)/0.7));
 show("result",ease((t-12.3)/0.7));
 if(t<1)$("status").textContent="ABC üçgeni ve kenar noktaları";
 else if(t<3.2)$("status").textContent="AD cevianı çiziliyor";
 else if(t<5.4)$("status").textContent="BE cevianı çiziliyor";
 else if(t<7.5)$("status").textContent="CF cevianı çiziliyor";
 else if(t<8.5)$("status").textContent="AD, BE ve CF aynı O noktasında kesişiyor";
 else if(t<11.35)$("status").textContent="Kenar oranları sırayla yerleştiriliyor";
 else $("status").textContent="|BD|/|DC| · |CE|/|EA| · |AF|/|FB| = 1";
}
function frame(ts,currentToken){
 if(currentToken!==token||!playing)return;
 if(!last)last=ts;
 time=Math.min(duration,time+(ts-last)/1000);
 last=ts;render(time);
 if(time>=duration){playing=false;$("play").textContent="Yeniden oynat";return;}
 requestAnimationFrame(next=>frame(next,currentToken));
}
$("play").addEventListener("click",()=>{
 if(playing){playing=false;token++;last=0;$("play").textContent="Devam et";return;}
 if(time>=duration){time=0;render(time);}
 playing=true;last=0;$("play").textContent="Duraklat";
 const currentToken=++token;requestAnimationFrame(ts=>frame(ts,currentToken));
});
$("reset").addEventListener("click",()=>{
 playing=false;token++;last=0;time=0;render(0);$("play").textContent="Oynat";
});
$("dark").addEventListener("change",()=>document.body.classList.toggle("dark",$("dark").checked));
render(0);
})();
</script>
<script src="/projeler/analytics.js?v=20261123"></script>
</body>
</html>
