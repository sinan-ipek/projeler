<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ortalama</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f7fb;
  color:#25324a;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  min-height:72px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:20px;
  padding:8px 24px;
}
button{
  border:1px solid #ccd3df;
  background:#fff;
  border-radius:9px;
  padding:10px 17px;
  font-size:15px;
  cursor:pointer;
  transition:.15s;
}
button:hover{background:#f0f3f8}

.center-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  min-width:0;
}

.mode-switch{
  display:flex;
  gap:8px;
  align-items:center;
}

.mode-btn{
  min-width:92px;
}

.mode-btn.active{
  background:#25324a;
  color:#fff;
  border-color:#25324a;
}

.mode-btn.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.count-control{
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 12px;
  background:#fff;
  border:1px solid #d7dce5;
  border-radius:11px;
  white-space:nowrap;
}

.count-label{
  font-size:14px;
  color:#596579;
}

#countSlider{
  width:180px;
  accent-color:#5b8def;
  cursor:pointer;
}

#countValue{
  width:24px;
  text-align:center;
  font-size:16px;
  font-weight:700;
  color:#25324a;
}

.game{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:18px 18px 94px;
}
.columns{
  --column-w:92px;
  --block-w:78px;
  --gap:42px;
  height:min(70vh,560px);
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:var(--gap);
}
.column-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:0;
}
.column{
  width:var(--column-w);
  height:min(62vh,500px);
  display:flex;
  flex-direction:column-reverse;
  justify-content:flex-start;
  align-items:center;
  border-bottom:3px solid #596579;
  position:relative;
}
.block{
  width:var(--block-w);
  height:18px;
  flex:0 0 18px;
  background:#5b8def;
  border:1px solid rgba(255,255,255,.7);
  border-radius:3px;
  cursor:grab;
  transition:background .35s,transform .15s,box-shadow .15s,opacity .15s;
}
.block:hover{
  transform:scale(1.04);
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}
.block:active{cursor:grabbing}
.block.dragging{opacity:0}

.drag-image{
  position:fixed;
  left:-10000px;
  top:-10000px;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
  z-index:9999;
}

.drag-image .block{
  margin:0;
  transform:none !important;
  box-shadow:none !important;
  opacity:1 !important;
}

.column.solved .block{background:#45b96b}

.value{
  margin-top:13px;
  min-width:46px;
  height:34px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid #d5dae4;
  border-radius:8px;
  font-size:18px;
  font-weight:600;
  transition:.35s;
}
.value.solved{
  color:#18843c;
  border-color:#68c985;
  background:#eefaf2;
}

.message{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(10px);
  min-width:min(86vw,390px);
  padding:14px 22px;
  border-radius:12px;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.35s;
}
.message.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
.message-title{
  color:#24984d;
  font-size:20px;
  font-weight:700;
}
.message-text{
  margin-top:4px;
  font-size:16px;
}
.column.drag-over{
  filter:brightness(1.04);
}

@media(max-width:900px){
  .topbar{
    grid-template-columns:auto 1fr auto;
    gap:10px;
    padding:8px 12px;
  }
  .center-controls{gap:10px}
  #countSlider{width:120px}
  .count-label{display:none}
}

@media(max-width:700px){
  .topbar{
    min-height:108px;
    grid-template-columns:auto auto;
    grid-template-areas:
      "home new"
      "center center";
  }
  #homeBtn{grid-area:home;justify-self:start}
  #newBtn{grid-area:new;justify-self:end}
  .center-controls{
    grid-area:center;
    width:100%;
  }
  .game{padding:8px 6px 86px}
  #countSlider{width:130px}
}

@media(max-width:480px){
  .mode-btn{
    min-width:72px;
    padding:9px 10px;
    font-size:13px;
  }
  .count-control{
    gap:7px;
    padding:6px 8px;
  }
  #countSlider{width:100px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button id="homeBtn" aria-label="Ana sayfa">⌂</button>

    <div class="center-controls">
      <div class="mode-switch" aria-label="Mod seçimi">
        <button id="simpleModeBtn" class="mode-btn active" aria-pressed="true">Basit</button>
        <button id="advancedModeBtn" class="mode-btn disabled" aria-pressed="false" title="Yakında">Gelişmiş</button>
      </div>

      <div class="count-control">
        <span class="count-label">Sayı adedi</span>
        <input id="countSlider" type="range" min="1" max="10" step="1" value="3" aria-label="Ortalaması alınacak sayı adedi">
        <span id="countValue">3</span>
      </div>
    </div>

    <button id="newBtn">Yeni</button>
  </div>

  <main class="game">
    <div id="columns" class="columns"></div>

    <div id="message" class="message">
      <div class="message-title">Tebrikler!</div>
      <div id="messageText" class="message-text">Ortalama değeri buldunuz.</div>
    </div>
  </main>
</div>

<script>
const BLOCK_VALUE = 1;
const MIN_VALUE = 1;
const MAX_VALUE = 25;
const DEFAULT_COUNT = 3;

let values = [];
let draggedBlock = null;
let sourceColumn = null;
let solved = false;
let columnCount = DEFAULT_COUNT;

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function generateValues(count){
  if(count===1){
    return [randomInt(MIN_VALUE,MAX_VALUE)];
  }

  // Ortalama tam sayı olsun ve başlangıçta sütunlar eşit olmasın.
  // 1 ve 25 uçlarında, tüm değerler 1..25 arasında kalırken farklı
  // sütunlar üretmek mümkün olmadığı için çok sütunlu oyunda 2..24 kullanılır.
  const targetAverage=randomInt(MIN_VALUE+1,MAX_VALUE-1);
  const result=new Array(count).fill(targetAverage);

  let changed=false;
  const attempts=Math.max(8,count*5);

  for(let k=0;k<attempts;k++){
    const a=randomInt(0,count-1);
    let b=randomInt(0,count-1);
    if(a===b) continue;

    if(result[a]>MIN_VALUE && result[b]<MAX_VALUE){
      const maxMove=Math.min(
        result[a]-MIN_VALUE,
        MAX_VALUE-result[b],
        Math.max(1,Math.min(6,targetAverage))
      );

      if(maxMove>0){
        const amount=randomInt(1,maxMove);
        result[a]-=amount;
        result[b]+=amount;
        changed=true;
      }
    }
  }

  if(!changed || result.every(v=>v===targetAverage)){
    const amount=Math.min(
      targetAverage-MIN_VALUE,
      MAX_VALUE-targetAverage,
      1
    );

    if(amount>0){
      result[0]-=amount;
      result[1]+=amount;
    }
  }

  return shuffle(result);
}

function updateColumnSizing(){
  const container=document.getElementById("columns");
  const count=values.length || columnCount;

  let columnW=92;
  let blockW=78;
  let gap=42;

  if(count>=8){
    columnW=68;
    blockW=58;
    gap=14;
  }else if(count>=6){
    columnW=76;
    blockW=64;
    gap=20;
  }else if(count>=4){
    columnW=84;
    blockW=70;
    gap=30;
  }

  container.style.setProperty("--column-w",columnW+"px");
  container.style.setProperty("--block-w",blockW+"px");
  container.style.setProperty("--gap",gap+"px");
}

function startGame(newValues){
  solved=false;
  values=[...newValues];
  document.getElementById("message").classList.remove("show");
  updateColumnSizing();
  render();

  if(values.length===1){
    checkSolution();
  }
}

function render(){
  const container=document.getElementById("columns");
  container.innerHTML="";

  values.forEach((value,index)=>{
    const wrap=document.createElement("div");
    wrap.className="column-wrap";

    const column=document.createElement("div");
    column.className="column";
    column.dataset.index=index;

    for(let i=0;i<value;i++){
      const block=document.createElement("div");
      block.className="block";
      block.draggable=true;
      block.dataset.column=index;
      block.dataset.level=i;

      block.addEventListener("dragstart",e=>{
        if(solved){
          e.preventDefault();
          return;
        }

        sourceColumn=Number(block.dataset.column);
        const startLevel=Number(block.dataset.level);

        draggedBlock={
          column:sourceColumn,
          level:startLevel,
          count:values[sourceColumn]-startLevel
        };

        const movingBlocks=[...column.querySelectorAll(".block")]
          .filter((b,idx)=>idx>=startLevel);

        movingBlocks.forEach(b=>b.classList.add("dragging"));

        const dragImage=document.createElement("div");
        dragImage.className="drag-image";
        dragImage.style.setProperty("--block-w",getComputedStyle(document.getElementById("columns")).getPropertyValue("--block-w"));

        for(let n=0;n<movingBlocks.length;n++){
          const ghostBlock=document.createElement("div");
          ghostBlock.className="block";
          dragImage.appendChild(ghostBlock);
        }

        document.body.appendChild(dragImage);

        const blockRect=block.getBoundingClientRect();
        const pointerX=e.clientX-blockRect.left;
        const pointerY=e.clientY-blockRect.top;
        const dragHeight=movingBlocks.length*blockRect.height;

        e.dataTransfer.setDragImage(
          dragImage,
          pointerX,
          dragHeight-blockRect.height+pointerY
        );

        e.dataTransfer.effectAllowed="move";

        requestAnimationFrame(()=>{
          dragImage.remove();
        });
      });

      block.addEventListener("dragend",()=>{
        document.querySelectorAll(".block.dragging").forEach(b=>b.classList.remove("dragging"));
        draggedBlock=null;
        sourceColumn=null;
        document.querySelectorAll(".column").forEach(c=>c.classList.remove("drag-over"));
      });

      column.appendChild(block);
    }

    column.addEventListener("dragover",e=>{
      if(solved) return;
      e.preventDefault();
      column.classList.add("drag-over");
    });

    column.addEventListener("dragleave",()=>{
      column.classList.remove("drag-over");
    });

    column.addEventListener("drop",e=>{
      e.preventDefault();
      column.classList.remove("drag-over");

      if(draggedBlock===null || sourceColumn===null) return;

      const targetColumn=Number(column.dataset.index);
      if(targetColumn===sourceColumn) return;

      const moveCount=draggedBlock.count;

      if(moveCount>0 && values[sourceColumn]>=moveCount){
        values[sourceColumn]-=moveCount*BLOCK_VALUE;
        values[targetColumn]+=moveCount*BLOCK_VALUE;
      }

      render();
      checkSolution();
    });

    const valueLabel=document.createElement("div");
    valueLabel.className="value";
    valueLabel.textContent=value;

    wrap.appendChild(column);
    wrap.appendChild(valueLabel);
    container.appendChild(wrap);
  });
}

function checkSolution(){
  if(values.length===0) return;

  const first=values[0];
  const equal=values.every(value=>value===first);

  if(!equal) return;

  solved=true;

  document.querySelectorAll(".column").forEach(column=>{
    column.classList.add("solved");
  });

  document.querySelectorAll(".value").forEach(value=>{
    value.classList.add("solved");
  });

  document.getElementById("messageText").textContent=
    "Ortalama değeri buldunuz: "+first;

  document.getElementById("message").classList.add("show");
}

function newQuestion(){
  startGame(generateValues(columnCount));
}

document.getElementById("homeBtn").addEventListener("click",()=>{
  window.location.href="../index.html";
});

document.getElementById("simpleModeBtn").addEventListener("click",()=>{
  document.getElementById("simpleModeBtn").classList.add("active");
  document.getElementById("simpleModeBtn").setAttribute("aria-pressed","true");
});

document.getElementById("advancedModeBtn").addEventListener("click",()=>{
  // Gelişmiş mod daha sonra eklenecek.
});

const countSlider=document.getElementById("countSlider");
const countValue=document.getElementById("countValue");

countSlider.addEventListener("input",()=>{
  columnCount=Number(countSlider.value);
  countValue.textContent=columnCount;
});

countSlider.addEventListener("change",()=>{
  newQuestion();
});

document.getElementById("newBtn").addEventListener("click",newQuestion);

startGame(generateValues(DEFAULT_COUNT));
</script>
</body>
</html>
