<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ortalama</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f7fb;
  color:#25324a;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.app{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.topbar{
  min-height:72px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:20px;
  padding:8px 24px;
}
button{
  border:1px solid #ccd3df;
  background:#fff;
  border-radius:9px;
  padding:10px 17px;
  font-size:15px;
  cursor:pointer;
  transition:.15s;
}
button:hover{background:#f0f3f8}

#homeBtn{
  width:44px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#homeBtn svg{
  display:block;
}

.center-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  min-width:0;
}

.mode-switch{
  display:flex;
  gap:8px;
  align-items:center;
}

.mode-btn{
  min-width:92px;
}

.mode-btn.active{
  background:#25324a;
  color:#fff;
  border-color:#25324a;
}

.mode-btn.disabled{
  opacity:.5;
  cursor:not-allowed;
}

.slider-toggle-btn{
  min-width:82px;
}

.slider-toggle-btn.locked{
  opacity:.45;
  cursor:not-allowed;
}

.slider-toggle-btn.active{
  background:#4f86e8;
  color:#fff;
  border-color:#4f86e8;
}

.count-control{
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 12px;
  background:#fff;
  border:1px solid #d7dce5;
  border-radius:11px;
  white-space:nowrap;
}

.count-label{
  font-size:14px;
  color:#596579;
}

#countSlider{
  width:180px;
  accent-color:#5b8def;
  cursor:pointer;
}

#countValue{
  width:24px;
  text-align:center;
  font-size:16px;
  font-weight:700;
  color:#25324a;
}

.game{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:18px 18px 94px;
}
.columns{
  --column-w:92px;
  --block-w:78px;
  --gap:42px;
  height:min(70vh,560px);
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:var(--gap);
}
.column-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:0;
}
.column{
  width:var(--column-w);
  height:min(62vh,500px);
  display:flex;
  flex-direction:column-reverse;
  justify-content:flex-start;
  align-items:center;
  border-bottom:3px solid #596579;
  position:relative;
}
.block{
  width:var(--block-w);
  height:18px;
  flex:0 0 18px;
  background:#5b8def;
  border:1px solid rgba(255,255,255,.7);
  border-radius:3px;
  cursor:grab;
  transition:background .35s,transform .15s,box-shadow .15s,opacity .15s;
}
.block:hover{
  transform:scale(1.04);
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}
.block:active{cursor:grabbing}
.block.dragging{opacity:0}

.drag-image{
  position:fixed;
  left:-10000px;
  top:-10000px;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
  z-index:9999;
}

.drag-image .block{
  margin:0;
  transform:none !important;
  box-shadow:none !important;
  opacity:1 !important;
}

.rewind-group{
  position:fixed;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
  z-index:10000;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,.18));
}

.rewind-group .block{
  margin:0;
  transform:none !important;
  box-shadow:none !important;
  opacity:1 !important;
}

.block.rewind-hidden{
  opacity:0 !important;
}

.column.solved .block{background:#45b96b}

.value{
  margin-top:13px;
  min-width:46px;
  height:34px;
  padding:0 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid #d5dae4;
  border-radius:8px;
  font-size:18px;
  font-weight:600;
  transition:.35s;
}
.value.solved{
  color:#18843c;
  border-color:#68c985;
  background:#eefaf2;
}

.message{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(10px);
  min-width:min(86vw,390px);
  padding:14px 22px;
  border-radius:12px;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.12);
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.35s;
}
.message.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
  pointer-events:auto;
}
.message-title{
  color:#24984d;
  font-size:20px;
  font-weight:700;
}
.message-text{
  margin-top:4px;
  font-size:16px;
}

.retry-btn{
  margin-top:12px;
  display:none;
  pointer-events:auto;
  background:#25324a;
  color:#fff;
  border-color:#25324a;
}

.retry-btn.show{
  display:inline-block;
}

.retry-btn:hover{
  background:#34425d;
}
.column.drag-over{
  filter:brightness(1.04);
}

/* Dikey seviye cetveli */
.level-ruler{
  position:absolute;
  z-index:30;
  width:34px;
  height:450px;
  pointer-events:none;
  transition:opacity .2s;
}

.level-ruler.hidden{
  opacity:0;
  pointer-events:none;
}

.level-line.hidden{
  opacity:0;
}

.level-track{
  position:absolute;
  left:14px;
  top:0;
  width:5px;
  height:100%;
  background:#8d96a3;
  border-radius:4px;
}

.level-ticks{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.level-tick{
  position:absolute;
  right:17px;
  height:1px;
  background:#aab2bf;
  transform:translateY(.5px);
}

.level-tick.minor{width:6px}
.level-tick.major{width:11px}

.level-tick-label{
  position:absolute;
  right:30px;
  transform:translateY(50%);
  font-size:10px;
  color:#8a94a3;
  line-height:1;
}

.level-handle{
  position:absolute;
  left:5px;
  width:22px;
  height:14px;
  border-radius:4px;
  background:#4f86e8;
  border:1px solid rgba(0,0,0,.12);
  box-shadow:0 2px 5px rgba(0,0,0,.18);
  transform:translateY(50%);
  cursor:ns-resize;
  pointer-events:auto;
  transition:background .16s, box-shadow .16s, transform .08s;
}

.level-handle:hover{
  box-shadow:0 3px 7px rgba(0,0,0,.22);
}

.level-handle.correct{
  background:#e34848;
  box-shadow:0 0 0 3px rgba(227,72,72,.14),0 3px 7px rgba(0,0,0,.20);
}

.level-line{
  position:absolute;
  z-index:20;
  height:0;
  border-top:2px dashed #9aa3af;
  pointer-events:none;
  opacity:.85;
}

.message.best{
  animation:bestPulse .72s ease-in-out 3;
  border:2px solid #f0b429;
  box-shadow:0 8px 30px rgba(240,180,41,.35);
}

.message.best .message-title{
  color:#d89000;
}

@keyframes bestPulse{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.08)}
}

#fireworks{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:9998;
}

@media(max-width:900px){
  .topbar{
    grid-template-columns:auto 1fr auto;
    gap:10px;
    padding:8px 12px;
  }
  .center-controls{gap:10px}
  #countSlider{width:120px}
  .count-label{display:none}
}

@media(max-width:700px){
  .topbar{
    min-height:108px;
    grid-template-columns:auto auto;
    grid-template-areas:
      "home new"
      "center center";
  }
  #homeBtn{grid-area:home;justify-self:start}
  #newBtn{grid-area:new;justify-self:end}
  .center-controls{
    grid-area:center;
    width:100%;
  }
  .game{padding:8px 6px 86px}
  #countSlider{width:130px}
}

@media(max-width:480px){
  .mode-btn{
    min-width:72px;
    padding:9px 10px;
    font-size:13px;
  }
  .count-control{
    gap:7px;
    padding:6px 8px;
  }
  #countSlider{width:100px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button id="homeBtn" aria-label="Ana sayfa" title="Ana sayfa">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 19.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M9 21v-7h6v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="13.2" cy="17.5" r=".7" fill="currentColor"/>
    </svg>
  </button>

    <div class="center-controls">
      <div class="mode-switch" aria-label="Mod seçimi">
        <button id="simpleModeBtn" class="mode-btn active" aria-pressed="true">Basit</button>
        <button id="advancedModeBtn" class="mode-btn disabled" aria-pressed="false" title="Yakında">Gelişmiş</button>
      </div>

      <button id="sliderToggleBtn" class="slider-toggle-btn" title="Sürgüyü göster">Sürgü</button>

      <div class="count-control">
        <span class="count-label">Sayı adedi</span>
        <input id="countSlider" type="range" min="1" max="10" step="1" value="3" aria-label="Ortalaması alınacak sayı adedi">
        <span id="countValue">3</span>
      </div>
    </div>

    <button id="newBtn">Yeni</button>
  </div>

  <main class="game">
    <div id="levelRuler" class="level-ruler" aria-label="Seviye cetveli">
      <div class="level-track"></div>
      <div id="levelTicks" class="level-ticks"></div>
      <div id="levelHandle" class="level-handle" role="slider" aria-label="Seviye" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0" tabindex="0"></div>
    </div>
    <div id="levelLine" class="level-line"></div>

    <div id="columns" class="columns"></div>

    <div id="message" class="message">
      <div class="message-title">Tebrikler!</div>
      <div id="messageText" class="message-text">Ortalama değeri buldunuz.</div>
      <button id="retryBtn" class="retry-btn">Yeniden dene!</button>
    </div>
  </main>
</div>

<canvas id="fireworks" aria-hidden="true"></canvas>

<script>
const BLOCK_VALUE = 1;
const MIN_VALUE = 1;
const MAX_VALUE = 25;
const DEFAULT_COUNT = 3;

let values = [];
let draggedBlock = null;
let sourceColumn = null;
let solved = false;
let columnCount = DEFAULT_COUNT;
let userMoves = 0;
let theoreticalMinMoves = 0;
let initialValues = [];
let moveHistory = [];
let rewinding = false;

const MAX_RULER_LEVEL = 25;
let rulerLevel = 0;
let rulerDragging = false;
let targetAverage = 0;
let sliderUnlocked = true;
let sliderVisible = false;

function randomInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

function generateValues(count){
  if(count===1){
    return [randomInt(MIN_VALUE,MAX_VALUE)];
  }

  // Ortalama tam sayı olsun ve başlangıçta sütunlar eşit olmasın.
  // 1 ve 25 uçlarında, tüm değerler 1..25 arasında kalırken farklı
  // sütunlar üretmek mümkün olmadığı için çok sütunlu oyunda 2..24 kullanılır.
  const targetAverage=randomInt(MIN_VALUE+1,MAX_VALUE-1);
  const result=new Array(count).fill(targetAverage);

  let changed=false;
  const attempts=Math.max(8,count*5);

  for(let k=0;k<attempts;k++){
    const a=randomInt(0,count-1);
    let b=randomInt(0,count-1);
    if(a===b) continue;

    if(result[a]>MIN_VALUE && result[b]<MAX_VALUE){
      const maxMove=Math.min(
        result[a]-MIN_VALUE,
        MAX_VALUE-result[b],
        Math.max(1,Math.min(6,targetAverage))
      );

      if(maxMove>0){
        const amount=randomInt(1,maxMove);
        result[a]-=amount;
        result[b]+=amount;
        changed=true;
      }
    }
  }

  if(!changed || result.every(v=>v===targetAverage)){
    const amount=Math.min(
      targetAverage-MIN_VALUE,
      MAX_VALUE-targetAverage,
      1
    );

    if(amount>0){
      result[0]-=amount;
      result[1]+=amount;
    }
  }

  return shuffle(result);
}

function calculateMinimumMoves(startValues){
  if(startValues.length<=1) return 0;

  const total=startValues.reduce((sum,v)=>sum+v,0);
  const average=total/startValues.length;

  const deviations=startValues
    .map(v=>v-average)
    .filter(d=>Math.abs(d)>1e-9);

  const n=deviations.length;
  if(n===0) return 0;

  const size=1<<n;
  const sums=new Array(size).fill(0);

  for(let mask=1;mask<size;mask++){
    const bit=mask & -mask;
    const index=Math.log2(bit);
    sums[mask]=sums[mask^bit]+deviations[index];
  }

  const memo=new Map();

  function maxBalancedGroups(mask){
    if(mask===0) return 0;
    if(memo.has(mask)) return memo.get(mask);

    const firstBit=mask & -mask;
    let best=-Infinity;

    for(let sub=mask;sub;sub=(sub-1)&mask){
      if((sub & firstBit)===0) continue;
      if(Math.abs(sums[sub])>1e-9) continue;

      const rest=maxBalancedGroups(mask^sub);
      if(rest!==-Infinity){
        best=Math.max(best,1+rest);
      }
    }

    memo.set(mask,best);
    return best;
  }

  const groups=maxBalancedGroups(size-1);

  // Her dengeli bağlı grup k sütundan oluşuyorsa en az k-1 aktarım gerekir.
  return n-groups;
}

function getAverage(arr){
  if(!arr.length) return 0;
  return arr.reduce((sum,v)=>sum+v,0)/arr.length;
}

function buildRulerTicks(){
  const ticks=document.getElementById("levelTicks");
  ticks.innerHTML="";

  for(let level=0;level<=MAX_RULER_LEVEL;level++){
    const tick=document.createElement("div");
    tick.className="level-tick "+(level%5===0 ? "major" : "minor");
    tick.dataset.level=level;
    ticks.appendChild(tick);

    if(level>0 && level%5===0){
      const label=document.createElement("div");
      label.className="level-tick-label";
      label.dataset.level=level;
      label.textContent=level;
      ticks.appendChild(label);
    }
  }
}

function updateRulerGeometry(){
  const game=document.querySelector(".game");
  const ruler=document.getElementById("levelRuler");
  const line=document.getElementById("levelLine");
  const handle=document.getElementById("levelHandle");
  const columns=[...document.querySelectorAll(".column")];

  if(!game || !ruler || !line || !handle || columns.length===0) return;

  const gameRect=game.getBoundingClientRect();
  const firstRect=columns[0].getBoundingClientRect();
  const lastRect=columns[columns.length-1].getBoundingClientRect();

  const blockHeight=18;
  const rulerHeight=MAX_RULER_LEVEL*blockHeight;
  const baselineY=firstRect.bottom-gameRect.top-3;
  const rulerTop=baselineY-rulerHeight;
  const rulerLeft=Math.max(14,firstRect.left-gameRect.left-78);

  ruler.style.left=rulerLeft+"px";
  ruler.style.top=rulerTop+"px";
  ruler.style.height=rulerHeight+"px";

  document.querySelectorAll(".level-tick").forEach(tick=>{
    const level=Number(tick.dataset.level);
    tick.style.bottom=(level*blockHeight)+"px";
  });

  document.querySelectorAll(".level-tick-label").forEach(label=>{
    const level=Number(label.dataset.level);
    label.style.bottom=(level*blockHeight-5)+"px";
  });

  const y=baselineY-rulerLevel*blockHeight;
  handle.style.bottom=(rulerLevel*blockHeight-7)+"px";

  const lineLeft=rulerLeft+30;
  const lineRight=lastRect.right-gameRect.left;
  line.style.left=lineLeft+"px";
  line.style.top=y+"px";
  line.style.width=Math.max(0,lineRight-lineLeft)+"px";

  handle.classList.toggle("correct",Math.abs(rulerLevel-targetAverage)<1e-9);
  handle.setAttribute("aria-valuenow",String(rulerLevel));
}

function updateSliderUI(){
  const ruler=document.getElementById("levelRuler");
  const line=document.getElementById("levelLine");
  const btn=document.getElementById("sliderToggleBtn");

  btn.disabled=false;
  btn.classList.remove("locked");
  btn.classList.toggle("active",sliderVisible);

  if(!sliderVisible){
    ruler.classList.add("hidden");
    line.classList.add("hidden");
  }else{
    ruler.classList.remove("hidden");
    line.classList.remove("hidden");
    requestAnimationFrame(updateRulerGeometry);
  }

  btn.title=sliderVisible ? "Sürgüyü gizle" : "Sürgüyü göster";
}

function setRulerLevel(level){
  rulerLevel=Math.max(0,Math.min(MAX_RULER_LEVEL,Math.round(level)));
  updateRulerGeometry();
}

function rulerLevelFromClientY(clientY){
  const game=document.querySelector(".game");
  const firstColumn=document.querySelector(".column");
  if(!game || !firstColumn) return rulerLevel;

  const gameRect=game.getBoundingClientRect();
  const columnRect=firstColumn.getBoundingClientRect();
  const baselineY=columnRect.bottom-gameRect.top-3;
  const localY=clientY-gameRect.top;
  return (baselineY-localY)/18;
}

function updateColumnSizing(){
  const container=document.getElementById("columns");
  const count=values.length || columnCount;

  let columnW=92;
  let blockW=78;
  let gap=42;

  if(count>=8){
    columnW=68;
    blockW=58;
    gap=14;
  }else if(count>=6){
    columnW=76;
    blockW=64;
    gap=20;
  }else if(count>=4){
    columnW=84;
    blockW=70;
    gap=30;
  }

  container.style.setProperty("--column-w",columnW+"px");
  container.style.setProperty("--block-w",blockW+"px");
  container.style.setProperty("--gap",gap+"px");
}

function startGame(newValues){
  solved=false;
  values=[...newValues];
  initialValues=[...newValues];
  targetAverage=getAverage(initialValues);
  rulerLevel=0;
  userMoves=0;
  moveHistory=[];
  rewinding=false;
  theoreticalMinMoves=calculateMinimumMoves(initialValues);

  const message=document.getElementById("message");
  message.classList.remove("show","best");
  document.getElementById("retryBtn").classList.remove("show");

  stopFireworks();
  updateColumnSizing();
  render();
  requestAnimationFrame(()=>{
    updateRulerGeometry();
    updateSliderUI();
  });

  if(values.length===1){
    checkSolution();
  }
}

function render(){
  const container=document.getElementById("columns");
  container.innerHTML="";

  values.forEach((value,index)=>{
    const wrap=document.createElement("div");
    wrap.className="column-wrap";

    const column=document.createElement("div");
    column.className="column";
    column.dataset.index=index;

    for(let i=0;i<value;i++){
      const block=document.createElement("div");
      block.className="block";
      block.draggable=true;
      block.dataset.column=index;
      block.dataset.level=i;

      block.addEventListener("dragstart",e=>{
        if(solved || rewinding){
          e.preventDefault();
          return;
        }

        sourceColumn=Number(block.dataset.column);
        const startLevel=Number(block.dataset.level);

        draggedBlock={
          column:sourceColumn,
          level:startLevel,
          count:values[sourceColumn]-startLevel
        };

        const movingBlocks=[...column.querySelectorAll(".block")]
          .filter((b,idx)=>idx>=startLevel);

        movingBlocks.forEach(b=>b.classList.add("dragging"));

        const dragImage=document.createElement("div");
        dragImage.className="drag-image";
        dragImage.style.setProperty("--block-w",getComputedStyle(document.getElementById("columns")).getPropertyValue("--block-w"));

        for(let n=0;n<movingBlocks.length;n++){
          const ghostBlock=document.createElement("div");
          ghostBlock.className="block";
          dragImage.appendChild(ghostBlock);
        }

        document.body.appendChild(dragImage);

        const blockRect=block.getBoundingClientRect();
        const pointerX=e.clientX-blockRect.left;
        const pointerY=e.clientY-blockRect.top;
        const dragHeight=movingBlocks.length*blockRect.height;

        e.dataTransfer.setDragImage(
          dragImage,
          pointerX,
          dragHeight-blockRect.height+pointerY
        );

        e.dataTransfer.effectAllowed="move";

        requestAnimationFrame(()=>{
          dragImage.remove();
        });
      });

      block.addEventListener("dragend",()=>{
        document.querySelectorAll(".block.dragging").forEach(b=>b.classList.remove("dragging"));
        draggedBlock=null;
        sourceColumn=null;
        document.querySelectorAll(".column").forEach(c=>c.classList.remove("drag-over"));
      });

      column.appendChild(block);
    }

    column.addEventListener("dragover",e=>{
      if(solved) return;
      e.preventDefault();
      column.classList.add("drag-over");
    });

    column.addEventListener("dragleave",()=>{
      column.classList.remove("drag-over");
    });

    column.addEventListener("drop",e=>{
      e.preventDefault();
      column.classList.remove("drag-over");

      if(draggedBlock===null || sourceColumn===null) return;

      const targetColumn=Number(column.dataset.index);
      if(targetColumn===sourceColumn) return;

      const transferCount=draggedBlock.count;

      if(transferCount>0 && values[sourceColumn]>=transferCount){
        values[sourceColumn]-=transferCount*BLOCK_VALUE;
        values[targetColumn]+=transferCount*BLOCK_VALUE;
        userMoves++;
        moveHistory.push({
          from:sourceColumn,
          to:targetColumn,
          count:transferCount
        });
      }

      render();
      checkSolution();
    });

    const valueLabel=document.createElement("div");
    valueLabel.className="value";
    valueLabel.textContent=value;

    wrap.appendChild(column);
    wrap.appendChild(valueLabel);
    container.appendChild(wrap);
  });

  requestAnimationFrame(updateRulerGeometry);
}

function checkSolution(){
  if(values.length===0) return;

  const first=values[0];
  const equal=values.every(value=>value===first);

  if(!equal) return;

  solved=true;

  document.querySelectorAll(".column").forEach(column=>{
    column.classList.add("solved");
  });

  document.querySelectorAll(".value").forEach(value=>{
    value.classList.add("solved");
  });

  const message=document.getElementById("message");
  const title=message.querySelector(".message-title");
  const messageText=document.getElementById("messageText");
  const isBest=userMoves===theoreticalMinMoves;

  title.textContent=isBest ? "Mükemmel!" : "Tebrikler!";
  messageText.textContent=
    userMoves+" hamlede ortalama değeri buldunuz: "+first;

  message.classList.toggle("best",isBest);
  message.classList.add("show");

  const retryBtn=document.getElementById("retryBtn");
  retryBtn.classList.toggle("show",!isBest);

  if(isBest){
    startFireworks();
  }
}

let fireworksAnimation=null;
let particles=[];
let fireworksEndTime=0;

function resizeFireworks(){
  const canvas=document.getElementById("fireworks");
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(window.innerWidth*dpr);
  canvas.height=Math.round(window.innerHeight*dpr);
  canvas.style.width=window.innerWidth+"px";
  canvas.style.height=window.innerHeight+"px";
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function createExplosion(x,y){
  const count=52;
  const hue=Math.random()*360;

  for(let i=0;i<count;i++){
    const angle=(Math.PI*2*i/count)+(Math.random()-.5)*.08;
    const speed=2.2+Math.random()*4.5;

    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,
      decay:.012+Math.random()*.015,
      size:1.5+Math.random()*2.3,
      hue:hue+Math.random()*35-17
    });
  }
}

function startFireworks(){
  stopFireworks();
  resizeFireworks();

  const canvas=document.getElementById("fireworks");
  const ctx=canvas.getContext("2d");
  fireworksEndTime=performance.now()+4200;

  createExplosion(window.innerWidth*.23,window.innerHeight*.28);
  createExplosion(window.innerWidth*.77,window.innerHeight*.25);

  let lastBurst=0;

  function frame(now){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

    if(now-lastBurst>420 && now<fireworksEndTime-500){
      createExplosion(
        window.innerWidth*(.12+Math.random()*.76),
        window.innerHeight*(.12+Math.random()*.43)
      );
      lastBurst=now;
    }

    particles.forEach(p=>{
      p.vy+=.045;
      p.vx*=.992;
      p.vy*=.992;
      p.x+=p.vx;
      p.y+=p.vy;
      p.life-=p.decay;

      if(p.life>0){
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fillStyle="hsla("+p.hue+",95%,60%,"+Math.max(0,p.life)+")";
        ctx.fill();
      }
    });

    particles=particles.filter(p=>p.life>0);

    if(now<fireworksEndTime || particles.length){
      fireworksAnimation=requestAnimationFrame(frame);
    }else{
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      fireworksAnimation=null;
    }
  }

  fireworksAnimation=requestAnimationFrame(frame);
}

function stopFireworks(){
  if(fireworksAnimation){
    cancelAnimationFrame(fireworksAnimation);
    fireworksAnimation=null;
  }
  particles=[];

  const canvas=document.getElementById("fireworks");
  if(canvas){
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

window.addEventListener("resize",()=>{
  resizeFireworks();
  updateRulerGeometry();
});

buildRulerTicks();

const levelHandle=document.getElementById("levelHandle");

levelHandle.addEventListener("pointerdown",e=>{
  rulerDragging=true;
  levelHandle.setPointerCapture(e.pointerId);
  setRulerLevel(rulerLevelFromClientY(e.clientY));
  e.preventDefault();
});

levelHandle.addEventListener("pointermove",e=>{
  if(!rulerDragging) return;
  setRulerLevel(rulerLevelFromClientY(e.clientY));
  e.preventDefault();
});

levelHandle.addEventListener("pointerup",e=>{
  rulerDragging=false;
  if(levelHandle.hasPointerCapture(e.pointerId)){
    levelHandle.releasePointerCapture(e.pointerId);
  }
});

levelHandle.addEventListener("pointercancel",()=>{
  rulerDragging=false;
});

levelHandle.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"){
    setRulerLevel(rulerLevel+1);
    e.preventDefault();
  }else if(e.key==="ArrowDown"){
    setRulerLevel(rulerLevel-1);
    e.preventDefault();
  }else if(e.key==="Home"){
    setRulerLevel(0);
    e.preventDefault();
  }else if(e.key==="End"){
    setRulerLevel(MAX_RULER_LEVEL);
    e.preventDefault();
  }
});

async function rewindMoves(){
  if(rewinding || moveHistory.length===0) return;

  rewinding=true;
  solved=false;
  stopFireworks();

  const message=document.getElementById("message");
  message.classList.remove("show","best");
  document.getElementById("retryBtn").classList.remove("show");

  const history=[...moveHistory].reverse();

  for(const move of history){
    const targetColumn=document.querySelector('.column[data-index="'+move.to+'"]');
    const sourceColumnEl=document.querySelector('.column[data-index="'+move.from+'"]');

    if(!targetColumn || !sourceColumnEl){
      values[move.to]-=move.count;
      values[move.from]+=move.count;
      render();
      continue;
    }

    const targetBlocks=[...targetColumn.querySelectorAll(".block")];
    const movingBlocks=targetBlocks.slice(Math.max(0,targetBlocks.length-move.count));

    if(movingBlocks.length!==move.count){
      values[move.to]-=move.count;
      values[move.from]+=move.count;
      render();
      continue;
    }

    const firstRect=movingBlocks[0].getBoundingClientRect();
    const topRect=movingBlocks[movingBlocks.length-1].getBoundingClientRect();
    const blockHeight=firstRect.height;
    const groupHeight=move.count*blockHeight;

    const ghost=document.createElement("div");
    ghost.className="rewind-group";
    ghost.style.left=firstRect.left+"px";
    ghost.style.top=topRect.top+"px";
    ghost.style.width=firstRect.width+"px";

    for(let i=0;i<move.count;i++){
      const b=document.createElement("div");
      b.className="block";
      b.style.width=firstRect.width+"px";
      b.style.height=blockHeight+"px";
      b.style.flex="0 0 "+blockHeight+"px";
      ghost.appendChild(b);
    }

    movingBlocks.forEach(b=>b.classList.add("rewind-hidden"));
    document.body.appendChild(ghost);

    const sourceRect=sourceColumnEl.getBoundingClientRect();
    const destLeft=sourceRect.left+(sourceRect.width-firstRect.width)/2;
    const destTop=sourceRect.bottom-3-(values[move.from]+move.count)*blockHeight;

    const dx=destLeft-firstRect.left;
    const dy=destTop-topRect.top;

    try{
      const animation=ghost.animate(
        [
          {transform:"translate(0,0)",opacity:1},
          {transform:"translate("+dx+"px,"+dy+"px)",opacity:1}
        ],
        {
          duration:95,
          easing:"cubic-bezier(.35,.05,.2,1)",
          fill:"forwards"
        }
      );

      await animation.finished;
    }catch(e){
      await new Promise(resolve=>setTimeout(resolve,95));
    }

    ghost.remove();

    values[move.to]-=move.count;
    values[move.from]+=move.count;
    render();

    await new Promise(resolve=>setTimeout(resolve,22));
  }

  values=[...initialValues];
  userMoves=0;
  moveHistory=[];
  rewinding=false;
  render();
}
