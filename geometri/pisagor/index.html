<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pisagor Teoremi · v1.4.0</title>
<style>
:root{--bg:#f2f2f3;--outer:#dedede;--card:#f7f7f8;--fg:#111;--line:#263543;--red:#ff3347;--sub:#66727d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--outer);color:var(--fg)}body.dark{--bg:#292b30;--outer:#202126;--card:#35373c;--fg:#f4f4f5;--line:#f4f4f5;--sub:#adb6c0}
.shell{width:min(94vw,1460px);margin:28px auto;border-radius:34px;background:var(--bg);padding:30px 38px 20px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{cursor:pointer;background:var(--card);color:var(--fg);border:1px solid #8885;border-radius:11px;padding:12px 19px;font-size:14px;min-height:48px;box-shadow:0 8px 17px #0002;transition:transform .15s}.btn:hover{transform:translateY(-2px)}.btn:focus-visible,a:focus-visible{outline:3px solid #5599ff;outline-offset:3px}
#homeBtn{width:48px;height:48px;display:grid;place-items:center;background:#ffdf49;border-radius:12px;box-shadow:0 5px 12px #0003;flex:none}#homeBtn svg{width:27px;height:27px;fill:#000}
#helpBtn{min-width:48px}.lang-wrap{position:relative}.lang-menu{position:absolute;z-index:5;top:calc(100% + 8px);left:0;background:var(--card);border:1px solid #8885;border-radius:11px;padding:6px;min-width:140px;box-shadow:0 10px 20px #0003}.lang-menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--fg);padding:10px;cursor:pointer;border-radius:6px}.lang-menu button:hover{background:var(--outer)}
[hidden]{display:none!important}.opt{display:flex;align-items:center;gap:7px;font-size:14px}.opt input{accent-color:var(--fg);width:18px;height:18px}#scene{width:100%;height:auto;display:block;overflow:hidden;touch-action:manipulation}
.heading{font:600 29px system-ui;fill:var(--fg)}.base{stroke:var(--line);stroke-width:4;fill:none;stroke-linejoin:round;stroke-linecap:round}.vertex{fill:var(--fg);font:600 27px system-ui;text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.side{font:italic 29px Georgia,serif;fill:var(--fg);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}.term{font:italic 68px Georgia,serif;text-anchor:middle;dominant-baseline:central;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:2px}.operator{font:500 54px system-ui;text-anchor:middle;dominant-baseline:central;fill:var(--fg)}
#hand{filter:drop-shadow(0 2px 3px #0004);pointer-events:none}.square{fill:none;stroke:var(--red);stroke-width:3;stroke-linejoin:round}.rededge{stroke:var(--red);stroke-width:7;stroke-linecap:round}.front{stroke:var(--red);stroke-width:5;stroke-linecap:round}.version{position:fixed;left:8px;bottom:4px;font:400 10px/1.3 system-ui;color:#888;background:var(--bg);padding:2px 6px;border-radius:4px;pointer-events:none}
dialog{background:var(--bg);color:var(--fg);border:0;border-radius:20px;padding:26px;max-width:min(400px,90vw);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}dialog h2{margin-top:0}dialog p{line-height:1.6}
@media(max-width:760px){.shell{width:96vw;margin:12px auto;padding:18px 10px;border-radius:18px}.controls{gap:8px}.btn{padding:10px 13px}.opt{font-size:12px}}
/* v1.4.0: fit the entire animation, including the hand, inside the visible viewport. */
.shell{height:calc(100vh - 56px);height:calc(100dvh - 56px);display:flex;flex-direction:column;min-height:0}
.controls{flex:0 0 auto}
#scene{flex:1 1 0;min-height:0;height:0;width:100%;display:block}
@media(max-width:760px){.shell{height:calc(100vh - 24px);height:calc(100dvh - 24px)}}
@media(max-height:550px){.shell{margin:6px auto;height:calc(100vh - 12px);height:calc(100dvh - 12px);padding-top:8px;padding-bottom:14px}.controls{gap:6px}.btn{min-height:36px;padding:6px 12px}#homeBtn{width:36px;height:36px}#homeBtn svg{width:24px;height:24px}}

/* Experimental point transfer, independent of the original animation. */
.dot-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dot-slider{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.dot-slider input[type=range]{width:86px;accent-color:var(--fg);cursor:pointer}
.dot-slider output{min-width:2.5ch;font-variant-numeric:tabular-nums}
#dotCount{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
#dotLayer{pointer-events:none}
.area-dot{fill:#9a1733;stroke:none}
body.dark .area-dot{fill:#ffd4dc}
@media(max-width:760px){.dot-controls{gap:6px 10px}.dot-slider{font-size:12px}.dot-slider input[type=range]{width:68px}}

const $=id=>document.getElementById(id), NS="http://www.w3.org/2000/svg",hand=$("hand");
  function restoreHandCutout() {
    const handImage = hand.querySelector('image');
    if (!handImage) return;
    const original = handImage.getAttribute('href');
    if (!original || !original.startsWith('data:image/')) return;
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h || w*h > 3000000) return;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0);
        const imageData = ctx.getImageData(0,0,w,h);
        const rgba = imageData.data;
        const pixels = w*h;
        const seen = new Uint8Array(pixels);
        const queue = new Int32Array(pixels);
        let head = 0, tail = 0;
        const isBackground = (p) => {
          const i = p*4;
          const r=rgba[i],g=rgba[i+1],b=rgba[i+2];
          const bright = Math.max(r,g,b);
          // Limit propagation to a nearly black, low-saturation matte.
          return rgba[i+3] < 15 || (bright < 66 && bright-Math.min(r,g,b) < 39);
        };
        const enqueue = (p) => {
          if (seen[p] || !isBackground(p)) return;
          seen[p] = 1;
          queue[tail++] = p;
        };
        for (let x=0;x<w;x++){enqueue(x);enqueue((h-1)*w+x);}
        for (let y=0;y<h;y++){enqueue(y*w);enqueue(y*w+w-1);}
        while(head<tail){
          const p=queue[head++];
          const x=p%w, y=(p-x)/w;
          if(x>0)enqueue(p-1);
          if(x<w-1)enqueue(p+1);
          if(y>0)enqueue(p-w);
          if(y<h-1)enqueue(p+w);
        }
        // Do not run destructive cleanup if the matte was not recognized.
        if(tail < pixels*0.015) return;
        for(let p=0;p<pixels;p++){
          if(seen[p])rgba[p*4+3]=0;
        }
        // Feather only the outer 1-pixel boundary. Interior detail is untouched.
        for(let n=0;n<tail;n++){
          const p=queue[n], x=p%w,y=(p-x)/w;
          for(const q of [x>0?p-1:-1,x<w-1?p+1:-1,y>0?p-w:-1,y<h-1?p+w:-1]){
            if(q<0||seen[q])continue;
            const i=q*4, bright=Math.max(rgba[i],rgba[i+1],rgba[i+2]);
            if(bright<105)rgba[i+3]=Math.min(rgba[i+3],Math.round(255*Math.max(0,(bright-48)/57)));
          }
        }
        ctx.putImageData(imageData,0,0);
        handImage.setAttribute('href',canvas.toDataURL('image/png'));
      } catch(err) {
        console.warn('El görseli işlenemedi; kaynak görsel korundu.',err);
      }
    };

  }
