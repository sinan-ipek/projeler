<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometri · v1.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#dedede;color:#111;-webkit-font-smoothing:antialiased}
.site-shell{width:min(94vw,1460px);margin:28px auto;border-radius:34px;overflow:hidden;background:#f2f2f3;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.page{padding:38px 56px 48px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:30px}
#homeBtn{width:48px;height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;background:#ffdf49;border:0;border-radius:12px;box-shadow:0 5px 12px #0003;text-decoration:none;transition:.15s ease}
#homeBtn:hover{background:#ffe451;transform:translateY(-2px)}
#homeBtn svg{width:27px;height:27px;fill:#000}
.btn{appearance:none;cursor:pointer;min-height:48px;background:#f7f7f8;color:#111;border:1px solid #0002;border-radius:11px;padding:0 19px;font-size:14px;box-shadow:0 10px 22px #0002}
.btn:hover{background:#fff;transform:translateY(-2px)}
h1{font-size:29px;font-weight:500;margin:0 0 29px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:19px 12px}
.btn-card{display:flex;align-items:center;justify-content:center;width:60%;justify-self:center;height:54px;padding:0 10px;text-decoration:none;text-align:center;color:#000;font-size:13px;line-height:1.2;background:#f7f7f8;border:1px solid #0003;border-radius:11px;box-shadow:0 10px 22px #0002;transition:.15s ease}
.btn-card:hover{transform:translateY(-2px);background:#fff;box-shadow:0 14px 28px #0003}
.lang-container{position:relative}
.lang-menu{position:absolute;top:calc(100% + 7px);left:0;z-index:10;background:#fff;border:1px solid #ddd;border-radius:11px;padding:6px;box-shadow:0 12px 25px #0003;min-width:142px}
.lang-menu[hidden],.modal[hidden]{display:none}
.lang-menu button{display:block;cursor:pointer;text-align:left;background:none;border:0;width:100%;padding:10px;border-radius:6px}
.lang-menu button:hover{background:#f2f2f3}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.dialog{width:min(420px,100%);padding:28px;border-radius:19px;background:#fff;box-shadow:0 20px 50px #0003}
.dialog h2{margin-top:0}.dialog p{line-height:1.6}
#version{position:fixed;bottom:4px;left:8px;color:#888;background:#f2f2f3bb;font:400 10px/1.3 system-ui;padding:2px 6px;border-radius:4px;pointer-events:none}
@media(max-width:1050px){.site-shell{width:96vw;margin:34px auto}.page{padding:35px 32px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.site-shell{width:96vw;margin:18px auto;border-radius:24px}.page{padding:31px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.btn-card{height:92px;font-size:16px}}
@media(max-width:500px){.site-shell{width:100%;margin:0;border-radius:0}.page{padding:28px 14px}.grid{grid-template-columns:1fr}.btn-card{height:84px}}
</style>
</head>
<body>
<div class="site-shell"><main class="page">
<div class="toolbar">
<a id="homeBtn" href="/projeler/" title="Ana Sayfa · Startseite" aria-label="Ana Sayfa · Startseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 2 11.2l1.4 1.7L5 11.6V21h5.1v-6.2h3.8V21H19v-9.4l1.6 1.3 1.4-1.7L12 2.6Z"/></svg></a>
<div class="lang-container"><button id="langBtn" class="btn" aria-haspopup="true" aria-expanded="false">Dil</button><div id="langMenu" class="lang-menu" hidden><button data-lang="tr">Türkçe</button><button data-lang="de">Deutsch</button><button data-lang="en">English</button></div></div>
<button id="helpBtn" class="btn" title="Yardım">?</button>
</div>
<h1 id="title">Geometri</h1>
<div class="grid">
<a class="btn-card" href="../Menelaus/index.html" data-label="menelaus">Menelaus</a>
<a class="btn-card" href="../Ceva/index.html" data-label="ceva">Ceva Teoremi</a>
</div>
</main></div>
<div id="modal" class="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><h2 id="helpTitle">Yardım</h2><p id="helpText">Bir düğmeye bas. Teoremin animasyonunu izle.</p><button id="closeHelp" class="btn">Kapat</button></div></div>
<div id="version">v1.0 · Geometri çalışma merkezi</div>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const labels={
 tr:{title:"Geometri",lang:"Dil",help:"Yardım",body:"Bir düğmeye bas. Teoremin animasyonunu izle.",close:"Kapat",ceva:"Ceva Teoremi"},
 de:{title:"Geometrie",lang:"Sprache",help:"Hilfe",body:"Wähle einen Satz. Sieh dir die Animation an.",close:"Schließen",ceva:"Satz von Ceva"},
 en:{title:"Geometry",lang:"Language",help:"Help",body:"Choose a theorem. Watch the animation.",close:"Close",ceva:"Ceva's Theorem"}
};
function apply(lang){const t=labels[lang];document.documentElement.lang=lang;$("title").textContent=t.title;$("langBtn").textContent=t.lang;$("helpTitle").textContent=t.help;$("helpText").textContent=t.body;$("closeHelp").textContent=t.close;document.querySelector('[data-label="ceva"]').textContent=t.ceva;$("langMenu").hidden=true;$("langBtn").setAttribute("aria-expanded","false");}
$("langBtn").addEventListener("click",()=>{const opening=$("langMenu").hidden;$("langMenu").hidden=!opening;$("langBtn").setAttribute("aria-expanded",String(opening));});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>apply(b.dataset.lang)));
$("helpBtn").addEventListener("click",()=>{$("modal").hidden=false});
$("closeHelp").addEventListener("click",()=>{$("modal").hidden=true});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("modal").hidden=true;$("langMenu").hidden=true}});
document.addEventListener("click",e=>{if(!e.target.closest(".lang-container"))$("langMenu").hidden=true});
})();
</script>
<script src="/projeler/analytics.js?v=20261123"></script>
</body></html>
