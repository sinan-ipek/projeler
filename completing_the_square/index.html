  --adv-frac-font:.88em;

.eq.advancedMath .factorExpression,
.eq.advancedMath .factorParen,
.eq.advancedMath .advInner,
.eq.advancedMath .advInner>.term,
.eq.advancedMath .advCoeffWrap,
.eq.advancedMath .advCoeffOnly,
.eq.advancedMath .advOutsideTerm,
.eq.advancedMath .advSquareChoice,
.eq.advancedMath .advTailChoice,
.eq.advancedMath .advSquareDone,

  min-height:var(--adv-line-box);

}
.eq.advancedMath .factorExpression,
.eq.advancedMath .factorParen,

.eq.advancedMath .advInner>.term,
.eq.advancedMath .advCoeffWrap,

  let tailChoice=lq("advTailChoice");
  if(!tailChoice){
    tailChoice=document.createElement("span");
    tailChoice.className="advTailChoice advHL";
    tailChoice.dataset.role="advTailChoice";
    eq.insertBefore(tailChoice,outside);
    tailChoice.append(outside,cMove);
  }

  squareChoice.onclick=advancedCompleteSquareChoice;
  tailChoice.onclick=advancedCombineTailChoice;
}

async function advancedCompleteSquareChoice(){
  if(legacyLocked)return;
  const group=lq("advSquareChoice");
  if(!group||group.dataset.done==="1")return;

  legacyLocked=true;
  group.onclick=null;
  group.classList.remove("advHL");

  const before=group.getBoundingClientRect();
  const h=rat(b,2*a);

  group.innerHTML=`<span class="advSquareDone">${squareBinomialHTML(h)}</span>`;
  group.dataset.done="1";

  await advSettleMath();
  await moveWithFLIP(group,before,620);

  // Diğer seçim yapılmadıysa aktif kalır.
  const tail=lq("advTailChoice");
  if(tail&&tail.dataset.done!=="1"){
    tail.classList.add("advHL");
    tail.onclick=advancedCombineTailChoice;
  }

  advancedStage=8;
  legacyLocked=false;
}

async function advancedCombineTailChoice(){
  if(legacyLocked)return;
  const group=lq("advTailChoice");
  if(!group||group.dataset.done==="1")return;

  legacyLocked=true;
  group.onclick=null;
  group.classList.remove("advHL");

  const before=group.getBoundingClientRect();

  // Dışarıdaki terim: -a*(b/2a)^2 = -b^2/(4a)
  const h=rat(b,2*a);
  const s=rSquare(h);
  const as=rMul(rat(a),s);
  const final=rSub(rat(c),as);

  if(rIsZero(final)){
    await animateOpacity(group,1,0,220);
    group.innerHTML="";
    group.style.opacity="1";
  }else{
    group.innerHTML=signedRationalHTML(final);
    group.dataset.done="1";
    await advSettleMath();
    await moveWithFLIP(group,before,620);
  }

  // Parantez tarafı yapılmadıysa aktif kalır.
  const square=lq("advSquareChoice");
  if(square&&square.dataset.done!=="1"){
    square.classList.add("advHL");
    square.onclick=advancedCompleteSquareChoice;
  }

  advancedStage=8;
  legacyLocked=false;
}

async function advancedMoveNegativeOutside(){
  if(legacyLocked||advancedStage!==6)return;
  legacyLocked=true;

  const factorA=lq("factorA");
  const minusTarget=lq("advMinusS");
  const reserve=lq("advReserve");
  const cMove=lq("advC");
  const factor=lq("advFactor");
  const parenR=lq("advParenR");

  if(!factorA||!minusTarget||!reserve||!cMove||!factor||!parenR){
    legacyLocked=false;
    return;
  }

  factorA.onclick=null;
  minusTarget.onclick=null;
  factorA.classList.remove("advPairHot","advPairTarget");
  minusTarget.classList.remove("advPairHot","advPairTarget");
  advRemovePairOverlay();

  const h=rDiv(rAbs(rat(b,a)),rat(2));
  const s=rSquare(h);
  const product=rMul(rat(a),s);
  const resultHTML=`−${THIN}${fractionHTML(product)}`;

  const eqRect=eq.getBoundingClientRect();
  const sourceRect=minusTarget.getBoundingClientRect();
  const cBefore=cMove.getBoundingClientRect();
  const factorBefore=factor.getBoundingClientRect();
  const parenBefore=parenR.getBoundingClientRect();
  const reserveBefore=parseFloat(getComputedStyle(reserve).width)||0;

  const outside=lSpan(resultHTML,"advOutside","term advOutsideTerm");
  outside.style.visibility="hidden";
  eq.insertBefore(outside,cMove);

  const outsideWidth=outside.getBoundingClientRect().width;

  minusTarget.remove();

  // Önce final yerleşimi kur: içerideki negatif terim artık yok,
  // dışarı çıkan terim sağ parantezin hemen ardından gelecek.
  // Eski rezerv boşluğu tamamen kapanır; normal .eq gap'i yeterlidir.
  reserve.style.width="0px";

  // Tarayıcıya final matematik düzenini ve ortak ekseni tamamen hesaplat.
  await advSettleMath();

  const targetRect=outside.getBoundingClientRect();

  // +c de nihai yerine, yani dışarı çıkan terimin hemen sağına,
  // FLIP ile yumuşakça gelsin.
  const cMovePromise=moveWithFLIP(cMove,cBefore,760);

  const fly=document.createElement("div");
  fly.className="advArcFly";
  fly.innerHTML=resultHTML;
  fly.style.left=`${sourceRect.left-eqRect.left+sourceRect.width/2}px`;
  fly.style.top=`${sourceRect.top-eqRect.top}px`;
  fly.style.transform="translateX(-50%)";
  eq.append(fly);

  const start={
    x:sourceRect.left-eqRect.left+sourceRect.width/2,
    y:sourceRect.top-eqRect.top
  };
  const end={
    x:targetRect.left-eqRect.left+targetRect.width/2,
    y:targetRect.top-eqRect.top
  };

  await Promise.all([
    advArcMove(fly,start,end,118,1080),
    moveWithFLIP(parenR,parenBefore,620),
    cMovePromise
  ]);

  fly.remove();
  outside.style.visibility="visible";

  // Bu aşamada iki bağımsız seçim aynı anda aktiftir:
  // 1) parantez içini tam kareye dönüştürmek
  // 2) dışarıdaki sabit terimleri birleştirmek
  advancedPrepareDualChoices();

  advancedStage=7;
  legacyLocked=false;
}

async function advancedSplitNew(){
  if(legacyLocked||advancedStage!==5)return;
  legacyLocked=true;

  const bubble=lq("advBubble");
  bubble.onclick=null;
  bubble.classList.remove("advHL");

  const h=rDiv(rat(b,a),rat(2));
  const s=rSquare(h);

  const reserve=lq("advReserve");
  const plusTarget=lq("advPlusS");
  const minusTarget=lq("advMinusS");
  const cMove=lq("advC");

  const cBefore=cMove.getBoundingClientRect();
  const reserveBefore=parseFloat(getComputedStyle(reserve).width)||0;

  plusTarget.innerHTML=`+${THIN}${fractionHTML(s)}`;
  minusTarget.innerHTML=`−${THIN}${fractionHTML(s)}`;
  plusTarget.classList.remove("advHiddenTarget");
  minusTarget.classList.remove("advHiddenTarget");

  // Yeni iki terimin parantez içinde kaplayacağı gerçek genişliği ölç.
  const plusW=plusTarget.getBoundingClientRect().width;
  const minusW=minusTarget.getBoundingClientRect().width;
  const innerStyle=getComputedStyle(lq("advInner"));
  const gapPx=parseFloat(innerStyle.columnGap||innerStyle.gap)||0;
  const growth=plusW+minusW+gapPx*2;

  // c'nin ekran konumu değişmesin: parantez büyürken rezerv aynı miktarda küçülür.
  const reserveAfter=Math.max(22,reserveBefore-growth);
  plusTarget.style.visibility="hidden";
  minusTarget.style.visibility="hidden";
  reserve.style.width=`${reserveAfter}px`;

  // Layout oturduktan sonra c'yi FLIP ile eski ekran konumunda tut.
  await moveWithFLIP(cMove,cBefore,1);

  const line=eq.getBoundingClientRect();
  const br=bubble.getBoundingClientRect();
  const pr=plusTarget.getBoundingClientRect();
  const mr=minusTarget.getBoundingClientRect();

  const sx=br.left-line.left+br.width/2;
  const sy=br.top-line.top;

  const plusFly=document.createElement("div");
  plusFly.className="advArcFly";
  plusFly.innerHTML=`+${THIN}${fractionHTML(s)}`;
  plusFly.style.left=`${sx}px`;
  plusFly.style.top=`${sy}px`;
  plusFly.style.transform="translateX(-50%)";

  const minusFly=document.createElement("div");
  minusFly.className="advArcFly";
  minusFly.innerHTML=`−${THIN}${fractionHTML(s)}`;
  minusFly.style.left=`${sx}px`;
  minusFly.style.top=`${sy}px`;
  minusFly.style.transform="translateX(-50%)";

  eq.append(plusFly,minusFly);
  bubble.style.opacity="0";

  const plusEnd={
    x:pr.left-line.left+pr.width/2,
    y:pr.top-line.top
  };
  const minusEnd={
    x:mr.left-line.left+mr.width/2,
    y:mr.top-line.top
  };

  await Promise.all([
    advArcMove(plusFly,{x:sx,y:sy},plusEnd,90,1100),
    advArcMove(minusFly,{x:sx,y:sy},minusEnd,90,1100)
  ]);

  plusFly.remove();
  minusFly.remove();
  bubble.remove();

  plusTarget.style.visibility="visible";
  minusTarget.style.visibility="visible";

  await advSettleMath();
  advEnableMultiplyPair();

  // İstenen durak:
  // a(x² + (b/a)x + b²/4a² − b²/4a²)        + c
  advancedStage=6;
  legacyLocked=false;
}
