<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tam Kareye Tamamlama</title>
<style>
  :root{
    --bg:#f3f4f6;
    --ink:#1f2a44;
    --blue:#38bdf8;
    --blue-bg:rgba(56,189,248,.12);
    --yellow:#f2cc0c;
    --yellow-bg:rgba(242,204,12,.14);
    --yellow-border:#e6c200;
    --card:#f6f7fb;
    --line:#d8dde8;
    --shadow:0 8px 24px rgba(31,42,68,.06);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
  }

  .wrap{
    max-width:1280px;
    margin:24px auto;
    padding:0 18px;
  }

  .toolbar{
    display:flex;
    gap:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }

  .btn{
    padding:14px 36px;
    border:2px solid var(--blue);
    border-radius:22px;
    background:#fff;
    color:var(--ink);
    font-size:28px;
    font-weight:700;
    cursor:pointer;
    transition:.18s ease;
  }

  .btn:hover{
    background:#fff;
    transform:translateY(-1px);
  }

  .btn.active{
    background:#fff;
    box-shadow:0 0 0 3px rgba(56,189,248,.08) inset;
  }

  .card{
    position:relative;
    min-height:430px;
    background:transparent;
    border-left:1px solid rgba(31,42,68,.08);
    overflow:hidden;
  }

  .version{
    position:absolute;
    right:10px;
    bottom:6px;
    font-size:12px;
    font-weight:600;
    color:#8c96a9;
    user-select:none;
    pointer-events:none;
  }

  .board{
    position:relative;
    height:390px;
    background:transparent;
  }

  .eqrow{
    position:absolute;
    left:70px;
    top:126px;
    display:flex;
    align-items:center;
    font-size:82px;
    line-height:1;
    color:var(--ink);
    white-space:nowrap;
    transform-origin:left top;
  }

  .leftGroup{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
  }

  .cAbs{
    position:absolute;
    top:126px;
    left:0;
    font-size:82px;
    line-height:1;
    white-space:nowrap;
    color:var(--ink);
  }

  .floatLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  .floatToken{
    position:absolute;
    font-size:82px;
    line-height:1;
    color:var(--ink);
    white-space:nowrap;
    z-index:20;
    pointer-events:auto;
  }

  .term{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
  }

  .mathrow{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
  }

  .pm{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    transform:translateY(-.01em);
  }

  .varx{
    display:inline-flex;
    align-items:center;
    margin-left:.02em;
  }

  .pow{
    position:relative;
    display:inline-block;
    padding-right:.16em;
  }
  .pow .base{
    display:inline-block;
  }
  .pow .sup{
    position:absolute;
    left:100%;
    top:-0.48em;
    font-size:.56em;
    line-height:1;
    transform:translateX(-.03em);
  }

  .fracWrap{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    vertical-align:middle;
  }
  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:.82em;
    line-height:1;
    vertical-align:middle;
    transform:translateY(.01em);
    min-width:1.12em;
  }
  .frac .top{
    display:block;
    text-align:center;
    padding:0 .10em .07em .10em;
    line-height:1;
  }
  .frac .bar{
    display:block;
    width:100%;
    border-top:2px solid currentColor;
    margin:0;
    transform:translateY(0);
  }
  .frac .bot{
    display:block;
    text-align:center;
    padding:.07em .10em 0 .10em;
    line-height:1;
  }

  .clickable{
    position:relative;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
  }

  .clickable.hl-yellow::after{
    content:"";
    position:absolute;
    inset:-6px -8px;
    border:3px solid var(--yellow-border);
    background:var(--yellow-bg);
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
  }
  .clickable.hl-yellow:hover::after{
    opacity:1;
  }

  .clickable.hl-blue::after{
    content:"";
    position:absolute;
    inset:-6px -10px;
    border:2px solid var(--blue);
    background:var(--blue-bg);
    border-radius:18px;
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
  }
  .clickable.hl-blue:hover::after{
    opacity:1;
  }

  .groupHL{
    position:absolute;
    pointer-events:auto;
    border-radius:18px;
  }
  .groupHL::after{
    content:"";
    position:absolute;
    inset:-8px -10px;
    border:2px solid var(--yellow-border);
    background:var(--yellow-bg);
    border-radius:18px;
    opacity:0;
    transition:opacity .12s ease;
    pointer-events:none;
  }
  .groupHL:hover::after{ opacity:1; }

  .hint{
    position:absolute;
    left:0;
    right:0;
    bottom:28px;
    text-align:center;
    font-size:15px;
    color:#6b7280;
    user-select:none;
  }

  .hidden{
    visibility:hidden;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <button class="btn" id="easyBtn">Kolay</button>
    <button class="btn active" id="advBtn">Gelişmiş</button>
    <button class="btn" id="formulaBtn">Formül</button>
    <button class="btn" id="newBtn">Yeni</button>
  </div>

  <div class="card" id="card">
    <div class="version">v0.7.2</div>
  </div>
</div>

<script>
(() => {
  const card = document.getElementById("card");
  const advBtn = document.getElementById("advBtn");
  const easyBtn = document.getElementById("easyBtn");
  const formulaBtn = document.getElementById("formulaBtn");
  const newBtn = document.getElementById("newBtn");

  const EASE = "cubic-bezier(.25,.85,.25,1)";
  let mode = "advanced";

  let state = {
    a: 5,
    b: 7,
    c: -8,
    stage: 0,
    busy: false
  };

  let ui = {};

  function gcd(a,b){
    a = Math.abs(a);
    b = Math.abs(b);
    while(b){
      const t = a % b;
      a = b;
      b = t;
    }
    return a || 1;
  }

  function rat(n,d=1){
    if(d < 0){ n = -n; d = -d; }
    const g = gcd(n,d);
    return { n:n/g, d:d/g };
  }

  function mul(r1,r2){ return rat(r1.n*r2.n, r1.d*r2.d); }
  function div(r1,r2){ return rat(r1.n*r2.d, r1.d*r2.n); }
  function sq(r){ return rat(r.n*r.n, r.d*r.d); }
  function absRat(r){ return rat(Math.abs(r.n), r.d); }

  function randomExample(){
    const examples = [
      {a:5,b:7,c:-8},
      {a:5,b:-1,c:-2},
      {a:2,b:-2,c:7},
      {a:3,b:5,c:1},
      {a:4,b:-3,c:6}
    ];
    return examples[Math.floor(Math.random()*examples.length)];
  }

  function powHTML(base, sup="2"){
    return `
      <span class="pow">
        <span class="base">${base}</span>
        <span class="sup">${sup}</span>
      </span>
    `;
  }

  function fracHTML(numHTML, denHTML){
    return `
      <span class="fracWrap">
        <span class="frac">
          <span class="top">${numHTML}</span>
          <span class="bar"></span>
          <span class="bot">${denHTML}</span>
        </span>
      </span>
    `;
  }

  function ratHTML(r){
    if(r.d === 1) return String(r.n);
    return fracHTML(String(r.n), String(r.d));
  }

  function ratSquareHTML(r){
    if(r.d === 1){
      return powHTML(String(r.n), "2");
    }
    return fracHTML(
      powHTML(String(Math.abs(r.n)), "2"),
      powHTML(String(r.d), "2")
    );
  }

  function signedNumber(n){
    return n >= 0 ? `+${n}` : `−${Math.abs(n)}`;
  }

  function coeffNoOneHTML(r){
    const s = r.n < 0 ? "−" : "+";
    const ar = absRat(r);
    if(ar.d === 1 && ar.n === 1){
      return `
        <span class="mathrow">
          <span class="pm">${s}</span>
          <span class="varx">x</span>
        </span>
      `;
    }
    return `
      <span class="mathrow">
        <span class="pm">${s}</span>
        <span class="fracOnly">${ratHTML(ar)}</span>
        <span class="varx">x</span>
      </span>
    `;
  }

  function clickableFracHTML(r, id){
    return `
      <span class="clickable hl-yellow" id="${id}">
        ${ratHTML(r)}
      </span>
    `;
  }

  function boardRect(){
    return ui.board.getBoundingClientRect();
  }

  function rectLocal(el){
    const b = boardRect();
    const r = el.getBoundingClientRect();
    return {
      left: r.left - b.left,
      top: r.top - b.top,
      width: r.width,
      height: r.height,
      right: r.right - b.left,
      bottom: r.bottom - b.top,
      cx: r.left - b.left + r.width/2,
      cy: r.top - b.top + r.height/2
    };
  }

  function wait(ms){
    return new Promise(res => setTimeout(res, ms));
  }

  function animateAbsolute(el, from, to, duration=800, easing=EASE){
    return new Promise(resolve => {
      const a = el.animate(
        [
          { left:`${from.left}px`, top:`${from.top}px` },
          { left:`${to.left}px`, top:`${to.top}px` }
        ],
        { duration, easing, fill:"forwards" }
      );
      a.finished.catch(()=>{}).then(() => {
        el.style.left = `${to.left}px`;
        el.style.top = `${to.top}px`;
        resolve();
      });
    });
  }

  function animateArc(el, start, end, lift=90, duration=1050){
    return new Promise(resolve => {
      const t0 = performance.now();

      function ease(t){
        return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
      }

      function frame(now){
        const raw = Math.min(1, (now - t0) / duration);
        const t = ease(raw);

        const cx = (start.left + end.left)/2;
        const cy = Math.min(start.top, end.top) - lift;

        const x =
          (1-t)*(1-t)*start.left +
          2*(1-t)*t*cx +
          t*t*end.left;

        const y =
          (1-t)*(1-t)*start.top +
          2*(1-t)*t*cy +
          t*t*end.top;

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;

        if(raw < 1){
          requestAnimationFrame(frame);
        }else{
          el.style.left = `${end.left}px`;
          el.style.top = `${end.top}px`;
          resolve();
        }
      }

      requestAnimationFrame(frame);
    });
  }

  async function flipReplace(container, newHTML, duration=680){
    const before = container.getBoundingClientRect();
    const oldStyle = container.style.transform;
    container.innerHTML = newHTML;
    const after = container.getBoundingClientRect();

    const dx = before.left - after.left;
    const dy = before.top - after.top;

    container.style.transform = `translate(${dx}px,${dy}px)`;
    await wait(16);

    const anim = container.animate(
      [
        { transform:`translate(${dx}px,${dy}px)` },
        { transform:`translate(0px,0px)` }
      ],
      { duration, easing:EASE, fill:"forwards" }
    );
    await anim.finished.catch(()=>{});
    container.style.transform = oldStyle || "none";
  }

  function render(){
    easyBtn.classList.toggle("active", mode==="easy");
    advBtn.classList.toggle("active", mode==="advanced");
    formulaBtn.classList.toggle("active", mode==="formula");

    if(mode !== "advanced"){
      card.innerHTML = `
        <div class="version">v0.7.2</div>
        <div class="board" style="display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:28px;">
          Bu sürümde yalnızca <strong style="margin-left:6px;">Gelişmiş</strong> düzenleniyor.
        </div>
      `;
      return;
    }

    state.stage = 0;
    state.busy = false;

    card.innerHTML = `
      <div class="version">v0.7.2</div>
      <div class="board" id="board">
        <div class="eqrow" id="eqrow">
          <div class="leftGroup" id="leftGroup"></div>
        </div>
        <div class="cAbs" id="cAbs"></div>
        <div class="floatLayer" id="floatLayer"></div>
        <div class="hint">Gelişmiş mod — bu sürümde istenen aşamada durur.</div>
      </div>
    `;

    ui.board = document.getElementById("board");
    ui.eqrow = document.getElementById("eqrow");
    ui.leftGroup = document.getElementById("leftGroup");
    ui.cAbs = document.getElementById("cAbs");
    ui.floatLayer = document.getElementById("floatLayer");

    renderStage0();
  }

  function renderStage0(){
    ui.leftGroup.innerHTML = `
      <span class="term">${state.a}</span>
      <span class="term">${powHTML("x","2")}</span>
      <span class="term pm">${state.b >= 0 ? "+" : "−"}</span>
      <span class="term">${Math.abs(state.b)}</span>
      <span class="term">x</span>
    `;

    requestAnimationFrame(() => {
      const lr = rectLocal(ui.leftGroup);
      ui.cAbs.innerHTML = `
        <span class="clickable hl-yellow" id="cClick">${state.c >= 0 ? "+" : "−"}${Math.abs(state.c)}</span>
      `;
      ui.cAbs.style.left = `${70 + lr.width + 8}px`;
      ui.cAbs.style.top = `126px`;

      document.getElementById("cClick").onclick = onClickC;
    });
  }

  async function onClickC(){
    if(state.busy || state.stage !== 0) return;
    state.busy = true;

    const cClick = document.getElementById("cClick");
    if(cClick) cClick.onclick = null;

    const from = rectLocal(ui.cAbs);
    const to = { left: 980, top: from.top };

    await animateAbsolute(ui.cAbs, {left:from.left, top:from.top}, to, 820);
    state.stage = 1;

    ui.leftGroup.innerHTML = `
      <span class="term clickable hl-yellow" id="aClick">${state.a}</span>
      <span class="term">${powHTML("x","2")}</span>
      <span class="term pm">${state.b >= 0 ? "+" : "−"}</span>
      <span class="term">${Math.abs(state.b)}</span>
      <span class="term">x</span>
    `;

    document.getElementById("aClick").onclick = onClickA;
    state.busy = false;
  }

  async function onClickA(){
    if(state.busy || state.stage !== 1) return;
    state.busy = true;

    const q = rat(state.b, state.a);

    const html = `
      <span class="term">${state.a}</span>
      <span class="term">(</span>
      <span class="term">${powHTML("x","2")}</span>
      ${q.n < 0
        ? `<span class="term pm">−</span>`
        : `<span class="term pm">+</span>`
      }
      <span class="term">
        ${clickableFracHTML(absRat(q), "coefClick")}
      </span>
      <span class="term">x</span>
      <span class="term">)</span>
    `;

    await flipReplace(ui.leftGroup, html, 760);

    const coefClick = document.getElementById("coefClick");
    coefClick.onclick = onClickCoef;

    state.stage = 2;
    state.busy = false;
  }

  async function onClickCoef(){
    if(state.busy || state.stage !== 2) return;
    state.busy = true;

    const coefClick = document.getElementById("coefClick");
    coefClick.onclick = null;

    const q = rat(state.b, state.a);
    const r = rectLocal(coefClick);

    const bubble = document.createElement("div");
    bubble.className = "floatToken clickable hl-yellow";
    bubble.id = "bubble";
    bubble.innerHTML = ratHTML(absRat(q));
    bubble.style.left = `${r.cx - r.width/2}px`;
    bubble.style.top = `${r.top}px`;
    ui.floatLayer.appendChild(bubble);

    const target = {
      left: r.cx - r.width/2,
      top: Math.max(20, r.top - 115)
    };

    await animateAbsolute(
      bubble,
      { left:r.cx - r.width/2, top:r.top },
      target,
      640
    );

    bubble.onclick = onClickBubbleToHalf;
    state.stage = 3;
    state.busy = false;
  }

  function recenterBubble(html){
    const bubble = document.getElementById("bubble");
    const before = bubble.getBoundingClientRect();
    const centerX = before.left + before.width/2;
    bubble.innerHTML = html;
    const after = bubble.getBoundingClientRect();
    const b = boardRect();
    bubble.style.left = `${centerX - b.left - after.width/2}px`;
  }

  function onClickBubbleToHalf(){
    if(state.busy || state.stage !== 3) return;
    const q = rat(state.b, state.a);
    const h = div(q, rat(2));
    recenterBubble(ratHTML(absRat(h)));
    state.stage = 4;
    document.getElementById("bubble").onclick = onClickBubbleToSquare;
  }

  function onClickBubbleToSquare(){
    if(state.busy || state.stage !== 4) return;
    const q = rat(state.b, state.a);
    const h = div(q, rat(2));
    const s = sq(h);
    recenterBubble(fracHTML(
      powHTML(String(Math.abs(q.n)), "2"),
      powHTML(String(2*q.d), "2")
    ));
    const bubble = document.getElementById("bubble");
    bubble.innerHTML = fracHTML(
      powHTML(String(Math.abs(state.b)), "2"),
      `4${powHTML(String(state.a), "2")}`
    );
    state.stage = 5;
    bubble.onclick = onClickBubbleSplit;
  }

  async function onClickBubbleSplit(){
    if(state.busy || state.stage !== 5) return;
    state.busy = true;

    const q = rat(state.b, state.a);
    const h = div(q, rat(2));
    const s = sq(h);

    const bubble = document.getElementById("bubble");
    bubble.onclick = null;

    const finalHTML = `
      <span class="term">${state.a}</span>
      <span class="term">(</span>
      <span class="term">${powHTML("x","2")}</span>
      ${q.n < 0
        ? `<span class="term pm">−</span>`
        : `<span class="term pm">+</span>`
      }
      <span class="term">${ratHTML(absRat(q))}</span>
      <span class="term">x</span>
      <span class="term hidden" id="plusSlot">
        <span class="pm">+</span>${ratHTML(s)}
      </span>
      <span class="term hidden" id="minusSlot">
        <span class="pm">−</span>${ratHTML(s)}
      </span>
      <span class="term">)</span>
    `;

    ui.leftGroup.innerHTML = finalHTML;

    requestAnimationFrame(async () => {
      const plusSlot = document.getElementById("plusSlot");
      const minusSlot = document.getElementById("minusSlot");

      const start = rectLocal(bubble);
      const pRect = rectLocal(plusSlot);
      const mRect = rectLocal(minusSlot);

      const plusFly = document.createElement("div");
      plusFly.className = "floatToken";
      plusFly.innerHTML = `<span class="pm">+</span>${ratHTML(s)}`;
      plusFly.style.left = `${start.left}px`;
      plusFly.style.top = `${start.top}px`;
      ui.floatLayer.appendChild(plusFly);

      const minusFly = document.createElement("div");
      minusFly.className = "floatToken";
      minusFly.innerHTML = `<span class="pm">−</span>${ratHTML(s)}`;
      minusFly.style.left = `${start.left}px`;
      minusFly.style.top = `${start.top}px`;
      ui.floatLayer.appendChild(minusFly);

      bubble.style.opacity = "0";

      await Promise.all([
        animateArc(
          plusFly,
          { left:start.left, top:start.top },
          { left:pRect.left, top:pRect.top },
          92,
          1120
        ),
        animateArc(
          minusFly,
          { left:start.left, top:start.top },
          { left:mRect.left, top:mRect.top },
          92,
          1120
        )
      ]);

      plusFly.remove();
      minusFly.remove();
      bubble.remove();

      plusSlot.classList.remove("hidden");
      minusSlot.classList.remove("hidden");

      state.stage = 6;
      state.busy = false;
    });
  }

  easyBtn.addEventListener("click", () => {
    mode = "easy";
    render();
  });

  advBtn.addEventListener("click", () => {
    mode = "advanced";
    render();
  });

  formulaBtn.addEventListener("click", () => {
    mode = "formula";
    render();
  });

  newBtn.addEventListener("click", () => {
    const ex = randomExample();
    state.a = ex.a;
    state.b = ex.b;
    state.c = ex.c;
    mode = "advanced";
    render();
  });

  render();

})();
</script>
</body>
</html>
