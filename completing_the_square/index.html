<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tam Kareye Tamamlama</title>

<style>
:root{
  --bg:#fff;
  --ink:#0f172a;

  --blue:#38bdf8;
  --blue-soft:rgba(56,189,248,.07);
  --blue-shadow:rgba(56,189,248,.14);

  --border:#e5e7eb;

  --ease:cubic-bezier(.42,0,.20,1);
  --ease-soft:cubic-bezier(.25,.85,.25,1);

  --fade:220ms;
}

*{
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{
  margin:0;
  padding:24px;

  background:#fff;
  color:var(--ink);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:min(1120px,96vw);
}

.toolbar{
  display:flex;
  gap:12px;
  margin-bottom:12px;
}

.modeBtn{
  padding:10px 16px;

  border:1.5px solid var(--blue);
  border-radius:12px;

  background:#fff;
  color:var(--ink);

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  transition:
    background .18s ease,
    box-shadow .2s ease,
    transform .1s ease;
}

.modeBtn:hover{
  transform:translateY(-1px);
  box-shadow:0 7px 20px var(--blue-shadow);
}

.modeBtn.active{
  background:var(--blue-soft);
}

.card{
  position:relative;

  min-height:330px;
  padding:34px 28px;

  border:1px solid var(--border);
  border-radius:18px;

  background:#fff;

  box-shadow:
    0 12px 32px rgba(15,23,42,.06);

  overflow:hidden;
  user-select:none;
}

.eq{
  position:relative;

  min-height:210px;

  display:flex;
  align-items:center;
  flex-wrap:wrap;

  gap:.28ch;

  font-size:clamp(31px,4.3vw,44px);
  font-weight:500;
}

.term{
  position:relative;
  display:inline-block;
  white-space:nowrap;
}

.sup{
  font-size:.6em;
  vertical-align:super;
  line-height:0;
}

/* =========================================================
   TIKLANABİLİR
   ========================================================= */

.clickable{
  position:relative;
  cursor:pointer;
}

.clickable::after{
  content:"";

  position:absolute;
  inset:-2px -4px;

  border:1.5px solid transparent;
  border-radius:12px;

  background:transparent;

  opacity:0;
  pointer-events:none;

  transition:
    opacity .13s ease,
    border-color .13s ease,
    background .13s ease,
    box-shadow .18s ease;
}

.clickable:hover::after{
  opacity:1;

  border-color:var(--blue);
  background:var(--blue-soft);

  box-shadow:0 7px 18px var(--blue-shadow);
}

/* =========================================================
   KESİR
   ========================================================= */

.frac{
  display:inline-flex;

  flex-direction:column;
  align-items:center;
  justify-content:center;

  vertical-align:middle;

  line-height:1;

  margin:0 .09em;

  font-size:.88em;

  transform:translateY(.08em);
}

.frac-top,
.frac-bottom{
  display:block;

  min-width:1.05em;

  padding:0 .10em;

  text-align:center;
}

.frac-top{
  padding-bottom:.08em;
}

.frac-bottom{
  padding-top:.08em;
  border-top:1.6px solid currentColor;
}

.insideFrac{
  margin-left:.05em;
  margin-right:.05em;
}

/* =========================================================
   KARELİ PARANTEZ
   ========================================================= */

.squareBlock{
  position:relative;

  display:inline-block;

  white-space:nowrap;

  /*
    Üs için gerçek alan ayırıyoruz.
    Sonraki terim ²'nin içine giremez.
  */
  padding-right:.42em;

  margin-right:.08em;
}

.squareExponent{
  position:absolute;

  right:.02em;
  top:-.40em;

  font-size:.55em;
  font-weight:500;
  line-height:1;

  pointer-events:none;
}

.parenAppear{
  display:inline-block;

  animation:
    parenAppear .34s var(--ease-soft) both;
}

@keyframes parenAppear{
  from{
    opacity:0;
    transform:scaleY(.55);
  }

  to{
    opacity:1;
    transform:scaleY(1);
  }
}

.powerAppear{
  animation:
    powerAppear .28s cubic-bezier(.2,1.2,.3,1) both;
}

@keyframes powerAppear{
  from{
    opacity:0;
    transform:scale(.5);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================================================
   HAREKETLİ NESNELER
   ========================================================= */

.floatValue{
  position:absolute;

  left:0;
  top:0;

  transform:translateX(-50%);

  z-index:30;

  font-size:inherit;
  font-weight:500;

  white-space:nowrap;

  will-change:left,top,opacity;
}

.operationSymbol{
  position:absolute;

  left:0;
  top:0;

  transform:translateX(-50%);

  z-index:31;

  font-size:.78em;
  font-weight:500;

  opacity:0;

  white-space:nowrap;
}

/*
  Çarpma işlemi sırasında açılan gerçek boşluk.

  ÖNEMLİ:
  3 ve × artık bu alanın içinde hareket ediyor.
  Kareli ifadeye yaklaşmıyorlar.
*/
.operationGap{
  display:inline-block;

  width:0;

  height:1px;

  flex:0 0 auto;

  transition:
    width 440ms var(--ease);
}

/* =========================================================
   EFEKTLER
   ========================================================= */

.fadeOut{
  animation:fadeOut var(--fade) ease forwards;
}

@keyframes fadeOut{
  to{
    opacity:0;
  }
}

.softAppear{
  animation:softAppear .28s var(--ease-soft) both;
}

@keyframes softAppear{
  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================================================
   KOLAY
   ========================================================= */

.easyCInner{
  display:inline-flex;
  align-items:baseline;
  gap:.35ch;
}

.easySpacer{
  display:inline-block;
}

.easyLeftSpacer{
  width:6px;
}

.easyMiddleSpacer{
  width:7px;
}

.baselineProbe{
  display:inline-block;

  width:0;
  height:0;

  vertical-align:baseline;
}

/* =========================================================
   GELİŞMİŞ
   ========================================================= */

.advancedLead{
  display:inline-flex;
  align-items:baseline;
  gap:.28ch;
}

.factorExpression{
  display:inline-flex;
  align-items:baseline;

  white-space:nowrap;
}

.factorParen{
  display:inline-block;

  transition:
    opacity 220ms ease;
}

.advInner{
  display:inline-flex;
  align-items:baseline;

  gap:.24ch;
}

.advSlot{
  display:inline-flex;
  align-items:baseline;

  gap:.22ch;
}

.advHiddenTarget{
  visibility:hidden;
}

.finalTarget{
  visibility:hidden;
}

@media (prefers-reduced-motion:reduce){
  *{
    transition:none !important;
    animation:none !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="toolbar">

    <button
      id="easyBtn"
      class="modeBtn active"
    >
      Kolay
    </button>

    <button
      id="advancedBtn"
      class="modeBtn"
    >
      Gelişmiş
    </button>

  </div>

  <div class="card">

    <div
      id="eq"
      class="eq"
    ></div>

  </div>

</div>

<script>
(() => {

  const eq =
    document.getElementById("eq");

  const easyBtn =
    document.getElementById("easyBtn");

  const advancedBtn =
    document.getElementById("advancedBtn");

  const THIN = "\u200A";

  const EASE =
    "cubic-bezier(.42,0,.20,1)";

  const EASE_SOFT =
    "cubic-bezier(.25,.85,.25,1)";

  let a = 1;
  let b = 0;
  let c = 0;

  let easyStage = 0;
  let advancedStage = 0;

  let locked = false;


  /* =========================================================
     RASYONEL SAYILAR
     ========================================================= */

  function gcd(x,y){

    x = Math.abs(x);
    y = Math.abs(y);

    while(y){

      [x,y] =
        [y,x%y];

    }

    return x || 1;

  }


  function rat(n,d=1){

    if(d === 0)
      throw new Error("Payda sıfır olamaz.");

    if(d < 0){

      n = -n;
      d = -d;

    }

    if(n === 0)
      return {n:0,d:1};

    const g =
      gcd(n,d);

    return {
      n:n/g,
      d:d/g
    };

  }


  function rMul(x,y){

    return rat(
      x.n*y.n,
      x.d*y.d
    );

  }


  function rDiv(x,y){

    return rat(
      x.n*y.d,
      x.d*y.n
    );

  }


  function rSquare(x){

    return rat(
      x.n*x.n,
      x.d*x.d
    );

  }


  function rSub(x,y){

    return rat(
      x.n*y.d-y.n*x.d,
      x.d*y.d
    );

  }


  function rAbs(x){

    return rat(
      Math.abs(x.n),
      x.d
    );

  }


  function rSign(x){

    return Math.sign(x.n);

  }


  function rIsZero(x){

    return x.n === 0;

  }


  /* =========================================================
     KESİR HTML
     ========================================================= */

  function fractionHTML(
    r,
    extraClass=""
  ){

    r =
      rat(r.n,r.d);

    if(r.d === 1)
      return `${Math.abs(r.n)}`;

    return `
      <span class="frac ${extraClass}">

        <span class="frac-top">
          ${Math.abs(r.n)}
        </span>

        <span class="frac-bottom">
          ${r.d}
        </span>

      </span>
    `;

  }


  function rationalHTML(r){

    r =
      rat(r.n,r.d);

    if(r.n < 0)
      return `−${THIN}${fractionHTML(r)}`;

    return fractionHTML(r);

  }


  function signedRationalHTML(r){

    r =
      rat(r.n,r.d);

    if(r.n < 0)
      return `−${THIN}${fractionHTML(r)}`;

    return `+${THIN}${fractionHTML(r)}`;

  }


  function coefficientXHTML(r){

    r =
      rat(r.n,r.d);

    const sign =
      r.n < 0
      ? "−"
      : "+";

    const abs =
      rAbs(r);

    if(abs.n === abs.d)
      return `${sign}${THIN}x`;

    return `
      ${sign}${THIN}
      ${fractionHTML(abs,"insideFrac")}x
    `;

  }


  /* =========================================================
     KARE HTML
     ========================================================= */

  function squareBinomialHTML(h){

    const sign =
      rSign(h)<0
      ? "−"
      : "+";

    const abs =
      rAbs(h);

    return `
      <span class="squareBlock">

        <span class="parenAppear">(</span>

        x

        ${THIN}${sign}${THIN}

        ${fractionHTML(abs)}

        <span class="parenAppear">)</span>

        <span
          class="squareExponent powerAppear"
        >
          2
        </span>

      </span>
    `;

  }


  function easySquareHTML(k){

    return `
      <span class="squareBlock">

        <span class="parenAppear">(</span>

        x

        ${THIN}${k<0?"−":"+"}${THIN}

        ${Math.abs(k)}

        <span class="parenAppear">)</span>

        <span
          class="squareExponent powerAppear"
        >
          2
        </span>

      </span>
    `;

  }


  /* =========================================================
     DOM
     ========================================================= */

  function span(
    html,
    role,
    cls="term"
  ){

    const s =
      document.createElement("span");

    s.className =
      cls;

    if(role)
      s.dataset.role =
        role;

    s.innerHTML =
      html;

    return s;

  }


  function q(role){

    return document.querySelector(
      `[data-role="${role}"]`
    );

  }


  function wait(ms){

    return new Promise(
      resolve =>
        setTimeout(resolve,ms)
    );

  }


  function animatePosition(
    el,
    x,
    y,
    duration=620,
    easing=EASE
  ){

    return new Promise(resolve => {

      const currentLeft =
        parseFloat(el.style.left) || 0;

      const currentTop =
        parseFloat(el.style.top) || 0;

      const animation =
        el.animate(
          [
            {
              left:`${currentLeft}px`,
              top:`${currentTop}px`
            },

            {
              left:`${x}px`,
              top:`${y}px`
            }
          ],
          {
            duration,
            easing,
            fill:"forwards"
          }
        );

      animation.finished
      .catch(()=>{})
      .then(()=>{

        el.style.left =
          `${x}px`;

        el.style.top =
          `${y}px`;

        animation.cancel();

        resolve();

      });

    });

  }


  function animateOpacity(
    el,
    from,
    to,
    duration=220
  ){

    return new Promise(resolve => {

      const anim =
        el.animate(
          [
            {opacity:from},
            {opacity:to}
          ],
          {
            duration,
            easing:"ease",
            fill:"forwards"
          }
        );

      anim.finished
      .catch(()=>{})
      .then(()=>{

        el.style.opacity =
          String(to);

        anim.cancel();

        resolve();

      });

    });

  }


  function moveWithFLIP(
    el,
    before,
    duration=700
  ){

    return new Promise(resolve => {

      const after =
        el.getBoundingClientRect();

      const dx =
        before.left -
        after.left;

      const anim =
        el.animate(
          [
            {
              transform:
                `translateX(${dx}px)`
            },

            {
              transform:
                "translateX(0)"
            }
          ],
          {
            duration,
            easing:EASE,
            fill:"forwards"
          }
        );

      anim.finished
      .catch(()=>{})
      .then(()=>{

        anim.cancel();

        resolve();

      });

    });

  }


  function animateWidth(
    el,
    from,
    to,
    duration=440
  ){

    return new Promise(resolve => {

      const anim =
        el.animate(
          [
            {width:`${from}px`},
            {width:`${to}px`}
          ],
          {
            duration,
            easing:EASE,
            fill:"forwards"
          }
        );

      anim.finished
      .catch(()=>{})
      .then(()=>{

        el.style.width =
          `${to}px`;

        anim.cancel();

        resolve();

      });

    });

  }


  /* =========================================================
     ÖRNEKLER
     ========================================================= */

  function makeEasyExample(){

    a = 1;

    const values = [];

    for(
      let n=-12;
      n<=12;
      n++
    ){

      if(
        n !== 0 &&
        n%2 === 0
      )
        values.push(n);

    }

    b =
      values[
        Math.floor(
          Math.random() *
          values.length
        )
      ];

    c =
      Math.floor(
        Math.random()*19
      )-9;

  }


  function makeAdvancedExample(){

    const av =
      [2,3,4,5];

    a =
      av[
        Math.floor(
          Math.random()*av.length
        )
      ];

    const bv = [];

    for(
      let n=-12;
      n<=12;
      n++
    ){

      if(n !== 0)
        bv.push(n);

    }

    b =
      bv[
        Math.floor(
          Math.random()*bv.length
        )
      ];

    c =
      Math.floor(
        Math.random()*17
      )-8;

  }


  /* =========================================================
     MODLAR
     ========================================================= */

  easyBtn.onclick =
    () => {

      easyBtn.classList.add(
        "active"
      );

      advancedBtn.classList.remove(
        "active"
      );

      startEasy();

    };


  advancedBtn.onclick =
    () => {

      advancedBtn.classList.add(
        "active"
      );

      easyBtn.classList.remove(
        "active"
      );

      startAdvanced();

    };


  /* =========================================================
     KOLAY
     ========================================================= */

  function easyBxHTML(){

    if(b===1)
      return `+${THIN}x`;

    if(b===-1)
      return `−${THIN}x`;

    return `
      ${b<0?"−":"+"}
      ${THIN}${Math.abs(b)}x
    `;

  }


  function easyCHTML(){

    return c<0
      ? `−${THIN}${Math.abs(c)}`
      : `+${THIN}${c}`;

  }


  function startEasy(){

    makeEasyExample();

    locked =
      false;

    easyStage =
      0;

    eq.innerHTML =
      "";

    const x2 =
      span(
        `x<sup class="sup">2</sup>`,
        "easyX2"
      );

    const bx =
      span(
        easyBxHTML(),
        "easyBx"
      );

    const inner =
      document.createElement("span");

    inner.className =
      "easyCInner";

    inner.dataset.role =
      "easyCInner";

    const cMove =
      span(
        easyCHTML(),
        "easyC",
        "term clickable"
      );

    inner.append(cMove);

    eq.append(
      x2,
      bx,
      inner
    );

    cMove.onclick =
      easyClickC;

  }


  async function easyClickC(){

    if(locked)
      return;

    locked =
      true;

    const cMove =
      q("easyC");

    const bx =
      q("easyBx");

    cMove.onclick =
      null;

    cMove.classList.remove(
      "clickable"
    );

    const before =
      cMove.getBoundingClientRect();

    const k =
      b/2;

    const k2 =
      k*k;

    const inner =
      q("easyCInner");

    const sp1 =
      span(
        "",
        "easyLS",
        "easySpacer easyLeftSpacer"
      );

    const plus =
      span(
        `+${THIN}${k2}
        <span class="baselineProbe"></span>`,
        "easyPlus"
      );

    plus.style.visibility =
      "hidden";

    const sp2 =
      span(
        "",
        "easyMS",
        "easySpacer easyMiddleSpacer"
      );

    const minus =
      span(
        `−${THIN}${k2}
        <span class="baselineProbe"></span>`,
        "easyMinus"
      );

    minus.style.visibility =
      "hidden";

    inner.insertBefore(
      sp1,
      cMove
    );

    inner.insertBefore(
      plus,
      cMove
    );

    inner.insertBefore(
      sp2,
      cMove
    );

    inner.insertBefore(
      minus,
      cMove
    );

    await moveWithFLIP(
      cMove,
      before,
      700
    );

    bx.classList.add(
      "clickable"
    );

    bx.onclick =
      easyBxClick;

    locked =
      false;

  }


  async function easyBxClick(){

    if(locked)
      return;

    locked =
      true;

    const bx =
      q("easyBx");

    bx.onclick =
      null;

    bx.classList.remove(
      "clickable"
    );

    const line =
      eq.getBoundingClientRect();

    const r =
      bx.getBoundingClientRect();

    const x =
      r.left-line.left+r.width/2;

    const y =
      r.top-line.top;

    const bubble =
      document.createElement("div");

    bubble.className =
      "floatValue clickable";

    bubble.dataset.role =
      "easyBubble";

    bubble.style.left =
      `${x}px`;

    bubble.style.top =
      `${y}px`;

    bubble.textContent =
      b;

    eq.append(bubble);

    await animatePosition(
      bubble,
      x,
      y-68,
      520,
      EASE_SOFT
    );

    easyStage =
      1;

    bubble.onclick =
      easyBubbleClick;

    locked =
      false;

  }


  async function easyBubbleClick(){

    if(locked)
      return;

    const bubble =
      q("easyBubble");

    const k =
      b/2;

    const k2 =
      k*k;

    if(easyStage===1){

      bubble.textContent =
        k;

      easyStage =
        2;

      return;

    }

    if(easyStage===2){

      bubble.textContent =
        k2;

      easyStage =
        3;

      return;

    }

    if(easyStage!==3)
      return;

    locked =
      true;

    bubble.onclick =
      null;

    bubble.classList.remove(
      "clickable"
    );

    const line =
      eq.getBoundingClientRect();

    const pr =
      q("easyPlus")
      .getBoundingClientRect();

    const mr =
      q("easyMinus")
      .getBoundingClientRect();

    const mid =
      (
        pr.left+pr.width/2+
        mr.left+mr.width/2
      )/2-line.left;

    await animatePosition(
      bubble,
      mid,
      parseFloat(
        bubble.style.top
      ),
      600,
      EASE
    );

    await wait(180);

    await easySplit(
      bubble,
      k2
    );

  }


  async function easySplit(
    original,
    value
  ){

    const line =
      eq.getBoundingClientRect();

    const p =
      q("easyPlus");

    const m =
      q("easyMinus");

    const pr =
      p.getBoundingClientRect();

    const mr =
      m.getBoundingClientRect();

    const sx =
      parseFloat(
        original.style.left
      );

    const sy =
      parseFloat(
        original.style.top
      );

    const plus =
      document.createElement("div");

    plus.className =
      "floatValue";

    plus.innerHTML =
      `+${THIN}${value}`;

    plus.style.left =
      `${sx}px`;

    plus.style.top =
      `${sy}px`;

    plus.style.opacity =
      "0";

    const minus =
      document.createElement("div");

    minus.className =
      "floatValue";

    minus.innerHTML =
      `−${THIN}${value}`;

    minus.style.left =
      `${sx}px`;

    minus.style.top =
      `${sy}px`;

    minus.style.opacity =
      "0";

    eq.append(
      plus,
      minus
    );

    await Promise.all([

      animateOpacity(
        original,
        1,
        0,
        220
      ),

      animateOpacity(
        plus,
        0,
        1,
        220
      ),

      animateOpacity(
        minus,
        0,
        1,
        220
      )

    ]);

    original.remove();

    await wait(120);

    await Promise.all([

      animatePosition(
        plus,
        pr.left-line.left+pr.width/2,
        pr.top-line.top,
        650,
        EASE
      ),

      animatePosition(
        minus,
        mr.left-line.left+mr.width/2,
        mr.top-line.top,
        650,
        EASE
      )

    ]);

    plus.remove();
    minus.remove();

    p.style.visibility =
      "visible";

    m.style.visibility =
      "visible";

    easyPrepareSquare();

    locked =
      false;

  }


  function easyPrepareSquare(){

    const x2 =
      q("easyX2");

    const bx =
      q("easyBx");

    const plus =
      q("easyPlus");

    const group =
      document.createElement("span");

    group.className =
      "term clickable";

    x2.replaceWith(group);

    group.append(
      x2,
      bx,
      plus
    );

    group.onclick =
      () => {

        group.onclick =
          null;

        group.classList.remove(
          "clickable"
        );

        const k =
          b/2;

        group.innerHTML =
          easySquareHTML(k);

        easyPrepareRest();

      };

  }


  function easyPrepareRest(){

    const inner =
      q("easyCInner");

    const minus =
      q("easyMinus");

    const cMove =
      q("easyC");

    const duo =
      document.createElement("span");

    duo.className =
      "term clickable";

    inner.insertBefore(
      duo,
      minus
    );

    duo.append(
      minus,
      cMove
    );

    duo.onclick =
      async () => {

        duo.onclick =
          null;

        duo.classList.remove(
          "clickable"
        );

        const result =
          c-(b/2)*(b/2);

        await animateOpacity(
          duo,
          1,
          0,
          220
        );

        q("easyLS")?.remove();
        q("easyMS")?.remove();

        if(result===0){

          duo.remove();
          return;

        }

        duo.innerHTML =
          result<0
          ? `−${THIN}${Math.abs(result)}`
          : `+${THIN}${result}`;

        duo.style.opacity =
          "1";

        duo.className =
          "term softAppear";

      };

  }


  /* =========================================================
     GELİŞMİŞ
     ========================================================= */

  function advancedAx2HTML(){

    return `
      ${a}x<sup class="sup">2</sup>
    `;

  }


  function advancedBxHTML(){

    if(b===1)
      return `+${THIN}x`;

    if(b===-1)
      return `−${THIN}x`;

    return `
      ${b<0?"−":"+"}
      ${THIN}${Math.abs(b)}x
    `;

  }


  function advancedCHTML(){

    return c<0
      ? `−${THIN}${Math.abs(c)}`
      : `+${THIN}${c}`;

  }


  function startAdvanced(){

    makeAdvancedExample();

    advancedStage =
      0;

    locked =
      false;

    eq.innerHTML =
      "";

    const lead =
      document.createElement("span");

    lead.className =
      "advancedLead";

    lead.dataset.role =
      "advLead";

    lead.append(

      span(
        advancedAx2HTML(),
        "advAx2"
      ),

      span(
        advancedBxHTML(),
        "advBx"
      )

    );

    const cMove =
      span(
        advancedCHTML(),
        "advC",
        "term clickable"
      );

    eq.append(
      lead,
      cMove
    );

    cMove.onclick =
      advancedClickC;

  }


  async function advancedClickC(){

    if(locked)
      return;

    locked =
      true;

    const cMove =
      q("advC");

    const lead =
      q("advLead");

    cMove.onclick =
      null;

    cMove.classList.remove(
      "clickable"
    );

    const before =
      cMove.getBoundingClientRect();

    const reserve =
      document.createElement("span");

    reserve.dataset.role =
      "advReserve";

    reserve.style.display =
      "inline-block";

    reserve.style.width =
      "95px";

    eq.insertBefore(
      reserve,
      cMove
    );

    await moveWithFLIP(
      cMove,
      before,
      720
    );

    lead.classList.add(
      "clickable"
    );

    lead.onclick =
      advancedFactor;

    locked =
      false;

  }


  function advancedFactor(){

    if(locked)
      return;

    locked =
      true;

    const old =
      q("advLead");

    old.onclick =
      null;

    old.classList.remove(
      "clickable"
    );

    const qv =
      rat(b,a);

    const factor =
      document.createElement("span");

    factor.className =
      "factorExpression softAppear";

    factor.dataset.role =
      "advFactor";

    factor.innerHTML = `

      <span
        data-role="factorA"
      >
        ${a}
      </span>

      <span
        class="factorParen"
        data-role="factorOuterL"
      >
        (
      </span>

      <span
        class="advInner"
        data-role="advInner"
      >

        <span
          class="term"
          data-role="advX2"
        >
          x<sup class="sup">2</sup>
        </span>

        <span
          class="term clickable"
          data-role="advQx"
        >
          ${coefficientXHTML(qv)}
        </span>

      </span>

      <span
        class="factorParen"
        data-role="factorOuterR"
      >
        )
      </span>
    `;

    old.replaceWith(
      factor
    );

    q("advReserve")
    ?.remove();

    const qx =
      q("advQx");

    qx.onclick =
      advancedCoefficientClick;

    locked =
      false;

  }


  async function advancedCoefficientClick(){

    if(locked)
      return;

    locked =
      true;

    const qx =
      q("advQx");

    qx.onclick =
      null;

    qx.classList.remove(
      "clickable"
    );

    const qv =
      rat(b,a);

    const line =
      eq.getBoundingClientRect();

    const r =
      qx.getBoundingClientRect();

    const x =
      r.left-line.left+r.width/2;

    const y =
      r.top-line.top;

    const bubble =
      document.createElement("div");

    bubble.className =
      "floatValue clickable";

    bubble.dataset.role =
      "advBubble";

    bubble.style.left =
      `${x}px`;

    bubble.style.top =
      `${y}px`;

    bubble.innerHTML =
      rationalHTML(qv);

    eq.append(bubble);

    await animatePosition(
      bubble,
      x,
      y-76,
      520,
      EASE_SOFT
    );

    advancedStage =
      1;

    bubble.onclick =
      advancedBubbleClick;

    locked =
      false;

  }


  async function advancedBubbleClick(){

    if(locked)
      return;

    const bubble =
      q("advBubble");

    const qv =
      rat(b,a);

    const h =
      rDiv(
        qv,
        rat(2)
      );

    const s =
      rSquare(h);

    if(advancedStage===1){

      bubble.innerHTML =
        rationalHTML(h);

      advancedStage =
        2;

      return;

    }

    if(advancedStage===2){

      bubble.innerHTML =
        fractionHTML(s);

      advancedCreateTargets();

      advancedStage =
        3;

      return;

    }

    if(advancedStage!==3)
      return;

    locked =
      true;

    bubble.onclick =
      null;

    bubble.classList.remove(
      "clickable"
    );

    const line =
      eq.getBoundingClientRect();

    const pr =
      q("advPlusS")
      .getBoundingClientRect();

    const mr =
      q("advMinusS")
      .getBoundingClientRect();

    const mid =
      (
        pr.left+pr.width/2+
        mr.left+mr.width/2
      )/2-line.left;

    await animatePosition(
      bubble,
      mid,
      parseFloat(
        bubble.style.top
      ),
      620,
      EASE
    );

    await wait(160);

    await advancedSplit(
      bubble,
      s
    );

  }


  function advancedCreateTargets(){

    const inner =
      q("advInner");

    if(q("advPlusS"))
      return;

    const h =
      rat(
        b,
        2*a
      );

    const s =
      rSquare(h);

    const plus =
      span(
        `
        +${THIN}${fractionHTML(s)}
        <span class="baselineProbe"></span>
        `,
        "advPlusS"
      );

    plus.classList.add(
      "advHiddenTarget"
    );

    const minus =
      span(
        `
        −${THIN}${fractionHTML(s)}
        <span class="baselineProbe"></span>
        `,
        "advMinusS"
      );

    minus.classList.add(
      "advHiddenTarget"
    );

    inner.append(
      plus,
      minus
    );

  }


  async function advancedSplit(
    original,
    s
  ){

    const line =
      eq.getBoundingClientRect();

    const p =
      q("advPlusS");

    const m =
      q("advMinusS");

    const pr =
      p.getBoundingClientRect();

    const mr =
      m.getBoundingClientRect();

    const sx =
      parseFloat(
        original.style.left
      );

    const sy =
      parseFloat(
        original.style.top
      );

    const plus =
      document.createElement("div");

    plus.className =
      "floatValue";

    plus.style.left =
      `${sx}px`;

    plus.style.top =
      `${sy}px`;

    plus.style.opacity =
      "0";

    plus.innerHTML =
      `+${THIN}${fractionHTML(s)}`;

    const minus =
      document.createElement("div");

    minus.className =
      "floatValue";

    minus.style.left =
      `${sx}px`;

    minus.style.top =
      `${sy}px`;

    minus.style.opacity =
      "0";

    minus.innerHTML =
      `−${THIN}${fractionHTML(s)}`;

    eq.append(
      plus,
      minus
    );

    await Promise.all([

      animateOpacity(
        original,
        1,
        0,
        220
      ),

      animateOpacity(
        plus,
        0,
        1,
        220
      ),

      animateOpacity(
        minus,
        0,
        1,
        220
      )

    ]);

    original.remove();

    await wait(120);

    await Promise.all([

      animatePosition(
        plus,
        pr.left-line.left+pr.width/2,
        pr.top-line.top,
        670,
        EASE
      ),

      animatePosition(
        minus,
        mr.left-line.left+mr.width/2,
        mr.top-line.top,
        670,
        EASE
      )

    ]);

    plus.remove();
    minus.remove();

    p.classList.remove(
      "advHiddenTarget"
    );

    m.classList.remove(
      "advHiddenTarget"
    );

    advancedPrepareSquare();

    locked =
      false;

  }


  function advancedPrepareSquare(){

    const x2 =
      q("advX2");

    const qx =
      q("advQx");

    const plus =
      q("advPlusS");

    const minus =
      q("advMinusS");

    const group =
      document.createElement("span");

    group.className =
      "advSlot clickable";

    group.dataset.role =
      "advSquareGroup";

    x2.replaceWith(
      group
    );

    group.append(
      x2,
      qx,
      plus
    );

    group.onclick =
      () => {

        group.onclick =
          null;

        group.classList.remove(
          "clickable"
        );

        const h =
          rat(
            b,
            2*a
          );

        group.innerHTML =
          squareBinomialHTML(h);

        minus.classList.add(
          "clickable"
        );

        minus.onclick =
          () => {

            minus.onclick =
              null;

            advancedDistribution(
              minus
            );

          };

      };

  }


  /* =========================================================
     GELİŞMİŞ:
     a × (−s) DAĞITMA ANİMASYONU
     ========================================================= */

  async function advancedDistribution(
    minusS
  ){

    if(locked)
      return;

    locked =
      true;

    minusS.classList.remove(
      "clickable"
    );

    const factorA =
      q("factorA");

    const cMove =
      q("advC");

    const inner =
      q("advInner");

    const h =
      rat(
        b,
        2*a
      );

    const s =
      rSquare(h);

    const result =
      rMul(
        rat(a),
        s
      );


    /* =======================================================
       1 — ÖNCE -s'NİN SOLUNDA İŞLEM ALANI AÇ
       ======================================================= */

    const operationGap =
      document.createElement("span");

    operationGap.className =
      "operationGap";

    operationGap.dataset.role =
      "operationGap";

    inner.insertBefore(
      operationGap,
      minusS
    );


    const fontSize =
      parseFloat(
        getComputedStyle(eq).fontSize
      );

    const gapWidth =
      fontSize * 2.15;

    await animateWidth(
      operationGap,
      0,
      gapWidth,
      440
    );

    await wait(160);


    /* =======================================================
       2 — DIŞARIDAKİ SONUÇ İÇİN YER AÇ
       ======================================================= */

    const cBefore =
      cMove.getBoundingClientRect();

    const outsideTarget =
      span(
        `−${THIN}${fractionHTML(result)}`,
        "advOutsideResult",
        "term finalTarget"
      );

    eq.insertBefore(
      outsideTarget,
      cMove
    );

    await moveWithFLIP(
      cMove,
      cBefore,
      520
    );

    await wait(180);


    /* =======================================================
       3 — a'NIN KOPYASI İŞLEM ALANINA GELİR
       ======================================================= */

    const line =
      eq.getBoundingClientRect();

    const aRect =
      factorA.getBoundingClientRect();

    const gapRect =
      operationGap.getBoundingClientRect();

    const minusRect =
      minusS.getBoundingClientRect();

    const aFly =
      document.createElement("div");

    aFly.className =
      "floatValue";

    aFly.dataset.role =
      "distributionA";

    aFly.textContent =
      a;

    aFly.style.left =
      `${
        aRect.left -
        line.left +
        aRect.width/2
      }px`;

    aFly.style.top =
      `${
        aRect.top -
        line.top
      }px`;

    eq.append(aFly);


    const aTargetX =
      gapRect.left -
      line.left +
      gapRect.width * .30;

    const operationY =
      minusRect.top -
      line.top;

    await animatePosition(
      aFly,
      aTargetX,
      operationY,
      650,
      EASE
    );

    await wait(260);


    /* =======================================================
       4 — × AYNI BOŞLUKTA BELİRİR
       ======================================================= */

    const times =
      document.createElement("div");

    times.className =
      "operationSymbol";

    times.dataset.role =
      "distributionTimes";

    times.textContent =
      "×";

    const timesX =
      gapRect.left -
      line.left +
      gapRect.width * .70;

    times.style.left =
      `${timesX}px`;

    times.style.top =
      `${operationY}px`;

    eq.append(times);

    await animateOpacity(
      times,
      0,
      1,
      180
    );

    await wait(650);


    /* =======================================================
       5 — a × (−s) → −as
       ======================================================= */

    const clusterLeft =
      gapRect.left -
      line.left;

    const clusterRight =
      minusRect.right -
      line.left;

    const resultX =
      (
        clusterLeft +
        clusterRight
      ) / 2;

    const resultFly =
      document.createElement("div");

    resultFly.className =
      "floatValue";

    resultFly.dataset.role =
      "distributionResult";

    resultFly.style.left =
      `${resultX}px`;

    resultFly.style.top =
      `${operationY}px`;

    resultFly.style.opacity =
      "0";

    resultFly.innerHTML =
      `−${THIN}${fractionHTML(result)}`;

    eq.append(resultFly);


    await Promise.all([

      animateOpacity(
        aFly,
        1,
        0,
        210
      ),

      animateOpacity(
        times,
        1,
        0,
        210
      ),

      animateOpacity(
        minusS,
        1,
        0,
        210
      ),

      animateOpacity(
        resultFly,
        0,
        1,
        250
      )

    ]);


    aFly.remove();
    times.remove();

    await wait(520);


    /* =======================================================
       6 — YALNIZCA SONUÇ DIŞARI GİDER
       ======================================================= */

    const targetRect =
      outsideTarget.getBoundingClientRect();

    await animatePosition(
      resultFly,

      targetRect.left -
      line.left +
      targetRect.width/2,

      targetRect.top -
      line.top,

      760,
      EASE
    );


    resultFly.remove();

    outsideTarget.classList.remove(
      "finalTarget"
    );


    /* =======================================================
       7 — İÇERİDEKİ GEÇİCİ ALANI TEMİZLE
       ======================================================= */

    minusS.remove();

    await animateWidth(
      operationGap,
      gapWidth,
      0,
      360
    );

    operationGap.remove();


    /* =======================================================
       8 — DIŞ PARANTEZLER KALKAR
       ======================================================= */

    const leftParen =
      q("factorOuterL");

    const rightParen =
      q("factorOuterR");

    if(
      leftParen &&
      rightParen
    ){

      await Promise.all([

        animateOpacity(
          leftParen,
          1,
          0,
          170
        ),

        animateOpacity(
          rightParen,
          1,
          0,
          170
        )

      ]);

      leftParen.remove();
      rightParen.remove();

    }


    /* =======================================================
       9 — DIŞARIDAKİ İKİ TERİM TEK TIK HEDEFİ
       ======================================================= */

    const pair =
      document.createElement("span");

    pair.className =
      "term clickable";

    pair.dataset.role =
      "advFinalPair";

    eq.insertBefore(
      pair,
      outsideTarget
    );

    pair.append(
      outsideTarget,
      cMove
    );

    pair.onclick =
      advancedFinish;

    locked =
      false;

  }


  async function advancedFinish(){

    if(locked)
      return;

    locked =
      true;

    const pair =
      q("advFinalPair");

    pair.onclick =
      null;

    pair.classList.remove(
      "clickable"
    );

    const h =
      rat(
        b,
        2*a
      );

    const s =
      rSquare(h);

    const as =
      rMul(
        rat(a),
        s
      );

    const final =
      rSub(
        rat(c),
        as
      );

    await animateOpacity(
      pair,
      1,
      0,
      220
    );

    if(rIsZero(final)){

      pair.remove();

      locked =
        false;

      return;

    }

    pair.innerHTML =
      signedRationalHTML(
        final
      );

    pair.style.opacity =
      "1";

    pair.className =
      "term softAppear";

    locked =
      false;

  }


  /* =========================================================
     BAŞLANGIÇ
     ========================================================= */

  startEasy();

})();
</script>
