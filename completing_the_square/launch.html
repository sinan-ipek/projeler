<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tam Kareye Tamamlama</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#fff}
body{overflow:hidden}
.homeBtn{
  position:fixed;
  top:14px;
  right:18px;
  z-index:9999;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:10px 16px;
  border:1.5px solid #38bdf8;
  border-radius:12px;
  background:#fff;
  color:#0f172a;
  text-decoration:none;
  font:700 15px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-shadow:0 7px 18px rgba(56,189,248,.10);
  transition:background .15s ease,box-shadow .18s ease,transform .1s ease;
}
.homeBtn:hover{
  background:rgba(56,189,248,.07);
  box-shadow:0 7px 18px rgba(56,189,248,.18);
  transform:translateY(-1px);
}
.appFrame{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}
@media(max-width:700px){
  .homeBtn{top:8px;right:8px;padding:8px 12px;font-size:14px}
}
</style>
</head>
<body>
<a class="homeBtn" href="../index.html" aria-label="Projeler ana sayfasına dön">Home</a>
<iframe class="appFrame" src="index.html" title="Tam Kareye Tamamlama"></iframe>
</body>
</html>
