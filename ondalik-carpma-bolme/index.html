<!doctype html>
<html lang="tr">
<head>

<title>Ondalık Çarpma ve Bölme</title>
<style>
:root{color-scheme:light;--ink:#17243b;--blue:#2778f5;--red:#e04754;--soft:#f5f8fd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#fff 0%,#f1f5fb 88%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
main{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:30px 18px 70px}.scene{width:min(1180px,100%);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:75px}.brand{font-weight:700;letter-spacing:.02em;color:#71819a;font-size:clamp(15px,2vw,21px)}.actions{display:flex;gap:9px}.small{font:600 15px/1 system-ui;padding:12px 17px;background:#fff;border:1px solid #dce6f4;border-radius:15px;box-shadow:0 4px 12px #2038580a;cursor:pointer;color:#536780}.home-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:25px;min-width:46px;padding:7px 12px}.small:hover,.small:focus-visible{color:var(--blue);border-color:var(--blue);outline:none}.equation{display:flex;justify-content:center;align-items:end;gap:clamp(6px,1vw,15px);max-width:100%;overflow-x:auto;overflow-y:visible;padding:18px 8px 28px;scrollbar-width:thin}.operand{display:flex;flex-direction:column;align-items:center;justify-content:end;min-width:0}.arrows{display:flex;justify-content:center;align-items:center;min-height:61px;gap:1px;white-space:nowrap}.arrow{width:clamp(26px,3.2vw,40px);height:49px;padding:0;border:2px solid transparent;border-radius:11px;background:transparent;color:#537cc6;font-size:clamp(28px,3.4vw,39px);font-weight:750;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,transform .15s,opacity .2s}.arrow:hover,.arrow:focus-visible{background:#eaf2ff;border-color:var(--blue);transform:translateY(-3px);outline:none}.arrow.used{visibility:hidden;pointer-events:none}.arrow.cancelling{position:absolute;animation:pairDisappear .48s ease-in forwards!important;pointer-events:none!important;border-color:transparent!important;background:transparent!important}.arrow.cancelling::after{content:"";position:absolute;left:7%;top:50%;width:86%;height:3px;border-radius:5px;background:#e33343;transform:rotate(-48deg) scaleX(0);transform-origin:center;animation:crossOut .23s ease-out forwards;box-shadow:0 0 2px #e3334360}@keyframes crossOut{to{transform:rotate(-48deg) scaleX(1)}}@keyframes pairDisappear{0%,49%{opacity:1}100%{opacity:0;filter:blur(3px)}}.arrow.fading{animation:arrowFadeOut .19s ease-in forwards!important;pointer-events:none;border-color:transparent!important;background:transparent!important}@keyframes arrowFadeOut{from{opacity:1;filter:blur(0);transform:scale(1)}to{opacity:0;filter:blur(2px);transform:scale(.68)}}.arrow:disabled,.arrow:disabled:hover,.arrow:disabled:focus-visible{border-color:transparent;background:transparent;box-shadow:none;transform:none;outline:none;cursor:default}.tile:disabled,.tile:disabled:hover,.tile:disabled:focus-visible{border-color:transparent;background:transparent;box-shadow:none;transform:none;outline:none;cursor:default}.tile:disabled:active{transform:none}.arrow.is-new{animation:pop .32s cubic-bezier(.2,1.2,.4,1) both}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.72)}to{opacity:1;transform:translateY(0) scale(1)}}.tile{position:relative;border:2px solid transparent;background:transparent;border-radius:17px;color:var(--ink);font:700 clamp(30px,5.3vw,69px)/1.2 ui-rounded,system-ui,"Segoe UI",sans-serif;letter-spacing:-.045em;min-height:93px;padding:10px clamp(5px,.7vw,14px);white-space:nowrap;cursor:pointer;transition:border-color .16s,background .16s,box-shadow .16s,transform .16s}.tile:hover,.tile:focus-visible{border-color:var(--blue);background:#f0f6ff;box-shadow:0 0 0 4px #3c87f21a;outline:none}.tile:active{transform:scale(.985)}.symbol{min-width:65px;font-weight:450;font-size:clamp(36px,5vw,65px)}.equal{font-weight:450;font-size:clamp(34px,4.9vw,60px)}.result{color:var(--red);min-width:110px}.result.correct{color:var(--ink)}.result-origin{position:absolute;left:50%;top:calc(100% - 7px);transform:translateX(-50%);font:500 clamp(12px,1.25vw,16px)/1.2 system-ui,sans-serif;letter-spacing:0;color:#537cc6;white-space:nowrap;pointer-events:none;user-select:none}.tile.result:not(.ready){color:#bbc7d8}.number-display{display:inline-flex;justify-content:center;align-items:baseline;white-space:nowrap;position:relative;font-variant-numeric:tabular-nums}.digit{display:inline-block;animation:digitIn .36s ease both}.digit.comma{color:inherit;animation:commaSlide .42s cubic-bezier(.18,.85,.25,1) both}.digit.new-zero{animation:zeroIn .46s ease both}@keyframes zeroIn{from{opacity:0;filter:blur(3px);transform:translateX(9px)}to{opacity:1;filter:blur(0);transform:translateX(0)}}@keyframes commaSlide{from{opacity:.35;transform:translateX(17px)}to{opacity:1;transform:translateX(0)}}@keyframes digitIn{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.editor{font:inherit;font-weight:700;letter-spacing:inherit;color:var(--ink);width:5ch;min-width:90px;max-width:260px;padding:4px 8px;border:2px solid var(--blue);border-radius:11px;background:white;outline:none;text-align:center}.hidden{visibility:hidden}.help{height:24px;color:#8a9ab1;font-size:13px;margin-top:10px;opacity:.85}.completion{height:12px;margin-top:15px;font-size:14px;color:#48816d;font-weight:600}.operand .arrows.place-aligned{position:relative;width:100%;min-width:100%;overflow:visible}.arrows.place-aligned .arrow{position:absolute;top:4px;left:0;transform:translateX(-50%)}.arrows.place-aligned .arrow:hover,.arrows.place-aligned .arrow:focus-visible{transform:translate(-50%,-3px)}.arrows.place-aligned .arrow:disabled,.arrows.place-aligned .arrow:disabled:hover{transform:translateX(-50%)}.operand-digit{display:inline-block}.hint-fade-out{animation:hintFadeOut .32s ease-in forwards!important;pointer-events:none!important}@keyframes hintFadeOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(2px)}}.used-bracket{position:absolute;height:15px;border:3px solid var(--blue);border-top:0;border-radius:0 0 7px 7px;pointer-events:none;z-index:3;animation:capAppear .3s ease-out both}.zero-cap{position:absolute;top:32px;height:13px;border:3px solid #537cc6;border-bottom:0;border-radius:6px 6px 0 0;pointer-events:none;z-index:2;animation:capAppear .26s ease-out both}@keyframes capAppear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.operator-space{min-height:61px} .arrow-fly{position:fixed;z-index:1000;pointer-events:none;margin:0;display:flex;align-items:center;justify-content:center;border:2px solid transparent;border-radius:11px;color:#537cc6;font:750 38px/1 system-ui,sans-serif;text-shadow:0 2px 4px #6380a222;will-change:transform,opacity}.arrow-fly.cancel{color:#e07887}.arrow-fly.survive{color:#2778f5}.merge-spark{position:fixed;z-index:1001;pointer-events:none;width:16px;height:16px;border:3px solid #93b9fd;border-radius:50%;transform:translate(-50%,-50%);animation:spark .38s ease-out both}@keyframes spark{from{opacity:1;width:10px;height:10px}to{opacity:0;width:54px;height:54px}}.footer{position:fixed;bottom:17px;left:0;right:0;text-align:center;color:#9aaabe;font-size:12px;pointer-events:none}@media(max-width:690px){.top{margin-bottom:35px}.equation{justify-content:flex-start}.scene{max-width:100%}.tile{min-height:77px}.symbol{min-width:45px}.result{min-width:72px}.arrows{min-height:55px}.arrow{height:43px;width:26px}.help{font-size:12px}}
</style>
</head>
<body>
<main><section class="scene">
<header class="top"><div class="brand"></div><div class="actions"><a class="small home-link" href="/projeler/index.html" aria-label="Ana sayfa" title="Ana sayfa">⌂</a><button class="small" id="numberEntry" type="button">Sayı girişi</button><button class="small" id="reset" type="button" title="Aynı işlemi baştan başlat">↺</button><button class="small" id="next" type="button" title="Yeni işlem">Yeni işlem ↗</button></div></header>
<div class="equation" aria-label="Matematik işlemi">
 <div class="operand"><div class="arrows" id="arrowsA"></div><button id="a" class="tile" title="Okları görmek için tıkla; değiştirmek için çift tıkla" type="button"></button></div>
 <div class="operand"><div class="operator-space"></div><button id="op" class="tile symbol" title="Çarpma veya bölme seç" type="button">×</button></div>
 <div class="operand"><div class="arrows" id="arrowsC"></div><button id="c" class="tile" title="Okları görmek için tıkla; değiştirmek için çift tıkla" type="button"></button></div>
 <div class="operand"><div class="operator-space"></div><button id="equals" class="tile equal" title="Sonucu göster" type="button">=</button></div>
 <div class="operand"><div class="arrows" id="arrowsD"></div><button id="d" class="tile result" title="Okları görmek veya sayıyı değiştirmek için tıkla" type="button">?</button></div>
</div>
<div id="help" class="help" aria-live="polite"></div><div id="completion" class="completion" aria-live="polite"></div>
</section></main><div class="footer"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const MAX_ARROWS=14;
const EXAMPLES=[
 ['0,012','2,5','×'],['200','1,2','×'],['200','2,5','÷'],['0,02','0,002','÷'],
 ['3,2','0,4','×'],['0,07','30','×'],['4,8','0,6','÷'],['0,6','0,03','÷'],
 ['0,125','0,8','×'],['2,5','0,04','÷'],['300','0,02','×'],['0,004','50','×'],
 ['6,4','0,8','÷'],['120','0,06','÷'],['0,08','0,4','×']
];
let exIndex=0;
let fadeSequence=0;
let state={a:'0,012',c:'2,5',op:'×',started:false,showA:false,showC:false,showD:false,steps:0,base:'',baseApprox:false,origin:'',expected:'',effectA:0,effectC:0,total:0,editing:false,merging:false,fading:false,hintsDismissed:false,usedA:[],usedC:[],applied:0,customMode:false};
function decimalParts(raw){
 let s=String(raw).trim().replace(/\s/g,'').replace('.',',');
 if(!/^[+]?(?:\d+(?:,\d*)?|,\d+)$/.test(s))return null;
 s=s.replace(/^\+/,'');if(s.startsWith(','))s='0'+s;if(s.endsWith(','))s=s.slice(0,-1);
 let [whole,frac='']=s.split(',');whole=whole.replace(/^0+(?=\d)/,'');
 const normalized=(whole+(frac||'')).replace(/^0+(?=\d)/,'');
 if(!normalized||!/^\d+$/.test(normalized)||normalized.length>20)return null;
 const integer=BigInt(normalized);
 // Çarpmada tam sayı sonundaki sıfırlar ayrıca büyütme oklarına dönüşür.
 // Bölmede 200 gibi sayılar olduğu gibi kullanılır.
 const mantissa=integer;
 const effect=integer===0n?0:-frac.length;
 return {display:(frac?whole+','+frac:whole),mantissa,effect,integer,decimals:frac.length};
}
function gcd(a,b){while(b!==0n){const t=a%b;a=b;b=t}return a}
function toDecimal(n,d,limit=16){
 if(d===0n)return null;
 if(n===0n)return {text:'0',approx:false};
 let g=gcd(n,d);n/=g;d/=g;
 const whole=n/d;let rem=n%d;let digits='';let count=0;
 while(rem && count<limit){rem*=10n;digits+=(rem/d).toString();rem%=d;count++}
 let approx=rem!==0n;
 return {text:whole.toString()+(digits?','+digits:''),approx};
}
function scaledString(text,steps){
 // Decimal expansion using exact digit/string shifts, without floating point.
 let s=text.replace('.',',');let [w,f='']=s.split(',');let digits=w+f;let index=w.length+steps;
 if(index<=0){digits='0'.repeat(-index)+digits;index=0}
 if(index>=digits.length){digits=digits+'0'.repeat(index-digits.length);index=digits.length}
 let nw=digits.slice(0,index).replace(/^0+(?=\d)/,'')||'0';
 let nf=digits.slice(index).replace(/0+$/,'');
 // if number is smaller than 1, a 0 is added with animated fade-in by renderNumber.
 return nf?nw+','+nf:nw;
}
function multiplicationParts(part){
 // Örnek: 200 -> 2 ve iki büyütme oku; 0,012 -> 12 ve üç küçültme oku.
 if(part.decimals || part.integer===0n)return {mantissa:part.mantissa,effect:part.effect};
 let value=part.mantissa,zeros=0;
 while(value%10n===0n){value/=10n;zeros++}
 return {mantissa:value,effect:zeros};
}
function calc(){
 const a=decimalParts(state.a),c=decimalParts(state.c);
 if(!a||!c||state.op==='÷'&&c.integer===0n)return null;
 let start,effectA,effectC,origin;
 if(state.op==='×'){
  const x=multiplicationParts(a),y=multiplicationParts(c);
  start={text:(x.mantissa*y.mantissa).toString(),approx:false};
  effectA=x.effect;effectC=y.effect;origin=x.mantissa.toString()+'×'+y.mantissa.toString();
 }else{
  // Bölmede tam sayı sonundaki sıfırları ayırmıyoruz.
  // 200 ÷ 2,5 -> 200 ÷ 25 = 8, ardından ↑ ile 80.
  start=toDecimal(a.mantissa,c.mantissa);
  effectA=a.effect;effectC=-c.effect;origin=a.mantissa.toString()+'÷'+c.mantissa.toString();
 }
 if(!start)return null;
 const total=effectA+effectC;
 if(Math.abs(total)>MAX_ARROWS)return null;
 return {start:start.text,approx:start.approx,origin,aEffect:effectA,cEffect:effectC,total,final:scaledString(start.text,total)};
}
function arrows(element,effect,opts={}){
 element.replaceChildren();
 const which=opts.which;
 if(!which || !state.started)return;
 const used=which==='a'?state.usedA:state.usedC;
 const symbol=effect>=0?'↑':'↓';
 for(let i=0;i<Math.abs(effect);i++){
  const btn=document.createElement('button');
  btn.type='button';btn.textContent=symbol;
  btn.className='arrow'+(used.includes(i)?' used':' is-new');
  btn.title=effect>=0?'10 ile çarp':'10’a böl';
  btn.setAttribute('aria-label',btn.title);
  btn.disabled=used.includes(i)||state.fading;
  btn.addEventListener('click',ev=>{ev.stopPropagation();applyLeftArrow(which,i,effect>=0?1:-1,btn)});
  element.append(btn);
 }
}
function animateDigits(element,text,previous){
 element.replaceChildren();const wrap=document.createElement('span');wrap.className='number-display';
 const newLeadingZero=text.startsWith('0,')&&!previous.startsWith('0,');
 for(let i=0;i<text.length;i++){
  const el=document.createElement('span');el.className='digit'+(text[i]===','?' comma':'')+(i===0&&newLeadingZero?' new-zero':'');el.textContent=text[i];wrap.append(el);
 }
 element.append(wrap);
}
function renderOperand(id,number){
 const tile=$(id);tile.replaceChildren();
 const display=document.createElement('span');display.className='number-display';
 for(const char of number){
  const digit=document.createElement('span');digit.className='operand-digit';digit.textContent=char;
  display.append(digit);
 }
 tile.append(display);
}
// Each arrow shares the horizontal center of its own place-value digit.
function showUsedBracket(which){
 if(!state.started||state.hintsDismissed)return;
 const value=state[which];
 const p=decimalParts(value);
 if(!p)return;
 // Çarpma: virgülsüz ve sondaki sıfırlar ayrılmış sayı.
 // Bölme: bölünen korunur, bölen virgülsüz düşünülür.
 let chosen;
 if(state.op==='×') chosen=multiplicationParts(p).mantissa.toString();
 else chosen=p.mantissa.toString();
 const digits=[...$(which).querySelectorAll('.operand-digit')];
 const numericDigits=digits.map(d=>d.textContent).join('');
 // Sondaki/baştaki kullanılmayan sıfırları bracket dışında bırak.
 const rawIndices=[];
 for(let i=0;i<digits.length;i++)if(/\d/.test(digits[i].textContent))rawIndices.push(i);
 const raw=rawIndices.map(i=>digits[i].textContent).join('');
 let start=-1;
 if(chosen==='0')start=raw.lastIndexOf('0');
 else{
  // Çarpmada örn. 200 -> 2; virgüllü sayıda 0,012 -> 12.
  // Bölmede 200 -> 200, 0,02 -> 2.
  const normalized=raw.replace(/^0+(?=\d)/,'');
  const leading=raw.length-normalized.length;
  const match=normalized.indexOf(chosen);
  if(match>=0)start=leading+match;
 }
 if(start<0)return;
 const selected=rawIndices.slice(start,start+chosen.length);
 if(!selected.length)return;
 const first=digits[selected[0]].getBoundingClientRect();
 const last=digits[selected[selected.length-1]].getBoundingClientRect();
 const tile=$(which),origin=tile.getBoundingClientRect();
 const bracket=document.createElement('span');
 bracket.className='used-bracket';bracket.setAttribute('aria-hidden','true');
 bracket.style.left=(first.left-origin.left+1)+'px';
 bracket.style.width=Math.max(12,last.right-first.left-2)+'px';
 bracket.style.top=(last.bottom-origin.top-4)+'px';
 tile.append(bracket);
}
function alignPlaceArrows(which){
 const holder=$('arrows'+which.toUpperCase());
 const buttons=[...holder.querySelectorAll('.arrow')];
 holder.classList.add('place-aligned');
 if(!buttons.length)return;
 const value=state[which];
 const comma=value.indexOf(',');
 const places=[];
 if(comma!==-1){
  for(let i=comma+1;i<value.length;i++)places.push(i);
 }else if(state.op==='×' && Number(value)!==0){
  // Çarpmanın ↑ okları tam sayının sondaki sıfırlarının üzerinde.
  for(let i=value.length-1;i>=0 && value[i]==='0';i--)places.unshift(i);
 }
 const chars=[...$(which).querySelectorAll('.operand-digit')];
 const box=holder.getBoundingClientRect();
 buttons.forEach((button,i)=>{
  const digit=chars[places[i]];
  if(!digit)return;
  const r=digit.getBoundingClientRect();
  // Basamak merkezinden küçük optik sola düzeltme.
  button.style.left=(r.left+r.width/2-box.left-4)+'px';
 });
}
function render(){
 if(state.editing)return;
 renderOperand('a',state.a);renderOperand('c',state.c);$('op').textContent=state.op;
 $('op').disabled=state.started || !state.customMode;
 $('equals').disabled=state.started || state.editing || state.merging;
 $('a').disabled=true;$('c').disabled=true;
 $('op').title=state.started?'Yeni işlem veya sıfırla ile işlemi değiştirebilirsin':'Çarpma veya bölme seç';
 arrows($('arrowsA'),state.started?state.effectA:0,{which:'a'});
 arrows($('arrowsC'),state.started?state.effectC:0,{which:'c'});
 $('arrowsD').replaceChildren();
 alignPlaceArrows('a');alignPlaceArrows('c');showUsedBracket('a');showUsedBracket('c');
 $('d').disabled=true;
 $('d').classList.toggle('ready',state.started);
 $('d').classList.toggle('correct',state.started&&state.applied===Math.abs(state.effectA)+Math.abs(state.effectC));
 if(!state.started){$('d').textContent='?';$('completion').textContent='';return}
 const prior=$('d').dataset.last||'';
 const changed=state.steps;
 const now=scaledString(state.base,changed);
 if(prior!==now)animateDigits($('d'),now,prior);
 $('d').dataset.last=now;
 let originLabel=$('d').querySelector('.result-origin');
 if(!originLabel){originLabel=document.createElement('span');originLabel.className='result-origin';originLabel.setAttribute('aria-hidden','true');$('d').append(originLabel)}
 originLabel.textContent=state.origin;
 if(state.hintsDismissed)originLabel.remove();
 $('completion').textContent='';
}
function begin(){
 const model=calc();if(!model){flash('Sayıları kontrol et');return}
 fadeSequence++;state.fading=false;state.merging=false;state.hintsDismissed=false;state.started=true;state.showA=true;state.showC=true;state.showD=false;state.steps=0;
 state.effectA=model.aEffect;state.effectC=model.cEffect;state.total=model.total;state.usedA=[];state.usedC=[];state.applied=0;
 state.base=model.start;state.baseApprox=model.approx;state.origin=model.origin;state.expected=model.final;
 $('d').dataset.last='';$('help').textContent='';render();
}
function dismissHints(){
 if(state.hintsDismissed)return;
 state.hintsDismissed=true;
 const elements=[...document.querySelectorAll('.used-bracket,.zero-cap,.result-origin')];
 elements.forEach(el=>{el.classList.add('hint-fade-out');setTimeout(()=>el.remove(),340)});
}
async function applyLeftArrow(which,index,direction,button){
 if(!state.started||state.fading)return;
 const used=which==='a'?state.usedA:state.usedC;
 if(used.includes(index))return;
 const oppositeWhich=which==='a'?'c':'a';
 const oppositeEffect=oppositeWhich==='a'?state.effectA:state.effectC;
 const oppositeUsed=oppositeWhich==='a'?state.usedA:state.usedC;
 // Önce birbirinin tersi olan oklar kırmızı çizgiyle çift olarak silinir.
 const oppositeIndex=oppositeEffect*direction<0
  ?Array.from({length:Math.abs(oppositeEffect)},(_,i)=>i).find(i=>!oppositeUsed.includes(i))
  :undefined;
 const token=++fadeSequence;
 state.fading=true;
 dismissHints();
 if(oppositeIndex!==undefined){
  const other=$('arrows'+oppositeWhich.toUpperCase()).querySelectorAll('.arrow')[oppositeIndex];
  button.disabled=true;other.disabled=true;
  button.classList.remove('is-new');other.classList.remove('is-new');
  button.classList.add('cancelling');other.classList.add('cancelling');
  await new Promise(resolve=>setTimeout(resolve,480));
  if(token!==fadeSequence)return;
  used.push(index);oppositeUsed.push(oppositeIndex);
  state.applied+=2;
 }else{
  // Zıt oklar bittiğinde her ok sonucu yalnızca bir basamak değiştirir.
  button.disabled=true;
  button.classList.remove('is-new');button.classList.add('fading');
  await new Promise(resolve=>setTimeout(resolve,190));
  if(token!==fadeSequence)return;
  used.push(index);
  state.steps+=direction;
  state.applied++;
 }
 state.fading=false;
 render();
}
function flash(s){$('help').textContent=s;setTimeout(()=>{if($('help').textContent===s)$('help').textContent=''},2200)}
function reset(){fadeSequence++;state.fading=false;state.merging=false;state.hintsDismissed=false;document.querySelectorAll('.arrow-fly,.merge-spark').forEach(e=>e.remove());state.started=false;state.showA=false;state.showC=false;state.showD=false;state.steps=0;state.usedA=[];state.usedC=[];state.applied=0;state.effectA=0;state.effectC=0;state.total=0;state.base='';state.origin='';$('d').dataset.last='';$('help').textContent='';render()}
function choose(idx){const [a,c,op]=EXAMPLES[(idx+EXAMPLES.length)%EXAMPLES.length];state.customMode=false;state.editing=false;$('numberEntry').textContent='Sayı girişi';$('numberEntry').onclick=numberEntry;state.a=a;state.c=c;state.op=op;reset()}
function edit(which){
 if(state.editing)return;
 state.editing=true;const tile=$(which),val=state[which];tile.replaceChildren();
 const inp=document.createElement('input');inp.className='editor';inp.type='text';inp.inputMode='decimal';inp.value=val;inp.setAttribute('aria-label','Sayıyı düzenle');inp.style.width=Math.max(4,val.length+1)+'ch';tile.append(inp);
 inp.focus();inp.select();let finished=false;
 const done=save=>{
  if(finished)return;finished=true;
  if(save){const p=decimalParts(inp.value);if(!p){state.editing=false;reset();flash('Geçerli bir sayı yaz');return}state[which]=p.display}
  state.editing=false;reset();
 };
 inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)});
 inp.addEventListener('blur',()=>done(true));inp.addEventListener('click',e=>e.stopPropagation());inp.addEventListener('dblclick',e=>e.stopPropagation());
}
function numberEntry(){
 // İki sayı da aynı anda düzenlenebilir; işlem işareti seçilebilir.
 if(state.editing)return;
 reset();state.customMode=true;state.op='×';state.editing=true;
 $('op').textContent='×';$('op').disabled=false;
 $('equals').disabled=true;
 $('numberEntry').textContent='Tamam';
 const inputs=[];
 for(const which of ['a','c']){
  const tile=$(which);tile.replaceChildren();
  const inp=document.createElement('input');
  inp.className='editor';inp.type='text';inp.inputMode='decimal';
  inp.value=state[which];inp.setAttribute('aria-label',which==='a'?'Birinci sayı':'İkinci sayı');
  inp.style.width=Math.max(4,state[which].length+1)+'ch';
  tile.append(inp);inputs.push(inp);
  inp.addEventListener('click',e=>e.stopPropagation());
  inp.addEventListener('keydown',e=>{
   if(e.key==='Enter'){e.preventDefault();commitNumbers()}
   if(e.key==='Escape'){e.preventDefault();cancelNumbers()}
  });
 }
 $('numberEntry').onclick=commitNumbers;
 inputs[0].focus();inputs[0].select();
}
function commitNumbers(){
 if(!state.editing)return;
 const pa=decimalParts($('a').querySelector('input')?.value||'');
 const pc=decimalParts($('c').querySelector('input')?.value||'');
 if(!pa||!pc){flash('Geçerli sayılar yaz');return}
 if(state.op==='÷'&&pc.integer===0n){flash('Sıfıra bölme yapılamaz');return}
 state.a=pa.display;state.c=pc.display;
 state.editing=false;
 $('numberEntry').textContent='Sayı girişi';$('numberEntry').onclick=numberEntry;
 reset();
}
function cancelNumbers(){
 state.editing=false;
 $('numberEntry').textContent='Sayı girişi';$('numberEntry').onclick=numberEntry;
 reset();
}
$('numberEntry').onclick=numberEntry;
$('op').addEventListener('click',()=>{
 if(state.started||!state.customMode)return;
 state.op=state.op==='×'?'÷':'×';
 $('op').textContent=state.op;
});
// Eşittirden sonra yalnızca kullanılmamış sol oklar etkindir.
$('equals').addEventListener('click',()=>{if(!state.editing)begin()});
// Sonuç rakamı etkileşimli değildir; yalnızca yukarıdaki oklar tıklanır.
$('reset').addEventListener('click',()=>{if(state.editing)cancelNumbers();else reset()});
$('next').addEventListener('click',()=>{exIndex=(exIndex+1)%EXAMPLES.length;choose(exIndex)});
// The exercise itself is the guidance: no instructions in the workspace.
choose(0);
</script>
