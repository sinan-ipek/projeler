<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check Liste</title>
<meta name="description" content="Check Liste — öğrenci çalışmalarına doğrudan erişim">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#dedede;color:#111;-webkit-font-smoothing:antialiased
}
.site-shell{
 width:min(94vw,1460px);min-height:210px;margin:28px auto;
 padding:24px 0 38px;border-radius:30px;background:#f2f2f3;
 box-shadow:0 1px 0 rgba(0,0,0,.03)
}
.utility{
 padding:0 32px;display:flex;align-items:center;gap:12px
}
.home{
 width:40px;height:40px;display:grid;place-items:center;flex:none;
 background:#ffdc28;border:1px solid #d1b11b;border-radius:3px;color:#101010
}
.home svg{width:23px;height:23px;fill:currentColor}
.language{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:14px;color:#3b443c}
.language select,.help{
 border:1px solid #c9c9c9;border-radius:8px;background:#fafafa;color:#222;
 font:inherit;min-height:40px
}
.language select{padding:6px 9px}
.help{width:40px;font-size:21px;font-weight:700;cursor:pointer}
.page{padding:44px 56px 22px}
.grid{
 display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:19px 12px
}
/* Match the simple buttons on the main Projeler page. */
.btn-card{
 display:flex;align-items:center;justify-content:center;
 width:60%;justify-self:center;height:54px;padding:0 10px;
 text-align:center;text-decoration:none;cursor:pointer;color:#000;
 font:400 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#f7f7f8;border:1px solid rgba(0,0,0,.16);border-radius:11px;
 box-shadow:0 10px 22px rgba(0,0,0,.14);transition:.15s ease
}
.btn-card:hover{
 transform:translateY(-2px);background:#fff;
 box-shadow:0 14px 28px rgba(0,0,0,.18)
}
.btn-card:focus-visible,.home:focus-visible,.help:focus-visible,.language select:focus-visible{
 outline:3px solid #829c88;outline-offset:3px
}
.choice{min-width:0;position:relative;display:grid;place-items:center}
.choice>.btn-card{width:60%}
.grade7-menu{
 position:absolute;z-index:20;top:calc(100% + 10px);left:0;
 width:max(180px,100%);padding:10px;border-radius:12px;
 background:#fff;border:1px solid #ccd4ce;box-shadow:0 16px 30px #171e1830
}
.grade7-menu[hidden],.grade7-menu [hidden]{display:none!important}
.grade7-menu a,.grade7-menu button{
 display:block;width:100%;padding:11px 12px;margin:0 0 5px;
 border:1px solid #dce5de;border-radius:7px;background:#f5f6f5;
 color:#1f3928;text-decoration:none;text-align:left;cursor:pointer;font:inherit;font-size:14px
}
.grade7-menu a:hover,.grade7-menu button:hover{background:#e6ece7}
.grade7-status{color:#3a6544;font-size:14px;line-height:1.45;margin:8px 2px 1px;overflow-wrap:anywhere}
.grade7-status:empty{display:none}
.help-text{
 margin:15px 32px 0;padding:11px 13px;max-width:430px;
 border:1px solid #dce4dd;background:#fff;border-radius:9px;font-size:14px
}
.help-text[hidden]{display:none}
.version{
 position:fixed;bottom:6px;left:10px;font-size:10px;color:#929a94;
 background:#f2f2f3cc;border-radius:4px;padding:2px 5px;pointer-events:none
}
@media(max-width:1050px){
 .site-shell{width:min(96vw,980px);margin:28px auto}
 .page{padding:35px 32px 22px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
 .site-shell{width:96vw;margin:18px auto;border-radius:24px}
 .page{padding:32px 24px 20px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
 .btn-card,.choice>.btn-card{height:76px;width:75%;font-size:16px}
}
@media(max-width:500px){
 .site-shell{width:100%;margin:0;border-radius:0}
 .utility{padding:0 14px;gap:8px}
 .page{padding:28px 14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
 .btn-card,.choice>.btn-card{height:68px;width:92%;font-size:16px}
}
</style>
</head>
<body>
<main class="site-shell" aria-label="Check Liste">
 <nav class="utility" aria-label="Sayfa araçları">
  <a class="home" href="../index.html" title="Home" aria-label="Home">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 11h3v10h6v-7h2v7h6V11h3L12 2Z"/></svg>
  </a>
  <label class="language" for="language">
   <span id="languageLabel">Dil</span>
   <select id="language" aria-label="Dil">
    <option value="tr">Türkçe</option>
    <option value="de">Almanca</option>
    <option value="en">İngilizce</option>
   </select>
  </label>
  <button class="help" id="help" type="button" aria-expanded="false" title="Help" aria-label="Help">?</button>
 </nav>
 <p class="help-text" id="helpText" hidden></p>
 <div class="page">
  <section class="grid" aria-label="Öğrenci çalışmaları">
   <div class="choice" id="grade7Choice">
    <button class="btn-card" id="grade7Toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="grade7Menu">7. sınıf</button>
    <div class="grade7-menu" id="grade7Menu" hidden>
     <a id="grade7Start" href="./lesson.html?set=lambacher-7" hidden>Çalışmayı aç</a>
     <button id="grade7Upload" type="button">Yükle</button>
     <input id="grade7File" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden>
     <p id="grade7Status" class="grade7-status" role="status" aria-live="polite"></p>
    </div>
   </div>
   <a class="btn-card" href="./lesson.html?set=munzur">Munzur</a>
   <a class="btn-card" href="./lesson.html?set=mirac-1">Miraç 1</a>
   <a class="btn-card" href="./lesson.html?set=liya-1">Liya 1</a>
   <a class="btn-card" href="./lesson.html?set=egemen-1">Egemen 1</a>
   <a class="btn-card" href="./lesson.html?set=kerem-1">Kerem 1</a>
   <a class="btn-card" href="./lesson.html?set=ecrin-1">Ecrin 1</a>
   <a class="btn-card" href="./lesson.html?set=cetin-1">Çetin 1</a>
   <a class="btn-card" href="./lesson.html?set=aras-1">Aras 1</a>
   <a class="btn-card" href="./lesson.html?set=aras-2">Aras 2</a>
   <a class="btn-card" href="./lesson.html?set=tuana-2">Tuana 2</a>
   <a class="btn-card" href="../mathe-gk/index.html">Tuana 1</a>
   <a class="btn-card" href="./lesson.html?set=cinar-1">Çınar 1</a>
   <a class="btn-card" href="./lesson.html?set=uebungsblatt-5">Übungsblatt 5</a>
  </section>
 </div>
</main>
<div class="version">v1.40.1 · Ctrl+V ile çözüm alanına resim ekleme</div>
<script src="./zip-import.js?v=1.20.0"></script>
<script>
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const dictionary={
  tr:{label:'Dil',grade:'7. sınıf',open:'Çalışmayı aç',upload:'Yükle',
      help:'Bir öğrenci düğmesine bas. Çalışması açılır.',
      loading:'ZIP paketi açılıyor…',error:'Yüklenemedi: ',done:'Çalışma açılıyor…'},
  de:{label:'Sprache',grade:'7. Klasse',open:'Übungen öffnen',upload:'Hochladen',
      help:'Klicke auf einen Namen. Die Übungen öffnen sich.',
      loading:'ZIP-Paket wird geöffnet…',error:'Fehler: ',done:'Übungen werden geöffnet…'},
  en:{label:'Language',grade:'Grade 7',open:'Open exercises',upload:'Upload',
      help:'Click a student name to open the exercises.',
      loading:'Opening ZIP package…',error:'Could not upload: ',done:'Opening exercises…'}
 };
 const select=$('language'),menu=$('grade7Menu'),toggle=$('grade7Toggle');
 const upload=$('grade7Upload'),fileInput=$('grade7File'),start=$('grade7Start');
 const status=$('grade7Status'),help=$('help'),helpText=$('helpText');
 const t=()=>dictionary[select.value]||dictionary.tr;
 function language(){
  document.documentElement.lang=select.value;
  $('languageLabel').textContent=t().label;
  toggle.textContent=t().grade;
  start.textContent=t().open;
  upload.textContent=t().upload;
  helpText.textContent=t().help;
 }
 try{
  const previous=localStorage.getItem('check-liste:hub-language');
  if(dictionary[previous])select.value=previous;
 }catch(_){}
 language();
 select.addEventListener('change',()=>{
  language();
  try{localStorage.setItem('check-liste:hub-language',select.value)}catch(_){}
 });
 help.addEventListener('click',()=>{
  helpText.hidden=!helpText.hidden;
  help.setAttribute('aria-expanded',String(!helpText.hidden));
 });
 function showMenu(show){
  menu.hidden=!show;
  toggle.setAttribute('aria-expanded',String(show));
 }
 toggle.addEventListener('click',()=>showMenu(menu.hidden));
 document.addEventListener('click',e=>{
  if(!$('grade7Choice').contains(e.target))showMenu(false);
 });
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!menu.hidden){showMenu(false);toggle.focus()}
 });
 async function updateGrade7(){
  try{
   start.hidden=!(window.CheckListeZipImport&&await window.CheckListeZipImport.hasStudy());
  }catch(_){start.hidden=true}
 }
 void updateGrade7();
 upload.addEventListener('click',()=>fileInput.click());
 fileInput.addEventListener('change',async()=>{
  const file=fileInput.files&&fileInput.files[0];
  if(!file)return;
  upload.disabled=true;status.textContent=t().loading;
  try{
   if(!window.CheckListeZipImport)throw Error('ZIP import module unavailable');
   const result=await window.CheckListeZipImport.importFile(file,msg=>{status.textContent=msg});
   if(result.fullZip){
    const url=URL.createObjectURL(result.fullZip);
    const link=document.createElement('a');
    link.href=url;link.download='7_sinif_Tam_Calisma_Paketi_v1.21.0.zip';
    link.hidden=true;document.body.appendChild(link);link.click();link.remove();
    status.textContent=t().done;
    setTimeout(()=>{URL.revokeObjectURL(url);location.assign('./lesson.html?set=lambacher-7')},1800);
   }else{
    location.assign('./lesson.html?set=lambacher-7');
   }
  }catch(error){
   status.textContent=t().error+String(error.message||error);
  }finally{
   upload.disabled=false;fileInput.value='';
   void updateGrade7();
  }
 });
 // Backward compatibility for old bookmarked Çetin question anchors.
 if(/^#\d+[-_]/.test(location.hash)){
  location.replace('./lesson.html?set=cetin-1'+(location.search?'&'+location.search.slice(1):'')+location.hash);
 }
})();
</script>
<script src="/projeler/analytics.js?v=20261114-auto"></script>
</body>
</html>
