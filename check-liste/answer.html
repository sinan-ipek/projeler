<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuana 2 · Çözüm</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous">
<meta name="description" content="Tuana 2 için açıklamalı matematik çözümleri ve operatör anlamları">
<style>
:root{--bg:#f3f7f2;--ink:#253a2c;--green:#356c4c;--line:#dbe5dc;--muted:#687b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:56px}
.top{display:flex;align-items:center;gap:10px;padding:14px clamp(16px,4vw,34px);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.home{height:38px;width:38px;background:#ffdc28;border:1px solid #d3b21a;border-radius:3px;display:grid;place-items:center;flex:none;color:#111}
.home svg{width:21px;height:21px;fill:currentColor}
.top select{margin-left:auto;min-width:100px;border:1px solid #cddbd0;border-radius:8px;padding:8px;font:inherit;background:white;color:var(--ink)}
.top button{height:38px;width:38px;background:white;border:1px solid var(--line);border-radius:7px;font-size:20px;font-weight:bold;cursor:pointer}
.help{padding:10px 20px;background:#edf4ed;color:#42654b;border-bottom:1px solid var(--line)}
.help[hidden]{display:none}
.container{max-width:880px;margin:28px auto;padding:0 20px}
.eyebrow{color:var(--green);font-size:14px;letter-spacing:.1em;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(28px,5vw,39px);margin:8px 0 13px;line-height:1.2}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 7px 25px #23412b0c;border-radius:16px;padding:clamp(17px,4vw,30px);margin:18px 0}
h2{font-size:19px;margin:0 0 12px;line-height:1.4}
.statement{white-space:pre-wrap;line-height:1.8;font-size:15px}
.section-tag{font-size:14px;color:#66816e;text-transform:uppercase;letter-spacing:.08em;font-weight:750;margin:14px 0 5px}
.calc{font-size:14px;color:#6c6544;padding:8px 12px;border-radius:7px;background:#f6f5ec;margin:10px 0}
figure{margin:16px auto;max-width:650px}
figure img{display:block;max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:9px}
.steps{counter-reset:step;list-style:none;margin:0;padding:0}
.steps li{position:relative;margin:0 0 11px;padding:13px 12px 13px 53px;border:1px solid #e1e9e2;border-radius:9px;background:#fbfdfb;white-space:pre-wrap}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:12px;top:12px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#e3f2e5;color:#315c3a;font-size:14px;font-weight:800}
.conclusion{margin-top:18px;font-weight:750;border-left:4px solid #468054;background:#edf6ed;padding:12px 16px;white-space:pre-wrap}
.source-explanation{white-space:pre-wrap;padding:13px;background:#f6f8f5;border:1px solid #e3ebe4;border-radius:8px;line-height:1.7}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:15px}
.close{background:white;border:1px solid #9eb9a4;border-radius:9px;color:#315e3d;padding:9px 18px;font:inherit;cursor:pointer}
.version{position:fixed;left:10px;bottom:6px;z-index:3;font-size:10px;color:#9ba49d;pointer-events:none}
[hidden]{display:none!important}

.steps .katex,.source-explanation .katex,.conclusion .katex{font-size:1.1em}
.check-math-inline{display:inline;max-width:none;overflow:visible;vertical-align:baseline;white-space:normal;line-height:inherit}
.check-math-display{margin:12px 0;max-width:100%;overflow:visible;white-space:normal}

/* v1.31.0: inline equations flow with prose; no nested scrollbars or arrow buttons. */
.check-math-inline .katex,.check-math-display .katex{white-space:normal}
.check-math-inline .katex .base,.check-math-display .katex .base{white-space:nowrap}
@media(max-width:620px){
 .check-math-inline .katex,.check-math-display .katex{font-size:1em}
}
</style>
</head>
<body>
<nav class="top" aria-label="Sayfa araçları">
 <a class="home" href="./index.html" title="Dersler" aria-label="Dersler sayfasına dön"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 11h3v10h6v-7h2v7h6V11h3L12 2Z"/></svg></a>
 <select id="language" aria-label="Dil">
  <option value="tr">Türkçe</option>
  <option value="de">Almanca</option>
  <option value="en">İngilizce</option>
 </select>
 <button type="button" id="help" title="Help" aria-expanded="false">?</button>
</nav>
<div id="helpText" class="help" hidden>Bu sayfada çözüm adımları bulunur. Sırayla oku.</div>
<main class="container">
 <div class="eyebrow" id="subTitle">Tuana 2 · Açıklamalı çözüm</div>
 <h1 id="answerTitle">Çözüm yükleniyor…</h1>
 <p class="subtitle" id="answerStatus" role="status"></p>
 <section class="card" id="solutionCard" hidden aria-label="Açıklamalı çözüm">
  <h2 id="solutionTitle">Adım adım açıklamalı çözüm</h2>
  <div id="operatorInfo" class="source-explanation" hidden></div>
  <ol class="steps" id="steps"></ol>
  <div id="conclusion" class="conclusion" hidden></div>
 </section>
 <button class="close" id="close" type="button">Pencereyi kapat</button>
</main>
<div class="version">v1.38.9 · Home düğmesi dersler sayfasına döner</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
<script src="./math-render.js?v=1.31.0"></script>
<script src="./sets/tuana-2/data.js?v=1.38.5"></script>
<script src="./sets/tuana-2/solutions.js?v=1.29.0"></script>
<script>
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const labels={
  tr:{subtitle:'Tuana 2 · Açıklamalı çözüm',heading:'Adım adım açıklamalı çözüm',operator:'Türkçe karşılığı',example:'Kullanım örneği:',close:'Pencereyi kapat',help:'Bu sayfada çözüm adımları bulunur. Sırayla oku.',missing:'Bu soru için çözüm bulunamadı.'},
  de:{subtitle:'Tuana 2 · Erläuterte Lösung (Türkisch)',heading:'Schritt-für-Schritt-Lösung (Türkisch)',operator:'Bedeutung und Erklärung',example:'Beispiel (Türkisch):',close:'Fenster schließen',help:'Hier sehen Sie die Lösung. Lesen Sie die Schritte.',missing:'Keine Lösung für diese Aufgabe gefunden.'},
  en:{subtitle:'Tuana 2 · Worked solution (Turkish)',heading:'Step-by-step solution (Turkish)',operator:'Meaning and explanation',example:'Example (Turkish):',close:'Close window',help:'This page contains the solution steps.',missing:'No solution found for this question.'}
 };
 const p=new URLSearchParams(location.search),id=p.get('id')||'';
 const pack=window.CHECKLIST_PACK,book=window.TUANA2_SOLUTIONS;
 const index=pack&&Array.isArray(pack.questions)?pack.questions.findIndex(q=>q.id===id):-1;
 const question=index>=0?pack.questions[index]:null;
 function insertStep(text){
  const li=document.createElement('li');
  if(window.CheckMath)window.CheckMath.render(li,text);
  else li.textContent=text;
  $('steps').appendChild(li);
 }
 const opItems=pack?.questions.filter(q=>q.kind==='operator')||[];
 const operatorIndex=question?.kind==='operator'?opItems.findIndex(q=>q.id===question.id):-1;
 function applyLanguage(){
  const lang=labels[$('language').value]||labels.tr;
  $('subTitle').textContent=lang.subtitle;
  $('solutionTitle').textContent=question?.kind==='operator'?lang.operator:lang.heading;
  $('close').textContent=lang.close;$('helpText').textContent=lang.help;
  if(question?.kind==='operator'){
   // Yalnızca kısa Türkçe karşılık: işlem ve örnek yok.
   $('steps').replaceChildren();
   $('steps').hidden=true;
  }
  if(!question)$('answerStatus').textContent=lang.missing;
 }
 $('language').addEventListener('change',applyLanguage);
 $('help').addEventListener('click',()=>{
  $('helpText').hidden=!$('helpText').hidden;
  $('help').setAttribute('aria-expanded',String(!$('helpText').hidden));
 });
 $('close').addEventListener('click',()=>window.close());
 if(question&&book){
  document.title=question.number+' · Tuana 2 · Çözüm';
  $('answerTitle').textContent=question.number;
  if(question.kind==='operator'){
   $('operatorInfo').hidden=false;
   if(window.CheckMath)window.CheckMath.render($('operatorInfo'),question.explanation||'');
   else $('operatorInfo').textContent=question.explanation||'';
  }else{
   const entry=book.math[id];
   if(entry){
    $('solutionTitle').textContent=entry.title;
    entry.steps.forEach(insertStep);
    if(entry.conclusion){
     $('conclusion').hidden=false;
     if(window.CheckMath)window.CheckMath.render($('conclusion'),'Sonuç: '+entry.conclusion);
     else $('conclusion').textContent='Sonuç: '+entry.conclusion;
    }
   }else $('answerStatus').textContent='Bu soru için çözüm bulunamadı.';
  }
  $('solutionCard').hidden=false;
 }else{
  $('answerTitle').textContent='Soru bulunamadı';
  $('answerStatus').textContent='Bu soru için açıklama bulunamadı. Check Liste sayfasına geri dönün.';
 }
 applyLanguage();
})();
</script>
<script src="/projeler/analytics.js?v=20261114-auto"></script>
</body>
</html>
