:root{--green:#426751;--line:#e4e8e3}*{box-sizing:border-box}body{margin:0;color:#26352b;background:#f7f8f5;font:15px system-ui,-apple-system,sans-serif}.app{display:grid;grid-template-columns:205px minmax(300px,1fr) minmax(320px,48%);height:100dvh;gap:0}.left{background:#f1f4f0;border-right:1px solid var(--line);overflow:auto;padding:19px 12px}.left h2{margin:0 0 8px;font-size:20px}.small{color:#718079;font-size:12px}.progress{height:7px;border-radius:9px;background:#dae3d9;margin:13px 0}.progress>i{height:100%;display:block;background:#53926a;border-radius:9px} .shareSolutions{width:auto;flex:0 0 auto;margin:0;padding:9px 10px;border:1px solid #33684a;border-radius:10px;background:#426751;color:white;font-size:13px;font-weight:750;cursor:pointer;text-align:center}

#sharePdfFile{display:inline-block;width:auto;margin:0;padding:9px 10px;border:1px solid #cad8cb;border-radius:9px;background:white;color:#36583d;font-weight:700;cursor:pointer}
#sharePdfFile[hidden]{display:none}
#exportStatus{display:block;min-height:0;margin:0;padding:0 12px;color:#607968;font-size:12px;line-height:1.4}
.left select,.left input{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:white}.group{padding:14px 8px 5px;color:#7a837d;font-size:12px;font-weight:700}.item{width:100%;text-align:left;border:0;border-radius:7px;padding:10px 9px;background:transparent;cursor:pointer;color:#344a37}.item.active{background:#dcebe0;color:#214d32;font-weight:700}.item.done{color:#89938c;background:#e7e9e6;text-decoration:line-through}.main{overflow:auto;min-width:0;padding:23px}.card{max-width:900px;margin:auto;background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 3px 18px #2331}.title{color:var(--green);font-size:14px;font-weight:700}.card h1{font-size:28px;margin:9px 0 26px}.section{font-size:11px;letter-spacing:.13em;color:#7b8980;font-weight:800;text-transform:uppercase;margin:19px 0 8px}.statement{white-space:pre-wrap;line-height:1.65;font-size:17px}.turkish{color:#355145}.source{max-width:100%;cursor:zoom-in;transition:transform .2s;transform-origin:top left}.source.zoom{cursor:zoom-out;transform:scale(2)}.figcontainer{overflow:auto;max-height:380px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:25px}.navbtn,.tool,.clear{border:1px solid #d5dfd5;border-radius:9px;background:white;padding:10px 12px;cursor:pointer;font-weight:600}.navbtn.primary,.tool.on{background:var(--green);color:white}.doneLabel{display:flex;align-items:center;gap:7px}.doneLabel input{width:21px;height:21px;accent-color:var(--green)}.boardpanel{border-left:1px solid var(--line);background:white;display:flex;flex-direction:column;min-width:0}.boardbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 13px;border-bottom:1px solid var(--line)}.boardbar strong{margin-right:auto}.board-area{position:relative;flex:1;min-height:220px;cursor:default;overflow:hidden;touch-action:none}.board-area canvas{display:block;width:100%;height:100%;touch-action:none;cursor:inherit}.board-area.pen{cursor:default}.board-area.select{cursor:default}.board-area.eraser{cursor:cell}.board-area.pan{cursor:grabbing}@media(max-width:900px){.app{display:flex;flex-direction:column;height:auto;min-height:100dvh}.left{max-height:200px}.main{overflow:visible}.boardpanel{height:70vh;min-height:420px;border-top:1px solid var(--line)}.card{padding:20px}}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9cc1aa}.return-to-lists{display:inline-block;color:#476a54;text-decoration:none;font-size:12px;margin:0 0 9px 1px}.return-to-lists:hover{text-decoration:underline}
.utility-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px}.utility-home{display:grid;place-items:center;flex:0 0 33px;height:33px;border:1px solid #e4bd19;border-radius:3px;background:#ffdc28;color:#111}.utility-home svg{width:20px;height:20px;fill:currentColor}.utility-bar select{width:1px;min-width:0;flex:1;margin:0!important;padding:7px 3px!important;font-size:11px}.utility-help{flex:0 0 33px;height:33px;border:1px solid #d5dfd5;border-radius:6px;background:#fff;font-weight:800;cursor:pointer}.utility-helptext{font-size:12px;color:#526b5a;line-height:1.45;margin-bottom:12px;background:#fff;padding:9px;border:1px solid #dce5de;border-radius:7px}.version-note{position:fixed;bottom:6px;left:10px;color:#919993;font-size:10px;line-height:1.25;z-index:3;pointer-events:none}.left{padding-bottom:38px}

.calculator-note{margin:12px 0 10px;padding:10px 13px;border:1px solid #cbdcd1;background:#f4f8f3;border-radius:8px;color:#345c40;font-size:14px;font-weight:650}
.calculator-note[data-allowed="no"]{background:#fff6ee;border-color:#e4cdbb;color:#875232}
.quiz-panel{background:#fff;padding:18px;border-radius:12px;border:1px solid #ceded2;margin:14px 3px 18px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.quiz-panel[hidden],.calculator-note[hidden],.quiz-explanation[hidden],.quiz-notes[hidden]{display:none!important}
.quiz-head{font-size:16px;font-weight:750;color:#2f4a37}
.answer-inline{margin-top:22px;padding:0;background:transparent;border:0;box-shadow:none}
.answer-inline[hidden]{display:none!important}
.answer-action{display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:96px;padding:10px 20px;font:inherit;font-size:15px;font-weight:750;background:#426751;border:1px solid #31553d;border-radius:9px;color:#fff;cursor:pointer}
.answer-action:hover{background:#305b3f}
.answer-action:focus-visible{outline:3px solid #9dc9a2;outline-offset:2px}

.answer-action[hidden],.quiz-options[hidden],.quiz-feedback[hidden]{display:none!important}
.quiz-options{display:grid;grid-template-columns:1fr;gap:8px}
.quiz-option{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid #d8e4dc;background:#f9fbf9;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.45}
.quiz-option:hover{border-color:#83a88e;background:#f1f8f2}
.quiz-option:has(input:checked){border-color:#487c54;background:#e9f5eb}
.quiz-option input{margin-top:3px;accent-color:#3b764a;flex-shrink:0}
.quiz-feedback{font-size:14px;color:#626f64;min-height:19px}
.quiz-feedback.correct{color:#28703b;font-weight:700}
.quiz-feedback.incorrect{color:#a44238;font-weight:700}
.quiz-explanation{white-space:pre-wrap;background:#f2f6f2;border:1px solid #d9e5dd;padding:11px 12px;border-radius:8px;font-size:14px;line-height:1.5}
.quiz-notes{font-size:12px;color:#788177}
.quiz-done{display:inline-flex;gap:8px;align-items:center;font-weight:700;color:#344d3a;cursor:pointer}
.quiz-done input{accent-color:#42794d}
.quiz-done:has(input:disabled){color:#9aa7a0;cursor:not-allowed}
.doneLabel:has(input:disabled){opacity:.52;cursor:not-allowed}

/* v1.23.0: quiz anchored at bottom of the LEFT column; drawing board retains its full height. */
body.has-graded-quiz .app{grid-template-columns:minmax(270px,290px) minmax(300px,1fr) minmax(320px,44%)}
body.has-graded-quiz .left{display:flex;flex-direction:column;overflow:hidden;min-height:0;padding-bottom:24px}
body.has-graded-quiz .left #menu{flex:1 1 auto;min-height:45px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
body.has-graded-quiz .left #quizPanel{flex:0 1 auto;min-height:0;max-height:min(53dvh,540px);overflow-y:auto;overscroll-behavior:contain;margin:10px 0 0;padding:12px 10px;box-shadow:0 -4px 12px #28402e0c}
body.has-graded-quiz .left .quiz-head{font-size:14px}
body.has-graded-quiz .left .quiz-option{font-size:12px;line-height:1.35;padding:8px}
/* Sidebar-wide text input styling must not stretch option controls. */
body.has-graded-quiz .left #quizPanel input[type="radio"],
body.has-graded-quiz .left #quizPanel input[type="checkbox"]{
 width:16px;height:16px;min-width:16px;flex:0 0 16px;
 padding:0;margin:2px 0 0;border:0;accent-color:#42794d;
}
body.has-graded-quiz .left .quiz-feedback,body.has-graded-quiz .left .quiz-explanation{font-size:12px}
body.has-graded-quiz .boardpanel{overflow:hidden}
body.has-graded-quiz .board-area{flex:1;min-height:220px;height:auto}
@media(max-width:900px){
 body.has-graded-quiz .app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
 body.has-graded-quiz .left{height:min(76dvh,650px);max-height:none;min-height:350px;overflow:hidden}
 body.has-graded-quiz .left #menu{min-height:45px;max-height:160px}
 body.has-graded-quiz .left #quizPanel{max-height:min(42dvh,360px);flex:0 1 auto}
 body.has-graded-quiz .boardpanel{height:70vh;min-height:420px;overflow:hidden}
 body.has-graded-quiz .board-area{flex:1;min-height:250px}
}

/* v1.27.0 shared student controls: five pen colors + solid/dashed, readable labels */
.ink-colors,.ink-styles{display:flex;align-items:center;gap:5px;padding:4px 5px;border:1px solid #d8e3dc;border-radius:10px;background:#f8faf8}
.ink-swatch{width:27px;height:27px;flex:0 0 27px;border:2px solid white;border-radius:50%;background:var(--swatch);cursor:pointer;outline:1px solid #b7c5bc}
.ink-swatch.selected{outline:3px solid #263f2f;outline-offset:1px}
.ink-swatch:focus-visible,.ink-style:focus-visible{outline:3px solid #80b895;outline-offset:2px}
.ink-style{padding:6px 10px;min-height:29px;border:1px solid #d5dfd7;border-radius:7px;background:white;color:#293d30;font-size:14px;font-weight:650;cursor:pointer}
.ink-style.selected{background:#426751;color:white;border-color:#315a3e}
.ink-style[data-stroke-style="dashed"]{border-style:dashed}
.app .small,.app .group,.app .return-to-lists,.app .section,.app .quiz-feedback,.app .quiz-notes,.app #exportStatus,.app #privateImageStatus,.app #privateImagesHint{font-size:14px}
.app .version-note{font-size:10px}
.app .shareSolutions,.app .utility-bar select,.app .utility-helptext,.app .quiz-notes,.app .quiz-option,.app .quiz-feedback,.app .quiz-explanation{font-size:14px}
.app .section{font-size:14px}
body.has-graded-quiz .left .quiz-option,body.has-graded-quiz .left .quiz-feedback,body.has-graded-quiz .left .quiz-explanation{font-size:14px}
@media(max-width:1100px){.ink-swatch{width:25px;height:25px;flex-basis:25px}.boardbar{gap:6px}}

/* v1.29.0: KaTeX typesets authentic fraction bars, powers, roots and equations. */
.statement .katex,.statement .check-math-inline .katex{font-size:1.12em}
.check-math-inline{display:inline;max-width:none;overflow:visible;vertical-align:baseline;white-space:normal;line-height:inherit}
.check-math-display{margin:12px 0;max-width:100%;overflow:visible;white-space:normal}
.check-math-display .katex-display{margin:.5em 0}
.katex .katex-mathml{position:absolute}

/* v1.31.0: inline equations flow with prose; no nested scrollbars or arrow buttons. */
.check-math-inline .katex,.check-math-display .katex{white-space:normal}
.check-math-inline .katex .base,.check-math-display .katex .base{white-space:nowrap}
@media(max-width:620px){
 .check-math-inline .katex,.check-math-display .katex{font-size:1em}
}

/* v1.38.0 — Ortak minimal çerçeve: beyaz zemin ve havada duran soru kartları. */
:root{--check-shadow:0 10px 22px rgba(16,28,20,.12);--check-edge:1px solid rgba(24,41,29,.13);--check-h:42px}
body{background:#dedede}
.app{height:100dvh;gap:14px;padding:14px;grid-template-columns:minmax(212px,240px) minmax(320px,1fr) minmax(330px,46%)}
.left{border:0;border-radius:22px;background:#f2f2f3;padding:14px 12px 36px;box-shadow:0 2px 18px #0000000d}
.left h2{margin:6px 4px 10px;font-size:18px}
.return-to-lists,#setTitle{display:none!important}
.utility-bar{gap:7px;margin-bottom:12px}
.utility-home,.utility-help,.utility-bar select{height:var(--check-h);min-height:var(--check-h)}
.utility-home{flex:0 0 42px;border-radius:3px}
.utility-help{flex:0 0 42px;border-radius:10px}
.utility-bar select{width:1px;min-width:0;flex:1;border-radius:10px;padding:7px 8px!important;font-size:13px!important}
.left select,.left input[type="search"]{min-height:42px;border-radius:11px}
.group{padding:12px 4px 3px;font-size:12px}
.item{min-height:42px;border:var(--check-edge);border-radius:11px;background:#fff;padding:9px 11px;box-shadow:0 6px 15px #00000011}
.item:hover{background:#fff;box-shadow:var(--check-shadow)}
.item.active{background:#e2ece5;border-color:#aac5b0}
.item.done{background:#edf0ed}
.main{overflow:auto;min-width:0;padding:16px;background:#fff;border-radius:24px;box-shadow:0 2px 18px #00000010}
.card{display:flex;flex-direction:column;gap:15px;max-width:none;width:100%;min-height:100%;margin:0;border:0;border-radius:0;padding:0;background:transparent;box-shadow:none}
.question-id{align-self:flex-start;display:inline-flex;align-items:center;min-height:42px;padding:8px 16px;margin:0 0 2px;background:#f7f7f8;border:var(--check-edge);border-radius:11px;box-shadow:var(--check-shadow);color:#30483a;font-size:15px;font-weight:700;line-height:1.3}
#qtitle{display:none!important}
.question-language-card,.question-image-card{background:#fff;border:var(--check-edge);border-radius:17px;box-shadow:var(--check-shadow);padding:18px 20px;min-width:0}
.question-language-card{font-size:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:break-word}
.question-image-card{padding:12px}
#pictures[hidden]{display:none!important}
.figcontainer{display:flex;align-items:center;justify-content:center;overflow:visible;max-height:none;min-height:0}
#figure.source{display:block;width:auto;height:auto;max-width:100%;max-height:min(46vh,520px);margin:auto;object-fit:contain;cursor:zoom-in;transition:none;transform:none!important}
#figure.source[hidden]{display:none!important}
.actions{margin-top:auto;padding-top:12px}
.navbtn,.answer-action{min-height:var(--check-h);height:var(--check-h);padding:8px 14px;border-radius:11px}
.answer-inline{margin-top:4px}
.boardpanel{border:0;border-radius:24px;background:#fff;min-height:0;overflow:hidden;box-shadow:0 2px 18px #00000010}
.boardbar{gap:7px;padding:11px 12px;border-bottom:1px solid #e8ece8}
.boardbar .tool,.boardbar .clear,.boardbar .shareSolutions,.boardbar #sharePdfFile{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:var(--check-h);min-height:var(--check-h);padding:0 11px;border-radius:10px;font-size:13px;line-height:1.1}
.boardbar .ink-colors,.boardbar .ink-styles{min-height:var(--check-h);height:var(--check-h);border-radius:10px;padding:4px 6px;flex:0 0 auto}
.boardbar .ink-style{min-height:32px;height:32px;padding:4px 8px}
.board-area{margin:0;min-height:230px;border:0;border-radius:0;background:#fff;box-shadow:none;overflow:hidden}
#exportStatus:empty{display:none}
.version-note{z-index:5;color:#929992;background:#f2f2f3cc;border-radius:4px;padding:2px 5px}
.image-lightbox[hidden]{display:none!important}
.image-lightbox{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;padding:18px;background:#0e1614c9;cursor:zoom-out}
.image-lightbox img{display:block;width:auto;height:auto;max-width:min(95vw,1500px);max-height:93vh;object-fit:contain;background:#fff;padding:10px;border-radius:15px;box-shadow:0 22px 55px #0008;cursor:zoom-out}
body.has-graded-quiz .app{grid-template-columns:minmax(270px,290px) minmax(300px,1fr) minmax(330px,44%)}
@media(max-width:1050px){.app{grid-template-columns:minmax(190px,220px) minmax(260px,1fr) minmax(300px,42%);gap:10px;padding:10px}}
@media(max-width:900px){
 .app,body.has-graded-quiz .app{display:flex;flex-direction:column;height:auto;min-height:100dvh;gap:12px;padding:10px}
 .left{max-height:350px;min-height:180px}
 .main{overflow:visible;min-height:0}
 .card{min-height:0}
 .boardpanel,body.has-graded-quiz .boardpanel{height:70vh;min-height:420px}
 body.has-graded-quiz .left{max-height:none}
}
@media(max-width:550px){.question-language-card{padding:14px;font-size:16px}.main{padding:12px}.boardbar{padding:9px}.board-area{margin:10px}}


/* v1.38.1 — Dış panel çerçevelerini kaldır; en alt arka plan beyaz. */
html,body{background:#fff!important}
.app{background:#fff}
.left{background:#fff;border:0;border-radius:0;box-shadow:none}
.main{background:transparent;border:0;border-radius:0;box-shadow:none;padding:10px 12px 18px}
.boardpanel{background:#fff;border:0;border-radius:0;box-shadow:none}
@media(max-width:900px){
 .main{background:transparent;border:0;border-radius:0;box-shadow:none;padding:10px 12px 18px}
}

/* v1.38.2 — Çözümler, resim büyütme gibi üstte açılan yatay ve çok sütunlu kartta. */
.solution-overlay[hidden]{display:none!important}
.solution-overlay{position:fixed;inset:0;z-index:9100;display:flex;align-items:center;justify-content:center;background:#0e1614c9;padding:clamp(9px,2vw,24px)}
.solution-dialog{box-sizing:border-box;display:flex;flex-direction:column;min-width:0;width:min(94vw,475px);max-width:96vw;max-height:93dvh;padding:20px 23px 22px;border:1px solid #d7dfd8;border-radius:22px;background:#fff;color:#293d30;box-shadow:0 24px 70px #0007;overflow:hidden}
.solution-header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:38px;margin-bottom:13px}
.solution-header h2{margin:0;font-size:19px;line-height:1.25;font-weight:700;color:#304d3b}
.solution-close{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;border:1px solid #d7ded8;border-radius:10px;background:#fff;color:#304336;font:26px/1 system-ui,sans-serif;cursor:pointer}
.solution-close:hover{background:#f2f5f2}
.solution-close:focus-visible{outline:3px solid #8eb39a;outline-offset:2px}
.solution-columns{display:grid;grid-template-columns:repeat(var(--solution-cols,1),minmax(0,1fr));gap:0;min-width:0;min-height:0;max-height:var(--solution-height,75dvh);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.solution-column{min-width:0;display:flex;flex-direction:column;gap:10px;padding:2px 13px 2px 0;align-self:start}
.solution-column+.solution-column{border-left:1px solid #c5cdc6;padding-left:20px}
.solution-piece{min-width:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.62 system-ui,-apple-system,"Segoe UI",sans-serif;color:#2a4133}
.solution-piece .katex{font-size:1.05em}
.solution-piece .check-math-inline{white-space:normal}
.solution-piece.solution-conclusion{font-weight:700;color:#2f5f43}
@media(max-width:600px){
 .solution-dialog{width:calc(100vw - 18px)!important;max-width:calc(100vw - 18px);padding:14px 14px 16px;border-radius:17px}
 .solution-header{margin-bottom:9px}
 .solution-piece{font-size:15px;line-height:1.55}
 .solution-column{padding-right:5px}
}

/* v1.38.6 — Sol seçim sütunu yarıya; orta sütun sabit, fark çizim alanına. */

 .app{grid-template-columns:120px minmax(320px,1fr) minmax(330px,calc(46% + 120px))}

}

}

 .left .utility-home{grid-column:1;grid-row:1;width:42px;height:42px}
 .left .utility-help{grid-column:2;grid-row:1;width:42px;height:42px}
  .left .item{overflow-wrap:anywhere;hyphens:auto;font-size:13px;padding:9px 7px}
 .left .group{overflow-wrap:anywhere}
 .left h2{overflow-wrap:anywhere;font-size:16px}
 .left select,.left input[type="search"]{font-size:12px;padding-left:6px;padding-right:6px}
}
