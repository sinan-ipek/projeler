<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matematik Atölyesi</title><style>

</style></head><body><header><a class="home" href="../index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 2 11h3v10h6v-7h3v7h6V11h2z"/></svg></a><h1 id="title">Matematik Atölyesi</h1><select id="lang" aria-label="Dil"><option value="tr">Türkçe</option><option value="de">Deutsch</option><option value="en">English</option></select><button id="help" aria-label="Help">?</button></header><main><section class="card"><div class="controls"><input id="entry" value="3(2+4)+6/8" spellcheck="false" aria-label="İfade"><button class="primary" id="apply">Uygula</button><button id="undo" title="Geri al">↶</button><button id="reset" title="Sıfırla">↻</button></div><div class="modes"><button id="detailed" class="selected">Ayrıntılı çözüm</button><button id="fast">Hızlı çözüm</button><button id="sound">♪</button></div><div class="examples"><button data-example="12+3*4">12+3×4</button><button data-example="3*(2+4)+6/8">3(2+4)+6/8</button><button data-example="2/3+5/6">2/3+5/6</button><button data-example="(1/2)/(3/4)">İç içe kesir</button><button data-example="0.25+1/2">Ondalık</button></div><div class="help" id="helptext"></div></section><section class="card"><div class="stage" id="stage"><svg class="overlay" id="overlay"></svg><div class="equation" id="equation"></div><div class="workspace" id="workspace"></div></div><div class="notice" id="notice"></div></section><section class="card"><div class="history" id="history"></div></section></main><small class="version">v0.2.1 · Ayrık seçim, doğrulama, FLIP ve geri alma altyapısı</small><script>
"use strict";
(() => {
const $=id=>document.getElementById(id);
const translations={
tr:{title:"Matematik Atölyesi",apply:"Uygula",detailed:"Ayrıntılı çözüm",fast:"Hızlı çözüm",help:"Bir işlem yaz. Fareyi sayılara götür. Sarı vurgu görünce tıkla. İşlemi geri alabilirsin.",start:"İşlemin üzerine gel ve tıkla.",end:"Bu sürümde başka desteklenen dönüşüm yok.",invalid:"Bu ifade okunamadı veya tanımsız.",done:"Dönüşüm tamamlandı.",choose:"Seçilen işlem: "},
de:{title:"Mathematik-Werkstatt",apply:"Anwenden",detailed:"Ausführliche Lösung",fast:"Schnelle Lösung",help:"Gib eine Rechnung ein. Bewege die Maus über die Zahlen. Klicke auf die gelbe Markierung. Du kannst zurückgehen.",start:"Zeige auf eine Rechenoperation und klicke.",end:"Kein weiterer unterstützter Schritt.",invalid:"Dieser Ausdruck ist ungültig oder nicht definiert.",done:"Schritt abgeschlossen.",choose:"Ausgewählt: "},
en:{title:"Math Workshop",apply:"Apply",detailed:"Detailed solution",fast:"Quick solution",help:"Enter an expression. Move the pointer over the numbers. Click the yellow highlight. You can undo.",start:"Hover over an operation and click.",end:"No further supported transformation.",invalid:"Expression is invalid or undefined.",done:"Step completed.",choose:"Selected: "}
};
let lang="tr";try{lang=localStorage.getItem("si-math-lang")||"tr"}catch{}if(!translations[lang])lang="tr";
let root=null,initial=null,history=[],ops=[],active=null,mode="detailed",sound=false,busy=false,nid=0;
const phrase=k=>translations[lang][k];
const make=(type,fields={})=>({id:"node"+(++nid),type,...fields}),clone=x=>structuredClone(x);
const abs=x=>x<0n?-x:x;
function gcd(a,b){a=abs(a);b=abs(b);while(b){const r=a%b;a=b;b=r}return a||1n}
function frac(a,b=1n){a=BigInt(a);b=BigInt(b);if(!b)throw Error("Zero denominator");if(b<0n){a=-a;b=-b}const g=gcd(a,b);return {a:a/g,b:b/g}}
const add=(x,y)=>frac(x.a*y.b+y.a*x.b,x.b*y.b),neg=x=>frac(-x.a,x.b),sub=(x,y)=>add(x,neg(y)),mul=(x,y)=>frac(x.a*y.a,x.b*y.b),div=(x,y)=>frac(x.a*y.b,x.b*y.a),same=(x,y)=>x.a===y.a&&x.b===y.b;
function decimal(s){let p=s.split("."),after=p[1]||"";return frac(BigInt((p[0]||"0")+after),10n**BigInt(after.length))}
function tokenize(raw){let s=raw.replace(/,/g,".").replace(/[×·]/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"");if(s.length>450)throw Error("Input too long");let t=s.match(/(?:\d+(?:\.\d*)?|\.\d+)|[+\-*/()]/g)||[];if(t.join("")!==s||!t.length)throw Error("Unsupported syntax");return t}
function parse(src){let t=tokenize(src),i=0,depth=0;const next=()=>t[i],take=()=>t[i++];
function primary(){if(++depth>65)throw Error("Too deep");let r,z=next();
if(z==="+"){take();r=primary()}else if(z==="-"){take();r=make("neg",{child:primary()})}
else if(z==="("){take();let child=expression();if(take()!==")")throw Error("Missing )");r=make("group",{child})}
else if(/^(?:\d|\.)/.test(z||"")){take();r=make("num",{v:decimal(z),text:z})}else throw Error("Unexpected token");
depth--;return r}
function product(){let x=primary();while(true){let z=next();if(z==="*"||z==="/"){take();x=make(z==="*"?"mul":"div",{left:x,right:primary()})}
else if(z==="("||/^(?:\d|\.)/.test(z||"")){x=make("mul",{left:x,right:primary()})}
else break}return x}
function expression(){let x=product();while(next()==="+"||next()==="-"){let z=take();x=make(z==="+"?"add":"sub",{left:x,right:product()})}return x}
let r=expression();if(i!==t.length)throw Error("Trailing input");return r}
function value(n){if(n.type==="num")return n.v;if(n.type==="group")return value(n.child);
if(n.type==="neg"){let x=value(n.child);return x?neg(x):null}
if(!["add","sub","mul","div"].includes(n.type))return null;
let a=value(n.left),b=value(n.right);if(!a||!b)return null;
try{return n.type==="add"?add(a,b):n.type==="sub"?sub(a,b):n.type==="mul"?mul(a,b):div(a,b)}catch{return null}}
function walk(n,fn,path=[]){fn(n,path);if(n.child)walk(n.child,fn,path.concat("child"));if(n.left)walk(n.left,fn,path.concat("left"));if(n.right)walk(n.right,fn,path.concat("right"))}
function substitute(n,path,r){if(!path.length)return r;let c=clone(n),q=c;for(let k of path.slice(0,-1))q=q[k];q[path[path.length-1]]=r;return c}
const number=(v,text=null)=>make("num",{v,text});
function score(kind){return ({common:15,reduce:14,invert:13,distribute:12,combine:11,calc:8,decimal:7,ungroup:4,negative:5})[kind]||1}
function discover(tree){let result=[];const offer=(kind,path,targets,build,note)=>result.push({id:"op"+result.length,kind,path,targets,build,note:note||kind,score:score(kind)});
walk(tree,(n,path)=>{
if(n.type==="num"&&n.text?.includes(".")&&n.v.b!==1n)offer("decimal",path,[n.id],()=>number(n.v),"decimal → fraction");
if(n.type==="group"&&n.child.type==="num")offer("ungroup",path,[n.id],()=>clone(n.child),"parentheses");
if(n.type==="neg"&&n.child.type==="num")offer("negative",path,[n.id],()=>number(neg(n.child.v)),"negative");
if(["add","sub","mul","div"].includes(n.type)&&n.left.type==="num"&&n.right.type==="num"&&value(n))
offer("calc",path,[n.left.id,n.right.id],()=>number(value(n)),"calculate");
if(n.type==="div"&&n.left.type==="num"&&n.right.type==="num"&&n.left.v.b===1n&&n.right.v.b===1n&&n.right.v.a!==0n){
let a=n.left.v.a,b=n.right.v.a,g=gcd(a,b);
if(g>1n)offer("reduce",path,[n.left.id,n.right.id],()=>make("div",{left:number(frac(a/g)),right:number(frac(b/g))}),"cancel common factors");
}
if(n.type==="div"&&n.right.type==="div"&&value(n.right.left)?.a!==0n&&value(n.right.right)?.a!==0n){
offer("invert",path,[n.right.id],()=>make("mul",{left:clone(n.left),right:make("div",{left:clone(n.right.right),right:clone(n.right.left)})}),"invert second fraction");
}
if((n.type==="add"||n.type==="sub")&&n.left.type==="div"&&n.right.type==="div"){
let d1=value(n.left.right),d2=value(n.right.right);if(d1&&d2&&d1.b===1n&&d2.b===1n&&d1.a>0n&&d2.a>0n&&d1.a!==d2.a){
let d=abs(d1.a/gcd(d1.a,d2.a)*d2.a);
if(d<1000000000000000n)offer("common",path,[n.left.id,n.right.id],()=>make(n.type,{
left:make("div",{left:make("mul",{left:clone(n.left.left),right:number(frac(d/d1.a))}),right:number(frac(d))}),
right:make("div",{left:make("mul",{left:clone(n.right.left),right:number(frac(d/d2.a))}),right:number(frac(d))})}),"LCM "+String(d));
}}
if((n.type==="add"||n.type==="sub")&&n.left.type==="div"&&n.right.type==="div"&&
value(n.left.right)&&value(n.right.right)&&same(value(n.left.right),value(n.right.right))){
offer("combine",path,[n.left.id,n.right.id],()=>make("div",{
left:make(n.type,{left:clone(n.left.left),right:clone(n.right.left)}),right:clone(n.left.right)}),"combine numerators");
}
if(n.type==="mul"){for(let side of ["left","right"]){
let term=n[side],group=term.type==="group"?term.child:term;
if(group.type==="add"||group.type==="sub"){
let factor=n[side==="left"?"right":"left"];
offer("distribute",path,[factor.id,group.id],()=>make(group.type,{
left:make("mul",{left:clone(factor),right:clone(group.left)}),
right:make("mul",{left:clone(factor),right:clone(group.right)})}),"distribute");
}}}
});return result}
function span(className="",id=null){let e=document.createElement("span");e.className=className;if(id)e.dataset.nodeId=id;return e}
function render(n){let e=span("node",n.id);if(n.type==="num"){
let v=n.v;if(n.text){e.textContent=n.text.replace(".",lang==="en"?".":",");return e}
if(v.b===1n){e.textContent=String(v.a);return e}
let f=span("frac"),top=span("numerator"),bar=span("fractionbar"),bot=span("denominator");
top.textContent=String(v.a);bot.textContent=String(v.b);f.append(top,bar,bot);e.append(f);return e}
if(n.type==="group"){e.append("(",render(n.child),")");return e}
if(n.type==="neg"){e.append("−",render(n.child));return e}
if(n.type==="div"){let f=span("frac"),top=span("numerator"),bar=span("fractionbar"),bot=span("denominator");top.append(render(n.left));bot.append(render(n.right));f.append(top,bar,bot);e.append(f);return e}
let op=span("operator");op.textContent={add:"+",sub:"−",mul:"·"}[n.type]||"?";e.append(render(n.left),op,render(n.right));return e}
function label(n){if(n.type==="num")return n.text||String(n.v.a)+(n.v.b===1n?"":"/"+String(n.v.b));
if(n.type==="group")return "("+label(n.child)+")";if(n.type==="neg")return "−"+label(n.child);
return "("+label(n.left)+{add:"+",sub:"−",mul:"×",div:"÷"}[n.type]+label(n.right)+")"}
function getRects(op){return op.targets.map(id=>$("equation").querySelector('[data-node-id="'+id+'"]')).filter(Boolean).map(e=>e.getBoundingClientRect())}
function dRect(x,y,r){return Math.hypot(Math.max(r.left-x,0,x-r.right),Math.max(r.top-y,0,y-r.bottom))}
function seed(op,index){let rects=getRects(op);if(!rects.length)return null;const r=rects[0],s=rects[rects.length-1];let cx=(r.left+r.right+s.left+s.right)/4,cy=(r.top+r.bottom+s.top+s.bottom)/4;
// offset colocated seeds by operation type, preserving stable Voronoi ownership
let offset=({common:-18,reduce:15,invert:-9,distribute:-16,combine:16,calc:0,decimal:0,ungroup:8,negative:10})[op.kind]||0;
return {x:cx,y:cy+offset};
}
function choose(x,y){const area=$("equation").getBoundingClientRect();if(x<area.left-30||x>area.right+30||y<area.top-30||y>area.bottom+30)return null;
let best=null,d=Infinity;for(let i=0;i<ops.length;i++){let o=ops[i],s=seed(o,i);if(!s)continue;let ds=Math.hypot(x-s.x,y-s.y);if(ds<d-.001||Math.abs(ds-d)<.001&&o.score>(best?.score||0)){best=o;d=ds}}return best}
function highlight(op){$("equation").querySelectorAll(".hover").forEach(e=>e.classList.remove("hover"));$("overlay").replaceChildren();if(!op)return;
for(let id of op.targets)$("equation").querySelector('[data-node-id="'+id+'"]')?.classList.add("hover");
const r=getRects(op),s=$("stage").getBoundingClientRect();if(r.length>=2){
let x=(r[0].left+r[0].right)/2-s.left,y=r[0].top-s.top-10,X=(r[1].left+r[1].right)/2-s.left,Y=r[1].top-s.top-10;
const p=document.createElementNS("http://www.w3.org/2000/svg","path");
p.setAttribute("d","M "+x+" "+y+" Q "+((x+X)/2)+" "+(Math.min(y,Y)-Math.max(24,Math.abs(x-X)*.23))+" "+X+" "+Y);
p.setAttribute("fill","none");p.setAttribute("stroke",op.kind==="reduce"?"#d53e4f":"#e4a51c");p.setAttribute("stroke-width","3");p.setAttribute("stroke-linecap","round");$("overlay").append(p);
}}
function refresh(){if(!root)return;$("equation").replaceChildren(render(root));$("overlay").replaceChildren();ops=discover(root);active=null;$("notice").textContent=ops.length?phrase("start"):phrase("end");$("history").textContent=history.length?history.length+" × "+history.map(h=>h.name).slice(-5).join("  →  "):label(root)}
function beep(){if(!sound)return;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(390,c.currentTime);o.frequency.exponentialRampToValueAtTime(190,c.currentTime+.18);g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.start();o.stop(c.currentTime+.18);o.onended=()=>c.close()}catch{}}
function layoutSnapshot(){let m=new Map();$("equation").querySelectorAll("[data-node-id]").forEach(e=>m.set(e.dataset.nodeId,e.getBoundingClientRect()));return m}
function animateFLIP(old,duration){let actions=[];$("equation").querySelectorAll("[data-node-id]").forEach(e=>{let from=old.get(e.dataset.nodeId),to=e.getBoundingClientRect();let dx=from?from.left-to.left:0,dy=from?from.top-to.top:17;if(Math.abs(dx)<1&&Math.abs(dy)<1&&from)return;
let frames=[{transform:"translate("+dx+"px,"+dy+"px)",opacity:from?1:0},{transform:"translate(0,0)",opacity:1}];if(e.animate)actions.push(e.animate(frames,{duration,easing:"cubic-bezier(.22,.7,.18,1)",fill:"none"}))});
return Promise.all(actions.map(a=>a.finished.catch(()=>{})))}
async function execute(op){if(busy||!op)return;let next;try{
next=substitute(root,op.path,op.build());
let a=value(root),b=value(next);if(!a||!b||!same(a,b))throw Error("Mathematical equivalence failed");
}catch(e){$("notice").textContent="Transformation rejected: "+e.message;return}
busy=true;let before=clone(root),old=layoutSnapshot();active=null;highlight(null);
let target=render(next),workspace=$("workspace");workspace.replaceChildren(target);
if(mode==="detailed"){workspace.classList.add("visible");await new Promise(r=>setTimeout(r,270))}
root=next;history.push({tree:before,name:op.note});
$("equation").replaceChildren(render(root));beep();await animateFLIP(old,mode==="detailed"?670:400);
workspace.classList.remove("visible");await new Promise(r=>setTimeout(r,100));workspace.replaceChildren();refresh();busy=false;$("notice").textContent=phrase("done")}
function load(s){if(busy)return;try{let p=parse(s);if(!value(p))throw Error("Zero denominator");root=p;initial=clone(p);history=[];$("entry").value=s;refresh()}catch(e){$("notice").textContent=phrase("invalid")+" "+e.message}}
function locale(){document.documentElement.lang=lang;$("title").textContent=phrase("title");$("apply").textContent=phrase("apply");$("detailed").textContent=phrase("detailed");$("fast").textContent=phrase("fast");$("helptext").textContent=phrase("help");$("lang").value=lang;refresh()}
$("apply").onclick=()=>load($("entry").value);$("entry").onkeydown=e=>{if(e.key==="Enter")load(e.target.value)};
$("stage").onpointermove=e=>{if(busy)return;let op=choose(e.clientX,e.clientY);if(op!==active){active=op;highlight(op);$("notice").textContent=op?phrase("choose")+op.note:phrase("start")}};
$("stage").onpointerleave=()=>{if(!busy){active=null;highlight(null)}};
$("stage").onclick=e=>execute(choose(e.clientX,e.clientY));
$("undo").onclick=()=>{if(busy||!history.length)return;root=history.pop().tree;refresh()};
$("reset").onclick=()=>{if(busy||!initial)return;root=clone(initial);history=[];refresh()};
$("detailed").onclick=()=>{mode="detailed";$("detailed").classList.add("selected");$("fast").classList.remove("selected")};
$("fast").onclick=()=>{mode="fast";$("fast").classList.add("selected");$("detailed").classList.remove("selected")};
$("sound").onclick=()=>{sound=!sound;$("sound").classList.toggle("selected",sound)};
$("lang").onchange=e=>{lang=e.target.value;try{localStorage.setItem("si-math-lang",lang)}catch{}locale()};
$("help").onclick=()=>$("helptext").classList.toggle("visible");
document.querySelectorAll("[data-example]").forEach(b=>b.onclick=()=>load(b.dataset.example));
window.onerror=(message)=>{$("notice").textContent="Error: "+message};
load($("entry").value);locale();
})();
</script></body></html>
