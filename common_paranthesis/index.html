<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ortak Paranteze Alma</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--text:#182033;--muted:#7b8495;--border:#dfe4eb;
  --blue:#2864dc;--blue-light:#edf4ff;--red:#d93643;--red-light:#fff0f2;
  --green:#16885b;--green-light:#e9f8f1;--purple:#7352d4;--purple-light:#f2eeff;
  --shadow:0 18px 50px rgba(30,45,70,.08);
  --math-font:"Cambria Math","STIX Two Math","Times New Roman",serif;
  --math-size:clamp(28px,4vw,42px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent!important}
html,body{margin:0;min-height:100%}
body{padding:24px 14px 50px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button,.factor-group,.atom,.outside-factor,.drag-handle,.factor-drag-handle,.operator{-webkit-tap-highlight-color:transparent!important;touch-action:manipulation}
button{font:inherit}
.app{width:min(1160px,100%);margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.title h1{margin:0;font-size:clamp(23px,3vw,32px);letter-spacing:-.035em}
.title p{display:none}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{padding:10px 15px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--text);font-size:14px;font-weight:750;cursor:pointer;transition:.14s ease}
button:hover{background:#f7f9fc} button:active{transform:scale(.97)}
button.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 15px rgba(40,100,220,.22)}
#newBtn{background:#192235;color:#fff;border-color:#192235}
#tidyBtn{background:#16885b;color:#fff;border-color:#16885b}
#tidyBtn:disabled{background:#eef1f4;color:#9aa3b2;border-color:#dfe4eb;opacity:1;cursor:not-allowed;box-shadow:none;transform:none}
.home-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-weight:750;
  text-decoration:none;
  cursor:pointer;
  transition:.14s ease;
  -webkit-tap-highlight-color:transparent!important;
  touch-action:manipulation;
}
.home-btn:hover{background:#f7f9fc}
.home-btn:active{transform:scale(.97)}
.board{min-height:0;padding:10px 20px 18px;overflow:visible;background:var(--panel);border:1px solid var(--border);border-radius:23px;box-shadow:var(--shadow)}
.info-row{display:none}
.info-pill{padding:7px 11px;border-radius:999px;background:#f5f7fa;color:#687285;font-size:11px;font-weight:750}.info-pill strong{color:#394359}
.expression-area{min-height:220px;display:flex;justify-content:center;align-items:center;padding:24px 3px 22px;overflow:visible}
#expression{width:100%;display:flex;justify-content:center;align-items:center;overflow:visible}
.math-expression{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;overflow:visible;font-family:var(--math-font);font-size:var(--math-size);font-weight:400;font-style:normal;line-height:1;color:var(--text)}
.math-expression .terms,.math-expression .term-unit,.math-expression .term-body,.math-expression .factor-group-wrap,.math-expression .factor-group,.math-expression .atom,.math-expression .outside,.math-expression .outside-factor-wrap,.math-expression .outside-factor,.math-expression .operator{font-family:inherit;font-size:1em;font-weight:400;font-style:normal;line-height:1}
.math-expression sup{position:relative;top:-.58em;vertical-align:baseline;margin-left:.03em;font-family:inherit;font-size:.55em;font-weight:400;line-height:0}
.outside{position:relative;display:inline-flex;justify-content:center;align-items:center;flex-wrap:wrap;margin-right:.08em;color:var(--text)}
.outside.collapsed{padding:.12em .08em;border-radius:.18em;cursor:pointer}.outside.collapsed:hover{background:var(--purple-light)}
.outside-factor-wrap{position:relative;display:inline-flex;justify-content:center;align-items:center;padding:0;margin:0;overflow:visible}
.outside-factor{display:inline-flex;justify-content:center;align-items:center;min-width:.55em;height:1.2em;padding:0 .07em;border-radius:.16em;color:var(--text);cursor:pointer}.outside-factor:hover{background:var(--purple-light)}
.parenthesized{display:inline-flex;justify-content:center;align-items:center}.paren{display:inline-flex;justify-content:center;align-items:center;height:1.25em;margin:0 .05em;font-family:var(--math-font);font-size:1.43em;font-weight:300;line-height:1}
.terms{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;overflow:visible}.term-unit{position:relative;display:inline-flex;justify-content:center;align-items:center;overflow:visible;border-radius:.25em}.term-unit.dragging{opacity:.32}.term-body{position:relative;display:inline-flex;justify-content:center;align-items:center;padding:0;margin:0;overflow:visible}
.drag-handle{position:absolute;left:50%;top:-22px;transform:translateX(-50%);z-index:50;display:flex;justify-content:center;align-items:center;width:25px;height:16px;padding:0;border-radius:5px;font-family:Arial,sans-serif;font-size:11px;line-height:1;color:#b5bdc9;opacity:0;cursor:grab}.term-unit:hover>.term-body>.drag-handle{opacity:.9}.drag-handle:hover{background:#f0f3f7;color:#657089}
.operator{display:inline-flex;justify-content:center;align-items:center;align-self:center;flex:0 0 auto;height:1.2em;padding:0;margin:0;line-height:1;text-align:center;color:var(--text)}.operator.add-sub{width:.95em;margin:0 .05em}.operator.multiply{width:.42em;margin:0 .015em}
.operator.term-product-dot{cursor:pointer;border-radius:.15em;transition:.13s ease}.operator.term-product-dot:hover{background:var(--blue-light);color:var(--blue)}
.operator.like-term-operation{cursor:pointer;border-radius:.17em;transition:.14s ease}.operator.like-term-operation:hover{background:var(--green-light);color:var(--green)}.operator.like-term-operation:active{transform:scale(.88)}
.factor-group-wrap{position:relative;display:inline-flex;justify-content:center;align-items:center;padding:0;margin:0;overflow:visible;border-radius:.2em}.factor-group{position:relative;display:inline-flex;justify-content:center;align-items:center;height:1.2em;padding:0;margin:0;border-radius:.18em}.factor-group.collapsed{padding:0 .08em;cursor:pointer}.factor-group.collapsed:hover{background:var(--blue-light)}.factor-group.expanded{padding:0 .08em;background:#f7f9fc;box-shadow:inset 0 0 0 1px #e5e9ef}.factor-group.singleton{padding:0 .04em}
.factor-drag-handle{position:absolute;left:50%;top:-17px;transform:translateX(-50%);z-index:60;display:flex;justify-content:center;align-items:center;width:22px;height:14px;padding:0;margin:0;border-radius:5px;font-family:Arial,sans-serif;font-size:10px;line-height:1;color:#b9c0cb;opacity:0;cursor:grab}.factor-group-wrap:hover .factor-drag-handle,.outside-factor-wrap:hover .factor-drag-handle{opacity:.9}.factor-drag-handle:hover{background:#edf1f6;color:#56627a}
.atom{display:inline-flex;justify-content:center;align-items:center;min-width:.52em;height:1.2em;padding:0 .06em;margin:0;border-radius:.16em;color:var(--text);cursor:pointer}.atom:hover{background:var(--blue-light);color:var(--blue)}.atom.polynomial-factor{padding:0 .035em}.atom.ready-common{color:var(--red)}.atom.ready-common:hover{background:var(--red-light);color:var(--red)}
.instruction{display:none}#instructionMain{font-size:15px;font-weight:800}#instructionSub{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}
.success{display:none;justify-content:center;align-items:center;gap:9px;margin-top:17px;color:var(--green);font-size:17px;font-weight:850}.success.show{display:flex}.success-icon{width:30px;height:30px;display:flex;justify-content:center;align-items:center;border-radius:50%;background:#dcf5e8}
.flying-factor{position:fixed;z-index:10000;pointer-events:none;display:flex;justify-content:center;align-items:center;padding:0 .08em;border-radius:8px;background:#fff;color:var(--red);font-family:var(--math-font);font-size:var(--math-size);font-weight:400;line-height:1;will-change:transform,color}
@media(max-width:650px){:root{--math-size:27px}body{padding:8px 6px 35px}.board{padding:15px 8px 22px;border-radius:18px}.title h1{font-size:22px}.title p{font-size:11px}button,.home-btn{padding:9px 11px;font-size:13px}.expression-area{min-height:210px;padding:22px 0 18px}.drag-handle,.factor-drag-handle{opacity:.5}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title"><h1>Ortak Paranteze Alma</h1></div>
    <div class="controls">
      <a id="homeBtn" class="home-btn" href="../index.html" aria-label="Projeler ana sayfası">⌂ Home</a>
      <button id="simpleBtn" class="active" type="button">Basit</button>
      <button id="advancedBtn" type="button">Gelişmiş</button>
      <button id="newBtn" type="button">Yeni Örnek</button>
      <button id="tidyBtn" type="button" disabled>Toparla</button>
    </div>
  </div>
  <div class="board">
    <div class="expression-area"><div id="expression"></div></div>
    <div class="instruction"><div id="instructionMain"></div><div id="instructionSub"></div></div>
    <div id="success" class="success"><div class="success-icon">✓</div><div>İşlem tamamlandı.</div></div>
  </div>
</div>
<script>
"use strict";

const POLYNOMIAL_FACTORS=[
  {key:"x2_plus_1",html:"(x<sup>2</sup>+1)"},
  {key:"one_minus_2z",html:"(1−2z)"},
  {key:"x_plus_y",html:"(x+y)"},
  {key:"a_minus_b",html:"(a−b)"},
  {key:"m_plus_2n",html:"(m+2n)"},
  {key:"p2_minus_1",html:"(p<sup>2</sup>−1)"},
  {key:"a_plus_2",html:"(a+2)"},
  {key:"y_minus_3",html:"(y−3)"}
];

function uid(prefix="id"){return prefix+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36).slice(-5)}
function randomChoice(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
function primeFactors(n){n=Math.abs(Math.trunc(n));if(n<=1)return[];const r=[];let d=2;while(d*d<=n){while(n%d===0){r.push(d);n/=d}d++}if(n>1)r.push(n);return r}
function simplifyRadical(n){let outside=1,inside=n;for(let k=Math.floor(Math.sqrt(n));k>=2;k--){const s=k*k;if(n%s===0){outside=k;inside=n/s;break}}return{outside,inside}}
function makeNumberAtom(value){return{id:uid("atom"),type:"number",value:Number(value)}}
function makeVariableAtom(symbol){return{id:uid("atom"),type:"variable",symbol}}
function makeRadicalAtom(radicand){return{id:uid("atom"),type:"radical",radicand:Number(radicand)}}
function makePolynomialAtom(template){return{id:uid("atom"),type:"polynomial",key:template.key,html:template.html}}
function makeGroup(atoms){return{id:uid("group"),expanded:false,atoms}}
function makeNumberGroup(value){value=Number(value);if(value===0)return makeGroup([makeNumberAtom(0)]);let atoms=primeFactors(value).map(makeNumberAtom);if(!atoms.length)atoms=[makeNumberAtom(1)];return makeGroup(atoms)}
function makeVariableGroup(symbol,exponent=1){const atoms=[];for(let i=0;i<exponent;i++)atoms.push(makeVariableAtom(symbol));return makeGroup(atoms)}
function makeRadicalGroup(radicand){const s=simplifyRadical(radicand),atoms=[];if(s.outside>1)primeFactors(s.outside).forEach(v=>atoms.push(makeNumberAtom(v)));if(s.inside>1)atoms.push(makeRadicalAtom(s.inside));return makeGroup(atoms)}
function makePolynomialGroup(template){return makeGroup([makePolynomialAtom(template)])}

class CommonFactorEngine{
  constructor(){
    this.mode="simple";this.terms=[];this.outsideAtoms=[];this.outsideCollapsed=false;this.done=false;this.firstSimpleExample=true;this.animationDuration=330;this.changedGroupIds=new Set();
    this.draggedTermId=null;this.draggedGroupId=null;this.draggedGroupTermId=null;this.draggedOutsideId=null;
    this.dom={expression:document.getElementById("expression"),simpleBtn:document.getElementById("simpleBtn"),advancedBtn:document.getElementById("advancedBtn"),newBtn:document.getElementById("newBtn"),tidyBtn:document.getElementById("tidyBtn"),instructionMain:document.getElementById("instructionMain"),instructionSub:document.getElementById("instructionSub"),success:document.getElementById("success")};
    this.bindControls();this.newProblem();
  }

  bindControls(){
    this.dom.simpleBtn.addEventListener("click",()=>{if(this.mode==="simple")return;this.mode="simple";this.dom.simpleBtn.classList.add("active");this.dom.advancedBtn.classList.remove("active");this.newProblem()});
    this.dom.advancedBtn.addEventListener("click",()=>{if(this.mode==="advanced")return;this.mode="advanced";this.dom.advancedBtn.classList.add("active");this.dom.simpleBtn.classList.remove("active");this.newProblem()});
    this.dom.newBtn.addEventListener("click",()=>this.newProblem());
    this.dom.tidyBtn.addEventListener("click",()=>this.tidyAndFinalize());
  }

  newProblem(){
    this.outsideAtoms=[];this.outsideCollapsed=false;this.done=false;this.changedGroupIds.clear();
    if(this.mode==="simple"){
      if(this.firstSimpleExample){this.terms=this.createFixedExample();this.firstSimpleExample=false}else this.terms=this.generateSimpleProblem();
    }else this.terms=this.generateAdvancedProblem();
    this.updateDoneState();this.render();
  }

  makeTerm(sign,groups,id=null){return{id:id||uid("term"),sign:sign<0?-1:1,groups,explicitProduct:false}}
  createFixedExample(){return[
    this.makeTerm(1,[makeNumberGroup(12),makeVariableGroup("x",2),makeVariableGroup("y",1)]),
    this.makeTerm(-1,[makeNumberGroup(16),makeVariableGroup("x",1),makeVariableGroup("y",2)]),
    this.makeTerm(1,[makeNumberGroup(8),makeVariableGroup("x",1),makeVariableGroup("y",1)])
  ]}

  generateSimpleProblem(){
    const c=randomChoice([2,3,4,5,6]), residuals=randomChoice([[2,3,5],[2,5,7],[3,4,5],[3,5,7],[4,5,7],[2,3,7]]), symbols=["x","y","a","b","m","n"], commonVar=randomChoice(symbols), commonExp=randomChoice([1,1,1,2]), extras=shuffle([0,randomChoice([0,1,2]),randomChoice([0,1])]);
    return [0,1,2].map(i=>{
      const groups=[makeNumberGroup(c*residuals[i]),makeVariableGroup(commonVar,commonExp+extras[i])];
      if(Math.random()<.55)groups.push(makeVariableGroup(["p","q","z"][i],randomChoice([1,1,2])));
      return this.makeTerm(i===0?1:(Math.random()<.5?-1:1),groups);
    });
  }

  generateAdvancedProblem(){
    const symbols=["x","y","a","b","m","n","p"], commonVar=randomChoice(symbols), commonExp=randomChoice([1,1,2,2,3]), c=randomChoice([2,3,4,6]), residuals=randomChoice([[2,3,5],[3,4,5],[2,5,7],[3,5,7]]), extras=shuffle([0,randomChoice([0,1,2]),randomChoice([0,1])]), commonPoly=randomChoice(POLYNOMIAL_FACTORS), polyCommon=Math.random()<.72, others=shuffle(POLYNOMIAL_FACTORS.filter(p=>p.key!==commonPoly.key)), useRad=Math.random()<.55, rad=randomChoice([2,3,5,7]);
    return [0,1,2].map(i=>{
      const groups=[makeNumberGroup(c*residuals[i]),makeVariableGroup(commonVar,commonExp+extras[i])];
      if(useRad)groups.push(makeRadicalGroup(rad));
      groups.push(makePolynomialGroup(polyCommon?commonPoly:others[i]));
      if(Math.random()<.35){const p=symbols.filter(s=>s!==commonVar);groups.push(makeVariableGroup(randomChoice(p),randomChoice([1,2])))}
      return this.makeTerm(i===0?1:(Math.random()<.5?-1:1),groups);
    });
  }

  atomKey(atom){
    if(atom.type==="number")return "number:"+atom.value;
    if(atom.type==="variable")return "variable:"+atom.symbol;
    if(atom.type==="radical")return "radical:"+atom.radicand;
    if(atom.type==="polynomial")return "polynomial:"+atom.key;
    return atom.id;
  }

  /*
    Kritik düzeltme: görünüş ile state her işlemden sonra senkronlanır.
    Görünürde açık olmayan hiçbir şey tamamlanmayı engelleyemez.
  */
  normalizeVisualState(){
    for(const term of this.terms){
      for(const group of term.groups){
        if(group.atoms.length<=1)group.expanded=false;
      }
      if(term.groups.length<=1)term.explicitProduct=false;
    }
    if(this.outsideAtoms.length<=1)this.outsideCollapsed=true;
  }

  getTermAtomCounts(term){
    const counts=new Map();
    for(const group of term.groups)for(const atom of group.atoms){
      const key=this.atomKey(atom);
      if(key==="number:1")continue;
      counts.set(key,(counts.get(key)||0)+1);
    }
    return counts;
  }

  getCommonCounts(){
    if(this.terms.length<2)return new Map();
    const maps=this.terms.map(t=>this.getTermAtomCounts(t)), result=new Map();
    for(const [key,first] of maps[0]){
      let min=first,ok=true;
      for(let i=1;i<maps.length;i++){const count=maps[i].get(key)||0;if(count===0){ok=false;break}min=Math.min(min,count)}
      if(ok&&min>0)result.set(key,min);
    }
    return result;
  }
  hasCommonFactors(){return this.getCommonCounts().size>0}

  getVisibleAtomsForKey(term,key){
    const out=[];
    for(const group of term.groups){
      if(group.atoms.length>1&&!group.expanded)continue;
      for(const atom of group.atoms)if(this.atomKey(atom)===key)out.push({atom,group});
    }
    return out;
  }

  getReadyCommonMap(){
    const ready=new Map();
    for(const [key,count] of this.getCommonCounts()){
      if(this.terms.every(t=>this.getVisibleAtomsForKey(t,key).length>=count))ready.set(key,count);
    }
    return ready;
  }

  getReadyAtomIds(){
    const ids=new Set();
    for(const [key,count] of this.getReadyCommonMap()){
      for(const term of this.terms){
        const visible=this.getVisibleAtomsForKey(term,key);
        for(let i=0;i<count&&visible[i];i++)ids.add(visible[i].atom.id);
      }
    }
    return ids;
  }
  isAtomReady(id){return this.getReadyAtomIds().has(id)}

  hasExpandedGroups(){return this.terms.some(t=>t.groups.some(g=>g.atoms.length>1&&g.expanded))}

  /*
    DÜZELTME: explicitProduct tek başına yeterli değil.
    Nokta ancak 2+ grup olduğunda görünür. Dolayısıyla sadece gerçekten
    ekranda açık çarpım varsa true döner.
  */
  hasExplicitProducts(){return this.terms.some(t=>t.explicitProduct&&t.groups.length>1)}
  allInnerProductsClosed(){return !this.hasExpandedGroups()&&!this.hasExplicitProducts()}

  normalizeTerm(term){
    let coefficient=term.sign;const variables=new Map(),radicals=new Map(),polynomials=new Map(),polynomialHTML=new Map();
    for(const group of term.groups)for(const atom of group.atoms){
      if(atom.type==="number")coefficient*=atom.value;
      else if(atom.type==="variable")variables.set(atom.symbol,(variables.get(atom.symbol)||0)+1);
      else if(atom.type==="radical")radicals.set(atom.radicand,(radicals.get(atom.radicand)||0)+1);
      else if(atom.type==="polynomial"){polynomials.set(atom.key,(polynomials.get(atom.key)||0)+1);polynomialHTML.set(atom.key,atom.html)}
    }
    for(const [r,count] of [...radicals]){const pairs=Math.floor(count/2);if(pairs)coefficient*=Math.pow(r,pairs);const left=count%2;if(left)radicals.set(r,left);else radicals.delete(r)}
    const sig=[
      ...[...variables].sort((a,b)=>a[0].localeCompare(b[0])).map(([s,e])=>`v:${s}^${e}`),
      ...[...radicals].sort((a,b)=>Number(a[0])-Number(b[0])).map(([r,c])=>`r:${r}^${c}`),
      ...[...polynomials].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,c])=>`p:${k}^${c}`)
    ].join("|");
    return{coefficient,variables,radicals,polynomials,polynomialHTML,signature:sig};
  }

  areLikeTerms(a,b){return !!a&&!!b&&this.normalizeTerm(a).signature===this.normalizeTerm(b).signature}
  hasLikeTerms(){for(let i=0;i<this.terms.length;i++)for(let j=i+1;j<this.terms.length;j++)if(this.areLikeTerms(this.terms[i],this.terms[j]))return true;return false}
  hasAdjacentLikeTerms(){for(let i=1;i<this.terms.length;i++)if(this.areLikeTerms(this.terms[i-1],this.terms[i]))return true;return false}

  buildTermFromNormalized(n,coefficient,preserveId=null){
    if(coefficient===0)return this.makeTerm(1,[makeNumberGroup(0)],preserveId);
    const sign=coefficient<0?-1:1,abs=Math.abs(coefficient),groups=[],symbolic=n.variables.size||n.radicals.size||n.polynomials.size;
    if(abs!==1||!symbolic)groups.push(makeNumberGroup(abs));
    for(const [s,e] of [...n.variables].sort((a,b)=>a[0].localeCompare(b[0])))groups.push(makeVariableGroup(s,e));
    for(const [r,c] of [...n.radicals].sort((a,b)=>Number(a[0])-Number(b[0])))for(let i=0;i<c;i++)groups.push(makeGroup([makeRadicalAtom(r)]));
    for(const [k,c] of [...n.polynomials].sort((a,b)=>a[0].localeCompare(b[0]))){const html=n.polynomialHTML.get(k)||`(${k})`;for(let i=0;i<c;i++)groups.push(makePolynomialGroup({key:k,html}))}
    return this.makeTerm(sign,groups,preserveId);
  }

  combineAdjacentLikeTerms(leftId,rightId){
    if(this.hasCommonFactors())return;
    const li=this.terms.findIndex(t=>t.id===leftId),ri=this.terms.findIndex(t=>t.id===rightId);if(li<0||ri!==li+1)return;
    const left=this.terms[li],right=this.terms[ri];if(!this.areLikeTerms(left,right))return;
    const n=this.normalizeTerm(left),sum=n.coefficient+this.normalizeTerm(right).coefficient,old=this.capturePositions();
    if(sum===0){this.terms.splice(li,2);if(!this.terms.length)this.terms.push(this.makeTerm(1,[makeNumberGroup(0)],left.id))}
    else this.terms.splice(li,2,this.buildTermFromNormalized(n,sum,left.id));
    this.updateDoneState();this.render();this.runFlip(old);
  }

  openGroup(termId,groupId){
    if(this.done)return;const term=this.getTerm(termId);if(!term)return;const group=term.groups.find(g=>g.id===groupId);if(!group||group.atoms.length<=1)return;
    group.expanded=true;term.explicitProduct=term.groups.length>1;this.updateDoneState();this.renderWithFlip();
  }

  closeTermProduct(termId){
    const term=this.getTerm(termId);if(!term)return;for(const g of term.groups)g.expanded=false;term.explicitProduct=false;this.updateDoneState();this.renderWithFlip();
  }

  clickTermAtom(termId,groupId,atomId){
    if(this.done)return;const term=this.getTerm(termId);if(!term)return;const group=term.groups.find(g=>g.id===groupId);if(!group)return;const atom=group.atoms.find(a=>a.id===atomId);if(!atom)return;
    if(this.isAtomReady(atomId)){this.extractReadyFactor(termId,groupId,atomId);return}
    if(group.atoms.length>1&&group.expanded){group.expanded=false;this.updateDoneState();this.renderWithFlip();return}
    if(term.explicitProduct&&term.groups.length>1){this.closeTermProduct(termId);return}
    this.bump(`[data-atom-id="${atomId}"]`);
  }

  extractReadyFactor(sourceTermId,sourceGroupId,sourceAtomId){
    if(!this.isAtomReady(sourceAtomId))return;const sourceTerm=this.getTerm(sourceTermId);if(!sourceTerm)return;const sourceGroup=sourceTerm.groups.find(g=>g.id===sourceGroupId);if(!sourceGroup)return;const sourceAtom=sourceGroup.atoms.find(a=>a.id===sourceAtomId);if(!sourceAtom)return;
    const el=document.querySelector(`[data-atom-id="${sourceAtomId}"]`),sourceRect=el?el.getBoundingClientRect():null,key=this.atomKey(sourceAtom);
    for(const term of this.terms){this.removeOneVisibleFactor(term,key,term.id===sourceTermId?sourceAtomId:null);term.explicitProduct=term.groups.length>1}
    const outside=this.cloneAtom(sourceAtom);outside.id=uid("outside");this.outsideAtoms.push(outside);this.outsideCollapsed=this.outsideAtoms.length<=1;this.updateDoneState();this.renderWithFlip();
    if(sourceRect)requestAnimationFrame(()=>{const target=document.querySelector(`[data-outside-id="${outside.id}"]`);if(!target)return;const paren=document.querySelector(".parenthesized");this.flyFactorCurved(sourceRect,target.getBoundingClientRect(),paren?paren.getBoundingClientRect():null,this.atomHTML(outside))});
  }

  removeOneVisibleFactor(term,key,preferredId=null){
    let group=null,index=-1;
    if(preferredId){for(const g of term.groups){const i=g.atoms.findIndex(a=>a.id===preferredId);if(i>=0){group=g;index=i;break}}}
    if(!group){for(const g of term.groups){if(g.atoms.length>1&&!g.expanded)continue;const i=g.atoms.findIndex(a=>this.atomKey(a)===key);if(i>=0){group=g;index=i;break}}}
    if(!group||index<0)return false;
    group.atoms.splice(index,1);this.changedGroupIds.add(group.id);
    if(group.atoms.length===0){const gi=term.groups.findIndex(g=>g.id===group.id);if(gi>=0)term.groups.splice(gi,1)}
    else if(group.atoms.length===1)group.expanded=false;
    if(term.groups.length<=1)term.explicitProduct=false;
    return true;
  }

  clickOutsideFactor(){if(!this.outsideAtoms.length)return;this.outsideCollapsed=true;this.updateDoneState();this.renderWithFlip()}
  openOutsideProduct(){if(this.outsideAtoms.length<=1)return;this.outsideCollapsed=false;this.updateDoneState();this.renderWithFlip()}

  /*
    Toparla düğmesi yalnız SON AŞAMADA aktif olur.

    Son aşama:
    - dışarı alınacak ortak çarpan kalmamış
    - toplanabilecek benzer terim kalmamış
    - parantez önünde en az bir çarpan oluşmuş

    Açık çarpımların / açık grupların kalması normaldir;
    Toparla bunların hepsini tek seferde kapatır.
  */
  canTidyAndFinalize(){
    return (
      this.outsideAtoms.length>0
      &&
      !this.hasCommonFactors()
      &&
      !this.hasLikeTerms()
      &&
      !this.done
    );
  }

  tidyAndFinalize(){
    if(!this.canTidyAndFinalize())return;

    const old=this.capturePositions();

    for(const term of this.terms){
      for(const group of term.groups){
        group.expanded=false;
      }
      term.explicitProduct=false;
    }

    this.outsideCollapsed=true;

    this.updateDoneState();
    this.render();
    this.runFlip(old);
  }

  /*
    Tamamlanma artık GÖRÜNEN duruma göre karar verir.
    normalizeVisualState stale/ görünmez state'i temizler.
  */
  updateDoneState(){
    this.normalizeVisualState();
    this.done=!this.hasCommonFactors()&&!this.hasLikeTerms()&&this.allInnerProductsClosed()&&this.outsideAtoms.length>0&&this.outsideCollapsed;
  }

  getTerm(id){return this.terms.find(t=>t.id===id)}
  cloneAtom(atom){return JSON.parse(JSON.stringify(atom))}

  summarizeAtoms(atoms){
    if(!atoms.length)return"1";let number=1;const vars=new Map(),order=[],rad=new Map(),radOrder=[],polys=[];
    for(const atom of atoms){
      if(atom.type==="number")number*=atom.value;
      else if(atom.type==="variable"){if(!vars.has(atom.symbol)){vars.set(atom.symbol,0);order.push(atom.symbol)}vars.set(atom.symbol,vars.get(atom.symbol)+1)}
      else if(atom.type==="radical"){if(!rad.has(atom.radicand)){rad.set(atom.radicand,0);radOrder.push(atom.radicand)}rad.set(atom.radicand,rad.get(atom.radicand)+1)}
      else if(atom.type==="polynomial")polys.push(atom);
    }
    const leftover=[];for(const r of radOrder){const c=rad.get(r),pairs=Math.floor(c/2);if(pairs)number*=Math.pow(r,pairs);if(c%2)leftover.push(r)}
    let html="";const symbolic=order.length||leftover.length||polys.length;if(number!==1||!symbolic)html+=String(number);
    for(const s of order){const e=vars.get(s);html+=s;if(e>1)html+=`<sup>${e}</sup>`}
    for(const r of leftover)html+="√"+r;for(const p of polys)html+=p.html;return html;
  }

  atomHTML(atom){if(atom.type==="number")return String(atom.value);if(atom.type==="variable")return atom.symbol;if(atom.type==="radical")return "√"+atom.radicand;if(atom.type==="polynomial")return atom.html;return"?"}

  render(){
    this.normalizeVisualState();
    this.dom.expression.innerHTML="";const readyIds=this.getReadyAtomIds(),root=document.createElement("div");root.className="math-expression";
    if(this.outsideAtoms.length){
      if(this.outsideCollapsed){const outside=document.createElement("span");outside.className="outside collapsed";outside.dataset.animId="outside-product";outside.innerHTML=this.summarizeAtoms(this.outsideAtoms);root.appendChild(outside)}
      else{
        const outside=document.createElement("span");outside.className="outside";outside.dataset.animId="outside-product";
        this.outsideAtoms.forEach((atom,i)=>{if(i)outside.appendChild(this.createMultiply());const wrap=document.createElement("span");wrap.className="outside-factor-wrap";wrap.dataset.outsideId=atom.id;const handle=this.createFactorDragHandle();handle.dataset.dragOutside=atom.id;wrap.appendChild(handle);const f=document.createElement("span");f.className="outside-factor"+(atom.type==="polynomial"?" polynomial-factor":"");f.dataset.outsideId=atom.id;f.dataset.animId="outside_"+atom.id;f.innerHTML=this.atomHTML(atom);wrap.appendChild(f);outside.appendChild(wrap)});root.appendChild(outside);
      }
    }
    const terms=document.createElement("div");terms.className="terms";this.renderTerms(terms,readyIds);
    if(this.outsideAtoms.length){const p=document.createElement("span");p.className="parenthesized";const l=document.createElement("span"),r=document.createElement("span");l.className=r.className="paren";l.textContent="(";r.textContent=")";p.append(l,terms,r);root.appendChild(p)}else root.appendChild(terms);
    this.dom.expression.appendChild(root);this.renderInstruction();this.bindMathEvents();this.bindTermDrag();this.bindGroupDrag();this.bindOutsideDrag();this.animateChangedGroups();this.dom.tidyBtn.disabled=!this.canTidyAndFinalize();this.dom.success.classList.toggle("show",this.done);
  }

  renderTerms(container,readyIds){
    const commonExists=this.hasCommonFactors();
    this.terms.forEach((term,index)=>{
      const unit=document.createElement("span");unit.className="term-unit";unit.dataset.termId=term.id;unit.dataset.animId="term_"+term.id;
      if(index===0){if(term.sign<0)unit.appendChild(this.createAddSub("−"))}
      else{const prev=this.terms[index-1],can=!commonExists&&this.areLikeTerms(prev,term);unit.appendChild(this.createAddSub(term.sign<0?"−":"+",can?prev.id:null,can?term.id:null))}
      const body=document.createElement("span");body.className="term-body";const h=document.createElement("span");h.className="drag-handle";h.textContent="⠿";h.draggable=true;h.dataset.termDrag=term.id;body.appendChild(h);
      if(!term.groups.length){const one=document.createElement("span");one.className="factor-group singleton";one.textContent="1";body.appendChild(one)}
      else term.groups.forEach((group,gi)=>{if(gi>0&&term.explicitProduct)body.appendChild(this.createTermMultiply(term.id));body.appendChild(this.renderGroup(term,group,readyIds))});
      unit.appendChild(body);container.appendChild(unit);
    });
  }

  renderGroup(term,group,readyIds){
    const wrap=document.createElement("span");wrap.className="factor-group-wrap";wrap.dataset.termId=term.id;wrap.dataset.groupId=group.id;const handle=this.createFactorDragHandle();handle.dataset.dragGroup=group.id;handle.dataset.dragTerm=term.id;wrap.appendChild(handle);
    const box=document.createElement("span");box.dataset.groupId=group.id;box.dataset.termId=term.id;box.dataset.animId="group_"+group.id;
    if(group.atoms.length>1&&group.expanded){box.className="factor-group expanded";group.atoms.forEach((atom,i)=>{if(i)box.appendChild(this.createMultiply());box.appendChild(this.createTermAtom(term,group,atom,readyIds))})}
    else if(group.atoms.length===1){box.className="factor-group singleton";box.appendChild(this.createTermAtom(term,group,group.atoms[0],readyIds))}
    else{box.className="factor-group collapsed";box.innerHTML=this.summarizeAtoms(group.atoms)}
    wrap.appendChild(box);return wrap;
  }

  createTermAtom(term,group,atom,readyIds){const e=document.createElement("span");e.className="atom"+(atom.type==="polynomial"?" polynomial-factor":"")+(readyIds.has(atom.id)?" ready-common":"");e.dataset.atomId=atom.id;e.dataset.groupId=group.id;e.dataset.termId=term.id;e.dataset.animId="atom_"+atom.id;e.innerHTML=this.atomHTML(atom);return e}
  createAddSub(text,left=null,right=null){const e=document.createElement("span");e.className="operator add-sub";e.textContent=text;if(left&&right){e.classList.add("like-term-operation");e.dataset.combineLeft=left;e.dataset.combineRight=right}return e}
  createMultiply(){const e=document.createElement("span");e.className="operator multiply";e.textContent="·";return e}
  createTermMultiply(termId){const e=this.createMultiply();e.classList.add("term-product-dot");e.dataset.termProduct=termId;return e}
  createFactorDragHandle(){const h=document.createElement("span");h.className="factor-drag-handle";h.textContent="↔";h.draggable=true;h.addEventListener("click",e=>e.stopPropagation());h.addEventListener("mousedown",e=>e.stopPropagation());return h}

  renderInstruction(){
    const ready=this.getReadyCommonMap();let main="",sub="";
    if(this.done){main="Tamamlandı.";sub="Görünürde açık hiçbir çarpım, benzer terim veya ortak çarpan kalmadı."}
    else if(ready.size){main="Kırmızı çarpanlar dışarı çıkmaya hazır.";sub="Kırmızı ortak çarpana tıklarsan parantezin üstünden kavis çizerek dışarı çıkar."}
    else if(this.hasCommonFactors()){main="Ortak çarpanları aç.";sub="Ortak çarpanın gerekli bütün kopyaları açıldığında kırmızı olur."}
    else if(this.hasLikeTerms()){if(this.hasAdjacentLikeTerms()){main="Yan yana benzer terimler var.";sub="Aralarındaki + veya − işaretine tıklayarak gerekli işlemi yap."}else{main="Benzer terimler var.";sub="⠿ ile benzer terimleri yan yana getir; sonra aralarındaki işlem işaretine tıkla."}}
    else if(this.hasExpandedGroups()){main="Açılmış çarpan gruplarını kapat.";sub="2·3 gibi açık bir gruptaki çarpana tıklayarak grubu kapat."}
    else if(this.hasExplicitProducts()){main="Çarpma noktasıyla açık kalan terimleri kapat.";sub="Örneğin 3·x → 3x."}
    else if(this.outsideAtoms.length&&!this.outsideCollapsed){main="Parantezin önündeki çarpanları kapat.";sub="Dışarıdaki bir çarpana tıklayarak çarpımı toparla."}
    else{main="İşlem henüz tamamlanmadı.";sub="Açık kalan işlemleri kontrol et."}
    this.dom.instructionMain.textContent=main;this.dom.instructionSub.textContent=sub;
  }

  bindMathEvents(){
    document.querySelectorAll(".factor-group.collapsed[data-group-id]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();this.openGroup(e.dataset.termId,e.dataset.groupId)}));
    document.querySelectorAll(".atom[data-atom-id]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();this.clickTermAtom(e.dataset.termId,e.dataset.groupId,e.dataset.atomId)}));
    document.querySelectorAll("[data-term-product]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();this.closeTermProduct(e.dataset.termProduct)}));
    document.querySelectorAll("[data-combine-left][data-combine-right]").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();this.combineAdjacentLikeTerms(e.dataset.combineLeft,e.dataset.combineRight)}));
    document.querySelectorAll(".outside-factor").forEach(e=>e.addEventListener("click",ev=>{ev.stopPropagation();this.clickOutsideFactor()}));
    const closed=document.querySelector(".outside.collapsed");if(closed)closed.addEventListener("click",()=>this.openOutsideProduct());
  }

  bindTermDrag(){
    document.querySelectorAll("[data-term-drag]").forEach(h=>{h.addEventListener("dragstart",e=>{this.draggedTermId=h.dataset.termDrag;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",this.draggedTermId)});h.addEventListener("dragend",()=>this.draggedTermId=null)});
    document.querySelectorAll(".term-unit").forEach(target=>{target.addEventListener("dragover",e=>{if(this.draggedTermId)e.preventDefault()});target.addEventListener("drop",e=>{if(!this.draggedTermId)return;e.preventDefault();const id=target.dataset.termId;if(id===this.draggedTermId)return;const r=target.getBoundingClientRect();this.moveTerm(this.draggedTermId,id,e.clientX<r.left+r.width/2)})});
  }

  bindGroupDrag(){
    document.querySelectorAll("[data-drag-group]").forEach(h=>{h.addEventListener("dragstart",e=>{e.stopPropagation();this.draggedGroupId=h.dataset.dragGroup;this.draggedGroupTermId=h.dataset.dragTerm});h.addEventListener("dragend",()=>{this.draggedGroupId=null;this.draggedGroupTermId=null})});
    document.querySelectorAll(".factor-group-wrap").forEach(target=>{target.addEventListener("dragover",e=>{if(this.draggedGroupId&&target.dataset.termId===this.draggedGroupTermId)e.preventDefault()});target.addEventListener("drop",e=>{if(!this.draggedGroupId||target.dataset.termId!==this.draggedGroupTermId)return;e.preventDefault();e.stopPropagation();const id=target.dataset.groupId;if(id===this.draggedGroupId)return;const r=target.getBoundingClientRect();this.moveGroup(this.draggedGroupTermId,this.draggedGroupId,id,e.clientX<r.left+r.width/2)})});
  }

  bindOutsideDrag(){
    if(this.outsideCollapsed)return;
    document.querySelectorAll("[data-drag-outside]").forEach(h=>{h.addEventListener("dragstart",e=>{e.stopPropagation();this.draggedOutsideId=h.dataset.dragOutside});h.addEventListener("dragend",()=>this.draggedOutsideId=null)});
    document.querySelectorAll(".outside-factor-wrap").forEach(target=>{target.addEventListener("dragover",e=>{if(this.draggedOutsideId)e.preventDefault()});target.addEventListener("drop",e=>{if(!this.draggedOutsideId)return;e.preventDefault();e.stopPropagation();const id=target.dataset.outsideId;if(id===this.draggedOutsideId)return;const r=target.getBoundingClientRect();this.moveOutsideFactor(this.draggedOutsideId,id,e.clientX<r.left+r.width/2)})});
  }

  moveTerm(sourceId,targetId,before){const old=this.capturePositions(),si=this.terms.findIndex(t=>t.id===sourceId);if(si<0)return;const [m]=this.terms.splice(si,1),ti=this.terms.findIndex(t=>t.id===targetId),at=before?ti:ti+1;this.terms.splice(at,0,m);this.updateDoneState();this.render();this.runFlip(old)}
  moveGroup(termId,sourceId,targetId,before){const term=this.getTerm(termId);if(!term)return;const old=this.capturePositions(),si=term.groups.findIndex(g=>g.id===sourceId);if(si<0)return;const [m]=term.groups.splice(si,1),ti=term.groups.findIndex(g=>g.id===targetId),at=before?ti:ti+1;term.groups.splice(at,0,m);term.explicitProduct=term.groups.length>1;this.updateDoneState();this.render();this.runFlip(old)}
  moveOutsideFactor(sourceId,targetId,before){const old=this.capturePositions(),si=this.outsideAtoms.findIndex(a=>a.id===sourceId);if(si<0)return;const [m]=this.outsideAtoms.splice(si,1),ti=this.outsideAtoms.findIndex(a=>a.id===targetId),at=before?ti:ti+1;this.outsideAtoms.splice(at,0,m);this.outsideCollapsed=this.outsideAtoms.length<=1;this.updateDoneState();this.render();this.runFlip(old)}

  renderWithFlip(){const old=this.capturePositions();this.render();this.runFlip(old)}
  capturePositions(){const map=new Map();document.querySelectorAll("[data-anim-id]").forEach(e=>map.set(e.dataset.animId,e.getBoundingClientRect()));return map}
  runFlip(old){document.querySelectorAll("[data-anim-id]").forEach(e=>{const a=old.get(e.dataset.animId);if(!a)return;const b=e.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;if(Math.abs(dx)<.5&&Math.abs(dy)<.5)return;e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],{duration:this.animationDuration,easing:"cubic-bezier(.22,.82,.28,1)"})})}
  animateChangedGroups(){for(const id of this.changedGroupIds){const e=document.querySelector(`[data-group-id="${id}"]`);if(e)e.animate([{opacity:.42,transform:"scale(.88)"},{opacity:1,transform:"scale(1)"}],{duration:300,easing:"cubic-bezier(.2,.8,.25,1)"})}this.changedGroupIds.clear()}

  flyFactorCurved(from,to,paren,html){
    const flyer=document.createElement("div");flyer.className="flying-factor";flyer.innerHTML=html;document.body.appendChild(flyer);let fr=flyer.getBoundingClientRect();const sx=from.left+from.width/2,sy=from.top+from.height/2;flyer.style.left=(sx-fr.width/2)+"px";flyer.style.top=(sy-fr.height/2)+"px";const tx=to.left+to.width/2,ty=to.top+to.height/2,dx=tx-sx,dy=ty-sy;let obstacle=Math.min(from.top,to.top);if(paren)obstacle=Math.min(obstacle,paren.top);const apex=obstacle-Math.max(52,from.height*1.4),rel=apex-sy,a=2*dy-4*rel,b=4*rel-dy,frames=[],steps=16;for(let i=0;i<=steps;i++){const t=i/steps;frames.push({offset:t,transform:`translate(${dx*t}px,${a*t*t+b*t}px)`,color:t>.78?"#182033":"#d93643"})}const anim=flyer.animate(frames,{duration:520,easing:"linear",fill:"forwards"});anim.onfinish=()=>flyer.remove();
  }

  bump(selector){const e=document.querySelector(selector);if(!e)return;e.animate([{transform:"translateX(0)"},{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"translateX(-2px)"},{transform:"translateX(0)"}],{duration:220,easing:"ease-out"})}
}

const engine=new CommonFactorEngine();
</script>
