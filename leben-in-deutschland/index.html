<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">
<title>Leben in Deutschland</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--mut:#6b6b73;--line:#e3e3e8;--pill:#fff;--opt:#ececee;--ok:#1a8a1a;--bad:#e5251b;--mark:#ffff00;--marktx:#111;--acc:#0a63e8}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mut:#a0a0a8;--line:#38383a;--pill:#2c2c2e;--opt:#3a3a3c;--ok:#2fa02f;--bad:#e5362c;--mark:#8a7a00;--marktx:#fff;--acc:#4c9bff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:var(--pill);border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer}
button:active{opacity:.6}
button:disabled{opacity:.35}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.top .t{flex:1;text-align:center;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{background:var(--card);padding:16px;font-size:21px;font-weight:600;line-height:1.3;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.q.mark{background:var(--mark);color:var(--marktx)}
.qno{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px;letter-spacing:.03em}
.img{display:block;max-width:100%;margin:12px auto 0;border-radius:8px}
.opts{margin-top:18px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:20px;font-weight:600}
.opt:last-child{border-bottom:0}
.opt .r{flex:0 0 52px;height:42px;background:var(--opt);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff}
.opt .r i{width:22px;height:22px;border-radius:50%;border:2px solid #aaa;background:#ddd;display:block}
.opt.sel .r i{background:#555;border-color:#fff;box-shadow:0 0 0 2px #aaa inset}
.opt.ok .r{background:var(--ok)}.opt.bad .r{background:var(--bad)}
.opt.lock{cursor:default}
.tr{color:var(--mut);font-weight:400;font-size:13px;margin-top:4px;line-height:1.3}
.q .tr{font-size:14px;margin-top:8px}
#tr.on{color:var(--bad)}
.note{margin:14px 16px 0;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--mut);font-size:14px;line-height:1.4}
.note b{color:var(--tx)}
.sp{flex:1}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px;position:sticky;bottom:0;background:var(--bg)}
.nav button{flex:1;font-size:17px}
.nav .c{flex:1.1}
.home{padding:16px}
.home h1{font-size:28px;margin:8px 0 2px}
.home p{color:var(--mut);margin:0 0 16px;font-size:15px}
.stats{display:flex;gap:8px;margin-bottom:16px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.menu{display:grid;gap:10px}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;border-radius:14px;padding:16px;font-size:17px;background:var(--card)}
.menu small{color:var(--mut);font-weight:500;font-size:14px}
.sub{margin:18px 4px 8px;font-size:13px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.res{text-align:center;padding:30px 16px}
.res .big{font-size:64px;font-weight:800}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px}
.grid button{padding:10px 0;border-radius:10px;font-size:14px}
.grid .d-ok{background:var(--ok);color:#fff}.grid .d-bad{background:var(--bad);color:#fff}.grid .d-mk{outline:3px solid #e6c800}
.row{display:flex;gap:8px;padding:0 16px 16px}.row button{flex:1}
/* Standart GitHub proje kontrolleri */
#site-controls{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;width:100%;max-width:640px;margin:0 auto;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
#site-controls .si-home{width:45px;height:45px;flex:0 0 45px;border-radius:10px;padding:0;display:flex;align-items:center;justify-content:center;background:#ffdf49;color:#000;text-decoration:none;box-shadow:0 2px 6px #0002}
#site-controls .si-home svg{width:26px;height:26px;fill:#000}
#site-controls .si-language{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:600;margin-left:auto}
#site-controls select{font:600 13px system-ui,sans-serif;border:1px solid var(--line);border-radius:9px;padding:9px 6px;color:var(--tx);background:var(--pill);min-width:110px;max-width:130px}
#site-controls .si-help{width:42px;height:42px;flex:0 0 42px;border-radius:50%;padding:0;font-size:22px;font-weight:700;background:var(--pill);border:1px solid var(--line)}
.top{top:62px}
#site-help{width:min(340px,calc(100vw - 40px));padding:21px;border-radius:16px;border:1px solid var(--line);color:var(--tx);background:var(--card);box-shadow:0 15px 50px #0004}
#site-help::backdrop{background:#0006}
#site-help h2{font-size:21px;margin:0 0 12px}
#site-help p{font-size:15px;line-height:1.6}
#site-help button{margin-top:9px}
#site-version{position:fixed;z-index:10;left:8px;bottom:3px;color:var(--mut);background:var(--bg);padding:2px 5px;font:400 10px/1.2 system-ui,sans-serif;opacity:.78;pointer-events:none;border-radius:4px}
.nav{padding-bottom:25px}
@media(max-width:390px){#site-controls{gap:5px;padding:6px 7px}#site-controls select{min-width:98px;max-width:110px}#site-controls .si-language{gap:3px}#site-controls .si-home{width:40px;height:40px;flex-basis:40px}.top{top:54px}.top button{padding:10px}}




</style>
</head>

</div>

const DATA = {"sorular": [{"soru_no": 1, "konu": "Grundrechte", "soru_metni": "In Deutschland dürfen Menschen offen etwas gegen die Regierung sagen, weil ...", "soru_tr": "Almanya'da insanlar hükümet aleyhine açıkça bir şey söyleyebilir, çünkü ...", "siklar": [{"id": "A", "metin": "hier Religionsfreiheit gilt.", "tr": "burada din özgürlüğü geçerlidir."}, {"id": "B", "metin": "die Menschen Steuern zahlen.", "tr": "insanlar vergi öder."}, {"id": "C", "metin": "die Menschen das Wahlrecht haben.", "tr": "insanların seçme hakkı vardır."}, {"id": "D", "metin": "hier Meinungsfreiheit gilt.", "tr": "burada ifade özgürlüğü geçerlidir."}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 2, "konu": "Grundrechte", "soru_metni": "In Deutschland können Eltern bis zum 14. Lebensjahr ihres Kindes entscheiden, ob es in der Schule am ...", "soru_tr": "Almanya'da ebeveynler, çocuklarının 14 yaşına kadar okulda hangi derse katılıp katılmayacağına karar verebilir ...", "siklar": [{"id": "A", "metin": "Geschichtsunterricht teilnimmt.", "tr": "Tarih dersi"}, {"id": "B", "metin": "Religionsunterricht teilnimmt.", "tr": "Din dersi"}, {"id": "C", "metin": "Politikunterricht teilnimmt.", "tr": "Siyaset dersi"}, {"id": "D", "metin": "Sprachunterricht teilnimmt.", "tr": "Dil dersi"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 3, "konu": "Verfassungsprinzipien", "soru_metni": "Deutschland ist ein Rechtsstaat. Was ist damit gemeint?", "soru_tr": "Almanya bir hukuk devletidir. Bununla ne kastedilmektedir?", "siklar": [{"id": "A", "metin": "Alle Einwohner / Einwohnerinnen und der Staat müssen sich an die Gesetze halten.", "tr": "Tüm sakinler ve devlet yasalara uymak zorundadır."}, {"id": "B", "metin": "Der Staat muss sich nicht an die Gesetze halten.", "tr": "Devletin yasalara uyması gerekmez."}, {"id": "C", "metin": "Nur Deutsche müssen die Gesetze befolgen.", "tr": "Yalnızca Almanlar yasalara uymak zorundadır."}, {"id": "D", "metin": "Die Gerichte machen die Gesetze.", "tr": "Yasaları mahkemeler yapar."}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "B şıkkına resmî katalogdaki “nicht” eklendi. Doğru cevap A: Hem devlet hem de ülkede yaşayanlar yasalara uymalıdır.", "gorseller": []}, {"soru_no": 4, "konu": "Grundrechte", "soru_metni": "Welches Recht gehört zu den Grundrechten in Deutschland?", "soru_tr": "Aşağıdakilerden hangisi Almanya'da temel haklar arasındadır?", "siklar": [{"id": "A", "metin": "Waffenbesitz", "tr": "Silah bulundurma"}, {"id": "B", "metin": "Faustrecht", "tr": "Yumruk hukuku (kaba kuvvet)"}, {"id": "C", "metin": "Meinungsfreiheit", "tr": "İfade özgürlüğü"}, {"id": "D", "metin": "Selbstjustiz", "tr": "Kendi adaletini kendi sağlama"}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 5, "konu": "Wahlen und Beteiligung", "soru_metni": "Wahlen in Deutschland sind frei. Was bedeutet das?", "soru_tr": "Almanya'da seçimler serbesttir. Bu ne anlama gelir?", "siklar": [{"id": "A", "metin": "Man darf Geld annehmen, wenn man dafür einen bestimmten Kandidaten / eine bestimmte Kandidatin wählt.", "tr": "Belirli bir adaya oy vermek karşılığında para alınabilir."}, {"id": "B", "metin": "Nur Personen, die noch nie im Gefängnis waren, dürfen wählen.", "tr": "Yalnızca daha önce hiç hapse girmemiş kişiler oy kullanabilir."}, {"id": "C", "metin": "Der Wähler darf bei der Wahl weder beeinflusst noch zu einer bestimmten Stimmabgabe gezwungen werden und keine Nachteile durch die Wahl haben.", "tr": "Seçmen, seçim sırasında etkilenemez, belirli bir şekilde oy vermeye zorlanamaz ve seçim yüzünden dezavantaj yaşamaz."}, {"id": "D", "metin": "Alle wahlberechtigten Personen müssen wählen.", "tr": "Oy hakkı olan herkes oy kullanmak zorundadır."}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 6, "konu": "Verfassungsprinzipien", "soru_metni": "Wie heißt die deutsche Verfassung?", "soru_tr": "Alman anayasasının adı nedir?", "siklar": [{"id": "A", etin": "Meinungsfreiheit", "tr": "İfade özgürlüğü"}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 10, "konu": "Grundrechte", "soru_metni": "Was ist mit dem deutschen Grundgesetz vereinbar?", "soru_tr": "Alman Temel Yasası ile hangisi bağdaşır?", "siklar": [{"id": "A", "metin": "Die Prügelstrafe", "tr": "Sopa cezası"}, {"id": "B", "metin": "Die Folter", "tr": "İşkence"}, {"id": "C", "metin": "Die Todesstrafe", "tr": "Ölüm cezası"}, {"id": "D", "metin": "Die Geldstrafe", "tr": "Para cezası"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 11, "konu": "Verfassungsprinzipien", "soru_metni": "Wie wird die Verfassung der Bundesrepublik Deutschland genannt?", "soru_tr": "Almanya Federal Cumhuriyeti'nin anayasasına ne ad verilir?", "siklar": [{"id": "A", "metin": "Grundgesetz", "tr": "Temel Yasa (Grundgesetz)"}, {"id": "B", "metin": "Bundesverfassung", "tr": "Federal Anayasa"}, {"id": "C", "metin": "Gesetzbuch", "tr": "Kanun Kitabı"}, {"id": "D", "metin": "Verfassungsvertrag", "tr": "Anayasa Sözleşmesi"}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 12, "konu": "Grundrechte", "soru_metni": "Eine Partei im Deutschen Bundestag will die Pressefreiheit abschaffen. Ist das möglich?", "soru_tr": "Alman Federal Meclisi'ndeki (Bundestag) bir parti basın özgürlüğünü kaldırmak istiyor. Bu mümkün müdür?", "siklar": [{"id": "A", "metin": "Ja, wenn mehr als die Hälfte der Abgeordneten im Bundestag dafür sind.", "tr": "Evet, Bundestag'daki milletvekillerinin yarısından fazlası destekliyorsa."}, {"id": "B", "metin": "Ja, aber dazu müssen zwei Drittel der Abgeordneten im Bundestag dafür sein.", "tr": "Evet, ancak bunun için milletvekillerinin üçte ikisinin desteği gerekir."}, {"id": "C", "metin": "Nein, denn die Pressefreiheit ist ein Grundrecht. Sie kann nicht abgeschafft werden.", "tr": "Hayır, çünkü basın özgürlüğü bir temel haktır. Kaldırılamaz."}, {"id": "D", "metin": "Nein, denn nur der B ": "Die Schulen", "tr": "Okullar"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 250, "konu": "Bildung", "soru_metni": "In Deutschland hat man die besten Chancen auf einen gut bezahlten Arbeitsplatz, wenn man ...", "soru_tr": "Almanya'da iyi ücretli bir işe sahip olmak için en iyi şansa ... sahip olursunuz.", "siklar": [{"id": "A", "metin": "katholisch ist.", "tr": "Katolik olursanız"}, {"id": "B", "metin": "gut ausgebildet ist.", "tr": "iyi eğitim almışsanız"}, {"id": "C", "metin": "eine Frau ist.", "tr": "kadın olursanız"}, {"id": "D", "metin": "Mitglied einer Partei ist.", "tr": "bir partinin üyesi olursanız"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 251, "konu": "Recht und Alltag", "soru_metni": "Wenn man in Deutschland ein Kind schlägt, ...", "soru_tr": "Almanya'da bir çocuğa vurulursa ...", "siklar": [{"id": "A", "metin": "geht das niemanden etwas an.", "tr": "bu kimseyi ilgilendirmez."}, {"id": "B", "metin": "geht das nur die Familie etwas an.", "tr": "bu yalnızca aileyi ilgilendirir."}, {"id": "C", "metin": "kann man dafür nicht bestraft werden.", "tr": "bunun için cezalandırılamaz."}, {"id": "D", "metin": "kann man dafür bestraft werden.", "tr": "bunun için cezalandırılabilir."}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 252, "konu": "Recht und Alltag", "soru_metni": "In Deutschland ...", "soru_tr": "Almanya'da ...", "siklar": [{"id": "A", "metin": "darf man zur gleichen Zeit nur mit einem Partner / einer Partnerin verheiratet sein.", "tr": "aynı anda yalnızca bir eşle evli olunabilir."}, {"id": "B", "metin": "kann man mehrere Ehepartner/Ehepartnerinnen gleichzeitig haben.", "tr": "aynı anda birden fazla eşe sahip olunabilir."}, {"id": "C", "metin": "darf man nicht wieder heiraten, wenn man einmal verheiratet war.", "tr": "bir kez evlenmiş olan yeniden evlenemez."}, {"id": "D", "metin": "darf eine Frau nicht wieder heiraten, wenn ihr Mann gestorben ist.", "tr": "kocası ölen bir kadın yeniden evlenemez."}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 253, "konu": "Kommune", "soru_metni": "Wo müssen Sie sich anmelden, wenn Sie in Deutschland umziehen?", "soru_tr": "Almanya'da taşındığınızda nerede kaydolmanız gerekir?", "siklar": [{"id": "A", "metin": "Beim Einwohnermeldeamt", "tr": "Nüfus kayıt dairesinde (Einwohnermeldeamt)"}, {"id": "B", "metin": "Beim Standesamt", "tr": "Evlendirme dairesinde (Standesamt)"}, {"id": "C", "metin": "Beim Ordnungsamt", "tr": "Düzen dairesinde (Ordnungsamt)"}, {"id": "D", "metin": "Beim Gewerbeamt", "tr": "Ticaret dairesinde (Gewerbeamt)"}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 254, "konu": "Recht und Alltag", "soru_metni": "In Deutschland dürfen Ehepaare sich scheiden lassen. Meistens müssen sie dazu das „Trennungsjahr“ einhalten. Was bedeutet das?", "soru_tr": "Almanya'da evli çiftler boşanabilir. Çoğunlukla bunun için \"ayrılık yılı\"na (Trennungsjahr) uymaları gerekir. Bu ne demektir?", "siklar": [{"id": "A", "metin": "Der Scheidungsprozess dauert ein Jahr.", "tr": "Boşanma davası bir yıl sürer."}, {"id": "B", "metin": "Mann und Frau sind ein Jahr verheiratet, dann ist die Scheidung möglich.", "tr": "Karı koca bir yıl evli kalır, sonra boşanma mümkündür."}, {"id": "C", "metin": "Das Besuchsrecht für die Kinder gilt ein Jahr.", "tr": "Çocuklar için görüşme hakkı bir yıl geçerlidir."}, {"id": "D", "metin": "Mann und Frau führen mindestens ein Jahr getrennt ihr eigenes Leben. Danach ist die Scheidung möglich.", "tr": "Karı koca en az bir yıl ayrı yaşar. Ondan sonra boşanma mümkündür."}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 255, "konu": "Kommune", "soru_metni": "Bei Erziehungsproblemen können Eltern in Deutschland Hilfe erhalten vom ...", "soru_tr": "Almanya'da çocuk yetiştirme sorunlarında ebeveynler ... yardım alabilir.", "siklar": [{"id": "A", "metin": "Ordnungsamt.", "tr": "Düzen dairesinden"}, {"id": "B", "metin": "Schulamt.", "tr": "Okul dairesinden"}, {"id": "C", "metin": "Jugendamt.", "tr": "Gençlik dairesinden (Jugendamt)"}, {"id": "D", "metin": "Gesundheitsamt.", "tr": "Sağlık dairesinden"}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 256, "konu": "Kommune", "soru_metni": "Ein Ehepaar möchte in Deutschland ein Restaurant eröffnen. Was braucht es dazu unbedingt?", "soru_tr": "Bir çift Almanya'da bir restoran açmak istiyor. Bunun için kesinlikle neye ihtiyaçları vardır?", "siklar": [{"id": "A", "metin": "Eine Erlaubnis der Polizei", "tr": "Polisin izni"}, {"id": "B", "metin": "Eine Genehmigung einer Partei", "tr": "Bir partinin onayı"}, {"id": "C", "metin": "Eine Genehmigung des Einwohnermeldeamtes", "tr": "Nüfus kayıt dairesinin onayı"}, {"id": "D", "metin": "Eine Gaststättenerlaubnis von der zuständigen Behörde", "tr": "Yetkili makamdan alınmış bir işletme (lokanta) ruhsatı"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "Eski soru bankasında beklenen cevap D’dir. İzin/bildirim yükümlülüğü eyalete ve işletmenin niteliğine göre değişebilir; bu ifade tüm restoranlar için istisnasız güncel hukuk kuralı değildir.", "gorseller": []}, {"soru_no": 257, "konu": "Bildung", "soru_metni": "Eine erwachsene Frau möchte in Deutschland das Abitur nachholen. Das kann sie an ...", "soru_tr": "Yetişkin bir kadın Almanya'da Abitur'u (lise olgunluk diploması) sonradan almak istiyor. Bunu ... yapabilir.", "siklar": [{"id": "A", "metin": "einer Hochschule", "tr": "yüksekokulda"}, {"id": "B", "metin": "einem Abendgymnasium", "tr": "akşam lisesinde"}, {"id": "C", "metin": "einer Hauptschule", "tr": "Hauptschule'de"}, {"id": "D", "metin": "einer Privatuniversität", "tr": "özel üniversitede"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 258, "konu": "Recht und Alltag", "soru_metni": "Was darf das Jugendamt in Deutschland?", "soru_tr": "Almanya'da gençlik dairesi (Jugendamt) ne yapa , "soru_tr": "30 yaşındaki bir erkek Almanya'da Abitur'u sonradan almak istiyor. Bunu nerede yapabilir? ... nde", "siklar": [{"id": "A", "metin": "einer Hochschule", "tr": "yüksekokulda"}, {"id": "B", "metin": "einem Abendgymnasium", "tr": "akşam lisesinde"}, {"id": "C", "metin": "einer Hauptschule", "tr": "Hauptschule'de"}, {"id": "D", "metin": "einer Privatuniversität", "tr": "özel üniversitede"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 262, "konu": "Grundrechte", "soru_metni": "Was bedeutet in Deutschland der Grundsatz der Gleichbehandlung?", "soru_tr": "Almanya'da eşit muamele ilkesi ne anlama gelir?", "siklar": [{"id": "A", "metin": "Niemand darf z. B. wegen einer Behinderung benachteiligt werden.", "tr": "Hiç kimse örneğin engelliliği nedeniyle dezavantajlı duruma sokulamaz."}, {"id": "B", "metin": "Man darf andere Personen benachteiligen, wenn ausreichende persönliche Gründe hierfür vorliegen.", "tr": "Yeterli kişisel nedenler varsa başkalarına dezavantaj yaratılabilir."}, {"id": "C", "metin": "Niemand darf gegen Personen klagen, wenn sie benachteiligt wurden.", "tr": "Dezavantajlı duruma sokulan kişilere karşı kimse dava açamaz."}, {"id": "D", "metin": "Es ist für alle Gesetz, benachteiligten Gruppen jährlich Geld zu spenden.", "tr": "Dezavantajlı gruplara her yıl para bağışlamak herkes için yasadır."}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 263, "konu": "Recht und Alltag", "soru_metni": "In Deutschland sind Jugendliche ab 14 Jahren strafmündig. Das bedeutet: Jugendliche, die 14 Jahre und älter sind und gegen Strafgesetze verstoßen ...", "soru_tr": "Almanya'da gençler 14 yaşından itibaren cezai ehliyete sahiptir. Bu şu demektir: 14 yaşında ve daha büyük olup ceza yasalarını ihlal eden gençler ...", "siklar": [{"id": "A", "metin": "werden bestraft.", "tr": "cezalandırılır."}, {"id": "B", "metin": "werden wie Erwachsene behandelt.", "tr": "yetişkin gibi muamele görür."}, {"id": "C", "metin": "teilen die Strafe mit ihren Eltern.", "tr": "cezayı ebeveynleriyle paylaşır."}, {"id": "D", "metin": "werden nicht bestraft.", "tr": "cezalandırılmaz."}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 264, "konu": "Interkulturelles Zusammenleben", "soru_metni": "Zu welchem Fest tragen Menschen in Deutschland bunte Kostüme und Masken?", "soru_tr": "Almanya'da insanlar hangi bayramda renkli kostümler ve maskeler giyer?", "siklar": [{"id": "A", "metin": "An Rosenmontag", "tr": "Gül Pazartesi'sinde (Rosenmontag)"}, {"id": "B", "metin": "Am Maifeiertag", "tr": "1 Mayıs bayramında"}, {"id": "C", "metin": "Beim Oktoberfest", "tr": "Oktoberfest'te"}, {"id": "D", "metin": "An Pfingsten", "tr": "Pentekost'ta (Pfingsten)"}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 265, "konu": "Kommune", "soru_metni": "Wohin muss man in Deutschland zuerst gehen, wenn man heiraten möchte?", "soru_tr": "Almanya'da evlenmek istiyorsanız önce nereye gitmeniz gerekir?", "siklar": [{"id": "A", "metin": "Zum Einwohnermeldeamt", "tr": "Nüfus kayıt dairesine (Einwohnermeldeamt)"}, {"id": "B", "metin": "Zum Ordnungsamt", "tr": "Düzen dairesine (Ordnungsamt)"}, {"id": "C", "metin": "Zur Agentur für Arbeit", "tr": "İş ajansına"}, {"id": "D", "metin": "Zum Standesamt", "tr": "Evlendirme dairesine (Standesamt)"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 266, "konu": "Recht und Alltag", "soru_metni": "Wann beginnt die gesetzliche Nachtruhe in Deutschland?", "soru_tr": "Almanya'da yasal gece sessizliği ne zaman başlar?", "siklar": [{"id": "A", "metin": "Wenn die Sonne untergeht", "tr": "Güneş battığında"}, {"id": "B", "metin": "Wenn die Nachbarn schlafen gehen", "tr": "Komşular yatmaya gittiğinde"}, {"id": "C", "metin": "Um 0 Uhr, Mitternacht", "tr": "Saat 0'da, gece yarısı"}, {"id": "D", "metin": "Um 22 Uhr", "tr": "Saat 22'de"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "Soru bankasında beklenen genel saat 22.00’dir; ayrıntılar eyalet ve yerel kurallara göre değişebilir.", "gorseller": []}, {"soru_no": 267, "konu": "Recht und Alltag", "soru_metni": "Eine junge Frau in Deutschland, 22 Jahre alt, lebt mit ihrem Freund zusammen. Die Eltern der Frau finden das nicht gut, weil ihnen der Freund nicht gefällt. Was können die Eltern tun?", "soru_tr": "Almanya'da 22 yaşındaki genç bir kadın erkek arkadaşıyla birlikte yaşıyor. Kadının ebeveynleri bunu onaylamıyor, çünkü erkek arkadaşı hoşlarına gitmiyor. Ebeveynler ne yapabilir?", "siklar": [{"id": "A", "metin": "Sie müssen die Entscheidung der volljährigen Tochter respektieren.", "tr": "Reşit kızlarının kararına saygı göstermek zorundadır."}, {"id": "B", "metin": "Sie haben das Recht, die Tochter in die elterliche Wohnung zurückzuholen.", "tr": "Kızı ebeveyn evine geri getirme hakları vardır."}, {"id": "C", "metin": "Sie können zur Polizei gehen und die Tochter anzeigen.", "tr": "Polise gidip kızı ihbar edebilirler."}, {"id": "D", "metin": "Sie suchen einen anderen Mann für die Tochter.", "tr": "Kız için başka bir erkek ararlar."}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 268, "konu": "Recht und Alltag", "soru_metni": "Eine junge Frau will den Führerschein machen. Sie hat Angst vor der Prüfung, weil ihre Muttersprache nicht Deutsch ist. Was ist richtig?", "soru_tr": "Genç bir kadın ehliyet almak istiyor. Ana dili Almanca olmadığı için sınavdan korkuyor. Hangisi doğrudur?", "siklar": [{"id": "A", "metin": "Sie muss mindestens zehn Jahre in Deutschland leben, bevor sie den Führerschein machen kann.", "tr": "Ehliyet alabilmek için en az on yıl Almanya'da yaşamak zorundadır."}, {"id": "B", "metin": "Wenn sie kein Deutsch kann, darf sie keinen Führerschein haben.", "tr": "Almanca bilmiyorsa ehliyete sahip olamaz."}, {"id": "C", "metin": "Sie muss den Führerschein in dem Land machen, in dem man ihre Sprache spricht.", "tr": "Ehliyeti, dilinin konuşulduğu ülkede almak zorundadır."}, {"id": "D", "metin": "Sie kann die Theorie-Prüfung vielleicht in ihrer Muttersprache machen. Es gibt mehr als zehn Sprachen zur Auswahl.", "tr": "Teorik sınavı belki ana dilinde yapabilir. Seçebileceği on'dan fazla dil vardır."}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 269, "konu": "Bildung", "soru_metni": "In Deutschland haben Kinder ab dem Alter von drei Jahren bis zur Ersteinschulung einen Anspruch auf ...", "soru_tr": "Almanya'da çocukların üç yaşından ilkokula başlamaya kadar ... hakkı vardır.", "siklar": [{"id": "A", "metin": "monatliches Taschengeld.", "tr": "aylık harçlık"}, {"id": "B", "metin": "einen Platz in einem Sportverein.", "tr": "spor kulübünde yer"}, {"id": "C", "metin": "einen Kindergartenplatz.", "tr": "anaokulu yeri"}, {"id": "D", "metin": "einen Ferienpass.", "tr": "tatil kartı"}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 270, "konu": "Bildung", "soru_metni": "Die Volkshochschule in Deutschland ist eine Einrichtung ...", "soru_tr": "Almanya'daki halk eğitim merkezi (Volkshochschule) ... bir kurumdur.", "siklar": [{"id": "A", "metin": "für den Religionsunterricht.", "tr": "din dersi için"}, {"id": "B", "metin": "nur für Jugendliche.", "tr": "yalnızca gençler için"}, {"id": "C", "metin": "zur Weiterbildung.", "tr": "sürekli eğitim (ileri eğitim) için"}, {"id": "D", "metin": "nur für Rentner und Rentnerinnen.", "tr": "yalnızca emekliler için"}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 271, "konu": "Interkulturelles Zusammenleben", "soru_metni": "Was ist in Deutschland ein Brauch zu Weihnachten?", "soru_tr": "Almanya'da Noel'de hangisi bir gelenektir?", "siklar": [{"id": "A", "metin": "Bunte Eier verstecken", "tr": "Renkli yumurta saklamak"}, {"id": "B", "metin": "Einen Tannenbaum schmücken", "tr": "Bir çam ağacı süslemek"}, {"id": "C", "metin": "Sich mit Masken und Kostümen verkleiden", "tr": "Maske ve kostümlerle kılık değiştirmek"}, {"id": "D", "metin": "Kürbisse vor die Tür stellen", "tr": "Kapının önüne balkabağı koymak"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 272, "konu": "Recht und Alltag", "soru_metni": "Welche Lebensform ist in Deutschland nicht erlaubt?", "soru_tr": "Almanya'da hangi yaşam biçimine izin verilmez?", "siklar": [{"id": "A", "metin": "Mann und Frau sind geschieden und leben mit neuen Partnern zusammen.", "tr": "Karı koca boşanmıştır ve yeni partnerlerle birlikte yaşar."}, {"id": "B", "metin": "Zwei Frauen leben zusammen.", "tr": "İki kadın birlikte yaşar."}, {"id": "C", "metin": "Ein allein erziehender Vater lebt mit seinen zwei Kindern zusammen.", "tr": "Çocuklarını tek başına büyüten bir baba iki çocuğuyla birlikte yaşar."}, {"id": "D", "metin": "Ein Mann ist mit zwei Frauen zur selben Zeit verheiratet.", "tr": "Bir erkek aynı anda iki kadınla evlidir."}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 273, "konu": "Kommune", "soru_metni": "Bei Erziehungsproblemen gehen Sie in Deutschland ...", "soru_tr": "Almanya'da çocuk yetiştirme sorunlarında ... gidersiniz.", "siklar": [{"id": "A", "metin": "zum Arzt / zur Ärztin.", "tr": "doktora"}, {"id": "B", "metin": "zum Gesundheitsamt.", "tr": "sağlık dairesine"}, {"id": "C", "metin": "zum Einwohnermeldeamt.", "tr": "nüfus kayıt dairesine"}, {"id": "D", "metin": "zum Jugendamt.", "tr": "gençlik dairesine (Jugendamt)"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 274, "konu": "Grundrechte", "soru_metni": "Sie haben in Deutschland absichtlich einen Brief geöffnet, der an eine andere Person adressiert ist. Was haben Sie nicht beachtet?", "soru_tr": "Almanya'da başka birine adreslenmiş bir mektubu kasten açtınız. Neye dikkat etmediniz?", "siklar": [{"id": "A", "metin": "Das Schweigerecht", "tr": "Susma hakkına"}, {"id": "B", "metin": "Das Briefgeheimnis", "tr": "Mektup gizliliğine"}, {"id": "C", "metin": "Die Schweigepflicht", "tr": "Sır saklama yükümlülüğüne"}, {"id": "D", "metin": "Die Meinungsfreiheit", "tr": "İfade özgürlüğüne"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 275, "konu": "Recht und Alltag", "soru_metni": "Was braucht man in Deutschland für eine Ehescheidung?", "soru_tr": "Almanya'da boşanma için neye ihtiyaç vardır?", "siklar": [{"id": "A", "metin": "Die Einwilligung der Eltern", "tr": "Ebeveynlerin onayına"}, {"id": "B", "metin": "Ein Attest eines Arztes / einer Ärztin", "tr": "Bir doktor raporuna"}, {"id": "C", "metin": "Die Einwilligung der Kinder", "tr": "Çocukların onayına"}, {"id": "D", "metin": "Die Unterstützung eines Anwalts / einer Anwältin", "tr": "Bir avukatın desteğine"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 276, "konu": "Recht und Alltag", "soru_metni": "Was sollten Sie tun, wenn Sie von Ihrem Ansprechpartner / Ihrer Ansprechpartnerin in einer deutschen Behörde schlecht behandelt werden?", "soru_tr": "Bir Alman kurumunda muhatabınızdan kötü muamele görürseniz ne yapmalısınız?", "siklar": [{"id": "A", "metin": "Ich kann nichts tun.", "tr": "Hiçbir şey yapamam."}, {"id": "B", "metin": "Ich muss mir diese Behandlung gefallen lassen.", "tr": "Bu muameleye katlanmak zorundayım."}, {"id": "C", "metin": "Ich drohe der Person.", "tr": "Kişiyi tehdit ederim."}, {"id": "D", "metin": "Ich kann mich beim Behördenleiter / bei der Behördenleiterin beschweren.", "tr": "Kurum müdürüne şikâyet edebilirim."}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 277, "konu": "Grundrechte", "soru_metni": "Eine Frau, die ein zweijähriges Kind hat, bewirbt sich in Deutschland um eine Stelle. Was ist ein Beispiel für Diskriminierung? Sie bekommt die Stelle nur deshalb nicht, weil sie ...", "soru_tr": "İki yaşında çocuğu olan bir kadın Almanya'da bir işe başvuruyor. Ayrımcılığa örnek nedir? Kadın işi yalnızca ... aldığı için alamaz.", "siklar": [{"id": "A", "metin": "kein Englisch spricht.", "tr": "İngilizce konuşmadığı"}, {"id": "B", "metin": "zu hohe Gehaltsvorstellungen hat.", "tr": "maaş beklentisi çok yüksek olduğu"}, {"id": "C", "metin": "keine Erfahrungen in diesem Beruf hat.", "tr": "bu meslekte deneyimi olmadığı"}, {"id": "D", "metin": "Mutter ist.", "tr": "anne olduğu"}], "dogru_cevap": "D", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 278, "konu": "Grundrechte", "soru_metni": "Ein Mann im Rollstuhl hat sich auf eine Stelle als Buchhalter beworben. Was ist ein Beispiel für Diskriminierung? Er bekommt die Stelle nur deshalb nicht, weil er ...", "soru_tr": "Tekerlekli sandalyedeki bir erkek muhasebeci pozisyonuna başvurdu. Ayrımcılığa örnek nedir? Adam işi yalnızca ... için alamaz.", "siklar": [{"id": "A", "metin": "im Rollstuhl sitzt.", "tr": "tekerlekli sandalyede oturduğu"}, {"id": "B", "metin": "keine Erfahrung hat.", "tr": "deneyimi olmadığı"}, {"id": "C", "metin": "zu hohe Gehaltsvorstellungen hat.", "tr": "maaş beklentisi çok yüksek olduğu"}, {"id": "D", "metin": "kein Englisch spricht.", "tr": "İngilizce konuşmadığı"}], "dogru_cevap": "A", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 279, "konu": "Recht und Alltag", "soru_metni": "In den meisten Mietshäusern in Deutschland gibt es eine „Hausordnung“. Was steht in einer solchen „Hausordnung“? Sie nennt ...", "soru_tr": "Almanya'daki çoğu kiralık binada bir \"bina nizamnamesi\" (Hausordnung) vardır. Böyle bir \"bina nizamnamesi\"nde ne yazar? Şunları belirtir:", "siklar": [{"id": "A", "metin": "Regeln für die Benutzung öffentlicher Verkehrsmittel.", "tr": "Toplu taşıma araçlarının kullanımına ilişkin kurallar."}, {"id": "B", "metin": "alle Mieterinnen und Mieter im Haus.", "tr": "Binadaki tüm kiracılar."}, {"id": "C", "metin": "Regeln, an die sich alle Bewohner und Bewohnerinnen halten müssen.", "tr": "Tüm sakinlerin uyması gereken kurallar."}, {"id": "D", "metin": "die Adresse des nächsten Ordnungsamtes.", "tr": "En yakın düzen dairesinin adresi."}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 280, "konu": "Recht und Alltag", "soru_metni": "Wenn Sie sich in Deutschland gegen einen falschen Steuerbescheid wehren wollen, müssen Sie ...", "soru_tr": "Almanya'da hatalı bir vergi bildirimine karşı çıkmak istiyorsanız ...", "siklar": [{"id": "A", "metin": "nichts machen.", "tr": "hiçbir şey yapmanız gerekmez."}, {"id": "B", "metin": "den Bescheid wegwerfen.", "tr": "bildirimi atmanız gerekir."}, {"id": "C", "metin": "Einspruch einlegen.", "tr": "itiraz etmeniz gerekir."}, {"id": "D", "metin": "warten, bis ein anderer Bescheid kommt.", "tr": "başka bir bildirim gelene kadar beklemeniz gerekir."}], "dogru_cevap": "C", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 281, "konu": "Grundrechte", "soru_metni": "Zwei Freunde wollen in ein öffentliches Schwimmbad in Deutschland. Beide haben eine dunkle Hautfarbe und werden deshalb nicht hineingelassen. Welches Recht wird in dieser Situation verletzt? Das Recht auf ...", "soru_tr": "İki arkadaş Almanya'da bir halka açık yüzme havuzuna gitmek istiyor. İkisinin de ten rengi koyu ve bu yüzden içeri alınmıyorlar. Bu durumda hangi hak ihlal ediliyor? ... hakkı", "siklar": [{"id": "A", "metin": "Meinungsfreiheit", "tr": "İfade özgürlüğü"}, {"id": "B", "metin": "Gleichbehandlung", "tr": "Eşit muamele"}, {"id": "C", "metin": "Versammlungsfreiheit", "tr": "Toplanma özgürlüğü"}, {"id": "D", "metin": "Freizügigkeit", "tr": "Serbest dolaşım"}], "dogru_cevap": "B", "cevap_aciklamasi_tr": "", "gorseller": []}, {"soru_no": 282, "konu": "Pflichten", "soru_metni": "Welches Ehrenamt müssen deutsche Staatsbürger/Staatsbürgerinnen übernehmen, wenn sie dazu aufgefordert werden?", "soru_tr": "Alman vatandaşları, kendilerinden istendiğinde hangi fahri görevi üstlenmek zorundadır?", "siklar": [{"id": "A", "metin": "Vereinstrainer/Vereinstrainerin", "tr": "Dernek antrenörü"}, {"id": "B", "metin": "Wahlhelfer/Wahlhelferin", "tr": "Seçim yardımcısı"}, {"id": "C", "metin" const Q = DATA.sorular;
const KEY = 'lid_state_v1';

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function optsOf(q){
  if(!S.shuf || q.siklar.every(s=>s.metin.length<=2)) return q.siklar;
  const r=rng(S.seed+q.soru_no*7919), a=q.siklar.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byNo = n => Q.find(x=>x.soru_no===n);

let view = 'home';     // home | quiz | result | grid
let list = [];         // ordered list of question numbers
let idx = 0;

function start(nos, t, startIdx=0, isExam=false){
  if(!nos.length){ alert('Bu listede soru yok.'); return; }
  list = nos; idx = Math.min(startIdx, nos.length-1); title = t;
  exam = isExam ? {ans:{}, done:false} : null;
  view = 'quiz'; render();
}
const all = () => Q.map(x=>x.soru_no);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function home(){

  <div class="top">
    <button id="back">Geri</button>
    <div class="t">${esc(title)}${exam?` · ${exAnswered}/${list.length}`:''}</div>
    <button id="mk">${marked?'İşaretini kaldır':'İşaretle'}</button>
    <button id="tr" class="${S.tr?'on':''}" aria-label="Türkçe çeviri" title="Türkçe çeviriyi aç/kapat">文A</button>
  </div>
  <div class="q ${marked?'mark':''}"><div class="qno">SORU ${n} · ${esc(q.konu)}</div>${esc(q.soru_metni)}${S.tr&&q.soru_tr?`<div class="tr">${esc(q.soru_tr)}</div>`:''}${imgs}</div>
  <div class="opts">${opts}</div>
  ${note}
  <div class="sp"></div>
  <div class="nav"><button id="prev" ${idx===0?'disabled':''}>‹ önceki</button><button class="c" id="mid">${centerLabel}</button><button id="next" ${idx>=list.length-1?'disabled':''}>sonraki ›</button></div>`;
  $('#back').onclick=()=>{ view='home'; render(); };
  $('#mk').onclick=()=>{ S.mark[n]=!S.mark[n]; if(!S.mark[n]) delete S.mark[n]; save(); render(); };
  $('#tr').onclick=()=>{ S.tr=!S.tr; save(); render(); };
  $('#prev').onclick=()=>{ idx--; render(); window.scrollTo(0,0); };
  $('#next').onclick=()=>{ idx++; render(); window.scrollTo(0,0); };
  $('#mid').onclick=()=>{
    if(exam && !exam.done && idx===list.length-1){ finishExam(); return; }
    const v=prompt('Kaçıncı soruya gidilsin? (1–'+list.length+')', idx+1);
    const k=parseInt(v,10); if(k>=1&&k<=list.length){ idx=k-1; render(); window.scrollTo(0,0); }
  };
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(locked) return;
    const id=o.dataset.id;
    if(exam){ exam.ans[n]=id; }
    else { S.ans[n]=id; save(); }
    render();
  });
}

function finishExam(){
  const un = list.length-Object.keys(exam.ans).length;
  if(un>0 && !confirm(un+' soru boş. Yine de bitirilsin mi?')) return;
  exam.done=true;
  list.forEach(n=>{ if(exam.ans[n]) S.ans[n]=exam.ans[n]; });
  save(); view='result'; render();
}

function result(){
  const right=list.filter(n=>exam.ans[n]===byNo(n).dogru_cevap).length;
  const pass=right>=17;
  $('#app').innerHTML = `<div class="top"><button id="back">Ana sayfa</button><div class="t">Sonuç</div></div>
  <div class="res"><div class="big ${pass?'pass':'fail'}">${right} / ${list.length}</div>
  <h2 class="${pass?'pass':'fail'}">${pass?'Geçtin 🎉':'Geçemedin'}</h2><p style="color:var(--mut)">Geçmek için en az 17 doğru gerekir.</p></div>
  <div class="grid">${list.map((n,i)=>`<button data-i="${i}" class="${exam.ans[n]===byNo(n).dogru_cevap?'d-ok':'d-bad'}">${i+1}</button>`).join('')}</div>
  <div class="row"><button id="wr">Yanlışları gözden geçir</button></div>`;
  $('#back').onclick=()=>{ view='home'; render(); };
  document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>{ idx=+b.dataset.i; view='quiz'; render(); });
  $('#wr').onclick=()=>{ const w=list.filter(n=>exam.ans[n]!==byNo(n).dogru_cevap); exam=null; start(w,'Sınav yanlışları'); };
}

function grid(){
  $('#app').innerHTML = `<div class="top"><button id="back">Geri</button><div class="t">Soru haritası</div></div>
  <div class="grid">${Q.map(x=>{ const a=S.ans[x.soru_no]; let c=a?(a===x.dogru_cevap?'d-ok':'d-bad'):''; if(S.mark[x.soru_no]) c+=' d-mk'; return `<button class="${c}" data-n="${x.soru_no}">${x.soru_no}</button>`; }).join('')}</div>`;
  $('#back').onclick=()=>{ view='home'; render(); };
  document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>start(all(),'Tüm sorular',+b.dataset.n-1));
}

function render(){ ({home,quiz,result,grid})[view](); }
render();
</script>

function localizeApp(){
 if(lang==='tr')return;
 var root=document.getElementById('app');if(!root)return;
 var dict=lang==='de'?de:en;
 var keys=Object.keys(dict).sort(function(a,b){return b.length-a.length;});
 var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(function(node){
  if(!node.nodeValue.trim())return;
  if(node.parentElement && node.parentElement.closest('.q,.opts'))return;
  var v=node.nodeValue;
  keys.forEach(function(k){v=v.split(k).join(dict[k]);});
  node.nodeValue=v;
 });
}

}
