<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İşaretli Toplama — Baloncuk Simülasyonu</title>
<style>
:root{
  --bg:#f5f7fb;
  --text:#1d2433;
  --muted:#6f7787;
  --accent:#7c3aed;
  --stage-gray:#e5e8ed;
  --band-stroke:#8993a2;
  --band-fill:rgba(255,255,255,.72);
  --shadow:0 18px 45px rgba(42,50,70,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  display:flex;
  justify-content:center;
  padding:24px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 15%,rgba(124,58,237,.08),transparent 28%),
    radial-gradient(circle at 82% 22%,rgba(37,99,235,.08),transparent 30%),
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
button,input,.bubble-core{-webkit-tap-highlight-color:transparent}
.app{width:min(1080px,100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.titlebox h1{margin:0;font-size:clamp(24px,3vw,38px);letter-spacing:-.04em}
.titlebox p{margin:6px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.level-btn,.new-btn,.home-btn{
  border:0;border-radius:13px;padding:10px 15px;font:inherit;font-weight:750;color:#3c4352;
  background:rgba(255,255,255,.86);box-shadow:0 6px 18px rgba(40,48,67,.08);cursor:pointer;text-decoration:none;
  transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.level-btn:hover,.new-btn:hover,.home-btn:hover{transform:translateY(-1px)}
.level-btn.active{color:#fff;background:var(--text);box-shadow:0 8px 20px rgba(29,36,51,.18)}
.new-btn{margin-left:4px;color:var(--accent)}
.home-btn{display:inline-flex;align-items:center;justify-content:center}
.board{position:relative;min-height:680px;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:30px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.stage{position:relative;width:100%;height:650px;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.44),transparent 34%),var(--stage-gray);transition:height .28s ease}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(93,102,120,.03))}
.soft-orb{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(30px);opacity:.08;pointer-events:none;z-index:0}
.soft-orb.one{left:-100px;top:20px;background:#60a5fa}.soft-orb.two{right:-120px;bottom:10px;background:#c084fc}
.settings-panel{position:absolute;top:14px;right:18px;z-index:100;display:grid;gap:7px;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.93);box-shadow:0 6px 18px rgba(40,48,67,.09);backdrop-filter:blur(8px)}
.setting-row{display:grid;grid-template-columns:58px 116px;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#4b5565}.setting-label{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap}.setting-value{min-width:19px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}.setting-slider{width:116px;accent-color:var(--accent);cursor:pointer}
.term-layer{position:absolute;inset:0;z-index:35;pointer-events:none}
.term-card{position:absolute;top:148px;transform:translate(-50%,-50%);min-width:94px;padding:15px 16px;border:0;border-radius:18px;background:#fff;color:var(--text);font-size:clamp(24px,3vw,40px);font-weight:850;letter-spacing:-.04em;box-shadow:0 14px 30px rgba(30,38,56,.14);cursor:grab;z-index:45;pointer-events:auto;touch-action:none;transition:left .28s ease,transform .18s ease,opacity .25s ease,box-shadow .2s ease}
.term-card:hover{transform:translate(-50%,-52%) scale(1.025)}.term-card.dragging{cursor:grabbing;z-index:90;transition:none;box-shadow:0 20px 40px rgba(30,38,56,.22)}.term-card.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72)}
.dynamic-plus{position:absolute;top:148px;transform:translate(-50%,-50%);font-size:clamp(38px,4.8vw,60px);font-weight:500;color:#343b4b;opacity:.34;pointer-events:none;z-index:34}
.band-layer{position:absolute;inset:0;width:100%;height:100%;z-index:8;overflow:visible;pointer-events:none}
.cluster-band{fill:var(--band-fill);stroke:var(--band-stroke);stroke-width:2.4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 5px 9px rgba(55,65,81,.10));pointer-events:visiblePainted;cursor:pointer;transition:stroke .18s ease,fill .18s ease,opacity .18s ease}
.cluster-band.single{stroke:#7f8999}.cluster-band.mergeable{stroke:#70798a;filter:drop-shadow(0 5px 9px rgba(55,65,81,.10)) drop-shadow(0 0 7px rgba(124,58,237,.16))}.cluster-band.approaching{stroke:#6d65a8;fill:rgba(255,255,255,.78)}
.band-join-flash{position:absolute;width:18px;height:18px;border-radius:50%;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(.2);border:2px solid rgba(255,255,255,.98);box-shadow:0 0 0 2px rgba(124,58,237,.22),0 0 18px rgba(124,58,237,.45),0 0 32px rgba(255,255,255,.95);animation:bandJoin .44s ease-out forwards}
.band-join-flash::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff}
@keyframes bandJoin{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.9)}}
.bubble-wrap{position:absolute;transform:translate(-50%,-50%);z-index:18;will-change:left,top,transform,opacity}.bubble-core{display:grid;place-items:center;border-radius:999px;font-weight:850;letter-spacing:-.03em;border:1px solid rgba(255,255,255,.88);box-shadow:0 5px 12px rgba(35,45,70,.12),inset 0 1px 0 rgba(255,255,255,.82);user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;will-change:transform,filter,box-shadow}
.bubble-wrap.unit-100 .bubble-core{width:60px;height:60px;font-size:21px}.bubble-wrap.unit-10 .bubble-core{width:46px;height:46px;font-size:15px}body[data-mode="medium"] .bubble-wrap.unit-10 .bubble-core{width:36px;height:36px;font-size:12px}.bubble-wrap.unit-1 .bubble-core{width:32px;height:32px;font-size:10px}.bubble-wrap.unit-0 .bubble-core{width:44px;height:44px;font-size:15px;color:#6b7280;background:linear-gradient(145deg,#f8fafc,#e5e7eb)}
.bubble-wrap.positive .bubble-core{color:#1748a5;background:radial-gradient(circle at 35% 28%,#fff 0 9%,#edf6ff 22%,#d8eaff 74%,#c9def9 100%)}.bubble-wrap.negative .bubble-core{color:#a41436;background:radial-gradient(circle at 35% 28%,#fff 0 9%,#fff0f3 22%,#ffdce3 74%,#f7cbd5 100%)}
.bubble-wrap.splittable .bubble-core{outline:3px solid rgba(124,58,237,.25);box-shadow:0 8px 18px rgba(124,58,237,.22);animation:splitPulse 1.15s ease-in-out infinite}@keyframes splitPulse{0%,100%{filter:saturate(1)}50%{filter:saturate(1.15) brightness(1.04)}}
.annihilation-burst{position:absolute;width:0;height:0;pointer-events:none;z-index:80}.burst-core{position:absolute;left:0;top:0;width:20px;height:20px;transform:translate(-50%,-50%) scale(.1);border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 20%,#e6efff 35%,rgba(147,114,255,.65) 52%,rgba(124,58,237,.20) 69%,transparent 77%);box-shadow:0 0 18px rgba(255,255,255,1),0 0 34px rgba(124,58,237,.72);animation:burstCore .33s ease-out forwards}@keyframes burstCore{0%{transform:translate(-50%,-50%) scale(.15);opacity:.3}35%{transform:translate(-50%,-50%) scale(2);opacity:1}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.burst-ring{position:absolute;left:0;top:0;width:24px;height:24px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:2px solid rgba(255,255,255,.95)}.burst-ring.one{animation:ringOne .38s ease-out forwards}.burst-ring.two{animation:ringTwo .48s .035s ease-out forwards}@keyframes ringOne{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}@keyframes ringTwo{from{transform:translate(-50%,-50%) scale(.2);opacity:.65}to{transform:translate(-50%,-50%) scale(4.8);opacity:0}}
.burst-spark{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.95);animation:sparkFly .38s ease-out forwards}@keyframes sparkFly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(.1);opacity:0}}
.result-frame{position:absolute;left:50%;bottom:20px;width:174px;height:96px;transform:translateX(-50%) scale(.58);opacity:0;border:2px solid rgba(124,58,237,.24);border-radius:25px;background:rgba(255,255,255,.98);box-shadow:0 16px 38px rgba(30,38,56,.18);pointer-events:none;z-index:95;transition:opacity .25s ease,transform .38s cubic-bezier(.16,1.08,.34,1),box-shadow .3s ease,border-color .3s ease}.result-frame.show{opacity:1;transform:translateX(-50%) scale(1)}.result-frame.gravity-active{border-color:rgba(124,58,237,.38);box-shadow:0 16px 38px rgba(30,38,56,.18),0 -5px 28px rgba(124,58,237,.10)}.counter-value{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(35px,5vw,55px);font-weight:900;letter-spacing:-.05em}.counter-value.bump{animation:counterBump .16s ease-out}@keyframes counterBump{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.statusbar{min-height:90px;border-top:1px solid rgba(42,50,70,.13);display:flex;align-items:center;justify-content:center;padding:18px 24px 22px;background:rgba(255,255,255,.86)}.status{margin:0;text-align:center;font-size:15px;line-height:1.45;color:var(--muted)}.status strong{color:var(--text)}
@media(max-width:720px){body{padding:10px}.board{border-radius:22px}.settings-panel{top:10px;right:10px;padding:7px 8px}.setting-row{grid-template-columns:52px 90px;gap:6px;font-size:11px}.setting-slider{width:90px}.term-card{top:140px;min-width:70px;padding:12px 9px;font-size:clamp(20px,6vw,29px)}.dynamic-plus{top:140px;font-size:36px}.bubble-wrap.unit-100 .bubble-core{width:52px;height:52px;font-size:18px}.bubble-wrap.unit-10 .bubble-core{width:41px;height:41px;font-size:14px}body[data-mode="medium"] .bubble-wrap.unit-10 .bubble-core{width:32px;height:32px;font-size:11px}.bubble-wrap.unit-1 .bubble-core{width:28px;height:28px;font-size:9px}.bubble-wrap.unit-0 .bubble-core{width:40px;height:40px;font-size:14px}.result-frame{width:158px;height:84px;bottom:18px}}

.bubble-wrap.aging .bubble-core{animation:agingPulse .62s ease-in-out infinite alternate;filter:saturate(1.08)}
.bubble-wrap.seeking .bubble-core{box-shadow:0 0 0 4px rgba(124,58,237,.08),0 0 19px rgba(124,58,237,.23),inset 0 1px 0 rgba(255,255,255,.82)}
.bubble-wrap.merging{z-index:72}.bubble-wrap.merging .bubble-core{animation:none;filter:brightness(1.08)}
@keyframes agingPulse{from{transform:scale(1)}to{transform:scale(1.055)}}
</style>
</head>
<body data-mode="basic">
<div class="app">
  <div class="topbar">
    <div class="titlebox">
      <h1>Bulutlarla Toplama</h1>
      <p>Baloncuklar birbirini çeker; zıt işaretliler temas edince yok olur.</p>
    </div>
    <div class="controls">
      <a class="home-btn" href="../index.html">Home</a>
      <button class="level-btn active" data-level="basic">Basit</button>
      <button class="level-btn" data-level="medium">Orta</button>
      <button class="level-btn" data-level="advanced">Gelişmiş</button>
      <button class="new-btn" id="newBtn">Yeni işlem</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="stage" id="stage">
      <div class="soft-orb one"></div>
      <div class="soft-orb two"></div>

      <div class="settings-panel" id="settingsPanel">
        <div class="setting-row">
          <span class="setting-label">a = <span class="setting-value" id="aValue">20</span></span>
          <input class="setting-slider" id="aSlider" type="range" min="5" max="50" step="1" value="20" aria-label="a sınırı">
        </div>
        <div class="setting-row">
          <span class="setting-label">n = <span class="setting-value" id="countValue">2</span></span>
          <input class="setting-slider" id="countSlider" type="range" min="2" max="4" step="1" value="2" aria-label="Toplanan sayı adedi">
        </div>
      </div>

      <svg class="band-layer" id="bandLayer" aria-hidden="true">
        <g id="clusterBandGroup"></g>
      </svg>

      <div class="term-layer" id="termLayer"></div>

      <div class="result-frame" id="resultFrame">
        <div class="counter-value" id="counterValue">0</div>
      </div>
    </div>

    <div class="statusbar">
      <p class="status" id="status"></p>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* =========================================================
   DOM
   ========================================================= */
const stage=document.getElementById("stage");
const board=document.getElementById("board");
const termLayer=document.getElementById("termLayer");
const clusterBandGroup=document.getElementById("clusterBandGroup");
const resultFrame=document.getElementById("resultFrame");
const counterValue=document.getElementById("counterValue");
const statusEl=document.getElementById("status");
const newBtn=document.getElementById("newBtn");
const settingsPanel=document.getElementById("settingsPanel");
const aSlider=document.getElementById("aSlider");
const aValue=document.getElementById("aValue");
const countSlider=document.getElementById("countSlider");
const countValue=document.getElementById("countValue");
const levelButtons=[...document.querySelectorAll(".level-btn")];

/* =========================================================
   SABİTLER
   ========================================================= */
const LEVELS={
  basic:{precision:0,minUnit:100},
  medium:{precision:1,minUnit:10},
  advanced:{precision:2,minUnit:1}
};

const PHYSICS={
  damping:.89,
  centerCohesion:.00115,
  pairAttraction:.00115,
  sameSizeMultiplier:1.75,
  oppositeColorMultiplier:2.65,
  overlapSpring:.075,
  nearContactSpring:.012,
  tangentialSlide:.0017,
  clusterAttraction:.022,
  clusterAttractionMax:.38,
  clusterRepulsion:.035,
  maxSpeed:8.5,
  settleSpeed:.18,
  boundaryOffset:7,
  mergeGap:5,
  lifeSeekAt:.68,
  lifeUrgentAt:.86
};

const state={
  level:"basic",
  limitA:20,
  operandCount:2,
  terms:[],
  clusters:new Map(),
  particles:[],
  nextTermId:1,
  nextClusterId:1,
  nextParticleId:1,
  mergeInProgress:false,
  mergeClusterIds:[],
  mergedClusterId:null,
  mergeTermIds:[],
  drag:null,
  generation:0,
  lastPhysicsTime:performance.now(),
  resolutionCheckAt:0,
  finalFlowing:false
};

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const randomInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const randomSign=()=>Math.random()<.5?-1:1;
const currentConfig=()=>LEVELS[state.level];
const setStatus=html=>statusEl.innerHTML=html;

/* =========================================================
   SAYI / FORMAT
   ========================================================= */
function generateValue100(){
  const a=Math.max(5,Math.min(50,state.limitA));
  if(state.level==="basic")return randomSign()*randomInt(1,a-1)*100;
  if(state.level==="medium"){
    let n;
    do{n=randomInt(1,a*10-1)}while(n%10===0);
    return randomSign()*n*10;
  }
  let n;
  do{n=randomInt(1,a*100-1)}while(n%10===0);
  return randomSign()*n;
}

function formatSigned(value100,precision=currentConfig().precision){
  if(value100===0)return(0).toFixed(precision).replace(".",",");
  return(value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(precision).replace(".",",");
}

function formatCounter(value100){
  if(value100===0)return"0";
  const precision=value100%100===0?0:value100%10===0?1:2;
  return(value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(precision).replace(".",",");
}

function bubbleLabel(sign,unit){
  if(unit===0)return"0";
  const s=sign>0?"+":"−";
  return unit===100?s+"1":unit===10?s+"0,1":s+"0,01";
}

function decomposeValue(value100){
  if(value100===0)return[{sign:0,unit:0}];
  const sign=value100>0?1:-1;
  const pieces=[];
  let rest=Math.abs(value100);
  const ones=Math.floor(rest/100);
  rest%=100;
  const tenths=Math.floor(rest/10);
  const hundredths=rest%10;
  for(let i=0;i<ones;i++)pieces.push({sign,unit:100});
  for(let i=0;i<tenths;i++)pieces.push({sign,unit:10});
  for(let i=0;i<hundredths;i++)pieces.push({sign,unit:1});
  return pieces;
}

function radiusForUnit(unit){
  const mobile=innerWidth<=720;
  if(unit===100)return mobile?26:30;
  if(unit===10){
    if(state.level==="medium")return mobile?16:18;
    return mobile?20.5:23;
  }
  if(unit===1)return mobile?14:16;
  return mobile?20:22;
}

function particleValue100(p){
  return Number.isFinite(p.value100)?p.value100:p.sign*p.unit;
}

function unitForValue(value100){
  const a=Math.abs(value100);
  if(a>=100)return 100;
  if(a>=10)return 10;
  if(a>0)return 1;
  return 0;
}

function radiusForParticle(p){
  const value=Math.abs(particleValue100(p));
  const unit=unitForValue(value);
  const base=radiusForUnit(unit);
  const atomic=Math.max(1,value/Math.max(1,currentConfig().minUnit));
  const extra=Math.min(innerWidth<=720?13:17,Math.log2(atomic+1)*(innerWidth<=720?2.6:3.2));
  return base+extra;
}

function formatBubbleValue(value100){
  if(value100===0)return"0";
  const precision=value100%100===0?0:value100%10===0?1:2;
  return(value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(precision).replace(".",",");
}

function updateBubbleVisual(p){
  const value=particleValue100(p);
  const r=radiusForParticle(p);
  p.sign=Math.sign(value);
  p.unit=unitForValue(value);
  p.el.classList.remove("unit-100","unit-10","unit-1","unit-0","positive","negative","neutral");
  p.el.classList.add("unit-"+p.unit,p.sign>0?"positive":p.sign<0?"negative":"neutral");
  p.core.textContent=formatBubbleValue(value);
  p.core.style.width=(r*2)+"px";
  p.core.style.height=(r*2)+"px";
  p.core.style.fontSize=Math.max(10,Math.min(20,r*.55))+"px";
}

function massForParticle(p){
  const r=radiusForParticle(p);
  return Math.max(1,r*r);
}

/* =========================================================
   TERİM KONUMLARI / SAHNE
   ========================================================= */
function getCenterRatios(count){
  if(count===1)return[.5];
  if(count===2)return[.28,.72];
  if(count===3)return[.17,.50,.83];
  return[.10,.365,.635,.90];
}

function termSegmentWidth(){
  return Math.max(78,stage.clientWidth/Math.max(1,state.terms.length)-28);
}

function seedColumnsForTerm(term){
  const r=30;
  return Math.max(2,Math.floor(termSegmentWidth()/(r*2)));
}

function estimateSeedHeight(term){
  const pieces=decomposeValue(term.value100);
  const columns=seedColumnsForTerm(term);
  let rows=0;
  for(const unit of[100,10,1,0]){
    const count=pieces.filter(p=>p.unit===unit).length;
    if(count)rows+=Math.ceil(count/columns)+1;
  }
  return Math.max(70,rows*52);
}

function calculateStageHeight(){
  let maxH=100;
  for(const term of state.terms)maxH=Math.max(maxH,estimateSeedHeight(term));
  return Math.max(650,230+maxH+230);
}

function termAnchor(index){
  const count=Math.max(1,state.terms.length);
  const segment=stage.clientWidth/count;
  const term=state.terms[index];
  return{x:(index+.5)*segment,y:220+estimateSeedHeight(term)/2};
}

function elementCenterInStage(element){
  const sr=stage.getBoundingClientRect();
  const r=element.getBoundingClientRect();
  return{x:r.left+r.width/2-sr.left,y:r.top+r.height/2-sr.top};
}

/* =========================================================
   İLK DOĞUŞ İÇİN PETEK TOHUMU
   Sonraki hareketleri fizik belirler.
   ========================================================= */
function seedLayout(pieces,center,availableWidth){
  const points=new Array(pieces.length);
  let cursorY=0;
  const groups=[];

  for(const unit of[100,10,1,0]){
    const entries=pieces.map((piece,index)=>({piece,index})).filter(e=>e.piece.unit===unit);
    if(!entries.length)continue;
    const r=radiusForUnit(unit);
    const diameter=2*r;
    const rowH=Math.sqrt(3)*r;
    const cols=Math.max(1,Math.floor(Math.max(diameter,availableWidth-r)/diameter));
    const local=[];
    let cursor=0,row=0;
    while(cursor<entries.length){
      const take=Math.min(cols,entries.length-cursor);
      const shift=row%2?r:0;
      for(let col=0;col<take;col++){
        local.push({entry:entries[cursor++],x:col*diameter+shift,y:row*rowH,r});
      }
      row++;
    }
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const p of local){
      minX=Math.min(minX,p.x-p.r);maxX=Math.max(maxX,p.x+p.r);
      minY=Math.min(minY,p.y-p.r);maxY=Math.max(maxY,p.y+p.r);
    }
    const w=maxX-minX,h=maxY-minY;
    for(const p of local){p.x-=minX+w/2;p.y-=minY;}
    groups.push({local,w,h,top:cursorY});
    cursorY+=h+12;
  }

  const totalH=Math.max(0,cursorY-12);
  for(const group of groups){
    for(const p of group.local){
      points[p.entry.index]={x:center.x+p.x,y:center.y-totalH/2+group.top+p.y};
    }
  }
  return points;
}

function aliveParticles(){return state.particles.filter(p=>p.alive&&p.el.isConnected);}
function particlesInCluster(clusterId){return aliveParticles().filter(p=>p.clusterId===clusterId);}
function openedTerms(){return state.terms.filter(t=>t.opened);}

/* =========================================================
   LASTİK BANT — GERÇEK DIŞ ZARF
   ========================================================= */
function cross(o,a,b){return(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);}

function convexHull(points){
  if(points.length<=2)return points.slice();
  const sorted=points.slice().sort((a,b)=>a.x===b.x?a.y-b.y:a.x-b.x);
  const lower=[];
  for(const p of sorted){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);}
  const upper=[];
  for(let i=sorted.length-1;i>=0;i--){const p=sorted[i];while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);}
  lower.pop();upper.pop();
  return lower.concat(upper);
}

function smoothClosedPath(points){
  if(!points.length)return"";
  const mids=points.map((p,i)=>{const n=points[(i+1)%points.length];return{x:(p.x+n.x)/2,y:(p.y+n.y)/2};});
  let d=`M ${mids[mids.length-1].x.toFixed(2)} ${mids[mids.length-1].y.toFixed(2)}`;
  for(let i=0;i<points.length;i++)d+=` Q ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)} ${mids[i].x.toFixed(2)} ${mids[i].y.toFixed(2)}`;
  return d+" Z";
}

function rubberBandPath(cluster){
  const particles=particlesInCluster(cluster.id);
  const samples=[];
  const offset=PHYSICS.boundaryOffset;

  if(!particles.length){
    const r=30;
    for(let i=0;i<18;i++){
      const a=Math.PI*2*i/18;
      samples.push({x:cluster.anchor.x+Math.cos(a)*r,y:cluster.anchor.y+Math.sin(a)*r});
    }
    return smoothClosedPath(samples);
  }

  for(const p of particles){
    const r=radiusForParticle(p)+offset;
    const count=p.unit===100?14:12;
    for(let i=0;i<count;i++){
      const a=Math.PI*2*i/count;
      samples.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r});
    }
  }
  return smoothClosedPath(convexHull(samples));
}

function clusterStats(cluster){
  const particles=particlesInCluster(cluster.id);
  if(!particles.length)return{center:{...cluster.anchor},mass:1,radius:30,avgRadius:30};
  let sx=0,sy=0,mass=0,rs=0;
  for(const p of particles){
    const m=massForParticle(p);
    sx+=p.x*m;sy+=p.y*m;mass+=m;rs+=radiusForParticle(p);
  }
  const center={x:sx/mass,y:sy/mass};
  let radius=0;
  for(const p of particles)radius=Math.max(radius,Math.hypot(p.x-center.x,p.y-center.y)+radiusForParticle(p)+PHYSICS.boundaryOffset);
  return{center,mass,radius,avgRadius:rs/particles.length};
}

function updateBands(){
  const clusters=[...state.clusters.values()];
  const onlyOne=clusters.length===1;
  for(const cluster of clusters){
    ensureClusterBand(cluster);
    cluster.band.setAttribute("d",rubberBandPath(cluster));
    cluster.band.classList.toggle("single",onlyOne&&!state.mergeInProgress);
    cluster.band.classList.toggle("mergeable",clusters.length>=2&&!state.mergeInProgress);
    cluster.band.classList.toggle("approaching",cluster.mode==="approaching");
  }
}

/* =========================================================
   FİZİK MOTORU
   ========================================================= */
function clampMagnitude(x,y,max){
  const d=Math.hypot(x,y);
  if(d<=max||d===0)return{x,y};
  return{x:x/d*max,y:y/d*max};
}

function nearestParticleInCluster(source,clusterId){
  let best=null,bestDistance=Infinity;
  for(const other of particlesInCluster(clusterId)){
    if(other.id===source.id||other.locked||!other.alive)continue;
    const d=Math.hypot(other.x-source.x,other.y-source.y);
    if(d<bestDistance){bestDistance=d;best=other;}
  }
  return best;
}

function applyInternalForces(cluster,dt,now=performance.now()){
  const particles=particlesInCluster(cluster.id).filter(p=>!p.locked);
  if(!particles.length)return;
  const stats=clusterStats(cluster);

  for(const p of particles){
    const dx=stats.center.x-p.x;
    const dy=stats.center.y-p.y;
    const d=Math.max(1,Math.hypot(dx,dy));
    const targetRadius=Math.max(45,Math.sqrt(particles.length)*stats.avgRadius*1.08);
    let strength=PHYSICS.centerCohesion;
    if(d>targetRadius)strength*=1+(d-targetRadius)/Math.max(40,targetRadius)*2.1;
    p.vx+=dx*strength*dt;
    p.vy+=dy*strength*dt;

    const age=(now-p.birth)/Math.max(300,p.lifeSpan);
    p.el.classList.toggle("aging",age>=PHYSICS.lifeSeekAt&&particles.length>1);

    if(age>=PHYSICS.lifeSeekAt&&particles.length>1){
      const nearest=nearestParticleInCluster(p,cluster.id);
      p.seekingId=nearest?nearest.id:null;
      p.el.classList.toggle("seeking",!!nearest);
    }else{
      p.seekingId=null;
      p.el.classList.remove("seeking");
    }
  }

  for(let i=0;i<particles.length;i++){
    const a=particles[i];

    for(let j=i+1;j<particles.length;j++){
      const b=particles[j];

      let dx=b.x-a.x;
      let dy=b.y-a.y;
      let d=Math.hypot(dx,dy);

      if(d<.01){dx=.01;dy=.01;d=.014;}

      const ux=dx/d;
      const uy=dy/d;
      const ra=radiusForParticle(a);
      const rb=radiusForParticle(b);
      const contact=ra+rb;
      const sameSize=Math.abs(ra-rb)<3;
      const differentColor=a.sign!==0&&b.sign!==0&&a.sign!==b.sign;

      if(d<contact){
        const overlap=contact-d;
        const push=overlap*PHYSICS.overlapSpring*dt;
        a.vx-=ux*push;a.vy-=uy*push;
        b.vx+=ux*push;b.vy+=uy*push;
      }else{
        let multiplier=1;
        if(sameSize)multiplier*=PHYSICS.sameSizeMultiplier;
        if(differentColor)multiplier*=PHYSICS.oppositeColorMultiplier;

        const falloff=1/(1+d/Math.max(16,contact)*.55);
        let pull=PHYSICS.pairAttraction*multiplier*falloff*dt;

        const ageA=(now-a.birth)/Math.max(300,a.lifeSpan);
        const ageB=(now-b.birth)/Math.max(300,b.lifeSpan);

        if(a.seekingId===b.id||b.seekingId===a.id){
          const urgency=Math.max(ageA,ageB);
          pull*=urgency>=PHYSICS.lifeUrgentAt?8:4.3;
        }

        a.vx+=ux*pull*d*.12;a.vy+=uy*pull*d*.12;
        b.vx-=ux*pull*d*.12;b.vy-=uy*pull*d*.12;

        if(d<contact*1.42){
          const turn=((a.id+b.id)&1)?1:-1;
          const slide=PHYSICS.tangentialSlide*(1-(d-contact)/(contact*.42))*turn*dt;
          a.vx+=-uy*slide*contact;a.vy+=ux*slide*contact;
          b.vx-=-uy*slide*contact;b.vy-=ux*slide*contact;
        }
      }

      const ageA=(now-a.birth)/Math.max(300,a.lifeSpan);
      const ageB=(now-b.birth)/Math.max(300,b.lifeSpan);
      const lifeReady=
        (ageA>=PHYSICS.lifeSeekAt&&a.seekingId===b.id)
        ||
        (ageB>=PHYSICS.lifeSeekAt&&b.seekingId===a.id);

      if(lifeReady&&d<=contact+4&&!a.locked&&!b.locked){
        scheduleLifeMerge(a,b);
      }
    }
  }
}

function applyAnchorForce(cluster,dt){
  if(cluster.mode!=="free")return;
  const stats=clusterStats(cluster);
  const dx=cluster.anchor.x-stats.center.x;
  const dy=cluster.anchor.y-stats.center.y;
  for(const p of particlesInCluster(cluster.id)){
    if(p.locked)continue;
    p.vx+=dx*.00055*dt;
    p.vy+=dy*.00055*dt;
  }
}

function applySeparateClusterRepulsion(dt){
  const clusters=[...state.clusters.values()].filter(c=>c.mode==="free");
  for(let i=0;i<clusters.length;i++){
    const a=clusters[i],sa=clusterStats(a);
    for(let j=i+1;j<clusters.length;j++){
      const b=clusters[j],sb=clusterStats(b);
      let dx=sb.center.x-sa.center.x,dy=sb.center.y-sa.center.y;
      let d=Math.max(1,Math.hypot(dx,dy));
      const desired=sa.radius+sb.radius+18;
      if(d>=desired)continue;
      const ux=dx/d,uy=dy/d;
      const force=(desired-d)*PHYSICS.clusterRepulsion*dt;
      for(const p of particlesInCluster(a.id)){p.vx-=ux*force*.5;p.vy-=uy*force*.5;}
      for(const p of particlesInCluster(b.id)){p.vx+=ux*force*.5;p.vy+=uy*force*.5;}
    }
  }
}

function directionalExtent(cluster,center,ux,uy){
  const particles=particlesInCluster(cluster.id);
  if(!particles.length)return 30;
  let extent=0;
  for(const p of particles){
    const projection=(p.x-center.x)*ux+(p.y-center.y)*uy;
    extent=Math.max(extent,projection+radiusForParticle(p)+PHYSICS.boundaryOffset);
  }
  return extent;
}

function clusterAffinity(a,b){
  const pa=particlesInCluster(a.id).filter(p=>p.unit!==0);
  const pb=particlesInCluster(b.id).filter(p=>p.unit!==0);
  let opposite=false;
  let oppositeSameSize=false;

  for(const x of pa){
    for(const y of pb){
      if(x.sign!==0&&y.sign!==0&&x.sign!==y.sign){
        opposite=true;
        if(x.unit===y.unit){
          oppositeSameSize=true;
          break;
        }
      }
    }
    if(oppositeSameSize)break;
  }

  return oppositeSameSize?1.9:opposite?1.5:1;
}

function applyCrossClusterBubbleAttraction(a,b,gap,dt){
  if(gap>145)return;

  const pa=particlesInCluster(a.id).filter(p=>!p.locked&&p.unit!==0);
  const pb=particlesInCluster(b.id).filter(p=>!p.locked&&p.unit!==0);

  for(const x of pa){
    for(const y of pb){
      let dx=y.x-x.x,dy=y.y-x.y;
      const d=Math.max(1,Math.hypot(dx,dy));
      const contact=radiusForParticle(x)+radiusForParticle(y);
      if(d>210)continue;

      const ux=dx/d,uy=dy/d;
      let multiplier=1;
      if(x.unit===y.unit)multiplier*=PHYSICS.sameSizeMultiplier;
      if(x.sign!==0&&y.sign!==0&&x.sign!==y.sign)multiplier*=PHYSICS.oppositeColorMultiplier;

      const nearness=Math.max(0,1-d/220);
      const force=.0017*multiplier*(.35+nearness*1.65)*dt;
      x.vx+=ux*force*d*.10;
      x.vy+=uy*force*d*.10;
      y.vx-=ux*force*d*.10;
      y.vy-=uy*force*d*.10;

      if(d<contact*1.25){
        const spin=((x.id+y.id)&1)?1:-1;
        const slide=.0011*spin*dt;
        x.vx+=-uy*slide*contact;
        x.vy+=ux*slide*contact;
        y.vx-= -uy*slide*contact;
        y.vy-=ux*slide*contact;
      }
    }
  }
}

function applyMergingClusterForces(dt){
  if(!state.mergeInProgress||state.mergedClusterId!==null)return;
  const clusters=state.mergeClusterIds.map(id=>state.clusters.get(id)).filter(Boolean);

  if(clusters.length===1){
    state.mergedClusterId=clusters[0].id;
    clusters[0].mode="merged";
    clusters[0].joinedAt=performance.now();
    return;
  }

  if(clusters.length<2)return;

  let closest=null;

  for(let i=0;i<clusters.length;i++){
    const a=clusters[i],sa=clusterStats(a);

    for(let j=i+1;j<clusters.length;j++){
      const b=clusters[j],sb=clusterStats(b);
      let dx=sb.center.x-sa.center.x,dy=sb.center.y-sa.center.y;
      const d=Math.max(1,Math.hypot(dx,dy));
      const ux=dx/d,uy=dy/d;
      const ea=directionalExtent(a,sa.center,ux,uy);
      const eb=directionalExtent(b,sb.center,-ux,-uy);
      const gap=d-ea-eb;

      const affinity=clusterAffinity(a,b);
      const safeGap=Math.max(0,gap);
      const distanceBoost=1+Math.min(2.5,safeGap/95);
      const proximity=1/Math.max(10,gap+34);
      const acceleration=Math.min(
        PHYSICS.clusterAttractionMax,
        PHYSICS.clusterAttraction
          *affinity
          *distanceBoost
          *(1+1250*proximity*proximity)
      );

      for(const p of particlesInCluster(a.id)){
        if(!p.locked){
          p.vx+=ux*acceleration*dt;
          p.vy+=uy*acceleration*dt;
        }
      }

      for(const p of particlesInCluster(b.id)){
        if(!p.locked){
          p.vx-=ux*acceleration*dt;
          p.vy-=uy*acceleration*dt;
        }
      }

      applyCrossClusterBubbleAttraction(a,b,gap,dt);

      if(!closest||gap<closest.gap){
        closest={a,b,gap,point:{x:sa.center.x+ux*ea,y:sa.center.y+uy*ea}};
      }
    }
  }

  if(closest&&closest.gap<=PHYSICS.mergeGap){
    mergeBoundaryPairNow(closest.a,closest.b,closest.point);
  }
}

function integrateParticles(dt){
  for(const p of aliveParticles()){
    if(p.locked)continue;
    p.vx*=Math.pow(PHYSICS.damping,dt);
    p.vy*=Math.pow(PHYSICS.damping,dt);
    const limited=clampMagnitude(p.vx,p.vy,PHYSICS.maxSpeed);
    p.vx=limited.x;p.vy=limited.y;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    const r=radiusForParticle(p)+8;
    p.x=Math.max(r,Math.min(stage.clientWidth-r,p.x));
    p.y=Math.max(190+r,Math.min(stage.clientHeight-125-r,p.y));

    p.el.style.left=p.x+"px";
    p.el.style.top=p.y+"px";
  }
}

function physicsFrame(now){
  const dt=Math.min(1.7,Math.max(.35,(now-state.lastPhysicsTime)/16.667));
  state.lastPhysicsTime=now;

  for(const cluster of state.clusters.values()){
    applyInternalForces(cluster,dt,now);
    applyAnchorForce(cluster,dt);
  }
  applySeparateClusterRepulsion(dt);
  applyMergingClusterForces(dt);
  integrateParticles(dt);
  updateBands();

  if(now>=state.resolutionCheckAt){
    state.resolutionCheckAt=now+180;
    checkMergeResolution();
  }

  requestAnimationFrame(physicsFrame);
}

function scheduleLifeMerge(a,b){
  if(a.locked||b.locked||!a.alive||!b.alive||a.clusterId!==b.clusterId)return;
  a.locked=b.locked=true;
  a.el.classList.add("merging");
  b.el.classList.add("merging");
  lifeMergePair(a,b);
}

async function lifeMergePair(a,b){
  const cluster=state.clusters.get(a.clusterId);
  if(!cluster)return;

  const startA={x:a.x,y:a.y};
  const startB={x:b.x,y:b.y};
  const ma=massForParticle(a);
  const mb=massForParticle(b);
  const totalMass=ma+mb;

  const target={
    x:(a.x*ma+b.x*mb)/Math.max(1,totalMass),
    y:(a.y*ma+b.y*mb)/Math.max(1,totalMass)
  };

  const value=particleValue100(a)+particleValue100(b);
  const lineage=(a.lineageCount||1)+(b.lineageCount||1);
  const termId=a.termId===b.termId?a.termId:null;
  const duration=190;
  const started=performance.now();

  await new Promise(resolve=>{
    function frame(now){
      const t=Math.min(1,(now-started)/duration);
      const q=t*t;

      a.x=startA.x+(target.x-startA.x)*q;
      a.y=startA.y+(target.y-startA.y)*q;
      b.x=startB.x+(target.x-startB.x)*q;
      b.y=startB.y+(target.y-startB.y)*q;

      if(a.el.isConnected){
        a.el.style.left=a.x+"px";
        a.el.style.top=a.y+"px";
      }

      if(b.el.isConnected){
        b.el.style.left=b.x+"px";
        b.el.style.top=b.y+"px";
      }

      if(t<1)requestAnimationFrame(frame);
      else resolve();
    }

    requestAnimationFrame(frame);
  });

  createBurst(target.x,target.y);

  const vanish=p=>p.core.animate(
    [
      {transform:"scale(1)",opacity:1},
      {transform:"scale(.08)",opacity:0}
    ],
    {
      duration:120,
      easing:"ease-in",
      fill:"forwards"
    }
  ).finished.catch(()=>{});

  await Promise.all([vanish(a),vanish(b)]);

  a.alive=false;
  b.alive=false;

  if(a.el.isConnected)a.el.remove();
  if(b.el.isConnected)b.el.remove();

  const lifeScale=cluster.mode==="merged"?.58:.78;
  const child=createBubbleFromValue(
    value,
    target.x,
    target.y,
    cluster.id,
    termId,
    lineage,
    lifeScale
  );

  child.vx=(a.vx+b.vx)*.18;
  child.vy=(a.vy+b.vy)*.18;

  maybeLifeClusterResolved(cluster.id);
}

function maybeLifeClusterResolved(clusterId){
  const cluster=state.clusters.get(clusterId);
  if(!cluster)return;

  const particles=particlesInCluster(clusterId);

  if(particles.length!==1)return;

  const only=particles[0];
  only.el.classList.remove("aging","seeking","merging");
  only.seekingId=null;

  if(state.mergeInProgress&&state.mergedClusterId===clusterId){
    checkMergeResolution();
    return;
  }

  if(cluster.termIds.size===1){
    setStatus(
      "Bu kümenin balonları birleşti: <strong>"
      +formatBubbleValue(particleValue100(only))
      +"</strong>. İstersen başka bir sayı açabilirsin."
    );
  }
}

function showJoinFlash(point){

  flash.className="band-join-flash";
  flash.style.left=point.x+"px";flash.style.top=point.y+"px";
  stage.appendChild(flash);
  setTimeout(()=>{if(flash.isConnected)flash.remove();},520);

async function removeNeutralMarkersFromCluster(clusterId){return;}

function mergeBoundaryPairNow(a,b,contactPoint){
  if(!state.mergeInProgress||state.mergedClusterId!==null)return;
  if(!state.clusters.has(a.id)||!state.clusters.has(b.id))return;

  showJoinFlash(contactPoint);

  const sa=clusterStats(a);
  const sb=clusterStats(b);
  const totalMass=sa.mass+sb.mass;
  const anchor={
    x:(sa.center.x*sa.mass+sb.center.x*sb.mass)/Math.max(1,totalMass),
    y:(sa.center.y*sa.mass+sb.center.y*sb.mass)/Math.max(1,totalMass)
  };

  const merged=createCluster([...a.termIds,...b.termIds],anchor);
  merged.mode="approaching";
  merged.joinedAt=0;

  for(const p of aliveParticles()){
    if(p.clusterId===a.id||p.clusterId===b.id)p.clusterId=merged.id;
  }

  for(const term of state.terms){
    if(term.clusterId===a.id||term.clusterId===b.id)term.clusterId=merged.id;
  }

  deleteCluster(a.id);
  deleteCluster(b.id);

  state.mergeClusterIds=state.mergeClusterIds.filter(id=>id!==a.id&&id!==b.id);
  state.mergeClusterIds.push(merged.id);

  /*
      Ara toplam 0'ı temsil eden nötr balon,
      gerçek balonlarla aynı kümeye girdiğinde
      yalnızca gösterim işareti olduğu için kaybolur.
  */
  removeNeutralMarkersFromCluster(merged.id);

  if(state.mergeClusterIds.length===1){
    merged.mode="merged";
    merged.joinedAt=performance.now();
    state.mergedClusterId=merged.id;
    setStatus("Tüm açık kümelerin sınırları birleşti. Baloncuklar boşlukları doldurarak dengeye geliyor…");
  }else{
    setStatus("İki lastik sınır birleşti. Yeni küme kalan kümeleri çekmeye devam ediyor…");
  }
}

/* =========================================================
   AÇ / KAPAT
   ========================================================= */
function updateInteractionText(){
  if(state.finalFlowing)return;
  if(state.mergeInProgress)return;
  const opened=openedTerms();
  if(opened.length===0)setStatus("İstediğin sayıyı aç.");
  else if(state.clusters.size===1){
    const cluster=[...state.clusters.values()][0];
    if(cluster.termIds.size===1)setStatus("Tek sayı açık. <strong>Kümeye veya balonuna tıklarsan kapanır.</strong> Balonlar kendi yaşamlarını sürdürür.");
    else setStatus("Ara sonuç kümesi açık. Kapalı sayı varsa onu da açabilirsin.");
  }
  else if(unopenedTerms().length>0)setStatus(state.clusters.size+" küme açık. <strong>Bir kümeye tıklarsan açık kümeler birbirini çekmeye başlayacak.</strong>");
  else setStatus("Bütün sayılar açık. <strong>Bir kümeye tıkla:</strong> kümeler fiziksel olarak birleşecek ve sonuç otomatik olarak aşağı dolacak.");
}

async function openTerm(termId){
  const term=state.terms.find(t=>t.id===termId);
  if(!term||term.opened||term.opening||term.closing)return;
  term.opened=true;term.opening=true;term.openedAt=performance.now();
  const index=state.terms.findIndex(t=>t.id===termId);
  const source=elementCenterInStage(term.card);
  const anchor=termAnchor(index);
  const cluster=createCluster([term.id],anchor);
  term.clusterId=cluster.id;
  term.card.classList.add("gone");
  updateInteractionText();

  const pieces=decomposeValue(term.value100);
  const points=seedLayout(pieces,anchor,termSegmentWidth());
  const generation=state.generation;
  term.openPromise=(async()=>{
    const jobs=[];
    for(let i=0;i<pieces.length;i++){
      if(generation!==state.generation)break;
      const piece=pieces[i];
      const p=createBubble(piece.sign,piece.unit,source.x,source.y,cluster.id,term.id);
      const target=points[i];
      const delay=i*5;
      jobs.push(new Promise(resolve=>{
        setTimeout(()=>{
          const dx=target.x-p.x,dy=target.y-p.y;
          p.vx=dx*.06;p.vy=dy*.06;
          resolve();
        },delay);
      }));
    }
    await Promise.all(jobs);
    await sleep(480);
    term.opening=false;term.openPromise=null;
    updateInteractionText();
  })();
  await term.openPromise;
}

async function closeSingleCluster(clusterId,explicit=false){
  if(!explicit)return;

  const cluster=state.clusters.get(clusterId);

  if(
    !cluster
    ||
    state.clusters.size!==1
    ||
    state.mergeInProgress
    ||
    cluster.termIds.size!==1
  )return;

  const termId=[...cluster.termIds][0];
  const term=state.terms.find(t=>t.id===termId);

  if(!term)return;

  /*
      Kendi kendine kapanma bug'ına karşı:
      kapanma yalnız gerçek kullanıcı tıklamasından gelir
      ve açılmanın hemen ardından aynı olay zinciriyle tetiklenemez.
  */
  if(performance.now()-(term.openedAt||0)<650)return;

  if(term.openPromise)await term.openPromise;

  term.closing=true;

  const target=elementCenterInStage(term.card);
  const particles=particlesInCluster(cluster.id);

  for(const p of particles){
    p.locked=true;
    p.vx=(target.x-p.x)*.10;
    p.vy=(target.y-p.y)*.10;
  }

  await sleep(430);

  for(const p of particles){
    p.alive=false;
    if(p.el.isConnected)p.el.remove();
  }

  deleteCluster(cluster.id);

  term.opened=false;
  term.closing=false;
  term.clusterId=null;
  term.card.classList.remove("gone");

  updateInteractionText();
}

async function handleClusterClick(clusterId,explicit=false){
  if(!explicit||state.finalFlowing||state.mergeInProgress)return;
  const cluster=state.clusters.get(clusterId);
  if(!cluster)return;
  if(state.clusters.size===1){
    await closeSingleCluster(clusterId,true);
    return;
  }
  await beginClusterMerge([...state.clusters.values()]);
}

/* =========================================================
   KÜME BİRLEŞMESİNİ BAŞLAT
   ========================================================= */
async function beginClusterMerge(clusters){
  if(state.mergeInProgress||clusters.length<2)return;
  state.mergeInProgress=true;
  state.mergeClusterIds=clusters.map(c=>c.id);
  state.mergeTermIds=[...new Set(clusters.flatMap(c=>[...c.termIds]))];
  state.mergedClusterId=null;
  for(const cluster of clusters)cluster.mode="approaching";
  setStatus("Kümeler birbirini çekiyor. Yaklaştıkça çekim artacak ve lastik sınırlar birleşecek…");
}

/* =========================================================
   ÇÖZÜM DENETİMİ
   ========================================================= */
function clearSplittable(){
  for(const p of aliveParticles()){
    p.splittable=false;
    p.el.classList.remove("splittable");
  }
}

function checkMergeResolution(){
  if(!state.mergeInProgress||state.mergedClusterId===null||state.finalFlowing)return;

  const cluster=state.clusters.get(state.mergedClusterId);

  if(!cluster||cluster.resolving)return;

  const particles=particlesInCluster(cluster.id).filter(p=>p.alive);

  if(particles.length!==1)return;

  cluster.resolving=true;

  resolveMergedCluster(cluster)
    .finally(()=>{
      const still=state.clusters.get(cluster.id);
      if(still)still.resolving=false;
    });
}

function mergeValue100(){
  return state.mergeTermIds.reduce((sum,id)=>{
    const term=state.terms.find(t=>t.id===id);
    return sum+(term?term.value100:0);
  },0);
}

async function resolveMergedCluster(cluster){
  if(!state.mergeInProgress||state.finalFlowing)return;
  const mergeSet=new Set(state.mergeTermIds);
  const otherTerms=state.terms.filter(t=>!mergeSet.has(t.id));
  const hasUnopened=otherTerms.some(t=>!t.opened);
  const hasOtherClusters=[...state.clusters.keys()].some(id=>id!==cluster.id);

  if(!hasUnopened&&!hasOtherClusters&&state.terms.every(t=>t.opened)){
    await flowFinalResult(cluster);
    return;
  }

  await settleIntermediateCluster(cluster);
}

async function settleIntermediateCluster(cluster){
  if(!state.mergeInProgress)return;
  const mergeSet=new Set(state.mergeTermIds);
  const indices=state.terms.map((t,i)=>mergeSet.has(t.id)?i:-1).filter(i=>i>=0);
  if(!indices.length)return;
  const insertIndex=Math.min(...indices);
  const value=mergeValue100();
  const newTerm=makeTerm(value,true,cluster.id);

  for(const p of particlesInCluster(cluster.id))p.termId=newTerm.id;
  if(value===0&&particlesInCluster(cluster.id).length===0){
    createBubble(0,0,cluster.anchor.x,cluster.anchor.y,cluster.id,newTerm.id);
  }

  cluster.termIds=new Set([newTerm.id]);
  cluster.mode="free";
  cluster.anchor={...clusterStats(cluster).center};

  const remaining=state.terms.filter(t=>!mergeSet.has(t.id));
  remaining.splice(insertIndex,0,newTerm);
  state.terms=remaining;

  state.mergeInProgress=false;
  state.mergeClusterIds=[];
  state.mergeTermIds=[];
  state.mergedClusterId=null;
  stage.style.height=calculateStageHeight()+"px";
  renderTerms();
  updateInteractionText();
}

/* =========================================================
   PARÇALAMA
   ========================================================= */
const nextSmallerUnit=unit=>unit===100?10:unit===10?1:null;

async function splitBubble(p){
  if(!p.alive||!p.splittable)return;
  const next=nextSmallerUnit(p.unit);
  if(!next||next<currentConfig().minUnit)return;
  p.splittable=false;p.el.classList.remove("splittable");
  const x=p.x,y=p.y,sign=p.sign,clusterId=p.clusterId,termId=p.termId;
  p.alive=false;
  const shrink=p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.1)",opacity:0}],{duration:170,easing:"ease-in",fill:"forwards"});
  try{await shrink.finished}catch(_){ }
  if(p.el.isConnected)p.el.remove();

  for(let i=0;i<10;i++){
    const angle=Math.PI*2*i/10;
    const r=radiusForUnit(next)*1.5;
    const child=createBubble(sign,next,x+Math.cos(angle)*r,y+Math.sin(angle)*r,clusterId,termId);
    child.vx=Math.cos(angle)*1.2;child.vy=Math.sin(angle)*1.2;
  }
  setStatus("Büyük balon 10 küçük balona ayrıldı. Simülasyon yeniden denge arıyor…");
}

async function onBubbleClick(p,explicit=false){
  if(!explicit||state.finalFlowing)return;

  if(state.mergeInProgress)return;

  const cluster=state.clusters.get(p.clusterId);

  if(cluster){
    await handleClusterClick(cluster.id,true);
  }
}


/* =========================================================
   SONUÇ KUTUSU
   ========================================================= */
function getBottomFrameContactPoint(p){
  const sr=stage.getBoundingClientRect(),fr=resultFrame.getBoundingClientRect();
  const left=fr.left-sr.left,top=fr.top-sr.top,cx=left+fr.width/2;
  const r=radiusForParticle(p);
  const half=Math.max(12,fr.width/2-r*.75-10);
  const offset=Math.max(-half,Math.min(half,(p.x-cx)*.28));
  return{x:cx+offset,y:top-r*.72};
}

function counterBump(){counterValue.classList.remove("bump");void counterValue.offsetWidth;counterValue.classList.add("bump");}

function fallToResult(p,startTime,duration,onImpact){
  return new Promise(resolve=>{
    const start={x:p.x,y:p.y};
    const target=getBottomFrameContactPoint(p);
    const control={x:start.x+(target.x-start.x)*.25,y:start.y+(target.y-start.y)*.52};
    function frame(now){
      if(now<startTime){requestAnimationFrame(frame);return;}
      const t=Math.max(0,Math.min(1,(now-startTime)/duration));
      const q=.1*t+.9*t*t;
      const inv=1-q;
      p.x=inv*inv*start.x+2*inv*q*control.x+q*q*target.x;
      p.y=inv*inv*start.y+2*inv*q*control.y+q*q*target.y;
      if(p.el.isConnected){p.el.style.left=p.x+"px";p.el.style.top=p.y+"px";}
      if(t<1){requestAnimationFrame(frame);return;}
      p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.05)",opacity:0}],{duration:80,easing:"ease-in",fill:"forwards"}).finished.catch(()=>{}).then(()=>{
        p.alive=false;if(p.el.isConnected)p.el.remove();onImpact(p);resolve();
      });
    }
    requestAnimationFrame(frame);
  });
}

async function flowFinalResult(cluster){
  if(state.finalFlowing)return;

  const particles=particlesInCluster(cluster.id).filter(p=>p.alive);

  if(particles.length!==1)return;

  const resultBubble=particles[0];
  const result=particleValue100(resultBubble);

  state.finalFlowing=true;
  resultBubble.locked=true;

  if(cluster.band)cluster.band.style.opacity="0";

  setStatus(
    "Bütün balonlar birleşti. Sonuç balonu: <strong>"
    +formatBubbleValue(result)
    +"</strong>."
  );

  /*
      Çocuk son birleşmiş balonu kısa bir süre görsün.
  */
  await sleep(650);

  resultFrame.classList.add("show","gravity-active");
  counterValue.textContent="0";

  await sleep(160);

  await fallToResult(
    resultBubble,
    performance.now()+20,
    620,
    ()=>{
      counterValue.textContent=formatBubbleValue(result);
      counterBump();
    }
  );

  counterValue.textContent=formatBubbleValue(result);
  counterBump();
  resultFrame.classList.remove("gravity-active");

  setStatus(
    "Sonuç: <strong>"
    +formatBubbleValue(result)
    +"</strong>."
  );
}


/* =========================================================
   YENİ İŞLEM / RENDER
   ========================================================= */
function clearSimulation(){
  for(const p of state.particles)if(p.el&&p.el.isConnected)p.el.remove();
  state.particles=[];
  for(const cluster of state.clusters.values())if(cluster.band&&cluster.band.isConnected)cluster.band.remove();
  state.clusters.clear();
  document.querySelectorAll(".annihilation-burst,.band-join-flash").forEach(el=>el.remove());
}

function newProblem(){
  state.generation++;
  clearSimulation();
  state.terms=[];
  state.nextTermId=1;
  state.nextClusterId=1;
  state.nextParticleId=1;
  state.mergeInProgress=false;
  state.mergeClusterIds=[];
  state.mergedClusterId=null;
  state.mergeTermIds=[];
  state.finalFlowing=false;
  resultFrame.className="result-frame";
  counterValue.textContent="0";

  for(let i=0;i<state.operandCount;i++)state.terms.push(makeTerm(generateValue100(),false,null));
  document.body.dataset.mode=state.level;
  stage.style.height=calculateStageHeight()+"px";
  renderTerms();
  updateInteractionText();
}

function renderTerms(){
  termLayer.innerHTML="";
  const centers=getCenterRatios(state.terms.length);
  for(let index=0;index<state.terms.length;index++){
    const term=state.terms[index];
    const card=document.createElement("button");
    card.className="term-card";
    card.style.left=(centers[index]*100)+"%";
    card.textContent=formatSigned(term.value100);
    card.dataset.termId=String(term.id);
    installCardPointerHandlers(card,term.id);
    termLayer.appendChild(card);
    term.card=card;
    if(term.opened)card.classList.add("gone");

    if(index<state.terms.length-1){
      const plus=document.createElement("div");
      plus.className="dynamic-plus";plus.textContent="+";
      plus.style.left=(((centers[index]+centers[index+1])/2)*100)+"%";
      termLayer.appendChild(plus);
    }
  }
}

function installCardPointerHandlers(card,termId){
  card.addEventListener("pointerdown",event=>{
    const term=state.terms.find(t=>t.id===termId);
    if(!term||term.opened||term.opening||term.closing)return;
    event.preventDefault();
    card.setPointerCapture(event.pointerId);
    const canDrag=!state.mergeInProgress&&openedTerms().length===0;
    state.drag={termId,pointerId:event.pointerId,startX:event.clientX,startLeft:card.offsetLeft,moved:false,canDrag};
    if(canDrag)card.classList.add("dragging");
  });

  card.addEventListener("pointermove",event=>{
    const d=state.drag;
    if(!d||d.termId!==termId||d.pointerId!==event.pointerId||!d.canDrag)return;
    const dx=event.clientX-d.startX;
    if(Math.abs(dx)>6)d.moved=true;
    card.style.left=Math.max(45,Math.min(stage.clientWidth-45,d.startLeft+dx))+"px";
  });

  card.addEventListener("pointerup",event=>{
    const d=state.drag;
    if(!d||d.termId!==termId||d.pointerId!==event.pointerId)return;
    card.classList.remove("dragging");
    state.drag=null;

    if(d.canDrag&&d.moved){
      const centers=getCenterRatios(state.terms.length).map(r=>r*stage.clientWidth);
      const x=card.offsetLeft;
      let targetIndex=0,best=Infinity;
      centers.forEach((cx,i)=>{const dist=Math.abs(cx-x);if(dist<best){best=dist;targetIndex=i;}});
      const currentIndex=state.terms.findIndex(t=>t.id===termId);
      const[item]=state.terms.splice(currentIndex,1);
      state.terms.splice(targetIndex,0,item);
      renderTerms();
      setStatus("Sıra değişti. Şimdi istediğin sayıyı aç.");
    }else{
      openTerm(termId);
    }
  });

  card.addEventListener("pointercancel",()=>{
    card.classList.remove("dragging");
    state.drag=null;
    if(openedTerms().length===0)renderTerms();
  });
}

/* =========================================================
   KONTROLLER
   ========================================================= */
newBtn.addEventListener("click",event=>{event.stopPropagation();newProblem();});
for(const button of levelButtons){
  button.addEventListener("click",event=>{
    event.stopPropagation();
    state.level=button.dataset.level;
    levelButtons.forEach(item=>item.classList.toggle("active",item===button));
    newProblem();
  });
}
settingsPanel.addEventListener("click",event=>event.stopPropagation());
aSlider.addEventListener("input",event=>{state.limitA=Number(event.target.value);aValue.textContent=String(state.limitA);});
aSlider.addEventListener("change",event=>{event.stopPropagation();state.limitA=Number(event.target.value);aValue.textContent=String(state.limitA);newProblem();});
countSlider.addEventListener("input",event=>{state.operandCount=Number(event.target.value);countValue.textContent=String(state.operandCount);});
countSlider.addEventListener("change",event=>{event.stopPropagation();state.operandCount=Number(event.target.value);countValue.textContent=String(state.operandCount);newProblem();});
window.addEventListener("resize",()=>{
  if(state.mergeInProgress)return;
  stage.style.height=calculateStageHeight()+"px";
  renderTerms();
});

requestAnimationFrame(physicsFrame);
newProblem();
})();
