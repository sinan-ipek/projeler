<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İşaretli Toplama</title>
<style>
:root{--bg:#f5f7fb;--text:#1d2433;--muted:#6f7787;--accent:#7c3aed;--shadow:0 18px 45px rgba(42,50,70,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{display:flex;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 15%,rgba(124,58,237,.08),transparent 28%),radial-gradient(circle at 82% 22%,rgba(37,99,235,.08),transparent 30%),var(--bg);-webkit-tap-highlight-color:transparent}
button,.particle-core,.merged-shell,input{-webkit-tap-highlight-color:transparent}.particle-core,.merged-shell{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{width:min(1060px,100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}.titlebox h1{margin:0;font-size:clamp(24px,3vw,38px);letter-spacing:-.04em}.titlebox p{margin:6px 0 0;color:var(--muted);font-size:14px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.level-btn,.new-btn,.home-btn{border:0;border-radius:13px;padding:10px 15px;font:inherit;font-weight:750;color:#3c4352;background:rgba(255,255,255,.84);box-shadow:0 6px 18px rgba(40,48,67,.08);cursor:pointer;text-decoration:none;transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease}.level-btn:hover,.new-btn:hover,.home-btn:hover{transform:translateY(-1px)}.level-btn.active{color:#fff;background:var(--text);box-shadow:0 8px 20px rgba(29,36,51,.18)}.new-btn{margin-left:4px;color:var(--accent)}.home-btn{display:inline-flex;align-items:center;justify-content:center}
.board{position:relative;min-height:610px;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:30px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);box-shadow:var(--shadow)}.stage{position:relative;width:100%;height:560px;overflow:hidden;transition:height .28s ease}.soft-orb{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(30px);opacity:.16;pointer-events:none}.soft-orb.one{left:-100px;top:20px;background:#60a5fa}.soft-orb.two{right:-120px;bottom:10px;background:#c084fc}
.settings-panel{position:absolute;top:14px;right:18px;z-index:70;display:grid;gap:7px;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(40,48,67,.09);backdrop-filter:blur(8px)}.setting-row{display:grid;grid-template-columns:58px 116px;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#4b5565}.setting-label{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap}.setting-value{min-width:19px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}.setting-slider{width:116px;accent-color:var(--accent);cursor:pointer}
.operand-layer{position:absolute;inset:0;z-index:5;pointer-events:none}.operand-card{position:absolute;top:154px;transform:translate(-50%,-50%);min-width:94px;padding:15px 16px;border:0;border-radius:18px;background:#fff;color:var(--text);font-size:clamp(24px,3vw,40px);font-weight:850;letter-spacing:-.04em;box-shadow:0 14px 30px rgba(30,38,56,.14);cursor:grab;z-index:22;pointer-events:auto;touch-action:none;transition:left .28s ease,transform .18s ease,opacity .25s ease,box-shadow .2s ease}.operand-card:hover{transform:translate(-50%,-52%) scale(1.025)}.operand-card.dragging{cursor:grabbing;z-index:50;transition:none;box-shadow:0 20px 40px rgba(30,38,56,.22)}.operand-card.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72)}.operand-card.opened{cursor:default}.dynamic-plus{position:absolute;top:154px;transform:translate(-50%,-50%);font-size:clamp(38px,4.8vw,60px);font-weight:500;color:#343b4b;opacity:.36;pointer-events:none;z-index:19;transition:left .28s ease,opacity .3s ease,transform .3s ease}
.operand-shell{position:absolute;border-radius:25px;border:2px dashed rgba(75,85,110,.15);background:rgba(255,255,255,.18);box-shadow:inset 0 0 38px rgba(40,48,70,.025);opacity:0;transform:scale(.95);transform-origin:center;transition:opacity .35s ease,transform .6s cubic-bezier(.2,.8,.2,1),border-color .25s ease,box-shadow .25s ease;pointer-events:none;z-index:1}.operand-shell.visible{opacity:1;transform:scale(1)}.operand-shell.merge-ready{pointer-events:auto;cursor:pointer;border-color:rgba(124,58,237,.34);box-shadow:0 0 0 7px rgba(124,58,237,.035),inset 0 0 38px rgba(40,48,70,.025);animation:shellBreathe 1.55s ease-in-out infinite}.operand-shell.fusing{opacity:0;pointer-events:none;animation:none;transform:scale(.96)}
.merged-shell{position:absolute;border-radius:30px;border:2px solid rgba(124,58,237,.10);background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.48),rgba(255,255,255,.12));opacity:0;transform:scale(.84);transform-origin:center;pointer-events:none;z-index:2;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.85,.2,1),border-color .25s ease}.merged-shell.visible{opacity:1;transform:scale(1)}.merged-shell.ready{pointer-events:auto;cursor:pointer;border-color:rgba(124,58,237,.35);animation:shellBreathe 1.75s ease-in-out infinite}.merged-shell.counting{pointer-events:none;animation:none}.merged-shell.finished{opacity:0;transform:scale(.5)}
@keyframes shellBreathe{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 0 10px rgba(124,58,237,.035)}}
.particle-wrap{position:absolute;transform:translate(-50%,-50%);z-index:8;will-change:left,top,transform,opacity}.particle-core{display:grid;place-items:center;border-radius:999px;font-weight:850;letter-spacing:-.03em;border:1px solid rgba(255,255,255,.82);box-shadow:0 8px 20px rgba(35,45,70,.13),inset 0 1px 0 rgba(255,255,255,.75);animation:drift var(--drift-duration,5s) ease-in-out var(--drift-delay,0s) infinite alternate;will-change:transform,box-shadow,filter}
.particle-wrap.unit-100 .particle-core{width:60px;height:60px;font-size:21px}.particle-wrap.unit-10 .particle-core{width:46px;height:46px;font-size:15px}body[data-mode="medium"] .particle-wrap.unit-10 .particle-core{width:36px;height:36px;font-size:12px}.particle-wrap.unit-1 .particle-core{width:32px;height:32px;font-size:10px}.particle-wrap.positive .particle-core{color:#1748a5;background:linear-gradient(145deg,#eef6ff,#d8eaff)}.particle-wrap.negative .particle-core{color:#a41436;background:linear-gradient(145deg,#fff2f4,#ffdce3)}
.particle-wrap.matching{z-index:20}.particle-wrap.matching .particle-core{animation:none;filter:brightness(1.12) saturate(1.18)}.particle-wrap.positive.matching .particle-core{box-shadow:0 0 0 4px rgba(37,99,235,.12),0 0 24px rgba(37,99,235,.52),0 0 45px rgba(37,99,235,.22)}.particle-wrap.negative.matching .particle-core{box-shadow:0 0 0 4px rgba(225,29,72,.12),0 0 24px rgba(225,29,72,.52),0 0 45px rgba(225,29,72,.22)}.particle-wrap.splittable .particle-core{cursor:pointer;outline:3px solid rgba(124,58,237,.25);box-shadow:0 10px 24px rgba(124,58,237,.22);animation:drift var(--drift-duration,5s) ease-in-out var(--drift-delay,0s) infinite alternate,splitPulse 1.15s ease-in-out infinite}.particle-wrap.gravity-fall .particle-core{animation:none;outline:none}
@keyframes drift{from{transform:translate(calc(var(--dx,1.4px)*-1),calc(var(--dy,1.4px)*-1))}to{transform:translate(var(--dx,1.4px),var(--dy,1.4px))}}@keyframes splitPulse{0%,100%{filter:saturate(1)}50%{filter:saturate(1.15) brightness(1.035)}}
.match-line{position:absolute;height:3px;border-radius:999px;transform-origin:0 50%;pointer-events:none;z-index:12;opacity:0;background:linear-gradient(90deg,rgba(37,99,235,.18),rgba(37,99,235,.82),rgba(255,255,255,1),rgba(225,29,72,.82),rgba(225,29,72,.18));box-shadow:0 0 8px rgba(124,58,237,.28),0 0 14px rgba(255,255,255,.75);animation:lineAppear .10s ease-out forwards}@keyframes lineAppear{from{opacity:0;filter:blur(2px)}to{opacity:.95;filter:blur(0)}}
.annihilation-burst{position:absolute;width:0;height:0;pointer-events:none;z-index:28}.burst-core{position:absolute;left:0;top:0;width:20px;height:20px;transform:translate(-50%,-50%) scale(.1);border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 20%,#e6efff 35%,rgba(147,114,255,.65) 52%,rgba(124,58,237,.20) 69%,transparent 77%);box-shadow:0 0 18px rgba(255,255,255,1),0 0 34px rgba(124,58,237,.72);animation:burstCore .33s ease-out forwards}@keyframes burstCore{0%{transform:translate(-50%,-50%) scale(.15);opacity:.3}35%{transform:translate(-50%,-50%) scale(2);opacity:1}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}.burst-ring{position:absolute;left:0;top:0;width:24px;height:24px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:2px solid rgba(255,255,255,.95)}.burst-ring.one{animation:ringOne .38s ease-out forwards}.burst-ring.two{animation:ringTwo .48s .035s ease-out forwards}@keyframes ringOne{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}@keyframes ringTwo{from{transform:translate(-50%,-50%) scale(.2);opacity:.65}to{transform:translate(-50%,-50%) scale(4.8);opacity:0}}.burst-spark{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.95);animation:sparkFly .38s ease-out forwards}@keyframes sparkFly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(.1);opacity:0}}
.result-frame{position:absolute;left:50%;bottom:20px;width:174px;height:96px;transform:translateX(-50%) scale(.58);opacity:0;border:2px solid rgba(124,58,237,.24);border-radius:25px;background:rgba(255,255,255,.98);box-shadow:0 16px 38px rgba(30,38,56,.18);pointer-events:none;z-index:30;transition:opacity .25s ease,transform .38s cubic-bezier(.16,1.08,.34,1),box-shadow .3s ease,border-color .3s ease}.result-frame.show{opacity:1;transform:translateX(-50%) scale(1)}.result-frame.gravity-active{border-color:rgba(124,58,237,.38);box-shadow:0 16px 38px rgba(30,38,56,.18),0 -5px 28px rgba(124,58,237,.10)}.counter-value{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(35px,5vw,55px);font-weight:900;letter-spacing:-.05em}.counter-value.bump{animation:counterBump .16s ease-out}@keyframes counterBump{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.statusbar{min-height:90px;border-top:1px solid rgba(42,50,70,.13);display:flex;align-items:center;justify-content:center;padding:18px 24px 22px}.status{margin:0;text-align:center;font-size:15px;line-height:1.45;color:var(--muted)}.status strong{color:var(--text)}
@media(max-width:720px){body{padding:10px}.board{border-radius:22px}.settings-panel{top:10px;right:10px;padding:7px 8px}.setting-row{grid-template-columns:52px 90px;gap:6px;font-size:11px}.setting-slider{width:90px}.operand-card{top:142px;min-width:70px;padding:12px 9px;font-size:clamp(20px,6vw,29px)}.dynamic-plus{top:142px;font-size:36px}.particle-wrap.unit-100 .particle-core{width:52px;height:52px;font-size:18px}.particle-wrap.unit-10 .particle-core{width:41px;height:41px;font-size:14px}body[data-mode="medium"] .particle-wrap.unit-10 .particle-core{width:32px;height:32px;font-size:11px}.particle-wrap.unit-1 .particle-core{width:28px;height:28px;font-size:9px}.result-frame{width:158px;height:84px;bottom:18px}}
</style>
</head>
<body data-mode="basic">
<div class="app">
  <div class="topbar">
    <div class="titlebox"><h1>Bulutlarla Toplama</h1><p>İki sayıyı aç, buluta tıkla; sonra istediğin sayıyla devam et.</p></div>
    <div class="controls">
      <a class="home-btn" href="../index.html">Home</a>
      <button class="level-btn active" data-level="basic">Basit</button>
      <button class="level-btn" data-level="medium">Orta</button>
      <button class="level-btn" data-level="advanced">Gelişmiş</button>
      <button class="new-btn" id="newBtn">Yeni işlem</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="stage" id="stage">
      <div class="soft-orb one"></div><div class="soft-orb two"></div>
      <div class="settings-panel" id="settingsPanel">
        <div class="setting-row"><span class="setting-label">a = <span class="setting-value" id="aValue">20</span></span><input class="setting-slider" id="aSlider" type="range" min="5" max="50" step="1" value="20"></div>
        <div class="setting-row"><span class="setting-label">n = <span class="setting-value" id="countValue">2</span></span><input class="setting-slider" id="countSlider" type="range" min="2" max="4" step="1" value="2"></div>
      </div>
      <div class="operand-layer" id="operandLayer"></div>
      <div class="merged-shell" id="mergedShell"></div>
      <div class="result-frame" id="resultFrame"><div class="counter-value" id="counterValue">0</div></div>
    </div>
    <div class="statusbar"><p class="status" id="status"></p></div>
  </div>
</div>
<script>
(() => {
"use strict";
const board=document.getElementById("board"),stage=document.getElementById("stage"),operandLayer=document.getElementById("operandLayer"),mergedShell=document.getElementById("mergedShell"),resultFrame=document.getElementById("resultFrame"),counterValue=document.getElementById("counterValue"),statusEl=document.getElementById("status"),newBtn=document.getElementById("newBtn"),settingsPanel=document.getElementById("settingsPanel"),aSlider=document.getElementById("aSlider"),aValue=document.getElementById("aValue"),countSlider=document.getElementById("countSlider"),countValue=document.getElementById("countValue"),levelButtons=[...document.querySelectorAll(".level-btn")];
const LEVELS={basic:{precision:0,minUnit:100},medium:{precision:1,minUnit:10},advanced:{precision:2,minUnit:1}};
const state={level:"basic",limitA:20,operandCount:2,terms:[],nextTermId:1,particles:[],particleSerial:0,pairTermIds:[],mixingStarted:false,readyForPairResult:false,busy:false,activePairPromises:new Set(),drag:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const randomInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const randomSign=()=>Math.random()<.5?-1:1;
const currentConfig=()=>LEVELS[state.level];
const setStatus=html=>statusEl.innerHTML=html;
function generateValue100(){const a=Math.max(5,Math.min(50,state.limitA));if(state.level==="basic")return randomSign()*randomInt(1,a-1)*100;if(state.level==="medium"){let n;do{n=randomInt(1,a*10-1)}while(n%10===0);return randomSign()*n*10}let n;do{n=randomInt(1,a*100-1)}while(n%10===0);return randomSign()*n}
function formatSigned(v,p=currentConfig().precision){if(v===0)return(0).toFixed(p).replace(".",",");return(v>0?"+":"−")+(Math.abs(v)/100).toFixed(p).replace(".",",")}
function formatCounter(v){if(v===0)return"0";const p=v%100===0?0:v%10===0?1:2;return(v>0?"+":"−")+(Math.abs(v)/100).toFixed(p).replace(".",",")}
function particleLabel(sign,unit){const s=sign>0?"+":"−";return unit===100?s+"1":unit===10?s+"0,1":s+"0,01"}
function decomposeValue(v){const sign=v>=0?1:-1,p=[];let r=Math.abs(v),ones=Math.floor(r/100);r%=100;const tenths=Math.floor(r/10),hundredths=r%10;for(let i=0;i<ones;i++)p.push({sign,unit:100});for(let i=0;i<tenths;i++)p.push({sign,unit:10});for(let i=0;i<hundredths;i++)p.push({sign,unit:1});return p}
function particleRadiusByUnit(unit){const m=innerWidth<=720;if(unit===100)return m?26:30;if(unit===10){if(state.level==="medium")return m?16:18;return m?20.5:23}return m?14:16}
function getCenterRatios(count){if(count===1)return[.5];if(count===2)return[.30,.70];if(count===3)return[.18,.50,.82];return[.11,.37,.63,.89]}
function elementCenterInStage(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left+r.width/2-s.left,y:r.top+r.height/2-s.top}}
function estimateGridHeight(items,availableWidth){if(!items.length)return 80;let total=0,previous=null;for(const unit of[100,10,1]){const count=items.filter(item=>item.unit===unit).length;if(!count)continue;const r=particleRadiusByUnit(unit),cellX=r*2+10,cols=Math.max(1,Math.floor(availableWidth/cellX)),rows=Math.ceil(count/cols);if(previous!==null)total+=18;total+=rows*r*2+(rows-1)*8;previous=unit}return total}
function pieceBurden(term){return decomposeValue(term.value100).length}
function calculateRequiredStageHeight(){const width=Math.max(320,stage.clientWidth||board.clientWidth||900),segment=width/Math.max(1,state.terms.length);let initialMax=0;for(const t of state.terms)initialMax=Math.max(initialMax,estimateGridHeight(decomposeValue(t.value100),Math.max(70,segment-26)));const biggest=state.terms.slice().sort((a,b)=>pieceBurden(b)-pieceBurden(a)).slice(0,2),pairPieces=[];for(const t of biggest)pairPieces.push(...decomposeValue(t.value100));const merged=estimateGridHeight(pairPieces,Math.max(220,width*.86));return Math.max(560,initialMax+245,merged+280)}
function getTermGeometry(index){const width=stage.clientWidth,count=Math.max(1,state.terms.length),segment=width/count,term=state.terms[index],pieces=decomposeValue(term.value100),contentWidth=Math.max(70,segment-26),contentHeight=estimateGridHeight(pieces,contentWidth),top=205;return{cx:(index+.5)*segment,cy:top+contentHeight/2,rx:contentWidth/2,ry:Math.max(55,contentHeight/2)}}
function getPairGeometry(){const width=stage.clientWidth,items=aliveParticles(),contentWidth=Math.max(220,width*.86),contentHeight=estimateGridHeight(items,contentWidth),top=192;return{cx:width/2,cy:top+contentHeight/2,rx:contentWidth/2,ry:Math.max(80,contentHeight/2)}}
function applyShellGeometry(shell,g,padX=12,padY=14){shell.style.left=(g.cx-g.rx-padX)+"px";shell.style.top=(g.cy-g.ry-padY)+"px";shell.style.width=(g.rx*2+padX*2)+"px";shell.style.height=(g.ry*2+padY*2)+"px"}
function createGridCloudPoints(items,g){if(!items.length)return[];const points=new Array(items.length),rows=[],availableWidth=g.rx*2;for(const unit of[100,10,1]){const entries=items.map((item,originalIndex)=>({item,originalIndex})).filter(e=>e.item.unit===unit);if(!entries.length)continue;const r=particleRadiusByUnit(unit),cellX=r*2+10,maxCols=Math.max(1,Math.floor(availableWidth/cellX));for(let i=0;i<entries.length;i+=maxCols)rows.push({unit,r,cellX,entries:entries.slice(i,i+maxCols)})}let totalH=0;for(let i=0;i<rows.length;i++){totalH+=rows[i].r*2;if(i<rows.length-1)totalH+=rows[i+1].unit===rows[i].unit?8:18}let top=g.cy-totalH/2;for(let i=0;i<rows.length;i++){const row=rows[i],count=row.entries.length,rowW=(count-1)*row.cellX,startX=g.cx-rowW/2,y=top+row.r;for(let col=0;col<count;col++){const e=row.entries[col];points[e.originalIndex]={x:startX+col*row.cellX,y}}top+=row.r*2;if(i<rows.length-1)top+=rows[i+1].unit===row.unit?8:18}return points}
function clearParticles(){for(const p of state.particles)if(p.el&&p.el.isConnected)p.el.remove();state.particles=[];document.querySelectorAll(".match-line,.annihilation-burst").forEach(e=>e.remove())}
function resetPairVisuals(){clearParticles();mergedShell.className="merged-shell";mergedShell.removeAttribute("style");resultFrame.className="result-frame";counterValue.className="counter-value";counterValue.textContent="0";state.pairTermIds=[];state.mixingStarted=false;state.readyForPairResult=false;state.busy=false;state.activePairPromises=new Set()}
function makeTerm(value100){return{id:state.nextTermId++,value100,opened:false,opening:false,card:null,shell:null}}
function newProblem(){state.terms=[];for(let i=0;i<state.operandCount;i++)state.terms.push(makeTerm(generateValue100()));resetPairVisuals();document.body.dataset.mode=state.level;stage.style.height=calculateRequiredStageHeight()+"px";renderTerms();setStatus("İstediğin iki sayıyı aç. Sayıları sürükleyerek yerlerini değiştirebilirsin.")}
function renderTerms(){operandLayer.innerHTML="";const centers=getCenterRatios(state.terms.length);for(let i=0;i<state.terms.length;i++){const term=state.terms[i],shell=document.createElement("div");shell.className="operand-shell";shell.dataset.termId=String(term.id);shell.addEventListener("click",e=>{e.stopPropagation();if(openedTerms().length===2&&!state.mixingStarted&&!state.busy)mergeOpenedTerms()});operandLayer.appendChild(shell);const card=document.createElement("button");card.className="operand-card";card.style.left=(centers[i]*100)+"%";card.textContent=formatSigned(term.value100);card.dataset.termId=String(term.id);installCardPointerHandlers(card,term.id);operandLayer.appendChild(card);term.card=card;term.shell=shell;applyShellGeometry(shell,getTermGeometry(i),10,12);if(term.opened){card.classList.add("gone","opened");shell.classList.add("visible")}if(i<state.terms.length-1){const plus=document.createElement("div");plus.className="dynamic-plus";plus.textContent="+";plus.style.left=(((centers[i]+centers[i+1])/2)*100)+"%";operandLayer.appendChild(plus)}}updateOpenedShellState()}
function installCardPointerHandlers(card,termId){card.addEventListener("pointerdown",e=>{if(state.busy||state.mixingStarted||openedTerms().length>0)return;e.preventDefault();card.setPointerCapture(e.pointerId);const rect=stage.getBoundingClientRect();state.drag={termId,pointerId:e.pointerId,startX:e.clientX,startLeft:card.offsetLeft,moved:false,stageLeft:rect.left};card.classList.add("dragging")});card.addEventListener("pointermove",e=>{const d=state.drag;if(!d||d.termId!==termId||d.pointerId!==e.pointerId)return;const dx=e.clientX-d.startX;if(Math.abs(dx)>6)d.moved=true;const x=Math.max(45,Math.min(stage.clientWidth-45,d.startLeft+dx));card.style.left=x+"px"});card.addEventListener("pointerup",e=>{const d=state.drag;if(!d||d.termId!==termId)return;card.classList.remove("dragging");state.drag=null;if(d.moved){const centers=getCenterRatios(state.terms.length).map(r=>r*stage.clientWidth),x=card.offsetLeft;let targetIndex=0,best=Infinity;centers.forEach((cx,i)=>{const dist=Math.abs(cx-x);if(dist<best){best=dist;targetIndex=i}});const currentIndex=state.terms.findIndex(t=>t.id===termId);const[item]=state.terms.splice(currentIndex,1);state.terms.splice(targetIndex,0,item);renderTerms();setStatus("Sıra değişti. Şimdi istediğin iki sayıyı aç.")}else openTerm(termId)});card.addEventListener("pointercancel",()=>{card.classList.remove("dragging");state.drag=null;renderTerms()})}
function openedTerms(){return state.terms.filter(t=>t.opened)}

async function moveParticle(p,x,y,duration=700,delay=0){if(!p.alive||!p.el.isConnected)return;const ox=p.x,oy=p.y;p.x=x;p.y=y;p.el.style.left=x+"px";p.el.style.top=y+"px";const a=p.el.animate([{transform:"translate(calc(-50% + "+(ox-x)+"px),calc(-50% + "+(oy-y)+"px))"},{transform:"translate(-50%,-50%)"}],{duration,delay,easing:"cubic-bezier(.18,.72,.22,1)",fill:"both"});try{await a.finished}catch(_){}p.el.style.transform="translate(-50%,-50%)";a.cancel()}

function createAnnihilationBurst(x,y){const burst=document.createElement("div");burst.className="annihilation-burst";burst.style.left=x+"px";burst.style.top=y+"px";for(const className of["burst-core","burst-ring one","burst-ring two"]){const e=document.createElement("div");e.className=className;burst.appendChild(e)}for(let i=0;i<10;i++){const s=document.createElement("div");s.className="burst-spark";const a=Math.PI*2*i/10,d=28+(i%3)*7;s.style.setProperty("--sx",Math.cos(a)*d+"px");s.style.setProperty("--sy",Math.sin(a)*d+"px");burst.appendChild(s)}stage.appendChild(burst);setTimeout(()=>{if(burst.isConnected)burst.remove()},600)}
async function annihilatePair(a,b){if(!a.alive||!b.alive)return;a.locked=b.locked=true;a.el.classList.add("matching");b.el.classList.add("matching");const line=createMatchLine(a,b);await sleep(75);const sA={x:a.x,y:a.y},sB={x:b.x,y:b.y},target={x:(sA.x+sB.x)/2,y:(sA.y+sB.y)/2},dx=sB.x-sA.x,dy=sB.y-sA.y,len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len,ny=dx/len,curve=Math.min(14,len*.055),cA={x:(sA.x+target.x)/2+nx*curve,y:(sA.y+target.y)/2+ny*curve},cB={x:(sB.x+target.x)/2-nx*curve,y:(sB.y+target.y)/2-ny*curve};await new Promise(resolve=>{const duration=330,started=performance.now();function frame(now){let t=(now-started)/duration;t=Math.max(0,Math.min(1,t));const q=.12*t+.88*t*t,pa=quadraticBezier(sA,cA,target,q),pb=quadraticBezier(sB,cB,target,q);a.x=pa.x;a.y=pa.y;b.x=pb.x;b.y=pb.y;a.el.style.left=pa.x+"px";a.el.style.top=pa.y+"px";b.el.style.left=pb.x+"px";b.el.style.top=pb.y+"px";updateMatchLine(line,pa.x,pa.y,pb.x,pb.y);const near=Math.max(0,(q-.45)/.55);a.core.style.filter="brightness("+(1.08+near*.48)+") saturate("+(1.12+near*.30)+")";b.core.style.filter=a.core.style.filter;if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(line.isConnected)line.remove();createAnnihilationBurst(target.x,target.y);const vanish=p=>p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.34)",opacity:1,offset:.2},{transform:"scale(.02)",opacity:0}],{duration:190,easing:"cubic-bezier(.25,.78,.35,1)",fill:"forwards"}).finished.catch(()=>{});await Promise.all([vanish(a),vanish(b)]);a.alive=b.alive=false;if(a.el.isConnected)a.el.remove();if(b.el.isConnected)b.el.remove()}
function scanForLiveMatches(){const alive=aliveParticles().filter(p=>!p.locked);for(const unit of[100,10,1]){const pos=alive.filter(p=>!p.locked&&p.unit===unit&&p.sign>0),neg=alive.filter(p=>!p.locked&&p.unit===unit&&p.sign<0);if(!pos.length||!neg.length)continue;const candidates=[];for(const p of pos)for(const n of neg)candidates.push({p,n,d:distanceBetween(p,n)});candidates.sort((a,b)=>a.d-b.d);const r=matchingRadius(unit);for(const c of candidates){if(c.p.locked||c.n.locked||!c.p.alive||!c.n.alive)continue;if(c.d<=r){c.p.locked=c.n.locked=true;const promise=annihilatePair(c.p,c.n).finally(()=>state.activePairPromises.delete(promise));state.activePairPromises.add(promise)}}}}

function aliveParticles(){return state.particles.filter(p=>p.alive&&p.el.isConnected)}

function clearSplittableMarks(){for(const p of aliveParticles()){p.splittable=false;p.el.classList.remove("splittable")}}
function evaluateMergedState(){clearSplittableMarks();const alive=aliveParticles(),signs=new Set(alive.map(p=>p.sign));if(signs.size<=1){state.readyForPairResult=true;mergedShell.classList.add("ready");setStatus(alive.length===0?'Ara sonuç 0. <strong>Sonuç bulutuna tıkla.</strong>':'Ara sonuç hazır. <strong>Sonuç bulutuna tıkla.</strong>');return}state.readyForPairResult=false;mergedShell.classList.remove("ready");const min=currentConfig().minUnit;let marked=0;for(const p of alive){if(p.unit<=min)continue;const opp=alive.some(o=>o.sign===-p.sign&&o.unit<p.unit);if(opp){p.splittable=true;p.el.classList.add("splittable");marked++}}if(marked)setStatus('Eş olmayan basamaklar kaldı. <strong>Parlayan büyük birime tıkla.</strong>')}
const nextSmallerUnit=unit=>unit===100?10:unit===10?1:null;
async function splitParticle(p){if(!p.alive||!p.splittable||state.busy)return;const next=nextSmallerUnit(p.unit);if(!next||next<currentConfig().minUnit)return;state.busy=true;clearSplittableMarks();const x=p.x,y=p.y,sign=p.sign;p.alive=false;const shrink=p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.1)",opacity:0}],{duration:180,easing:"ease-in",fill:"forwards"});try{await shrink.finished}catch(_){}if(p.el.isConnected)p.el.remove();const children=[],r=particleRadiusByUnit(next),gap=r*2+7,cols=5,totalW=(cols-1)*gap,startX=x-totalW/2,startY=y-gap/2;for(let i=0;i<10;i++){const col=i%cols,row=Math.floor(i/cols),child=createParticle(sign,next,x,y,-1);children.push({child,x:startX+col*gap,y:startY+row*gap})}await Promise.all(children.map((c,i)=>moveParticle(c.child,c.x,c.y,430,i*8)));await finishRemainingMatchesForUnit(next);await reflowMergedParticles(320);state.busy=false;evaluateMergedState()}

function getBottomFrameContactPoint(p){const sr=stage.getBoundingClientRect(),fr=resultFrame.getBoundingClientRect(),left=fr.left-sr.left,top=fr.top-sr.top,cx=left+fr.width/2,r=particleRadiusByUnit(p.unit),half=Math.max(12,fr.width/2-r*.75-10),off=Math.max(-half,Math.min(half,(p.x-cx)*.28));return{x:cx+off,y:top-r*.72}}
