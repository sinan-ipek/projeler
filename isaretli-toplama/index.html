<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İşaretli Toplama — Baloncuk Simülasyonu</title>
<style>
:root{
  --bg:#f5f7fb;
  --text:#1d2433;
  --muted:#6f7787;
  --accent:#7c3aed;
  --stage:#e5e8ed;
  --band:#8993a2;
  --band-fill:rgba(255,255,255,.72);
  --shadow:0 18px 45px rgba(42,50,70,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  display:flex;justify-content:center;padding:24px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 15%,rgba(124,58,237,.08),transparent 28%),
    radial-gradient(circle at 82% 22%,rgba(37,99,235,.08),transparent 30%),
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
button,input,.bubble-core{-webkit-tap-highlight-color:transparent}
.app{width:min(1080px,100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.titlebox h1{margin:0;font-size:clamp(24px,3vw,38px);letter-spacing:-.04em}
.titlebox p{margin:6px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.level-btn,.new-btn,.home-btn{
  border:0;border-radius:13px;padding:10px 15px;font:inherit;font-weight:750;color:#3c4352;
  background:rgba(255,255,255,.86);box-shadow:0 6px 18px rgba(40,48,67,.08);cursor:pointer;text-decoration:none;
  transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.level-btn:hover,.new-btn:hover,.home-btn:hover{transform:translateY(-1px)}
.level-btn.active{color:#fff;background:var(--text);box-shadow:0 8px 20px rgba(29,36,51,.18)}
.new-btn{margin-left:4px;color:var(--accent)}
.home-btn{display:inline-flex;align-items:center;justify-content:center}
.board{position:relative;min-height:680px;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:30px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.stage{position:relative;width:100%;height:650px;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.44),transparent 34%),var(--stage);transition:height .28s ease}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(93,102,120,.03))}
.settings-panel{position:absolute;top:14px;right:18px;z-index:100;display:grid;gap:7px;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.93);box-shadow:0 6px 18px rgba(40,48,67,.09);backdrop-filter:blur(8px)}
.setting-row{display:grid;grid-template-columns:58px 116px;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#4b5565}
.setting-label{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap}.setting-value{min-width:19px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}.setting-slider{width:116px;accent-color:var(--accent);cursor:pointer}
.term-layer{position:absolute;inset:0;z-index:35;pointer-events:none}
.term-card{position:absolute;top:148px;transform:translate(-50%,-50%);min-width:94px;padding:15px 16px;border:0;border-radius:18px;background:#fff;color:var(--text);font-size:clamp(24px,3vw,40px);font-weight:850;letter-spacing:-.04em;box-shadow:0 14px 30px rgba(30,38,56,.14);cursor:grab;z-index:45;pointer-events:auto;touch-action:none;transition:left .28s ease,transform .18s ease,opacity .25s ease,box-shadow .2s ease}
.term-card:hover{transform:translate(-50%,-52%) scale(1.025)}.term-card.dragging{cursor:grabbing;z-index:90;transition:none;box-shadow:0 20px 40px rgba(30,38,56,.22)}.term-card.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72)}
.dynamic-plus{position:absolute;top:148px;transform:translate(-50%,-50%);font-size:clamp(38px,4.8vw,60px);font-weight:500;color:#343b4b;opacity:.34;pointer-events:none;z-index:34;transition:opacity .22s ease,transform .22s ease}.dynamic-plus.fade-away{opacity:0;transform:translate(-50%,-50%) scale(.78)}
.band-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:8;
  overflow:visible;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
}
.cluster-band{
  fill:var(--band-fill);
  stroke:var(--band);
  stroke-width:2.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:1 5.5;
  vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 5px 9px rgba(55,65,81,.10));
  pointer-events:visiblePainted;
  cursor:grab;
  touch-action:none;
  transition:stroke .18s ease,fill .18s ease,opacity .24s ease,stroke-dashoffset .18s ease
}

.cluster-band.forming{
  opacity:0;
}
.cluster-band.dragging{
  cursor:grabbing;
  stroke:#6257aa;
  stroke-dashoffset:4;
  filter:drop-shadow(0 7px 13px rgba(72,61,135,.20))
}
.cluster-band.single{stroke:#7f8999}.cluster-band.mergeable{stroke:#6d65a8;fill:rgba(255,255,255,.78);filter:drop-shadow(0 5px 9px rgba(55,65,81,.10)) drop-shadow(0 0 7px rgba(124,58,237,.16))}
.match-line{
  position:absolute;
  height:4px;
  border-radius:999px;
  transform-origin:0 50%;
  pointer-events:none;
  z-index:92;
  opacity:0;
  background:linear-gradient(90deg,rgba(37,99,235,.20),rgba(37,99,235,.92),#fff,rgba(225,29,72,.92),rgba(225,29,72,.20));
  box-shadow:0 0 8px rgba(124,58,237,.34),0 0 16px rgba(255,255,255,.82);
  clip-path:inset(0 50% 0 50%);
  animation:
    matchLineDraw .17s ease-out forwards,
    matchLinePulse .52s .17s ease-in-out infinite alternate
}
.match-line::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  width:12px;
  height:12px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  box-shadow:0 0 8px #fff,0 0 15px rgba(124,58,237,.85);
  animation:matchSparkTravel .62s .08s ease-in-out infinite alternate
}
.match-line::after{
  content:"";
  position:absolute;
  inset:-4px 0;
  border-radius:999px;
  background:inherit;
  filter:blur(6px);
  opacity:.38
}
@keyframes matchLineDraw{
  from{
    opacity:0;
    filter:blur(3px);
    clip-path:inset(0 50% 0 50%);
  }
  to{
    opacity:.98;
    filter:blur(0);
    clip-path:inset(0 0 0 0);
  }
}
@keyframes matchLinePulse{
  from{
    box-shadow:0 0 7px rgba(124,58,237,.30),0 0 13px rgba(255,255,255,.72)
  }
  to{
    box-shadow:0 0 13px rgba(124,58,237,.58),0 0 24px rgba(255,255,255,.98)
  }
}
@keyframes matchSparkTravel{
  from{left:4%;opacity:.72}
  to{left:96%;opacity:1}
}

.match-line.slow-match{
  height:5px;
  opacity:1;
  background:
    linear-gradient(
      90deg,
      rgba(37,99,235,.35),
      rgba(37,99,235,1),
      #fff 46%,
      #fff 54%,
      rgba(225,29,72,1),
      rgba(225,29,72,.35)
    );
  box-shadow:
    0 0 10px rgba(124,58,237,.45),
    0 0 22px rgba(255,255,255,.98),
    0 0 34px rgba(124,58,237,.30);
}
.match-line.slow-match::before{
  width:14px;
  height:14px;
  animation:
    matchSparkTravelSlow .72s ease-in-out infinite alternate;
}
@keyframes matchSparkTravelSlow{
  from{left:8%;opacity:.78}
  to{left:92%;opacity:1}
}
.annihilation-burst{position:absolute;width:0;height:0;pointer-events:none;z-index:84}
.burst-core{
  position:absolute;left:0;top:0;width:18px;height:18px;
  transform:translate(-50%,-50%) scale(.1);border-radius:50%;
  background:radial-gradient(circle,#fff 0 20%,#eef4ff 28%,rgba(147,114,255,.72) 50%,rgba(124,58,237,.22) 68%,transparent 78%);
  box-shadow:0 0 18px #fff,0 0 34px rgba(124,58,237,.72);
  animation:burstCore .34s ease-out forwards
}
.burst-ring{
  position:absolute;left:0;top:0;width:22px;height:22px;
  transform:translate(-50%,-50%) scale(.2);
  border-radius:50%;border:2px solid rgba(255,255,255,.96)
}
.burst-ring.one{animation:ringOne .38s ease-out forwards}
.burst-ring.two{animation:ringTwo .50s .035s ease-out forwards}
.burst-spark{
  position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px rgba(255,255,255,.96);
  animation:sparkFly .40s ease-out forwards
}
@keyframes burstCore{
  0%{transform:translate(-50%,-50%) scale(.15);opacity:.25}
  38%{transform:translate(-50%,-50%) scale(2);opacity:1}
  100%{transform:translate(-50%,-50%) scale(4);opacity:0}
}
@keyframes ringOne{
  from{transform:translate(-50%,-50%) scale(.2);opacity:1}
  to{transform:translate(-50%,-50%) scale(3.2);opacity:0}
}
@keyframes ringTwo{
  from{transform:translate(-50%,-50%) scale(.2);opacity:.70}
  to{transform:translate(-50%,-50%) scale(4.8);opacity:0}
}
@keyframes sparkFly{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--sx),var(--sy)) scale(.1);opacity:0}
}
.band-join-flash,.merge-flash{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.2);z-index:80;border:2px solid rgba(255,255,255,.98);box-shadow:0 0 0 2px rgba(124,58,237,.22),0 0 18px rgba(124,58,237,.45),0 0 32px rgba(255,255,255,.95);animation:flash .46s ease-out forwards}
.band-join-flash{width:18px;height:18px}.merge-flash{width:24px;height:24px}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3)}}
.bubble-wrap{position:absolute;transform:translate(-50%,-50%);z-index:18;will-change:left,top,transform,opacity}
.bubble-core{display:grid;place-items:center;border-radius:999px;font-weight:850;letter-spacing:-.03em;border:1px solid rgba(255,255,255,.88);box-shadow:0 5px 12px rgba(35,45,70,.12),inset 0 1px 0 rgba(255,255,255,.82);user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;will-change:transform,filter,box-shadow;width:var(--diameter);height:var(--diameter);font-size:var(--font-size);transition:width .18s ease,height .18s ease,font-size .18s ease,background .2s ease,color .2s ease}
.bubble-wrap.positive .bubble-core{color:#1748a5;background:radial-gradient(circle at 35% 28%,#fff 0 9%,#edf6ff 22%,#d8eaff 74%,#c9def9 100%)}
.bubble-wrap.negative .bubble-core{color:#a41436;background:radial-gradient(circle at 35% 28%,#fff 0 9%,#fff0f3 22%,#ffdce3 74%,#f7cbd5 100%)}
.bubble-wrap.neutral .bubble-core{color:#616977;background:radial-gradient(circle at 35% 28%,#fff 0 9%,#f7f8fa 28%,#dde1e7 100%)}
.bubble-wrap.aging .bubble-core{animation:agingPulse .62s ease-in-out infinite alternate;filter:saturate(1.08)}
.bubble-wrap.seeking .bubble-core{box-shadow:0 0 0 4px rgba(124,58,237,.08),0 0 19px rgba(124,58,237,.23),inset 0 1px 0 rgba(255,255,255,.82)}
.bubble-wrap.splittable{z-index:82}
.bubble-wrap.splittable .bubble-core{
  outline:4px solid rgba(124,58,237,.78);
  box-shadow:
    0 0 0 7px rgba(124,58,237,.14),
    0 0 30px rgba(124,58,237,.58),
    0 0 52px rgba(124,58,237,.30),
    inset 0 1px 0 rgba(255,255,255,.88);
  animation:splitPulse .72s ease-in-out infinite alternate;
}
@keyframes splitPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.bubble-wrap.merging{z-index:72}
.bubble-wrap.merging .bubble-core{
  animation:annihilationCharge .48s ease-in-out infinite alternate;
  box-shadow:
    0 0 0 4px rgba(255,255,255,.28),
    0 0 17px rgba(124,58,237,.28),
    inset 0 1px 0 rgba(255,255,255,.90)
}
@keyframes annihilationCharge{
  from{
    box-shadow:
      0 0 0 3px rgba(255,255,255,.20),
      0 0 12px rgba(124,58,237,.20),
      inset 0 1px 0 rgba(255,255,255,.90)
  }
  to{
    box-shadow:
      0 0 0 5px rgba(255,255,255,.48),
      0 0 26px rgba(124,58,237,.50),
      inset 0 1px 0 rgba(255,255,255,.96)
  }
}.stage.annihilation-focus-mode .bubble-wrap:not(.annihilation-focus) .bubble-core{
  opacity:.58;
  filter:saturate(.72) brightness(.98);
  transition:opacity .16s ease,filter .16s ease;
}
.stage.annihilation-focus-mode .annihilation-focus .bubble-core{
  opacity:1;
}

.zero-flash{
  position:absolute;
  transform:translate(-50%,-50%) scale(.72);
  z-index:96;
  pointer-events:none;
  font-weight:900;
  font-size:22px;
  color:#4b5563;
  text-shadow:0 0 7px #fff,0 0 14px rgba(255,255,255,.98);
  animation:zeroFlash .44s ease-out forwards;
}
@keyframes zeroFlash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  28%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  72%{opacity:.95;transform:translate(-50%,-60%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-86%) scale(.82)}
}

.bubble-wrap.annihilation-focus{z-index:78}.bubble-wrap.annihilation-focus .bubble-core{box-shadow:0 0 0 4px rgba(255,255,255,.55),0 0 24px rgba(124,58,237,.36),inset 0 1px 0 rgba(255,255,255,.9)}
.bubble-wrap.final-result{z-index:88}
.bubble-wrap.final-result .bubble-core{
  box-shadow:0 0 0 6px rgba(124,58,237,.09),0 0 32px rgba(124,58,237,.30),inset 0 1px 0 rgba(255,255,255,.9);
  animation:finalResultPulse 1.35s ease-in-out infinite alternate;
}
@keyframes finalResultPulse{from{transform:scale(1)}to{transform:scale(1.075)}}
@keyframes agingPulse{from{transform:scale(1)}to{transform:scale(1.055)}}
.statusbar{min-height:90px;border-top:1px solid rgba(42,50,70,.13);display:flex;align-items:center;justify-content:center;padding:18px 24px 22px;background:rgba(255,255,255,.86)}.status{margin:0;text-align:center;font-size:15px;line-height:1.45;color:var(--muted)}.status strong{color:var(--text)}
@media(max-width:720px){body{padding:10px}.board{border-radius:22px}.settings-panel{top:10px;right:10px;padding:7px 8px}.setting-row{grid-template-columns:52px 90px;gap:6px;font-size:11px}.setting-slider{width:90px}.term-card{top:140px;min-width:70px;padding:12px 9px;font-size:clamp(20px,6vw,29px)}.dynamic-plus{top:140px;font-size:36px}}
</style>
</head>
<body data-mode="basic">
<div class="app">
  <div class="topbar">
    <div class="titlebox">
      <h1>Bulutlarla Toplama</h1>
      <p>Baloncuklar fiziksel olarak etkileşir; sayısal birleşme yalnız sonuç aşamasında gerçekleşir.</p>
    </div>
    <div class="controls">
      <a class="home-btn" href="../index.html">Home</a>
      <button class="level-btn active" data-level="basic">Basit</button>
      <button class="level-btn" data-level="medium">Orta</button>
      <button class="level-btn" data-level="advanced">Gelişmiş</button>
      <button class="new-btn" id="newBtn">Yeni işlem</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="stage" id="stage">
      <div class="settings-panel" id="settingsPanel">
        <div class="setting-row">
          <span class="setting-label">a = <span class="setting-value" id="aValue">20</span></span>
          <input class="setting-slider" id="aSlider" type="range" min="5" max="50" step="1" value="20" aria-label="a sınırı">
        </div>
        <div class="setting-row">
          <span class="setting-label">n = <span class="setting-value" id="countValue">2</span></span>
          <input class="setting-slider" id="countSlider" type="range" min="2" max="4" step="1" value="2" aria-label="Toplanan sayı adedi">
        </div>
      </div>

      <svg class="band-layer" id="bandLayer" aria-hidden="true"><g id="clusterBandGroup"></g></svg>
      <div class="term-layer" id="termLayer"></div>
    </div>
    <div class="statusbar"><p class="status" id="status"></p></div>
  </div>
</div>

<script>
(() => {
"use strict";

const stage=document.getElementById("stage");
const board=document.getElementById("board");
const termLayer=document.getElementById("termLayer");
const clusterBandGroup=document.getElementById("clusterBandGroup");
const statusEl=document.getElementById("status");
const newBtn=document.getElementById("newBtn");
const settingsPanel=document.getElementById("settingsPanel");
const aSlider=document.getElementById("aSlider");
const aValue=document.getElementById("aValue");
const countSlider=document.getElementById("countSlider");
const countValue=document.getElementById("countValue");
const levelButtons=[...document.querySelectorAll(".level-btn")];

const LEVELS={
  basic:{precision:0,minUnit:100},
  medium:{precision:1,minUnit:10},
  advanced:{precision:2,minUnit:1}
};

const PHYSICS={
  damping:.91,
  centerCohesion:.00118,
  attraction:.00195,
  sameSizeMultiplier:1,
  oppositeSignMultiplier:1,
  overlapSpring:.088,
  nearContactSpring:.010,
  tangentialSlide:.0019,
  clusterAttraction:.023,
  clusterAttractionMax:.40,
  clusterRepulsion:.032,
  maxSpeed:11.2,
  dragMaxSpeed:16.5,
  boundaryOffset:0,
  mergeGap:2.5,
  lifeSeekAt:.68,
  lifeUrgentAt:.86,
  dragSpring:.038,
  dragVelocityCoupling:.095,
  dragInertia:.028
};

const state={
  level:"basic",
  limitA:20,
  operandCount:2,
  terms:[],
  clusters:new Map(),
  bubbles:[],
  nextTermId:1,
  nextClusterId:1,
  nextBubbleId:1,
  mergeInProgress:false,
  mergeClusterIds:[],
  mergedClusterId:null,
  drag:null,
  generation:0,
  lastPhysicsTime:performance.now(),
  finalAggregation:false,
  finalDone:false,
  finalClusterId:null,
  resolutionCheckAt:0,
  explicitCloseArmedAt:0,
  finalReady:false,
  clusterDrag:null
};

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const randomInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const randomSign=()=>Math.random()<.5?-1:1;
const currentConfig=()=>LEVELS[state.level];
const setStatus=html=>statusEl.innerHTML=html;

function generateValue100(){
  const a=Math.max(5,Math.min(50,state.limitA));
  if(state.level==="basic")return randomSign()*randomInt(1,a-1)*100;
  if(state.level==="medium"){
    let n;do{n=randomInt(1,a*10-1)}while(n%10===0);
    return randomSign()*n*10;
  }
  let n;do{n=randomInt(1,a*100-1)}while(n%10===0);
  return randomSign()*n;
}

function formatSigned(value100,precision=currentConfig().precision){
  if(value100===0)return(0).toFixed(precision).replace(".",",");
  return(value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(precision).replace(".",",");
}

function formatBubbleValue(value100){
  if(value100===0)return"0";
  const p=value100%100===0?0:value100%10===0?1:2;
  return(value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(p).replace(".",",");
}

function decomposeValue(value100){
  if(value100===0)return[0];
  const sign=value100>0?1:-1;
  const out=[];
  let rest=Math.abs(value100);
  const ones=Math.floor(rest/100);rest%=100;
  const tenths=Math.floor(rest/10);const hundredths=rest%10;
  for(let i=0;i<ones;i++)out.push(sign*100);
  for(let i=0;i<tenths;i++)out.push(sign*10);
  for(let i=0;i<hundredths;i++)out.push(sign);
  return out;
}

function bubbleRadius(value100){
  const mobile=innerWidth<=720;
  const a=Math.abs(value100);
  let base;
  if(a>=100)base=mobile?21:24;
  else if(a>=10)base=mobile?16:18;
  else if(a>0)base=mobile?12:13;
  else base=mobile?16:18;
  const unitCount=Math.max(1,a/Math.max(1,currentConfig().minUnit));
  const extra=Math.min(mobile?10:13,Math.log2(unitCount+1)*(mobile?2.1:2.55));
  return base+extra;
}

function bubbleFontSize(value100){
  const r=bubbleRadius(value100);
  return Math.max(10,Math.min(20,r*.55));
}

function bubbleMass(b){const r=bubbleRadius(b.value100);return Math.max(1,r*r)}

function getCenterRatios(count){
  if(count===1)return[.5];
  if(count===2)return[.28,.72];
  if(count===3)return[.17,.50,.83];
  return[.10,.365,.635,.90];
}

function termSegmentWidth(){return Math.max(82,stage.clientWidth/Math.max(1,state.terms.length)-30)}
function termAnchor(index){const count=Math.max(1,state.terms.length),segment=stage.clientWidth/count;return{x:(index+.5)*segment,y:285}}
function calculateStageHeight(){return innerWidth<=720?650:680}
function elementCenterInStage(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left+r.width/2-s.left,y:r.top+r.height/2-s.top}}

function seedLayout(values,center,width){
  const points=[];
  const radii=values.map(v=>bubbleRadius(v));
  const maxR=Math.max(...radii,20);
  const dx=maxR*2;
  const dy=Math.sqrt(3)*maxR;
  const cols=Math.max(1,Math.floor(Math.max(dx,width-maxR)/dx));
  const rows=Math.ceil(values.length/cols);
  const totalH=Math.max(maxR*2,(rows-1)*dy+maxR*2);
  let cursor=0;
  for(let row=0;row<rows;row++){
    const take=Math.min(cols,values.length-cursor);
    const rowW=(take-1)*dx+(row%2?maxR:0);
    const startX=center.x-rowW/2;
    for(let col=0;col<take;col++){
      const rawX=startX+col*dx+(row%2?maxR:0);
      const rawY=center.y-totalH/2+maxR+row*dy;
      const birthSpread=.52;

      points[cursor++]={
        x:center.x+(rawX-center.x)*birthSpread,
        y:center.y+(rawY-center.y)*birthSpread
      };
    }
  }
  return points;
}

function cross(o,a,b){return(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x)}
function convexHull(points){
  if(points.length<=2)return points.slice();
  const sorted=points.slice().sort((a,b)=>a.x===b.x?a.y-b.y:a.x-b.x);
  const lower=[];for(const p of sorted){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p)}
  const upper=[];for(let i=sorted.length-1;i>=0;i--){const p=sorted[i];while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p)}
  lower.pop();upper.pop();return lower.concat(upper);
}
function smoothClosedPath(points){
  if(!points.length)return"";
  if(points.length===1)return`M ${points[0].x} ${points[0].y}`;
  const mids=points.map((p,i)=>{const n=points[(i+1)%points.length];return{x:(p.x+n.x)/2,y:(p.y+n.y)/2}});
  let d=`M ${mids[mids.length-1].x.toFixed(2)} ${mids[mids.length-1].y.toFixed(2)}`;
  for(let i=0;i<points.length;i++)d+=` Q ${points[i].x.toFixed(2)} ${points[i].y.toFixed(2)} ${mids[i].x.toFixed(2)} ${mids[i].y.toFixed(2)}`;
  return d+" Z";
}
function rubberBandPath(bubbles,fallback){
  if(!bubbles.length){
    if(!fallback)return"";

    const points=[];
    for(let i=0;i<48;i++){
      const angle=Math.PI*2*i/48;
      points.push({
        x:fallback.x+Math.cos(angle)*27,
        y:fallback.y+Math.sin(angle)*27
      });
    }

    return denseClosedPath(points);
  }

  let totalMass=0;
  let centerX=0;
  let centerY=0;

  for(const bubble of bubbles){
    const mass=bubbleMass(bubble);

    totalMass+=mass;
    centerX+=bubble.x*mass;
    centerY+=bubble.y*mass;
  }

  const center={
    x:centerX/Math.max(1,totalMass),
    y:centerY/Math.max(1,totalMass)
  };

  const steps=84;
  const radii=new Array(steps).fill(NaN);

  /*
    Her yönde, merkezden çıkan ışının gerçek balon çevreleriyle
    kesiştiği en dış noktayı buluyoruz. Böylece sınır, eski
    "destek düzlemi" yaklaşımı gibi gereksiz yere şişmiyor.
  */
  for(let i=0;i<steps;i++){
    const angle=Math.PI*2*i/steps;
    const ux=Math.cos(angle);
    const uy=Math.sin(angle);

    let farthest=-Infinity;

    for(const bubble of bubbles){
      const radius=
        bubbleRadius(bubble.value100)+
        PHYSICS.boundaryOffset;

      const cx=bubble.x-center.x;
      const cy=bubble.y-center.y;

      const along=
        cx*ux+
        cy*uy;

      const perpendicularSquared=Math.max(
        0,
        cx*cx+
        cy*cy-
        along*along
      );

      const radiusSquared=
        radius*
        radius;

      if(perpendicularSquared>radiusSquared){
        continue;
      }

      const halfChord=Math.sqrt(
        Math.max(
          0,
          radiusSquared-
          perpendicularSquared
        )
      );

      const exitDistance=
        along+
        halfChord;

      if(exitDistance>0){
        farthest=Math.max(
          farthest,
          exitDistance
        );
      }
    }

    if(Number.isFinite(farthest)){
      radii[i]=farthest;
    }
  }

  /*
    Çok dar bir boğazda bir ışın hiçbir balona değmezse,
    iki yandaki gerçek çevre değerleri arasında dairesel
    interpolasyon yapıyoruz.
  */
  for(let i=0;i<steps;i++){
    if(Number.isFinite(radii[i]))continue;

    let previousIndex=null;
    let nextIndex=null;

    for(let offset=1;offset<steps;offset++){
      const index=(i-offset+steps)%steps;

      if(Number.isFinite(radii[index])){
        previousIndex=index;
        break;
      }
    }

    for(let offset=1;offset<steps;offset++){
      const index=(i+offset)%steps;

      if(Number.isFinite(radii[index])){
        nextIndex=index;
        break;
      }
    }

    if(previousIndex!==null&&nextIndex!==null){
      radii[i]=
        (
          radii[previousIndex]+
          radii[nextIndex]
        )/
        2;
    }
    else if(previousIndex!==null){
      radii[i]=radii[previousIndex];
    }
    else if(nextIndex!==null){
      radii[i]=radii[nextIndex];
    }
    else{
      radii[i]=27;
    }
  }

  /*
    Çok hafif dairesel yumuşatma:
    keskin sayısal kırılmaları alır ama bandı balonlardan
    uzaklaştıracak kadar şişirmez.
  */
  for(let pass=0;pass<2;pass++){
    const copy=radii.slice();

    for(let i=0;i<steps;i++){
      const previous=
        copy[(i-1+steps)%steps];

      const current=
        copy[i];

      const next=
        copy[(i+1)%steps];

      const smoothed=
        previous*.16+
        current*.68+
        next*.16;

      radii[i]=Math.max(
        current-3.2,
        Math.min(
          current+3.2,
          smoothed
        )
      );
    }
  }

  const points=[];

  for(let i=0;i<steps;i++){
    const angle=Math.PI*2*i/steps;

    points.push({
      x:center.x+Math.cos(angle)*radii[i],
      y:center.y+Math.sin(angle)*radii[i]
    });
  }

  return denseClosedPath(points);
}

function denseClosedPath(points){
  if(!points.length)return"";

  let d=
    "M "+
    points[0].x.toFixed(2)+
    " "+
    points[0].y.toFixed(2);

  for(let i=1;i<points.length;i++){
    d+=
      " L "+
      points[i].x.toFixed(2)+
      " "+
      points[i].y.toFixed(2);
  }

  return d+" Z";
}

function makeTerm(value100){return{id:state.nextTermId++,value100,opened:false,opening:false,closing:false,openPromise:null,card:null,clusterId:null,openedAt:0}}

function createCluster(termIds,anchor,{forming=false}={}){
  const id=state.nextClusterId++;
  const band=document.createElementNS("http://www.w3.org/2000/svg","path");
  band.setAttribute(
    "class",
    forming
      ?"cluster-band forming"
      :"cluster-band"
  );
  band.dataset.clusterId=String(id);
  clusterBandGroup.appendChild(band);

  const cluster={
    id,
    termIds:new Set(termIds),
    anchor:{...anchor},
    band,
    mode:"free",
    createdAt:performance.now(),
    forming,
    formingUntil:
      forming
        ?performance.now()+360
        :0,
    annihilating:false
  };

  state.clusters.set(id,cluster);
  installClusterPointerHandlers(band,id,null);
  return cluster;
}

function deleteCluster(id){const c=state.clusters.get(id);if(c?.band?.isConnected)c.band.remove();state.clusters.delete(id)}
function aliveBubbles(){return state.bubbles.filter(b=>b.alive&&b.el.isConnected)}
function bubblesInCluster(id){return aliveBubbles().filter(b=>b.clusterId===id)}
function openedTerms(){return state.terms.filter(t=>t.opened)}
function unopenedTerms(){return state.terms.filter(t=>!t.opened)}

function updateBubbleVisual(b){
  const r=bubbleRadius(b.value100);
  b.el.style.setProperty("--diameter",`${r*2}px`);
  b.el.style.setProperty("--font-size",`${bubbleFontSize(b.value100)}px`);
  b.core.textContent=formatBubbleValue(b.value100);
  b.el.classList.toggle("positive",b.value100>0);
  b.el.classList.toggle("negative",b.value100<0);
  b.el.classList.toggle("neutral",b.value100===0);
}

function createBubble(value100,x,y,clusterId,termId,lineageCount=1,lifeScale=1){
  const wrap=document.createElement("div");wrap.className="bubble-wrap";wrap.style.left=x+"px";wrap.style.top=y+"px";
  const core=document.createElement("div");core.className="bubble-core";wrap.appendChild(core);stage.appendChild(wrap);
  const now=performance.now();
  const baseLife=1500+Math.random()*1500;
  const b={id:state.nextBubbleId++,el:wrap,core,value100,x,y,vx:0,vy:0,clusterId,termId,lineageCount,birth:now,lifeSpan:baseLife*lifeScale,alive:true,locked:false,seekingId:null,lastTargetAt:0};
  updateBubbleVisual(b);
  state.bubbles.push(b);
  installClusterPointerHandlers(core,clusterId,b.id);
  return b;
}

function stagePointFromEvent(event){
  const rect=stage.getBoundingClientRect();
  return{x:event.clientX-rect.left,y:event.clientY-rect.top};
}

function installClusterPointerHandlers(element,clusterId,bubbleId=null){
  element.addEventListener("pointerdown",event=>{
    if(event.button!==undefined&&event.button!==0)return;

    const liveBubble=
      bubbleId!==null
        ? aliveBubbles().find(item=>item.id===bubbleId)
        : null;

    const liveClusterId=
      liveBubble
        ? liveBubble.clusterId
        : clusterId;

    const cluster=state.clusters.get(liveClusterId);
    if(!cluster)return;

    event.preventDefault();
    event.stopPropagation();

    const point=stagePointFromEvent(event);
    const stats=clusterStats(cluster);

    state.clusterDrag={
      clusterId:liveClusterId,
      bubbleId,
      pointerId:event.pointerId,
      startX:point.x,
      startY:point.y,
      lastX:point.x,
      lastY:point.y,
      lastTime:performance.now(),
      targetX:stats.center.x,
      targetY:stats.center.y,
      offsetX:stats.center.x-point.x,
      offsetY:stats.center.y-point.y,
      pointerVX:0,
      pointerVY:0,
      pointerAX:0,
      pointerAY:0,
      moved:false,
      localOffsets:new Map(
        bubblesInCluster(liveClusterId).map(item=>[
          item.id,
          {x:item.x-stats.center.x,y:item.y-stats.center.y}
        ])
      )
    };

    cluster.band?.classList.add("dragging");

    try{element.setPointerCapture?.(event.pointerId)}catch(_){}
  });
}

function updateClusterDrag(event){
  const drag=state.clusterDrag;
  if(!drag||drag.pointerId!==event.pointerId)return;

  event.preventDefault();

  const point=stagePointFromEvent(event);
  const now=performance.now();
  const frameScale=Math.max(.45,(now-drag.lastTime)/16.667);

  const vx=(point.x-drag.lastX)/frameScale;
  const vy=(point.y-drag.lastY)/frameScale;

  drag.pointerAX=vx-drag.pointerVX;
  drag.pointerAY=vy-drag.pointerVY;
  drag.pointerVX=drag.pointerVX*.55+vx*.45;
  drag.pointerVY=drag.pointerVY*.55+vy*.45;

  drag.lastX=point.x;
  drag.lastY=point.y;
  drag.lastTime=now;
  drag.targetX=point.x+drag.offsetX;
  drag.targetY=point.y+drag.offsetY;

  if(Math.hypot(point.x-drag.startX,point.y-drag.startY)>6){
    drag.moved=true;
  }
}

async function finishClusterDrag(event){
  const drag=state.clusterDrag;
  if(!drag||drag.pointerId!==event.pointerId)return;

  state.clusterDrag=null;

  const cluster=state.clusters.get(drag.clusterId);
  cluster?.band?.classList.remove("dragging");

  if(!cluster)return;

  if(!drag.moved){
    if(drag.bubbleId!==null){
      const bubble=aliveBubbles().find(b=>b.id===drag.bubbleId);

      if(bubble&&bubble.splittable){
        await splitBubble(bubble);
        return;
      }
    }

    await handleClusterTap(cluster.id);
  }
}

window.addEventListener("pointermove",updateClusterDrag,{passive:false});
window.addEventListener("pointerup",finishClusterDrag);
window.addEventListener("pointercancel",finishClusterDrag);

function applyClusterDragForces(dt){
  const drag=state.clusterDrag;
  if(!drag)return;

  const cluster=state.clusters.get(drag.clusterId);

  if(!cluster){
    state.clusterDrag=null;
    return;
  }

  const bubbles=bubblesInCluster(cluster.id).filter(b=>!b.locked);
  if(!bubbles.length)return;

  const stats=clusterStats(cluster);

  for(const bubble of bubbles){
    const local=drag.localOffsets.get(bubble.id)||{
      x:bubble.x-stats.center.x,
      y:bubble.y-stats.center.y
    };

    const desiredX=drag.targetX+local.x;
    const desiredY=drag.targetY+local.y;

    const mass=Math.max(1,bubbleMass(bubble));
    const response=Math.max(.45,Math.min(1.35,900/mass));

    bubble.vx+=(desiredX-bubble.x)*PHYSICS.dragSpring*response*dt;
    bubble.vy+=(desiredY-bubble.y)*PHYSICS.dragSpring*response*dt;

    bubble.vx+=drag.pointerVX*PHYSICS.dragVelocityCoupling*response*dt;
    bubble.vy+=drag.pointerVY*PHYSICS.dragVelocityCoupling*response*dt;

    bubble.vx-=drag.pointerAX*PHYSICS.dragInertia/response*dt;
    bubble.vy-=drag.pointerAY*PHYSICS.dragInertia/response*dt;
  }

  cluster.anchor.x=drag.targetX;
  cluster.anchor.y=drag.targetY;
}

async function handleClusterTap(clusterId){
  const cluster=state.clusters.get(clusterId);
  if(!cluster)return;

  if(
    state.clusters.size===1
    &&
    allOriginalTermsOpened()
    &&
    state.finalReady
    &&
    !state.finalAggregation
    &&
    !state.finalDone
  ){
    startFinalAggregation(cluster);
    return;
  }

  if(
    state.clusters.size===1
    &&
    cluster.termIds.size===1
    &&
    unopenedTerms().length>0
    &&
    !cluster.annihilating
    &&
    !state.finalAggregation
  ){
    return closeSingleCluster(clusterId,true);
  }

  updateInteractionText();
}

function clusterStats(cluster){
  const bs=bubblesInCluster(cluster.id);
  if(!bs.length)return{center:{...cluster.anchor},mass:1};
  let sx=0,sy=0,mass=0;
  for(const b of bs){const m=bubbleMass(b);sx+=b.x*m;sy+=b.y*m;mass+=m}
  return{center:{x:sx/mass,y:sy/mass},mass};
}

function directionalExtent(cluster,center,ux,uy){
  const bs=bubblesInCluster(cluster.id);if(!bs.length)return 30;
  let ext=0;for(const b of bs){const projection=(b.x-center.x)*ux+(b.y-center.y)*uy;ext=Math.max(ext,projection+bubbleRadius(b.value100)+PHYSICS.boundaryOffset)}return ext;
}

function updateBands(){
  const one=state.clusters.size===1&&!state.mergeInProgress;
  const now=performance.now();

  for(const c of state.clusters.values()){
    const bs=bubblesInCluster(c.id);

    if(
      c.forming
      &&
      c.formingUntil
      &&
      now>=c.formingUntil
    ){
      c.forming=false;
      c.formingUntil=0;
      c.band.classList.remove("forming");
    }

    c.band.setAttribute("d",rubberBandPath(bs,clusterStats(c).center));
    c.band.classList.toggle("single",one&&c.termIds.size===1);
    c.band.classList.toggle("mergeable",state.clusters.size>=2||state.mergeInProgress);
  }
}

function nearestBubble(source,clusterId){
  let best=null,bestD=Infinity;
  for(const other of bubblesInCluster(clusterId)){
    if(other.id===source.id||other.locked||!other.alive)continue;
    const d=Math.hypot(other.x-source.x,other.y-source.y);
    if(d<bestD){bestD=d;best=other}
  }
  return best?{bubble:best,distance:bestD}:null;
}

function attractionMultiplier(){
  /*
    Küme içindeki bütün balon çiftleri aynı çekim katsayısını kullanır.
    İşaret ve büyüklük yalnız yok olma / parçalama matematiğini etkiler;
    fiziksel çekim kuvvetini etkilemez.
  */
  return 1;
}

function sameAtomicMagnitude(a,b){
  return Math.abs(a.value100)===Math.abs(b.value100)
    && [100,10,1].includes(Math.abs(a.value100));
}

function oppositeAtomicPair(a,b){
  return a.value100!==0
    && b.value100!==0
    && Math.sign(a.value100)!==Math.sign(b.value100)
    && sameAtomicMagnitude(a,b);
}

function applyInternalForces(cluster,dt,now){
  const bs=bubblesInCluster(cluster.id).filter(b=>!b.locked);
  if(!bs.length)return;

  const stats=clusterStats(cluster);
  const finalMode=state.finalAggregation&&state.finalClusterId===cluster.id;

  for(const b of bs){
    if(finalMode&&bs.length>1){
      const age=(now-b.birth)/Math.max(260,b.lifeSpan);
      b.el.classList.toggle("aging",age>=PHYSICS.lifeSeekAt);

      if(age>=PHYSICS.lifeSeekAt){
        const targetInfo=nearestBubble(b,cluster.id);
        if(targetInfo){
          b.seekingId=targetInfo.bubble.id;
          b.el.classList.add("seeking");
        }
      }else{
        b.seekingId=null;
        b.el.classList.remove("seeking");
      }
    }else{
      b.seekingId=null;
      b.el.classList.remove("aging","seeking");
    }

    b.vx+=(stats.center.x-b.x)*PHYSICS.centerCohesion*dt;
    b.vy+=(stats.center.y-b.y)*PHYSICS.centerCohesion*dt;
  }

  for(let i=0;i<bs.length;i++){
    const a=bs[i];

    for(let j=i+1;j<bs.length;j++){
      const b=bs[j];

      let dx=b.x-a.x;
      let dy=b.y-a.y;
      let d=Math.max(.01,Math.hypot(dx,dy));

      if(d>250)continue;

      const ux=dx/d;
      const uy=dy/d;
      const contact=bubbleRadius(a.value100)+bubbleRadius(b.value100);
      const multiplier=attractionMultiplier(a,b);
      const near=Math.max(0,1-d/250);
      let force=PHYSICS.attraction*multiplier*(.3+near*1.7)*dt;

      if(finalMode){
        const ageA=(now-a.birth)/Math.max(260,a.lifeSpan);
        const ageB=(now-b.birth)/Math.max(260,b.lifeSpan);

        if(a.seekingId===b.id||b.seekingId===a.id){
          const urgency=Math.max(ageA,ageB);
          force*=urgency>=PHYSICS.lifeUrgentAt?9.5:5.2;
        }
      }

      a.vx+=ux*force*d*.08;
      a.vy+=uy*force*d*.08;
      b.vx-=ux*force*d*.08;
      b.vy-=uy*force*d*.08;

      if(d<contact){
        const push=(contact-d)*PHYSICS.overlapSpring*dt;
        a.vx-=ux*push;
        b.vx+=ux*push;
        a.vy-=uy*push;
        b.vy+=uy*push;
      }else if(d<contact*1.30){
        const spring=(d-contact)*PHYSICS.nearContactSpring*dt;
        a.vx+=ux*spring;
        b.vx-=ux*spring;
        a.vy+=uy*spring;
        b.vy-=uy*spring;

        const spin=((a.id+b.id)&1)?1:-1;
        const slide=PHYSICS.tangentialSlide*spin*contact*dt;
        a.vx+=-uy*slide;
        a.vy+=ux*slide;
        b.vx-=-uy*slide;
        b.vy-=ux*slide;
      }

      if(!finalMode){
        /* Atomik balonlar son birleşme iznine kadar birbirleriyle toplanmaz.
           Zıt eş balonların yok edilmesini ayrı öğretim dizisi yönetir. */
      }else{
        const ageA=(now-a.birth)/Math.max(260,a.lifeSpan);
        const ageB=(now-b.birth)/Math.max(260,b.lifeSpan);
        const lifeReady=(ageA>=PHYSICS.lifeSeekAt&&a.seekingId===b.id)||(ageB>=PHYSICS.lifeSeekAt&&b.seekingId===a.id);

        if(lifeReady&&d<=contact+4&&!a.locked&&!b.locked){
          scheduleFinalMerge(a,b);
        }
      }
    }
  }
}

function applyClusterRepulsion(dt){
  const clusters=[...state.clusters.values()];

  for(let i=0;i<clusters.length;i++){
    const a=clusters[i];
    if(!state.clusters.has(a.id))continue;

    const sa=clusterStats(a);

    for(let j=i+1;j<clusters.length;j++){
      const b=clusters[j];
      if(!state.clusters.has(b.id))continue;

      const sb=clusterStats(b);
      let dx=sb.center.x-sa.center.x;
      let dy=sb.center.y-sa.center.y;
      const distance=Math.max(1,Math.hypot(dx,dy));
      const ux=dx/distance;
      const uy=dy/distance;
      const extentA=directionalExtent(a,sa.center,ux,uy);
      const extentB=directionalExtent(b,sb.center,-ux,-uy);
      const gap=distance-extentA-extentB;

      if(gap<=PHYSICS.mergeGap){
        mergeClusterBoundaries(
          a,
          b,
          {
            x:sa.center.x+ux*extentA,
            y:sa.center.y+uy*extentA
          }
        );
        return;
      }

      if(gap<12){
        const push=(12-gap)*PHYSICS.clusterRepulsion*.32*dt;
        const draggingA=state.clusterDrag?.clusterId===a.id;
        const draggingB=state.clusterDrag?.clusterId===b.id;

        if(!draggingA){
          for(const p of bubblesInCluster(a.id)){
            if(!p.locked){
              p.vx-=ux*push;
              p.vy-=uy*push;
            }
          }
        }

        if(!draggingB){
          for(const p of bubblesInCluster(b.id)){
            if(!p.locked){
              p.vx+=ux*push;
              p.vy+=uy*push;
            }
          }
        }
      }
    }
  }
}

function quadraticBezier(a,c,b,t){
  const u=1-t;
  return{
    x:u*u*a.x+2*u*t*c.x+t*t*b.x,
    y:u*u*a.y+2*u*t*c.y+t*t*b.y
  };
}

function createMatchLine(a,b,slow=false){
  const line=document.createElement("div");
  line.className=
    slow
      ?"match-line slow-match"
      :"match-line";

  stage.appendChild(line);

  updateMatchLine(
    line,
    a.x,
    a.y,
    b.x,
    b.y
  );

  return line;
}

function updateMatchLine(line,x1,y1,x2,y2){
  const dx=x2-x1;
  const dy=y2-y1;
  const length=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx)*180/Math.PI;

  line.style.left=x1+"px";
  line.style.top=y1+"px";
  line.style.width=length+"px";

function cancellationLockRadius(bubble){
  const unit=Math.abs(bubble.value100);

  if(unit===100)return 112;
  if(unit===10)return 88;
  return 72;
}

function nearbyCancelablePairs(clusterId){
  const bubbles=
    bubblesInCluster(clusterId)
    .filter(
      bubble=>
        bubble.alive
        &&
        !bubble.locked
        &&
        [100,10,1].includes(
          Math.abs(bubble.value100)
        )
    );

  const candidates=[];

  for(let i=0;i<bubbles.length;i++){
    for(let j=i+1;j<bubbles.length;j++){
      const a=bubbles[i];
      const b=bubbles[j];

      if(!oppositeAtomicPair(a,b))continue;

      const distance=
        Math.hypot(
          a.x-b.x,
          a.y-b.y
        );

      const lockRadius=
        Math.max(
          cancellationLockRadius(a),
          cancellationLockRadius(b)
        );

      if(distance<=lockRadius){
        candidates.push({
          a,
          b,
          distance
        });
      }
    }
  }

  candidates.sort(
    (x,y)=>x.distance-y.distance
  );

  const used=new Set();
  const pairs=[];

  for(const candidate of candidates){
    if(
      used.has(candidate.a.id)
      ||
      used.has(candidate.b.id)
    ){
      continue;
    }

    used.add(candidate.a.id);
    used.add(candidate.b.id);

    pairs.push([
      candidate.a,
      candidate.b
    ]);
  }

  return pairs;
}

function mergeClusterBoundaries(a,b,point){
  if(
    !state.clusters.has(a.id)
    ||
    !state.clusters.has(b.id)
    ||
    state.finalAggregation
    ||
    state.finalDone
  )return;

  showFlash(point,"band-join-flash");

  const sa=clusterStats(a);
  const sb=clusterStats(b);
  const totalMass=sa.mass+sb.mass;

  const anchor={
    x:(sa.center.x*sa.mass+sb.center.x*sb.mass)/Math.max(1,totalMass),
    y:(sa.center.y*sa.mass+sb.center.y*sb.mass)/Math.max(1,totalMass)
  };

  const merged=createCluster([...a.termIds,...b.termIds],anchor);

  for(const bubble of aliveBubbles()){
    if(bubble.clusterId===a.id||bubble.clusterId===b.id){
      bubble.clusterId=merged.id;
    }
  }

  for(const term of state.terms){
    if(term.clusterId===a.id||term.clusterId===b.id){
      term.clusterId=merged.id;
    }
  }

  if(state.clusterDrag?.clusterId===a.id||state.clusterDrag?.clusterId===b.id){
    const drag=state.clusterDrag;
    const stats=clusterStats(merged);

    drag.clusterId=merged.id;
    drag.targetX=stats.center.x;
    drag.targetY=stats.center.y;
    drag.offsetX=stats.center.x-drag.lastX;
    drag.offsetY=stats.center.y-drag.lastY;
    drag.localOffsets=new Map(
      bubblesInCluster(merged.id).map(p=>[
        p.id,
        {x:p.x-stats.center.x,y:p.y-stats.center.y}
      ])
    );
  }

  deleteCluster(a.id);
  deleteCluster(b.id);

  state.finalReady=false;
  state.mergeInProgress=false;
  state.mergeClusterIds=[];
  state.mergedClusterId=null;

  updatePlusSigns();

  setStatus(
    state.clusters.size===1&&allOriginalTermsOpened()
      ? "Tüm kümeler tek küme oldu. Zıt eş balonlar sadeleşiyor…"
      : "İki küme temas etti; lastik sınırlar birleşti. Zıt eş balonlar sadeleşiyor…"
  );

  setTimeout(()=>runAnnihilationSequence(merged.id),70);
}

function collectCancelablePairs(clusterId){
  const bubbles=bubblesInCluster(clusterId)
    .filter(b=>b.alive&&!b.locked&&[100,10,1].includes(Math.abs(b.value100)));

  const candidates=[];

  for(let i=0;i<bubbles.length;i++){
    for(let j=i+1;j<bubbles.length;j++){
      const a=bubbles[i];
      const b=bubbles[j];

      if(!oppositeAtomicPair(a,b))continue;

      candidates.push({
        a,
        b,
        distance:Math.hypot(a.x-b.x,a.y-b.y)
      });
    }
  }

  candidates.sort((x,y)=>x.distance-y.distance);

  const used=new Set();
  const pairs=[];

  for(const item of candidates){
    if(used.has(item.a.id)||used.has(item.b.id))continue;

    used.add(item.a.id);
    used.add(item.b.id);
    pairs.push([item.a,item.b]);
  }

  return pairs;
}

function scheduleAnnihilation(a,b,slow=false){
  if(
    a.locked
    ||
    b.locked
    ||
    !a.alive
    ||
    !b.alive
    ||
    a.clusterId!==b.clusterId
  ){
    return Promise.resolve();
  }

  a.locked=b.locked=true;

  a.el.classList.add("merging");
  b.el.classList.add("merging");

  if(slow){
    stage.classList.add(
      "annihilation-focus-mode"
    );

    a.el.classList.add(
      "annihilation-focus"
    );

    b.el.classList.add(
      "annihilation-focus"
    );
  }

  return annihilatePair(
    a,
    b,
    {slow}
  )
  .finally(()=>{
    if(slow){
      stage.classList.remove(
        "annihilation-focus-mode"
      );
    }
  });
}

async function annihilatePair(a,b,{slow=false}={}){
  if(!a.alive||!b.alive)return;

  const line=createMatchLine(a,b,slow);

  await sleep(slow?190:85);

  const startA={x:a.x,y:a.y};
  const startB={x:b.x,y:b.y};

  const target={
    x:(startA.x+startB.x)/2,
    y:(startA.y+startB.y)/2
  };

  const dx=startB.x-startA.x;
  const dy=startB.y-startA.y;
  const length=Math.max(1,Math.hypot(dx,dy));
  const nx=-dy/length;
  const ny=dx/length;

  const curve=Math.min(
    slow?13:9,
    length*(slow?.05:.035)
  );

  const controlA={
    x:(startA.x+target.x)/2+nx*curve,
    y:(startA.y+target.y)/2+ny*curve
  };

  const controlB={
    x:(startB.x+target.x)/2-nx*curve,
    y:(startB.y+target.y)/2-ny*curve
  };

  const duration=slow?410:325;
  const started=performance.now();

  await new Promise(resolve=>{
    function frame(now){
      const t=Math.max(0,Math.min(1,(now-started)/duration));

      const q=
        slow
          ?t*t*(3-2*t)
          :.10*t+.90*t*t;

      const pa=quadraticBezier(startA,controlA,target,q);
      const pb=quadraticBezier(startB,controlB,target,q);

      a.x=pa.x;
      a.y=pa.y;
      b.x=pb.x;
      b.y=pb.y;

      if(a.el.isConnected){
        a.el.style.left=pa.x+"px";
        a.el.style.top=pa.y+"px";
      }

      if(b.el.isConnected){
        b.el.style.left=pb.x+"px";
        b.el.style.top=pb.y+"px";
      }

      if(line.isConnected){
        updateMatchLine(line,pa.x,pa.y,pb.x,pb.y);
      }

      const near=Math.max(0,(q-.38)/.62);

      const filter=
        "brightness("+
        (1.04+near*.42)+
        ") saturate("+
        (1.05+near*.28)+
        ")";

      a.core.style.filter=filter;
      b.core.style.filter=filter;

      if(t<1)requestAnimationFrame(frame);
      else resolve();
    }

    requestAnimationFrame(frame);
  });

  if(line.isConnected)line.remove();

  createAnnihilationBurst(target.x,target.y);

  if(slow){
    createZeroFlash(
      target.x,
      target.y
    );
  }

  const vanish=p=>p.core.animate(
    [
      {transform:"scale(1)",opacity:1},
      {transform:"scale(1.28)",opacity:1,offset:.24},
      {transform:"scale(.02)",opacity:0}
    ],
    {
      duration:slow?185:170,
      easing:"cubic-bezier(.25,.78,.35,1)",
      fill:"forwards"
    }
  ).finished.catch(()=>{});

  await Promise.all([vanish(a),vanish(b)]);

  a.alive=false;
  b.alive=false;

  if(a.el.isConnected)a.el.remove();
  if(b.el.isConnected)b.el.remove();
}

async function runAnnihilationSequence(clusterId){
  const cluster=
    state.clusters.get(
      clusterId
    );

  if(
    !cluster
    ||
    cluster.annihilating
    ||
    state.finalAggregation
    ||
    state.finalDone
  ){
    return;
  }

  cluster.annihilating=true;

  clearSplittableMarks();

  const active=
    new Set();

  try{
    /*
      1. DOĞAL KARŞILAŞMA

      Eski sürümlerdeki etkileyici davranış:
      bütün eşleşmeleri baştan hesaplamıyoruz.
      Yalnız fizik içinde gerçekten birbirine yaklaşan
      zıt eş balonlar kilitleniyor.
    */
    const liveStart=
      performance.now();

    const liveDuration=
      620;

    setStatus(
      "Zıt eş balonlar birbirlerini <strong>yakından buluyor</strong>…"
    );

    while(
      state.clusters.has(clusterId)
      &&
      performance.now()-liveStart<
      liveDuration
    ){
      const nearby=
        nearbyCancelablePairs(
          clusterId
        );

      for(
        const [a,b]
        of nearby.slice(0,2)
      ){
        if(
          a.locked
          ||
          b.locked
          ||
          !a.alive
          ||
          !b.alive
        ){
          continue;
        }

        let job=null;

        job=
          scheduleAnnihilation(
            a,
            b,
            false
          )
          .finally(()=>{
            active.delete(
              job
            );
          });

        active.add(
          job
        );
      }

      await sleep(42);
    }

    if(active.size){
      await Promise.all(
        [...active]
      );
    }

    /*
      2. HIZLI DALGA

      Doğal karşılaşma sonunda çok çift kalmışsa,
      hepsi aynı karede silinmez.
      48 ms'lik küçük gecikmeler çiftleri okunur kılar.
    */
    while(
      state.clusters.has(
        clusterId
      )
    ){
      const remaining=
        collectCancelablePairs(
          clusterId
        );

      if(
        remaining.length<=3
      ){
        break;
      }

      const waveCount=
        Math.min(
          4,
          remaining.length-3
        );

      const wave=
        remaining.slice(
          0,
          waveCount
        );

      setStatus(
        "Eşleşen zıt çiftler <strong>dalga halinde</strong> sadeleşiyor…"
      );

      await Promise.all(
        wave.map(
          async(
            [a,b],
            index
          )=>{
            await sleep(
              index*48
            );

            await scheduleAnnihilation(
              a,
              b,
              false
            );
          }
        )
      );

      await sleep(75);
    }

    /*
      3. SON ÇİFTLER

      Bunlar öğretim anıdır:
      çevre geri plana gider,
      çift tek başına vurgulanır,
      çizgi görünür,
      temas gerçekleşir
      ve 0 izi bırakılır.
    */
    while(
      state.clusters.has(
        clusterId
      )
    ){
      const remaining=
        collectCancelablePairs(
          clusterId
        );

      if(!remaining.length){
        break;
      }

      const [a,b]=
        remaining[0];

      if(
        !a
        ||
        !b
        ||
        !a.alive
        ||
        !b.alive
      ){
        break;
      }

      setStatus(
        "<strong>"+
        formatBubbleValue(
          a.value100
        )+
        "</strong> ile <strong>"+
        formatBubbleValue(
          b.value100
        )+
        "</strong> eşleşiyor → 0"
      );

      await scheduleAnnihilation(
        a,
        b,
        true
      );

      await sleep(95);
    }
  }
  finally{
    stage.classList.remove(
      "annihilation-focus-mode"
    );

    const current=
      state.clusters.get(
        clusterId
      );

    if(current){
      current.annihilating=false;
    }
  }

  checkFinalReadiness();
}

function scheduleFinalMerge(a,b){
  if(!state.finalAggregation||a.locked||b.locked||!a.alive||!b.alive||a.clusterId!==b.clusterId)return;
  a.locked=b.locked=true;
  a.el.classList.add("merging");
  b.el.classList.add("merging");
  finalMergePair(a,b);
}

async function finalMergePair(a,b){
  const cluster=state.clusters.get(a.clusterId);
  if(!cluster||!state.finalAggregation)return;

  const startA={x:a.x,y:a.y};
  const startB={x:b.x,y:b.y};
  const ma=bubbleMass(a);
  const mb=bubbleMass(b);
  const total=ma+mb;
  const target={
    x:(a.x*ma+b.x*mb)/Math.max(1,total),
    y:(a.y*ma+b.y*mb)/Math.max(1,total)
  };
  const value=a.value100+b.value100;
  const lineage=(a.lineageCount||1)+(b.lineageCount||1);
  const started=performance.now();
  const duration=190;

  await new Promise(resolve=>{
    function frame(now){
      const t=Math.min(1,(now-started)/duration);
      const q=t*t;
      a.x=startA.x+(target.x-startA.x)*q;
      a.y=startA.y+(target.y-startA.y)*q;
      b.x=startB.x+(target.x-startB.x)*q;
      b.y=startB.y+(target.y-startB.y)*q;

      if(a.el.isConnected){a.el.style.left=a.x+"px";a.el.style.top=a.y+"px"}
      if(b.el.isConnected){b.el.style.left=b.x+"px";b.el.style.top=b.y+"px"}

      if(t<1)requestAnimationFrame(frame);
      else resolve();
    }
    requestAnimationFrame(frame);
  });

  showFlash(target,"merge-flash");

  const vanish=p=>p.core.animate(
    [
      {transform:"scale(1)",opacity:1},
      {transform:"scale(.06)",opacity:0}
    ],
    {duration:115,easing:"ease-in",fill:"forwards"}
  ).finished.catch(()=>{});

  await Promise.all([vanish(a),vanish(b)]);

  a.alive=false;
  b.alive=false;
  if(a.el.isConnected)a.el.remove();
  if(b.el.isConnected)b.el.remove();

  const child=createBubble(value,target.x,target.y,cluster.id,null,lineage,.42);
  child.birth=performance.now()-child.lifeSpan*.70;
  child.vx=(a.vx+b.vx)*.15;
  child.vy=(a.vy+b.vy)*.15;

  maybeFinishFinalAggregation(cluster.id);
}

function clearSplittableMarks(){
  for(const b of aliveBubbles()){
    b.el.classList.remove("splittable");
    b.splittable=false;
  }
}

function atomicUnit(value100){
  return Math.abs(value100);
}

function markNeededSplits(cluster){
  clearSplittableMarks();

  const bubbles=
    bubblesInCluster(cluster.id)
      .filter(b=>b.alive&&b.value100!==0&&!b.locked);

  const minUnit=currentConfig().minUnit;
  let best=null;

  for(const big of bubbles){
    const bigUnit=atomicUnit(big.value100);
    if(bigUnit<=minUnit)continue;

    for(const small of bubbles){
      if(big.id===small.id)continue;

      const smallUnit=atomicUnit(small.value100);

      if(
        Math.sign(small.value100)!==-Math.sign(big.value100)
        ||
        smallUnit>=bigUnit
      ){
        continue;
      }

      const distance=Math.hypot(
        big.x-small.x,
        big.y-small.y
      );

      const nextUnit=
        bigUnit===100
          ? 10
          : bigUnit===10
            ? 1
            : null;

      if(!nextUnit)continue;

      const score=
        bigUnit*100000+
        distance;

      if(!best||score<best.score){
        best={
          bubble:big,
          fromUnit:bigUnit,
          toUnit:nextUnit,
          targetUnit:smallUnit,
          score
        };
      }
    }
  }

  if(!best)return null;

  best.bubble.splittable=true;
  best.bubble.el.classList.add("splittable");

  return best;
}

function hasCancelablePair(cluster){
  const bs=bubblesInCluster(cluster.id).filter(b=>!b.locked&&b.alive);
  for(let i=0;i<bs.length;i++){
    for(let j=i+1;j<bs.length;j++){
      if(oppositeAtomicPair(bs[i],bs[j]))return true;
    }
  }
  return false;
}

function checkFinalReadiness(){
  if(
    state.finalDone
    ||
    state.finalAggregation
    ||
    state.clusters.size!==1
    ||
    !allOriginalTermsOpened()
  )return;

  const cluster=[...state.clusters.values()][0];

  if(cluster.annihilating)return;

  state.finalClusterId=cluster.id;

  const bubbles=bubblesInCluster(cluster.id).filter(b=>b.alive);

  if(bubbles.some(b=>b.locked))return;

  const signs=new Set(
    bubbles
      .filter(b=>b.value100!==0)
      .map(b=>Math.sign(b.value100))
  );

  if(signs.size<=1){
    state.finalReady=true;
    clearSplittableMarks();

    setStatus(
      bubbles.length===0
        ? "Sadeleştirme tamamlandı. <strong>Tek kümeye tıkla:</strong> 0 sonuç balonu oluşsun."
        : "Sadeleştirme tamamlandı. <strong>Tek kümeye tıkla:</strong> son sayı-birleşmesine izin ver."
    );

    return;
  }

  state.finalReady=false;

  if(hasCancelablePair(cluster)){
    runAnnihilationSequence(cluster.id);
    return;
  }

  const splitInfo=markNeededSplits(cluster);

  if(splitInfo){
    const sign=Math.sign(splitInfo.bubble.value100);

    setStatus(
      "Zıt işaretliler farklı büyüklükte kaldı. " +
      "<strong>" +
      formatBubbleValue(sign*splitInfo.fromUnit) +
      " balonuna tıkla:</strong> " +
      "10 tane " +
      formatBubbleValue(sign*splitInfo.toUnit) +
      " balonuna ayrılacak."
    );
  }
}

function startFinalAggregation(cluster){
  if(
    state.finalAggregation
    ||
    state.finalDone
    ||
    !state.finalReady
    ||
    state.clusters.size!==1
    ||
    !allOriginalTermsOpened()
  )return;

  clearSplittableMarks();
  state.finalReady=false;
  state.finalAggregation=true;
  state.finalClusterId=cluster.id;

  const bubbles=bubblesInCluster(cluster.id).filter(b=>b.alive);

  if(bubbles.length===0){
    const center=clusterStats(cluster).center;
    const zero=createBubble(0,center.x,center.y,cluster.id,null,1,.35);
    finishFinalResult(cluster,zero);
    return;
  }

  if(bubbles.length===1){
    finishFinalResult(cluster,bubbles[0]);
    return;
  }

  const now=performance.now();

  for(const bubble of bubbles){
    bubble.birth=now-bubble.lifeSpan*(.70+Math.random()*.08);
    bubble.el.classList.add("aging");
  }

  setStatus(
    "Son birleşmeye izin verildi. Atomik balonlar şimdi birleşerek <strong>tek sonuç balonunu</strong> oluşturuyor…"
  );
}

function maybeFinishFinalAggregation(clusterId){
  if(!state.finalAggregation||state.finalClusterId!==clusterId)return;

  const cluster=state.clusters.get(clusterId);
  if(!cluster)return;

  const bs=bubblesInCluster(clusterId).filter(b=>b.alive);

  if(bs.length===1){
    finishFinalResult(cluster,bs[0]);
  }
}

function finishFinalResult(cluster,bubble){
  if(state.finalDone)return;

  state.finalAggregation=false;
  state.finalDone=true;
  state.finalClusterId=cluster.id;

  bubble.locked=false;
  bubble.seekingId=null;
  bubble.el.classList.remove("aging","seeking","merging");
  bubble.el.classList.add("final-result");

  cluster.mode="final";
  cluster.anchor={x:bubble.x,y:bubble.y};

  setStatus("Sonuç balonu: <strong>"+formatBubbleValue(bubble.value100)+"</strong>.");
}

async function splitBubble(b){
  if(!b.alive||!b.splittable||state.finalAggregation||state.finalDone)return;

  const unit=atomicUnit(b.value100);
  const next=unit===100?10:unit===10?1:null;

  if(!next||next<currentConfig().minUnit)return;

  clearSplittableMarks();

  const sign=Math.sign(b.value100);
  const clusterId=b.clusterId;
  const termId=b.termId;
  const x=b.x;
  const y=b.y;

  b.locked=true;

  await b.core.animate(
    [
      {transform:"scale(1)",opacity:1},
      {transform:"scale(.08)",opacity:0}
    ],
    {duration:150,easing:"ease-in",fill:"forwards"}
  ).finished.catch(()=>{});

  b.alive=false;
  if(b.el.isConnected)b.el.remove();

  const childValue=sign*next;
  const radius=bubbleRadius(childValue);

  for(let i=0;i<10;i++){
    const angle=Math.PI*2*i/10;
    const ring=radius*1.45;
    const child=createBubble(
      childValue,
      x+Math.cos(angle)*ring,
      y+Math.sin(angle)*ring,
      clusterId,
      termId,
      1,
      1
    );
    child.vx=Math.cos(angle)*1.1;
    child.vy=Math.sin(angle)*1.1;
  }

  setStatus(
    formatBubbleValue(sign*unit) +
    " balonu 10 tane " +
    formatBubbleValue(childValue) +
    " balonuna ayrıldı. Zıt eş balonlar yeniden sadeleştiriliyor…"
  );
  state.finalReady=false;
  setTimeout(()=>{
    const cluster=state.clusters.get(clusterId);
    if(cluster)runAnnihilationSequence(cluster.id);
  },120);
}

function integrate(dt){
  for(const b of aliveBubbles()){
    if(b.locked)continue;
    b.vx*=Math.pow(PHYSICS.damping,dt);b.vy*=Math.pow(PHYSICS.damping,dt);
    const speed=Math.hypot(b.vx,b.vy);
    const speedLimit=
      state.clusterDrag?.clusterId===b.clusterId
        ?PHYSICS.dragMaxSpeed
        :PHYSICS.maxSpeed;
    if(speed>speedLimit){
      b.vx=b.vx/speed*speedLimit;
      b.vy=b.vy/speed*speedLimit;
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    const r=bubbleRadius(b.value100)+7;
    b.x=Math.max(r,Math.min(stage.clientWidth-r,b.x));
    b.y=Math.max(190+r,Math.min(stage.clientHeight-125-r,b.y));
    b.el.style.left=b.x+"px";b.el.style.top=b.y+"px";
  }
}

function physicsFrame(now){
  const dt=Math.min(1.7,Math.max(.35,(now-state.lastPhysicsTime)/16.667));state.lastPhysicsTime=now;
  for(const cluster of state.clusters.values())applyInternalForces(cluster,dt,now);
  applyClusterDragForces(dt);
  applyClusterRepulsion(dt);
  integrate(dt);
  updateBands();

  if(now>=state.resolutionCheckAt){
    state.resolutionCheckAt=now+180;
    checkFinalReadiness();
  }

  requestAnimationFrame(physicsFrame);
}

function updateInteractionText(){
  if(state.finalDone)return;

  if(state.finalAggregation){
    setStatus("Sonuç balonu oluşuyor… Kümeyi sürüklemeye devam edebilirsin.");
    return;
  }

  if(state.clusters.size===0){
    setStatus("İstediğin sayıyı aç.");
    return;
  }

  if(state.clusters.size===1){
    const cluster=[...state.clusters.values()][0];

    if(allOriginalTermsOpened()&&state.finalReady){
      setStatus(
        "Tek küme hazır. <strong>Kısa tıkla:</strong> son sayı-birleşmesine izin ver. İstersen önce kümeyi sürükleyebilirsin."
      );
      return;
    }

    if(cluster.termIds.size===1&&unopenedTerms().length>0){
      setStatus(
        "Kümeyi istediğin yere sürükleyebilirsin. Kısa tıklarsan bu tek açık sayı kapanır."
      );
      return;
    }

    if(unopenedTerms().length>0){
      setStatus(
        "Birleşmiş kümeyi de sürükleyebilirsin. Kapalı sayı varsa onu aç; başka kümeye temas ederse sınırlar birleşir."
      );
      return;
    }

    setStatus("Tüm sayılar tek kümede. Zıt balonların sadeleşmesi tamamlanıyor…");
    return;
  }

  setStatus(
    state.clusters.size+
    " ayrı küme açık. <strong>Bir kümeyi sürükleyip diğerine temas ettir:</strong> sınırlar temas ettiği anda birleşir."
  );
}
async function openTerm(termId){
  const term=state.terms.find(t=>t.id===termId);if(!term||term.opened||term.opening||term.closing)return;
  term.opened=true;term.opening=true;term.openedAt=performance.now();state.explicitCloseArmedAt=performance.now()+700;
  const index=state.terms.findIndex(t=>t.id===termId),source=elementCenterInStage(term.card),anchor=termAnchor(index);
  const cluster=createCluster(
    [term.id],
    anchor,
    {
      forming:false
    }
  );

  term.clusterId=cluster.id;
  term.card.classList.add("gone");
  updatePlusSigns();
  const values=decomposeValue(term.value100),points=seedLayout(values,anchor,termSegmentWidth()),generation=state.generation;
  for(let i=0;i<values.length;i++){
    if(generation!==state.generation)break;
    const b=createBubble(values[i],source.x,source.y,cluster.id,term.id,1,1);
    const target=points[i];b.vx=(target.x-source.x)*.052;b.vy=(target.y-source.y)*.052;
  }
  await sleep(300);

  if(
    generation!==state.generation
  ){
    return;
  }

  if(
    state.clusters.has(cluster.id)
  ){
    cluster.forming=false;
    cluster.formingUntil=0;
    cluster.band.classList.remove("forming");
  }

  await sleep(120);

  if(
    generation!==state.generation
  ){
    return;
  }

  term.opening=false;
  updateInteractionText();
}

async function closeSingleCluster(clusterId,explicit=false){
  if(!explicit||performance.now()<state.explicitCloseArmedAt)return;
  const cluster=state.clusters.get(clusterId);if(!cluster||state.clusters.size!==1||state.mergeInProgress||cluster.termIds.size!==1)return;
  const termId=[...cluster.termIds][0],term=state.terms.find(t=>t.id===termId);if(!term)return;
  term.closing=true;const target=elementCenterInStage(term.card),bs=bubblesInCluster(cluster.id);
  for(const b of bs){b.locked=true;b.vx=(target.x-b.x)*.11;b.vy=(target.y-b.y)*.11}
  await sleep(360);
  for(const b of bs){b.alive=false;if(b.el.isConnected)b.el.remove()}
  deleteCluster(cluster.id);term.opened=false;term.opening=false;term.closing=false;term.clusterId=null;term.card.classList.remove("gone");updateInteractionText();
}

async function handleClusterClick(clusterId,explicit=false){
  if(!explicit)return;
  await handleClusterTap(clusterId);
}

function beginClusterMerge(){
  /* Tıklama ile küme birleştirme kaldırıldı.
     Birleşmenin tek nedeni iki dinamik sınırın fiziksel temasıdır. */
}

function allOriginalTermsOpened(){return state.terms.every(t=>t.opened)}

async function onBubbleClick(b,explicit=false){
  if(!explicit||!b?.alive)return;

  if(b.splittable){
    await splitBubble(b);
    return;
  }

  await handleClusterTap(b.clusterId);
}

function clearSimulation(){
  for(const b of state.bubbles)if(b.el?.isConnected)b.el.remove();state.bubbles=[];
  for(const c of state.clusters.values())if(c.band?.isConnected)c.band.remove();state.clusters.clear();
  document.querySelectorAll(".band-join-flash,.merge-flash,.match-line,.annihilation-burst,.zero-flash").forEach(el=>el.remove());
}

function newProblem(){
  state.generation++;clearSimulation();state.terms=[];state.nextTermId=1;state.nextClusterId=1;state.nextBubbleId=1;state.mergeInProgress=false;state.mergeClusterIds=[];state.mergedClusterId=null;state.finalAggregation=false;state.finalDone=false;state.finalClusterId=null;state.finalReady=false;state.clusterDrag=null;stage.classList.remove("annihilation-focus-mode");state.resolutionCheckAt=0;state.explicitCloseArmedAt=0;
  for(let i=0;i<state.operandCount;i++)state.terms.push(makeTerm(generateValue100()));
  document.body.dataset.mode=state.level;stage.style.height=calculateStageHeight()+"px";renderTerms();updateInteractionText();
}

function updatePlusSigns(){
  const openIds=new Set(
    state.terms
      .filter(term=>term.opened)
      .map(term=>term.id)
  );

  document.querySelectorAll(".dynamic-plus").forEach(plus=>{
    const left=Number(plus.dataset.leftTermId);
    const right=Number(plus.dataset.rightTermId);

    plus.classList.toggle(
      "fade-away",
      openIds.has(left)&&openIds.has(right)
    );
  });
}

function renderTerms(){
  termLayer.innerHTML="";
  const centers=getCenterRatios(state.terms.length);

  for(let index=0;index<state.terms.length;index++){
    const term=state.terms[index];
    const card=document.createElement("button");

    card.className="term-card";
    card.style.left=(centers[index]*100)+"%";
    card.textContent=formatSigned(term.value100);
    card.dataset.termId=String(term.id);

    installCardPointerHandlers(card,term.id);
    termLayer.appendChild(card);
    term.card=card;

    if(term.opened)card.classList.add("gone");

    if(index<state.terms.length-1){
      const plus=document.createElement("div");
      plus.className="dynamic-plus";
      plus.textContent="+";
      plus.style.left=(((centers[index]+centers[index+1])/2)*100)+"%";
      plus.dataset.leftTermId=String(term.id);
      plus.dataset.rightTermId=String(state.terms[index+1].id);
      termLayer.appendChild(plus);
    }
  }

  updatePlusSigns();
}

function installCardPointerHandlers(card,termId){
  card.addEventListener("pointerdown",event=>{
    const term=state.terms.find(t=>t.id===termId);if(!term||term.opened||term.opening||term.closing)return;
    event.preventDefault();card.setPointerCapture(event.pointerId);
    const canDrag=!state.mergeInProgress&&openedTerms().length===0;
    state.drag={termId,pointerId:event.pointerId,startX:event.clientX,startLeft:card.offsetLeft,moved:false,canDrag};if(canDrag)card.classList.add("dragging");
  });
  card.addEventListener("pointermove",event=>{
    const d=state.drag;if(!d||d.termId!==termId||d.pointerId!==event.pointerId||!d.canDrag)return;
    const dx=event.clientX-d.startX;if(Math.abs(dx)>6)d.moved=true;card.style.left=Math.max(45,Math.min(stage.clientWidth-45,d.startLeft+dx))+"px";
  });
  card.addEventListener("pointerup",event=>{
    const d=state.drag;if(!d||d.termId!==termId||d.pointerId!==event.pointerId)return;card.classList.remove("dragging");state.drag=null;
    if(d.canDrag&&d.moved){
      const centers=getCenterRatios(state.terms.length).map(r=>r*stage.clientWidth),x=card.offsetLeft;let targetIndex=0,best=Infinity;
      centers.forEach((cx,i)=>{const dist=Math.abs(cx-x);if(dist<best){best=dist;targetIndex=i}});
      const currentIndex=state.terms.findIndex(t=>t.id===termId),[item]=state.terms.splice(currentIndex,1);state.terms.splice(targetIndex,0,item);renderTerms();setStatus("Sıra değişti. Şimdi istediğin sayıyı aç.");
    }else openTerm(termId);
  });
  card.addEventListener("pointercancel",()=>{card.classList.remove("dragging");state.drag=null;if(openedTerms().length===0)renderTerms()});
}

newBtn.addEventListener("click",e=>{e.stopPropagation();newProblem()});
for(const button of levelButtons)button.addEventListener("click",e=>{e.stopPropagation();state.level=button.dataset.level;levelButtons.forEach(item=>item.classList.toggle("active",item===button));newProblem()});
settingsPanel.addEventListener("click",e=>e.stopPropagation());
aSlider.addEventListener("input",e=>{state.limitA=Number(e.target.value);aValue.textContent=String(state.limitA)});
aSlider.addEventListener("change",e=>{e.stopPropagation();state.limitA=Number(e.target.value);aValue.textContent=String(state.limitA);newProblem()});
countSlider.addEventListener("input",e=>{state.operandCount=Number(e.target.value);countValue.textContent=String(state.operandCount)});
countSlider.addEventListener("change",e=>{e.stopPropagation();state.operandCount=Number(e.target.value);countValue.textContent=String(state.operandCount);newProblem()});
window.addEventListener("resize",()=>{if(state.mergeInProgress)return;stage.style.height=calculateStageHeight()+"px";renderTerms()});

requestAnimationFrame(physicsFrame);
newProblem();
})();
