<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulutlarla Toplama</title>
<style>
:root{--bg:#f5f7fb;--text:#1d2433;--muted:#6f7787;--positive:#2563eb;--negative:#e11d48;--accent:#7c3aed;--shadow:0 18px 45px rgba(42,50,70,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{display:flex;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 15%,rgba(124,58,237,.08),transparent 28%),radial-gradient(circle at 82% 22%,rgba(37,99,235,.08),transparent 30%),var(--bg);-webkit-tap-highlight-color:transparent}
button,.particle-core,.merged-shell{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{width:min(1060px,100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}.titlebox h1{margin:0;font-size:clamp(24px,3vw,38px);letter-spacing:-.04em}.titlebox p{margin:6px 0 0;color:var(--muted);font-size:14px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.level-btn,.new-btn,.home-btn{border:0;border-radius:13px;padding:10px 15px;font:inherit;font-weight:750;color:#3c4352;background:rgba(255,255,255,.84);box-shadow:0 6px 18px rgba(40,48,67,.08);cursor:pointer;transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease}.level-btn:hover,.new-btn:hover,.home-btn:hover{transform:translateY(-1px)}.level-btn.active{color:#fff;background:var(--text);box-shadow:0 8px 20px rgba(29,36,51,.18)}.new-btn{margin-left:4px;color:var(--accent)}.home-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#3c4352}
.board{position:relative;min-height:610px;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:30px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);box-shadow:var(--shadow)}.board.ready-to-mix{cursor:pointer}.stage{position:relative;width:100%;height:520px;overflow:hidden}.soft-orb{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(30px);opacity:.16;pointer-events:none}.soft-orb.one{left:-100px;top:20px;background:#60a5fa}.soft-orb.two{right:-120px;bottom:10px;background:#c084fc}
.number-card{position:absolute;top:42%;transform:translate(-50%,-50%);min-width:126px;padding:18px 22px;border:0;border-radius:20px;background:#fff;color:var(--text);font-size:clamp(30px,4vw,48px);font-weight:850;letter-spacing:-.04em;box-shadow:0 16px 34px rgba(30,38,56,.14);cursor:pointer;z-index:15;transition:transform .2s ease,box-shadow .2s ease,opacity .25s ease}.number-card:hover{transform:translate(-50%,-52%) scale(1.025)}.number-card.left{left:27%}.number-card.right{left:73%}.number-card.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72)}
.operator{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#343b4b;font-size:clamp(46px,6vw,72px);font-weight:500;opacity:.38;pointer-events:none;z-index:16;transition:opacity .3s ease,transform .3s ease,filter .3s ease}.operator.ready{opacity:1;filter:drop-shadow(0 7px 15px rgba(124,58,237,.18));animation:plusPulse 1.55s ease-in-out infinite}.operator.fade-out{opacity:0;transform:translate(-50%,-50%) scale(.65);animation:none}@keyframes plusPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.cloud-shell{position:absolute;top:4%;width:42%;height:72%;border-radius:46% 54% 51% 49%/44% 42% 58% 56%;border:2px dashed rgba(75,85,110,.15);background:rgba(255,255,255,.22);box-shadow:inset 0 0 38px rgba(40,48,70,.03);opacity:0;transform:scale(.88);transition:opacity .42s ease,transform .85s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:1}.cloud-shell.visible{opacity:1;transform:scale(1)}.cloud-shell.direct-result{opacity:0;transform:scale(.96)}.cloud-shell.left{left:2%}.cloud-shell.right{right:2%}.cloud-shell.left.fusing{opacity:0;transform:translateX(50%) scale(.9)}.cloud-shell.right.fusing{opacity:0;transform:translateX(-50%) scale(.9)}
.merged-shell{position:absolute;left:50%;top:37%;width:78%;height:69%;transform:translate(-50%,-50%) scale(.82);border-radius:46% 54% 50% 50%/48% 45% 55% 52%;border:2px solid rgba(124,58,237,.10);background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.48),rgba(255,255,255,.12));opacity:0;pointer-events:none;transition:opacity .45s ease,transform .55s cubic-bezier(.2,.85,.2,1),border-color .25s ease;z-index:2}.merged-shell.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}.merged-shell.ready{pointer-events:auto;cursor:pointer;border-color:rgba(124,58,237,.35);animation:shellBreathe 1.75s ease-in-out infinite}.merged-shell.counting{pointer-events:none;animation:none}.merged-shell.finished{opacity:0;transform:translate(-50%,-50%) scale(.45)}@keyframes shellBreathe{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 0 10px rgba(124,58,237,.035)}}
.particle-wrap{position:absolute;transform:translate(-50%,-50%);z-index:8;will-change:left,top,transform,opacity}.particle-core{display:grid;place-items:center;border-radius:999px;font-weight:850;letter-spacing:-.03em;border:1px solid rgba(255,255,255,.82);box-shadow:0 8px 20px rgba(35,45,70,.13),inset 0 1px 0 rgba(255,255,255,.75);animation:drift var(--drift-duration,5s) ease-in-out var(--drift-delay,0s) infinite alternate;will-change:transform,box-shadow,filter}.particle-wrap.unit-100 .particle-core{width:60px;height:60px;font-size:21px}.particle-wrap.unit-10 .particle-core{width:46px;height:46px;font-size:15px}body[data-mode="medium"] .particle-wrap.unit-10 .particle-core{width:36px;height:36px;font-size:12px}.particle-wrap.unit-1 .particle-core{width:32px;height:32px;font-size:10px}.particle-wrap.positive .particle-core{color:#1748a5;background:linear-gradient(145deg,#eef6ff,#d8eaff)}.particle-wrap.negative .particle-core{color:#a41436;background:linear-gradient(145deg,#fff2f4,#ffdce3)}
.particle-wrap.matching{z-index:20}.particle-wrap.matching .particle-core{animation:none;filter:brightness(1.12) saturate(1.18)}.particle-wrap.positive.matching .particle-core{box-shadow:0 0 0 4px rgba(37,99,235,.12),0 0 24px rgba(37,99,235,.52),0 0 45px rgba(37,99,235,.22)}.particle-wrap.negative.matching .particle-core{box-shadow:0 0 0 4px rgba(225,29,72,.12),0 0 24px rgba(225,29,72,.52),0 0 45px rgba(225,29,72,.22)}.particle-wrap.splittable .particle-core{cursor:pointer;outline:3px solid rgba(124,58,237,.25);box-shadow:0 10px 24px rgba(124,58,237,.22);animation:drift var(--drift-duration,5s) ease-in-out var(--drift-delay,0s) infinite alternate,splitPulse 1.15s ease-in-out infinite}.particle-wrap.gravity-fall .particle-core{animation:none;outline:none}@keyframes drift{from{transform:translate(calc(var(--dx,1.4px)*-1),calc(var(--dy,1.4px)*-1))}to{transform:translate(var(--dx,1.4px),var(--dy,1.4px))}}@keyframes splitPulse{0%,100%{filter:saturate(1)}50%{filter:saturate(1.15) brightness(1.035)}}
.match-line{position:absolute;height:3px;border-radius:999px;transform-origin:0 50%;pointer-events:none;z-index:12;opacity:0;background:linear-gradient(90deg,rgba(37,99,235,.18),rgba(37,99,235,.82),rgba(255,255,255,1),rgba(225,29,72,.82),rgba(225,29,72,.18));box-shadow:0 0 8px rgba(124,58,237,.28),0 0 14px rgba(255,255,255,.75);animation:lineAppear .10s ease-out forwards}@keyframes lineAppear{from{opacity:0;filter:blur(2px)}to{opacity:.95;filter:blur(0)}}
.annihilation-burst{position:absolute;width:0;height:0;pointer-events:none;z-index:28}.burst-core{position:absolute;left:0;top:0;width:20px;height:20px;transform:translate(-50%,-50%) scale(.1);border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 20%,#e6efff 35%,rgba(147,114,255,.65) 52%,rgba(124,58,237,.20) 69%,transparent 77%);box-shadow:0 0 18px rgba(255,255,255,1),0 0 34px rgba(124,58,237,.72);animation:burstCore .33s ease-out forwards}@keyframes burstCore{0%{transform:translate(-50%,-50%) scale(.15);opacity:.3}35%{transform:translate(-50%,-50%) scale(2);opacity:1}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}.burst-ring{position:absolute;left:0;top:0;width:24px;height:24px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:2px solid rgba(255,255,255,.95)}.burst-ring.one{animation:ringOne .38s ease-out forwards}.burst-ring.two{animation:ringTwo .48s .035s ease-out forwards}@keyframes ringOne{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}@keyframes ringTwo{from{transform:translate(-50%,-50%) scale(.2);opacity:.65}to{transform:translate(-50%,-50%) scale(4.8);opacity:0}}.burst-spark{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.95);animation:sparkFly .38s ease-out forwards}@keyframes sparkFly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(.1);opacity:0}}
.result-frame{position:absolute;left:50%;bottom:20px;width:174px;height:96px;transform:translateX(-50%) scale(.58);opacity:0;border:2px solid rgba(124,58,237,.24);border-radius:25px;background:rgba(255,255,255,.98);box-shadow:0 16px 38px rgba(30,38,56,.18);pointer-events:none;z-index:30;transition:opacity .25s ease,transform .38s cubic-bezier(.16,1.08,.34,1),box-shadow .3s ease,border-color .3s ease}.result-frame.show{opacity:1;transform:translateX(-50%) scale(1)}.result-frame.gravity-active{border-color:rgba(124,58,237,.38);box-shadow:0 16px 38px rgba(30,38,56,.18),0 -5px 28px rgba(124,58,237,.10)}.counter-value{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(35px,5vw,55px);font-weight:900;letter-spacing:-.05em}.counter-value.bump{animation:counterBump .16s ease-out}@keyframes counterBump{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.statusbar{min-height:90px;border-top:1px solid rgba(42,50,70,.13);display:flex;align-items:center;justify-content:center;padding:18px 24px 22px}.status{margin:0;text-align:center;font-size:15px;line-height:1.45;color:var(--muted)}.status strong{color:var(--text)}
@media(max-width:720px){body{padding:10px}.board{border-radius:22px}.stage{height:520px}.number-card{min-width:100px;padding:15px 16px}.cloud-shell{width:45%;height:72%;top:3%}.cloud-shell.left{left:1%}.cloud-shell.right{right:1%}.merged-shell{width:94%;height:70%;top:36%}.particle-wrap.unit-100 .particle-core{width:52px;height:52px;font-size:18px}.particle-wrap.unit-10 .particle-core{width:41px;height:41px;font-size:14px}body[data-mode="medium"] .particle-wrap.unit-10 .particle-core{width:32px;height:32px;font-size:11px}.particle-wrap.unit-1 .particle-core{width:28px;height:28px;font-size:9px}.result-frame{width:158px;height:84px;bottom:18px}}
</style>
</head>
<body data-mode="basic">
<div class="app">
  <div class="topbar">
    <div class="titlebox"><h1>Bulutlarla Toplama</h1><p>Zıt işaretli eş birimler birbirini yok eder.</p></div>
    <div class="controls">
      <a class="home-btn" href="../index.html" aria-label="Projeler ana sayfasına dön">Home</a>
      <button class="level-btn active" data-level="basic">Basit</button>
      <button class="level-btn" data-level="medium">Orta</button>
      <button class="level-btn" data-level="advanced">Gelişmiş</button>
      <button class="new-btn" id="newBtn">Yeni işlem</button>
    </div>
  </div>
  <div class="board" id="board">
    <div class="stage" id="stage">
      <div class="soft-orb one"></div><div class="soft-orb two"></div>
      <div class="cloud-shell left" id="shellA"></div><div class="cloud-shell right" id="shellB"></div>
      <div class="merged-shell" id="mergedShell"></div>
      <button class="number-card left" id="numberA"></button><div class="operator" id="plusSign">+</div><button class="number-card right" id="numberB"></button>
      <div class="result-frame" id="resultFrame"><div class="counter-value" id="counterValue">0</div></div>
    </div>
    <div class="statusbar"><p class="status" id="status"></p></div>
  </div>
</div>
<script>
(()=>{
"use strict";
const board=document.getElementById("board"),stage=document.getElementById("stage"),numberA=document.getElementById("numberA"),numberB=document.getElementById("numberB"),plusSign=document.getElementById("plusSign"),shellA=document.getElementById("shellA"),shellB=document.getElementById("shellB"),mergedShell=document.getElementById("mergedShell"),resultFrame=document.getElementById("resultFrame"),counterValue=document.getElementById("counterValue"),statusEl=document.getElementById("status"),newBtn=document.getElementById("newBtn"),levelButtons=[...document.querySelectorAll(".level-btn")];
const LEVELS={basic:{precision:0,minUnit:100},medium:{precision:1,minUnit:10},advanced:{precision:2,minUnit:1}};
const state={level:"basic",a100:0,b100:0,decomposedA:false,decomposedB:false,decomposingA:false,decomposingB:false,mixingStarted:false,readyForResult:false,busy:false,particles:[],particleSerial:0,activePairPromises:new Set()};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const randomInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const randomSign=()=>Math.random()<.5?-1:1;
const currentConfig=()=>LEVELS[state.level];
const setStatus=html=>statusEl.innerHTML=html;
function generateValue100(){if(state.level==="basic")return randomSign()*randomInt(1,20)*100;if(state.level==="medium"){let n;do n=randomInt(1,199);while(n%10===0);return randomSign()*n*10}let n;do n=randomInt(1,1999);while(n%10===0);return randomSign()*n}
function formatSigned(v,p=currentConfig().precision){if(v===0)return(0).toFixed(p).replace(".",",");return(v>0?"+":"−")+(Math.abs(v)/100).toFixed(p).replace(".",",")}
function formatCounter(v){if(v===0)return"0";const p=v%100===0?0:v%10===0?1:2;return(v>0?"+":"−")+(Math.abs(v)/100).toFixed(p).replace(".",",")}
function particleLabel(sign,unit){const s=sign>0?"+":"−";return unit===100?s+"1":unit===10?s+"0,1":s+"0,01"}
function decomposeValue(v){const sign=v>=0?1:-1,p=[];let r=Math.abs(v),ones=Math.floor(r/100);r%=100;const tenths=Math.floor(r/10),hundredths=r%10;for(let i=0;i<ones;i++)p.push({sign,unit:100});for(let i=0;i<tenths;i++)p.push({sign,unit:10});for(let i=0;i<hundredths;i++)p.push({sign,unit:1});return p}
function particleRadiusByUnit(unit){const m=innerWidth<=720;if(unit===100)return m?26:30;if(unit===10){if(state.level==="medium")return m?16:18;return m?20.5:23}return m?14:16}
function elementCenterInStage(el){const s=stage.getBoundingClientRect(),r=el.getBoundingClientRect();return{x:r.left+r.width/2-s.left,y:r.top+r.height/2-s.top}}
function getCloudGeometry(side){const w=stage.clientWidth,h=stage.clientHeight;if(side==="A")return{cx:w*.235,cy:h*.35,rx:Math.min(w*.195,205),ry:Math.min(h*.34,180)};if(side==="B")return{cx:w*.765,cy:h*.35,rx:Math.min(w*.195,205),ry:Math.min(h*.34,180)};return{cx:w*.5,cy:h*.35,rx:Math.min(w*.365,385),ry:Math.min(h*.34,180)}}
function createGridCloudPoints(items,g){if(!items.length)return[];let maxR=0;for(const item of items)maxR=Math.max(maxR,particleRadiusByUnit(item.unit));let cellX=maxR*2+10,cellY=maxR*2+10;const aw=g.rx*2,ah=g.ry*2;let cols=Math.max(1,Math.floor(aw/cellX)),rows=Math.ceil(items.length/cols);while(rows*cellY>ah&&cols<items.length){cols++;rows=Math.ceil(items.length/cols)}const minCell=maxR*2+3;if(cols*cellX>aw)cellX=Math.max(minCell,aw/cols);if(rows*cellY>ah)cellY=Math.max(minCell,ah/rows);const pts=new Array(items.length),ordered=items.map((item,originalIndex)=>({item,originalIndex})).sort((a,b)=>a.item.unit!==b.item.unit?b.item.unit-a.item.unit:a.originalIndex-b.originalIndex),usedRows=Math.ceil(items.length/cols),totalH=(usedRows-1)*cellY,startY=g.cy-totalH/2;for(let row=0;row<usedRows;row++){const first=row*cols,remaining=items.length-first,count=Math.min(cols,remaining),rowW=(count-1)*cellX,startX=g.cx-rowW/2;for(let col=0;col<count;col++){const entry=ordered[first+col];pts[entry.originalIndex]={x:startX+col*cellX,y:startY+row*cellY}}}return pts}
function createParticle(sign,unit,x,y,side){const wrapper=document.createElement("div");wrapper.className="particle-wrap "+`unit-${unit} `+(sign>0?"positive":"negative");wrapper.style.left=`${x}px`;wrapper.style.top=`${y}px`;const core=document.createElement("div");core.className="particle-core";core.textContent=particleLabel(sign,unit);const dx=.8+Math.random()*.8,dy=.8+Math.random()*.8;core.style.setProperty("--dx",`${dx.toFixed(1)}px`);core.style.setProperty("--dy",`${dy.toFixed(1)}px`);core.style.setProperty("--drift-duration",`${(4.5+Math.random()*1.4).toFixed(2)}s`);core.style.setProperty("--drift-delay",`${(-Math.random()*3).toFixed(2)}s`);wrapper.appendChild(core);stage.appendChild(wrapper);const id=state.particleSerial++,particle={id,el:wrapper,core,sign,unit,side,x,y,alive:true,locked:false,splittable:false,curveSign:id%2===0?1:-1};core.addEventListener("click",e=>{e.stopPropagation();onParticleClick(particle)});state.particles.push(particle);return particle}
async function moveParticle(p,x,y,duration=700,delay=0){if(!p.alive||!p.el.isConnected)return;const ox=p.x,oy=p.y;p.x=x;p.y=y;p.el.style.left=`${x}px`;p.el.style.top=`${y}px`;const a=p.el.animate([{transform:`translate(calc(-50% + ${ox-x}px),calc(-50% + ${oy-y}px))`},{transform:"translate(-50%,-50%)"}],{duration,delay,easing:"cubic-bezier(.18,.72,.22,1)",fill:"both"});try{await a.finished}catch(_){}p.el.style.transform="translate(-50%,-50%)";a.cancel()}
function clearParticles(){for(const p of state.particles)if(p.el&&p.el.isConnected)p.el.remove();state.particles=[];document.querySelectorAll(".match-line,.annihilation-burst").forEach(e=>e.remove())}
function resetVisuals(){clearParticles();shellA.className="cloud-shell left";shellB.className="cloud-shell right";mergedShell.className="merged-shell";numberA.className="number-card left";numberB.className="number-card right";plusSign.className="operator";resultFrame.className="result-frame";counterValue.className="counter-value";counterValue.textContent="0";board.classList.remove("ready-to-mix")}
function newProblem(){document.body.dataset.mode=state.level;state.a100=generateValue100();state.b100=generateValue100();state.decomposedA=state.decomposedB=state.decomposingA=state.decomposingB=state.mixingStarted=state.readyForResult=state.busy=false;state.activePairPromises=new Set();resetVisuals();numberA.textContent=formatSigned(state.a100);numberB.textContent=formatSigned(state.b100);setStatus("Önce sayılardan birine tıkla.")}
async function decomposeOperand(side){if(state.mixingStarted)return;const isA=side==="A";if(isA?(state.decomposedA||state.decomposingA):(state.decomposedB||state.decomposingB))return;if(isA)state.decomposingA=true;else state.decomposingB=true;const button=isA?numberA:numberB,shell=isA?shellA:shellB,value=isA?state.a100:state.b100,source=elementCenterInStage(button),pieces=decomposeValue(value),targets=createGridCloudPoints(pieces,getCloudGeometry(side));shell.classList.add("visible");button.classList.add("gone");await Promise.all(pieces.map((piece,i)=>{const p=createParticle(piece.sign,piece.unit,source.x,source.y,side);return moveParticle(p,targets[i].x,targets[i].y,650,i*8)}));if(isA){state.decomposedA=true;state.decomposingA=false}else{state.decomposedB=true;state.decomposingB=false}updatePreMixState()}
function bothOperandsNegative(){return state.a100<0&&state.b100<0}
function updatePreMixState(){if(state.decomposedA&&state.decomposedB){plusSign.classList.add("ready");board.classList.add("ready-to-mix");if(bothOperandsNegative()){setStatus("İki sayı da negatif. <strong>Sonuca geçirmek için herhangi bir yere tıkla.</strong>")}else{setStatus("İki sayı hazır. <strong>Herhangi bir yere tıkla.</strong>")}return}setStatus("Şimdi diğer sayıya tıkla.")}
const aliveParticles=()=>state.particles.filter(p=>p.alive&&p.el.isConnected);
function quadraticBezier(p0,p1,p2,t){const i=1-t;return{x:i*i*p0.x+2*i*t*p1.x+t*t*p2.x,y:i*i*p0.y+2*i*t*p1.y+t*t*p2.y}}
function mixMoveParticle(p,target,duration){return new Promise(resolve=>{if(!p.alive){resolve();return}const start={x:p.x,y:p.y},dx=target.x-start.x,dy=target.y-start.y,len=Math.max(1,Math.sqrt(dx*dx+dy*dy)),nx=-dy/len,ny=dx/len,bend=(10+(p.id%5)*3)*p.curveSign,control={x:(start.x+target.x)/2+nx*bend,y:(start.y+target.y)/2+ny*bend},started=performance.now();function frame(now){if(!p.alive||p.locked){resolve();return}let t=(now-started)/duration;t=Math.max(0,Math.min(1,t));const q=t*t*(3-2*t),pos=quadraticBezier(start,control,target,q);p.x=pos.x;p.y=pos.y;p.el.style.left=`${pos.x}px`;p.el.style.top=`${pos.y}px`;if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)})}
const distanceBetween=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const matchingRadius=unit=>unit===100?112:unit===10?88:72;
function createMatchLine(a,b){const line=document.createElement("div");line.className="match-line";stage.appendChild(line);updateMatchLine(line,a.x,a.y,b.x,b.y);return line}
function updateMatchLine(line,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI;line.style.left=`${x1}px`;line.style.top=`${y1}px`;line.style.width=`${len}px`;line.style.transform=`translateY(-50%) rotate(${angle}deg)`}
function createAnnihilationBurst(x,y){const burst=document.createElement("div");burst.className="annihilation-burst";burst.style.left=`${x}px`;burst.style.top=`${y}px`;for(const c of ["burst-core","burst-ring one","burst-ring two"]){const e=document.createElement("div");e.className=c;burst.appendChild(e)}for(let i=0;i<10;i++){const s=document.createElement("div");s.className="burst-spark";const a=Math.PI*2*i/10,d=28+(i%3)*7;s.style.setProperty("--sx",`${Math.cos(a)*d}px`);s.style.setProperty("--sy",`${Math.sin(a)*d}px`);burst.appendChild(s)}stage.appendChild(burst);setTimeout(()=>burst.isConnected&&burst.remove(),600)}
async function annihilatePair(a,b){if(!a.alive||!b.alive)return;a.locked=b.locked=true;a.el.classList.add("matching");b.el.classList.add("matching");const line=createMatchLine(a,b);await sleep(75);const sA={x:a.x,y:a.y},sB={x:b.x,y:b.y},target={x:(sA.x+sB.x)/2,y:(sA.y+sB.y)/2},dx=sB.x-sA.x,dy=sB.y-sA.y,len=Math.max(1,Math.hypot(dx,dy)),nx=-dy/len,ny=dx/len,curve=Math.min(14,len*.055),cA={x:(sA.x+target.x)/2+nx*curve,y:(sA.y+target.y)/2+ny*curve},cB={x:(sB.x+target.x)/2-nx*curve,y:(sB.y+target.y)/2-ny*curve};await new Promise(resolve=>{const duration=330,started=performance.now();function frame(now){let t=(now-started)/duration;t=Math.max(0,Math.min(1,t));const q=.12*t+.88*t*t,pa=quadraticBezier(sA,cA,target,q),pb=quadraticBezier(sB,cB,target,q);a.x=pa.x;a.y=pa.y;b.x=pb.x;b.y=pb.y;a.el.style.left=`${pa.x}px`;a.el.style.top=`${pa.y}px`;b.el.style.left=`${pb.x}px`;b.el.style.top=`${pb.y}px`;updateMatchLine(line,pa.x,pa.y,pb.x,pb.y);const near=Math.max(0,(q-.45)/.55);a.core.style.filter=`brightness(${1.08+near*.48}) saturate(${1.12+near*.30})`;b.core.style.filter=a.core.style.filter;if(t<1)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});if(line.isConnected)line.remove();createAnnihilationBurst(target.x,target.y);const vanish=p=>p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(1.34)",opacity:1,offset:.2},{transform:"scale(.02)",opacity:0}],{duration:190,easing:"cubic-bezier(.25,.78,.35,1)",fill:"forwards"}).finished.catch(()=>{});await Promise.all([vanish(a),vanish(b)]);a.alive=b.alive=false;if(a.el.isConnected)a.el.remove();if(b.el.isConnected)b.el.remove()}
function scanForLiveMatches(){const alive=aliveParticles().filter(p=>!p.locked);for(const unit of [100,10,1]){const pos=alive.filter(p=>!p.locked&&p.unit===unit&&p.sign>0),neg=alive.filter(p=>!p.locked&&p.unit===unit&&p.sign<0);if(!pos.length||!neg.length)continue;const candidates=[];for(const p of pos)for(const n of neg)candidates.push({p,n,d:distanceBetween(p,n)});candidates.sort((a,b)=>a.d-b.d);const r=matchingRadius(unit);for(const c of candidates){if(c.p.locked||c.n.locked||!c.p.alive||!c.n.alive)continue;if(c.d<=r){c.p.locked=c.n.locked=true;const promise=annihilatePair(c.p,c.n).finally(()=>state.activePairPromises.delete(promise));state.activePairPromises.add(promise)}}}}
async function finishRemainingMatchesForUnit(unit){while(true){const pos=aliveParticles().filter(p=>!p.locked&&p.unit===unit&&p.sign>0),neg=aliveParticles().filter(p=>!p.locked&&p.unit===unit&&p.sign<0);if(!pos.length||!neg.length)break;let bestA=null,bestB=null,best=Infinity;for(const p of pos)for(const n of neg){const d=distanceBetween(p,n);if(d<best){best=d;bestA=p;bestB=n}}if(!bestA||!bestB)break;bestA.locked=bestB.locked=true;await annihilatePair(bestA,bestB);await sleep(45)}}
async function startDirectNegativeResult(){if(state.mixingStarted||state.busy||!state.decomposedA||!state.decomposedB||!bothOperandsNegative())return;state.mixingStarted=true;board.classList.remove("ready-to-mix");plusSign.classList.remove("ready");plusSign.classList.add("fade-out");shellA.classList.add("direct-result");shellB.classList.add("direct-result");state.readyForResult=true;setStatus("İki negatif sayı doğrudan sonuca gidiyor…");await startResultSequence()}
async function startLiveMixing(){if(state.mixingStarted||state.busy||!state.decomposedA||!state.decomposedB)return;state.mixingStarted=state.busy=true;board.classList.remove("ready-to-mix");plusSign.classList.remove("ready");plusSign.classList.add("fade-out");shellA.classList.add("fusing");shellB.classList.add("fusing");mergedShell.classList.add("visible");setStatus("Sayılar birleşiyor. Yaklaşan zıt birimler birbirlerini buluyor…");const particles=aliveParticles(),targets=createGridCloudPoints(particles,getCloudGeometry("merged")),matcher=setInterval(scanForLiveMatches,24);await Promise.all(particles.map((p,i)=>mixMoveParticle(p,targets[i],950+(i%5)*55)));await sleep(100);scanForLiveMatches();await sleep(130);clearInterval(matcher);if(state.activePairPromises.size)await Promise.all([...state.activePairPromises]);await finishRemainingMatchesForUnit(100);await finishRemainingMatchesForUnit(10);await finishRemainingMatchesForUnit(1);state.busy=false;evaluateMergedState()}
function clearSplittableMarks(){for(const p of aliveParticles()){p.splittable=false;p.el.classList.remove("splittable")}}
function evaluateMergedState(){clearSplittableMarks();const alive=aliveParticles(),signs=new Set(alive.map(p=>p.sign));if(signs.size<=1){state.readyForResult=true;mergedShell.classList.add("ready");setStatus(alive.length===0?"Bütün zıt birimler yok oldu. <strong>Sonuç alanına tıkla.</strong>":"Yok etme tamamlandı. <strong>Sonuç alanına tıkla.</strong>");return}state.readyForResult=false;mergedShell.classList.remove("ready");const min=currentConfig().minUnit;let marked=0;for(const p of alive){if(p.unit<=min)continue;const opp=alive.some(o=>o.sign===-p.sign&&o.unit<p.unit);if(opp){p.splittable=true;p.el.classList.add("splittable");marked++}}if(marked)setStatus("Eş olmayan basamaklar kaldı. <strong>Parlayan büyük birime tıkla.</strong>")}
const nextSmallerUnit=unit=>unit===100?10:unit===10?1:null;
async function splitParticle(p){if(!p.alive||!p.splittable||state.busy)return;const next=nextSmallerUnit(p.unit);if(!next||next<currentConfig().minUnit)return;state.busy=true;clearSplittableMarks();const x=p.x,y=p.y,sign=p.sign;p.alive=false;const shrink=p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.1)",opacity:0}],{duration:180,easing:"ease-in",fill:"forwards"});try{await shrink.finished}catch(_){}if(p.el.isConnected)p.el.remove();const children=[],radius=particleRadiusByUnit(next),gap=radius*2+7,cols=5,totalW=(cols-1)*gap,startX=x-totalW/2,startY=y-gap/2;for(let i=0;i<10;i++){const col=i%cols,row=Math.floor(i/cols),child=createParticle(sign,next,x,y,"merged");children.push({child,x:startX+col*gap,y:startY+row*gap})}await Promise.all(children.map((c,i)=>moveParticle(c.child,c.x,c.y,430,i*8)));await finishRemainingMatchesForUnit(next);state.busy=false;evaluateMergedState()}
async function onParticleClick(p){if(!state.mixingStarted||state.busy)return;if(p.splittable)await splitParticle(p)}
function getBottomFrameContactPoint(p){const sr=stage.getBoundingClientRect(),fr=resultFrame.getBoundingClientRect(),left=fr.left-sr.left,top=fr.top-sr.top,cx=left+fr.width/2,r=particleRadiusByUnit(p.unit),half=Math.max(12,fr.width/2-r*.75-10),off=Math.max(-half,Math.min(half,(p.x-cx)*.28));return{x:cx+off,y:top-r*.72}}
function distanceToFrame(p){const t=getBottomFrameContactPoint(p);return Math.hypot(p.x-t.x,p.y-t.y)}
function createResultQueue(particles){return[...particles].sort((a,b)=>a.unit!==b.unit?b.unit-a.unit:Math.abs(b.y-a.y)>2?b.y-a.y:distanceToFrame(a)-distanceToFrame(b))}
function orderedFallDown(p,startTime,duration,onImpact){return new Promise(resolve=>{if(!p.alive){resolve();return}p.el.classList.add("gravity-fall");p.core.style.animation="none";const start={x:p.x,y:p.y},target=getBottomFrameContactPoint(p),control={x:start.x+(target.x-start.x)*.25,y:start.y+(target.y-start.y)*.5};function frame(now){if(now<startTime){requestAnimationFrame(frame);return}let t=(now-startTime)/duration;t=Math.max(0,Math.min(1,t));const q=.1*t+.9*t*t,pos=quadraticBezier(start,control,target,q);p.x=pos.x;p.y=pos.y;p.el.style.left=`${pos.x}px`;p.el.style.top=`${pos.y}px`;if(t<1){requestAnimationFrame(frame);return}p.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.5)",opacity:.75,offset:.45},{transform:"scale(.05)",opacity:0}],{duration:75,easing:"ease-in",fill:"forwards"}).finished.catch(()=>{}).then(()=>{p.alive=false;if(p.el.isConnected)p.el.remove();onImpact(p);resolve()})}requestAnimationFrame(frame)})}
function counterBump(){counterValue.classList.remove("bump");void counterValue.offsetWidth;counterValue.classList.add("bump")}
async function startResultSequence(){if(!state.readyForResult||state.busy)return;state.busy=true;mergedShell.classList.remove("ready");mergedShell.classList.add("counting");counterValue.textContent="0";resultFrame.classList.add("show");await sleep(260);const particles=aliveParticles();if(!particles.length){counterValue.textContent="0";counterBump();mergedShell.classList.add("finished");setStatus("Sonuç: <strong>0</strong>.");state.busy=false;return}resultFrame.classList.add("gravity-active");setStatus("Kalan birimler aşağı doğru düşerek sonuca katılıyor…");const queue=createResultQueue(particles);let running=0,stagger=queue.length<=8?120:queue.length<=16?100:queue.length<=26?82:68,delay=0,prev=queue[0].unit;const jobs=[],base=performance.now()+40;for(const p of queue){if(p.unit!==prev){delay+=150;prev=p.unit}const target=getBottomFrameContactPoint(p),vertical=Math.max(30,target.y-p.y),duration=300+Math.min(150,vertical*.22),start=base+delay;jobs.push(orderedFallDown(p,start,duration,absorbed=>{running+=absorbed.sign*absorbed.unit;counterValue.textContent=formatCounter(running);counterBump()}));delay+=stagger}await Promise.all(jobs);const result=state.a100+state.b100;counterValue.textContent=formatSigned(result);counterBump();resultFrame.classList.remove("gravity-active");mergedShell.classList.add("finished");setStatus(`Sonuç: <strong>${formatSigned(result)}</strong>.`);state.busy=false}
numberA.addEventListener("click",e=>{e.stopPropagation();decomposeOperand("A")});numberB.addEventListener("click",e=>{e.stopPropagation();decomposeOperand("B")});board.addEventListener("click",()=>{if(!state.mixingStarted&&state.decomposedA&&state.decomposedB&&!state.busy){if(bothOperandsNegative())startDirectNegativeResult();else startLiveMixing()}});mergedShell.addEventListener("click",e=>{e.stopPropagation();if(state.readyForResult)startResultSequence()});newBtn.addEventListener("click",e=>{e.stopPropagation();newProblem()});for(const button of levelButtons)button.addEventListener("click",e=>{e.stopPropagation();state.level=button.dataset.level;levelButtons.forEach(item=>item.classList.toggle("active",item===button));newProblem()});
newProblem();
