<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulutlarla Toplama</title>
<style>
:root{
  --bg:#f5f7fb;
  --text:#1d2433;
  --muted:#6f7787;
  --accent:#7c3aed;
  --shadow:0 18px 45px rgba(42,50,70,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  display:flex;
  justify-content:center;
  padding:24px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 15%,rgba(124,58,237,.08),transparent 28%),
    radial-gradient(circle at 82% 22%,rgba(37,99,235,.08),transparent 30%),
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
button,.particle-core,.merged-shell,input{-webkit-tap-highlight-color:transparent}
button,.particle-core,.merged-shell{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{width:min(1060px,100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.titlebox h1{margin:0;font-size:clamp(24px,3vw,38px);letter-spacing:-.04em}
.titlebox p{margin:6px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.level-btn,.new-btn,.home-btn{
  border:0;border-radius:13px;padding:10px 15px;font:inherit;font-weight:750;color:#3c4352;
  background:rgba(255,255,255,.84);box-shadow:0 6px 18px rgba(40,48,67,.08);cursor:pointer;
  transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.level-btn:hover,.new-btn:hover,.home-btn:hover{transform:translateY(-1px)}
.level-btn.active{color:#fff;background:var(--text);box-shadow:0 8px 20px rgba(29,36,51,.18)}
.new-btn{margin-left:4px;color:var(--accent)}
.home-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#3c4352}
.board{
  position:relative;min-height:610px;overflow:hidden;border:1px solid rgba(255,255,255,.72);border-radius:30px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);box-shadow:var(--shadow);
}
.board.ready-to-mix{cursor:pointer}
.stage{position:relative;width:100%;height:520px;overflow:hidden;transition:height .28s ease}
.soft-orb{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(30px);opacity:.16;pointer-events:none}
.soft-orb.one{left:-100px;top:20px;background:#60a5fa}
.soft-orb.two{right:-120px;bottom:10px;background:#c084fc}
.settings-panel{
  position:absolute;top:14px;right:18px;z-index:60;display:grid;gap:7px;padding:8px 10px;border-radius:13px;
  background:rgba(255,255,255,.88);box-shadow:0 6px 18px rgba(40,48,67,.09);backdrop-filter:blur(8px);
}
.setting-row{display:grid;grid-template-columns:58px 116px;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#4b5565}
.setting-label{display:flex;align-items:center;justify-content:flex-end;gap:4px;white-space:nowrap}
.setting-value{min-width:19px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
.setting-slider{width:116px;accent-color:var(--accent);cursor:pointer}
.operand-layer{position:absolute;inset:0;z-index:5;pointer-events:none}
.operand-card{
  position:absolute;top:154px;transform:translate(-50%,-50%);min-width:100px;padding:15px 17px;border:0;border-radius:18px;
  background:#fff;color:var(--text);font-size:clamp(26px,3.1vw,42px);font-weight:850;letter-spacing:-.04em;
  box-shadow:0 14px 30px rgba(30,38,56,.14);cursor:pointer;z-index:20;pointer-events:auto;
  transition:transform .2s ease,opacity .25s ease,box-shadow .2s ease;
}
.operand-card:hover{transform:translate(-50%,-52%) scale(1.025)}
.operand-card.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.72)}
.dynamic-plus{
  position:absolute;top:154px;transform:translate(-50%,-50%);font-size:clamp(38px,4.8vw,60px);font-weight:500;color:#343b4b;
  opacity:.34;pointer-events:none;z-index:19;transition:opacity .3s ease,transform .3s ease,filter .3s ease;
}
.dynamic-plus.ready{opacity:1;filter:drop-shadow(0 7px 15px rgba(124,58,237,.18));animation:plusPulse 1.55s ease-in-out infinite}
.dynamic-plus.fade-out{opacity:0;transform:translate(-50%,-50%) scale(.65);animation:none}
@keyframes plusPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.operand-shell{
  position:absolute;border-radius:25px;border:2px dashed rgba(75,85,110,.15);background:rgba(255,255,255,.18);
  box-shadow:inset 0 0 38px rgba(40,48,70,.025);opacity:0;transform:scale(.95);transform-origin:center;
  transition:opacity .35s ease,transform .6s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:1;
}
.operand-shell.visible{opacity:1;transform:scale(1)}
.operand-shell.fusing{opacity:0;transform:scale(.96)}
.merged-shell{
  position:absolute;border-radius:30px;border:2px solid rgba(124,58,237,.10);
  background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.48),rgba(255,255,255,.12));
  opacity:0;transform:scale(.84);transform-origin:center;pointer-events:none;z-index:2;
  transition:opacity .45s ease,transform .55s cubic-bezier(.2,.85,.2,1),border-color .25s ease;
}
.merged-shell.visible{opacity:1;transform:scale(1)}
.merged-shell.ready{pointer-events:auto;cursor:pointer;border-color:rgba(124,58,237,.35);animation:shellBreathe 1.75s ease-in-out infinite}
.merged-shell.counting{pointer-events:none;animation:none}
.merged-shell.finished{opacity:0;transform:scale(.5)}
@keyframes shellBreathe{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}50%{box-shadow:0 0 0 10px rgba(124,58,237,.035)}}
.particle-wrap{position:absolute;transform:translate(-50%,-50%);z-index:8;will-change:left,top,transform,opacity}
.particle-core{
  display:grid;place-items:center;border-radius:999px;font-weight:850;letter-spacing:-.03em;border:1px solid rgba(255,255,255,.82);
  box-shadow:0 8px 20px rgba(35,45,70,.13),inset 0 1px 0 rgba(255,255,255,.75);
  animation:drift var(--drift-duration,5s) ease-in-out var(--drift-delay,0s) infinite alternate;
  will-change:transform,box-shadow,filter;
}
.particle-wrap.unit-100 .particle-core{width:60px;height:60px;font-size:21px}
.particle-wrap.unit-10 .particle-core{width:46px;height:46px;font-size:15px}
body[data-mode="medium"] .particle-wrap.unit-10 .particle-core{width:36px;height:36px;font-size:12px}
.particle-wrap.unit-1 .particle-core{width:32px;height:32px;font-size:10px}
.particle-wrap.positive .particle-core{color:#1748a5;background:linear-gradient(145deg,#eef6ff,#d8eaff)}
.particle-wrap.negative .particle-core{color:#a41436;background:linear-gradient(145deg,#fff2f4,#ffdce3)}
.particle-wrap.matching{z-index:20}
.particle-wrap.matching .particle-core{animation:none;filter:brightness(1.12) saturate(1.18)}
.particle-wrap.positive.matching .particle-core{box-shadow:0 0 0 4px rgba(37,99,235,.12),0 0 24px rgba(37,99,235,.52),0 0 45px rgba(37,99,235,.22)}
.particle-wrap.negative.matching .particle-core{box-shadow:0 0 0 4px rgba(225,29,72,.12),0 0 24px rgba(225,29,72,.52),0 0 45px rgba(225,29,72,.22)}
.particle-wrap.splittable .particle-core{
  cursor:pointer;outline:3px solid rgba(124,58,237,.25);box-shadow:0 10px 24px rgba(124,58,237,.22);
  animation:drift var(--drift-duration,5s) ease-in-out var(--drift-delay,0s) infinite alternate,splitPulse 1.15s ease-in-out infinite;
}
.particle-wrap.gravity-fall .particle-core{animation:none;outline:none}
@keyframes drift{from{transform:translate(calc(var(--dx,1.4px)*-1),calc(var(--dy,1.4px)*-1))}to{transform:translate(var(--dx,1.4px),var(--dy,1.4px))}}
@keyframes splitPulse{0%,100%{filter:saturate(1)}50%{filter:saturate(1.15) brightness(1.035)}}
.match-line{
  position:absolute;height:3px;border-radius:999px;transform-origin:0 50%;pointer-events:none;z-index:12;opacity:0;
  background:linear-gradient(90deg,rgba(37,99,235,.18),rgba(37,99,235,.82),rgba(255,255,255,1),rgba(225,29,72,.82),rgba(225,29,72,.18));
  box-shadow:0 0 8px rgba(124,58,237,.28),0 0 14px rgba(255,255,255,.75);animation:lineAppear .10s ease-out forwards;
}
@keyframes lineAppear{from{opacity:0;filter:blur(2px)}to{opacity:.95;filter:blur(0)}}
.annihilation-burst{position:absolute;width:0;height:0;pointer-events:none;z-index:28}
.burst-core{
  position:absolute;left:0;top:0;width:20px;height:20px;transform:translate(-50%,-50%) scale(.1);border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#fff 20%,#e6efff 35%,rgba(147,114,255,.65) 52%,rgba(124,58,237,.20) 69%,transparent 77%);
  box-shadow:0 0 18px rgba(255,255,255,1),0 0 34px rgba(124,58,237,.72);animation:burstCore .33s ease-out forwards;
}
@keyframes burstCore{0%{transform:translate(-50%,-50%) scale(.15);opacity:.3}35%{transform:translate(-50%,-50%) scale(2);opacity:1}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.burst-ring{position:absolute;left:0;top:0;width:24px;height:24px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:2px solid rgba(255,255,255,.95)}
.burst-ring.one{animation:ringOne .38s ease-out forwards}
.burst-ring.two{animation:ringTwo .48s .035s ease-out forwards}
@keyframes ringOne{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
@keyframes ringTwo{from{transform:translate(-50%,-50%) scale(.2);opacity:.65}to{transform:translate(-50%,-50%) scale(4.8);opacity:0}}
.burst-spark{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.95);animation:sparkFly .38s ease-out forwards}
@keyframes sparkFly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--sx),var(--sy)) scale(.1);opacity:0}}
.result-frame{
  position:absolute;left:50%;bottom:20px;width:174px;height:96px;transform:translateX(-50%) scale(.58);opacity:0;
  border:2px solid rgba(124,58,237,.24);border-radius:25px;background:rgba(255,255,255,.98);
  box-shadow:0 16px 38px rgba(30,38,56,.18);pointer-events:none;z-index:30;
  transition:opacity .25s ease,transform .38s cubic-bezier(.16,1.08,.34,1),box-shadow .3s ease,border-color .3s ease;
}
.result-frame.show{opacity:1;transform:translateX(-50%) scale(1)}
.result-frame.gravity-active{border-color:rgba(124,58,237,.38);box-shadow:0 16px 38px rgba(30,38,56,.18),0 -5px 28px rgba(124,58,237,.10)}
.counter-value{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(35px,5vw,55px);font-weight:900;letter-spacing:-.05em}
.counter-value.bump{animation:counterBump .16s ease-out}
@keyframes counterBump{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.statusbar{min-height:90px;border-top:1px solid rgba(42,50,70,.13);display:flex;align-items:center;justify-content:center;padding:18px 24px 22px}
.status{margin:0;text-align:center;font-size:15px;line-height:1.45;color:var(--muted)}
.status strong{color:var(--text)}
@media(max-width:720px){
  body{padding:10px}.board{border-radius:22px}.settings-panel{top:10px;right:10px;padding:7px 8px}.setting-row{grid-template-columns:52px 90px;gap:6px;font-size:11px}.setting-slider{width:90px}
  .operand-card{top:142px;min-width:72px;padding:12px 10px;font-size:clamp(20px,6vw,30px)}.dynamic-plus{top:142px;font-size:36px}
  .particle-wrap.unit-100 .particle-core{width:52px;height:52px;font-size:18px}.particle-wrap.unit-10 .particle-core{width:41px;height:41px;font-size:14px}
  body[data-mode="medium"] .particle-wrap.unit-10 .particle-core{width:32px;height:32px;font-size:11px}.particle-wrap.unit-1 .particle-core{width:28px;height:28px;font-size:9px}
  .result-frame{width:158px;height:84px;bottom:18px}
}
</style>
</head>
<body data-mode="basic">
<div class="app">
  <div class="topbar">
    <div class="titlebox">
      <h1>Bulutlarla Toplama</h1>
      <p>Zıt işaretli eş birimler birbirini yok eder.</p>
    </div>
    <div class="controls">
      <a class="home-btn" href="../index.html" aria-label="Projeler ana sayfasına dön">Home</a>
      <button class="level-btn active" data-level="basic">Basit</button>
      <button class="level-btn" data-level="medium">Orta</button>
      <button class="level-btn" data-level="advanced">Gelişmiş</button>
      <button class="new-btn" id="newBtn">Yeni işlem</button>
    </div>
  </div>

  <div class="board" id="board">
    <div class="stage" id="stage">
      <div class="soft-orb one"></div>
      <div class="soft-orb two"></div>

      <div class="settings-panel" id="settingsPanel">
        <div class="setting-row">
          <span class="setting-label">a = <span class="setting-value" id="aValue">20</span></span>
          <input class="setting-slider" id="aSlider" type="range" min="5" max="50" step="1" value="20" aria-label="a sınırı">
        </div>
        <div class="setting-row">
          <span class="setting-label">n = <span class="setting-value" id="countValue">2</span></span>
          <input class="setting-slider" id="countSlider" type="range" min="2" max="4" step="1" value="2" aria-label="Toplanan sayı adedi">
        </div>
      </div>

      <div class="operand-layer" id="operandLayer"></div>
      <div class="merged-shell" id="mergedShell"></div>
      <div class="result-frame" id="resultFrame"><div class="counter-value" id="counterValue">0</div></div>
    </div>
    <div class="statusbar"><p class="status" id="status"></p></div>
  </div>
</div>

<script>
(() => {
"use strict";

const board = document.getElementById("board");
const stage = document.getElementById("stage");
const operandLayer = document.getElementById("operandLayer");
const mergedShell = document.getElementById("mergedShell");
const resultFrame = document.getElementById("resultFrame");
const counterValue = document.getElementById("counterValue");
const statusEl = document.getElementById("status");
const newBtn = document.getElementById("newBtn");
const settingsPanel = document.getElementById("settingsPanel");
const aSlider = document.getElementById("aSlider");
const aValue = document.getElementById("aValue");
const countSlider = document.getElementById("countSlider");
const countValue = document.getElementById("countValue");
const levelButtons = Array.from(document.querySelectorAll(".level-btn"));

const LEVELS = {
  basic:{precision:0,minUnit:100},
  medium:{precision:1,minUnit:10},
  advanced:{precision:2,minUnit:1}
};

const state = {
  level:"basic",
  limitA:20,
  operandCount:2,
  operands:[],
  plusElements:[],
  particles:[],
  particleSerial:0,
  mixingStarted:false,
  readyForResult:false,
  busy:false,
  activePairPromises:new Set()
};

function sleep(ms){return new Promise(resolve => setTimeout(resolve,ms));}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randomSign(){return Math.random()<.5?-1:1;}
function currentConfig(){return LEVELS[state.level];}
function setStatus(html){statusEl.innerHTML=html;}

function generateValue100(){
  const a=Math.max(5,Math.min(50,state.limitA));
  if(state.level==="basic") return randomSign()*randomInt(1,a-1)*100;
  if(state.level==="medium"){
    let n;
    do{n=randomInt(1,a*10-1);}while(n%10===0);
    return randomSign()*n*10;
  }
  let n;
  do{n=randomInt(1,a*100-1);}while(n%10===0);
  return randomSign()*n;
}

function formatSigned(value100,precision=currentConfig().precision){
  if(value100===0) return (0).toFixed(precision).replace(".",",");
  return (value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(precision).replace(".",",");
}

function formatCounter(value100){
  if(value100===0) return "0";
  const precision=value100%100===0?0:value100%10===0?1:2;
  return (value100>0?"+":"−")+(Math.abs(value100)/100).toFixed(precision).replace(".",",");
}

function particleLabel(sign,unit){
  const prefix=sign>0?"+":"−";
  if(unit===100) return prefix+"1";
  if(unit===10) return prefix+"0,1";
  return prefix+"0,01";
}

function decomposeValue(value100){
  const sign=value100>=0?1:-1;
  let rest=Math.abs(value100);
  const pieces=[];
  const ones=Math.floor(rest/100);
  rest%=100;
  const tenths=Math.floor(rest/10);
  const hundredths=rest%10;
  for(let i=0;i<ones;i++) pieces.push({sign:sign,unit:100});
  for(let i=0;i<tenths;i++) pieces.push({sign:sign,unit:10});
  for(let i=0;i<hundredths;i++) pieces.push({sign:sign,unit:1});
  return pieces;
}

function particleRadiusByUnit(unit){
  const mobile=window.innerWidth<=720;
  if(unit===100) return mobile?26:30;
  if(unit===10){
    if(state.level==="medium") return mobile?16:18;
    return mobile?20.5:23;
  }
  return mobile?14:16;
}

function getOperandCenterRatios(count){
  if(count===2) return [.27,.73];
  if(count===3) return [.18,.50,.82];
  return [.11,.37,.63,.89];
}

function getOperandSegment(index){
  const width=stage.clientWidth;
  const count=state.operandCount;
  const segmentWidth=width/count;
  return {
    left:index*segmentWidth,
    right:(index+1)*segmentWidth,
    width:segmentWidth,
    centerX:(index+.5)*segmentWidth
  };
}

function estimateGridHeight(items,availableWidth){
  if(!items.length) return 80;
  let total=0;
  let previousUnit=null;
  for(const unit of [100,10,1]){
    const count=items.filter(item => item.unit===unit).length;
    if(!count) continue;
    const radius=particleRadiusByUnit(unit);
    const cellX=radius*2+10;
    const maxCols=Math.max(1,Math.floor(availableWidth/cellX));
    const rowCount=Math.ceil(count/maxCols);
    if(previousUnit!==null) total+=18;
    total+=rowCount*(radius*2)+(rowCount-1)*8;
    previousUnit=unit;
  }
  return total;
}

function calculateRequiredStageHeight(){
  const width=Math.max(320,stage.clientWidth||board.clientWidth||900);
  const count=Math.max(2,state.operandCount);
  const segmentWidth=width/count;
  let initialMax=0;
  const allPieces=[];
  for(const operand of state.operands){
    const pieces=decomposeValue(operand.value100);
    allPieces.push.apply(allPieces,pieces);
    initialMax=Math.max(initialMax,estimateGridHeight(pieces,Math.max(70,segmentWidth-26)));
  }
  const mergedHeight=estimateGridHeight(allPieces,Math.max(220,width*.86));
  return Math.max(520,initialMax+245,mergedHeight+265);
}

function getOperandCloudGeometry(index){
  const segment=getOperandSegment(index);
  const pieces=decomposeValue(state.operands[index].value100);
  const contentWidth=Math.max(70,segment.width-26);
  const contentHeight=estimateGridHeight(pieces,contentWidth);
  const top=205;
  return {
    cx:segment.centerX,
    cy:top+contentHeight/2,
    rx:contentWidth/2,
    ry:Math.max(55,contentHeight/2)
  };
}

function getMergedGeometry(){
  const width=stage.clientWidth;
  const alive=aliveParticles();
  const contentWidth=Math.max(220,width*.86);
  const contentHeight=estimateGridHeight(alive,contentWidth);
  const top=192;
  return {
    cx:width/2,
    cy:top+contentHeight/2,
    rx:contentWidth/2,
    ry:Math.max(80,contentHeight/2)
  };
}

function applyShellGeometry(shell,geometry,padX,padY){
  const px=padX||12;
  const py=padY||14;
  shell.style.left=(geometry.cx-geometry.rx-px)+"px";
  shell.style.top=(geometry.cy-geometry.ry-py)+"px";
  shell.style.width=(geometry.rx*2+px*2)+"px";
  shell.style.height=(geometry.ry*2+py*2)+"px";
}

function createGridCloudPoints(items,geometry){
  if(!items.length) return [];
  const points=new Array(items.length);
  const availableWidth=geometry.rx*2;
  const rows=[];
  for(const unit of [100,10,1]){
    const entries=items.map((item,originalIndex) => ({item:item,originalIndex:originalIndex})).filter(entry => entry.item.unit===unit);
    if(!entries.length) continue;
    const radius=particleRadiusByUnit(unit);
    const cellX=radius*2+10;
    const maxColumns=Math.max(1,Math.floor(availableWidth/cellX));
    for(let i=0;i<entries.length;i+=maxColumns){
      rows.push({unit:unit,radius:radius,cellX:cellX,entries:entries.slice(i,i+maxColumns)});
    }
  }
  let totalHeight=0;
  for(let i=0;i<rows.length;i++){
    totalHeight+=rows[i].radius*2;
    if(i<rows.length-1) totalHeight+=rows[i+1].unit===rows[i].unit?8:18;
  }
  let top=geometry.cy-totalHeight/2;
  for(let i=0;i<rows.length;i++){
    const row=rows[i];
    const count=row.entries.length;
    const rowWidth=(count-1)*row.cellX;
    const startX=geometry.cx-rowWidth/2;
    const y=top+row.radius;
    for(let col=0;col<count;col++){
      const entry=row.entries[col];
      points[entry.originalIndex]={x:startX+col*row.cellX,y:y};
    }
    top+=row.radius*2;
    if(i<rows.length-1) top+=rows[i+1].unit===row.unit?8:18;
  }
  return points;
}

function clearDynamicOperands(){
  operandLayer.innerHTML="";
  state.plusElements=[];
}

function renderOperands(){
  clearDynamicOperands();
  const centers=getOperandCenterRatios(state.operandCount);
  for(let i=0;i<state.operands.length;i++){
    const operand=state.operands[i];
    const shell=document.createElement("div");
    shell.className="operand-shell";
    shell.dataset.index=String(i);
    operandLayer.appendChild(shell);

    const card=document.createElement("button");
    card.className="operand-card";
    card.style.left=(centers[i]*100)+"%";
    card.textContent=formatSigned(operand.value100);
    card.dataset.index=String(i);
    card.addEventListener("click",event => {
      event.stopPropagation();
      decomposeOperand(i);
    });
    operandLayer.appendChild(card);

    operand.shell=shell;
    operand.card=card;

    const geometry=getOperandCloudGeometry(i);
    applyShellGeometry(shell,geometry,10,12);

    if(i<state.operands.length-1){
      const plus=document.createElement("div");
      plus.className="dynamic-plus";
      plus.textContent="+";
      plus.style.left=(((centers[i]+centers[i+1])/2)*100)+"%";
      operandLayer.appendChild(plus);
      state.plusElements.push(plus);
    }
  }
}

function createParticle(sign,unit,x,y,sourceIndex){
  const wrapper=document.createElement("div");
  wrapper.className="particle-wrap unit-"+unit+" "+(sign>0?"positive":"negative");
  wrapper.style.left=x+"px";
  wrapper.style.top=y+"px";
  const core=document.createElement("div");
  core.className="particle-core";
  core.textContent=particleLabel(sign,unit);
  const dx=.8+Math.random()*.8;
  const dy=.8+Math.random()*.8;
  core.style.setProperty("--dx",dx.toFixed(1)+"px");
  core.style.setProperty("--dy",dy.toFixed(1)+"px");
  core.style.setProperty("--drift-duration",(4.5+Math.random()*1.4).toFixed(2)+"s");
  core.style.setProperty("--drift-delay",(-Math.random()*3).toFixed(2)+"s");
  wrapper.appendChild(core);
  stage.appendChild(wrapper);
  const id=state.particleSerial++;
  const particle={id:id,el:wrapper,core:core,sign:sign,unit:unit,sourceIndex:sourceIndex,x:x,y:y,alive:true,locked:false,splittable:false,curveSign:id%2===0?1:-1};
  core.addEventListener("click",event => {
    event.stopPropagation();
    onParticleClick(particle);
  });
  state.particles.push(particle);
  return particle;
}

async function moveParticle(particle,x,y,duration,delay){
  if(duration===undefined) duration=700;
  if(delay===undefined) delay=0;
  if(!particle.alive||!particle.el.isConnected) return;
  const oldX=particle.x;
  const oldY=particle.y;
  particle.x=x;
  particle.y=y;
  particle.el.style.left=x+"px";
  particle.el.style.top=y+"px";
  const animation=particle.el.animate([
    {transform:"translate(calc(-50% + "+(oldX-x)+"px),calc(-50% + "+(oldY-y)+"px))"},
    {transform:"translate(-50%,-50%)"}
  ],{duration:duration,delay:delay,easing:"cubic-bezier(.18,.72,.22,1)",fill:"both"});
  try{await animation.finished;}catch(_){ }
  particle.el.style.transform="translate(-50%,-50%)";
  animation.cancel();
}

function clearParticles(){
  for(const particle of state.particles){
    if(particle.el&&particle.el.isConnected) particle.el.remove();
  }
  state.particles=[];
  document.querySelectorAll(".match-line,.annihilation-burst").forEach(element => element.remove());
}

function resetVisuals(){
  clearParticles();
  mergedShell.className="merged-shell";
  mergedShell.removeAttribute("style");
  resultFrame.className="result-frame";
  counterValue.className="counter-value";
  counterValue.textContent="0";
  board.classList.remove("ready-to-mix");
}

function newProblem(){
  document.body.dataset.mode=state.level;
  state.operands=[];
  for(let i=0;i<state.operandCount;i++){
    state.operands.push({value100:generateValue100(),decomposed:false,decomposing:false,card:null,shell:null});
  }
  state.mixingStarted=false;
  state.readyForResult=false;
  state.busy=false;
  state.activePairPromises=new Set();
  resetVisuals();
  stage.style.height=calculateRequiredStageHeight()+"px";
  renderOperands();
  setStatus("Önce sayılardan birine tıkla.");
}

function elementCenterInStage(element){
  const stageRect=stage.getBoundingClientRect();
  const rect=element.getBoundingClientRect();
  return {x:rect.left+rect.width/2-stageRect.left,y:rect.top+rect.height/2-stageRect.top};
}

async function decomposeOperand(index){
  if(state.mixingStarted) return;
  const operand=state.operands[index];
  if(!operand||operand.decomposed||operand.decomposing) return;
  operand.decomposing=true;
  const source=elementCenterInStage(operand.card);
  const pieces=decomposeValue(operand.value100);
  const geometry=getOperandCloudGeometry(index);
  applyShellGeometry(operand.shell,geometry,10,12);
  const targets=createGridCloudPoints(pieces,geometry);
  operand.shell.classList.add("visible");
  operand.card.classList.add("gone");
  await Promise.all(pieces.map((piece,pieceIndex) => {
    const particle=createParticle(piece.sign,piece.unit,source.x,source.y,index);
    return moveParticle(particle,targets[pieceIndex].x,targets[pieceIndex].y,650,pieceIndex*7);
  }));
  operand.decomposed=true;
  operand.decomposing=false;
  updatePreMixState();
}

function allOperandsDecomposed(){
  return state.operands.length>0&&state.operands.every(operand => operand.decomposed);
}

function updatePreMixState(){
  if(allOperandsDecomposed()){
    state.plusElements.forEach(element => element.classList.add("ready"));
    board.classList.add("ready-to-mix");
    setStatus(state.operandCount+" sayı hazır. <strong>Herhangi bir yere tıkla.</strong>");
    return;
  }
  const remaining=state.operands.filter(operand => !operand.decomposed).length;
  setStatus(remaining===1?"Şimdi son sayıya tıkla.":"Diğer sayılara da tıkla.");
}

function aliveParticles(){return state.particles.filter(particle => particle.alive&&particle.el.isConnected);}

function quadraticBezier(p0,p1,p2,t){
  const inv=1-t;
  return {x:inv*inv*p0.x+2*inv*t*p1.x+t*t*p2.x,y:inv*inv*p0.y+2*inv*t*p1.y+t*t*p2.y};
}

function mixMoveParticle(particle,target,duration){
  return new Promise(resolve => {
    if(!particle.alive){resolve();return;}
    const start={x:particle.x,y:particle.y};
    const dx=target.x-start.x;
    const dy=target.y-start.y;
    const length=Math.max(1,Math.hypot(dx,dy));
    const nx=-dy/length;
    const ny=dx/length;
    const bend=(10+(particle.id%5)*3)*particle.curveSign;
    const control={x:(start.x+target.x)/2+nx*bend,y:(start.y+target.y)/2+ny*bend};
    const started=performance.now();
    function frame(now){
      if(!particle.alive||particle.locked){resolve();return;}
      let t=(now-started)/duration;
      t=Math.max(0,Math.min(1,t));
      const q=t*t*(3-2*t);
      const position=quadraticBezier(start,control,target,q);
      particle.x=position.x;
      particle.y=position.y;
      particle.el.style.left=position.x+"px";
      particle.el.style.top=position.y+"px";
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

function distanceBetween(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function matchingRadius(unit){return unit===100?112:unit===10?88:72;}

function createMatchLine(a,b){
  const line=document.createElement("div");
  line.className="match-line";
  stage.appendChild(line);
  updateMatchLine(line,a.x,a.y,b.x,b.y);
  return line;
}

function updateMatchLine(line,x1,y1,x2,y2){
  const dx=x2-x1;
  const dy=y2-y1;
  const length=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  line.style.left=x1+"px";
  line.style.top=y1+"px";
  line.style.width=length+"px";
  line.style.transform="translateY(-50%) rotate("+angle+"deg)";
}

function createAnnihilationBurst(x,y){
  const burst=document.createElement("div");
  burst.className="annihilation-burst";
  burst.style.left=x+"px";
  burst.style.top=y+"px";
  for(const className of ["burst-core","burst-ring one","burst-ring two"]){
    const element=document.createElement("div");
    element.className=className;
    burst.appendChild(element);
  }
  for(let i=0;i<10;i++){
    const spark=document.createElement("div");
    spark.className="burst-spark";
    const angle=Math.PI*2*i/10;
    const distance=28+(i%3)*7;
    spark.style.setProperty("--sx",Math.cos(angle)*distance+"px");
    spark.style.setProperty("--sy",Math.sin(angle)*distance+"px");
    burst.appendChild(spark);
  }
  stage.appendChild(burst);
  setTimeout(() => {if(burst.isConnected) burst.remove();},600);
}

async function annihilatePair(a,b){
  if(!a.alive||!b.alive) return;
  a.locked=true;
  b.locked=true;
  a.el.classList.add("matching");
  b.el.classList.add("matching");
  const line=createMatchLine(a,b);
  await sleep(75);
  const startA={x:a.x,y:a.y};
  const startB={x:b.x,y:b.y};
  const target={x:(startA.x+startB.x)/2,y:(startA.y+startB.y)/2};
  const dx=startB.x-startA.x;
  const dy=startB.y-startA.y;
  const length=Math.max(1,Math.hypot(dx,dy));
  const nx=-dy/length;
  const ny=dx/length;
  const curve=Math.min(14,length*.055);
  const controlA={x:(startA.x+target.x)/2+nx*curve,y:(startA.y+target.y)/2+ny*curve};
  const controlB={x:(startB.x+target.x)/2-nx*curve,y:(startB.y+target.y)/2-ny*curve};
  await new Promise(resolve => {
    const duration=330;
    const started=performance.now();
    function frame(now){
      let t=(now-started)/duration;
      t=Math.max(0,Math.min(1,t));
      const q=.12*t+.88*t*t;
      const positionA=quadraticBezier(startA,controlA,target,q);
      const positionB=quadraticBezier(startB,controlB,target,q);
      a.x=positionA.x;a.y=positionA.y;b.x=positionB.x;b.y=positionB.y;
      a.el.style.left=positionA.x+"px";a.el.style.top=positionA.y+"px";
      b.el.style.left=positionB.x+"px";b.el.style.top=positionB.y+"px";
      updateMatchLine(line,positionA.x,positionA.y,positionB.x,positionB.y);
      const near=Math.max(0,(q-.45)/.55);
      a.core.style.filter="brightness("+(1.08+near*.48)+") saturate("+(1.12+near*.30)+")";
      b.core.style.filter=a.core.style.filter;
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
  if(line.isConnected) line.remove();
  createAnnihilationBurst(target.x,target.y);
  const vanish=particle => particle.core.animate([
    {transform:"scale(1)",opacity:1},
    {transform:"scale(1.34)",opacity:1,offset:.2},
    {transform:"scale(.02)",opacity:0}
  ],{duration:190,easing:"cubic-bezier(.25,.78,.35,1)",fill:"forwards"}).finished.catch(() => {});
  await Promise.all([vanish(a),vanish(b)]);
  a.alive=false;
  b.alive=false;
  if(a.el.isConnected) a.el.remove();
  if(b.el.isConnected) b.el.remove();
}

function scanForLiveMatches(){
  const alive=aliveParticles().filter(particle => !particle.locked);
  for(const unit of [100,10,1]){
    const positives=alive.filter(particle => !particle.locked&&particle.unit===unit&&particle.sign>0);
    const negatives=alive.filter(particle => !particle.locked&&particle.unit===unit&&particle.sign<0);
    if(!positives.length||!negatives.length) continue;
    const candidates=[];
    for(const positive of positives){
      for(const negative of negatives){
        candidates.push({positive:positive,negative:negative,distance:distanceBetween(positive,negative)});
      }
    }
    candidates.sort((a,b) => a.distance-b.distance);
    const radius=matchingRadius(unit);
    for(const candidate of candidates){
      const a=candidate.positive;
      const b=candidate.negative;
      if(a.locked||b.locked||!a.alive||!b.alive) continue;
      if(candidate.distance<=radius){
        a.locked=true;
        b.locked=true;
        const promise=annihilatePair(a,b).finally(() => state.activePairPromises.delete(promise));
        state.activePairPromises.add(promise);
      }
    }
  }
}

async function finishRemainingMatchesForUnit(unit){
  while(true){
    const positives=aliveParticles().filter(particle => !particle.locked&&particle.unit===unit&&particle.sign>0);
    const negatives=aliveParticles().filter(particle => !particle.locked&&particle.unit===unit&&particle.sign<0);
    if(!positives.length||!negatives.length) break;
    let bestA=null;
    let bestB=null;
    let bestDistance=Infinity;
    for(const positive of positives){
      for(const negative of negatives){
        const distance=distanceBetween(positive,negative);
        if(distance<bestDistance){bestDistance=distance;bestA=positive;bestB=negative;}
      }
    }
    if(!bestA||!bestB) break;
    bestA.locked=true;
    bestB.locked=true;
    await annihilatePair(bestA,bestB);
    await sleep(45);
  }
}

async function startLiveMixing(){
  if(state.mixingStarted||state.busy||!allOperandsDecomposed()) return;
  state.mixingStarted=true;
  state.busy=true;
  board.classList.remove("ready-to-mix");
  state.plusElements.forEach(element => {element.classList.remove("ready");element.classList.add("fade-out");});
  state.operands.forEach(operand => operand.shell.classList.add("fusing"));
  const particles=aliveParticles();
  const geometry=getMergedGeometry();
  applyShellGeometry(mergedShell,geometry,16,18);
  mergedShell.classList.add("visible");
  setStatus("Sayılar birleşiyor. Yaklaşan zıt birimler birbirlerini buluyor…");
  const targets=createGridCloudPoints(particles,geometry);
  const matcher=setInterval(scanForLiveMatches,24);
  await Promise.all(particles.map((particle,index) => mixMoveParticle(particle,targets[index],950+(index%5)*55)));
  await sleep(100);
  scanForLiveMatches();
  await sleep(130);
  clearInterval(matcher);
  if(state.activePairPromises.size) await Promise.all(Array.from(state.activePairPromises));
  await finishRemainingMatchesForUnit(100);
  await finishRemainingMatchesForUnit(10);
  await finishRemainingMatchesForUnit(1);
  state.busy=false;
  await reflowMergedParticles(260);
  evaluateMergedState();
}

async function reflowMergedParticles(duration){
  const particles=aliveParticles().filter(particle => !particle.locked);
  if(!particles.length) return;
  const geometry=getMergedGeometry();
  applyShellGeometry(mergedShell,geometry,16,18);
  const targets=createGridCloudPoints(particles,geometry);
  await Promise.all(particles.map((particle,index) => moveParticle(particle,targets[index].x,targets[index].y,duration||260,index*3)));
}

function clearSplittableMarks(){
  for(const particle of aliveParticles()){
    particle.splittable=false;
    particle.el.classList.remove("splittable");
  }
}

function evaluateMergedState(){
  clearSplittableMarks();
  const alive=aliveParticles();
  const signs=new Set(alive.map(particle => particle.sign));
  if(signs.size<=1){
    state.readyForResult=true;
    mergedShell.classList.add("ready");
    setStatus(alive.length===0?"Bütün zıt birimler yok oldu. <strong>Sonuç alanına tıkla.</strong>":"Yok etme tamamlandı. <strong>Sonuç alanına tıkla.</strong>");
    return;
  }
  state.readyForResult=false;
  mergedShell.classList.remove("ready");
  const minimumUnit=currentConfig().minUnit;
  let marked=0;
  for(const particle of alive){
    if(particle.unit<=minimumUnit) continue;
    const oppositeSmaller=alive.some(other => other.sign===-particle.sign&&other.unit<particle.unit);
    if(oppositeSmaller){
      particle.splittable=true;
      particle.el.classList.add("splittable");
      marked++;
    }
  }
  if(marked) setStatus("Eş olmayan basamaklar kaldı. <strong>Parlayan büyük birime tıkla.</strong>");
}

function nextSmallerUnit(unit){return unit===100?10:unit===10?1:null;}

async function splitParticle(particle){
  if(!particle.alive||!particle.splittable||state.busy) return;
  const nextUnit=nextSmallerUnit(particle.unit);
  if(!nextUnit||nextUnit<currentConfig().minUnit) return;
  state.busy=true;
  clearSplittableMarks();
  const x=particle.x;
  const y=particle.y;
  const sign=particle.sign;
  particle.alive=false;
  const shrink=particle.core.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.1)",opacity:0}],{duration:180,easing:"ease-in",fill:"forwards"});
  try{await shrink.finished;}catch(_){ }
  if(particle.el.isConnected) particle.el.remove();
  const children=[];
  const radius=particleRadiusByUnit(nextUnit);
  const gap=radius*2+7;
  const columns=5;
  const totalWidth=(columns-1)*gap;
  const startX=x-totalWidth/2;
  const startY=y-gap/2;
  for(let i=0;i<10;i++){
    const column=i%columns;
    const row=Math.floor(i/columns);
    const child=createParticle(sign,nextUnit,x,y,-1);
    children.push({child:child,x:startX+column*gap,y:startY+row*gap});
  }
  await Promise.all(children.map((item,index) => moveParticle(item.child,item.x,item.y,430,index*8)));
  await finishRemainingMatchesForUnit(nextUnit);
  await reflowMergedParticles(320);
  state.busy=false;
  evaluateMergedState();
}

async function onParticleClick(particle){
  if(!state.mixingStarted||state.busy) return;
  if(particle.splittable) await splitParticle(particle);
}

function getBottomFrameContactPoint(particle){
  const stageRect=stage.getBoundingClientRect();
  const frameRect=resultFrame.getBoundingClientRect();
  const left=frameRect.left-stageRect.left;
  const top=frameRect.top-stageRect.top;
  const centerX=left+frameRect.width/2;
  const radius=particleRadiusByUnit(particle.unit);
  const half=Math.max(12,frameRect.width/2-radius*.75-10);
  const offset=Math.max(-half,Math.min(half,(particle.x-centerX)*.28));
  return {x:centerX+offset,y:top-radius*.72};
}

function distanceToFrame(particle){
  const target=getBottomFrameContactPoint(particle);
  return Math.hypot(particle.x-target.x,particle.y-target.y);
}

function createResultQueue(particles){
  return particles.slice().sort((a,b) => {
    if(a.unit!==b.unit) return b.unit-a.unit;
    if(Math.abs(b.y-a.y)>2) return b.y-a.y;
    return distanceToFrame(a)-distanceToFrame(b);
  });
}

function orderedFallDown(particle,startTime,duration,onImpact){
  return new Promise(resolve => {
    if(!particle.alive){resolve();return;}
    particle.el.classList.add("gravity-fall");
    particle.core.style.animation="none";
    const start={x:particle.x,y:particle.y};
    const target=getBottomFrameContactPoint(particle);
    const control={x:start.x+(target.x-start.x)*.25,y:start.y+(target.y-start.y)*.5};
    function frame(now){
      if(now<startTime){requestAnimationFrame(frame);return;}
      let t=(now-startTime)/duration;
      t=Math.max(0,Math.min(1,t));
      const q=.1*t+.9*t*t;
      const position=quadraticBezier(start,control,target,q);
      particle.x=position.x;
      particle.y=position.y;
      particle.el.style.left=position.x+"px";
      particle.el.style.top=position.y+"px";
      if(t<1){requestAnimationFrame(frame);return;}
      particle.core.animate([
        {transform:"scale(1)",opacity:1},
        {transform:"scale(.5)",opacity:.75,offset:.45},
        {transform:"scale(.05)",opacity:0}
      ],{duration:75,easing:"ease-in",fill:"forwards"}).finished.catch(() => {}).then(() => {
        particle.alive=false;
        if(particle.el.isConnected) particle.el.remove();
        onImpact(particle);
        resolve();
      });
    }
    requestAnimationFrame(frame);
  });
}

function counterBump(){
  counterValue.classList.remove("bump");
  void counterValue.offsetWidth;
  counterValue.classList.add("bump");
}

function exactResult100(){
  return state.operands.reduce((sum,operand) => sum+operand.value100,0);
}

async function startResultSequence(){
  if(!state.readyForResult||state.busy) return;
  state.busy=true;
  mergedShell.classList.remove("ready");
  mergedShell.classList.add("counting");
  counterValue.textContent="0";
  resultFrame.classList.add("show");
  await sleep(260);
  const particles=aliveParticles();
  if(!particles.length){
    counterValue.textContent="0";
    counterBump();
    mergedShell.classList.add("finished");
    setStatus("Sonuç: <strong>0</strong>.");
    state.busy=false;
    return;
  }
  resultFrame.classList.add("gravity-active");
  setStatus("Kalan birimler aşağı doğru düşerek sonuca katılıyor…");
  const queue=createResultQueue(particles);
  let running=0;
  const stagger=queue.length<=8?120:queue.length<=16?100:queue.length<=26?82:68;
  let delay=0;
  let previousUnit=queue[0].unit;
  const jobs=[];
  const baseTime=performance.now()+40;
  for(const particle of queue){
    if(particle.unit!==previousUnit){delay+=150;previousUnit=particle.unit;}
    const target=getBottomFrameContactPoint(particle);
    const verticalDistance=Math.max(30,target.y-particle.y);
    const duration=300+Math.min(150,verticalDistance*.22);
    const startTime=baseTime+delay;
    jobs.push(orderedFallDown(particle,startTime,duration,absorbed => {
      running+=absorbed.sign*absorbed.unit;
      counterValue.textContent=formatCounter(running);
      counterBump();
    }));
    delay+=stagger;
  }
  await Promise.all(jobs);
  const result=exactResult100();
  counterValue.textContent=formatSigned(result);
  counterBump();
  resultFrame.classList.remove("gravity-active");
  mergedShell.classList.add("finished");
  setStatus("Sonuç: <strong>"+formatSigned(result)+"</strong>.");
  state.busy=false;
