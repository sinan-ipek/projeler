<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#eef1f4;color:#263545}
#viewport{position:absolute;inset:0;touch-action:none}

#toolbar{position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 28px)}

#settings .cameras{display:flex;gap:5px}
#settings .cameras button{padding:5px 8px;min-height:30px;border-radius:7px;font-size:12px;box-shadow:none;background:#ffffffd9}
#settings .mini-slider{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-height:30px}
#settings input[type=range]{width:168px;min-width:0;accent-color:#668ab1;cursor:pointer}
#settings output{font-size:10px;min-width:23px;text-align:right;color:#66798b;font-variant-numeric:tabular-nums}
#settings label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

#stepbox{display:none;position:absolute;top:72px;left:14px;z-index:5;max-width:min(355px,calc(100vw - 28px));background:#fffffff2;border:1px solid #cad4df;border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px #4c61762e;line-height:1.55}

#message{position:absolute;right:14px;bottom:14px;background:#ffffffd9;border:1px solid #d8e0e8;border-radius:9px;padding:8px 11px;color:#617184;font-size:12px;pointer-events:none;z-index:4}

#planetInfoText{display:block;font-weight:700}
#planetInfo .infoHint{display:block;margin-top:9px;color:#765b37;font:400 9px/1.15 Arial,sans-serif}

#themeButton{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
#helpButton{width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
#helpOverlay{position:fixed;inset:0;background:#2030405a;display:none;align-items:center;justify-content:center;z-index:10020;padding:20px}

#helpPanel{width:min(460px,100%);max-height:min(85vh,750px);overflow:auto;background:#fff;border-radius:15px;padding:23px 25px;box-shadow:0 18px 50px #25354455;color:#263545;font-size:14px;line-height:1.65}

#helpPanel ul{margin:4px 0 10px;padding-left:20px}

(function(){
 const btn=document.getElementById('helpButton'),overlay=document.getElementById('helpOverlay'),close=document.getElementById('closeHelp');
 let previousFocus=null;
 function show(){previousFocus=document.activeElement;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');close.focus()}
 function hide(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');if(previousFocus&&previousFocus.focus)previousFocus.focus()}
 btn.addEventListener('click',show);
 close.addEventListener('click',hide);
 overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open')){e.preventDefault();e.stopImmediatePropagation();hide()}},true);
})();
</script>

const I18N_HELP={tr:"\n    <p>Burada gezegenler oluşturabilir ve birbirlerini nasıl çektiklerini izleyebilirsin. Gezegenlerin hareketi kütleçekimine göre hesaplanır.</p>\n    <h3>Gezegen oluştur</h3>\n    <p>Boş alana <strong>çift tıkla</strong>: gezegen hemen oluşur ve seçilir. Yükseklik sıfır, büyüklük ilk mavi gezegenle aynıdır. Yatay hızı en büyük gezegenin çevresinde saat yönünde, kaçış hızının yarısı kadar; düşey hızı sıfırdır.</p>\n    <h3>Gezegenleri değiştir</h3>\n    <p>Bir gezegene sol tıkla: gündüz koyu mavi, gece sarı bir halka belirir ve seçilir. Başka gezegenlere de tıklayarak çoklu seçim yapabilir veya sağ tık menüsündeki <strong>Tümünü seç</strong> seçeneğiyle bütün gezegenleri seçebilirsin. Gezegenler <strong>boş alana tıklayana kadar</strong> seçili kalır. Seçili gezegenlerden birine sağ tıklayıp Düzenle'yi açarsan tümü birlikte düzenlenir: konum ve yükseklikte aynı yer değiştirme, hızda aynı hız değişimi, büyüklükte aynı oran uygulanır. Küçük gezegenlerde de halka görünür. Boş alana tıklarsan seçim kalkar. Düzenlemek için sağ tıkla ve <strong>Düzenle ▸</strong> menüsünden <strong>Konum, Yükseklik, Büyüklük</strong> veya <strong>Hız</strong> seç. Konum yalnızca yatay (X/Z) konumu; Yükseklik yalnızca düşey (Y) konumu ayarlar. İkisi de tek aşamalıdır. Hızda önce yatay hız bileşenini, sonraki tıklamada düşey hız bileşenini ayarlarsın. Büyüklük tek aşamalıdır. Son tıklamayla veya herhangi bir aşamada Enter ile kabul, Esc ile iptal edebilirsin. Yeni gezegen oluştururken önceki sıralı aşamalar aynen devam eder. Gezegenin üstüne sağ tıklayarak <strong>Kopyala / Yapıştır / Sil</strong> seçeneklerini kullanabilir; <strong>Sil</strong> seçili bütün gezegenleri kaldırır. veya seçip <strong>Delete</strong> ile silebilirsin. Boş alana sağ tıklayarak da yapıştırabilirsin.</p>\n    <p><strong>Ctrl+C:</strong> Seçili gezegenin konumunu, hızını, yarıçapını, kütlesini ve rengini hafızaya al. <strong>Ctrl+V:</strong> Aynı özelliklerle, fareyle gösterdiğin yatay konuma yeni bir gezegen yapıştır. İstediğin kadar tekrarla.</p>\n    <h3>Kamerayı kullan</h3>\n    <ul>\n      <li><strong>Sol fare tuşuyla sürükle:</strong> Kamerayı döndür.</li>\n      <li><strong>Sağ fare tuşuyla sürükle:</strong> Görüntüyü kaydır.</li>\n      <li><strong>Fare tekerleği:</strong> Yaklaş veya uzaklaş.</li>\n      <li><strong>Alt tuşu:</strong> Büyüteci aç.</li><li><strong>☾ / ☀:</strong> Koyu veya aydınlık arka plan.</li>\n      <li><strong>Üstten / Yandan:</strong> Hazır kamera açılarına geç.</li>\n    </ul>\n    <h3>Hazır sistemler</h3><p>Sağ tık → <strong>Ekle ▸</strong> ile on altı hazır sistem oluşturabilirsin. Sistemin merkezi sağ tıkladığın noktadır; mevcut gezegenler korunur. Ekleme sonrası hareketi Başlat ile izle. İdeal yörüngeler diğer cisimlerin çekimi ve sayısal hesaplama nedeniyle zamanla değişebilir.</p><h3>Diğer kontroller</h3>\n    <ul>\n      <li><strong>▶ / ❚❚ veya Boşluk:</strong> Başlat ya da duraklat.</li>\n      <li><strong>Sıfırla:</strong> Başlangıçtaki gezegenlere dön.</li>\n      <li><strong>Yörünge:</strong> Gezegenlerin izlerini göster veya gizle.</li><li><strong>Kütle Merkezi:</strong> Seçili gezegenlerin; seçim yoksa tüm sistemin kütle merkezini mor halka ile gösterir.</li><li><strong>Kuvvetler:</strong> Her gezegene etki eden toplam çekim kuvvetini mor oklarla gösterir. Ok uzunlukları anlık en büyük kuvvete göre ölçeklenir.</li><li><strong>Hızlar:</strong> Tüm gezegenlerin hız vektörlerini oklarla gösterir; tekrar tıklayınca gizler.</li><li><strong>Yapışma:</strong> Açıkken birbirine değen gezegenler anında birleşir. Yalnızca gece modunda kısa sarı ışın efekti gösterilir. Kütleleri toplanır; konumları kütle merkezine, hızları momentumun korunmasına göre hesaplanır. Renkleri kütlelerine göre karıştırılır. Tekrar tıklarsan birleşme kapanır.</li>\n      <li><strong>Kısa sürgüler:</strong> Animasyon hızını ve yörünge izi uzunluğunu ayarla.</li>\n      <li><strong>Kırmızı hız oku:</strong> Hesaplanan kaçış hızı aşıldı.</li>\n    </ul>",en:"<p>Create planets, move them and see how gravity affects their motion. Switch to Planet mode for a uniform downward gravitational field.</p><h3>Create a planet</h3><p>Double-click empty space to create and select a planet. Its initial height is zero, vertical velocity is zero and its horizontal velocity is based on the largest nearby planet.</p><h3>Select and edit</h3><p>Click planets to select them. Selection rings appear in dark blue by day and yellow at night. Click additional planets to select a group, or choose <strong>Select All</strong> from the right-click menu. Click empty space to clear the selection. Right-click and choose <strong>Edit ▸</strong> to modify <strong>Position</strong> (horizontal X/Z), <strong>Height</strong> (vertical Y), <strong>Size</strong> or <strong>Horizontal Velocity</strong> or <strong>Vertical Velocity</strong>. Position and height use relative pointer movement, so selected bodies do not jump. Group edits apply the same displacement, speed change or scale factor. A click confirms each stage. Press Enter to finish and Esc to cancel.</p><p><strong>Copy / Paste / Delete</strong> are available in the right-click menu. Delete removes every selected object. Ctrl+C and Ctrl+V also work. Right-click on empty space to paste at that point.</p><h3>Camera controls</h3><ul><li><strong>Left-drag:</strong> Orbit camera.</li><li><strong>Right-drag:</strong> Pan.</li><li><strong>Wheel:</strong> Zoom.</li><li><strong>Alt:</strong> Magnifier.</li><li><strong>☾ / ☀:</strong> Light/dark background.</li><li><strong>Top / Side:</strong> Preset camera views.</li></ul><h3>Preset systems</h3><p>Right-click → <strong>Add ▸</strong> to insert one of sixteen preset systems or experiments near the clicked position. Existing bodies stay in the scene. Surface-motion experiments automatically switch to Planet mode. Ideal orbits can drift because of numerical errors or other bodies.</p><h3>Other controls</h3><ul><li><strong>▶ / ❚❚ / Space:</strong> Play or pause.</li><li><strong>Reset:</strong> Restore starting planets.</li><li><strong>Trash:</strong> Clear the whole canvas.</li><li><strong>Trails:</strong> Show/hide paths.</li><li><strong>Velocities:</strong> Show/hide velocity arrows.</li><li><strong>Forces:</strong> Show net gravity force arrows.</li><li><strong>Center of Mass:</strong> Show center of mass of selected bodies or all bodies.</li><li><strong>Merge:</strong> In Space mode touching bodies merge; in Planet mode they stick to the floor.</li><li><strong>Space / Planet:</strong> Toggle mutual gravity and uniform downward gravity.</li><li><strong>Frictionless / Friction On:</strong> Enable ground friction and adjust it using the slider.</li><li><strong>Field Arrows:</strong> Show/hide uniform gravitational field lines in Planet mode.</li><li><strong>Sliders:</strong> Set friction, playback speed and trail length.</li><li><strong>Red velocity arrow:</strong> Escape speed exceeded.</li><li><strong>🇹🇷 / 🇬🇧:</strong> Change interface language.</li></ul>"};

function updateSelectionRing(){
 syncSelections();
 const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
 const width=renderer.domElement.clientWidth,height=renderer.domElement.clientHeight;
 for(const [b,ring] of selectionRings){
  const center=b.p.clone().project(camera);
  if(center.z>1||center.z< -1){ring.style.display='none';continue}
  const edge=b.p.clone().addScaledVector(right,b.r*1.34).project(camera);

  ring.style.left=(cx-radius)+'px';ring.style.top=(cy-radius)+'px';
 }

function smoothCameraView(top){

function mergeTouchingBodies(){
 let merged=true;
 while(merged){
  merged=false;
  outer:for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
   const a=bodies[i],b=bodies[j];
   if(a.p.distanceToSquared(b.p)>(a.r+b.r)**2)continue;
   const total=a.m+b.m;
   const pos=a.p.clone().multiplyScalar(a.m).addScaledVector(b.p,b.m).divideScalar(total);
   const vel=a.v.clone().multiplyScalar(a.m).addScaledVector(b.v,b.m).divideScalar(total);
   const ca=new THREE.Color(a.color),cb=new THREE.Color(b.color);
   // Kütle ağırlıklı renk karışımı.
   const color=ca.multiplyScalar(a.m/total).add(cb.multiplyScalar(b.m/total)).getHex();
   const radius=Math.cbrt(total/DENSITY);
   const wasSelected=selectedBodies.has(a)||selectedBodies.has(b);
   const newBody=makeBody(radius,color,pos,vel);
   newBody.m=total;
   createMergeBurst(pos,radius);
   bodies.splice(j,1);bodies.splice(i,1,newBody);
   selectedBodies.delete(a);selectedBodies.delete(b);
   if(wasSelected)selectedBodies.add(newBody);
   selectedBody=selectedBodies.size?[...selectedBodies].at(-1):null;
   if(hoveredBody===a||hoveredBody===b)hoveredBody=newBody;
   removeBody(a);removeBody(b);updateTrail(newBody);syncSelections();
   merged=true;break outer;
  }
 }

 $('toggleMerging').textContent=t(mergingEnabled?'Yapışma: açık':'Yapışma');
 if(mergingEnabled&&!surfaceMode&&!running&&!editor)mergeTouchingBodies();
});
function toggleRunning(){if(editor)finishEditor(true);running=!running;$('play').textContent=running?'❚❚ '+t('Duraklat'):'▶ '+t('Başlat')}
$('play').addEventListener('click',toggleRunning);
$('reset').addEventListener('click',()=>{stopPhysics();init()});
$('clearCanvas').addEventListener('click',()=>{
 stopPhysics();
 if(editor)finishEditor(false);
 closePlanetMenu();
 clearMergeBursts();
 for(const b of bodies)removeBody(b);
 bodies=[];
 selectedBodies.clear();selectedBody=null;syncSelections();
 hoveredBody=null;menuBody=null;copiedPlanet=null;
 centerMarker.visible=false;
 acc=0;trailTick=0;
 msg('Kanvas temizlendi · Çift tıkla: yeni gezegen');
});
window.addEventListener('keydown',e=>{
 if(e.code==='Escape'||e.key==='Escape'){
   if(editor){e.preventDefault();e.stopPropagation();finishEditor(false)}
   closePlanetMenu();
   return;
 }
 if(e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||e.target instanceof HTMLSelectElement)return;
 // Enter, hangi aşamada olunursa olunsun o anki ayarları kesinleştirir.
 // Henüz hız aşamasına geçilmediyse yeni gezegenin başlangıç hızı sıfırdır.
 // Tarayıcının varsayılan kopyala/yapıştır işlemi yerine seçili gezegeni kullan.
 const key=String(e.key||'').toLowerCase();
 if((e.ctrlKey||e.metaKey)&&!e.altKey&&(key==='c'||e.code==='KeyC')){
   const b=editor?editor.b:selectedBody;
   if(b&&bodies.includes(b)){e.preventDefault();e.stopPropagation();copyPlanet(b)}
   return;
 }
 if((e.ctrlKey||e.metaKey)&&!e.altKey&&(key==='v'||e.code==='KeyV')){
   if(copiedPlanet){
     e.preventDefault();e.stopPropagation();
     const point=overCanvas?onPlane({clientX:pointer.x,clientY:pointer.y},0):null;
     pastePlanet(point);
   }
   return;
 }
 if(e.code==='Enter'||e.key==='Enter'){
   if(editor){e.preventDefault();e.stopPropagation();finishEditor(true)}
   return;
 }
 if(e.key==='Alt'){altHeld=true;updateLens()}
 if(e.code==='Delete'||e.code==='Backspace'){
   // During editing Delete removes that existing planet; otherwise the
   // last selected planet or the one under the cursor is removed.
   const victim=editor?(editor.existing?editor.b:null):(hoveredBody||selectedBody);
   if(victim&&bodies.includes(victim)){e.preventDefault();deletePlanet(victim)}
 }
 if(e.code==='Space'){e.preventDefault();closePlanetMenu();toggleRunning()}
});
let previous=performance.now();
function animate(now){requestAnimationFrame(animate);
 const delta=Math.min((now-previous)/1000,.05);previous=now;
 if(cameraTransition){
  const tr=cameraTransition;
  const u=Math.min(1,(now-tr.start)/tr.duration);
  const eased=u*u*(3-2*u);
  // Düşey (phi) ve yatay (theta) dönüşler aynı animasyon süresinde tamamlanır.
  const theta=tr.fromTheta+tr.thetaDelta*eased;
  const phi=tr.fromPhi+(tr.toPhi-tr.fromPhi)*eased;
  const offset=new THREE.Vector3().setFromSphericalCoords(tr.distance,phi,theta);
  camera.position.copy(tr.target).add(offset);
  if(u>=1){
   controls.target.copy(tr.target);
   controls.update();
   controls.enableDamping=tr.previousDamping;
   cameraTransition=null;
   controls.enabled=!editor;
  }
 }
 if(running&&!editor){acc+=delta*animationSpeed;let n=0;while(acc>=DT&&n<40){step();acc-=DT;n++}if(n===40)acc=0}
 for(const b of bodies)updateVisual(b);
 controls.update();updateSelectionRing();updatePlanetInfo();updateForceArrows();updateCenterMarker();updateMergeBursts(delta);renderer.render(scene,camera);updateLens();
}
$('languageButton').addEventListener('click',()=>{appLanguage=appLanguage==='tr'?'en':'tr';try{localStorage.setItem('gravity-sandbox-language',appLanguage)}catch(_){}localizeUI();msg('Çift tıkla: yeni gezegen')});
init();localizeUI();requestAnimationFrame(animate);
} catch(error){const box=document.getElementById('error');box.style.display='block';box.textContent='3D motor yüklenemedi: '+error.message+'. İnternet bağlantısını ve WebGL desteğini kontrol edin.';console.error(error)}
</script>
