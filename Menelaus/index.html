<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menelaus Tilki Minimal v6.3</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --line:#ffffff; --panel:#111111; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Inter, "Segoe UI", Arial, sans-serif; transition:background-color .2s,color .2s; }
  .page { max-width:1800px; margin:0 auto; padding:20px 28px 18px; }
  .controls { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .btn { appearance:none; border:1px solid var(--fg); background:var(--fg); color:var(--bg); font-size:16px; line-height:1; padding:12px 18px; border-radius:999px; cursor:pointer; }
  .btn.secondary { background:transparent; color:var(--fg); }
  .btn:hover { opacity:.92; }
  .btn:disabled { opacity:.35; cursor:default; }
  .option { display:flex; align-items:center; gap:8px; font-size:16px; color:var(--fg); user-select:none; }
  .option input { width:18px; height:18px; accent-color:var(--fg); }
  .stage { width:100%; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:28px; font-weight:500; fill:var(--fg); }
  .base-edge { fill:none; stroke:var(--line); stroke-width:4; stroke-linecap:round; opacity:.98; }
  .active-edge { fill:none; stroke:#ff3347; stroke-width:8; stroke-linecap:round; filter:url(#glow); }
  .active-core { fill:none; stroke:#ffdbe0; stroke-width:2.2; stroke-linecap:round; }
  .label { font-size:34px; font-weight:600; fill:var(--line); paint-order:stroke; stroke:rgba(0,0,0,.12); stroke-width:3; }
  .formula-text { font-size:38px; fill:var(--fg); font-weight:500; }
  .formula-lite { fill:#8f8f8f; }
  .dot { font-size:44px; fill:var(--fg); font-weight:700; }
  .eq { font-size:44px; font-weight:600; fill:var(--fg); }
  #hand { filter:drop-shadow(0 2px 3px rgba(0,0,0,.16)); }
  /* v6.2: preserve hand interior, remove only edge-connected black matte */
</style>
</head>
<body>
<div class="page">
  <div class="controls">
    <button id="playBtn" class="btn">Oynat</button>
    <button id="stepBtn" class="btn secondary" aria-label="Adım adım" title="Adım adım">&gt;</button>
    <label class="option"><input type="checkbox" id="otherEye"> Diğer gözden başla</label>
    <label class="option"><input type="checkbox" id="foxToggle" checked> Tilki</label>
    <label class="option"><input type="checkbox" id="bgToggle"> Siyah arka plan</label>
  </div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const make = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const [k,v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    if (parent) parent.appendChild(el);
    return el;
  };
  const textEl = (str, x, y, cls, parent, anchor='middle') => {
    const t = make('text', {x, y, class: cls, 'text-anchor': anchor}, parent);
    t.textContent = str;
    return t;
  };
  const lerp = (a,b,t) => ({x:a.x + (b.x-a.x)*t, y:a.y + (b.y-a.y)*t});
  const clamp01 = t => Math.max(0, Math.min(1, t));
  // Smooth start and finish, with a restrained AE-like snap into place.
  const ease = t => { t=clamp01(t); return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; };
  const settle = t => { t=clamp01(t); return 1 + 1.12*Math.pow(t-1,3) + .12*Math.pow(t-1,2); };
  const mix = (a,b,t) => a+(b-a)*t;
  const intersect = (P,R,Q,T) => {
    const u = {x:R.x-P.x, y:R.y-P.y};
    const v = {x:T.x-Q.x, y:T.y-Q.y};
    const w = {x:Q.x-P.x, y:Q.y-P.y};
    const cross = (p,q) => p.x*q.y - p.y*q.x;
    const tt = cross(w,v) / cross(u,v);
    return {x:P.x + tt*u.x, y:P.y + tt*u.y};
  };

  const activeEdges = $('activeEdges');

  // v6.2: Only the background connected to the image edges is transparent.
  // Unlike a color-key filter, dark details enclosed inside the hand are retained.
  function restoreHandCutout() {
    const handImage = hand.querySelector('image');
    if (!handImage) return;
    const original = handImage.getAttribute('href');
    if (!original || !original.startsWith('data:image/')) return;
    const img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h || w*h > 3000000) return;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0);
        const imageData = ctx.getImageData(0,0,w,h);
        const rgba = imageData.data;
        const pixels = w*h;
        const seen = new Uint8Array(pixels);
        const queue = new Int32Array(pixels);
        let head = 0, tail = 0;
        const isBackground = (p) => {
          const i = p*4;
          const r=rgba[i],g=rgba[i+1],b=rgba[i+2];
          const bright = Math.max(r,g,b);
          // Limit propagation to a nearly black, low-saturation matte.
          return rgba[i+3] < 15 || (bright < 66 && bright-Math.min(r,g,b) < 39);
        };
        const enqueue = (p) => {
          if (seen[p] || !isBackground(p)) return;
          seen[p] = 1;
          queue[tail++] = p;
        };
        for (let x=0;x<w;x++){enqueue(x);enqueue((h-1)*w+x);}
        for (let y=0;y<h;y++){enqueue(y*w);enqueue(y*w+w-1);}
        while(head<tail){
          const p=queue[head++];
          const x=p%w, y=(p-x)/w;
          if(x>0)enqueue(p-1);
          if(x<w-1)enqueue(p+1);
          if(y>0)enqueue(p-w);
          if(y<h-1)enqueue(p+w);
        }
        // Do not run destructive cleanup if the matte was not recognized.
        if(tail < pixels*0.015) return;
        for(let p=0;p<pixels;p++){
          if(seen[p])rgba[p*4+3]=0;
        }
        // Feather only the outer 1-pixel boundary. Interior detail is untouched.
        for(let n=0;n<tail;n++){
          const p=queue[n], x=p%w,y=(p-x)/w;
          for(const q of [x>0?p-1:-1,x<w-1?p+1:-1,y>0?p-w:-1,y<h-1?p+w:-1]){
            if(q<0||seen[q])continue;
            const i=q*4, bright=Math.max(rgba[i],rgba[i+1],rgba[i+2]);
            if(bright<105)rgba[i+3]=Math.min(rgba[i+3],Math.round(255*Math.max(0,(bright-48)/57)));
          }
        }
        ctx.putImageData(imageData,0,0);
        handImage.setAttribute('href',canvas.toDataURL('image/png'));
      } catch(err) {
        console.warn('El görseli işlenemedi; kaynak görsel korundu.',err);
      }
    };
    img.src=original;
  }
  restoreHandCutout();

  const geometryLines = [ ['A','B'], ['B','C'], ['C','D'], ['D','E'], ['E','F'], ['F','A'], ['B','D'], ['A','E'] ];
  const labelOffsets = {
    A: {x:-52, y:35}, B: {x:-24, y:-8}, C: {x:0, y:76},
    D: {x:40, y:32}, E: {x:-16, y:-8}, F: {x:4, y:-30}
  };
  const defaultSeq = [ ['A','B'], ['B','C'], ['C','D'], ['D','E'], ['E','F'], ['F','A'] ];
  const altSeq = [ ['D','E'], ['E','C'], ['C','A'], ['A','B'], ['B','F'], ['F','D'] ];
  let sequence = defaultSeq.slice();

  function edgeLabel(pair) { return `|${pair[0]}${pair[1]}|`; }
  function midPoint(pair) { return lerp(pts[pair[0]], pts[pair[1]], 0.5); }

  // Static geometry
  geometryLines.forEach(pair => {
    make('line', {x1:pts[pair[0]].x, y1:pts[pair[0]].y, x2:pts[pair[1]].x, y2:pts[pair[1]].y, class:'base-edge'}, baseEdges);
  });
  Object.entries(pts).forEach(([k,p]) => {
    const o = labelOffsets[k];
    textEl(k, p.x + o.x, p.y + o.y, 'label', labels);
  });

  // Formula layout on the right, vertically centered.
  const slotCenters = [1135, 1370, 1605];
  const baseY = 490;
  const numY = baseY - 28;
  const denY = baseY + 58;
  const lineY = baseY + 10;
  const slots = slotCenters.map((x, i) => {
    const g = make('g', {}, formula);
    const dot = i === 0 ? null : textEl('·', x - 114, baseY + 14, 'dot', g);
    if (dot) dot.style.opacity = '0';
    const num = textEl('', x, numY, 'formula-text', g);
    const line = make('line', {x1:x-52, y1:lineY, x2:x-52, y2:lineY, stroke:'var(--fg)', 'stroke-width':2.8}, g);
    const den = textEl('', x, denY, 'formula-text', g);
    num.style.opacity = '0'; den.style.opacity = '0'; line.style.opacity = '0';
    return {x, g, dot, num, line, den};
  });
  const eq = textEl('=', 1730, baseY + 12, 'eq', formula);
  const one = textEl('1', 1770, baseY + 12, 'eq', formula);
  eq.style.opacity = '0'; one.style.opacity = '0';

  let playing = false;
  let stepPlaying = false;
  let time = 0;
  let lastTs = 0;
  let stepTarget = 0;
  const moveDur = 1.55;
  const holdDur = 0.38;
  const formulaDur = 1.20;
  const slotDur = moveDur + holdDur + formulaDur;
  const finalDur = 1.20;
  const totalDur = slotDur * 6 + finalDur;

  function syncTheme() {
    const darkBg = bgToggle.checked;
    const showFox = foxToggle.checked;
    const bg = darkBg ? '#000000' : '#ffffff';
    const fg = darkBg ? '#ffffff' : '#111111';
    let line = showFox ? '#ffffff' : (darkBg ? '#ffffff' : '#000000');
    document.documentElement.style.setProperty('--bg', bg);
    document.documentElement.style.setProperty('--fg', fg);
    document.documentElement.style.setProperty('--line', line);
    bgRect.setAttribute('fill', bg);
    foxImage.style.opacity = showFox ? '1' : '0';
  }

  function setSequence() {
    sequence = otherEye.checked ? altSeq.slice() : defaultSeq.slice();
  }

  function resetFormulaVisuals() {
    activeEdges.replaceChildren();
    flying.replaceChildren();
    slots.forEach((s) => {
      s.num.textContent = '';
      s.den.textContent = '';
      s.num.style.opacity = '0';
      s.den.style.opacity = '0';
      s.line.style.opacity = '0';
      s.line.setAttribute('x1', s.x - 52);
      s.line.setAttribute('x2', s.x - 52);
      if (s.dot) s.dot.style.opacity = '0';
    });
    eq.style.opacity = '0';
    one.style.opacity = '0';
  }

  function drawActiveEdge(pair, progress) {
    const p = pts[pair[0]], q = pts[pair[1]];
    const c = lerp(p, q, progress);
    make('line', {x1:p.x, y1:p.y, x2:c.x, y2:c.y, class:'active-edge'}, activeEdges);
    make('line', {x1:p.x, y1:p.y, x2:c.x, y2:c.y, class:'active-core'}, activeEdges);
  }

  function setFracBar(slot, progress) {
    slot.line.style.opacity = '1';
    slot.line.setAttribute('x1', slot.x - 52);
    slot.line.setAttribute('x2', slot.x - 52 + 104 * progress);
  }

  function showCompletedFormula(stepCount) {
    for (let j=0; j<3; j++) {
      const numStep = 2*j;
      const denStep = 2*j + 1;
      const slot = slots[j];
      const numPair = sequence[numStep];
      const denPair = sequence[denStep];
      if (stepCount > numStep) {
        if (j > 0 && slot.dot) slot.dot.style.opacity = '1';
        slot.num.textContent = edgeLabel(numPair);
        slot.num.setAttribute('class', 'formula-text');
        slot.num.style.opacity = '1';
        if (j > 0) {
          slot.den.textContent = '1';
          slot.den.setAttribute('class', 'formula-text formula-lite');
          slot.den.style.opacity = '1';
          setFracBar(slot, 1);
        }
      }
      if (stepCount > denStep) {
        slot.den.textContent = edgeLabel(denPair);
        slot.den.setAttribute('class', 'formula-text');
        slot.den.style.opacity = '1';
        setFracBar(slot, 1);
      }
      if (j === 0 && stepCount > denStep) setFracBar(slot, 1);
    }
  }

  function animateFormulaForStep(stepIndex, progress) {
    const slotIndex = Math.floor(stepIndex / 2);
    const numeratorMode = stepIndex % 2 === 0;
    const slot = slots[slotIndex];
    const pair = sequence[stepIndex];
    const p = ease(progress);
    const pFly = settle(progress);
    const src = midPoint(pair);
    const tx = slot.x;
    const ty = numeratorMode ? numY : denY;

    if (numeratorMode) {
      if (slotIndex > 0 && slot.dot) slot.dot.style.opacity = String(p);
      if (slotIndex > 0) {
        slot.den.textContent = '1';
        slot.den.setAttribute('class', 'formula-text formula-lite');
        slot.den.style.opacity = String(p);
        setFracBar(slot, p);
      }
    } else {
      setFracBar(slot, p);
    }

    const fly = textEl(edgeLabel(pair), src.x + (tx - src.x) * pFly, (src.y - 30) + (ty - (src.y - 30)) * pFly, 'formula-text', flying);
    fly.style.opacity = String(0.45 + 0.55 * p);
  }

  function handPositionForStep(stepIndex, local) {
    const pair = sequence[stepIndex];
    if (local < moveDur) return lerp(pts[pair[0]], pts[pair[1]], ease(local / moveDur));
    return pts[pair[1]];
  }

  function render(t) {
    resetFormulaVisuals();
    t = Math.max(0, Math.min(totalDur, t));
    const inFinal = t >= slotDur * 6;
    const stepIndex = Math.min(5, Math.floor(t / slotDur));
    const local = t - stepIndex * slotDur;

    const endProgress = inFinal ? ease((t - slotDur*6)/finalDur) : 0;
    const fade = inFinal ? 1-endProgress : 1;
    activeEdges.style.opacity = String(fade);
    const isDark = bgToggle.checked;
    const showFox = foxToggle.checked;
    const startRgb = showFox ? 255 : (isDark ? 255 : 0);
    const endRgb = isDark ? 255 : 0;
    const stroke = Math.round(mix(startRgb, endRgb, endProgress));
    baseEdges.style.stroke = `rgb(${stroke},${stroke},${stroke})`;
    labels.style.fill = `rgb(${stroke},${stroke},${stroke})`;
    if (!inFinal) {
      for (let i=0; i<stepIndex; i++) drawActiveEdge(sequence[i], 1);
      drawActiveEdge(sequence[stepIndex], local < moveDur ? ease(local / moveDur) : 1);

      const phaseFormula = local >= moveDur + holdDur;
      showCompletedFormula(phaseFormula ? stepIndex : stepIndex);
      if (phaseFormula) animateFormulaForStep(stepIndex, (local - moveDur - holdDur) / formulaDur);

      const pos = handPositionForStep(stepIndex, local);
      const motionPhase = clamp01(local / moveDur);
      const theta = local < moveDur ? 1.8*Math.sin(Math.PI*motionPhase) : 0;
      hand.style.opacity = t < 0.001 ? '0' : '1';
      hand.setAttribute('transform', `translate(${pos.x.toFixed(3)} ${pos.y.toFixed(3)}) rotate(${theta.toFixed(2)})`);
    } else {
      for (let i=0; i<6; i++) drawActiveEdge(sequence[i], 1);
      showCompletedFormula(6);
      const fp = ease((t - slotDur * 6) / finalDur);
      eq.style.opacity = String(fp);
      one.style.opacity = String(Math.max(0, (fp - 0.25) / 0.75));
      hand.style.opacity = '0';
    }
  }

  function stopAll() {
    playing = false;
    stepPlaying = false;
    lastTs = 0;
    playBtn.textContent = 'Oynat';
    stepBtn.disabled = false;
  }

  function tick(ts) {
    if (!playing && !stepPlaying) return;
    if (!lastTs) lastTs = ts;
    time += (ts - lastTs) / 1000;
    lastTs = ts;

    if (stepPlaying && time >= stepTarget) {
      time = stepTarget;
      stepPlaying = false;
      lastTs = 0;
      stepBtn.disabled = false;
      playBtn.textContent = 'Oynat';
    }
    if (playing && time >= totalDur) {
      time = totalDur;
      playing = false;
      lastTs = 0;
      playBtn.textContent = 'Oynat';
    }

    render(time);
    stepBtn.disabled = Boolean(stepPlaying || playing);
    if (playing || stepPlaying) requestAnimationFrame(tick);
  }

  function resetScene() {
    stopAll();
    time = 0;
    setSequence();
    syncTheme();
    render(0);
  }

  playBtn.addEventListener('click', () => {
    if (playing) { stopAll(); return; }
    if (time >= totalDur) time = 0;
    setSequence();
    syncTheme();
    playing = true;
    stepPlaying = false;
    lastTs = 0;
    playBtn.textContent = 'Duraklat';
    requestAnimationFrame(tick);
  });

  stepBtn.addEventListener('click', () => {
    if (stepPlaying || playing) return;
    stopAll();
    if (time >= totalDur) time = 0;
    setSequence();
    syncTheme();
    const slotIndex = Math.min(5, Math.floor((time + 0.0001) / slotDur));
    const atBoundary = Math.abs(time - slotIndex * slotDur) < 0.02;
    const currentBoundary = slotIndex * slotDur;
    if (!atBoundary) time = currentBoundary;
    const currentStep = Math.floor((time + 0.0001) / slotDur);
    stepTarget = currentStep < 6 ? Math.min(totalDur, (currentStep + 1) * slotDur) : totalDur;
    stepPlaying = true;
    stepBtn.disabled = true;
    lastTs = 0;
    requestAnimationFrame(tick);
  });

  [otherEye, foxToggle, bgToggle].forEach(el => el.addEventListener('change', resetScene));

  syncTheme();
  setSequence();
  render(0);
})();
</script>
