<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Alan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#222}
button,select{font:inherit;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;background:#fff}
.bar{min-height:68px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd;box-shadow:0 3px 12px #0000000d;z-index:20}
.title{font-weight:800;font-size:20px;margin-right:8px;white-space:nowrap}
select,.btn{height:42px;border:1px solid #c9c9c9;border-radius:11px;background:#fff;color:#222;padding:0 14px;box-shadow:0 2px 5px #0000000d;cursor:pointer}
.btn:hover,select:hover{border-color:#999}.btn:active{transform:translateY(1px)}
#areaBtn{font-weight:800;background:#fff4cf;border-color:#d7b85c}
#clearBtn{margin-left:auto}
.equation{display:flex;align-items:center;gap:10px;margin-left:4px;white-space:nowrap}
.eq{font-size:24px;font-weight:700}
#result{min-width:118px;height:42px;padding:0 12px;border:2px solid #555;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#fff}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.shape{fill:#ffffff08;stroke:#245f9d;stroke-width:3;vector-effect:non-scaling-stroke;cursor:move}
.free-preview{fill:none;stroke:#245f9d;stroke-width:2.2;vector-effect:non-scaling-stroke}
.handle{fill:#fff;stroke:#245f9d;stroke-width:2;cursor:grab;vector-effect:non-scaling-stroke}
.handle:active{cursor:grabbing}
.free-point{fill:#fff;stroke:#245f9d;stroke-width:2;vector-effect:non-scaling-stroke}
.free-point.start{fill:#ffe07a}
.tile{fill:#f6d66d;stroke:#8d7a38;stroke-width:.65;vector-effect:non-scaling-stroke;pointer-events:none}
.tile.partial{fill:#f6d66d}
.tile.tile-big{stroke-width:1.05}
.tile.tile-mid{stroke-width:.72}
.tile.tile-small{stroke-width:.42}
#hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:7px 12px;border-radius:10px;background:#ffffffee;border:1px solid #ddd;color:#666;font-size:13px;pointer-events:none;box-shadow:0 2px 8px #0000000d;transition:opacity .2s}
.flyTile{
 position:fixed;box-sizing:border-box;z-index:1000;background:#f6d66d;border:1px solid #8d7a38;pointer-events:none;
 box-shadow:0 0 0 rgba(0,0,0,0);
 transition:
   left .48s cubic-bezier(.52,.04,1,.42),
   top .48s cubic-bezier(.52,.04,1,.42),
   width .34s ease,height .34s ease,
   transform .48s cubic-bezier(.52,.04,1,.42),
   box-shadow .18s ease,filter .18s ease,opacity .14s ease;
}
.flyTile.lifted{box-shadow:0 10px 13px rgba(0,0,0,.23);filter:brightness(1.025);transform:translateY(-7px)}
.flyTile.smallPiece{transition:left .52s cubic-bezier(.25,.1,.25,1),top .52s cubic-bezier(.25,.1,.25,1),width .42s ease,height .42s ease,transform .52s ease,box-shadow .18s ease,filter .18s ease,opacity .14s ease}
.mergeBox{position:fixed;z-index:998;border:1px dashed #8d7a38;width:32px;height:32px;pointer-events:none;transform:translate(-50%,-50%);opacity:.38}
@media(max-width:760px){.bar{gap:6px;padding:8px;min-height:60px;flex-wrap:wrap}.title{font-size:17px}select,.btn,#result{height:38px}#clearBtn{margin-left:0}.equation{gap:6px}.eq{font-size:20px}#result{min-width:92px}}

.flyTile,.flyTile.smallPiece,.flyTile.lifted{
 border-style:solid!important;
 border-color:#8d7a38!important;
}
.flyTile-big{border-width:1.4px!important}
.flyTile-mid{border-width:.9px!important}
.flyTile-small{border-width:.55px!important}

.topTools{position:fixed;top:12px;right:14px;z-index:1200;display:flex;gap:8px;align-items:center}
.toolBtn{width:38px;height:38px;border:1px solid #cfcfcf;border-radius:10px;background:#fff;box-shadow:0 2px 8px #0002;display:grid;place-items:center;font-size:20px;cursor:pointer}
.helpModal{display:none;position:fixed;inset:0;z-index:1500;background:#0004;align-items:center;justify-content:center}
.helpModal.open{display:flex}.helpCard{width:min(430px,calc(100vw - 32px));background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 55px #0004}
.helpHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.helpHead b{font-size:22px}.closeHelp{border:0;background:transparent;font-size:26px;cursor:pointer}
.helpRow{display:flex;align-items:center;gap:18px;margin:14px 0}.sampleSq{display:inline-block;background:#f6d66d;border:1px solid #8d7a38;box-sizing:border-box;flex:0 0 auto}
.sampleBig{width:32px;height:32px}.sampleMid{width:16px;height:16px}.sampleSmall{width:8px;height:8px}
.helpText{line-height:1.45;color:#333}
.counterRack{display:flex;align-items:center;gap:8px;margin-left:4px}.counterUnit{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:11px;transition:transform .22s ease,background .22s ease,box-shadow .22s ease}.counterUnit.ready{cursor:pointer;background:#fff9e5;box-shadow:0 0 0 1px #dfc56d inset}.counterUnit.ready:hover{transform:translateY(-2px);box-shadow:0 5px 14px #0002}.counterSample{display:block;background:#f6d66d;border:1px solid #8d7a38;box-sizing:border-box}.bigSample{width:24px;height:24px}.midSample{width:14px;height:14px}.smallSample{width:8px;height:8px}.counterBox{min-width:64px;height:38px;border:1.5px solid #555;border-radius:9px;background:#fff;display:grid;place-items:center;padding:0 8px;font-weight:800;font-variant-numeric:tabular-nums;transition:.22s}.counterBox.pulse{transform:scale(1.08);background:#fff6cf;box-shadow:0 5px 15px #0002}.transferValue{position:fixed;z-index:1800;transform:translate(-50%,-50%);padding:5px 9px;border-radius:9px;background:#fff6cf;border:1px solid #d1b24c;box-shadow:0 7px 18px #0003;font-weight:900;pointer-events:none;transition:left .62s cubic-bezier(.45,.05,.85,.45),top .62s cubic-bezier(.45,.05,.85,.45),transform .62s ease,opacity .18s ease}@media(max-width:900px){.counterRack{order:5;width:100%;justify-content:center}.counterBox{min-width:52px}}.divisorFlash{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transform:scale(.7);transition:max-width .22s ease,opacity .22s ease,transform .22s ease,margin .22s ease}.divisorFlash.show{max-width:38px;opacity:1;transform:scale(1);margin-left:2px}.additionStage{position:fixed;z-index:1900;display:flex;align-items:center;gap:9px;transform:translate(-50%,-50%);padding:7px 12px;border-radius:12px;background:#fffdf3;border:1px solid #e1cf87;box-shadow:0 9px 25px #0003;font-weight:900;font-size:20px;pointer-events:none;transition:left .5s ease,top .5s ease,opacity .22s ease,transform .35s ease}.additionStage .plus{font-size:23px;transform:scale(0);opacity:0;transition:transform .24s ease,opacity .24s ease}.additionStage.showPlus .plus{transform:scale(1);opacity:1}.additionStage.merge{gap:0;transform:translate(-50%,-50%) scale(.92)}.additionStage.merge .plus,.additionStage.merge .addOld{opacity:0;max-width:0;overflow:hidden}.additionStage .addResult{display:none}.additionStage.merge .addNew{display:none}.additionStage.merge .addResult{display:inline-block;animation:addPop .35s ease both}@keyframes addPop{0%{transform:scale(.7);opacity:.3}100%{transform:scale(1.08);opacity:1}}.counterRack{display:flex;align-items:flex-start;gap:10px;margin-left:4px}.counterUnit{position:relative;display:block;padding:0 0 22px;border-radius:11px;background:transparent!important;box-shadow:none!important;transform:none!important}.counterUnit.ready{cursor:pointer}.counterUnit.ready .counterBox:hover{border-color:#b48d1e;box-shadow:0 3px 10px #0001}.counterPlus{font-size:29px;font-weight:500;line-height:38px;color:#555}.counterSample,.divisorFlash{display:none!important}.underDivisor{position:absolute;left:50%;top:42px;transform:translateX(-50%);font-size:17px;font-weight:800;color:#555;opacity:0;transition:opacity .16s ease}.underDivisor.show{opacity:1}.counterBox{min-width:82px}.transferValue,.additionStage{display:none!important}@media(max-width:900px){.counterRack{align-items:flex-start}.counterUnit{padding-bottom:20px}}
/* Tıklanabilir 2. ve 3. sayaç */
#midUnit.ready .counterBox,#smallUnit.ready .counterBox{
 background:#fff0f4;
 border-color:#d8aab6;
 transition:background .22s ease,border-color .22s ease,box-shadow .25s ease,filter .25s ease;
}
#midUnit.ready:hover .counterBox,#smallUnit.ready:hover .counterBox{
 background:#fff5f7;
 border-color:#cf8fa0;
 box-shadow:0 0 8px rgba(255,155,184,.42),0 0 18px rgba(255,183,204,.28),inset 0 0 8px rgba(255,255,255,.9);
 filter:brightness(1.025);
}

#stage.panReady{cursor:grab}
#stage.panning{cursor:grabbing}

.fractionUnit{padding-bottom:0!important}
.fractionWrap{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:82px}
.fractionWrap .counterBox{border-radius:9px 9px 2px 2px}
.fractionDenominator{height:25px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#333;border-top:2px solid #333;margin-top:2px;opacity:1;transform:none;transition:opacity .2s ease,height .2s ease,margin .2s ease,border-color .2s ease}
.fractionDenominator.hidden{opacity:0;height:0;margin-top:0;border-color:transparent;overflow:hidden}
#midUnit.ready .counterBox,#smallUnit.ready .counterBox{background:#fff0f4}

/* Sarı kaplama kareleri SVG dünya koordinatlarında olduğundan zoom/pan ile birlikte ölçeklenir.
   Sayaç animasyonu başladığında oluşturulan geçici kareler de worldToScreen ile aynı görünüm dönüşümünü kullanır. */

/* A + 1/4 B + 1/16 C */
.counterBox{border-radius:10px!important}
.coefficientTerm{display:flex;align-items:center;gap:7px;padding:0;border-radius:11px;transition:filter .22s ease}
.coefficientFraction{width:28px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;font-weight:800;font-size:16px;line-height:18px;color:#333;opacity:1;transition:opacity .2s ease,width .2s ease,margin .2s ease}
.coefficientFraction span{display:block;text-align:center}
.coefficientFraction span:first-child{border-bottom:2px solid #333}
.coefficientFraction.hidden{opacity:0;width:0;overflow:hidden;margin:0}
#midUnit.ready,#smallUnit.ready{cursor:pointer}
#midUnit.ready .counterBox,#smallUnit.ready .counterBox{background:#fff0f4;border-color:#d8aab6}
#midUnit.ready:hover .counterBox,#smallUnit.ready:hover .counterBox{background:#fff5f7;border-color:#cf8fa0;box-shadow:0 0 8px rgba(255,155,184,.42),0 0 18px rgba(255,183,204,.28),inset 0 0 8px rgba(255,255,255,.9)}
.fractionUnit,.fractionWrap,.fractionDenominator{all:unset}

.counterPlus{transition:opacity .28s ease,width .28s ease,margin .28s ease,transform .28s ease}
.coefficientTerm,.counterUnit{transition:opacity .28s ease,transform .48s cubic-bezier(.22,.75,.22,1),width .35s ease,max-width .35s ease,margin .35s ease}
.termGone{opacity:0!important;pointer-events:none!important;width:0!important;max-width:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
.plusGone{opacity:0!important;width:0!important;margin:0!important;overflow:hidden!important;transform:scale(.2)}
.mergeClone{position:fixed;z-index:2100;pointer-events:none;margin:0!important;transition:left .52s cubic-bezier(.22,.75,.22,1),top .52s cubic-bezier(.22,.75,.22,1),transform .52s cubic-bezier(.22,.75,.22,1),opacity .18s ease}
.mergeTargetPulse{animation:mergeTargetPulse .34s ease}
@keyframes mergeTargetPulse{0%{transform:scale(1)}48%{transform:scale(1.08);box-shadow:0 0 18px rgba(255,173,196,.55)}100%{transform:scale(1)}}

.counterRack{align-items:center!important}
.counterUnit{padding-bottom:0!important}
.counterBox{min-width:104px!important;padding-left:12px!important;padding-right:12px!important}.counterBox{min-width:108px!important;white-space:nowrap}
.counterUnitText{color:#8b8b8b;font-size:.55em;font-weight:650;margin-left:7px;letter-spacing:.01em}
.counterNumber{color:#222;font-weight:800}

.counterBox{display:flex!important;align-items:center!important;justify-content:center!important}
.counterNumber,.counterUnitText{display:inline-block!important;vertical-align:baseline!important;line-height:1!important}
.counterUnitText{align-self:center!important;margin-left:7px!important;transform:none!important;position:static!important}

.opacityControl{display:flex;align-items:center;gap:7px;height:42px;padding:0 9px;border:1px solid #d4d4d4;border-radius:11px;background:#fff}
.opacityIcon{font-size:18px;color:#777;line-height:1}
#tileOpacity{width:105px;accent-color:#d0aa32;cursor:pointer}
@media(max-width:760px){#tileOpacity{width:82px}.opacityControl{height:38px;padding:0 7px}}

.tile,.flyTile{opacity:var(--tile-alpha,1)}
</style>
</head>
<body>
<div class="topTools">
 <button class="toolBtn" id="helpBtn" title="Help" aria-label="Help">?</button>
</div>
<div class="helpModal" id="helpModal">
 <div class="helpCard">
  <div class="helpHead"><b id="helpTitle">Alan</b><button class="closeHelp" id="closeHelp">×</button></div>
  <div class="helpText" id="helpIntro">Bir şeklin alanı, şeklin içine sığan birim karelerin toplamıdır.</div>
  <div class="helpRow"><span class="sampleSq sampleBig"></span><span id="helpBig">Büyük kare = 1</span></div>
  <div class="helpRow"><span class="sampleSq sampleMid"></span><span id="helpMid">Orta kare = 1/4</span></div>
  <div class="helpRow"><span class="sampleSq sampleSmall"></span><span id="helpSmall">Küçük kare = 1/16</span></div>
  <div class="helpText" id="helpEnd">Alanı bulmak için karelerin değerlerini toplarız.</div>
 </div>
</div>

<div id="app">
 <div class="bar">
  <div class="title">Alan</div>
  <select id="shapeSelect">
   <option value="square">Kare</option><option value="rect">Dikdörtgen</option>
   <option value="parallelogram">Paralelkenar</option>
   <option value="rhombus">Eşkenar dörtgen</option>
   <option value="trapezoid">Yamuk</option>
   <option value="rightTri">Dik Üçgen</option><option value="tri">Üçgen</option>
   <option value="circle">Daire</option><option value="ellipse">Elips</option>
   <option value="pentagon">Beşgen</option><option value="hexagon">Altıgen</option>
   <option value="polygon">Çokgen</option><option value="pen">Kalem</option>
   <option value="free">Serbest</option><option value="image">🖼️ Resim</option>
  </select>
  <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <button class="btn" id="areaBtn">Say</button>
  <div class="counterRack">
 <div class="counterUnit"><div class="counterBox" id="counterBig">—</div></div>
 <span class="counterPlus" id="plusAB">+</span>
 <div class="coefficientTerm clickable" id="midUnit">
   <div class="coefficientFraction" id="midDivisor"><span>1</span><span>4</span></div>
   <div class="counterBox" id="counterMid">—</div>
 </div>
 <span class="counterPlus" id="plusBC">+</span>
 <div class="coefficientTerm clickable" id="smallUnit">
   <div class="coefficientFraction" id="smallDivisor"><span>1</span><span>16</span></div>
   <div class="counterBox" id="counterSmall">—</div>
 </div>
</div>
  <div class="opacityControl" title="Sarı karelerin saydamlığı">
    <span class="opacityIcon">◩</span>
    <input id="tileOpacity" type="range" min="0" max="100" value="100" aria-label="Saydamlık">
  </div>
  <button class="btn" id="clearBtn">Sıfırla</button>
 </div>
 <div id="stage"><svg id="svg"></svg><div id="hint">Çalışma alanına tıklayın.</div></div>
</div>
<script>
(()=>{
"use strict";
const NS="http://www.w3.org/2000/svg",CELL=32,MID=CELL/2,SMALL=CELL/4,EPS=1e-7;
const svg=document.getElementById("svg"),stage=document.getElementById("stage"),select=document.getElementById("shapeSelect"),areaBtn=document.getElementById("areaBtn"),clearBtn=document.getElementById("clearBtn"),hint=document.getElementById("hint");const tileOpacity=document.getElementById("tileOpacity");const counterBig=document.getElementById("counterBig"),counterMid=document.getElementById("counterMid"),counterSmall=document.getElementById("counterSmall"),midUnit=document.getElementById("midUnit"),smallUnit=document.getElementById("smallUnit"),midDivisor=document.getElementById("midDivisor"),smallDivisor=document.getElementById("smallDivisor"),plusAB=document.getElementById("plusAB"),plusBC=document.getElementById("plusBC");
let tileAlpha=1;
function applyTileOpacity(){
 tileAlpha=Math.max(0,Math.min(1,(+tileOpacity.value||0)/100));
 document.documentElement.style.setProperty("--tile-alpha",tileAlpha);
 document.querySelectorAll(".tile,.flyTile").forEach(el=>el.style.opacity=tileAlpha);
}
tileOpacity.addEventListener("input",applyTileOpacity);
applyTileOpacity();
let counterState={big:0,mid:0,small:0,counted:false,midDone:false,smallDone:false,converting:false,midStage:0,smallStage:0};
let shape=null,freePoints=[],freeClosed=false,dragging=null,tiles=[],animating=false,tileSerial=0,keepEmptyAfterCount=false;
let penDrawing=false,penPoints=[],polygonPoints=[],polygonClosed=false;
let view={scale:1,tx:0,ty:0},panDrag=null;
function applyView(){
  svg.style.transformOrigin="0 0";
  svg.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.scale})`;
}
function screenToWorld(clientX,clientY){
  const r=stage.getBoundingClientRect();
  return {x:(clientX-r.left-view.tx)/view.scale,y:(clientY-r.top-view.ty)/view.scale};
}
function worldToScreen(x,y){
 const r=stage.getBoundingClientRect();
 return {x:r.left+view.tx+x*view.scale,y:r.top+view.ty+y*view.scale};
}
function isPanTarget(e){
  if(select.value==="pen"&&!shape)return false;
  return e.target===stage||e.target===svg||e.target.id==="hint";
}let imageMask=null,imageObjectURL=null;const imageInput=document.getElementById("imageInput");

function S(t,a={}){const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function pt(e){return screenToWorld(e.clientX,e.clientY)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function fmt(n,d=2){if(Math.abs(n-Math.round(n))<.005)return String(Math.round(n));return n.toFixed(d).replace(/0+$/,"").replace(/\.$/,"").replace(".",",")}
function clearSVG(){while(svg.firstChild)svg.removeChild(svg.firstChild)}
function reset(){
 keepEmptyAfterCount=false;if(imageObjectURL){URL.revokeObjectURL(imageObjectURL);imageObjectURL=null}imageMask=null;shape=null;freePoints=[];freeClosed=false;penDrawing=false;penPoints=[];polygonPoints=[];polygonClosed=false;dragging=null;tiles=[];animating=false;resetCounters();clearSVG();hint.style.opacity="1";hint.textContent="Çalışma alanına tıklayın.";document.querySelectorAll(".flyTile,.mergeBox").forEach(x=>x.remove())}
clearBtn.onclick=reset;select.onchange=()=>{reset();if(select.value==="image")imageInput.click()};


function scaledPoints(points,p,sx=1,sy=1){
 return points.map(([x,y])=>({x:p.x+x*sx,y:p.y+y*sy}));
}
function ellipseArc(cx,cy,rx,ry,a0,a1,n){
 const a=[];
 for(let i=0;i<=n;i++){
   const z=a0+(a1-a0)*i/n;
   a.push([cx+rx*Math.cos(z),cy+ry*Math.sin(z)]);
 }
 return a;
}
function funShapePoints(t,p){
 if(t==="star"){
   const a=[];
   for(let i=0;i<10;i++){
     const r=i%2?52:112,z=-Math.PI/2+i*Math.PI/5;
     a.push([r*Math.cos(z),r*Math.sin(z)]);
   }
   return scaledPoints(a,p);
 }
 if(t==="heart"){
   const a=[];
   for(let i=0;i<100;i++){
     const z=Math.PI*2*i/100;
     const x=16*Math.pow(Math.sin(z),3);
     const y=-(13*Math.cos(z)-5*Math.cos(2*z)-2*Math.cos(3*z)-Math.cos(4*z));
     a.push([x*7,y*7]);
   }
   return scaledPoints(a,p);
 }
 if(t==="fish"){
   const a=[
    [-125,0],[-82,-58],[-18,-78],[48,-64],[96,-34],[132,-68],[118,-18],
    [150,0],[118,18],[132,68],[96,34],[48,64],[-18,78],[-82,58]
   ];
   return scaledPoints(a,p,.82,.82);
 }
 if(t==="cat"){
   const a=[
    [-100,55],[-94,-30],[-82,-92],[-45,-64],[-18,-100],[0,-70],
    [18,-100],[45,-64],[82,-92],[94,-30],[100,55],
    [68,92],[28,108],[0,112],[-28,108],[-68,92]
   ];
   return scaledPoints(a,p,.9,.9);
 }
 if(t==="bunny"){
   // Saat yönünde: sol kulak -> baş -> gövde -> sağ kulak.
   const a=[
    [-50,-32],[-72,-105],[-62,-150],[-42,-158],[-27,-137],[-24,-78],
    [-20,-48],[-62,-34],[-88,-6],[-96,35],[-82,78],[-52,101],
    [-20,111],[0,112],[20,111],[52,101],[82,78],[96,35],[88,-6],
    [62,-34],[20,-48],[24,-78],[27,-137],[42,-158],[62,-150],
    [72,-105],[50,-32],[28,-12],[0,-5],[-28,-12]
   ];
   return scaledPoints(a,p,.78,.72);
 }
 if(t==="cloud"){
   const a=[];
   const arcs=[
    [-72,18,48,38,Math.PI*.85,Math.PI*1.85,14],
    [-40,-25,52,50,Math.PI*.95,Math.PI*1.72,14],
    [10,-48,58,58,Math.PI*1.05,Math.PI*1.82,14],
    [62,-22,52,48,Math.PI*1.2,Math.PI*2.05,14],
    [88,25,42,38,Math.PI*1.45,Math.PI*2.45,14],
   ];
   for(const q of arcs)a.push(...ellipseArc(...q));
   a.push([70,62],[25,72],[-30,70],[-76,58],[-108,35]);
   return scaledPoints(a,p,.95,.95);
 }

 else if(shape.type==="parallelogram"){

 refreshTiles();resetCounters();render()
};

function counterText(v){return fmt(v,3)}
function setCounterHTML(el,v){
 el.innerHTML='<span class="counterNumber">'+fmt(v,3)+'</span><span class="counterUnitText">br²</span>';
}
function resetCounters(){
 counterState={big:0,mid:0,small:0,counted:false,midDone:false,smallDone:false,converting:false,midStage:0,smallStage:0};
 counterBig.textContent=counterMid.textContent=counterSmall.textContent="—";
 midUnit.classList.remove("ready");smallUnit.classList.remove("ready");
 midDivisor.classList.remove("hidden");smallDivisor.classList.remove("hidden");midUnit.classList.remove("termGone");smallUnit.classList.remove("termGone");plusAB.classList.remove("plusGone");plusBC.classList.remove("plusGone");
}
function counterText(v){return fmt(v,3)+" br²"}
function setCounter(level,v){const e=level==="big"?counterBig:level==="mid"?counterMid:counterSmall;setCounterHTML(e,v);e.classList.remove("pulse");void e.offsetWidth;e.classList.add("pulse");setTimeout(()=>e.classList.remove("pulse"),220)}
function centerOf(e){const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
async function mergeTerm(sourceUnit,sourceBox,targetBox,value,onMerged){
 counterState.converting=true;
 const sr=sourceUnit.getBoundingClientRect(),tr=targetBox.getBoundingClientRect();
 const clone=sourceUnit.cloneNode(true);
 clone.removeAttribute("id");clone.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
 clone.classList.remove("ready","clickable");clone.classList.add("mergeClone");
 clone.style.width=sr.width+"px";clone.style.maxWidth=sr.width+"px";clone.style.height=sr.height+"px";
 clone.style.left=sr.left+"px";clone.style.top=sr.top+"px";
 document.body.appendChild(clone);
 sourceUnit.style.opacity="0";
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const cr=clone.getBoundingClientRect();
 clone.style.left=(tr.left+tr.width/2-cr.width/2)+"px";
 clone.style.top=(tr.top+tr.height/2-cr.height/2)+"px";
 clone.style.transform="scale(.72)";
 await new Promise(r=>setTimeout(r,520));
 onMerged();
 targetBox.classList.add("mergeTargetPulse");
 setTimeout(()=>targetBox.classList.remove("mergeTargetPulse"),360);
 clone.style.opacity="0";clone.style.transform="scale(.35)";
 await new Promise(r=>setTimeout(r,190));clone.remove();

}
async function convertCounter(level){
 if(!counterState.counted||counterState.converting)return;
 const mid=level==="mid",unit=mid?midUnit:smallUnit,src=mid?counterMid:counterSmall,den=mid?midDivisor:smallDivisor;
 const stageKey=mid?"midStage":"smallStage",doneKey=mid?"midDone":"smallDone",valueKey=mid?"mid":"small",div=mid?4:16;
 if(counterState[doneKey])return;

 // İlk tıklama: katsayı uygulanır (B/4 veya C/16), kesir katsayısı kaybolur.
 if(counterState[stageKey]===0){
   const n=counterState[valueKey];if(!n)return;
   counterState[valueKey]=n/div;setCounterHTML(src,counterState[valueKey]);
   den.classList.add("hidden");src.classList.add("pulse");setTimeout(()=>src.classList.remove("pulse"),220);
   counterState[stageKey]=1;return;
 }

 const v=counterState[valueKey];
 if(mid){
   // B -> A : A := A + B
   await mergeTerm(midUnit,counterMid,counterBig,v,()=>{
     counterState.big+=v;setCounterHTML(counterBig,counterState.big);
     counterState.mid=0;setCounterHTML(counterMid,0);counterState.midDone=true;counterState.midStage=2;
     midUnit.classList.add("termGone");plusAB.classList.add("plusGone");midUnit.style.opacity="";
   });
   midUnit.classList.remove("ready");
 }else{
   const bExists=!counterState.midDone&&!midUnit.classList.contains("termGone");
   if(bExists){
     // C -> B : B := B + C
     await mergeTerm(smallUnit,counterSmall,counterMid,v,()=>{
       counterState.mid+=v;setCounterHTML(counterMid,counterState.mid);
       counterState.small=0;setCounterHTML(counterSmall,0);counterState.smallDone=true;counterState.smallStage=2;
       smallUnit.classList.add("termGone");plusBC.classList.add("plusGone");smallUnit.style.opacity="";
     });
   }else{
     // B yoksa C -> A : A := A + C
     await mergeTerm(smallUnit,counterSmall,counterBig,v,()=>{
       counterState.big+=v;setCounterHTML(counterBig,counterState.big);
       counterState.small=0;setCounterHTML(counterSmall,0);counterState.smallDone=true;counterState.smallStage=2;
       smallUnit.classList.add("termGone");plusBC.classList.add("plusGone");smallUnit.style.opacity="";
     });
   }
   smallUnit.classList.remove("ready");
 }
}
midUnit.onclick=()=>convertCounter("mid");smallUnit.onclick=()=>convertCounter("small");
async function animateSum(){
 if(!shape||!tiles.length||animating)return;
 animating=true;resetCounters();
 setCounterHTML(counterBig,0);setCounterHTML(counterMid,0);setCounterHTML(counterSmall,0);
 const originals=tiles.map(t=>({...t})),sleep=ms=>new Promise(r=>setTimeout(r,ms)),flying=[];
 for(const t of originals){
   const d=document.createElement("div");
   d.className="flyTile flyTile-"+t.level;
   d.style.transition="none";
   const sp=worldToScreen(t.x,t.y);
   const fw=t.w*view.scale,fh=t.h*view.scale;
   d.style.left=sp.x+"px";d.style.top=sp.y+"px";
   d.style.width=fw+"px";d.style.height=fh+"px";
   d.style.boxSizing="border-box";
   d.style.borderWidth=(t.level==="big"?"1.4px":t.level==="mid"?".9px":".55px");
   document.body.appendChild(d);
   flying.push({tile:t,el:d,fw,fh});
 }
 void document.body.offsetWidth;
 svg.querySelectorAll(".tile").forEach(e=>e.style.visibility="hidden");
 await sleep(35);
 for(const o of flying)o.el.style.transition="";
 async function send(o,delay,level){
   await sleep(delay);
   const t=o.tile,d=o.el,target=level==="big"?counterBig:level==="mid"?counterMid:counterSmall;
   const r=target.getBoundingClientRect(),tx=r.left+r.width/2,ty=r.top+r.height/2;
   d.classList.add("lifted");
   // Boyut değişmez: şeklin içindeki ekranda görünen boyutuyla sayaca gider.
   d.style.width=o.fw+"px";d.style.height=o.fh+"px";
   d.style.left=(tx-o.fw/2)+"px";d.style.top=(ty-o.fh/2+7)+"px";
   const travel=level==="big"?480:level==="mid"?390:300;
   await sleep(travel);
   counterState[level]++;setCounter(level,counterState[level]);d.remove();
 }
 async function group(level){
   const g=flying.filter(o=>o.tile.level===level);
   const gap=level==="big"?82:level==="mid"?58:34;
   await Promise.all(g.map((o,i)=>send(o,i*gap,level)));
 }
 await group("big");
 await group("mid");
 await group("small");
 counterState.counted=true;
 if(counterState.mid)midUnit.classList.add("ready");
 if(counterState.small)smallUnit.classList.add("ready");
 for(const o of flying)if(o.el.isConnected)o.el.remove();

}
/* Zoom: fare konumunu sabit tutarak yakınlaştır / uzaklaştır. */
stage.addEventListener("wheel",e=>{
  if(animating)return;
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  const sx=e.clientX-r.left,sy=e.clientY-r.top;
  const wx=(sx-view.tx)/view.scale,wy=(sy-view.ty)/view.scale;
  const factor=Math.exp(-e.deltaY*0.00125);
  const ns=Math.max(.25,Math.min(8,view.scale*factor));
  view.tx=sx-wx*ns;view.ty=sy-wy*ns;view.scale=ns;
  applyView();
},{passive:false});

stage.addEventListener("pointerdown",e=>{
  if(animating||e.button!==0||!isPanTarget(e))return;
  panDrag={id:e.pointerId,x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};
  stage.setPointerCapture(e.pointerId);stage.classList.add("panning");
},true);
stage.addEventListener("pointermove",e=>{
  if(!panDrag||e.pointerId!==panDrag.id)return;
  const dx=e.clientX-panDrag.x,dy=e.clientY-panDrag.y;
  if(Math.hypot(dx,dy)>3)panDrag.moved=true;
  view.tx=panDrag.tx+dx;view.ty=panDrag.ty+dy;applyView();
  e.preventDefault();e.stopPropagation();
},true);
function endPan(e){
  if(!panDrag||e.pointerId!==panDrag.id)return;
  const moved=panDrag.moved;
  try{stage.releasePointerCapture(e.pointerId)}catch(_){}
  panDrag=null;stage.classList.remove("panning");
  if(moved){e.preventDefault();e.stopPropagation()}
}
