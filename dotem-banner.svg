<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 286" role="img" aria-label="DoTEM Dortmund Türk Eğitim Merkezi">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4bb7ff"/>
      <stop offset="1" stop-color="#dff4ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8e96a"/>
      <stop offset="1" stop-color="#6fb83f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="2500" height="286" fill="url(#sky)"/>
  <path d="M0 208 C180 188 300 198 470 212 C650 225 790 192 980 205 C1170 218 1330 193 1530 205 C1760 220 1940 188 2140 205 C2300 218 2410 204 2500 198 L2500 286 L0 286 Z" fill="url(#grass)"/>
  <path d="M0 225 C180 205 340 219 530 229 C720 239 930 211 1130 225 C1330 238 1510 214 1700 225 C1900 237 2120 212 2500 224 L2500 286 L0 286 Z" fill="#88c850" opacity=".78"/>

  <!-- distant trees -->
  <g fill="#4f9a43" opacity=".92">
    <circle cx="70" cy="196" r="34"/><circle cx="125" cy="185" r="42"/><circle cx="185" cy="202" r="32"/>
    <circle cx="2160" cy="195" r="36"/><circle cx="2220" cy="180" r="44"/><circle cx="2295" cy="200" r="34"/>
    <circle cx="2380" cy="187" r="39"/><circle cx="2450" cy="198" r="31"/>
  </g>

  <!-- Logo -->
  <g transform="translate(95 32)" filter="url(#soft)">
    <circle cx="105" cy="105" r="88" fill="#fff" stroke="#123e79" stroke-width="7"/>
    <circle cx="105" cy="105" r="73" fill="none" stroke="#123e79" stroke-width="2" stroke-dasharray="2 5"/>
    <path d="M88 141 C69 115 76 92 93 71 C91 88 104 92 101 110 C113 91 127 81 128 59 C151 87 145 119 132 142 Z" fill="#d90429"/>
    <text x="105" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d90429">DORTMUND</text>
    <text x="105" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#d90429">1992</text>
    <text x="105" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#123e79">DoTEM</text>
  </g>

  <!-- DoTEM title -->
  <g transform="translate(360 58)">
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">
      <tspan fill="#143f81">Do</tspan><tspan fill="#e3062d">TEM</tspan>
    </text>
    <line x1="2" y1="82" x2="555" y2="82" stroke="#e3062d" stroke-width="3"/>
    <text x="2" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#143f81">Dortmund Türk Eğitim Merkezi</text>
  </g>

  <!-- Stylized symmetric building -->
  <g transform="translate(1080 47)" filter="url(#soft)">
    <rect x="90" y="72" width="760" height="128" rx="2" fill="#b94b2f" stroke="#7f2b1c" stroke-width="3"/>
    <rect x="310" y="42" width="320" height="158" fill="#c45634" stroke="#7f2b1c" stroke-width="3"/>
    <rect x="420" y="15" width="100" height="185" fill="#c95c38" stroke="#7f2b1c" stroke-width="3"/>

    <!-- roof -->
    <path d="M75 72 L145 28 L255 72 Z" fill="#a93625"/>
    <path d="M685 72 L795 28 L865 72 Z" fill="#a93625"/>
    <path d="M300 42 L350 5 L410 42 Z" fill="#a93625"/>
    <path d="M630 42 L690 5 L740 42 Z" fill="#a93625"/>
    <path d="M410 15 L470 -10 L530 15 Z" fill="#a93625"/>

    <!-- towers -->
    <g fill="#6e7a7d" stroke="#4f595c" stroke-width="2">
      <path d="M128 72 L165 16 L202 72 Z"/>
      <path d="M738 72 L775 16 L812 72 Z"/>
    </g>
    <circle cx="165" cy="14" r="5" fill="#70807f"/>
    <circle cx="775" cy="14" r="5" fill="#70807f"/>

    <!-- central gable -->
    <path d="M420 15 Q470 -30 520 15 L520 72 L420 72 Z" fill="#d06a42" stroke="#7f2b1c" stroke-width="3"/>
    <circle cx="470" cy="16" r="10" fill="#f2e7d7" stroke="#7f2b1c" stroke-width="2"/>

    <!-- windows -->
    <g fill="#d9eef5" stroke="#6b2b20" stroke-width="2">
      <rect x="115" y="95" width="34" height="54" rx="17"/><rect x="193" y="95" width="34" height="54" rx="17"/><rect x="271" y="95" width="34" height="54" rx="17"/><rect x="349" y="95" width="34" height="54" rx="17"/><rect x="427" y="95" width="34" height="54" rx="17"/><rect x="505" y="95" width="34" height="54" rx="17"/><rect x="583" y="95" width="34" height="54" rx="17"/><rect x="661" y="95" width="34" height="54" rx="17"/><rect x="739" y="95" width="34" height="54" rx="17"/>
      <rect x="115" y="156" width="34" height="39" rx="17"/><rect x="193" y="156" width="34" height="39" rx="17"/><rect x="271" y="156" width="34" height="39" rx="17"/><rect x="349" y="156" width="34" height="39" rx="17"/><rect x="427" y="156" width="34" height="39" rx="17"/><rect x="505" y="156" width="34" height="39" rx="17"/><rect x="583" y="156" width="34" height="39" rx="17"/><rect x="661" y="156" width="34" height="39" rx="17"/><rect x="739" y="156" width="34" height="39" rx="17"/>
      <rect x="455" y="85" width="30" height="68" rx="15"/>
    </g>

    <!-- white decorative panels -->
    <g fill="#efe6d6">
      <rect x="438" y="58" width="18" height="104"/>
      <rect x="484" y="58" width="18" height="104"/>
      <rect x="337" y="60" width="14" height="102"/>
      <rect x="590" y="60" width="14" height="102"/>
    </g>

    <!-- entrance -->
    <path d="M438 200 V165 Q470 135 502 165 V200 Z" fill="#f7f7f7" stroke="#6b2b20" stroke-width="3"/>
    <rect x="462" y="170" width="16" height="30" fill="#dbeaf1"/>
    <rect x="482" y="170" width="16" height="30" fill="#dbeaf1"/>

    <!-- steps -->
    <path d="M390 200 H550 L570 220 H370 Z" fill="#d8d0c3" stroke="#999" stroke-width="2"/>
    <line x1="382" y1="207" x2="558" y2="207" stroke="#aaa"/>
    <line x1="377" y1="214" x2="563" y2="214" stroke="#aaa"/>
  </g>

  <!-- small houses -->
  <g transform="translate(2050 165)" opacity=".95">
    <rect x="0" y="18" width="95" height="52" fill="#f4eee3"/>
    <path d="M-6 18 L46 -14 L101 18 Z" fill="#bf5b3c"/>
    <rect x="18" y="36" width="18" height="34" fill="#d8edf4"/>
    <rect x="60" y="34" width="18" height="20" fill="#d8edf4"/>
    <rect x="125" y="20" width="88" height="50" fill="#f4eee3"/>
    <path d="M118 20 L168 -10 L220 20 Z" fill="#c35a3b"/>
    <rect x="145" y="39" width="17" height="31" fill="#d8edf4"/>
    <rect x="178" y="36" width="17" height="18" fill="#d8edf4"/>
  </g>

  <!-- byline -->
  <g transform="translate(2055 238)">
    <rect x="0" y="0" width="380" height="34" rx="17" fill="#1f2b20" opacity=".78"/>
    <text x="190" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#fff">Sinan İpek tarafından hazırlanmıştır.</text>
  </g>
</svg>