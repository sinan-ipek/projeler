name: Install Stockfish 19 engine
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-chess-stockfish-main.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified engine files from npm
        run: |
          set -euo pipefail
          mkdir -p chess/stockfish
          npm pack stockfish@19.0.1 --silent
          tar -xzf stockfish-19.0.1.tgz package/bin/stockfish-19-lite-single.js package/bin/stockfish-19-lite-single.wasm
          mv package/bin/stockfish-19-lite-single.js chess/stockfish/
          mv package/bin/stockfish-19-lite-single.wasm chess/stockfish/
          rm -rf package stockfish-19.0.1.tgz
          test -s chess/stockfish/stockfish-19-lite-single.js
          test -s chess/stockfish/stockfish-19-lite-single.wasm
          echo 'Stockfish.js 19.0.1 GPL-3.0 https://github.com/nmrugg/stockfish.js' > chess/stockfish/SOURCE.txt
      - name: Commit engine files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chess/stockfish
          git diff --cached --quiet || (git commit -m 'Install local Stockfish 19 browser engine' && git push)
