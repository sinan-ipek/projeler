name: Install Stockfish 19 engine
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-chess-stockfish-main.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified engine files
        run: |
          set -euo pipefail
          mkdir -p chess/stockfish
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/stockfish-19-lite-single.js -o chess/stockfish/stockfish-19-lite-single.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/stockfish-19-lite-single.wasm -o chess/stockfish/stockfish-19-lite-single.wasm
          test -s chess/stockfish/stockfish-19-lite-single.js
          test -s chess/stockfish/stockfish-19-lite-single.wasm
          echo 'Stockfish.js 19.0.1 GPL-3.0 https://github.com/nmrugg/stockfish.js' > chess/stockfish/SOURCE.txt
      - name: Commit engine files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chess/stockfish
          git diff --cached --quiet || (git commit -m 'Install local Stockfish 19 browser engine' && git push)
