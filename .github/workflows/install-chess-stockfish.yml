name: Install Stockfish for chess teacher beta
on:
  push:
    branches: [chess-teacher-beta]
    paths: ['.github/workflows/install-chess-stockfish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chess-teacher-beta
      - name: Download pinned official npm engine
        run: |
          set -euo pipefail
          mkdir -p chess/stockfish
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/stockfish-19-lite-single.js' -o chess/stockfish/stockfish-19-lite-single.js
          curl -fL --retry 3 'https://cdn.jsdelivr.net/npm/stockfish@19.0.1/bin/stockfish-19-lite-single.wasm' -o chess/stockfish/stockfish-19-lite-single.wasm
          test -s chess/stockfish/stockfish-19-lite-single.js
          test -s chess/stockfish/stockfish-19-lite-single.wasm
          printf 'Stockfish.js 19.0.1 is GPL-3.0. Source: https://github.com/nmrugg/stockfish.js\n' > chess/stockfish/SOURCE.txt
      - name: Commit engine assets to beta branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chess/stockfish
          git diff --cached --quiet || (git commit -m 'Install Stockfish 19 lite single engine assets' && git push)
