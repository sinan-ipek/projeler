name: Ensure page visit tracking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/ensure_visit_tracking.py'
      - '.github/workflows/ensure-visit-tracking.yml'
permissions:
  contents: write
concurrency:
  group: ensure-visit-tracking-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add tracker to untracked HTML pages
        run: python scripts/ensure_visit_tracking.py
      - name: Commit tracked pages
        run: |
          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Automatically add visit tracker to new HTML pages"
            git push
          else
            echo "All pages already have tracking or load shared-ui.js."
          fi
