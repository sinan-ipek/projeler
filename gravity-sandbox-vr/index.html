 let count=0;
 for(const b of bodies){
  if(b===ridingBody||count>=600)continue;

  const dist=relative.length();
  if(dist<1e-6)continue;

  // This is an observational rendering, not a change in the simulated orbits.
  const groundDistance=Math.hypot(relative.x,relative.z);
  const k=count*3;
  microSkyPositions[k]=b.pos.x;
  microSkyPositions[k+1]=ridingBody.pos.y+Math.max(groundDistance*.28,3);
  microSkyPositions[k+2]=b.pos.z;
  const color=b.mesh.material.color;
  microSkyColors[k]=color.r;microSkyColors[k+1]=color.g;microSkyColors[k+2]=color.b;

 microSkyGeometry.attributes.color.needsUpdate=true;
}
const surface=new THREE.Mesh(new THREE.PlaneGeometry(120,120,1,1),

 floor.visible=planetMode;grid.visible=planetMode;
 for(const b of bodies)b.mesh.visible=true;
}
function mountSelected(){

 for(const b of bodies)b.mesh.visible=true;

 surface.material.color.copy(ridingBody.mesh.material.color);
 surface.visible=!planetMode&&rideViewMode==='micro';
}
function updateRidingView(){
 if(!ridingBody||!bodies.includes(ridingBody)){if(ridingBody)dismount();return}
 // The entire simulated universe translates with the ridden planet;
 // headset orientation stays under native WebXR head tracking.
 const xrEye=(renderer.xr.isPresenting?renderer.xr.getCamera():camera);
 const micro=rideViewMode==='micro';
 const scale=SCALE*(micro?MICRO_SCALE_MULTIPLIER:1);
 world.scale.setScalar(scale);

 // At physical contact: sphere bottom = -10, and the eye stays above its top.
 // The world stays fixed in the XR reference frame; headset tracking remains native.
 const target=new THREE.Vector3(0,1.5,0);
 const pole=ridingBody.pos.clone();
 pole.y+=ridingBody.radius;

 surface.position.set(location.x,location.y-1.55,location.z);
 surface.scale.setScalar(micro?100:1);
 surface.visible=!planetMode&&micro;
 floor.visible=planetMode;grid.visible=planetMode;
 // The visible ground must always coincide with the physics plane y=-10.
 // Never attach the physical ground to the ridden body's height.
 floor.position.y=-10;
 grid.position.y=-9.98;
 surface.material.color.copy(ridingBody.mesh.material.color);
 for(const b of bodies){
  b.mesh.visible=!micro&&b!==ridingBody;

const floor=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshBasicMaterial({color:0x16243a,side:THREE.DoubleSide}));
floor.rotation.x=-Math.PI/2;floor.position.y=-10;floor.visible=false;world.add(floor);
const grid=new THREE.GridHelper(2000,200,0x263c56,0x1a2a3f);grid.position.y=-9.98;grid.visible=false;world.add(grid);
const geometry=new THREE.SphereGeometry(1,20,14);
const G=5,SOFT=1.44,DT=1/120,G_PLANET=12,BOUNCE=.72;
const HISTORY=280;

const collisionModes=[

 ['elastic','ESNEK ÇARPIŞMA'],['fragment','PARÇALANMA'],

let collisionMode='pass';
function collisionModeText(){return collisionModes.find(item=>item[0]===collisionMode)?.[1]||'SERBEST GEÇİŞ';}

function makeBody(radius,color,x,y,z,vx,vy,vz){

 const trail=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.78}));

 const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,color, .25,.15);
 arrow.visible=false;world.add(arrow);

 const b={radius,mass,mesh,trail,arrow,velocityHandle,coords,pos:new THREE.Vector3(x,y,z),v:new THREE.Vector3(vx,vy,vz),history:[],tick:0};

}
function drawBody(b){
 b.mesh.position.copy(b.pos);
 if(b.objectAccent){
  b.objectAccent.position.copy(b.pos);
  if(b.objectKind==='comet'){
   const speed=b.v.length();
   const dir=speed>.01?b.v.clone().normalize():new THREE.Vector3(1,0,0);
   b.objectAccent.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.negate());
   b.objectAccent.visible=true;
  }
 }
 if(b.rocket){
  const burning=b.rocket.burnRemaining>0;
  b.rocketFlame.visible=burning;
  if(burning){
   b.rocketFlame.scale.y=.85+.17*Math.sin(b.rocket.burnRemaining*24);
   b.rocketFlame.material.opacity=.72+.2*(b.rocket.burnRemaining/b.rocket.burnDuration);
  }
 }

 const speed=b.v.length();
 b.arrow.visible=showVelocities&&speed>.00001;
 b.velocityHandle.visible=showVelocities&&selectedBodies.has(b)&&speed>.00001&&!ridingBody;
 if(b.arrow.visible){
  // The arrow uses the true instantaneous world-space velocity direction.
  // Its length uses a single common scale for all celestial bodies.
  const dir=b.v.clone().divideScalar(speed);
  const length=Math.max(.6,Math.min(32,speed*.48));
  b.arrow.position.copy(b.pos);
  b.arrow.setDirection(dir);
  b.arrow.setLength(length,Math.min(2.2,length*.24),Math.min(1.1,length*.13));
  b.velocityHandle.position.copy(b.pos).addScaledVector(dir,length);
 }
}
// The velocity handle is a UI control. Keep its comfortable near-field size,
// then gently reduce its apparent diameter at long viewing distances.
const HANDLE_ANGLE_RADIUS=THREE.MathUtils.degToRad(.75);
const HANDLE_GEOMETRY_RADIUS=.65;
const HANDLE_FALLOFF_NEAR=1.5; // metres: unchanged at this distance and nearer
const HANDLE_FALLOFF_FAR=5.0;  // metres: fully tapered after this distance
const HANDLE_FAR_REDUCTION=.15; // maximum 15% smaller than v11.2
function updateVelocityHandleSizes(dt){
 const view=renderer.xr.isPresenting?renderer.xr.getCamera():camera;
 const eye=view.getWorldPosition(new THREE.Vector3());
 const worldScale=Math.max(.000001,world.getWorldScale(new THREE.Vector3()).x);
 const blend=1-Math.exp(-10*Math.max(0,Math.min(dt,.05)));
 for(const body of bodies){
  if(!body.velocityHandle.visible)continue;
  const distance=body.velocityHandle.getWorldPosition(new THREE.Vector3()).distanceTo(eye);
  const t=THREE.MathUtils.clamp((distance-HANDLE_FALLOFF_NEAR)/(HANDLE_FALLOFF_FAR-HANDLE_FALLOFF_NEAR),0,1);
  const smooth=t*t*(3-2*t); // smoothstep; no sharp size transition
  const baseline=THREE.MathUtils.clamp(distance*Math.tan(HANDLE_ANGLE_RADIUS)/worldScale,.12,2.7);
  const desired=baseline*(1-HANDLE_FAR_REDUCTION*smooth);
  const current=body.velocityHandle.scale.x*HANDLE_GEOMETRY_RADIUS;
  const next=current+(desired-current)*blend;
  body.velocityHandle.scale.setScalar(next/HANDLE_GEOMETRY_RADIUS);
 }
}
function updateTrail(b){
 b.history.push(b.pos.clone());
 if(b.history.length>HISTORY)b.history.shift();
 const attr=b.trail.geometry.attributes.position;
 for(let i=0;i<b.history.length;i++)attr.setXYZ(i,b.history[i].x,b.history[i].y,b.history[i].z);

}
function disposeSpecialVisual(b){
 if(b.objectAccent){
  world.remove(b.objectAccent);b.objectAccent.geometry.dispose();b.objectAccent.material.dispose();b.objectAccent=null;
 }
 if(b.rocketVisual){
  b.rocketVisual.traverse(child=>{
   if(child.isMesh){child.geometry.dispose();if(Array.isArray(child.material))child.material.forEach(m=>m.dispose());else child.material.dispose();}
  });

}
function createSpecialBody(kind,pos,velocity=new THREE.Vector3(),direction=new THREE.Vector3(0,0,-1),opt={}){
 const kinds={planet:[.9,0x80cbff,null],comet:[.4,0x9ce9ee,.35],blackhole:[.7,0x362b6e,2600],rocket:[1.05,0xe4eff7,4]};
 const [defaultRadius,defaultColor,defaultMass]=kinds[kind]||kinds.planet;
 const radius=opt.radius??defaultRadius,color=opt.color??defaultColor,v=velocity.clone();
 const b=makeBody(radius,color,pos.x,pos.y,pos.z,v.x,v.y,v.z);
 b.mass=opt.mass??(defaultMass??b.mass);b.objectKind=kind;
 if(kind==='blackhole'){
  b.objectAccent=new THREE.Mesh(new THREE.TorusGeometry(1.2,.13,8,48),
   new THREE.MeshBasicMaterial({color:0xe8a44a,side:THREE.DoubleSide}));
  b.objectAccent.rotation.x=Math.PI/2;world.add(b.objectAccent);
 }else if(kind==='comet'){
  b.objectAccent=new THREE.Mesh(new THREE.ConeGeometry(.24,3,12,1,true),
   new THREE.MeshBasicMaterial({color:0x9ce9ee,transparent:true,opacity:.25,side:THREE.DoubleSide,depthWrite:false}));

   thrustAcceleration:opt.thrustAcceleration??4};
  b.mesh.material.transparent=true;b.mesh.material.opacity=.06;
  const model=new THREE.Group(),shell=new THREE.MeshStandardMaterial({color:0xcbdce8,metalness:.45,roughness:.32});
  const noseMat=new THREE.MeshStandardMaterial({color:0xff6c59,roughness:.4}),finMat=new THREE.MeshStandardMaterial({color:0x63b9f8,roughness:.4});
  model.add(new THREE.Mesh(new THREE.CylinderGeometry(.30,.36,1.15,14),shell));
  const nose=new THREE.Mesh(new THREE.ConeGeometry(.30,.55,14),noseMat);nose.position.y=.84;model.add(nose);
  for(const sign of [-1,1]){
   const fin=new THREE.Mesh(new THREE.BoxGeometry(.12,.43,.48),finMat);fin.position.set(sign*.39,-.45,0);model.add(fin);
  }

   new THREE.MeshBasicMaterial({color:0xffae3f,transparent:true,opacity:.85,depthWrite:false,side:THREE.DoubleSide}));

}
function disposeBodyArrow(b){
 if(!b.arrow)return;

 b.arrow.line.geometry.dispose();b.arrow.line.material.dispose();
 world.remove(b.velocityHandle);b.velocityHandle.geometry.dispose();b.velocityHandle.material.dispose();

}
function clearBodies(){
 for(const b of bodies){
  world.remove(b.mesh,b.trail);
  b.mesh.material.dispose();b.trail.geometry.dispose();b.trail.material.dispose();
  disposeSpecialVisual(b);

function setup(){
 clearBodies();accumulator=0;
 // Stable default system: all bodies have identical density.
 // Circular softened-gravity orbital speeds and generously separated orbits
 // keep the system stable over an extended unattended observation.
 const starRadius=7;
 const starMass=DENSITY_FACTOR*starRadius**3;
 const star=makeBody(starRadius,0xffc253,0,0,0,0,0,0);
 const orbits=[
  {distance:24,radius:.8,color:0x57a7ff,phase:.1},
  {distance:48,radius:1,color:0xf17b6d,phase:2.3},
  {distance:90,radius:1.2,color:0x71dab8,phase:4.4}
 ];
 for(const orbit of orbits){
  const {distance:r,radius,color,phase}=orbit;
  const mass=DENSITY_FACTOR*radius**3;
  const speed=Math.sqrt(G*(starMass+mass)*r*r/Math.pow(r*r+SOFT,1.5));
  makeBody(radius,color,r*Math.cos(phase),0,r*Math.sin(phase),
   -Math.sin(phase)*speed,0,Math.cos(phase)*speed);

 // Put the central body into the system's reflex motion; preserve relative
 // circular velocities and avoid a large systemic center-of-mass drift.

 for(let i=1;i<bodies.length;i++)bodies[i].v.add(recoil);
 for(const body of bodies){body.history=[];updateTrail(body)}
}
function addVRPreset(id,replaceExisting=false){
 cancelObjectPlacement();
 dismount();vectorDrag=null;endTwoHand();grabs.clear();choosePlanets([]);
 accumulator=0;

 if(replaceExisting){
  clearBodies();

  const b=makeBody(r,color,x+center.x,y+center.y,z+center.z,vx,vy,vz);
  if(mass!==null)b.mass=mass;
  b.history=[];updateTrail(b);return b;
 };
 if(id==='solar'){
  if(countBefore===0)planetMode=false;
  const star=add(5,0xffc451,0,0,0);
  const radii=[.6,.7,.8,.7,1.5,1.4,1,1],dist=[14,20,27,35,47,63,80,100];
  for(let i=0;i<8;i++){
   const a=i*2.39996,d=dist[i],v=Math.sqrt(G*star.mass*d*d/Math.pow(d*d+SOFT,1.5));
   add(radii[i],[0xc9c2b4,0xedab55,0x58a7ff,0xdd8068,0xe6be83,0xd6bd94,0x7ad6e8,0x678ce3][i],
    Math.cos(a)*d,0,Math.sin(a)*d,-Math.sin(a)*v,0,Math.cos(a)*v);
  }
 }else if(id==='binary'){
  if(countBefore===0)planetMode=false;
  // Equal-mass circular binary; both orbit their barycentre.
  const mass=430,d=18;
  const speed=Math.sqrt(G*mass*d*d/Math.pow(4*d*d+SOFT,1.5));
  add(3.35,0xf9bd49,-d,0,0,0,0,-speed,mass);
  add(3.35,0x80bcff,d,0,0,0,0,speed,mass);
  for(let i=0;i<3;i++){
   const r=55+i*16,angle=.65+i*2.2;
   const v=Math.sqrt(G*2*mass*r*r/Math.pow(r*r+SOFT,1.5));
   add(.7,[0x71dab8,0xe69a79,0x8e9cfa][i],r*Math.cos(angle),0,r*Math.sin(angle),-v*Math.sin(angle),0,v*Math.cos(angle));
  }
 }else if(id==='rings'){
  if(countBefore===0)planetMode=false;
  const star=add(4.6,0xe5be78,0,0,0,0,0,0,950);
  const colors=[0xe7ca88,0x91bdda,0xe49f85,0xc2b6e9];
  for(let i=0;i<44;i++){
   const dist=15+(i%6)*3.8,angle=i*2.399963229728653;
   const speed=Math.sqrt(G*star.mass*dist*dist/Math.pow(dist*dist+SOFT,1.5));

    -speed*Math.sin(angle),0,speed*Math.cos(angle),.12);

  if(countBefore===0)planetMode=false;
  // Deterministic spherical cloud with near-zero initial velocities.
  const count=56,golden=Math.PI*(3-Math.sqrt(5)),colors=[0x8cc7ff,0xe6bb75,0x86deb7,0xd394ca];
  for(let i=0;i<count;i++){
   const y=1-2*(i+.5)/count,phi=i*golden,radius=14+11*((i*13)%count)/(count-1);
   const ring=Math.sqrt(1-y*y),dx=ring*Math.cos(phi),dz=ring*Math.sin(phi);
   add(.48,colors[i%4],radius*dx,radius*y,radius*dz,0,0,0,8);
  }
 }else if(id==='eight'){
  if(countBefore===0)planetMode=false;
  const l=12,m=140,vs=Math.sqrt(G*m/l);
  const q=[[-.97000436,.24308753],[.97000436,-.24308753],[0,0]];
  const v=[[.466203685,.43236573],[.466203685,.43236573],[-.93240737,-.86473146]];
  for(let i=0;i<3;i++)add(1.6,[0xe6ab44,0x508de1,0xdf6558][i],q[i][0]*l,0,q[i][1]*l,v[i][0]*vs,0,v[i][1]*vs,m);
 }else if(id==='lagrange'){
  if(countBefore===0)planetMode=false;

  const d=new THREE.Vector3().subVectors(bodies[j].pos,bodies[i].pos);
  const rr=d.lengthSq()+SOFT,k=G/(rr*Math.sqrt(rr));

// Limit fragments and destructive operations per frame for Quest performance.
const MAX_FRAGMENT_BODIES=160;
function discardCollisionBody(body){
 if(ridingBody===body)dismount();
 if(vectorDrag?.body===body)vectorDrag=null;
 if(twoHand?.type==='objects'&&twoHand.members.some(m=>m.body===body))endTwoHand();
 for(const [controller,grab] of grabs){
  if(grab.body===body||grab.members?.some(m=>m.body===body))grabs.delete(controller);
 }
 for(const [controller,target] of magneticTargets)if(target===body)magneticTargets.delete(controller);
 for(const set of hoverBodies.values())if(set)set.delete(body.mesh);
 selectedBodies.delete(body);
 if(selectedPlanet===body)selectedPlanet=null;
 const ring=selectionRings.get(body);
 if(ring){world.remove(ring);ring.geometry.dispose();ring.material.dispose();selectionRings.delete(body);}
 const index=bodies.indexOf(body);
 if(index>=0)bodies.splice(index,1);

function mergeCollisionBodies(a,b){
 const mass=a.mass+b.mass;
 if(mass<=0)return;
 const pos=a.pos.clone().multiplyScalar(a.mass).addScaledVector(b.pos,b.mass).divideScalar(mass);
 const velocity=a.v.clone().multiplyScalar(a.mass).addScaledVector(b.v,b.mass).divideScalar(mass);
 // Add spherical volumes, even for compact unusual-density objects.
 const radius=Math.cbrt(a.radius**3+b.radius**3);
 const color=a.mesh.material.color.clone().multiplyScalar(a.mass/mass)
  .add(b.mesh.material.color.clone().multiplyScalar(b.mass/mass)).getHex();
 const wasSelected=selectedBodies.has(a)||selectedBodies.has(b);
 discardCollisionBody(a);discardCollisionBody(b);
 const merged=makeBody(radius,color,pos.x,pos.y,pos.z,velocity.x,velocity.y,velocity.z);
 merged.mass=mass;updateTrail(merged);
 finishCollisionSelection([merged],wasSelected);
}
function fragmentCollisionBodies(a,b,normal,approach,onlySmall=false){
 const totalMass=a.mass+b.mass;
 const wasSelected=selectedBodies.has(a)||selectedBodies.has(b);
 const basis=Math.abs(normal.y)>.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
 const tangent=new THREE.Vector3().crossVectors(normal,basis).normalize();
 const side=new THREE.Vector3().crossVectors(normal,tangent).normalize();
 const dirs=[
  tangent.clone().add(side),tangent.clone().sub(side),
  tangent.clone().negate().add(side),tangent.clone().negate().sub(side)
 ].map(v=>v.normalize());
 let origin,velocity,volume,mass,color,spread;
 if(onlySmall){
  const big=a.mass>=b.mass?a:b,small=a.mass>=b.mass?b:a;
  const selectedSmall=selectedBodies.has(small);
  const outward=small.pos.clone().sub(big.pos);
  if(outward.lengthSq()<1e-10)outward.copy(small===b?normal:normal.clone().negate());
  outward.normalize();
  const impactSpeed=Math.max(0,-small.v.clone().sub(big.v).dot(outward));
  const impulse=impactSpeed*.35*small.mass;
  const newBigVelocity=big.v.clone().addScaledVector(outward,-impulse/Math.max(big.mass,1e-9));
  const totalMomentum=big.v.clone().multiplyScalar(big.mass).addScaledVector(small.v,small.mass);
  velocity=totalMomentum.addScaledVector(newBigVelocity,-big.mass).divideScalar(Math.max(small.mass,1e-9));
  volume=small.radius**3;mass=small.mass;color=small.mesh.material.color.getHex();
  spread=Math.min(7,impactSpeed*.25);
  const r=Math.cbrt(volume/4);
  origin=big.pos.clone().addScaledVector(outward,big.radius+r*1.8);
  discardCollisionBody(small);
  big.v.copy(newBigVelocity);
  // Every pair of fragment velocities cancels its counterpart, preserving momentum.
  const pieces=[];
  for(const d of dirs){
   const dir=outward.clone().multiplyScalar(.6).addScaledVector(d,.8).normalize();
   const p=origin.clone().addScaledVector(dir,r*1.8);
   const v=velocity.clone().addScaledVector(d,spread);
   const piece=makeBody(r,color,p.x,p.y,p.z,v.x,v.y,v.z);
   piece.mass=mass/4;updateTrail(piece);pieces.push(piece);
  }
  finishCollisionSelection(pieces,selectedSmall);
  return;
 }
 mass=totalMass;volume=a.radius**3+b.radius**3;
 origin=a.pos.clone().multiplyScalar(a.mass).addScaledVector(b.pos,b.mass).divideScalar(mass);
 velocity=a.v.clone().multiplyScalar(a.mass).addScaledVector(b.v,b.mass).divideScalar(mass);
 color=a.mesh.material.color.clone().multiplyScalar(a.mass/mass)
  .add(b.mesh.material.color.clone().multiplyScalar(b.mass/mass)).getHex();
 spread=Math.min(9,-approach*.3);
 discardCollisionBody(a);discardCollisionBody(b);
 const r=Math.cbrt(volume/4),pieces=[];
 for(const d of dirs){
  const p=origin.clone().addScaledVector(d,r*1.8);
  const v=velocity.clone().addScaledVector(d,spread);
  const piece=makeBody(r,color,p.x,p.y,p.z,v.x,v.y,v.z);
  piece.mass=mass/4;updateTrail(piece);pieces.push(piece);
 }
 finishCollisionSelection(pieces,wasSelected);
}
function resolveSpaceCollisions(){
 if(collisionMode==='pass'||planetMode)return;
 let merges=0;
 collisionPairs: for(let i=0;i<bodies.length;i++){
  const a=bodies[i];if(grabbedBody(a))continue;
  for(let j=i+1;j<bodies.length;j++){
   const b=bodies[j];if(grabbedBody(b))continue;
   const dx=b.pos.x-a.pos.x,dy=b.pos.y-a.pos.y,dz=b.pos.z-a.pos.z;
   const minDist=a.radius+b.radius;
   const distanceSq=dx*dx+dy*dy+dz*dz;
   if(distanceSq>=minDist*minDist)continue;
   const distance=Math.sqrt(distanceSq);
   const normal=distance>1e-8?new THREE.Vector3(dx/distance,dy/distance,dz/distance):new THREE.Vector3(1,0,0);
   const approach=b.v.clone().sub(a.v).dot(normal);
   if(collisionMode==='merge'){
    mergeCollisionBodies(a,b);
    if(++merges>=8)return;
    // Body indices change on merge; restart from the beginning, bounded to 8.
    i=-1;continue collisionPairs;
   }
   const highSpeed=approach< -5;
   if(collisionMode==='dynamic'){
    const ratio=Math.max(a.mass,b.mass)/Math.max(1e-9,Math.min(a.mass,b.mass));
    if(highSpeed&&ratio>3&&bodies.length+3<=MAX_FRAGMENT_BODIES){
     fragmentCollisionBodies(a,b,normal,approach,true);return;
    }
    if(highSpeed&&ratio<=3&&bodies.length+2<=MAX_FRAGMENT_BODIES){
     fragmentCollisionBodies(a,b,normal,approach);return;
    }
    mergeCollisionBodies(a,b);return;
   }
   if(collisionMode==='fragment'&&highSpeed&&bodies.length+2<=MAX_FRAGMENT_BODIES){
    fragmentCollisionBodies(a,b,normal,approach);return;
   }
   // Ideal elastic impulse with positional depenetration.
   const invA=1/Math.max(a.mass,1e-9),invB=1/Math.max(b.mass,1e-9);
   const correction=(minDist-distance+.0001)/(invA+invB);
   a.pos.addScaledVector(normal,-correction*invA);
   b.pos.addScaledVector(normal,correction*invB);
   if(approach<0){
    const impulse=-2*approach/(invA+invB);
    a.v.addScaledVector(normal,-impulse*invA);
    b.v.addScaledVector(normal,impulse*invB);
   }
  }
 }
}
function step(){
 let a=accelerations();
 const rocketThrust=new Map();
 for(let i=0;i<bodies.length;i++){
  const b=bodies[i];
  if(!b.rocket||b.rocket.burnRemaining<=0||grabbedBody(b))continue;
  const active=Math.min(DT,b.rocket.burnRemaining)/DT;
  const acceleration=b.rocket.direction.clone().multiplyScalar(b.rocket.thrustAcceleration*active);
  rocketThrust.set(b,acceleration);
  a[i].add(acceleration);
 }
 for(let i=0;i<bodies.length;i++){
  const b=bodies[i];if(grabbedBody(b))continue;b.v.addScaledVector(a[i],DT/2);b.pos.addScaledVector(b.v,DT);
 }
 a=accelerations();
 for(let i=0;i<bodies.length;i++){
  const b=bodies[i];if(grabbedBody(b))continue;
  if(rocketThrust.has(b))a[i].add(rocketThrust.get(b));
  b.v.addScaledVector(a[i],DT/2);
  if(rocketThrust.has(b))b.rocket.burnRemaining=Math.max(0,b.rocket.burnRemaining-DT);
 }
 if(planetMode)for(const b of bodies){
  if(grabbedBody(b))continue;
  const ground=-10+b.radius;
  if(b.pos.y<ground){b.pos.y=ground;if(b.v.y<0){b.v.y=-b.v.y*BOUNCE;if(b.v.y<.4)b.v.y=0}}
 }
 if(!planetMode&&collisionMode!=='pass')resolveSpaceCollisions();
 for(const b of bodies)if(++b.tick%5===0)updateTrail(b);
}

// Only the release impulse is smoothed; held planets still track hands directly.

function estimateThrowVelocity(samples){

 const recent=samples.filter(s=>end-s.t<=THROW_WINDOW);
 if(recent.length<3)return new THREE.Vector3();
 const n=recent.length;
 let tMean=0;
 const pMean=new THREE.Vector3();
 for(const s of recent){tMean+=s.t;pMean.add(s.p)}
 tMean/=n;pMean.divideScalar(n);
 let denominator=0;
 const numerator=new THREE.Vector3();
 for(const s of recent){
  const d=s.t-tMean;
  denominator+=d*d;
  numerator.addScaledVector(s.p.clone().sub(pMean),d);
 }
 if(denominator<.000001)return new THREE.Vector3();
 const velocity=numerator.divideScalar(denominator);
 // Ignore extremely small involuntary release motions.
 if(velocity.length()<THROW_DEADZONE)return velocity.set(0,0,0);

   while(g.samples.length>3&&now-g.samples[0].t>THROW_WINDOW)g.samples.shift();
  }else if(twoHand&&twoHand.secondary===controller){
   // The second hand contributes only to scaling, not to the orbit velocity.
  }else{
   const picked=pickTargets(controller);
   hoverBodies.set(controller,new Set(picked.map(p=>p.body.mesh)));
  }
 }
 for(const b of bodies){
  const highlighted=[...hoverBodies.values()].some(set=>set?.has(b.mesh))||grabbedBody(b);
  b.mesh.material.emissive.setHex(highlighted?0x284866:0);
  b.mesh.material.emissiveIntensity=highlighted?.6:0;
 }
 updateDualScale();
 updateSelectionRing();
}
const controllerFactory=new XRControllerModelFactory();
for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);
 const coneMesh=new THREE.Mesh(new THREE.ConeGeometry(1,CONE_VISUAL_LENGTH,32,1,true),
  new THREE.MeshBasicMaterial({color:0x51c5ff,transparent:true,opacity:.19,depthWrite:false,depthTest:true,side:THREE.DoubleSide}));
 coneMesh.renderOrder=11;
 coneMesh.rotation.x=Math.PI/2;coneMesh.position.z=-CONE_VISUAL_LENGTH/2;
 controller.add(coneMesh);coneVisuals.push(coneMesh);
 const pointerBeam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xc3f0ff,transparent:true,opacity:.9,depthTest:false,depthWrite:false}));
 pointerBeam.renderOrder=40;
 controller.add(pointerBeam);
 controller.userData.beam=pointerBeam;
 coneAngles.set(controller,0);
 controller.addEventListener('connected',e=>{
  controllerInputs.set(controller,e.data);
  if(e.data.handedness==='right')rightController=controller;
  if(e.data.handedness==='left'){
   leftController=controller;
   controller.remove(pointerBeam);pointerBeam.geometry.dispose();pointerBeam.material.dispose();
   controller.userData.beam=null;coneMesh.visible=false;
  }
 });
 controller.addEventListener('disconnected',()=>{controllerInputs.delete(controller);releaseGrab(controller)});
 controller.addEventListener('selectstart',()=>{
  if(controller===leftController){action('play');return;}
  rayFromController(controller);
  const panelHit=raycaster.intersectObjects(menuFaces.map(f=>f.mesh).filter(p=>prism.visible&&p.visible),false).find(h=>h.distance<1);
  if(panelHit){
   const face=menuFaces.find(f=>f.mesh===panelHit.object);
   if(face){
    const px=panelHit.uv.x*FACE_CW,py=(1-panelHit.uv.y)*FACE_CH;
    const button=face.buttons.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);
    if(button)action(button.id);
   }
   return;
  }
  if(commitPastePlacement(controller))return;
  if(commitObjectPlacement(controller))return;
  const hits=pickTargets(controller);
  choosePlanets(hits.map(h=>h.body));
  $('status').textContent=hits.length+' nesne koniyle seçildi';
 });
 controller.addEventListener('squeezestart',()=>{
  heldGrips.add(controller);
  if(heldGrips.size>=2){beginDualScale();return;}
  if(controller===leftController){startLeftGripDrag();return;}
  rayFromController(controller);
  if(showVelocities&&!vectorDrag){
   const handles=bodies.filter(b=>b.velocityHandle.visible&&!grabbedBody(b));
   const direct=raycaster.intersectObjects(handles.map(b=>b.velocityHandle),false)[0];
   let hitHandle=direct;
   if(!hitHandle){
    let minAngle=THREE.MathUtils.degToRad(4);
    for(const body of handles){
     const d=body.velocityHandle.getWorldPosition(new THREE.Vector3()).sub(raycaster.ray.origin);
     const distance=d.length();
     if(distance<.01||raycaster.ray.direction.dot(d)<=0)continue;
     const angle=raycaster.ray.direction.angleTo(d);
     if(angle<minAngle){minAngle=angle;hitHandle={object:body.velocityHandle,distance}}
    }
   }
   if(hitHandle){
    const body=bodies.find(b=>b.velocityHandle===hitHandle.object);
    if(body&&!grabbedBody(body)){
     vectorDrag={controller,body,distance:hitHandle.distance};
     $('status').textContent='Hız vektörü düzenleniyor';return;
    }
   }
  }
  const hit=pickTargets(controller)[0];
  if(!hit)return;
  const body=hit.body;
  if(!body)return;
  if(!selectedBodies.has(body))choosePlanet(body);
  const members=[...selectedBodies].filter(b=>bodies.includes(b)).map(body=>({body}));
  const center=body.mesh.getWorldPosition(new THREE.Vector3());
  const point=raycaster.ray.at(hit.distance,new THREE.Vector3());
  grabs.set(controller,{body,members,distance:hit.distance,offset:center.sub(point),samples:[{p:body.pos.clone(),t:performance.now()/1000}]});
 });
 controller.addEventListener('squeezeend',()=>releaseGrab(controller));
 scene.add(controller);controllers.push(controller);
 const grip=renderer.xr.getControllerGrip(i);grip.add(controllerFactory.createControllerModel(grip));scene.add(grip);
}
renderer.xr.addEventListener('sessionstart',()=>{
 handMenuOpen=false;rightMenuOpen=false;heldGrips.clear();endTwoHand();
 initialView();snapReady=true;stickClickLast=false;
 $('status').textContent='VR v11.3 · X: tek menü · Çarpışmalar: 5 mod · Sağ tetik: seç/yerleştir';
});
renderer.xr.addEventListener('sessionend',()=>{
 dismount();vectorDrag=null;endTwoHand();heldGrips.clear();grabs.clear();hoverBodies.clear();magneticTargets.clear();handMenuOpen=false;rightMenuOpen=false;cancelPastePlacement();cancelObjectPlacement();
 initialView();snapReady=true;stickClickLast=false;
 $('status').textContent='VR kapalı · Masaüstü önizlemesi';
});
let lastMenuRedraw=-1;
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05);
 if(running){
  accumulator+=dt;let loops=0;
  while(accumulator>=DT&&loops<12){step();accumulator-=DT;loops++}
  if(loops>=12)accumulator=0;
 }
 updateNavigation(dt);
 updateLeftGripDrag();
 updateGrabsAndHover(dt);
 for(const b of bodies)drawBody(b);
 updateRidingView();
 updateVelocityHandleSizes(dt);
 if(handMenuOpen&&Math.floor(performance.now()/250)!==lastMenuRedraw){lastMenuRedraw=Math.floor(performance.now()/250);refreshPanel();}
 renderer.render(scene,camera);
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setup();syncButtons();refreshRightPanel();$('status').textContent='Hazır · Quest 3 tarayıcısında ENTER VR düğmesini kullan';
if(!navigator.xr)$('warning').textContent='Bu tarayıcıda WebXR görünmüyor. Quest 3 Browser ile aç.';
</script>
