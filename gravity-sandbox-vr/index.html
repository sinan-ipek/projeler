<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import {XRControllerModelFactory} from 'three/addons/webxr/XRControllerModelFactory.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090e19);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,20000);
camera.position.set(0,1.65,3.1);
camera.lookAt(0,1.45,-1.9);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
renderer.xr.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
scene.add(new THREE.HemisphereLight(0xb9dbff,0x243044,2.4));
const light=new THREE.DirectionalLight(0xffffff,1.3);light.position.set(-3,7,5);scene.add(light);
// Simülasyon birimi dünya içinde 4 santimetreye eşit. Başlangıçta gezegenler kullanıcı önünde durur.
const SCALE=.04;
const world=new THREE.Group();world.position.set(0,1.4,-2.25);world.scale.setScalar(SCALE);scene.add(world);
const originalWorldPosition=world.position.clone();
function alignGroundToXRFloor(){
 if(ridingBody)return;
 world.position.copy(originalWorldPosition);
 if(planetMode)world.position.y=-(-10)*SCALE;
}
let ridingBody=null;
let rideViewMode='macro';
const MICRO_SCALE_MULTIPLIER=1000;
let vectorDrag=null;
// In the micro observation mode, distant bodies render as colored sky points.
// Their original physical simulation coordinates, masses and colors stay intact.
const microSkyGeometry=new THREE.BufferGeometry();
const microSkyPositions=new Float32Array(600*3);
const microSkyColors=new Float32Array(600*3);
microSkyGeometry.setAttribute('position',new THREE.BufferAttribute(microSkyPositions,3).setUsage(THREE.DynamicDrawUsage));
microSkyGeometry.setAttribute('color',new THREE.BufferAttribute(microSkyColors,3).setUsage(THREE.DynamicDrawUsage));
microSkyGeometry.setDrawRange(0,0);
const microSky=new THREE.Points(microSkyGeometry,new THREE.PointsMaterial({
 size:2.4,sizeAttenuation:false,vertexColors:true,depthWrite:false
}));
microSky.frustumCulled=false;world.add(microSky);
function updateMicroSky(){
 if(!(ridingBody&&rideViewMode==='micro')){microSky.visible=false;return}
 microSky.visible=true;
 let count=0;
 for(const b of bodies){
  if(b===ridingBody||count>=600)continue;
  const relative=b.pos.clone().sub(ridingBody.pos);
  const dist=relative.length();
  if(dist<1e-6)continue;
  // Local visual horizon: show other planets above the representative surface.
  // This is an observational rendering, not a change in the simulated orbits.
  const groundDistance=Math.hypot(relative.x,relative.z);
  const k=count*3;
  microSkyPositions[k]=b.pos.x;
  microSkyPositions[k+1]=ridingBody.pos.y+Math.max(groundDistance*.28,3);
  microSkyPositions[k+2]=b.pos.z;
  const color=b.mesh.material.color;
  microSkyColors[k]=color.r;microSkyColors[k+1]=color.g;microSkyColors[k+2]=color.b;
  count++;
 }
 microSkyGeometry.setDrawRange(0,count);
 microSkyGeometry.attributes.position.needsUpdate=true;
 microSkyGeometry.attributes.color.needsUpdate=true;
}
const surface=new THREE.Mesh(new THREE.PlaneGeometry(120,120,1,1),
 new THREE.MeshStandardMaterial({color:0x54758e,roughness:1,side:THREE.DoubleSide}));
surface.rotation.x=-Math.PI/2;surface.visible=false;scene.add(surface);
function dismount(){
 ridingBody=null;surface.visible=false;microSky.visible=false;world.scale.setScalar(SCALE);world.position.copy(originalWorldPosition);alignGroundToXRFloor();
 floor.position.y=-10;grid.position.y=-9.98;
 floor.visible=planetMode;grid.visible=planetMode;
 for(const b of bodies)b.mesh.visible=true;
}
function mountSelected(){
 if(!selectedPlanet||!bodies.includes(selectedPlanet))return;
 ridingBody=selectedPlanet;
 for(const b of bodies)b.mesh.visible=true;
 grabs.clear();endTwoHand();vectorDrag=null;
 surface.material.color.copy(ridingBody.mesh.material.color);
 surface.visible=!planetMode&&rideViewMode==='micro';
}
function updateRidingView(){
 if(!ridingBody||!bodies.includes(ridingBody)){if(ridingBody)dismount();return}
 // The entire simulated universe translates with the ridden planet;
 // headset orientation stays under native WebXR head tracking.
 const xrEye=(renderer.xr.isPresenting?renderer.xr.getCamera():camera);
 const micro=rideViewMode==='micro';
 const scale=SCALE*(micro?MICRO_SCALE_MULTIPLIER:1);
 world.scale.setScalar(scale);
 const target=new THREE.Vector3(0,1.5,0);
 world.position.copy(target).sub(ridingBody.pos.clone().multiplyScalar(scale));
 const location=xrEye.getWorldPosition(new THREE.Vector3());
 surface.position.set(location.x,location.y-1.55,location.z);
 surface.scale.setScalar(micro?100:1);
 surface.visible=!planetMode&&micro;
 floor.visible=planetMode;grid.visible=planetMode;
 if(planetMode){
  const riderGround=ridingBody.pos.y-1.55/scale;
  floor.position.y=riderGround;
  grid.position.y=riderGround+.02/scale;
 }
 surface.material.color.copy(ridingBody.mesh.material.color);
 for(const b of bodies){
  b.mesh.visible=!micro&&b!==ridingBody;
  if(micro){b.trail.visible=false;b.arrow.visible=false;b.velocityHandle.visible=false}
 }
 updateMicroSky();
}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshBasicMaterial({color:0x16243a,side:THREE.DoubleSide}));
floor.rotation.x=-Math.PI/2;floor.position.y=-10;floor.visible=false;world.add(floor);
const grid=new THREE.GridHelper(2000,200,0x263c56,0x1a2a3f);grid.position.y=-9.98;grid.visible=false;world.add(grid);
const geometry=new THREE.SphereGeometry(1,20,14);
const G=5,SOFT=1.44,DT=1/120,G_PLANET=12,BOUNCE=.72;
const HISTORY=280;
const DENSITY_FACTOR=8; // All bodies share the same density: mass = factor * radius^3.
let bodies=[],running=true,planetMode=false,showTrails=true,showVelocities=false,accumulator=0;
function makeBody(radius,color,x,y,z,vx,vy,vz){
 const mass=DENSITY_FACTOR*radius**3;
 const mat=new THREE.MeshStandardMaterial({color,roughness:.72});
 const mesh=new THREE.Mesh(geometry,mat);mesh.scale.setScalar(radius);world.add(mesh);
 const lineGeo=new THREE.BufferGeometry();
 const coords=new Float32Array(HISTORY*3);
 lineGeo.setAttribute('position',new THREE.BufferAttribute(coords,3).setUsage(THREE.DynamicDrawUsage));lineGeo.setDrawRange(0,0);
 const trail=new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.78}));
 trail.frustumCulled=false;world.add(trail);
 const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,color, .25,.15);
 arrow.visible=false;world.add(arrow);
 const velocityHandle=new THREE.Mesh(new THREE.SphereGeometry(.65,12,8),new THREE.MeshBasicMaterial({color:0xffdd73,depthTest:false}));
 velocityHandle.visible=false;velocityHandle.renderOrder=65;world.add(velocityHandle);
 const b={radius,mass,mesh,trail,arrow,velocityHandle,coords,pos:new THREE.Vector3(x,y,z),v:new THREE.Vector3(vx,vy,vz),history:[],tick:0};
 bodies.push(b);drawBody(b);return b;
}
function drawBody(b){
 b.mesh.position.copy(b.pos);
 b.trail.visible=showTrails;
 const speed=b.v.length();
 b.arrow.visible=showVelocities&&speed>.00001;
 b.velocityHandle.visible=showVelocities&&selectedBodies.has(b)&&speed>.00001&&!ridingBody;
 if(b.arrow.visible){
  // The arrow uses the true instantaneous world-space velocity direction.
  // Its length uses a single common scale for all celestial bodies.
  const dir=b.v.clone().divideScalar(speed);
  const length=Math.max(.6,Math.min(32,speed*.48));
  b.arrow.position.copy(b.pos);
  b.arrow.setDirection(dir);
  b.arrow.setLength(length,Math.min(2.2,length*.24),Math.min(1.1,length*.13));
  b.velocityHandle.position.copy(b.pos).addScaledVector(dir,length);
 }
}
function updateTrail(b){
 b.history.push(b.pos.clone());
 if(b.history.length>HISTORY)b.history.shift();
 const attr=b.trail.geometry.attributes.position;
 for(let i=0;i<b.history.length;i++)attr.setXYZ(i,b.history[i].x,b.history[i].y,b.history[i].z);
 attr.needsUpdate=true;b.trail.geometry.setDrawRange(0,b.history.length);
}
function disposeBodyArrow(b){
 if(!b.arrow)return;
 world.remove(b.arrow);
 b.arrow.line.geometry.dispose();b.arrow.line.material.dispose();
 world.remove(b.velocityHandle);b.velocityHandle.geometry.dispose();b.velocityHandle.material.dispose();
 b.arrow.cone.geometry.dispose();b.arrow.cone.material.dispose();
}
function clearBodies(){
 for(const b of bodies){world.remove(b.mesh,b.trail);b.mesh.material.dispose();b.trail.geometry.dispose();b.trail.material.dispose();disposeBodyArrow(b)}
 bodies=[];
}
function setup(){
 clearBodies();accumulator=0;
 // Stable default system: all bodies have identical density.
 // Circular softened-gravity orbital speeds and generously separated orbits
 // keep the system stable over an extended unattended observation.
 const starRadius=7;
 const starMass=DENSITY_FACTOR*starRadius**3;
 const star=makeBody(starRadius,0xffc253,0,0,0,0,0,0);
 const orbits=[
  {distance:24,radius:.8,color:0x57a7ff,phase:.1},
  {distance:48,radius:1,color:0xf17b6d,phase:2.3},
  {distance:90,radius:1.2,color:0x71dab8,phase:4.4}
 ];
 for(const orbit of orbits){
  const {distance:r,radius,color,phase}=orbit;
  const mass=DENSITY_FACTOR*radius**3;
  const speed=Math.sqrt(G*(starMass+mass)*r*r/Math.pow(r*r+SOFT,1.5));
  makeBody(radius,color,r*Math.cos(phase),0,r*Math.sin(phase),
   -Math.sin(phase)*speed,0,Math.cos(phase)*speed);
 }
 // Put the central body into the system's reflex motion; preserve relative
 // circular velocities and avoid a large systemic center-of-mass drift.
 const recoil=new THREE.Vector3();
 for(let i=1;i<bodies.length;i++)recoil.addScaledVector(bodies[i].v,-bodies[i].mass/star.mass);
 star.v.copy(recoil);
 for(let i=1;i<bodies.length;i++)bodies[i].v.add(recoil);
 for(const body of bodies){body.history=[];updateTrail(body)}
}
function addVRPreset(id){
 dismount();vectorDrag=null;endTwoHand();grabs.clear();choosePlanets([]);
 accumulator=0;running=false;
 const countBefore=bodies.length;
 const center=new THREE.Vector3(130+countBefore*1.5,0,0);
 const add=(r,color,x,y,z,vx=0,vy=0,vz=0,mass=null)=>{
  const b=makeBody(r,color,x+center.x,y+center.y,z+center.z,vx,vy,vz);
  if(mass!==null)b.mass=mass;
  b.history=[];updateTrail(b);return b;
 };
 if(id==='solar'){
  if(countBefore===0)planetMode=false;
  const star=add(5,0xffc451,0,0,0);
  const radii=[.6,.7,.8,.7,1.5,1.4,1,1],dist=[14,20,27,35,47,63,80,100];
  for(let i=0;i<8;i++){
   const a=i*2.39996,d=dist[i],v=Math.sqrt(G*star.mass*d*d/Math.pow(d*d+SOFT,1.5));
   add(radii[i],[0xc9c2b4,0xedab55,0x58a7ff,0xdd8068,0xe6be83,0xd6bd94,0x7ad6e8,0x678ce3][i],
    Math.cos(a)*d,0,Math.sin(a)*d,-Math.sin(a)*v,0,Math.cos(a)*v);
  }
 }else if(id==='fireworks'){
  if(countBefore===0)planetMode=false;
  const count=48,golden=Math.PI*(3-Math.sqrt(5)),colors=[0xffd166,0xff6b6b,0x67d8ff,0x9d8bff,0x83edab,0xff9ce5];
  for(let i=0;i<count;i++){
   const y=1-2*(i+.5)/count,theta=i*golden,t=Math.sqrt(1-y*y);
   const dx=t*Math.cos(theta),dz=t*Math.sin(theta),v=12+2*((i*17)%count)/(count-1);
   add(.20,colors[i%6],dx*.7,y*.7,dz*.7,dx*v,y*v,dz*v,.015);
  }
 }else{
  if(countBefore===0)planetMode=true;
  const launches={
   horizontal:{y:35,vx:24,vy:0,color:0x52a1f4},
   angled:{y:-8,vx:22,vy:24,color:0x55be8a},
   vertical:{y:-8,vx:0,vy:29,color:0xe8a64a}
  };
  const l=launches[id];if(!l)return;
  add(1.4,l.color,-25,l.y,0,l.vx,l.vy,0);
 }
 for(const b of bodies.slice(countBefore)){b.history=[];updateTrail(b)}
 syncButtons();refreshRightPanel();
 $('status').textContent='Sistem eklendi: '+id+' · Var olan gezegenler korundu';
}
function accelerations(){
 if(planetMode)return bodies.map(()=>new THREE.Vector3(0,-G_PLANET,0));
 const acc=bodies.map(()=>new THREE.Vector3());
 for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
  const d=new THREE.Vector3().subVectors(bodies[j].pos,bodies[i].pos);
  const rr=d.lengthSq()+SOFT,k=G/(rr*Math.sqrt(rr));
  acc[i].addScaledVector(d,k*bodies[j].mass);
  acc[j].addScaledVector(d,-k*bodies[i].mass);
 }
 return acc;
}
function step(){
 let a=accelerations();
 for(let i=0;i<bodies.length;i++){
  const b=bodies[i];if(grabbedBody(b))continue;b.v.addScaledVector(a[i],DT/2);b.pos.addScaledVector(b.v,DT);
 }
 a=accelerations();
 for(let i=0;i<bodies.length;i++)if(!grabbedBody(bodies[i]))bodies[i].v.addScaledVector(a[i],DT/2);
 if(planetMode)for(const b of bodies){
  if(grabbedBody(b))continue;
  const ground=-10+b.radius;
  if(b.pos.y<ground){b.pos.y=ground;if(b.v.y<0){b.v.y=-b.v.y*BOUNCE;if(b.v.y<.4)b.v.y=0}}
 }
 for(const b of bodies)if(++b.tick%5===0)updateTrail(b);
}
function syncButtons(){
 $('play').textContent=running?'⏸ Duraklat':'▶ Başlat';
 $('mode').textContent=planetMode?'🌍 Gezegen':'🌌 Uzay';
 $('trails').textContent='Yörüngeler: '+(showTrails?'Açık':'Kapalı');
 floor.visible=planetMode;grid.visible=planetMode;
 if(!ridingBody)alignGroundToXRFloor();
 surface.visible=!!ridingBody&&!planetMode&&rideViewMode==='micro';
 scene.background.set(planetMode?0x283c56:0x090e19);
 if(labels.length)refreshPanel();
}
function action(name){
 if(name==='play')running=!running
 if(name==='reset'){dismount();vectorDrag=null;endTwoHand();grabs.clear();hoverBodies.clear();magneticTargets.clear();choosePlanets([]);setup();for(const ring of selectionRings.values())ring.visible=false}
 if(name==='mode'){planetMode=!planetMode;if(planetMode)for(const b of bodies){b.pos.y=Math.max(b.pos.y,-10+b.radius);b.history=[];updateTrail(b)}alignGroundToXRFloor()}
 if(name==='trails')showTrails=!showTrails;
 if(name==='velocities')showVelocities=!showVelocities;
 if(name==='near')bringNear();
 if(name==='new')createPlanet();
 if(name==='clearSelection')choosePlanets([]);
 if(name==='coneMinus'||name==='conePlus'){
  const c=rightController||controllers.find(c=>c!==leftController)||controllers[0];
  if(c){
   const increment=THREE.MathUtils.degToRad(3);
   const old=coneAngles.get(c)||0;
   const next=name==='conePlus'?Math.min(MAX_CONE,old+increment):Math.max(0,old-increment);
   coneAngles.set(c,next);
   $('status').textContent='Koni açısı: '+THREE.MathUtils.radToDeg(next).toFixed(0)+'° · Tetik: çoklu seçim';
  }
 }
 if(name.startsWith('preset:'))addVRPreset(name.slice(7));
 if(name==='grow')resizeSelected(1.2);
 if(name==='shrink')resizeSelected(1/1.2);
 if(name==='copy')copySelected();
 if(name==='delete')deleteSelected();
 if(name==='ride')mountSelected();
 if(name==='dismount')dismount();
 if(name==='rideView'){rideViewMode=rideViewMode==='micro'?'macro':'micro';}
 if(name==='micro')rideViewMode='micro';
 if(name==='macro')rideViewMode='macro';
 syncButtons();refreshRightPanel();
}
for(const id of ['play','reset','mode','trails'])$(id).onclick=()=>action(id);
// VR panel uses a shared canvas texture; buttons remain selectable via controller rays.
// Five inward-facing panels arranged around an open-front concave menu.
const FACE_CW=720,FACE_CH=505;
function createMenuFace(width,height){
 const canvas=document.createElement('canvas');canvas.width=FACE_CW;canvas.height=FACE_CH;
 const ctx=canvas.getContext('2d'),texture=new THREE.CanvasTexture(canvas);
 texture.colorSpace=THREE.SRGBColorSpace;
 const mesh=new THREE.Mesh(new THREE.PlaneGeometry(width,height),
  new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide,depthTest:false}));
 mesh.renderOrder=20;
 return {canvas,ctx,texture,mesh,buttons:[]};
}
const backFace=createMenuFace(.33,.265);
const leftFace=createMenuFace(.205,.265);
const rightFace=createMenuFace(.205,.265);
const ceilingFace=createMenuFace(.33,.14);
const bottomFace=createMenuFace(.33,.115);
const menuFaces=[backFace,leftFace,rightFace,ceilingFace,bottomFace];
const panel=backFace.mesh,rightPanel=rightFace.mesh,topPanel=bottomFace.mesh;
// Five interior faces of a rectangular box, with the front face open.
// Every adjacent pair of faces meets at exactly 90 degrees.
const prism=new THREE.Group(),BOX_WIDTH=.33,BOX_HEIGHT=.265,BOX_DEPTH=.205;
const halfW=BOX_WIDTH/2,halfH=BOX_HEIGHT/2,halfD=BOX_DEPTH/2;
panel.position.set(0,0,-halfD);
leftFace.mesh.geometry.dispose();leftFace.mesh.geometry=new THREE.PlaneGeometry(BOX_DEPTH,BOX_HEIGHT);
leftFace.mesh.rotation.y=Math.PI/2;leftFace.mesh.position.set(-halfW,0,0);
rightPanel.geometry.dispose();rightPanel.geometry=new THREE.PlaneGeometry(BOX_DEPTH,BOX_HEIGHT);
rightPanel.rotation.y=-Math.PI/2;rightPanel.position.set(halfW,0,0);
ceilingFace.mesh.geometry.dispose();ceilingFace.mesh.geometry=new THREE.PlaneGeometry(BOX_WIDTH,BOX_DEPTH);
ceilingFace.mesh.rotation.x=Math.PI/2;ceilingFace.mesh.position.set(0,halfH,0);
topPanel.geometry.dispose();topPanel.geometry=new THREE.PlaneGeometry(BOX_WIDTH,BOX_DEPTH);
topPanel.rotation.x=-Math.PI/2;topPanel.position.set(0,-halfH,0);
for(const face of menuFaces)prism.add(face.mesh);
scene.add(prism);
let handMenuOpen=false,rightMenuOpen=false;
let rightController=null,leftController=null;
const lastMenuPress=new Map();
function toggleHandMenu(){handMenuOpen=!handMenuOpen;updateHandMenu();$('status').textContent=handMenuOpen?'Menü açık':'Menü kapalı'}
const menuAnchorOffset=new THREE.Vector3(.13,.035,-.19);
const menuWristRotation=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/3);
const labels=['play','reset','mode','trails','velocities'];
const rightButtons=[['near','YAKINA GETIR'],['shrink','KUCULT'],['grow','BUYUT'],['copy','KOPYALA'],['delete','SIL']];
const topButtons=[['ride','BIN'],['dismount','IN'],['micro','MIKRO'],['macro','MAKRO']];
const presetButtons=[['new','YENI GEZEGEN'],['preset:solar','GUNES SISTEMI'],['preset:fireworks','HAVAİ FİŞEK'],['preset:horizontal','YATAY ATIS'],['preset:angled','EGIK ATIS'],['preset:vertical','DIKEY ATIS']];
const utilityButtons=[['coneMinus','KONI -'],['conePlus','KONI +'],['clearSelection','SECIMI KALDIR'],['trails','YORUNGELER'],['velocities','HIZ OKLARI'],['reset','SIFIRLA']];
function drawMenuFace(face,title,subtitle,buttons,highlight){
 const c=face.ctx;c.clearRect(0,0,FACE_CW,FACE_CH);
 c.fillStyle='#15253a';c.fillRect(0,0,FACE_CW,FACE_CH);
 c.fillStyle='#eaf5ff';c.font='bold 36px system-ui';c.fillText(title,26,57);
 if(subtitle){c.fillStyle='#a8d7ed';c.font='22px system-ui';c.fillText(subtitle,26,103)}
 face.buttons=[];
 const rows=Math.ceil(buttons.length/2),startY=subtitle?128:100;
 const gap=12,rowH=Math.min(94,(FACE_CH-startY-20-(rows-1)*gap)/rows);
 for(let i=0;i<buttons.length;i++){
  const [id,name]=buttons[i],x=20+(i%2)*349,y=startY+Math.floor(i/2)*(rowH+gap),w=330,h=rowH;
  c.fillStyle=highlight===id?'#268769':'#285a8d';
  c.beginPath();c.roundRect(x,y,w,h,13);c.fill();
  c.font='bold 25px system-ui';c.fillStyle='#fff';c.fillText(name,x+15,y+h/2+9);
  face.buttons.push({id,x,y,w,h});
 }
 face.texture.needsUpdate=true;
}
function refreshPanel(){
 drawMenuFace(backFace,'SIMULASYON','',
 [['play',$('play').textContent],['reset','SIFIRLA'],['mode',$('mode').textContent],['trails','YORUNGELER'],['velocities',showVelocities?'HIZLARI GIZLE':'HIZLARI GOSTER']],null);
}
function refreshRightPanel(){

const hoverBodies=new Map();

function ringFor(body){
 if(!selectionRings.has(body)){
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.35,1.50,64),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:1,depthTest:false,depthWrite:false}));

const controllerInputs=new Map();
const coneVisuals=[];
const CONE_VISUAL_LENGTH=12;

const MAX_RAY_LENGTH=1000;
const coneAngles=new Map(); // each controller has its own adjustable selection cone
const MAX_CONE=.261799;

const joystickButtons=new Map();
function updateSelectionRing(){
 for(const body of selectedBodies)ringFor(body);
 for(const [body,ring] of selectionRings){
  ring.visible=selectedBodies.has(body)&&bodies.includes(body);
  if(!ring.visible)continue;

// In ray mode, magnetic selection is enabled; a nonzero cone selects
// every sphere intersecting the cone (not only those with centers inside).
function pickTargets(controller){
 rayFromController(controller);
 const angle=coneAngles.get(controller)||0;
 const origin=raycaster.ray.origin,direction=raycaster.ray.direction;
 const exact=raycaster.intersectObjects(bodies.filter(b=>b.mesh.visible).map(b=>b.mesh),false)[0];
 if(angle>0.00001){
  const selected=[];
  for(const body of bodies){
   if(!body.mesh.visible)continue;
   const v=body.mesh.getWorldPosition(new THREE.Vector3()).sub(origin);
   const dist=v.length();
   if(dist<.00001)continue;
   const longitudinal=direction.dot(v);
   if(longitudinal<-body.radius*world.scale.x)continue;
   const error=Math.acos(THREE.MathUtils.clamp(longitudinal/dist,-1,1));
   const apparentRadius=Math.asin(Math.min(1,body.radius*world.scale.x/dist));
   if(error<=angle+apparentRadius&&longitudinal<=CONE_VISUAL_LENGTH+body.radius*world.scale.x)selected.push({body,distance:dist,angle:error});
  }
  selected.sort((x,y)=>x.angle-y.angle);
  magneticTargets.delete(controller);
  return selected;
 }
 if(exact){
  const body=bodies.find(b=>b.mesh===exact.object);
  magneticTargets.set(controller,body);
  return [{body,distance:exact.distance,angle:0}];
 }
 const magneticAngle=THREE.MathUtils.degToRad(2.2);
 let best=null,bestAngle=Infinity;
 for(const body of bodies){
  const offset=body.mesh.getWorldPosition(new THREE.Vector3()).sub(origin);
  const dist=offset.length();
  if(dist<.00001)continue;
  const alignment=direction.dot(offset)/dist;
  if(alignment<=0)continue;
  const error=Math.acos(THREE.MathUtils.clamp(alignment,-1,1));
  const radius=Math.asin(Math.min(1,body.radius*world.scale.x/dist));
  if(error<=magneticAngle+radius&&error<bestAngle){best={body,distance:dist,angle:error};bestAngle=error}
 }
 const previous=magneticTargets.get(controller);
 if(previous&&bodies.includes(previous)&&(!best||best.body!==previous)){
  const offset=previous.mesh.getWorldPosition(new THREE.Vector3()).sub(origin),dist=offset.length();
  if(dist>.00001){
   const error=Math.acos(THREE.MathUtils.clamp(direction.dot(offset)/dist,-1,1));
   if(error<magneticAngle+THREE.MathUtils.degToRad(1.2)+Math.asin(Math.min(1,previous.radius*world.scale.x/dist)))best={body:previous,distance:dist,angle:error};
  }
 }
 magneticTargets.set(controller,best?.body||null);
 return best?[best]:[];
}
function copySelected(){
 const originals=[...selectedBodies].filter(b=>bodies.includes(b));
 if(!originals.length)return;
 const shift=new THREE.Vector3(Math.max(2.5,...originals.map(b=>b.radius*2.5)),0,0);
 const copies=[];
 for(const b of originals){
  const p=b.pos.clone().add(shift);
  const clone=makeBody(b.radius,b.mesh.material.color.getHex(),p.x,p.y,p.z,b.v.x,b.v.y,b.v.z);
  updateTrail(clone);copies.push(clone);
 }

}
function deleteSelected(){

 if(!targets.length)return;
 if(twoHand&&targets.includes(twoHand.body))endTwoHand();
 for(const [controller,grab] of grabs)if(targets.includes(grab.body))grabs.delete(controller);
 for(const b of targets){
  world.remove(b.mesh,b.trail);b.mesh.material.dispose();b.trail.geometry.dispose();b.trail.material.dispose();disposeBodyArrow(b);
  const ring=selectionRings.get(b);
  if(ring){world.remove(ring);ring.geometry.dispose();ring.material.dispose();selectionRings.delete(b)}
  bodies.splice(bodies.indexOf(b),1);
 }
 for(const [controller,target] of magneticTargets)if(targets.includes(target))magneticTargets.delete(controller);

function createPlanet(){

function bringNear(){
 if(!selectedPlanet)return;
 const xrCamera=renderer.xr.isPresenting?renderer.xr.getCamera():camera;
 const eyePos=xrCamera.getWorldPosition(new THREE.Vector3());
 const eyeDirection=new THREE.Vector3(0,0,-1).applyQuaternion(xrCamera.getWorldQuaternion(new THREE.Quaternion()));
 const target=eyePos.addScaledVector(eyeDirection,1.35);
 world.worldToLocal(target);

 selectedPlanet.v.set(0,0,0);
 // If held, move the controller's attachment to the new position as well;
 // otherwise the next frame would snap the planet back to its old grip distance.
 for(const [controller,g] of grabs){
  if(g.body!==selectedPlanet)continue;
  const currentOrigin=new THREE.Vector3().setFromMatrixPosition(controller.matrixWorld);
  const direction=new THREE.Vector3(0,0,-1).applyQuaternion(new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().extractRotation(controller.matrixWorld)));
  const pointWorld=selectedPlanet.mesh.parent.localToWorld(selectedPlanet.pos.clone());
  const toPoint=pointWorld.sub(currentOrigin);

  g.offset.copy(toPoint.addScaledVector(direction,-g.distance));

 }

function rayFromController(controller){
 tempMatrix.identity().extractRotation(controller.matrixWorld);
 raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
 raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix).normalize();
}
// Estimate release velocity from the last 200 ms with linear regression.
// Only the release impulse is smoothed; held planets still track hands directly.
const THROW_WINDOW=.20,THROW_DEADZONE=.6,THROW_MAX=40;
function estimateThrowVelocity(samples){
 if(samples.length<3)return new THREE.Vector3();
 const end=samples[samples.length-1].t;
 const recent=samples.filter(s=>end-s.t<=THROW_WINDOW);
 if(recent.length<3)return new THREE.Vector3();
 const n=recent.length;
 let tMean=0;
 const pMean=new THREE.Vector3();
 for(const s of recent){tMean+=s.t;pMean.add(s.p)}
 tMean/=n;pMean.divideScalar(n);
 let denominator=0;
 const numerator=new THREE.Vector3();
 for(const s of recent){
  const d=s.t-tMean;
  denominator+=d*d;
  numerator.addScaledVector(s.p.clone().sub(pMean),d);
 }
 if(denominator<.000001)return new THREE.Vector3();
 const velocity=numerator.divideScalar(denominator);
 // Ignore extremely small involuntary release motions.
 if(velocity.length()<THROW_DEADZONE)return velocity.set(0,0,0);
 return velocity.clampLength(0,THROW_MAX);
}
function releaseGrab(controller){
 if(vectorDrag&&vectorDrag.controller===controller){vectorDrag=null;return;}
 if(twoHand&&twoHand.secondary===controller){
  endTwoHand();$('status').textContent='İki elle ölçeklendirme bitti';return;
 }
 if(twoHand&&twoHand.primary===controller){
  // Continue holding the planet with the remaining hand without a sudden jump.
  const other=twoHand.secondary,body=twoHand.body;
  endTwoHand();grabs.delete(controller);
  rayFromController(other);
  const center=body.mesh.getWorldPosition(new THREE.Vector3());
  const distance=Math.max(.12,center.distanceTo(raycaster.ray.origin));
  const point=raycaster.ray.at(distance,new THREE.Vector3());
  grabs.set(other,{body,distance,offset:center.sub(point),samples:[{p:body.pos.clone(),t:performance.now()/1000}]});
  return;
 }
 const g=grabs.get(controller);if(!g)return;
 g.body.v.copy(estimateThrowVelocity(g.samples));
 g.body.history=[];updateTrail(g.body);grabs.delete(controller);
}
function updateGrabsAndHover(dt){
 updateHandMenu();
 for(const controller of controllers){
  rayFromController(controller);
  const menuHit=raycaster.intersectObjects(menuFaces.map(f=>f.mesh).filter(p=>prism.visible&&p.visible),false).find(h=>h.distance<1);
  const beam=controller.userData.beam;
  if(beam){
   beam.visible=!(controller===leftController&&handMenuOpen);
   const endDistance=menuHit?Math.min(MAX_RAY_LENGTH,menuHit.distance):MAX_RAY_LENGTH;
   beam.scale.z=endDistance;
  }
  const pad=controllerInputs.get(controller)?.gamepad;
  const axes=pad?.axes||[];
  const sideAxis=axes.length>=4?(Math.abs(axes[2])>Math.abs(axes[0]||0)?axes[2]:axes[0]):axes.length>=2?axes[0]:0;
  if(!grabs.has(controller)&&Math.abs(sideAxis)>.18){
   const before=coneAngles.get(controller)||0;
   let next=THREE.MathUtils.clamp(before+sideAxis*dt*.6,0,MAX_CONE);
   if(next<THREE.MathUtils.degToRad(.35))next=0;
   else if(before===0)next=THREE.MathUtils.degToRad(2);
   coneAngles.set(controller,next);
  }
  // On Quest Touch left controllers the application menu is commonly button 4.
  // WebXR may reserve this button; in that case it will not be reported here.
  const menuPressed=(controller===leftController||controller===rightController)&&!!pad?.buttons?.[4]?.pressed;
  if(menuPressed&&!lastMenuPress.get(controller)){
   if(controller===leftController)toggleHandMenu();
   else{ /* One left-hand prism menu only. */ }
  }
  lastMenuPress.set(controller,menuPressed);
  const cone=coneVisuals[controllers.indexOf(controller)];
  if(cone){
   const thisAngle=coneAngles.get(controller)||0;
   cone.visible=!(controller===leftController&&handMenuOpen)&&!grabs.has(controller)&&thisAngle>0;
   const radius=Math.tan(thisAngle)*CONE_VISUAL_LENGTH;
   cone.scale.set(radius,1,radius);
  }
  const g=grabs.get(controller);
  if(vectorDrag&&vectorDrag.controller===controller){
   const hit=raycaster.ray.at(vectorDrag.distance,new THREE.Vector3());
   world.worldToLocal(hit);
   const velocity=hit.sub(vectorDrag.body.pos).divideScalar(.48);
   vectorDrag.body.v.copy(velocity.clampLength(0,40));
  }
  if(g){
   const axes=controllerInputs.get(controller)?.gamepad?.axes||[];
   const axisY=axes.length>=4?axes[3]:axes.length>=2?axes[1]:0;
   if(Math.abs(axisY)>.16)g.distance=Math.max(.12,Math.min(MAX_RAY_LENGTH,g.distance-axisY*JOYSTICK_SPEED*dt));
   const pos=raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction,g.distance).add(g.offset);
   world.worldToLocal(pos);
   g.body.pos.copy(pos);g.body.v.set(0,0,0);
   const now=performance.now()/1000;
   g.samples.push({p:pos.clone(),t:now});
   while(g.samples.length>3&&now-g.samples[0].t>THROW_WINDOW)g.samples.shift();
  }else if(twoHand&&twoHand.secondary===controller){
   // The second hand contributes only to scaling, not to the orbit velocity.
  }else{
   const picked=pickTargets(controller);
   hoverBodies.set(controller,new Set(picked.map(p=>p.body.mesh)));
  }
 }
 for(const b of bodies){
  const highlighted=[...hoverBodies.values()].some(set=>set?.has(b.mesh))||grabbedBody(b);
  b.mesh.material.emissive.setHex(highlighted?0x284866:0);
  b.mesh.material.emissiveIntensity=highlighted?.6:0;
 }
 if(twoHand){
  const distance=handPosition(twoHand.primary).distanceTo(handPosition(twoHand.secondary));
  const desired=THREE.MathUtils.clamp(twoHand.startRadius*distance/twoHand.startDistance,.2,12);
  const b=twoHand.body;
  if(Math.abs(b.radius-desired)>.001){
   b.radius=desired;b.mass=DENSITY_FACTOR*desired**3;b.mesh.scale.setScalar(desired);
   if(planetMode)b.pos.y=Math.max(b.pos.y,-10+desired);
  }
 }
 updateSelectionRing();
}
const controllerFactory=new XRControllerModelFactory();
for(let i=0;i<2;i++){
 const controller=renderer.xr.getController(i);
 const coneMesh=new THREE.Mesh(new THREE.ConeGeometry(1,CONE_VISUAL_LENGTH,32,1,true),
  new THREE.MeshBasicMaterial({color:0x51c5ff,transparent:true,opacity:.19,depthWrite:false,depthTest:true,side:THREE.DoubleSide}));
 coneMesh.renderOrder=11;
 coneMesh.rotation.x=Math.PI/2;coneMesh.position.z=-CONE_VISUAL_LENGTH/2;

 const pointerBeam=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xc3f0ff,transparent:true,opacity:.9,depthTest:false,depthWrite:false}));

  if(panelHit){

   if(face){

 controller.addEventListener('squeezestart',()=>{

    for(const body of handles){
     const d=body.velocityHandle.getWorldPosition(new THREE.Vector3()).sub(raycaster.ray.origin);
     const distance=d.length();

     if(angle<minAngle){minAngle=angle;hitHandle={object:body.velocityHandle,distance}}
    }
   }
   if(hitHandle){
    const body=bodies.find(b=>b.velocityHandle===hitHandle.object);
    if(body&&!grabbedBody(body)){
     vectorDrag={controller,body,distance:hitHandle.distance};
     $('status').textContent='Hız vektörü düzenleniyor';return;
    }
   }
  }
  const hit=pickTargets(controller)[0];
  if(!hit)return;
  const body=hit.body;
  if(!body)return;
  const existing=[...grabs.entries()].find(([,g])=>g.body===body);
  if(existing){
   if(twoHand||existing[0]===controller)return;
   const separation=handPosition(controller).distanceTo(handPosition(existing[0]));
   if(separation<.035)return;
   twoHand={body,primary:existing[0],secondary:controller,startDistance:separation,startRadius:body.radius};
   $('status').textContent='İki el: uzaklaştır büyüt · yaklaştır küçült';
   return;
  }
  if(!selectedBodies.has(body))choosePlanet(body);
  const center=body.mesh.getWorldPosition(new THREE.Vector3());
  const point=raycaster.ray.at(hit.distance,new THREE.Vector3());
  grabs.set(controller,{body,distance:hit.distance,offset:center.sub(point),samples:[{p:body.pos.clone(),t:performance.now()/1000}]});
 });
 controller.addEventListener('squeezeend',()=>releaseGrab(controller));
 scene.add(controller);controllers.push(controller);
 const grip=renderer.xr.getControllerGrip(i);grip.add(controllerFactory.createControllerModel(grip));scene.add(grip);
}

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
