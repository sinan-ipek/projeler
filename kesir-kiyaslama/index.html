<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kesir Kıyaslama Laboratuvarı · v1.6.0</title>
<style>
:root{--bg:#dedede;--ink:#293241;--green:#267a58;--brown:#98604c;--yellow:#f3b71b;--good:#159b71}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button{font:inherit}
header{padding:19px 76px;text-align:center;position:relative}h1{margin:0;font-size:clamp(19px,2.3vw,27px)}
.home{position:absolute;left:18px;top:15px;border:0;background:#ffd94c;width:48px;height:48px;border-radius:12px;box-shadow:0 4px 0 #c6a32c;cursor:pointer}.home svg{width:27px}
main{max-width:1060px;margin:10px auto 28px;background:#f8f8f7;border-radius:21px;min-height:590px;box-shadow:0 12px 36px #00000012;overflow:hidden}
.toolbar{padding:17px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #ddd;flex-wrap:wrap}.tab,.new,.kind{background:#e6e6e4;border:1px solid #c8c8c8;border-radius:11px;padding:11px 15px;cursor:pointer;font-size:14px}.tab.active,.kind.active{background:#293241;color:white;border-color:#293241}.new{margin-left:auto}
.kindbar{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0 0}.kind{padding:7px 16px}.hint{text-align:center;font-size:18px;min-height:50px;padding:15px 8px 0;color:#4b5260}
.stage{min-height:410px;position:relative;padding:20px 12px 40px}.equation{display:flex;align-items:center;justify-content:center;gap:clamp(12px,5vw,62px);width:100%;min-height:260px}.slot{width:clamp(122px,26vw,290px);min-height:250px;display:flex;justify-content:center;align-items:center;flex-direction:column;position:relative}
.operator{font-size:clamp(38px,5vw,62px);min-width:45px;text-align:center;color:#9499a2;font-weight:650;align-self:center}.operator.done{color:var(--good);font-size:clamp(52px,6.3vw,78px)}
.expr{font-size:clamp(31px,4.7vw,58px);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.09em;white-space:nowrap;line-height:1.12;font-variant-numeric:tabular-nums}
.frac{display:inline-flex;vertical-align:middle;align-items:center;flex-direction:column;justify-content:center;line-height:1.12;flex-shrink:0;min-width:1.1em}.frac .top,.frac .bottom{display:flex;align-items:center;justify-content:center;padding:.07em .13em;min-height:1.15em}.frac .bar{height:3px;width:100%;background:var(--ink);border-radius:4px}
.math-button{display:inline-flex;align-items:center;justify-content:center;border:3px solid transparent;border-radius:12px;padding:3px 7px;background:transparent;color:inherit;font:inherit;line-height:1.14;cursor:pointer}.math-button:hover,.math-button:focus-visible{background:#f9e5ae;border-color:var(--yellow);outline:0}.math-button:disabled{cursor:default}.frac-button{padding:5px}.frac-button .frac{font-size:inherit}
.top-result{height:84px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:650;font-size:clamp(31px,4.4vw,54px);color:var(--brown);white-space:nowrap}.top-result.empty{opacity:0}.top-result .math-button{color:var(--brown)}.top-result .calc{font-size:.59em;white-space:nowrap}.vanishing{display:inline-block;animation:vanish .38s ease-in forwards}@keyframes vanish{to{opacity:0;filter:blur(4px);transform:scale(.25)}}
.top-sign{position:absolute;left:50%;transform:translateX(-50%);top:0;font-size:clamp(34px,4vw,53px);font-weight:750;color:var(--good);pointer-events:none}
.upper-equation{min-height:55px;display:flex;justify-content:center;align-items:center;gap:16px;color:var(--brown);font-size:22px;font-weight:650}.compare-top{display:flex;align-items:center;justify-content:center;gap:12px}
.product{color:var(--ink)}.dot{font-size:.8em;margin:0 .05em}.good{color:var(--good)}
.explain{text-align:center;font-size:clamp(14px,1.8vw,19px);color:#5b626d;min-height:35px;margin-top:5px}.answers{display:flex;justify-content:center;gap:15px;margin-top:12px}.answer{font-size:36px;min-width:75px;height:64px;border:2px solid #b9bcc4;border-radius:13px;background:white;cursor:pointer}.answer:hover,.answer:focus-visible{background:#f9e5ae;border-color:var(--yellow);outline:none}.answer.wrong{animation:no .4s ease-in-out}.answer.correct{color:var(--good);border-color:var(--good)}@keyframes no{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#fireworks{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1500}#arrow-layer{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:900;overflow:visible}
.flying-sign{position:fixed;z-index:1000;font-size:58px;font-weight:750;color:var(--good);pointer-events:none;line-height:1}
.hidden{display:none!important}.note{font-size:14px;color:#777;text-align:center;padding:12px;border-top:1px solid #e7e7e7}
@media(max-width:600px){main{margin:0 7px}.toolbar{gap:6px;padding:12px}.tab,.new{font-size:12px;padding:9px 7px}.equation{gap:7px}.slot{width:40vw}.expr{font-size:clamp(26px,7vw,43px)}.operator{min-width:20px;font-size:35px}.operator.done{font-size:49px}.stage{padding:15px 3px}.math-button{border-width:2px;border-radius:8px;padding:2px 3px}.top-result{font-size:clamp(27px,7vw,42px)}.top-result .calc{font-size:.53em}.answer{min-width:65px}}

.mixed-type{min-height:45px;display:flex;align-items:center;justify-content:center}
.type-tag{background:#f9e5ae;border:2px solid #e7b52b;border-radius:13px;padding:6px 13px;font-size:clamp(13px,1.6vw,18px);font-weight:650;color:#34383d;white-space:nowrap}
.mixed-frac{display:flex;flex-direction:column;gap:14px;align-items:center}
.mixed-middle{display:flex;justify-content:center;align-items:center;gap:6px;white-space:nowrap}
.mixed-middle .math-button{font-size:inherit}
.mixed-sign{display:inline-block;font-weight:750;color:var(--good);line-height:1;min-width:.55em;text-align:center}
.mixed-one{display:inline-block;font-size:.92em;line-height:1}
.mixed-middle.final .mixed-one{display:none}
.mixed-middle.final .mixed-sign:last-child{display:none}
.mixed-middle.final .mixed-sign:first-child{font-size:1.13em}
.mixed-one.fading{animation:one-out .52s ease-in-out forwards}
@keyframes one-out{to{opacity:0;transform:translateY(-6px)}}
@media(max-width:600px){.type-tag{font-size:12px;padding:5px 7px}.mixed-middle{gap:1px}.mixed-middle .math-button{padding:2px}}

/* Çapraz çarpımla kıyaslama */
.cross-term{display:inline-flex;align-items:center;justify-content:center;border:3px solid transparent;border-radius:12px;padding:2px 7px;min-width:1.1em;line-height:1.14}
.cross-term.cross-ready{cursor:pointer}
.cross-term.cross-glow{background:#f9e5ae;border-color:var(--yellow)}
.cross-result{min-height:84px;display:flex;justify-content:center;align-items:center;color:var(--brown);font-size:clamp(32px,4.5vw,54px);font-weight:650;font-variant-numeric:tabular-nums}
@media(max-width:600px){.cross-term{padding:2px 3px;border-width:2px;border-radius:8px}.cross-result{font-size:clamp(27px,7vw,42px)}}
/* Ondalık kıyaslama: bölme ve sonucunu ayrı tıklamalarla keşfet. */
.decimal-side{display:flex;flex-direction:column;align-items:center;gap:10px}
.decimal-top{min-height:88px;display:flex;align-items:center;justify-content:center;font-size:clamp(23px,3.5vw,39px);font-weight:650;color:var(--brown);white-space:nowrap}
.decimal-top .math-button{font-size:inherit;color:var(--brown)}
.decimal-top .division{font-size:clamp(22px,3vw,35px)}
.decimal-number{font-variant-numeric:tabular-nums;white-space:nowrap;animation:decimal-appear .48s ease-out both}
.decimal-repeat{text-decoration:overline;text-decoration-thickness:2px;text-decoration-color:var(--green);text-decoration-skip-ink:none}
.decimal-approx{font-size:.66em;color:#737982}
@keyframes decimal-appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.decimal-top{font-size:clamp(17px,5vw,27px)}.decimal-top .division{font-size:clamp(17px,5vw,27px)}.decimal-side{gap:7px}}
.version{font-size:12px;color:#777;text-align:center;padding:0 10px 13px}
</style>
</head>
<body>
<header><button class="home" id="home" aria-label="Ana sayfa" title="Ana sayfa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6 2 11.2l1.4 1.7L5 11.6V21h5.1v-6.2h3.8V21H19v-9.4l1.6 1.3 1.4-1.7L12 2.6Z"/></svg></button><h1>Kesir Kıyaslama Laboratuvarı</h1></header>
<main>
<nav class="toolbar"><button class="tab" data-mode="denom">Payda eşitleyerek kıyaslama</button><button class="tab" data-mode="difference">Farklarla kıyaslama</button><button class="tab" data-mode="mixed">Basit ve bileşik kesir</button><button class="tab" data-mode="cross">Çapraz çarpımla kıyaslama</button><button class="tab" data-mode="decimal">Ondalık sayıya çevirerek kıyaslama</button><button class="new" id="new">Yeni örnek ↻</button></nav>

<div class="hint" id="hint" aria-live="polite"></div>
<section class="stage"><div class="equation" id="equation"><div class="slot" id="left"></div><div class="operator" id="operator">?</div><div class="slot" id="right"></div></div><div class="explain" id="explain"></div><div class="answers hidden" id="answers"><button class="answer" data-answer="<">&lt;</button><button class="answer cross-equal hidden" data-answer="=">=</button><button class="answer" data-answer=">">&gt;</button></div></section>
<div class="note">Vurgulanan ifadelerin üzerine tıklayarak ilerle.</div><div class="version">v1.6.0</div>
</main>
<svg id="arrow-layer" aria-hidden="true"></svg>
<canvas id="fireworks" aria-hidden="true"></canvas>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),L=$('left'),R=$('right'),O=$('operator'),H=$('hint'),E=$('explain'),A=$('answers'),arrowLayer=$('arrow-layer');
// Doğru cevapta kısa, renkli havai fişek patlaması.
const fwCanvas=$('fireworks'),fw=fwCanvas.getContext('2d');
let fwFrame=0,fwParticles=[],fwGeneration=0;
function fireworkBurst(){
  if(!fw)return;
  cancelAnimationFrame(fwFrame);
  const generation=++fwGeneration;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  fwCanvas.width=Math.round(innerWidth*dpr);
  fwCanvas.height=Math.round(innerHeight*dpr);
  fw.setTransform(dpr,0,0,dpr,0,0);
  fwParticles=[];
  const bounds=$('equation').getBoundingClientRect();
  const cx=bounds.left+bounds.width/2,cy=bounds.top+bounds.height/2;
  const palette=['#ffbe2e','#f46a54','#46b7ea','#4bc67d','#b787e5','#fa7fb3'];
  for(const center of [[cx-105,cy-75],[cx+105,cy-85],[cx,cy-125]]){
    for(let i=0;i<36;i++){
      const angle=Math.PI*2*i/36+(Math.random()-.5)*.12;
      const speed=1.9+Math.random()*3.9;
      fwParticles.push({x:center[0],y:center[1],vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,radius:1.8+Math.random()*1.9,color:palette[i%palette.length]});
    }
  }
  let previous=performance.now();
  function frame(now){
    if(generation!==fwGeneration)return;
    let dt=Math.min((now-previous)/16.667,2.2);previous=now;
    fw.clearRect(0,0,innerWidth,innerHeight);
    for(const p of fwParticles){
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vy+=.075*dt;
      p.vx*=Math.pow(.985,dt);
      p.life-=.018*dt;
      if(p.life<=0)continue;
      fw.globalAlpha=Math.max(0,p.life);
      fw.fillStyle=p.color;
      fw.beginPath();fw.arc(p.x,p.y,p.radius,0,Math.PI*2);fw.fill();
    }
    fw.globalAlpha=1;
    if(fwParticles.some(p=>p.life>0))fwFrame=requestAnimationFrame(frame);
    else fw.clearRect(0,0,innerWidth,innerHeight);
  }
  fwFrame=requestAnimationFrame(frame);
}

const gcd=(a,b)=>b?gcd(b,a%b):a;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sign=(a,b)=>a<b?'<':a>b?'>':'=';
const frac=(n,d)=>`<span class="frac"><span class="top">${n}</span><span class="bar"></span><span class="bottom">${d}</span></span>`;
const btn=(html,action,side,cls='')=>`<button class="math-button ${cls}" data-action="${action}" data-side="${side}" aria-label="İşlemi yap">${html}</button>`;
let mode='denom',q=null,steps=[0,0],products=[null,null],denSolved=new Set(),phase='initial',locked=false,stamp=0;
let exampleKind='improper',kindRemaining=0;
let crossDone=[false,false],crossHover=null;
function nextExampleKind(){
 // Sorular 2-4 soruluk bloklar halinde basit / bileşik olarak değişir.
 if(kindRemaining<=0){
   exampleKind=exampleKind==='simple'?'improper':'simple';
   kindRemaining=rnd(2,4);
 }
 kindRemaining--;
 return exampleKind;
}
function generate(){
 stamp++;
 arrowLayer.replaceChildren();
 let a,b,c,d,t=0;
 if(mode==='decimal'){
   // Bölme görünür ve öğretici kalsın; sonlu ve devirli ondalıklar birlikte gelir.
   // Bazen eşit değerli farklı kesirler oluşturulur.
   if(Math.random()<.18){
     const bases=[[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[1,6],[5,6]];
     const [n,den]=bases[rnd(0,bases.length-1)];
     let m1=rnd(1,3),m2=rnd(1,3);if(m1===m2)m2=m2%3+1;
     a=n*m1;b=den*m1;c=n*m2;d=den*m2;
   }else{
     do{b=rnd(2,12);d=rnd(2,12);a=rnd(1,14);c=rnd(1,14);t++;}
     while((a*d===b*c||a===c&&b===d)&&t<200);
   }
 }else if(mode==='cross'){
   // Soruların %60'ı özel: %15 eşit, %45 yakın (çarpım farkı 1, 2 veya 3).
   // Kalan %40'ında fark 3'ten büyük; tüm örnekler yine rastgele seçilir.
   const probability=Math.random();
   const difficulty=probability<.15?'equal':probability<.60?'close':'normal';
   // Önceden belirlenmiş soru listesi yok; sayıları her defasında yeniden üret.
   // Reddetme yöntemi, seçilen zorluk koşulunu kesin olarak sağlar.
   let valid=false;
   for(t=0;t<20000;t++){
     b=rnd(2,10);d=rnd(2,10);a=rnd(1,14);c=rnd(1,14);
     const gap=Math.abs(a*d-b*c);
     const same=(a===c && b===d);
     if(same)continue;
     if(difficulty==='equal'?gap===0:difficulty==='close'?gap>=1&&gap<=3:gap>3){valid=true;break;}
   }
   if(!valid){a=2;b=3;c=4;d=6;}
 }else if(mode==='mixed'){
   // Her soruda biri basit, diğeri payı paydasından büyük bileşik kesir.
   b=rnd(3,10); d=rnd(2,9);
   a=rnd(1,b-1); c=rnd(d+1,d+7);
   if(rnd(0,1)){[a,c]=[c,a];[b,d]=[d,b];}
 }else if(mode==='difference'){
   // Mutlak farklar eşittir; iki işaret (+/-) birbirinden bağımsızdır.
   // Böylece yalnızca işaretle çapraz payda çarpılması matematiksel olarak geçerlidir.
   const magnitude=rnd(1,3);
   const type=nextExampleKind();
   const orientation=type==='simple'?-1:1;
   do{
     b=rnd(magnitude+2,12);
     d=rnd(magnitude+2,12);
     a=b+orientation*magnitude;
     c=d+orientation*magnitude;
     t++;
   }while((b===d || a*d===c*b) && t<250);
 }else{
   do{b=rnd(3,10);d=rnd(3,10);a=rnd(1,b-1);c=rnd(1,d-1);t++}
   while((b===d||b*d/gcd(b,d)>72||a*d===b*c)&&t<250);
 }
 const common=b*d/gcd(b,d);
 q={a,b,c,d,common,x:common/b,y:common/d,answer:sign(a*d,c*b),deltaLeft:a-b,deltaRight:c-d};
 steps=[0,0];products=[null,null];crossDone=[false,false];crossHover=null;denSolved.clear();phase='initial';locked=false;
 document.querySelectorAll('.answer').forEach(el=>el.classList.remove('wrong','correct'));
 render();
}
function denSide(i){
 const n=i===0?q.a:q.c,d=i===0?q.b:q.d,m=i===0?q.x:q.y,s=i===0?'L':'R';
 if(phase==='initial')return `<span class="expr">${frac(n,btn(d,'den',s))}</span>`;
 if(phase==='factors')return `<span class="expr">${frac(n,d)}</span>${btn('('+m+')','factor',s,'good')}`;
 if(phase==='multiplications'||phase==='answer'||phase==='complete'){
   if(phase==='complete')return `<span class="expr">${frac(n,d)}</span>`;
   const part=(v,key)=>denSolved.has(key)?String(v*m):btn(v+'<span class="dot">·</span>'+m,'product',key,'product');
   return `<span class="expr">${frac(part(n,s+'n'),part(d,s+'d'))}</span>`;
 }
 return '';
}
function mixedSide(i){
 const n=i===0?q.a:q.c,d=i===0?q.b:q.d,s=i===0?'L':'R';
 const kind=n<d?'Basit kesir':'Bileşik kesir';
 const label=steps[i]?`<div class="mixed-type"><span class="type-tag">${kind}</span></div>`:'<div class="mixed-type"></div>';
 const body=steps[i]?frac(n,d):btn(frac(n,d),'classify',s,'frac-button');
 return `<div class="mixed-frac">${label}<span class="expr">${body}</span></div>`;
}
function mixedOperator(){
 if(phase==='initial')return steps.every(x=>x===1)?btn('?','middle-question','M'): '?';
 const symbol=q.a/q.b<q.c/q.d?'<':'>';
 const escaped=symbol==='<'?'&lt;':'&gt;';
 if(phase==='bridge'||phase==='selection')return '<span class="mixed-one">1</span>';
 if(phase==='complete'||phase==='merged'){
   return `<span class="mixed-middle ${phase==='merged'?'final':''}" id="mixed-middle">
      <span class="mixed-sign" id="bridge-left">${escaped}</span>
      ${phase==='merged'?'<span class="mixed-one" style="display:none">1</span>':btn('1','one','M','mixed-one')}
      <span class="mixed-sign" id="bridge-right">${escaped}</span>
    </span>`;
 }
 return '1';
}
function crossTerm(value, side, part){
 const key=side+'-'+part;
 const group=(side==='L'&&part==='num')||(side==='R'&&part==='den')?'ad':'bc';
 const ready=!crossDone[group==='ad'?0:1]&&!locked;
 const glow=crossHover===group&&ready;
 return `<span class="cross-term ${ready?'cross-ready':''} ${glow?'cross-glow':''}" data-cross="${group}" data-cross-point="${key}" tabindex="${ready?0:-1}" role="button" aria-label="Çapraz çarpımı göster">${value}</span>`;
}
function crossSide(i){
 const isLeft=i===0,s=isLeft?'L':'R';
 const num=isLeft?q.a:q.c,den=isLeft?q.b:q.d;
 const result=crossDone[i]?`<div class="cross-result">${isLeft?q.a*q.d:q.b*q.c}</div>`:'<div class="cross-result"></div>';
 return `${result}<span class="expr">${frac(crossTerm(num,s,'num'),crossTerm(den,s,'den'))}</span>`;
}
// Kesirden ondalığa TAM dönüşüm: kalanlar tekrar ettiğinde devirli bölüm bulunur.
// Böylece 1/3 => 0,(3) ve 1/6 => 0,1(6); yuvarlama ile yanlış eşitlik oluşmaz.
function exactDecimal(n,d){
 let whole=Math.floor(n/d),rem=n%d;
 if(!rem)return {html:String(whole),spoken:String(whole)};
 const seen=new Map(),digits=[];
 while(rem!==0&&!seen.has(rem)&&digits.length<48){
   seen.set(rem,digits.length);rem*=10;
   digits.push(String(Math.floor(rem/d)));rem%=d;
 }
 if(rem===0)return {html:whole+','+digits.join(''),spoken:whole+','+digits.join('')};
 const pos=seen.get(rem);
 if(pos===undefined)return {html:whole+','+digits.slice(0,8).join('')+'…',spoken:'Yaklaşık '+whole+','+digits.slice(0,8).join('')};
 const prefix=digits.slice(0,pos).join(''),cycle=digits.slice(pos).join('');
 return {html:whole+','+prefix+'<span class="decimal-repeat">'+cycle+'</span>',spoken:whole+','+prefix+' devirli '+cycle};
}
function decimalSide(i){
 const n=i===0?q.a:q.c,d=i===0?q.b:q.d,side=i===0?'L':'R',st=steps[i];
 const decimal=exactDecimal(n,d);
 const top=st===0?'<div class="decimal-top"></div>':st===1?
 `<div class="decimal-top">${btn(n+' : '+d+' = ?','decimal-calc',side,'division')}</div>`:
 `<div class="decimal-top"><span class="decimal-number" aria-label="${decimal.spoken}">${decimal.html}</span></div>`;
 const fraction=st===0?btn(frac(n,d),'decimal-start',side,'frac-button'):frac(n,d);
 return `<div class="decimal-side">${top}<span class="expr">${fraction}</span></div>`;
}
function differenceSide(i){
 const n=i===0?q.a:q.c,d=i===0?q.b:q.d,s=i===0?'L':'R',st=steps[i];
 const delta=n-d,otherDen=i===0?q.d:q.b;
 const signText=delta<0?'−':'+';
 let upper='<div class="top-result empty">0</div>';
 if(st===1)upper=`<div class="top-result">${btn(`(${n}−${d})`,'subtract',s)}</div>`;
 if(st===2)upper=`<div class="top-result">${btn((delta>0?'+':'−')+Math.abs(delta),'strip',s)}</div>`;
 if(st===3)upper=`<div class="top-result">${btn(signText+'1','cross',s)}</div>`;
 if(st===4)upper=`<div class="top-result">${products[i]}</div>`;
 const top=`<span data-point="${s}-num">${n}</span>`;
 const den=`<span data-point="${s}-den">${d}</span>`;
 const bottom=st===0?btn(frac(top,den),'difference',s,'frac-button'):frac(top,den);
 return `${upper}<span class="expr">${bottom}</span>`;
}

// Yollar, animasyon başlamadan önce gerçek DOM koordinatlarından hesaplanır.
// İlk çıkarma adımında ok kullanılmaz.
// İşaretin çapraz payda ile çarpılması: düz ok.
// Ok ucu önden gider, kuyruk aynı yolu gecikerek izler ve hedefte toplanır.
function pointFor(element){
 const r=element.getBoundingClientRect();
 return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function arrowGeometry(source,target,type){
 const start=pointFor(source),end=pointFor(target);
 let dx=end.x-start.x,dy=end.y-start.y;
 if(type==='line')return {start,end,at:t=>({x:start.x+dx*t,y:start.y+dy*t})};
 // Gerçek çember yayı: merkez, yarıçap ve açılar uç noktalarından hesaplanır.
 const chord=Math.hypot(dx,dy)||1;
 // Okun yayını sayılardan uzaklaştır: uç noktaları da dışa kaydır.
 const normalX=-dy/chord,normalY=dx/chord;
 const preferred=Math.abs(dx)>Math.abs(dy)*.65 ? -1 : ((start.x+end.x)/2<innerWidth/2?1:-1);
 const clearance=22;
 start.x+=preferred*normalX*clearance;
 start.y+=preferred*normalY*clearance;
 end.x+=preferred*normalX*clearance;
 end.y+=preferred*normalY*clearance;
 dx=end.x-start.x;dy=end.y-start.y;
 const sagitta=Math.min(168,Math.max(68,chord*.46));
 const radius=chord*chord/(8*sagitta)+sagitta/2;
 const half=chord/2;
 const centerOffset=Math.sqrt(Math.max(0,radius*radius-half*half));
 const mx=(start.x+end.x)/2,my=(start.y+end.y)/2;
 const nx=-dy/chord,ny=dx/chord;
 // Yayı görsel olarak yukarıya / dışarıya yönlendir.
 const center={x:mx-preferred*nx*centerOffset,y:my-preferred*ny*centerOffset};
 const a0=Math.atan2(start.y-center.y,start.x-center.x);
 const a1=Math.atan2(end.y-center.y,end.x-center.x);
 let sweep=a1-a0;
 while(sweep>Math.PI)sweep-=2*Math.PI;
 while(sweep< -Math.PI)sweep+=2*Math.PI;
 const at=t=>({x:center.x+radius*Math.cos(a0+sweep*t),
               y:center.y+radius*Math.sin(a0+sweep*t)});
 return {start,end,center,radius,a0,sweep,at};
}
const smoothStep=t=>t*t*(3-2*t);
function travelArrow(source,target,color,runStamp,type='arc'){
 if(!source||!target)return Promise.resolve();
 const geom=arrowGeometry(source,target,type),at=geom.at;
 const NS='http://www.w3.org/2000/svg';
 const g=document.createElementNS(NS,'g');
 const tail=document.createElementNS(NS,'path');
 tail.setAttribute('fill','none');tail.setAttribute('stroke',color);
 tail.setAttribute('stroke-width','4.5');tail.setAttribute('stroke-linecap','round');
 tail.setAttribute('stroke-linejoin','round');
 const head=document.createElementNS(NS,'path');
 head.setAttribute('fill','none');head.setAttribute('stroke',color);
 head.setAttribute('stroke-width','4.5');head.setAttribute('stroke-linecap','round');
 g.append(tail,head);arrowLayer.appendChild(g);
 const duration=type==='line'?690:1050;
 return new Promise(resolve=>{
  let started=null;
  const frame=now=>{
   if(started===null)started=now;
   if(runStamp!==stamp){g.remove();resolve();return}
   const u=Math.min(1,(now-started)/duration);
   // TEK animasyon: yavaş / kısa -> hızlı / uzun -> yavaş / kısa.
   const tipT=smoothStep(u);
   const trailLength=.025+.29*Math.sin(Math.PI*u);
   const backT=Math.max(0,tipT-trailLength);
   const tip=at(tipT),back=at(backT);
   let path=`M ${back.x} ${back.y}`;
   for(let i=1;i<=18;i++){
     const t=backT+(tipT-backT)*i/18,p=at(t);
     path+=` L ${p.x} ${p.y}`;
   }
   tail.setAttribute('d',path);
   // Uçtaki teğet yönü; yol düz ya da eğri olsa da aynı hesap.
   const before=at(Math.max(0,tipT-.008));
   const angle=Math.atan2(tip.y-before.y,tip.x-before.x);
   const len=13,spread=.56;
   const x1=tip.x-len*Math.cos(angle-spread),y1=tip.y-len*Math.sin(angle-spread);
   const x2=tip.x-len*Math.cos(angle+spread),y2=tip.y-len*Math.sin(angle+spread);
   head.setAttribute('d',`M ${x1} ${y1} L ${tip.x} ${tip.y} L ${x2} ${y2}`);
   g.setAttribute('opacity',u>.86?Math.max(0,(1-u)/.14):1);
   if(u<1)requestAnimationFrame(frame);else{g.remove();resolve()}
  };
  requestAnimationFrame(frame);
 });
}
// Karşılaştırma işareti daima gerçek kesir çizgisinin merkezine hizalanır.
// Hesap CSS'te sabit bir top kullanmaz, çizgilerin mevcut koordinatlarını okur.
function alignedOperatorPosition(){
 const bars=[L.querySelector('.frac .bar'),R.querySelector('.frac .bar')].filter(Boolean);
 if(!bars.length)return null;
 const ys=bars.map(bar=>{const r=bar.getBoundingClientRect();return r.top+r.height/2});
 return ys.reduce((sum,y)=>sum+y,0)/ys.length;
}
function alignOperator(){
 const centerY=alignedOperatorPosition();
 if(centerY===null)return;
 O.style.transform='none';
 const r=O.getBoundingClientRect();
 O.style.transform=`translateY(${centerY-(r.top+r.height/2)}px)`;
}
function readyToCompare(){return mode==='decimal'?steps.every(v=>v===2):mode==='cross'?crossDone.every(Boolean):mode==='difference'?steps.every(v=>v>=4):mode==='mixed'?phase==='selection':phase==='answer'}
function render(){
 document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.mode===mode));
 L.innerHTML=mode==='decimal'?decimalSide(0):mode==='cross'?crossSide(0):mode==='difference'?differenceSide(0):mode==='mixed'?mixedSide(0):denSide(0);
 R.innerHTML=mode==='decimal'?decimalSide(1):mode==='cross'?crossSide(1):mode==='difference'?differenceSide(1):mode==='mixed'?mixedSide(1):denSide(1);
 if(mode==='mixed')O.innerHTML=mixedOperator();
 else O.textContent=phase==='complete'?q.answer:'?';
 O.classList.toggle('done',phase==='complete');
 if(mode==='decimal'){
   H.textContent=phase==='complete'?'Bravo!':steps.every(v=>v===2)?'Ondalık sayıları karşılaştır; işareti seç.':steps.includes(1)?'Bölme işlemine tıkla; ondalık sonucu gör.':'Kesirlerden birine tıkla; bölme işlemini göster.';
   E.textContent=steps.some(v=>v===2)?'Üst çizgi, tekrar eden (devirli) basamakları gösterir.':'';
 }else if(mode==='cross'){
   H.textContent=phase==='complete'?'Bravo!':crossDone.every(Boolean)?'Çarpımları karşılaştır, doğru işareti seç.':'Paylardan birinin üzerine gel; çaprazdaki paydayı da gör.';
   E.textContent='';
 }else if(mode==='mixed'){
   const types=steps[0]+steps[1];
   E.textContent=phase==='initial'?'':phase==='bridge'?'Basit kesirler 1’den küçüktür, bileşik kesirler 1’den büyüktür.':
      'Basit kesirler 1’den küçüktür, bileşik kesirler 1’den büyüktür.';
   H.textContent=phase==='merged'?'Bravo!':phase==='complete'?'1’e tıkla; iki işaret birleşsin.':phase==='selection'?'Doğru işareti seç.':
     phase==='bridge'?'Ortadaki 1’i kullanarak kesirleri karşılaştır.':
     types===2?'Soru işaretine tıkla.':'Kesirlere ayrı ayrı tıkla; türlerini belirle.';
 }else if(mode==='difference'){
   const expressions=steps.filter(n=>n>=1).length;
   const differences=steps.filter(n=>n>=2).length;
   const signs=steps.filter(n=>n>=3).length;
   const crossed=steps.filter(n=>n>=4).length;
   H.textContent=phase==='complete'?'Doğru!':crossed===2?'Karşılaştırma işaretini seç.':
     signs===2?'İşaretlere tıkla; karşı payda ile çarp.':
     differences===2?'Farklara tıkla; ortak büyüklükleri kaldır.':
     expressions===2?'Üstteki çıkarma işlemlerine tıkla.':
     'Kesirlere ayrı ayrı tıkla; pay − payda işlemini göster.';
   E.textContent=differences===2?'Farkların mutlak değerleri aynı. İşaretlere ve karşı paydalara bak.':'';
 }else{
   E.textContent='';
   H.textContent={initial:'Paydalardan birine tıkla.',factors:'Genişletme katsayılarından birine tıkla.',multiplications:'Çarpımları tek tek hesapla.',answer:'Karşılaştırma işaretini seç.',complete:'Doğru!'}[phase];
 }
 A.classList.toggle('hidden',!readyToCompare()||phase==='complete'||locked);
 document.querySelector('.cross-equal').classList.toggle('hidden',mode!=='cross'&&mode!=='decimal');
 requestAnimationFrame(alignOperator);
}
async function action(el){
 if(locked||(phase==='complete'&&mode!=='mixed')||phase==='merged')return;
 const act=el.dataset.action,s=el.dataset.side,i=s==='L'?0:1;
 if(mode==='decimal'){
   if(act==='decimal-start'&&steps[i]===0){steps[i]=1;render();return;}
   if(act==='decimal-calc'&&steps[i]===1){steps[i]=2;render();return;}
   return;
 }else if(mode==='cross'){
   return;
 }else if(mode==='mixed'){
   if(act==='classify'  && steps[i]===0){steps[i]=1;render();return;}
   if(act==='middle-question' && steps.every(v=>v===1) && phase==='initial'){
     phase='selection';render();return;
   }
   if(act==='one' && phase==='bridge'){phase='selection';render();return;}
   if(act==='one' && phase==='complete'){
     locked=true;
     const middle=$('mixed-middle');
     const one=middle?.querySelector('[data-action="one"]');
     const leftSign=$('bridge-left'),rightSign=$('bridge-right');
     if(!one||!leftSign||!rightSign){phase='merged';locked=false;render();return;}
     one.classList.add('fading');
     const shift=(one.getBoundingClientRect().width+rightSign.getBoundingClientRect().width)/2;
     const a=leftSign.animate([{transform:'translateX(0)'},{transform:`translateX(${shift}px)`}],{duration:650,easing:'ease-in-out',fill:'forwards'});
     const b=rightSign.animate([{transform:'translateX(0)'},{transform:`translateX(${-shift}px)`}],{duration:650,easing:'ease-in-out',fill:'forwards'});
     Promise.allSettled([a.finished,b.finished]).then(()=>{if(phase!=='complete')return;phase='merged';locked=false;render();});
     return;
   }
 }else if(mode==='difference'){
   if(act==='difference'&&steps[i]===0){
     // İlk tıklamada ok yok; yalnızca pay − payda ifadesi görünür.
     steps[i]=1;render();return;
   }
   if(act==='subtract'&&steps[i]===1){
     // Fark zaten ±1 ise sadeleştirme tıklamasını atla.
     const delta=i===0?q.deltaLeft:q.deltaRight;
     steps[i]=Math.abs(delta)===1?3:2;render();return;
   }
   if(act==='strip'&&steps[i]===2 && steps.every(x=>x>=2)){
     locked=true;
     el.classList.add('vanishing');
     const snap=stamp;
     await new Promise(resolve=>setTimeout(resolve,380));
     if(snap!==stamp)return;
     steps[i]=3;locked=false;render();return;
   }
   if(act==='cross'&&steps[i]===3 && steps.every(x=>x>=3)){
     locked=true;
     const snap=stamp;
     const other=s==='L'?'R':'L';
     const target=document.querySelector(`[data-point="${other}-den"]`);
     await travelArrow(el,target,'#267a58',snap,'line');
     if(snap!==stamp)return;
     products[i]=(i===0?Math.sign(q.deltaLeft)*q.d:Math.sign(q.deltaRight)*q.b);
     steps[i]=4;locked=false;render();return;
   }
   // Son işareti öğrenci aşağıdaki seçeneklerden kendisi belirler.
 }else{
   if(phase==='initial'&&act==='den'){phase='factors';render()}
   else if(phase==='factors'&&act==='factor'){phase='multiplications';render()}
   else if(phase==='multiplications'&&act==='product'){
     denSolved.add(s);if(denSolved.size===4)phase='answer';render();
   }
 }
}
function transferSign(symbol){
 // İşaret taşınmaz: doğrudan kesir çizgilerinin ortak ekseninde belirir.
 O.textContent=symbol;
 O.classList.add('done');
 phase='complete';
 locked=false;
 render();
 requestAnimationFrame(alignOperator);
}
async function crossClick(group){
 if(mode!=='cross'||locked)return;
 const i=group==='ad'?0:1;
 if(crossDone[i])return;
 locked=true;crossHover=null;
 const source=document.querySelector(`[data-cross-point="${group==='ad'?'L-num':'R-num'}"]`);
 const target=document.querySelector(`[data-cross-point="${group==='ad'?'R-den':'L-den'}"]`);
 const currentStamp=stamp;
 await travelArrow(source,target,'#267a58',currentStamp,'line');
 if(stamp!==currentStamp)return;
 crossDone[i]=true;locked=false;
 render();
}
$('equation').addEventListener('pointerover',e=>{
 if(mode!=='cross'||locked)return;
 const el=e.target.closest('[data-cross]');
 const g=el?.dataset.cross||null;
 if(g!==crossHover){crossHover=g;document.querySelectorAll('[data-cross]').forEach(t=>t.classList.toggle('cross-glow',t.dataset.cross===g&&!!g&&!crossDone[g==='ad'?0:1]));}
});
$('equation').addEventListener('pointerleave',()=>{
 crossHover=null;
 document.querySelectorAll('[data-cross]').forEach(t=>t.classList.remove('cross-glow'));
});
$('equation').addEventListener('click',e=>{
 const crossed=e.target.closest('[data-cross]');
 if(crossed&&mode==='cross'){crossClick(crossed.dataset.cross);return;}
 const target=e.target.closest('[data-action]');if(target)action(target);
});
$('equation').addEventListener('keydown',e=>{if(mode==='cross'&&(e.key==='Enter'||e.key===' ')){const t=e.target.closest('[data-cross]');if(t){e.preventDefault();crossClick(t.dataset.cross)}}});
A.addEventListener('click',e=>{
 const el=e.target.closest('[data-answer]');if(!el||locked||!readyToCompare())return;
 const expected=mode==='cross'?sign(q.a*q.d,q.c*q.b):mode==='difference'?sign(products[0],products[1]):q.answer;
 if(el.dataset.answer!==expected){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');H.textContent='Tekrar dene.';return}
 locked=true;el.classList.add('correct');H.textContent='Doğru!';A.classList.add('hidden');fireworkBurst();
 const snapshot=stamp;
 if(mode==='cross'||mode==='decimal'){
   setTimeout(()=>{if(stamp===snapshot)transferSign(expected)},450);
 }else if(mode==='mixed'){
   setTimeout(()=>{if(stamp!==snapshot)return;phase='complete';locked=false;render();},450);
 }else if(mode==='difference'){
   // İşaret yalnızca son konumunda görünür.
   setTimeout(()=>{if(stamp===snapshot)transferSign(expected)},450);
 }else{
   O.textContent=expected;O.classList.add('done');
   setTimeout(()=>{if(stamp!==snapshot)return;phase='complete';locked=false;render()},600);
 }
});
$('new').addEventListener('click',generate);
document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{mode=el.dataset.mode;generate()}));
window.addEventListener('resize',()=>requestAnimationFrame(alignOperator));
$('home').addEventListener('click',()=>location.href='https://sinan-ipek.github.io/projeler/');
generate();
})();
